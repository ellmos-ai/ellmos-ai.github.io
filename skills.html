const SKILLS=[{"id": "assist:assist:buero", "name": "buero", "cat": "assist", "ver": "2.0.0", "status": "stable", "desc": "Ordnet Büroaufgaben, Korrespondenz und Fristen ohne Bindung an eine bestimmte Office-App.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: buero\nversion: 2.0.0\ntype: assist\nauthor: ellmos contributors\ncreated: 2026-07-30\nupdated: 2026-07-30\ndescription: >\n  Ordnet Büroaufgaben, Korrespondenz und Fristen ohne Bindung an eine bestimmte Office-App.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: assist\ntags: [office, planning, prioritization, correspondence]\nlanguage: de\nstatus: stable\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\nprovenance:\n  origin: public-neutral\n  origin_license: MIT\n  notes: Public core only; adapters and private profiles are excluded.\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"buero banner\">\n\n# Büro-Assistenz\n\n## Zweck\n\nAus unsortierten Bürothemen eine priorisierte, realistische Arbeitsübersicht erstellen.\n\n**Ergebnis:** Prioritäten, nächste Schritte, Zuständigkeiten und offene Rückfragen.\n\n## Arbeitsablauf\n\n1. Ziel, Kontext und gewünschtes Ausgabeformat klären.\n2. Nur die im aktuellen Auftrag bereitgestellten Informationen verwenden.\n3. Das Ergebnis strukturiert und nachvollziehbar erstellen.\n4. Annahmen kennzeichnen und vor externen Änderungen eine Bestätigung einholen.\n\n## Beispiel\n\n**Eingabe:** Sortiere diese fünf Aufgaben für den heutigen Arbeitstag.\n\n**Ergebnis:** Prioritäten, nächste Schritte, Zuständigkeiten und offene Rückfragen.\n\n## Öffentlicher Kern und private Erweiterungen\n\nDieser öffentliche Skill enthält ausschließlich die übertragbare Methode. App-spezifische Adapter, Konten, lokale Pfade, Datenbanken und persönliche Voreinstellungen gehören in ein privates Zusatzprofil oder einen privaten Fork und dürfen nicht in dieses Repository übernommen werden.\n\nOhne privates Profil arbeitet der Skill nur mit Informationen, die im aktuellen Auftrag ausdrücklich bereitgestellt wurden.\n\n## Grenzen und Datenschutz\n\n- Daten werden nicht standardmäßig gespeichert.\n- Keine Quelle, Datei oder Schnittstelle wird ohne ausdrückliche Freigabe geöffnet oder verändert.\n\n## Änderungsprotokoll\n\n### 2.0.0 (2026-07-30)\n\n- Nutzerneutraler öffentlicher Kern; private Integrationen und persönliche Profile entfernt.\n"}, {"id": "expert:assist:dev", "name": "dev", "cat": "assist", "ver": "0.1.0", "status": "active", "desc": "Developer assistant (ATI successor). Provides a quick project overview via headless scan and routes to the available coding tools: CodeCommander MCP (analysis/refactor/diagnose) and the ellmos-code-tools module. Pure tool routing + scan, no own store.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: dev\nversion: 0.1.0\ntype: expert\nauthor: ellmos\ncreated: 2026-06-22\nupdated: 2026-06-22\ndescription: Developer assistant (ATI successor). Provides a quick project overview via headless scan and routes to the available coding tools: CodeCommander MCP (analysis/refactor/diagnose) and the ellmos-code-tools module. Pure tool routing + scan, no own store.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: assist\ntags: [dev, coding, projekt-scan, ati, codecommander]\nlanguage: de\nstatus: active\ndependencies: {'tools': ['dev_core.py'], 'services': [], 'protocols': [], 'python': ['pathlib'], 'external': ['codecommander-mcp', 'ellmos-code-tools']}\nprovenance: {'origin': 'bach', 'origin_path': 'system/agents/ati/ + system/agents/entwickler/', 'origin_version': 'n/a', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-06-22', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"dev banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Dev — Developer Assistant (ATI) (Deutsch)\n\nGets an overview first, then hands off to the right tools.\n\n## Übersicht & Zweck\n\nSuccessor to BACH's ATI/entwickler agent. Two tasks:\n1. **Project scan** (headless, stdlib): fast, token-efficient overview of\n   structure, languages and build markers of a project — before expensive analysis runs.\n2. **Tool routing:** delegates to existing coding tools instead of duplicating them.\n\n## Triggers\n\n| User input | Action |\n|---|---|\n| \"Get an overview of project X\" | `dev_core.py scan <path>` |\n| \"What kind of project is this / which stack?\" | `dev_core.py scan <path>` |\n| \"Analyse this file / refactor\" | → CodeCommander MCP |\n| \"Generate/check Python code\" | → CodeCommander MCP / ellmos-code-tools |\n\n## Tool Landscape (Routing Targets)\n\n- **CodeCommander MCP** (`.AI/.MCP/ellmos-codecommander-mcp`): `cc_analyze_code`,\n  `cc_analyze_methods`, `cc_extract_classes`, `cc_diagnose_imports`,\n  `cc_runtime_import_diagnose`, `cc_generate_python_code`, `cc_check_indentation` etc.\n- **ellmos-code-tools** (`.AI/.MODULES/ellmos-code-tools`): CLI dev tools (Structural-Edit,\n  pycutter context, Method-Analyzer).\n- **FileCommander MCP**: File/directory operations over large trees.\n\n## CLI Entry Point (dev_core.py)\n\n```bash\npython dev_core.py scan .              # current project\npython dev_core.py scan /path/project  # structure + languages + markers\n```\n\nDetects e.g.: Python (pyproject/requirements/setup), Node/TypeScript, Rust, Go,\nJava, Roblox (Rojo), Docker, Git repo.\n\n## Store\n\nNo store. Pure scan + routing.\n\n## Attitude\n\nWe recommend CodeCommander/ellmos-code-tools as coding tools, but are open\nto others (e.g. ruff/pylint/eslint) if the user prefers them.\n\n## Privacy\n\n- `dev_core.py` only reads file/directory names (structure), no content, no upload.\n- Skipped: `.git`, `node_modules`, `.venv`, `__pycache__` etc.\n\n## Related Resources\n\n- `assist/AGENTS.md` — Umbrella router\n- `.AI/.MCP/ellmos-codecommander-mcp` · `.AI/.MODULES/ellmos-code-tools`\n\n## Änderungsprotokoll\n\n### 0.1.0 (2026-06-22)\n- Initial version. ATI/entwickler successor: headless project scan (stdlib) +\n  routing to CodeCommander MCP / ellmos-code-tools. User-neutral, no store."}, {"id": "skill:assist:dossier-briefing", "name": "dossier-briefing", "cat": "assist", "ver": "1.0.0", "status": "active", "desc": "Generates a structured research briefing for a topic or person as a Markdown scaffold (stdout or file). No persistent store.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: dossier-briefing\nversion: 1.0.0\ncategory: assist\ndescription: Generates a structured research briefing for a topic or person as a Markdown scaffold (stdout or file). No persistent store.\n\ntags: [briefing, dossier, recherche, markdown, research]\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\nlanguages: [de, en]\ndependencies: {'python': ['datetime', 'pathlib', 'textwrap']}\nruntime: python3\nentry_point: dossier_briefing_core.py\nprovenance: {'origin': 'BACH persoenlicher-assistent', 'origin_path': 'system/agents/persoenlicher-assistent/tools/dossier_generator.py', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'origin_license': 'MIT', 'last_sync_from_origin': '2026-06-22', 'last_sync_to_origin': None, 'local_changes_since_sync': 'Alle Origin-DB-Abhaengigkeiten entfernt (create_dossier, update_dossier, DOSSIERS_DIR, DossierGenerator-Klasse mit DB-Methoden). Nur _create_markdown-Logik portiert und verallgemeinert (Person→Subjekt). Kein Store. One-Shot-Scaffold-Generator. Headless, nur Stdlib.\\n'}\nlanguage: de\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"dossier-briefing banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Dossier-Briefing (Deutsch)\n\n**Structured research briefing for a topic or person**\n\n---\n\n## Übersicht & Zweck\n\nGenerates an empty, structured Markdown briefing for any subject\n(person, company, event, concept). The scaffold serves as a starting point for\nsubsequent research with `research-agent` or `web-reading`.\n\n---\n\n## Triggers\n\n| Phrase | Action |\n|---|---|\n| \"Create a briefing on Marie Curie\" | Scaffold: person, type=person |\n| \"Dossier on OpenAI\" | Scaffold: company, type=organization |\n| \"Briefing on quantum computing\" | Scaffold: topic, type=topic |\n| \"Prepare a research briefing on COP30\" | Scaffold: event, type=event |\n\n---\n\n## Workflow & Vorgehen\n\n1. **Name the subject:** Extract name/title of the briefing from the user input.\n2. **Detect type:** person, organization, topic, event (or unspecified).\n3. **Generate scaffold:** Create Markdown with all relevant sections.\n4. **Output:** stdout or optionally write to a file (`-o file.md`).\n5. **Start research:** Hand scaffold to `research-agent` or `web-reading`\n   to fill in missing sections.\n\n---\n\n## CLI\n\n```bash\n# Briefing to stdout (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python dossier_briefing_core.py \"Marie Curie\" --typ person\n\n# Write to file (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python dossier_briefing_core.py \"OpenAI\" --typ organization -o briefing_openai.md\n\n# Topic briefing (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python dossier_briefing_core.py \"Quantum computing\" --typ topic\n\n# Event (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python dossier_briefing_core.py \"COP30\" --typ event\n\n# Without type (generic) (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python dossier_briefing_core.py \"My topic\"\n\n# Help (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python dossier_briefing_core.py --help\n```\n\n---\n\n## Briefing Types and Sections\n\n| Type | Sections |\n|---|---|\n| `person` | Basic data, biography/background, work & contributions, sources, notes |\n| `organization` | Profile, history, products/services, key people, sources, notes |\n| `topic` | Overview, background/context, current developments, key sources, open questions, notes |\n| `event` | Key facts, participants, background/timeline, significance, sources, notes |\n| `unspecified` | Overview, background, details, sources, notes |\n\n---\n\n## Store\n\nNo persistent store. The scaffold is only output (stdout or file),\nnot stored in a database.\n\n---\n\n## Attitude\n\n- Always emphasise that the scaffold is empty and must be filled through research.\n- Never invent content or hallucinate — only provide structure.\n- Ask if the type is unclear or use `unspecified`.\n\n---\n\n## Privacy\n\nNo network access. No store. Purely local processing.\n\n---\n\n## Related Resources\n\n- `research-agent` — fills the briefing scaffold with research results\n- `web-reading` — reads web pages and extracts content for the briefing\n\n---\n\n## Änderungsprotokoll\n\n| Version | Date | Change |\n|---|---|---|\n| 1.0.0 | 2026-06-22 | Created from BACH dossier_generator.py v1.0.0; store removed, generalised |"}, {"id": "assist:assist:finanz-versicherung", "name": "finanz-versicherung", "cat": "assist", "ver": "2.0.0", "status": "stable", "desc": "Strukturiert bereitgestellte Finanz- und Versicherungsunterlagen als neutrale Übersicht und Checkliste.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: finanz-versicherung\nversion: 2.0.0\ntype: assist\nauthor: ellmos contributors\ncreated: 2026-07-30\nupdated: 2026-07-30\ndescription: >\n  Strukturiert bereitgestellte Finanz- und Versicherungsunterlagen als neutrale Übersicht und Checkliste.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: assist\ntags: [finance, insurance, documents, checklist]\nlanguage: de\nstatus: stable\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\nprovenance:\n  origin: public-neutral\n  origin_license: MIT\n  notes: Public core only; adapters and private profiles are excluded.\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"finanz-versicherung banner\">\n\n# Finanz- und Versicherungsübersicht\n\n## Zweck\n\nVerträge, Fristen, Unterlagen und Rückfragen verständlich ordnen, ohne Beratung oder Produktempfehlung.\n\n**Ergebnis:** Sachliche Übersicht, Fristenliste und Fragen für eine qualifizierte Beratung.\n\n## Arbeitsablauf\n\n1. Ziel, Kontext und gewünschtes Ausgabeformat klären.\n2. Nur die im aktuellen Auftrag bereitgestellten Informationen verwenden.\n3. Das Ergebnis strukturiert und nachvollziehbar erstellen.\n4. Annahmen kennzeichnen und vor externen Änderungen eine Bestätigung einholen.\n\n## Beispiel\n\n**Eingabe:** Erstelle aus diesen anonymisierten Vertragsdaten eine Verlängerungs-Checkliste.\n\n**Ergebnis:** Sachliche Übersicht, Fristenliste und Fragen für eine qualifizierte Beratung.\n\n## Öffentlicher Kern und private Erweiterungen\n\nDieser öffentliche Skill enthält ausschließlich die übertragbare Methode. App-spezifische Adapter, Konten, lokale Pfade, Datenbanken und persönliche Voreinstellungen gehören in ein privates Zusatzprofil oder einen privaten Fork und dürfen nicht in dieses Repository übernommen werden.\n\nOhne privates Profil arbeitet der Skill nur mit Informationen, die im aktuellen Auftrag ausdrücklich bereitgestellt wurden.\n\n## Grenzen und Datenschutz\n\n- Daten werden nicht standardmäßig gespeichert.\n- Keine Quelle, Datei oder Schnittstelle wird ohne ausdrückliche Freigabe geöffnet oder verändert.\n- Der Skill ersetzt keine Finanz-, Steuer-, Rechts- oder Versicherungsberatung.\n\n## Änderungsprotokoll\n\n### 2.0.0 (2026-07-30)\n\n- Nutzerneutraler öffentlicher Kern; private Integrationen und persönliche Profile entfernt.\n"}, {"id": "assist:assist:formbuilder-reader", "name": "formbuilder-reader", "cat": "assist", "ver": "2.0.0", "status": "stable", "desc": "Prüft bereitgestellte Formularbeschreibungen auf Struktur, Validierung, Verständlichkeit und Barrierefreiheit.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: formbuilder-reader\nversion: 2.0.0\ntype: a export, stock, analysis]\nlanguage: de\nstatus: stable\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\nprovenance:\n  origin: public-neutral\n  origin_license: MIT\n  notes: Public core only; adapters and private profiles are excluded.\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"hauslagerist-reader banner\">\n\n# Bestandsdaten-Leser\n\n## Zweck\n\nBestände, Lagerorte, Mindestmengen und Unstimmigkeiten nachvollziehbar auswerten.\n\n**Ergebnis:** Bestandsübersicht, Fehlmengen, Dubletten und Klärungsbedarf.\n\n## Arbeitsablauf\n\n1. Ziel, Kontext und gewünschtes Ausgabeformat klären.\n2. Nur die im aktuellen Auftrag bereitgestellten Informationen verwenden.\n3. Das Ergebnis strukturiert und nachvollziehbar erstellen.\n4. Annahmen kennzeichnen und vor externen Änderungen eine Bestätigung einholen.\n\n## Beispiel\n\n**Eingabe:** Analysiere diese CSV-Liste auf Fehlbestände und doppelte Einträge.\n\n**Ergebnis:** Bestandsübersicht, Fehlmengen, Dubletten und Klärungsbedarf.\n\n## Öffentlicher Kern und private Erweiterungen\n\nDieser öffentliche Skill enthält ausschließlich die übertragbare Methode. App-spezifische Adapter, Konten, lokale Pfade, Datenbanken und persönliche Voreinstellungen gehören in ein privates Zusatzprofil oder einen privaten Fork und dürfen nicht in dieses Repository übernommen werden.\n\nOhne privates Profil arbeitet der Skill nur mit Informationen, die im aktuellen Auftrag ausdrücklich bereitgestellt wurden.\n\n## Grenzen und Datenschutz\n\n- Daten werden nicht standardmäßig gespeichert.\n- Keine Quelle, Datei oder Schnittstelle wird ohne ausdrückliche Freigabe geöffnet oder verändert.\n\n## Änderungsprotokoll\n\n### 2.0.0 (2026-07-30)\n\n- Nutzerneutraler öffentlicher Kern; private Integrationen und persönliche Profile entfernt.\n"}, {"id": "assist:assist:kalender", "name": "kalender", "cat": "assist", "ver": "0.1.0", "status": "stable", "desc": "Calendar skill with user-adaptive backend selection (Flag 3). Default: local SQLite store. Optional: Google Calendar MCP, Routinika or UpToday as backend — controlled via assist/prefs.json. Without preference the LLM asks the user interactively.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: kalender\nversion: 0.1.0\ntype: assist\nauthor: ellmos-ai\ncreated: 2026-06-22\nupdated: 2026-06-22\ndescription: Calendar skill with user-adaptive backend selection (Flag 3). Default: local SQLite store. Optional: Google Calendar MCP, Routinika or UpToday as backend — controlled via assist/prefs.json. Without preference the LLM asks the user interactively.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: assist\ntags: [kalender, termine, events, ics, google-calendar, routinika]\nlanguage: de\nstatus: stable\ndependencies: {'tools': [], 'services': [{'name': 'Google Calendar MCP', 'optional': True, 'purpose': 'Backend option when kalender_backend=google in prefs.json'}], 'protocols': [{'name': 'ICS / iCalendar', 'optional': True, 'purpose': 'Import/export of appointments (RFC 5545 subset)'}], 'python': []}\nprovenance: {'origin': 'eigenentwurf', 'origin_path': '', 'origin_version': '', 'origin_repo': '', 'origin_license': 'MIT', 'last_sync_from_origin': '', 'notes': 'Kein BACH-Origin gefunden (kein kalender-Service in BACH/system/). Skill vollständig neu konzipiert mit Flag-3-Logik (user-adaptive backend). ICS-Felder angelehnt an RFC 5545, kein externer ICS-Parser benötigt.\\n'}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"kalender banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n## Übersicht & Zweck\n\nCapture, query and manage appointments — with a selectable backend. The core\n(`kalender_core.py`) always uses the **local SQLite store** as the default.\nThe LLM selects an alternative backend from `assist/prefs.json` if needed.\n\n**Flag 3 — Backend selection:**\n\n| `kalender_backend` in prefs.json | Behaviour |\n|---|---|\n| `local` (default) | SQLite store in this skill folder |\n| `google` | Google Calendar MCP (LLM path only, not in core.py) |\n| `routinika` | Routinika calendar via module-installer (not impl. v0.1) |\n| `uptoday` | UpToday calendar via module-installer (not impl. v0.1) |\n| not set | LLM asks the user interactively for preferred backend |\n\n> `kalender_core.py` implements the `local` backend exclusively.\n> Google Calendar MCP and further backends are LLM-driven and are\n> documented in SKILL.md, not in the core.\n\n---\n\n## Triggers\n\n| Phrase | Action |\n|---|---|\n| \"Add an appointment\" | Capture a new appointment |\n| \"What is on today?\" | Query today's appointments |\n| \"What is on this week?\" | 7-day overview |\n| \"Appointment [title] on [date]\" | Create appointment with date |\n| \"All appointments in [month]\" | Monthly overview |\n| \"Delete appointment [ID]\" | Remove appointment |\n| \"Export appointment\" | ICS export of all/individual appointments |\n\n---\n\n## Workflow & Vorgehen\n\n1. **Check backend**: read `assist/prefs.json` → `kalender_backend`.\n2. **Without preference**: LLM asks user: local calendar, Google Calendar or other?\n3. **Local backend**: core.py — create/query/delete appointment in SQLite store.\n4. **Google backend**: LLM calls Google Calendar MCP directly (core.py not involved).\n5. **Output**: Readable appointment list or confirmation.\n\n---\n\n## CLI Entry Point\n\n```bash\n# Create appointment (Deutsch)\npython kalender_core.py add \"Dentist\" --date 2026-07-01 --time 10:00 [--duration 60] [--location \"Dr. X practice\"]\n\n# Today's appointments (Deutsch)\npython kalender_core.py today\n\n# Weekly overview (Deutsch)\npython kalender_core.py week [--from 2026-06-22]\n\n# Monthly overview (Deutsch)\npython kalender_core.py month [--month 2026-07]\n\n# All appointments (optionally with search term) (Deutsch)\npython kalender_core.py list [--search \"Dentist\"] [--limit 50]\n\n# Delete appointment (Deutsch)\npython kalender_core.py delete <id>\n\n# ICS export (Deutsch)\npython kalender_core.py export [--id <id>] [--out calendar.ics]\n\n# Backend check (Deutsch)\npython kalender_core.py check-backend\n\n# Alternative store (e.g. for tests) (Deutsch)\npython kalender_core.py --store /tmp/kal_test.db today --dry-run\n```\n\n---\n\n## Store\n\n| Property | Value |\n|---|---|\n| Type | SQLite (local backend) |\n| Path (default) | `skills/assist/kalender/store.db` |\n| Override | `--store <path>` or env `KALENDER_STORE` |\n| Tables | `events` |\n\n### Schema\n\n```sql\nCREATE TABLE IF NOT EXISTS events (\n    id           TEXT PRIMARY KEY,      -- UUID (short: 8 hex)\n    title        TEXT NOT NULL,         -- appointment name\n    date         TEXT NOT NULL,         -- ISO date YYYY-MM-DD\n    time         TEXT,                  -- HH:MM (optional)\n    duration_min INTEGER,               -- duration in minutes (optional)\n    location     TEXT,                  -- location (optional)\n    description  TEXT,                  -- note/description\n    recurrence   TEXT,                  -- ICS RRULE (optional, e.g. \"FREQ=WEEKLY\")\n    ics_uid      TEXT UNIQUE,           -- ICS UID for import/export\n    created_at   TEXT NOT NULL,\n    updated_at   TEXT NOT NULL\n);\n```\n\n---\n\n## Attitude\n\n- The core implements only the `local` backend — lightweight, no external dependencies.\n- ICS export generates a valid RFC 5545 subset (VCALENDAR + VEVENT), importable into all common calendar apps.\n- ICS import (parsing) is not yet implemented in v0.1 — planned for v0.2.\n- Recurrence rules (`recurrence`/RRULE) are stored but not evaluated — evaluation is v0.2.\n\n---\n\n## Privacy\n\n- Local appointments stay in `store.db` — no network access in the core.\n- When using the Google Calendar backend, Google Calendar MCP processes the data — Google's privacy policy applies.\n- Do not commit `store.db` to Git (recommended: `.gitignore`).\n\n---\n\n## Related Resources\n\n- Google Calendar MCP (`mcp__claude_ai_Google_Calendar__*`) — alternative backend, LLM-driven\n- Skill `assist/haushalt-manager` — Routinika integration (presence check pattern)\n- `tools/module-installer/module_installer.py` — for future Routinika/UpToday backend integration\n\n---\n\n## Änderungsprotokoll\n\n| Version | Date | Change |\n|---|---|---|\n| 0.1.0 | 2026-06-22 | Initial creation — Flag-3 logic, local backend, ICS export |"}, {"id": "assist:assist:kontaktbuch", "name": "kontaktbuch", "cat": "assist", "ver": "2.0.0", "status": "stable", "desc": "Ordnet freiwillig bereitgestellte Kontaktdaten datensparsam und erkennt mögliche Dubletten.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: kontaktbuch\nversion: 2.0.0\ntype: assist\nauthor: ellmos contributors\ncreated: 2026-07-30\nupdated: 2026-07-30\ndescription: >\n  Ordnet freiwillig bereitgestellte Kontaktdaten datensparsam und erkennt mögliche Dubletten.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: assist\ntags: [contacts, organization, deduplication, privacy]\nlanguage: de\nstatus: stable\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\nprovenance:\n  origin: public-neutral\n  origin_license: MIT\n  notes: Public core only; adapters and private profiles are excluded.\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"kontaktbuch banner\">\n\n# Kontaktübersicht\n\n## Zweck\n\nKontakte für einen konkreten Auftrag strukturieren, ohne ein persönliches Adressbuch mitzuliefern.\n\n**Ergebnis:** Normalisierte Felder, mögliche Dubletten und fehlende Angaben.\n\n## Arbeitsablauf\n\n1. Ziel, Kontext und gewünschtes Ausgabeformat klären.\n2. Nur die im aktuellen Auftrag bereitgestellten Informationen verwenden.\n3. Das Ergebnis strukturiert und nachvollziehbar erstellen.\n4. Annahmen kennzeichnen und vor externen Änderungen eine Bestätigung einholen.\n\n## Beispiel\n\n**Eingabe:** Prüfe diese anonymisierte Kontaktliste auf Dubletten.\n\n**Ergebnis:** Normalisierte Felder, mögliche Dubletten und fehlende Angaben.\n\n## Öffentlicher Kern und private Erweiterungen\n\nDieser öffentliche Skill enthält ausschließlich die übertragbare Methode. App-spezifische Adapter, Konten, lokale Pfade, Datenbanken und persönliche Voreinstellungen gehören in ein privates Zusatzprofil oder einen privaten Fork und dürfen nicht in dieses Repository übernommen werden.\n\nOhne privates Profil arbeitet der Skill nur mit Informationen, die im aktuellen Auftrag ausdrücklich bereitgestellt wurden.\n\n## Grenzen und Datenschutz\n\n- Daten werden nicht standardmäßig gespeichert.\n- Keine Quelle, Datei oder Schnittstelle wird ohne ausdrückliche Freigabe geöffnet oder verändert.\n\n## Änderungsprotokoll\n\n### 2.0.0 (2026-07-30)\n\n- Nutzerneutraler öffentlicher Kern; private Integrationen und persönliche Profile entfernt.\n"}, {"id": "skill:assist:location-suche", "name": "location-suche", "cat": "assist", "ver": "1.0.0", "status": "active", "desc": "Location, restaurant and hotel search via OpenStreetMap (Nominatim + Overpass API). Returns POIs (Points of Interest) near a location or searches by free text.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: location-suche\nversion: 1.0.0\ncategory: assist\ndescription: Location, restaurant and hotel search via OpenStreetMap (Nominatim + Overpass API). Returns POIs (Points of Interest) near a location or searches by free text.\n\ntags: [location, openstreetmap, poi, nominatim, overpass, restaurant, hotel]\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\nlanguages: [de, en]\ndependencies: {'python': ['urllib.request', 'urllib.parse', 'urllib.error', 'json', 'time']}\nruntime: python3\nentry_point: location_suche_core.py\nprovenance: {'origin': 'BACH persoenlicher-assistent', 'origin_path': 'system/agents/persoenlicher-assistent/tools/location_search.py', 'origin_version': '1.1.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'origin_license': 'MIT', 'last_sync_from_origin': '2026-06-22', 'last_sync_to_origin': None, 'local_changes_since_sync': 'Alle Origin-DB-Abhaengigkeiten entfernt (save_location, list_locations, _ensure_table, _get_db). Kein Store. Userneutral (keine privaten Pfade). Headless, nur Stdlib.\\n'}\nlanguage: de\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"location-suche banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Location Search (Deutsch)\n\n**Location, restaurant and hotel search via OpenStreetMap**\n\n---\n\n## Übersicht & Zweck\n\nSearches for restaurants, hotels, cafes and other places using the\nOpenStreetMap services Nominatim (geocoding) and Overpass (POI search).\nNo API key required. No persistent store.\n\n---\n\n## Triggers\n\n| Phrase | Action |\n|---|---|\n| \"Find a restaurant in Munich\" | POI search: category=restaurant, near=Munich |\n| \"Hotels near Vienna\" | POI search: category=hotel, near=Vienna |\n| \"Where is the Eiffel Tower?\" | Nominatim free-text search |\n| \"Find cafes in Berlin\" | POI search: category=cafe, near=Berlin |\n| \"Search for pharmacy near Potsdam\" | POI search: category=pharmacy, near=Potsdam |\n\n---\n\n## Workflow & Vorgehen\n\n1. **Detect trigger:** Does the request contain a category (restaurant, hotel etc.)\n   and a location → step 2. Otherwise free text → step 4.\n2. **Geocode location:** Nominatim provides coordinates for the named location.\n3. **Search POIs:** Overpass API searches for venues of the category within radius.\n4. **Display result:** List with name, address, distance (m).\n5. **Free-text search (fallback):** Nominatim free-text provides direct hits.\n\n---\n\n## CLI\n\n```bash\n# POI search (category + location) (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python location_suche_core.py restaurant München\n\n# Geocode location (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python location_suche_core.py --geocode \"Brandenburg Gate Berlin\"\n\n# Adjust radius (default: 1000 m) (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python location_suche_core.py hotel Wien --radius 2000\n\n# Help (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python location_suche_core.py --help\n```\n\n---\n\n## Store\n\nNo persistent store. Results are only displayed, not saved.\n\n---\n\n## Supported Categories\n\nrestaurant, cafe, bar, pub, fast_food, hotel, hostel, guest_house, supermarket,\npharmacy, hospital, bank, atm, fuel, parking, bus_stop, train_station, museum,\ncinema, theatre, library, school, university, church\n\n---\n\n## Attitude\n\n- Always ask the user for a location if none was given.\n- With more than 10 results only show the 5 nearest, rest on request.\n- State distance in metres, from 1 km in km (1 decimal place).\n- Privacy: no location data is stored or transmitted except to the\n  public Nominatim/Overpass API (openstreetmap.org).\n\n---\n\n## Privacy\n\nSearch requests go to `nominatim.openstreetmap.org` and `overpass-api.de`.\nNo login, no API key, no persistent data storage.\nUser-Agent is set according to Nominatim policy.\n\n---\n\n## Related Resources\n\n- `reiseroute` — route planning from A to B (also uses Nominatim for geocoding)\n- `wetter` — weather at current location\n\n---\n\n## Änderungsprotokoll\n\n| Version | Date | Change |\n|---|---|---|\n| 1.0.0 | 2026-06-22 | Created from BACH location_search.py v1.1.0; store removed |"}, {"id": "assist:assist:mediabrain-reader", "name": "mediabrain-reader", "cat": "assist", "ver": "2.0.0", "status": "stable", "desc": "Analysiert bereitgestellte Medienlisten und Metadaten unabhängig von einer bestimmten Medien-App.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: mediabrain-reader\nversion: 2.0.0\ntype: assist\nauthor: ellmos contributors\ncreated: 2026-07-30\nupdated: 2026-07-30\ndescription: >\n  Analysiert bereitgestellte Medienlisten und Metadaten unabhängig von einer bestimmten Medien-App.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: assist\ntags: [media, catalog, metadata, export]\nlanguage: de\nstatus: stable\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\nprovenance:\n  origin: public-neutral\n  origin_license: MIT\n  notes: Public core only; adapters and private profiles are excluded.\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"mediabrain-reader banner\">\n\n# Medienkatalog-Leser\n\n## Zweck\n\nMedienbestände nach Typ, Status, Thema oder Dubletten auswerten.\n\n**Ergebnis:** Katalogübersicht, Qualitätsprobleme und konkrete Such- oder Bereinigungsvorschläge.\n\n## Arbeitsablauf\n\n1. Ziel, Kontext und gewünschtes Ausgabeformat klären.\n2. Nur die im aktuellen Auftrag bereitgestellten Informationen verwenden.\n3. Das Ergebnis strukturiert und nachvollziehbar erstellen.\n4. Annahmen kennzeichnen und vor externen Änderungen eine Bestätigung einholen.\n\n## Beispiel\n\n**Eingabe:** Fasse diesen JSON-Medienexport nach Typ und Status zusammen.\n\n**Ergebnis:** Katalogübersicht, Qualitätsprobleme und konkrete Such- oder Bereinigungsvorschläge.\n\n## Öffentlicher Kern und private Erweiterungen\n\nDieser öffentliche Skill enthält ausschließlich die übertragbare Methode. App-spezifische Adapter, Konten, lokale Pfade, Datenbanken und persönliche Voreinstellungen gehören in ein privates Zusatzprofil oder einen privaten Fork und dürfen nicht in dieses Repository übernommen werden.\n\nOhne privates Profil arbeitet der Skill nur mit Informationen, die im aktuellen Auftrag ausdrücklich bereitgestellt wurden.\n\n## Grenzen und Datenschutz\n\n- Daten werden nicht standardmäßig gespeichert.\n- Keine Quelle, Datei oder Schnittstelle wird ohne ausdrückliche Freigabe geöffnet oder verändert.\n\n## Änderungsprotokoll\n\n### 2.0.0 (2026-07-30)\n\n- Nutzerneutraler öffentlicher Kern; private Integrationen und persönliche Profile entfernt.\n"}, {"id": "assist:assist:medizin-daten", "name": "medizin-daten", "cat": "assist", "ver": "0.1.0", "status": "stable", "desc": "Local, private capture of medical data: diagnoses, symptom histories and examination plans. No BACH origin — custom design with its own SQLite store. Strictly local, no cloud transfer.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: medizin-daten\nversion: 0.1.0\ntype: assist\nauthor: ellmos-ai\ncreated: 2026-06-22\nupdated: 2026-06-22\ndescription: Local, private capture of medical data: diagnoses, symptom histories and examination plans. No BACH origin — custom design with its own SQLite store. Strictly local, no cloud transfer.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: assist\ntags: [medizin, diagnose, symptome, gesundheit, privat, lokal]\nlanguage: de\nstatus: stable\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'eigenentwurf', 'origin_path': '', 'origin_version': '', 'origin_repo': '', 'origin_license': 'MIT', 'last_sync_from_origin': '', 'notes': 'Kein BACH-Origin. Skill vollständig neu konzipiert. Kein bestehendes Implementierungs-Vorbild im Ökosystem gefunden.\\n'}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"medizin-daten banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n## Übersicht & Zweck\n\nSecurely and locally capture personal medical data: diagnoses (ICD-10 code\noptional), symptom histories with date series and examination plans. All\ndata stays exclusively local in `medizin-daten/store.db`.\n\nThe skill does not replace medical consultation and makes no medical\nstatements — it is a structured notebook for personal health data.\n\n---\n\n## Triggers\n\n| Phrase | Action |\n|---|---|\n| \"Record a diagnosis\" | Create new diagnosis |\n| \"Add diagnosis [name]\" | Create named diagnosis |\n| \"Symptom history\" | Record today's symptoms |\n| \"Record symptom [name]\" | Log a single symptom |\n| \"Examination plan\" | Show upcoming appointments/examinations |\n| \"Add appointment\" | Enter examination appointment |\n| \"Show my diagnoses\" | Output diagnosis list |\n\n---\n\n## Workflow & Vorgehen\n\n1. **Detect mode**: diagnosis / symptom / examination plan\n2. **Structure input**: date, name, notes, optional ICD-10 code\n3. **Save**: into `store.db` (local, no network access)\n4. **Output**: readable summary for LLM context\n\n---\n\n## CLI Entry Point\n\n```bash\n# Create diagnosis (Deutsch)\npython medizin_daten_core.py add-diagnosis \"Hypertension\" [--icd I10] [--note \"note\"]\n\n# List diagnoses (Deutsch)\npython medizin_daten_core.py diagnoses\n\n# Record symptom (Deutsch)\npython medizin_daten_core.py add-symptom \"Headache\" [--severity 7] [--date 2026-06-22] [--note \"...\"]\n\n# Symptom history for a name (Deutsch)\npython medizin_daten_core.py symptom-history \"Headache\" [--limit 30]\n\n# Plan examination (Deutsch)\npython medizin_daten_core.py add-exam \"Blood count\" [--date 2026-07-01] [--note \"fasting\"]\n\n# Upcoming examinations (Deutsch)\npython medizin_daten_core.py exams [--upcoming]\n\n# Alternative store (e.g. for tests) (Deutsch)\npython medizin_daten_core.py --store /tmp/med_test.db diagnoses --dry-run\n```\n\n---\n\n## Store\n\n| Property | Value |\n|---|---|\n| Type | SQLite |\n| Path (default) | `skills/assist/medizin-daten/store.db` |\n| Override | `--store <path>` or env `MEDIZIN_STORE` |\n| Tables | `diagnoses`, `symptoms`, `examination_plans` |\n\n### Schema\n\n```sql\nCREATE TABLE IF NOT EXISTS diagnoses (\n    id          TEXT PRIMARY KEY,     -- UUID (short: 8 hex)\n    name        TEXT NOT NULL,        -- name (e.g. \"Hypertension\")\n    icd_code    TEXT,                 -- ICD-10 code optional (e.g. \"I10\")\n    onset_date  TEXT,                 -- onset (ISO-8601, optional)\n    status      TEXT DEFAULT 'aktiv', -- aktiv | remission | abgeschlossen\n    note        TEXT,                 -- free-text note\n    created_at  TEXT NOT NULL,\n    updated_at  TEXT NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS symptoms (\n    id           TEXT PRIMARY KEY,\n    diagnosis_id TEXT REFERENCES diagnoses(id),  -- optional: assignment\n    name         TEXT NOT NULL,       -- name (e.g. \"Headache\")\n    severity     INTEGER,             -- 1–10 scale (optional)\n    recorded_at  TEXT NOT NULL,       -- ISO-8601 timestamp\n    note         TEXT\n);\n\nCREATE TABLE IF NOT EXISTS examination_plans (\n    id           TEXT PRIMARY KEY,\n    diagnosis_id TEXT REFERENCES diagnoses(id),  -- optional: assignment\n    exam_name    TEXT NOT NULL,       -- examination name\n    planned_date TEXT,                -- planned date (ISO-8601)\n    done_date    TEXT,                -- completed on (NULL = pending)\n    note         TEXT,\n    created_at   TEXT NOT NULL\n);\n```\n\n---\n\n## Attitude\n\n- No medical recommendations, no diagnosis by the skill.\n- ICD-10 codes are stored as free text — no validation against an external database.\n- Severity scale 1–10 is user-subjective.\n- Missing values (date, severity) are always allowed — the notebook principle applies.\n\n---\n\n## Privacy (Privacy Gate)\n\n> **WARNING: Medical data is particularly sensitive.**\n\n- `store.db` contains highly sensitive health data — **never commit to Git**.\n- **No network access** — all operations run entirely locally.\n- **No sharing** with external services, no sync with cloud backends.\n- Backup recommendation: encrypted local backup (e.g. `age`/`gpg`).\n- The skill checks at startup whether `store.db` is outside the local file system\n  and issues a warning if the path is in a sync folder (OneDrive etc.).\n- `~/.gitignore_global` or local `.gitignore` should exclude `store.db`.\n\n---\n\n## Related Resources\n\n- Skill `assist/gesundheit` — general health assistance (not medical data)\n- MediPlaner (`tools/module-installer` → `mediplaner`) — medication management (separate programme)\n\n---\n\n## Änderungsprotokoll\n\n| Version | Date | Change |\n|---|---|---|\n| 0.1.0 | 2026-06-22 | Initial creation — custom design, privacy gate, 3-table schema |"}, {"id": "assist:assist:notizblock", "name": "notizblock", "cat": "assist", "ver": "2.0.0", "status": "stable", "desc": "Erfasst, ordnet und verdichtet bereitgestellte Notizen ohne Bindung an einen Speicherort oder eine Notiz-App.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: notizblock\nversion: 2.0.0\ntype: assist\nauthor: ellmos contributors\ncreated: 2026-07-30\nupdated: 2026-07-30\ndescription: >\n  Erfasst, ordnet und verdichtet bereitgestellte Notizen ohne Bindung an einen Speicherort oder eine Notiz-App.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: assist\ntags: [notes, capture, summarize, organize]\nlanguage: de\nstatus: stable\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\nprovenance:\n  origin: public-neutral\n  origin_license: MIT\n  notes: Public core only; adapters and private profiles are excluded.\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"notizblock banner\">\n\n# Notizhilfe\n\n## Zweck\n\nLose Gedanken in auffindbare Themen, Aufgaben und Entscheidungen überführen.\n\n**Ergebnis:** Strukturierte Notiz mit Schlagwörtern, Aufgaben und offenen Punkten.\n\n## Arbeitsablauf\n\n1. Ziel, Kontext und gewünschtes Ausgabeformat klären.\n2. Nur die im aktuellen Auftrag bereitgestellten Informationen verwenden.\n3. Das Ergebnis strukturiert und nachvollziehbar erstellen.\n4. Annahmen kennzeichnen und vor externen Änderungen eine Bestätigung einholen.\n\n## Beispiel\n\n**Eingabe:** Ordne diese Gesprächsnotizen nach Themen und nächsten Schritten.\n\n**Ergebnis:** Strukturierte Notiz mit Schlagwörtern, Aufgaben und offenen Punkten.\n\n## Öffentlicher Kern und private Erweiterungen\n\nDieser öffentliche Skill enthält ausschließlich die übertragbare Methode. App-spezifische Adapter, Konten, lokale Pfade, Datenbanken und persönliche Voreinstellungen gehören in ein privates Zusatzprofil oder einen privaten Fork und dürfen nicht in dieses Repository übernommen werden.\n\nOhne privates Profil arbeitet der Skill nur mit Informationen, die im aktuellen Auftrag ausdrücklich bereitgestellt wurden.\n\n## Grenzen und Datenschutz\n\n- Daten werden nicht standardmäßig gespeichert.\n- Keine Quelle, Datei oder Schnittstelle wird ohne ausdrückliche Freigabe geöffnet oder verändert.\n\n## Änderungsprotokoll\n\n### 2.0.0 (2026-07-30)\n\n- Nutzerneutraler öffentlicher Kern; private Integrationen und persönliche Profile entfernt.\n"}, {"id": "skill:assist:reiseroute", "name": "reiseroute", "cat": "assist", "ver": "1.0.0", "status": "active", "desc": "Route planning from A to B via OSRM (Open Source Routing Machine). Supports car, bicycle and pedestrian. No API key required.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: reiseroute\nversion: 1.0.0\ncategory: assist\ndescription: Route planning from A to B via OSRM (Open Source Routing Machine). Supports car, bicycle and pedestrian. No API key required.\n\ntags: [routing, navigation, osrm, openstreetmap, reise]\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\nlanguages: [de, en]\ndependencies: {'python': ['urllib.request', 'urllib.parse', 'urllib.error', 'json']}\nruntime: python3\nentry_point: reiseroute_core.py\nprovenance: {'origin': 'BACH hub routing-service', 'origin_path': 'system/hub/_services/routing/routing_service.py', 'origin_version': '1.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'origin_license': 'MIT', 'last_sync_from_origin': '2026-06-22', 'last_sync_to_origin': None, 'local_changes_since_sync': 'urllib.parse-Import an den Kopf verschoben (war im Original nur im else-Zweig). geocode_place (Nominatim) integriert. Keine Origin-DB. Kein Store. Userneutral, headless, nur Stdlib.\\n'}\nlanguage: de\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"reiseroute banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Travel Route (Deutsch)\n\n**Route planning via OSRM (Open Source Routing Machine)**\n\n---\n\n## Übersicht & Zweck\n\nPlans routes between two locations (names or coordinates) via the public\nOSRM service (`router.project-osrm.org`). Returns distance, travel time and\nmode of transport. No API key, no account required.\n\n---\n\n## Triggers\n\n| Phrase | Action |\n|---|---|\n| \"Plan the route from Berlin to Hamburg\" | Car route, geocode place names |\n| \"How long does the drive from Munich to Vienna take by car?\" | Car route + time |\n| \"Cycle route from Potsdam to Berlin\" | Bicycle mode |\n| \"Walk from Kreuzberg to Mitte, Berlin\" | Pedestrian mode |\n| \"Route from 52.52,13.41 to 53.55,9.99\" | Direct coordinates |\n\n---\n\n## Workflow & Vorgehen\n\n1. **Extract start and destination** from the user input.\n2. **Detect mode:** car (default), bicycle, foot.\n3. **Geocode:** place names → coordinates via Nominatim.\n4. **Query OSRM:** returns distance (km) + duration (formatted).\n5. **Output result:** concise text summary.\n\n---\n\n## CLI\n\n```bash\n# Car route between two places (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python reiseroute_core.py \"Berlin\" \"Hamburg\"\n\n# Bicycle (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python reiseroute_core.py \"Potsdam\" \"Berlin\" --modus fahrrad\n\n# On foot (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python reiseroute_core.py \"Kreuzberg, Berlin\" \"Mitte, Berlin\" --modus fuss\n\n# Coordinates directly (lat,lon) (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python reiseroute_core.py \"52.5200,13.4050\" \"53.5500,9.9937\"\n\n# JSON output (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python reiseroute_core.py \"Munich\" \"Vienna\" --json\n\n# Help (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python reiseroute_core.py --help\n```\n\n---\n\n## Modes\n\n| Mode | Alias | OSRM profile |\n|---|---|---|\n| auto (default) | car, pkw, fahren | driving |\n| fahrrad | bike, rad, radfahren | cycling |\n| fuss | foot, laufen, gehen, zu fuss | foot |\n\n---\n\n## Store\n\nNo persistent store. Routes are not saved.\n\n---\n\n## Attitude\n\n- Always name start and destination before calculating.\n- Clarify if a place is ambiguous (e.g. \"Vienna\" = Austria or a city of the same name?).\n- Note: OSRM provides the fastest route without real-time traffic.\n- Issue a note for very long pedestrian routes (> 20 km).\n\n---\n\n## Privacy\n\nRequests go to `nominatim.openstreetmap.org` (geocoding) and\n`router.project-osrm.org` (routing). No login, no API key,\nno persistent data storage.\n\n---\n\n## Related Resources\n\n- `location-suche` — POI search (also uses Nominatim)\n- `wetter` — weather at the destination\n\n---\n\n## Änderungsprotokoll\n\n| Version | Date | Change |\n|---|---|---|\n| 1.0.0 | 2026-06-22 | Created from BACH routing_service.py v1.0; geocoding integrated |"}, {"id": "assist:assist:rpg", "name": "rpg", "cat": "assist", "ver": "2.0.0", "status": "stable", "desc": "Unterstützt systemneutral bei Abenteuern, Szenen, Figuren und Kampagnenorganisation.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: rpg\nversion: 2.0.0\ntype: assist\nauthor: ellmos contributors\ncreated: 2026-07-30\nupdated: 2026-07-30\ndescription: >\n  Unterstützt systemneutral bei Abenteuern, Szenen, Figuren und Kampagnenorganisation.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: assist\ntags: [rpg, tabletop, campaign, storytelling]\nlanguage: de\nstatus: stable\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\nprovenance:\n  origin: public-neutral\n  origin_license: MIT\n  notes: Public core only; adapters and private profiles are excluded.\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"rpg banner\">\n\n# Pen-&-Paper-Rollenspielhilfe\n\n## Zweck\n\nSpielleitungen und Gruppen mit konsistenten, anpassbaren Entwürfen unterstützen.\n\n**Ergebnis:** Szenenentwurf, NSC-Motive, Konflikte, Hinweise und optionale Varianten.\n\n## Arbeitsablauf\n\n1. Ziel, Kontext und gewünschtes Ausgabeformat klären.\n2. Nur die im aktuellen Auftrag bereitgestellten Informationen verwenden.\n3. Das Ergebnis strukturiert und nachvollziehbar erstellen.\n4. Annahmen kennzeichnen und vor externen Änderungen eine Bestätigung einholen.\n\n## Beispiel\n\n**Eingabe:** Entwirf eine kurze Hafenszene mit zwei Hinweisen und einer Komplikation.\n\n**Ergebnis:** Szenenentwurf, NSC-Motive, Konflikte, Hinweise und optionale Varianten.\n\n## Öffentlicher Kern und private Erweiterungen\n\nDieser öffentliche Skill enthält ausschließlich die übertragbare Methode. App-spezifische Adapter, Konten, lokale Pfade, Datenbanken und persönliche Voreinstellungen gehören in ein privates Zusatzprofil oder einen privaten Fork und dürfen nicht in dieses Repository übernommen werden.\n\nOhne privates Profil arbeitet der Skill nur mit Informationen, die im aktuellen Auftrag ausdrücklich bereitgestellt wurden.\n\n## Grenzen und Datenschutz\n\n- Daten werden nicht standardmäßig gespeichert.\n- Keine Quelle, Datei oder Schnittstelle wird ohne ausdrückliche Freigabe geöffnet oder verändert.\n\n## Änderungsprotokoll\n\n### 2.0.0 (2026-07-30)\n\n- Nutzerneutraler öffentlicher Kern; private Integrationen und persönliche Profile entfernt.\n"}, {"id": "assist:assist:tageszeitung", "name": "tageszeitung", "cat": "assist", "ver": "0.1.0", "status": "stable", "desc": "Creates a personalised daily newspaper from RSS feeds and web sources. Ported from the BACH news system (news.py + newspaper_generator.py). Own SQLite store (no Origin-DB). feedparser optional — XML fallback via stdlib. PDF export via Edge Headless (msedge.exe).", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: tageszeitung\nversion: 0.1.0\ntype: assist\nauthor: ellmos-ai\ncreated: 2026-06-22\nupdated: 2026-06-22\ndescription: Creates a personalised daily newspaper from RSS feeds and web sources. Ported from the BACH news system (news.py + newspaper_generator.py). Own SQLite store (no Origin-DB). feedparser optional — XML fallback via stdlib. PDF export via Edge Headless (msedge.exe).\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: assist\ntags: [zeitung, news, rss, feed, pdf, tageszeitung]\nlanguage: de\nstatus: stable\ndependencies: {'tools': [{'name': 'msedge.exe', 'optional': True, 'purpose': 'HTML → PDF (Edge Headless); without Edge: HTML output only'}], 'services': [], 'protocols': [], 'python': [{'name': 'feedparser', 'optional': True, 'install': 'pip install feedparser', 'purpose': 'RSS parsing (main backend). Fallback: defusedxml → regex'}, {'name': 'defusedxml', 'optional': True, 'install': 'pip install defusedxml', 'purpose': 'XXE-safe XML parser as fallback when feedparser is missing. Without defusedxml a regex fallback is used (no ET.fromstring on network data).'}]}\nprovenance: {'origin': 'bach-port', 'origin_path': 'BACH/system/hub/news.py + hub/_services/newspaper/newspaper_generator.py', 'origin_version': 'news.py v1.x, newspaper_generator.py v1.x', 'origin_repo': 'ellmos-ai/bach (privat)', 'origin_license': 'MIT', 'last_sync_from_origin': '2026-06-22', 'notes': 'Schema (news_sources + news_items) 1:1 aus BACH news.py portiert. BaseHandler-Abhängigkeit entfernt. Origin-DB-Pfad entfernt. DB-Pfad konfigurierbar. newspaper_generator.py-Logik (HTML-Render + Edge-PDF) userneutral übernommen.\\n'}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"tageszeitung banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n## Übersicht & Zweck\n\nFetch articles from configured RSS feeds and web sources, sort them by category\nand render them as an HTML/PDF daily newspaper. Articles are stored locally in\n`tageszeitung/store.db` and marked as read.\n\n---\n\n## Triggers\n\n| Phrase | Action |\n|---|---|\n| \"Create my daily newspaper\" | Fetch articles + render PDF |\n| \"Daily newspaper for today\" | Render today's newspaper |\n| \"Add feed [URL]\" | Register RSS source |\n| \"Show my sources\" | Output source list |\n| \"Fetch news\" | Fetch all sources (no render) |\n\n---\n\n## Workflow & Vorgehen\n\n1. **Check sources**: Read all active sources from `news_sources`.\n2. **Fetch**: RSS via feedparser (or xml.etree fallback), web via urllib.\n3. **Deduplication**: UNIQUE(source_id, url) prevents duplicates.\n4. **Render**: Group unread articles by category → HTML → PDF.\n5. **Deliver**: Place HTML/PDF in output folder (configurable path).\n\n---\n\n## CLI Entry Point\n\n```bash\n# Add source (Deutsch)\npython tageszeitung_core.py add-source \"Heise\" rss https://www.heise.de/rss/heise-atom.xml --category tech\n\n# Fetch all sources (Deutsch)\npython tageszeitung_core.py fetch\n\n# Render daily newspaper (HTML + PDF if Edge available) (Deutsch)\npython tageszeitung_core.py render [--date 2026-06-22] [--out /path/]\n\n# List sources (Deutsch)\npython tageszeitung_core.py sources\n\n# Unread articles (Deutsch)\npython tageszeitung_core.py items [--limit 50] [--category tech]\n\n# Mark article as read (Deutsch)\npython tageszeitung_core.py read <item_id>\n\n# Alternative store (e.g. for tests) (Deutsch)\npython tageszeitung_core.py --store /tmp/t.db sources --dry-run\n```\n\n---\n\n## Store\n\n| Property | Value |\n|---|---|\n| Type | SQLite |\n| Path (default) | `skills/assist/tageszeitung/store.db` |\n| Override | `--store <path>` or env `TAGESZEITUNG_STORE` |\n| Tables | `news_sources`, `news_items` |\n\n### Schema (ported from BACH news.py)\n\n```sql\nCREATE TABLE IF NOT EXISTS news_sources (\n    id           TEXT PRIMARY KEY,\n    name         TEXT NOT NULL,\n    type         TEXT NOT NULL DEFAULT 'rss',  -- rss | web\n    url          TEXT NOT NULL UNIQUE,\n    category     TEXT DEFAULT 'Allgemein',\n    schedule     TEXT DEFAULT 'daily',\n    is_active    INTEGER DEFAULT 1,\n    last_fetched TEXT,\n    fetch_count  INTEGER DEFAULT 0,\n    error_count  INTEGER DEFAULT 0,\n    last_error   TEXT,\n    created_at   TEXT NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS news_items (\n    id           TEXT PRIMARY KEY,\n    source_id    TEXT NOT NULL REFERENCES news_sources(id),\n    title        TEXT NOT NULL,\n    content      TEXT,\n    summary      TEXT,\n    url          TEXT,\n    author       TEXT,\n    published_at TEXT,\n    fetched_at   TEXT NOT NULL,\n    is_read      INTEGER DEFAULT 0,\n    category     TEXT,\n    UNIQUE(source_id, url)\n);\n```\n\n---\n\n## Attitude\n\n- feedparser is preferred; without feedparser an xml.etree fallback handles simple RSS 2.0 feeds.\n- PDF generation requires `msedge.exe` in the system PATH or `MSEDGE_PATH` env. Without Edge only HTML is rendered.\n- Maximum articles per category: configurable via `assist/prefs.json` (`tageszeitung_max_per_category`, default: 5).\n\n---\n\n## Privacy\n\n- Article contents stay local in `store.db`.\n- No external analysis services — only the configured RSS/web sources are called.\n\n---\n\n## Related Resources\n\n- BACH `hub/news.py` — origin (read-only)\n- BACH `hub/_services/newspaper/newspaper_generator.py` — origin (read-only)\n\n---\n\n## Änderungsprotokoll\n\n| Version | Date | Change |\n|---|---|---|\n| 0.1.0 | 2026-06-22 | Initial creation — BACH schema ported, own store, feedparser optional |"}, {"id": "assist:assist:transkription", "name": "transkription", "cat": "assist", "ver": "0.1.0", "status": "stable", "desc": "Transcribes audio/video files to text. Uses Whisper (openai-whisper) or Vosk (offline) as optional backend — both are detected via presence check. Without backend: placeholder mode with dummy output (dry-run).", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: transkription\nversion: 0.1.0\ntype: assist\nauthor: ellmos-ai\ncreated: 2026-06-22\nupdated: 2026-06-22\ndescription: Transcribes audio/video files to text. Uses Whisper (openai-whisper) or Vosk (offline) as optional backend — both are detected via presence check. Without backend: placeholder mode with dummy output (dry-run).\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: assist\ntags: [transkription, audio, speech-to-text, whisper, vosk, offline]\nlanguage: de\nstatus: stable\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': [{'name': 'openai-whisper', 'optional': True, 'install': 'pip install openai-whisper', 'purpose': 'STT backend option 1 (cloud/local model)'}, {'name': 'vosk', 'optional': True, 'install': 'pip install vosk', 'purpose': 'STT backend option 2 (fully offline)'}]}\nprovenance: {'origin': 'eigenentwurf', 'origin_path': '', 'origin_version': '', 'origin_repo': '', 'origin_license': 'MIT', 'last_sync_from_origin': '', 'notes': 'Kein direkter BACH-Origin vorhanden (transkriptions-service existiert nicht als Datei in BACH/system). Skill neu konzipiert. voice_stt.py aus BACH/hub/_services/voice/ hat das Backend-Muster inspiriert (optionale Imports mit Verfügbarkeits-Flags), wurde aber nicht direkt portiert.\\n'}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"transkription banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n## Übersicht & Zweck\n\nConvert audio/video files to text — locally, without mandatory cloud access. The skill\nautomatically detects whether Whisper or Vosk is installed and selects the best\navailable backend. Without a backend it runs in dry-run mode and returns a\nplaceholder text, so the workflow always works.\n\nTranscripts are stored locally in `transkription/store.db` and can be queried.\n\n---\n\n## Triggers\n\n| Phrase | Action |\n|---|---|\n| \"Transcribe this audio\" | Transcribe audio file |\n| \"Transcribe [file]\" | Transcribe named file |\n| \"Show my transcripts\" | List latest transcripts |\n| \"Search transcript [term]\" | Full-text search in transcripts |\n| \"Export transcript [ID]\" | Export transcript as TXT |\n\n---\n\n## Workflow & Vorgehen\n\n1. **Backend check**: Check whether `whisper` or `vosk` is importable.\n2. **File check**: Input file must exist (audio: wav, mp3, m4a, ogg, flac; video: mp4, mkv, webm — extraction via ffmpeg).\n3. **Transcription**: Call backend and obtain raw text.\n4. **Save**: Store result with metadata (file, duration, language, backend, timestamp) in `store.db`.\n5. **Output**: Return text; optionally export as `.txt`.\n\n---\n\n## CLI Entry Point\n\n```bash\n# Transcribe file (Deutsch)\npython transkription_core.py transcribe audio.wav\n\n# With explicit language (Deutsch)\npython transkription_core.py transcribe audio.mp3 --lang de\n\n# Dry-run (no backend required) (Deutsch)\npython transkription_core.py transcribe audio.wav --dry-run\n\n# List transcripts (Deutsch)\npython transkription_core.py list [--limit 20]\n\n# Full-text search (Deutsch)\npython transkription_core.py search \"term\"\n\n# Export (Deutsch)\npython transkription_core.py export <id> [--out file.txt]\n\n# Backend check (Deutsch)\npython transkription_core.py check\n\n# Alternative store path (e.g. for tests) (Deutsch)\npython transkription_core.py --store /tmp/test.db transcribe audio.wav --dry-run\n```\n\n---\n\n## Store\n\n| Property | Value |\n|---|---|\n| Type | SQLite |\n| Path (default) | `skills/assist/transkription/store.db` |\n| Override | `--store <path>` or env `TRANSKRIPTION_STORE` |\n| Tables | `transcripts` |\n\n### Schema `transcripts`\n\n```sql\nCREATE TABLE IF NOT EXISTS transcripts (\n    id          TEXT PRIMARY KEY,  -- UUID (short: 8 hex)\n    file_path   TEXT NOT NULL,     -- original path of audio file\n    file_name   TEXT NOT NULL,     -- filename (without path, for display)\n    text        TEXT NOT NULL,     -- transcribed text\n    language    TEXT,              -- language (e.g. \"de\", \"en\")\n    backend     TEXT,              -- \"whisper\" | \"vosk\" | \"dry-run\"\n    duration_s  REAL,              -- duration in seconds (if known)\n    created_at  TEXT NOT NULL,     -- ISO-8601 timestamp\n    tags        TEXT               -- comma-separated tags (optional)\n);\n```\n\n---\n\n## Attitude\n\n- Without an installed backend the skill works in dry-run mode (demo text).\n- Whisper is preferred over Vosk (better German quality).\n- The choice between Whisper and Vosk can be set via `assist/prefs.json` (`transkription_backend: \"whisper\"|\"vosk\"|\"auto\"`).\n- ffmpeg for video extraction is needed separately and is not included in the skill.\n\n---\n\n## Privacy\n\n- **All transcripts stay local** — no cloud transfer without Whisper online mode.\n- Whisper can be used locally (tiny/base/medium model) or via OpenAI API.\n  By default the local model is used.\n- `store.db` may contain sensitive conversation content — **do not commit to Git**.\n- Recommendation: add `store.db` to `.gitignore`.\n\n---\n\n## Related Resources\n\n- BACH `hub/_services/voice/voice_stt.py` — backend pattern (inspiration, read-only)\n- Skill `utilities/yt-transcriber` — YouTube transcription (separate skill, not a duplicate: YT-specific)\n- `tools/module-installer/module_installer.py` — registry contains whisper + vosk\n\n---\n\n## Änderungsprotokoll\n\n| Version | Date | Change |\n|---|---|---|\n| 0.1.0 | 2026-06-22 | Initial creation — own SQLite store, Whisper/Vosk presence check |"}, {"id": "assist:assist:voice", "name": "voice", "cat": "assist", "ver": "2.0.0", "status": "stable", "desc": "Plant Sprachaufnahme, Transkription und Sprachausgabe mit optionalen, austauschbaren Werkzeugen.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: voice\nversion: 2.0.0\ntype: assist\nauthor: ellmos contributors\ncreated: 2026-07-30\nupdated: 2026-07-30\ndescription: >\n  Plant Sprachaufnahme, Transkription und Sprachausgabe mit optionalen, austauschbaren Werkzeugen.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: assist\ntags: [voice, speech, stt, tts, provider-neutral]\nlanguage: de\nstatus: stable\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\nprovenance:\n  origin: public-neutral\n  origin_license: MIT\n  notes: Public core only; adapters and private profiles are excluded.\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"voice banner\">\n\n# Anbieterneutrale Sprachhilfe\n\n## Zweck\n\nEinen Sprachworkflow definieren, ohne einen privaten Backend-Anbieter vorauszusetzen.\n\n**Ergebnis:** Ablaufplan mit Eingabeformat, Datenschutzentscheidung, Werkzeugoptionen und Fallback.\n\n## Arbeitsablauf\n\n1. Ziel, Kontext und gewünschtes Ausgabeformat klären.\n2. Nur die im aktuellen Auftrag bereitgestellten Informationen verwenden.\n3. Das Ergebnis strukturiert und nachvollziehbar erstellen.\n4. Annahmen kennzeichnen und vor externen Änderungen eine Bestätigung einholen.\n\n## Beispiel\n\n**Eingabe:** Plane einen lokalen Transkriptionsablauf für eine Audiodatei.\n\n**Ergebnis:** Ablaufplan mit Eingabeformat, Datenschutzentscheidung, Werkzeugoptionen und Fallback.\n\n## Öffentlicher Kern und private Erweiterungen\n\nDieser öffentliche Skill enthält ausschließlich die übertragbare Methode. App-spezifische Adapter, Konten, lokale Pfade, Datenbanken und persönliche Voreinstellungen gehören in ein privates Zusatzprofil oder einen privaten Fork und dürfen nicht in dieses Repository übernommen werden.\n\nOhne privates Profil arbeitet der Skill nur mit Informationen, die im aktuellen Auftrag ausdrücklich bereitgestellt wurden.\n\n## Grenzen und Datenschutz\n\n- Daten werden nicht standardmäßig gespeichert.\n- Keine Quelle, Datei oder Schnittstelle wird ohne ausdrückliche Freigabe geöffnet oder verändert.\n- Vor Cloud-Verarbeitung müssen Einwilligung, Datenklasse und Aufbewahrung geklärt werden.\n\n## Änderungsprotokoll\n\n### 2.0.0 (2026-07-30)\n\n- Nutzerneutraler öffentlicher Kern; private Integrationen und persönliche Profile entfernt.\n"}, {"id": "expert:assist:wetter", "name": "wetter", "cat": "assist", "ver": "0.1.0", "status": "active", "desc": "Answers weather questions for a location or coordinates via wttr.in (free, no API key). Current weather + 3-day forecast. Location comes from the user request or preferences; optional short cache.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: wetter\nversion: 0.1.0\ntype: expert\nauthor: ellmos\ncreated: 2026-06-22\nupdated: 2026-06-22\ndescription: Answers weather questions for a location or coordinates via wttr.in (free, no API key). Current weather + 3-day forecast. Location comes from the user request or preferences; optional short cache.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: assist\ntags: [wetter, wttr, vorschau, assist]\nlanguage: de\nstatus: active\ndependencies: {'tools': ['wetter_core.py'], 'services': [], 'protocols': [], 'python': ['urllib', 'json']}\nprovenance: {'origin': 'bach', 'origin_path': 'system/hub/_services/weather/weather_service.py', 'origin_version': '1.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'origin_license': 'MIT', 'last_sync_from_origin': '2026-06-22', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"wetter banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Weather (Deutsch)\n\nFast, key-free weather information for everyday use.\n\n## Übersicht & Zweck\n\nAnswers \"What will the weather be like?\" questions without an API key (data source: wttr.in).\nDelivers current weather (temperature, feels-like, wind, humidity, UV) plus a\ncompact 3-day forecast. **User-neutral:** no fixed location in the code — the location\ncomes from the request or from `assist/prefs.json` (`wetter_default_location`),\nwhich the LLM fills in interactively with the user.\n\n## Triggers\n\n| User input | Action |\n|---|---|\n| \"Weather for Potsdam?\" / \"What will the weather be like in Hamburg?\" | `wetter_core.py \"<location>\"` |\n| \"Weather tomorrow?\" (without location) | `wetter_core.py --default` (location from prefs) |\n| \"My default weather location is Potsdam\" | `wetter_core.py --set-default \"Potsdam\"` |\n| Coordinates known | `wetter_core.py <lat> <lon>` |\n\n## Workflow & Vorgehen\n\n```\n1. Determine location: from request; else prefs.json (wetter_default_location);\n   else ask user interactively + optionally save as default.\n2. Query wetter_core.py (wttr.in, 2 attempts, 30-min cache).\n3. Present readable weather text + 3-day forecast.\n```\n\n## CLI Entry Point (wetter_core.py)\n\n```bash\npython wetter_core.py \"Potsdam\"          # location\npython wetter_core.py 52.6789 13.5878   # coordinates\npython wetter_core.py --default         # location from prefs.json\npython wetter_core.py --set-default \"Potsdam\"\n```\n\n## Store (optional)\n\n- **No mandatory store.** Optional short cache `assist/wetter/.cache.json`\n  (TTL 30 min, best-effort) — avoids repeated network calls.\n- Location preference in `assist/prefs.json` (`wetter_default_location`).\n\n## Attitude\n\nWe use wttr.in as the key-free default source, but are open to other weather\nbackends (e.g. DWD/OpenWeather) if the user prefers them.\n\n## Privacy\n\n- Only the location name/coordinates go to wttr.in (required for the query).\n- No telemetry, no account. Cache + preference stay local.\n\n## Related Resources\n\n- `assist/AGENTS.md` — Umbrella router\n- `assist/reiseroute/` — uses weather for travel planning (planned)\n\n## Änderungsprotokoll\n\n### 0.1.0 (2026-06-22)\n- Initial version. Ported from BACH `hub/_services/weather/weather_service.py` (MIT).\n- Extended: location name support (not just coordinates), 3-day forecast,\n  optional cache, prefs-based default location. User-neutral."}, {"id": "skill:dev:bilingual-doc-sync", "name": "bilingual-doc-sync", "cat": "dev", "ver": "1.1.0", "status": "active", "desc": "Parallel geführte Sprachfassungen eines Dokuments (Paper DE/EN, README + README_de, SKILL.md + SKILL.en.md, Website-Texte) synchron halten: fehlende Fassung nachziehen, Abschnitts-Parallelität prüfen, Divergenzen beheben — mit klarer Leitsprache-Regel und kontrolliertem Rücktransfer, wenn die Nebenfassung etwas besser löst. Nutze diesen Skill bei „sind DE und EN synchron?\", „zieh die englische/deutsche Version nach\", „Übersetzung ist veraltet\", bei zweisprachigen Papers/READMEs/Skills, oder als periodischen Check über einen Dokumentbestand. Enthält auch das Expansions-Audit: bewerten, ob ein Projekt/Dokument WEITERE Sprachen verdient (i18n-Eignung nach Zielgruppe, technische Vorbereitung, kein blindes Massenübersetzen).", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: bilingual-doc-sync\nversion: 1.1.0\ntype: skill\nauthor: Lukas Geiger + Claude\ncreated: 2026-07-03\nupdated: 2026-07-03\ndescription: >\n  Parallel geführte Sprachfassungen eines Dokuments (Paper DE/EN, README + README_de,\n  SKILL.md + SKILL.en.md, Website-Texte) synchron halten: fehlende Fassung nachziehen,\n  Abschnitts-Parallelität prüfen, Divergenzen beheben — mit klarer Leitsprache-Regel und\n  kontrolliertem Rücktransfer, wenn die Nebenfassung etwas besser löst. Nutze diesen Skill\n  bei „sind DE und EN synchron?\", „zieh die englische/deutsche Version nach\",\n  „Übersetzung ist veraltet\", bei zweisprachigen Papers/READMEs/Skills, oder als\n  periodischen Check über einen Dokumentbestand. Enthält auch das Expansions-Audit:\n  bewerten, ob ein Projekt/Dokument WEITERE Sprachen verdient (i18n-Eignung nach\n  Zielgruppe, technische Vorbereitung, kein blindes Massenübersetzen).\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\n\ncategory: utilities\ntags: [übersetzung, zweisprachig, synchronisation, paper, readme, i18n, dokumentation]\nlanguage: de\nstatus: active\n\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\n\nprovenance:\n  origin: \"custom\"\n  origin_path: null\n  origin_version: null\n  origin_repo: \"github.com/ellmos-ai/skills\"\n  last_sync_from_origin: null\n  last_sync_to_origin: null\n  local_changes_since_sync: false\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"bilingual-doc-sync banner\">\n# Bilingual-Doc-Sync — parallele Sprachfassungen synchron halten\n\n## Zweck\n\nZweisprachig geführte Dokumente divergieren schleichend: Die aktiv bearbeitete Fassung\nwächst, die andere veraltet — bis „Übersetzung\" nur noch dem Namen nach stimmt. Dieser\nSkill macht die Synchronprüfung zu einem definierten Ablauf mit einer entscheidenden\nVorab-Festlegung: **Welche Fassung führt?** Ohne Leitsprache-Regel wird jede Divergenz\nzur Einzelfallentscheidung und der Abgleich unwiederholbar.\n\n## Ablauf\n\n### 1. Bestand feststellen\n\n- Liegen beide (alle) Sprachfassungen vor? Fehlt eine ganz → **nachziehen** (vollständige\n  Übersetzung der führenden Fassung, nicht Neudichtung).\n- Namenskonvention prüfen (z. B. `DOKUMENT.md` + `DOKUMENT.en.md` oder `_de`/`_en`-Suffixe)\n  und Abweichler angleichen — Auffindbarkeit ist die halbe Synchronität.\n\n### 2. Leitsprache klären (vor jedem Abgleich)\n\n- Die Leitsprache ist die Fassung, in der inhaltlich gearbeitet wird (bei Papers oft EN,\n  bei lokaler Doku oft die Muttersprache). Sie gewinnt bei Widerspruch.\n- **Rücktransfer-Ausnahme:** Löst die Nebenfassung etwas nachweislich besser (klarere\n  Formulierung, korrigierter Fehler), wird es in die Leitfassung ÜBERNOMMEN — erst\n  rücktransferieren, dann normal synchronisieren. Fachliche Korrektheit prüfen, bevor\n  eine „schönere\" Formulierung übernommen wird.\n\n### 3. Parallelität prüfen\n\nStruktur zuerst, dann Inhalt:\n\n1. **Gliederungsvergleich:** Abschnitte/Überschriften beider Fassungen nebeneinander —\n   fehlende, zusätzliche, umsortierte Abschnitte sind die groben Divergenzen.\n2. **Abschnittsweise Stichprobe** der übereinstimmenden Gliederung: Aussagen, Zahlen,\n   Verweise, Beispiele identisch? Besonders divergenzanfällig: Changelogs, Tabellen,\n   Zahlenwerte, Literatur-/Linkverzeichnisse, zuletzt bearbeitete Abschnitte.\n3. **Nicht übersetzbare Invarianten** prüfen: Code-Blöcke, Identifier, Formeln, Pfade\n   müssen in beiden Fassungen IDENTISCH sein (Code wird nie übersetzt).\n\n### 4. Beheben\n\n- Divergenzen in Richtung Leitsprache auflösen (bzw. nach Rücktransfer).\n- Sprachtypografie der Zielsprache respektieren (im Deutschen echte Umlaute ä ö ü ß,\n  keine ae/oe/ue-Ersatzschreibung; Anführungszeichen-Konventionen).\n- Metadaten nachziehen: Versionsnummern, Datumsfelder, Changelog-Einträge in BEIDEN\n  Fassungen (der Changelog selbst ist der häufigste Divergenzpunkt).\n\n### 5. Dokumentieren\n\nErgebnis festhalten (was war divergent, was wurde übernommen, was rücktransferiert).\nAls periodischer Lauf über einen Bestand: mit dem Rotations-Gerüst kombinieren\n(`rotation-check`) — ein Dokument(-Paar) pro Lauf, Registry als Gedächtnis.\n\n## Erweiterung: Expansions-Audit (sollten MEHR Sprachen existieren?)\n\nNeben dem Synchronhalten bestehender Fassungen gehört zur Sprachpflege die Frage, ob ein\nDokument/Projekt WEITERE Sprachen verdient:\n\n1. **Eignung bewerten** statt blind übersetzen: Zielgruppe, internationale Nutzbarkeit,\n   Store-/Web-Präsenz, Mobilität des Inhalts. Nicht jedes interne Dokument braucht Englisch;\n   nicht jede App braucht fünf Sprachen.\n2. **Technische Vorbereitung prüfen:** Ist das Ziel überhaupt auf Sprachdateien/Parallel-\n   Fassungen vorbereitet (i18n-Struktur, Namenskonvention)? Wenn nein, ist DAS die erste\n   Aufgabe, nicht die Übersetzung.\n3. **Befund dokumentieren, nicht sofort massenübersetzen:** Konkrete Übersetzungsaufgaben\n   in die projektlokale TODO-Datei; „keine weitere Sprache sinnvoll\" ist ein gültiges,\n   festzuhaltendes Ergebnis.\n4. **QA bei nachgezogenen Fassungen:** Auto-generierte Übersetzungen stichprobenartig\n   gegen die Leitfassung prüfen (Abschnitt 3), bevor sie als „vorhanden\" gelten.\n\n## Beispiel\n\n```text\nAuftrag: „Prüf, ob das Paper in DE und EN synchron ist.\"\n\n1. Bestand: paper_en.tex (führend) + paper_de.tex vorhanden.\n2. Gliederung: DE fehlt der neue Abschnitt 4.2 (letzte EN-Revision); DE hat einen\n   besseren Beweis-Absatz in 3.1.\n3. Rücktransfer: 3.1-Formulierung fachlich geprüft → in EN übernommen.\n4. Nachziehen: 4.2 nach DE übersetzt; Zahlen in Tabelle 2 abgeglichen (DE hatte\n   veraltete Werte); Literaturverzeichnis identisch gemacht.\n5. Registry-Eintrag: „paper-X | 2026-07-03 | de-en-sync | 3 Divergenzen behoben,\n   1 Rücktransfer | nächster Check nach nächster EN-Revision\".\n```\n\n## Red Flags\n\n| Gedanke | Realität |\n| --- | --- |\n| „Ich übersetze die Unterschiede einfach frisch\" | Erst Leitsprache + Rücktransfer-Frage klären — sonst wird die bessere Lösung überschrieben. |\n| „Die Gliederung passt, also ist es synchron\" | Zahlen, Changelogs und Verweise divergieren zuerst — Stichprobe in die Tiefe ist Pflicht. |\n| „Code-Kommentare übersetze ich mit\" | Code-Blöcke und Identifier bleiben in beiden Fassungen identisch (englisch). |\n| „Ich synchronisiere alle Dokumente in einem Rutsch\" | Ein Paar pro Lauf (Rotations-Gerüst) hält den Abgleich prüfbar. |\n\n## Verwandte Skills\n\n- `rotation-check` — Gerüst für den periodischen Lauf über einen Dokumentbestand.\n- `workflow-extract` — wenn dieser Check als stehende Automation eingerichtet werden soll.\n\n## Changelog\n\n### 1.1.0 (2026-07-03)\n- Expansions-Audit ergänzt (i18n-Eignung bewerten, technische Vorbereitung, QA für\n  nachgezogene Fassungen) — integriert statt als eigener i18n-coverage-audit-Skill\n  (Dedup-Entscheid).\n\n### 1.0.0 (2026-07-03)\n- Initiale Version. Abstrahiert aus der Codex-Automation\n  „research-paper-de-en-synchronisationscheck\", verallgemeinert auf beliebige parallel\n  geführte Sprachfassungen (Papers, READMEs, Skills, Website-Texte).\n"}, {"id": "protocol:dev:bugfix-protocol", "name": "bugfix-protocol", "cat": "dev", "ver": "1.0.0", "status": "active", "desc": "Systematic 6-phase debugging protocol. Structured approach to bugs with quick checks, isolated testing, 20-minute rule, and bug report template.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: bugfix-protocol\nversion: 1.0.0\ntype: protocol\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Systematic 6-phase debugging protocol. Structured approach to bugs with quick checks, isolated testing, 20-minute rule, and bug report template.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: dev\ntags: [debugging, bugfix, protocol, python, pyqt6, systematic]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/workflows/bugfix-protokoll.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"bugfix-protocol banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Bugfix Protocol: Systematic 6-Phase Debugging (Deutsch)\n\nA structured approach to bugs — from symptom analysis to verification.\nPrevents aimless trial-and-error and ensures fixes are sustainable.\n\n---\n\n## Übersicht & Zweck\n\n| Phase | Name | Goal | Max. Time |\n|-------|------|------|-----------|\n| 1 | Quick Checks | Rule out obvious causes | 2 min |\n| 2 | Diagnosis | Locate root cause | 10 min |\n| 3 | Isolated Test | Make bug reproducible | 5 min |\n| 4 | Fix | Minimal correction | 10 min |\n| 5 | Verification | Verify fix + check side effects | 5 min |\n| 6 | Documentation | Preserve knowledge | 2 min |\n\n**20-Minute Rule:** If no progress after 20 minutes, change approach or seek help.\n\n---\n\n## Phase 1: Quick Checks (2 min)\n\nBefore diving deep — check the most common causes:\n\n### Checklist\n\n- [ ] **Syntax error?** Read error message carefully, check line\n- [ ] **Import error?** Module installed? Correct name? Circular import?\n- [ ] **Typo?** Variable/function names correct?\n- [ ] **Wrong data type?** String instead of int? None where object expected?\n- [ ] **Stale cache?** Delete `__pycache__`, restart\n- [ ] **Wrong environment?** Correct venv active? Correct Python version?\n- [ ] **Encoding?** UTF-8 vs. cp1252 (Windows classic)\n\n### Quick Actions\n\n```bash\n# Clear cache (Deutsch)\nfind . -name \"__pycache__\" -type d -exec rm -rf {} + 2>&1\nfind . -name \"*.pyc\" -delete 2>&1\n\n# Check imports (Deutsch)\npython -c \"import modulename\"\n\n# Check syntax (Deutsch)\npython -m py_compile file.py\n```\n\n---\n\n## Phase 2: Diagnosis (10 min)\n\n### Strategy: Outside-In\n\n1. **Analyze error message** — Read traceback from bottom to top\n2. **Check recent changes** — `git diff`, `git log --oneline -10`\n3. **Use diagnostic tools** — Use project-specific diagnostic tools\n\n### Diagnostic Tools (Examples)\n\nDepending on the project, specialized diagnostic scripts may be helpful:\n\n| Tool | Purpose |\n|------|---------|\n| `import_diagnose.py` | Analyze import problems |\n| `method_analyzer.py` | Check method signatures |\n| `env_checker.py` | Validate environment variables/paths |\n\n> **Note:** Create project-specific diagnostic tools or use existing ones.\n> The systematic approach matters, not the specific tool.\n\n### Debugging Techniques\n\n```python\n# 1. Print debugging (quick but effective) (Deutsch)\nprint(f\"DEBUG: variable={variable!r}, type={type(variable)}\")\n\n# 2. Breakpoint (interactive) (Deutsch)\nbreakpoint()  # Python 3.7+\n\n# 3. Extended traceback (Deutsch)\nimport traceback\ntraceback.print_exc()\n\n# 4. Logging instead of print (Deutsch)\nimport logging\nlogging.basicConfig(level=logging.DEBUG)\nlogger = logging.getLogger(__name__)\nlogger.debug(f\"State: {state!r}\")\n```\n\n---\n\n## Phase 3: Isolated Test (5 min)\n\n### Minimal Reproducible Example (MRE)\n\nGoal: Reproduce the bug with minimal code.\n\n```python\n# test_bug.py — Minimal Reproduction Test (Deutsch)\n\"\"\"\nBug: [Short description]\nExpected: [What should happen]\nActual: [What happens instead]\n\"\"\"\n\n# Minimal setup (Deutsch)\n# ... only the essentials (Deutsch)\n\n# Bug trigger (Deutsch)\n# ... exact code that triggers the bug (Deutsch)\n\n# Expected result (Deutsch)\n# assert result == expected, f\"Got {result}\" (Deutsch)\n```\n\n### Isolation Strategies\n\n1. **New file:** Reproduce the bug in a separate file\n2. **Remove dependencies:** One by one, until the bug disappears\n3. **Binary search:** Halve the code block, check which half contains the bug\n4. **Git bisect:** `git bisect start`, `git bisect bad`, `git bisect good <commit>`\n\n---\n\n## Phase 4: Fix (10 min)\n\n### Principles\n\n1. **Minimal:** Change as little as possible\n2. **Understand:** Never fix blindly — understand WHY it's broken\n3. **One thing:** One fix per commit, don't fix multiple issues at once\n4. **Backward-compatible:** Don't break existing functionality\n\n### Fix Patterns\n\n```python\n# BAD: Treating the symptom (Deutsch)\ntry:\n    result = broken_function()\nexcept:  # Swallow everything\n    result = default_value\n\n# GOOD: Fix the root cause (Deutsch)\ndef broken_function():\n    if input_data is None:  # Actual cause: missing None check\n        return default_value\n    return process(input_data)\n```\n\n### Common Fix Categories\n\n| Category | Typical Fix |\n|----------|------------|\n| None/Null | Guard clause: `if x is None: return default` |\n| Index error | Bounds check: `if i < len(lst)` |\n| Type error | Explicit conversion: `str(x)`, `int(x)` |\n| Import error | Fix path, install package |\n| Encoding | Specify UTF-8 explicitly: `encoding='utf-8'` |\n| Race condition | Lock/Mutex, or change order |\n| State bug | Check initialization, add reset |\n\n---\n\n## Phase 5: Verification (5 min)\n\n### Checklist\n\n- [ ] **Bug is fixed:** Original problem
