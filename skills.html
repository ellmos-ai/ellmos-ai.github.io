t": "---\nname: letter-hooker\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger + Gemini (Antigravity)\ncreated: 2026-07-29\nupdated: 2026-07-29\ndescription: >\n  Extends automation-self-care with Letter Hooks, Preflight Bootloaders,\n  Document Traversal Rules, and Self-Healing Prompt Context Enrichment for AI\n  agents and CLIs that lack native, event-driven JSON lifecycle hooks (such as\n  Antigravity / Gemini CLI). Use when an agent needs to inject preflight rules,\n  search memory/gardener before work begins, enforce directory document reading\n  strategies (CLAUDE.md / AGENTS.md), or dynamically route sidecar tasks to\n  skills and security protocols.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: false\ncategory: infrastructure\ntags: [automation, letter-hooker, letter-hooks, bootloader, prompt-enrichment, self-care, governance]\nlanguage: en\nstatus: active\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: [agy_kontext_and_workflow_loader.py]\nprovenance:\n  origin: \"fork of automation-self-care\"\n  origin_path: \"skills/infrastructure/automation-self-care\"\n  origin_version: \"1.0.0\"\n  origin_repo: \"github.com/ellmos-ai/skills\"\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"letter-hooker banner\">\n\n# Letter-Hooker (Prompt-Level Preflight & Governance Engine)\n\nThe **Letter-Hooker** skill extends `automation-self-care` for AI agent frameworks (like **Antigravity / Gemini CLI**) that do not possess native, event-driven JSON lifecycle hook loaders (e.g. `~/.claude/settings.json` or `~/.codex/hooks.json`).\n\nInstead of relying on passive, per-keypress hooks, `letter-hooker` operates an **active, prompt-level preflight bootloader and letter-hook injection loop** via scheduled tasks and maintainer scripts (`agy_kontext_and_workflow_loader.py`).\n\n---\n\n## Core Capabilities\n\n1. **Preflight Bootloaders & Document Traversal Rules**:\n   - **Upward & Downward Search**: Enforces strict instructions for agents to inspect `AGENTS.md`, `CLAUDE.md`, `START.md`, `RULES.md`, and `README.md` at the current working directory level. If missing, traverse upwards until found; then inspect downwards.\n   - **Memory & Gardener Preflight**: Mandatory preflight query to `gardener` and `memoryhooker` before executing destructive or complex modifications.\n\n2. **Letter Hooks Catalog & Reference Links**:\n   - Modular `.md` instruction files stored under `OneDrive/.SYNC/antigravity_kontext_and_workflow_loader_package/letter_hooks/`.\n   - Injects explicit `file://` links directly into `sidecar.json` prompt text so agents read exact security and workflow protocols upon invocation.\n\n3. **Daily Keyword List & Self-Healing Prompt Enrichment**:\n   - Maintains a daily `STICHWORTLISTE.json` from active/standby tasks.\n   - Analyzes execution logs (`AUTOMATIONS-MEMORY.md`) for failure patterns (missing context, missing workflow guidance, invalid paths) and dynamically patches task prompts.\n\n4. **Skill & Persona Routing**:\n   - Inspects task keywords and maps them to appropriate `.SKILLS` (e.g. `infrastructure/condition`, `semantic-persona-routing`, `orchestrator`, `think`, `decide`).\n\n---\n\n## Key Letter Hooks\n\n- **`HOOK-DOC-TRAVERSAL-01`**: [bootloader_doc_traversal.md](file:///<USER_HOME>/OneDrive/.SYNC/antigravity_kontext_and_workflow_loader_package/letter_hooks/bootloader_doc_traversal.md)\n- **`HOOK-GARDENER-MEMORY-01`**: [preflight_gardener_query.md](file:///<USER_HOME>/OneDrive/.SYNC/antigravity_kontext_and_workflow_loader_package/letter_hooks/preflight_gardener_query.md)\n- **`HOOK-WORKFLOW-HYGIENE-01`**: [workflow_lock_and_git_hygiene.md](file:///<USER_HOME>/OneDrive/.SYNC/antigravity_kontext_and_workflow_loader_package/letter_hooks/workflow_lock_and_git_hygiene.md)\n- **`HOOK-PATH-VALIDATION-01`**: [path_validation_and_authority.md](file:///<USER_HOME>/OneDrive/.SYNC/antigravity_kontext_and_workflow_loader_package/letter_hooks/path_validation_and_authority.md)\n\n---\n\n## Workflow Integration\n\n```bash\n# Execute the Letter-Hooker Maintenance Engine\npython OneDrive/.SYNC/scripts/agy_kontext_and_workflow_loader.py\n```\n\n1. **Scan Sidecars**: Read all `sidecar.json` prompt texts in `~/.gemini/config/sidecars/`.\n2. **Update Keyword List**: Extract domain terms and save to `.SYNC/STICHWORTLISTE.json`.\n3. **Inject Letter Hooks**: Append bootloader rules and `file://` reference links to prompts.\n4. **Log Results**: Record updates in `ANTIGRAVITY-LOG.txt` and `ANTIGRAVITY-REGISTRY.md`.\n"}, {"id": "skill:infrastructure:mcp-config-sync", "name": "mcp-config-sync", "cat": "infrastructure", "ver": "2.0.0", "status": "active", "desc": "Provider-neutral entry point for discovering, planning and synchronizing MCP configuration between user-selected providers and app classes. The user selects truth, targets and scope; no provider is an implicit hub.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: mcp-config-sync\nversion: 2.0.0\ntype: skill\nauthor: Lukas Geiger + Claude + Codex\ncreated: 2026-05-16\nupdated: 2026-07-27\ndescription: Provider-neutral entry point for discovering, planning and synchronizing MCP configuration between user-selected providers and app classes. The user selects truth, targets and scope; no provider is an implicit hub.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: false\ncategory: infrastructure\ntags: [mcp, config, sync, provider-neutral, discovery, multi-agent]\nlanguage: de\nstatus: active\ndependencies: {'tools': ['python'], 'services': [], 'protocols': ['agent-config-sync'], 'python': []}\nprovenance: {'origin': 'custom', 'origin_path': 'skills/infrastructure/mcp-config-sync/', 'origin_version': '2.0.0', 'last_sync_from_origin': None, 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"mcp-config-sync banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# MCP Config Sync (Deutsch)\n\nThis is the MCP-focused entry point to `agent-config-sync`. It assumes no\nprovider, app or master file.\n\n1. Ask which concrete endpoints or axes the user wants: within one provider\n   across app classes, within one app class across providers, an explicit list,\n   or every detected provider and class.\n2. Run `agent-config-sync/scripts/sync.py --discover`, then `--offer`.\n3. Present detected endpoints separately from unverified candidates.\n4. Let the user choose truth source, targets, direction and conflict policy.\n5. Materialize `registry.json`, review `--plan`, and only then use\n   `--apply --yes`.\n\nDiscovery and offers are read-only. There is no implicit hub and no implicit\n“sync all”. The former Claude Code↔Claude Desktop scripts are a legacy profile,\nnot the generic default."}, {"id": "skill:infrastructure:metacognitive-injectors", "name": "metacognitive-injectors", "cat": "infrastructure", "ver": "1.4.0", "status": "active", "desc": "Metakognitive Injektoren und Selbstgesprächs-Strategien (Self-Talk, Metacognitive Auditing, Evaluator Hooks, Pre-Flight Checklists, State Persistence & Personas). Integriert Aktive Informationssuche (Systemgedächtnis Gardener & USMC), Rehearsal (Aktives Abrufen & Wiedergeben), Baddeleys Arbeitsgedächtnis (State + Hooks), Miyake Exekutivfunktionen sowie CBT/ACT therapeutische Strategien.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: metacognitive-injectors\nversion: 1.4.0\ntype: skill\nauthor: Lukas Geiger + Gemini (Antigravity)\ncreated: 2026-07-30\nupdated: 2026-07-30\ndescription: >\n  Metakognitive Injektoren und Selbstgesprächs-Strategien (Self-Talk, Metacognitive Auditing, Evaluator Hooks, Pre-Flight Checklists, State Persistence & Personas).\n  Integriert Aktive Informationssuche (Systemgedächtnis Gardener & USMC), Rehearsal (Aktives Abrufen & Wiedergeben), Baddeleys Arbeitsgedächtnis (State + Hooks),\n  Miyake Exekutivfunktionen sowie CBT/ACT therapeutische Strategien.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\ncategory: infrastructure\ntags: [metacognition, self-talk, metacognitive-injectors, evaluator-hook, quality-gate, multi-agent, auditing, pre-flight-checklist, working-memory, active-retrieval, rehearsal, gardener, usmc, state-persistence, hooks, survival-routing, persona-routing]\naliases: [self-talk, metacognitive-self-talk, metacognitive-auditing, evaluator-hook, preflight-checklist, inner-speech, active-retrieval, rehearsal]\nlanguage: de\nstatus: active\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"metacognitive-injectors banner\">\n\n# Metakognitive Injektoren (Metacognitive-Injectors, Active Retrieval & Memory Search)\n\nDie Habilidad **Metacognitive-Injectors** (auch bekannt als **`self-talk`**, **`metacognitive-auditing`**, **`evaluator-hook`**, **`preflight-checklist`**, **`inner-speech`**, **`active-retrieval`** und **`rehearsal`**) etabliert kognitionspsychologische und therapeutisch fundierte Selbstüberwachungs-Strategien für KI-Agenten.\n\n---\n\n## 1. Aktive Informationssuche & Systemgedächtnis (Gardener & USMC)\n\n### A. Aktive Informationssuche in Systemgedächtnissen\n- Vor Annahmen oder vorschnellen Behauptungen **aktiv in den Systemgedächtnissen suchen**:\n  1. **Gardener DB (`gardener.py` / `hb_garden_*`):** Durchsucht beobachtete Lerneffekte, Nutzerentscheidungen und Pfadvereinbarungen (z. B. `Gardener().find(\"companion\")`).\n  2. **USMC SQLite DB (`usmc_memory.db`):** Fragt gespeicherte Fakten, Lektionen und Sitzungsverläufe ab.\n  3. **Zentrale Regeldateien (`CLAUDE.md`, `.SYNC`, `AGENTS.md`):** Liest bestehende Konventionen und Pfadangaben.\n\n### B. Rehearsal: Aktives Abrufen & Wiedergeben (Retrieval Practice)\n- **Subvokale Rehearsal-Schleife (Phonologische Schleife):**\n  Informationen nicht nur passiv einlesen, sondern vor der Ausführung **aktiv abrufen, im Arbeitsgedächtnis rekonstruieren und mit der Realität abgleichen**.\n  - *\"Habe ich den genauen Pfad zum Script im Gedächtnis abgerufen?\"*\n  - *\"Stimmt die Befehlssyntax mit den im Systemgedächtnis abgelegten Beispielen überein?\"*\n\n---\n\n## 2. Kognitionswissenschaftliche & Therapeutische Fundierung\n\n### A. Working Memory = State + Hooks (Baddeley & Cowan)\n- **State (Gedächtnis-Inhalt):** Persistiert flüchtige Zwischenstände nach jedem Teilschritt in SQLite-Tabellen (`usmc_memory.db`), `AUTOMATIONS-MEMORY.md` oder lokalen State-Buffern.\n- **Hooks (Steuerungs-Mechanik):** Preflight-Bootloader, Letter-Hooks und PreToolUse/PostToolUse Evaluator-Hooks.\n\n### B. Miyakes Exekutivfunktionen (Command & Control)\n1. **Inhibition (Impulskontrolle):** Unterdrückt vorschnelles Sign-Off und halluzinierte Erfolgsmeldungen.\n2. **Shifting (Kognitive Flexibilität):** Schaltet bei Blockaden dynamisch auf Survival-Routing, Persona-Modi oder alternative Lösungswege um.\n3. **Updating (Arbeitsgedächtnis-Update):** Aktualisiert fortlaufend den Arbeitszustand.\n\n### C. Therapeutische Impulse (CBT, ACT & lösungsorientierte Therapie)\n- **CBT Kognitive Umstrukturierung:** Reframing von Fehlern als wertvollen diagnostischen Daten.\n- **ACT Kognitive Defusion & Akzeptanz:** Eigene Unsicherheit als Zustand akzeptieren und offenlegen.\n- **Verhaltensexperimente:** Ausführen von Smoke-Tests/Dry-Runs zur Erbringung echter empirischer Evidenz.\n\n---\n\n## 3. Multi-Modell Ausweichkette & Codex Companion Schnittstelle\n\n| Priorität | Berater / Prüfer | Schnittstelle / Befehl | Funktion / Regel |\n| :--- | :--- | :--- | :--- |\n| **Primär (1)** | **Gemini Subagent** | `invoke_subagent` / `define_subagent` | Schneller interner Prüfer für Routine-Checks. |\n| **Sekundär (2)** | **Codex Companion (Native)** | `node \"<USER_HOME>\\.codex\\.tmp\\marketplaces\\openai-codex\\plugins\\codex\\scripts\\codex-companion.mjs\" task \"...\"` | Nativer Codex-Companion für Prüfungen & **`/goal`-Abnahme**. |\n| **Tertiär (3)** | **Codex CLI Direct** | `codex exec --skip-git-repo-check` | Direktaufruf der Codex CLI. |\n| **Quartär (4)** | **Claude CLI / Swarm** | `claude -p ...` / `hb_swarm_consensus` | Drittmeinung bei Token-Grenzen. |\n\n---\n\n## 4. Bereichsspezifische Prompt-Injektion (Tailored Injection Pattern)\n\nDer Injektor (`agy_metacognitive_prompt_injector.py`) wählt bereichsspezifisch die passenden Strategien aus:\n\n- **Grund-Block (alle Sidecars):** Anti-Hohl-Vollzug, `/goal`-Abnahme durch externes Modell, Aktive Informationssuche (Gardener/USMC), Rehearsal (Aktives Abrufen), Pre-Flight Checklist.\n- **Research-Sidecars (`research-*`):** Erweitert um *Evidenzbasierte Recherche (keine Quelle ohne Abfragebeleg)*, *CBT Reframing & Kognitive Defusion (Nichtergebnisse als Befund)*.\n- **Software-/Roblox-Sidecars (`software-*`, `roblox-*`):** Erweitert um *Phonologische Schleife & Rehearsal*, *Working Memory State Persistence*, *Survival-Routing*.\n- **Maintainer & Generalists (`maintainer-*`, `generalist-*`):** Erweitert um *Aktive Informationssuche*, *Skill-Finder* und *Memory Hooks*.\n"}, {"id": "protocol:infrastructure:orchestrator", "name": "orchestrator", "cat": "infrastructure", "ver": "1.1.0", "status": "active", "desc": "Providerneutrales Protokoll zum Zerlegen komplexer Aufgaben, zum Beauftragen unabhängiger Worker und zur evidenzbasierten Abnahme ihrer Ergebnisse.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: orchestrator\nversion: 1.1.0\ntype: protocol\nauthor: Claude + Codex\ncreated: 2026-06-17\nupdated: 2026-07-28\ndescription: Providerneutrales Protokoll zum Zerlegen komplexer Aufgaben, zum Beauftragen unabhängiger Worker und zur evidenzbasierten Abnahme ihrer Ergebnisse.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: infrastructure\ntags: [orchestrierung, multi-agent, delegation, evidenz, checkpoint, workflow]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'custom', 'origin_path': 'local-agent-skills/orchestrator/', 'origin_version': '1.0.0', 'origin_repo': 'None', 'last_sync_from_origin': '2026-07-28', 'last_sync_to_origin': 'None', 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"orchestrator banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n> **English Translation** — Official English version of `orchestrator`.\n\n\n# Orchestrator (Deutsch)\n\n## Übersicht & Zweck\n\nNutze diesen Skill, wenn eine Aufgabe aus mindestens zwei weitgehend unabhängigen\nArbeitspaketen besteht und Delegation einen echten Zeit-, Kontext- oder\nQualitätsvorteil bringt. Für kleine, eng gekoppelte Aufgaben arbeite direkt.\n\nDer Skill beschreibt ein Protokoll. Das konkrete Starten, Unterbrechen und\nWiederaufnehmen von Workern erfolgt über die Fähigkeiten der jeweiligen Runtime.\n\n## Autoritätsgrenze\n\nDelegation erweitert keine Berechtigung. Jeder Worker erhält höchstens den Scope\nund die Änderungsrechte, die für die Hauptaufgabe bereits gelten. Externe,\nirreversible oder anderweitig freigabepflichtige Aktionen bleiben\nfreigabepflichtig.\n\n## Ablauf\n\n### 1. Lage prüfen\n\n1. Ziel, Erfolgskriterien und Ausschlüsse der Hauptaufgabe festhalten.\n2. Projektregeln, Sperren, laufende Änderungen und verfügbare Budgets prüfen.\n3. Vor dem Dispatch den aktuellen Lock-, Status- und Diff-Zustand der betroffenen\n   Bereiche als Baseline sichern. Nur so lassen sich vorhandene fremde Änderungen\n   später zuverlässig von Worker-Änderungen unterscheiden.\n4. Nur Arbeitspakete parallelisieren, die unabhängig genug sind.\n5. Überschneidende Schreibbereiche trennen oder sequentiell bearbeiten.\n\n### 2. Auftragsvertrag schreiben\n\nVor jedem Dispatch einen kurzen, prüfbaren Vertrag erstellen:\n\n| Feld | Pflichtinhalt |\n|---|---|\n| Kennung | stabile ID des Arbeitspakets |\n| Ziel | genau ein konkretes Ergebnis |\n| Eingaben | relevante Dateien, Daten oder Kontextquellen |\n| Positiver Scope | was gelesen oder geändert werden darf |\n| Negativer Scope | was ausdrücklich unberührt bleibt |\n| Erfolgskriterium | beobachtbare Bedingung für „fertig“ |\n| Evidenz | erwarteter Nachweis, etwa Test, Diff oder Fundstelle |\n| Rückgabeformat | kompakte, strukturierte Abschlussmeldung |\n\nEin Worker bekommt nur den Kontext, den er für diesen Vertrag benötigt.\n\n### 3. Ausführen und beobachten\n\n- Fan-out klein halten und nur bei unabhängigem Nutzen vergrößern.\n- Fortschritt über Runtime-Status oder einen projektüblichen Checkpoint verfolgen.\n- Bei Konflikten, Scope-Ausweitung oder fehlender Autorität stoppen und eskalieren.\n- Ein fehlgeschlagener Worker darf unabhängige Arbeitspakete nicht automatisch\n  blockieren.\n\n### 4. Ergebnisse abnehmen\n\nEine Fertigmeldung ist zunächst eine Behauptung. Der Orchestrator prüft selbst:\n\n1. Existiert das behauptete Artefakt oder die genannte Änderung?\n2. Gehört es zum vereinbarten Scope?\n3. Besteht der vereinbarte Test oder Nachweis aktuell?\n4. Wurden fremde Änderungen, Sperren und negative Scopes respektiert?\n5. Widersprechen sich Ergebnisse verschiedener Worker?\n\nErst danach gilt ein Arbeitspaket als abgeschlossen.\n\n### 5. Integrieren und sichern\n\n- Konflikte bewusst auflösen; Ergebnisse nicht blind aneinanderhängen.\n- Erforderliche Gesamttests nach der Integration erneut ausführen.\n- Offene, fehlgeschlagene und zurückgestellte Pakete klar ausweisen.\n- Bei längeren Läufen Ziel, Status, Evidenz und nächsten Schritt in einem\n  wiederauffindbaren Checkpoint sichern.\n\n## Minimaler Worker-Prompt\n\n```text\nAuftrag: <Kennung und Ziel>\nEingaben: <Quellen>\nDu darfst: <positiver Scope>\nDu darfst nicht: <negativer Scope>\nFertig, wenn: <prüfbares Kriterium>\nBelege mit: <Test, Diff oder Fundstelle>\nAntworte als: <Rückgabeformat>\n```\n\n## Stop-Bedingungen\n\nStoppe nur das betroffene Arbeitspaket, wenn sein Scope, seine Autorität oder\nseine Evidenz unklar wird. Unabhängige, sichere Pakete dürfen weiterlaufen.\n\nStoppe die gesamte Delegation, wenn:\n\n- die Teilaufgaben nicht mehr unabhängig sind,\n- ein gemeinsamer Schreibbereich nicht sicher getrennt werden kann,\n- Regeln, Sperren oder Autorität für den gesamten verbleibenden Scope unklar sind,\n- die erwarteten Kosten den erkennbaren Nutzen übersteigen,\n- die geforderte Evidenz nicht erzeugt oder geprüft werden kann.\n\n## Änderungsprotokoll\n\n### 1.1.0 (2026-07-28)\n- Nutzer-, Pfad-, Modell- und Providerbindungen entfernt.\n- Auftragsvertrag, Autoritätsgrenze, Evidenzabnahme und Checkpoints als\n  portable Kernmechanik herausgearbeitet.\n- Baseline für fremde Änderungen sowie paketlokale und globale Stopps\n  ausdrücklich getrennt.\n\n### 1.0.0 (2026-06-17)\n- Lokale Ausgangsfassung."}, {"id": "skill:infrastructure:rotation-check", "name": "rotation-check", "cat": "infrastructure", "ver": "1.1.0", "status": "active", "desc": "Standard-Gerüst für rotierende Pipeline-Checks: Pro Lauf genau ein Ziel aus einer Menge (Projekte, Ordner, Repos) wählen — bevorzugt das am längsten ungeprüfte —, den Check durchführen, Ergebnis in einer Check-Registry und einem Verlaufslog festhalten. Nutze diesen Skill, wenn ein wiederkehrender Check über viele Projekte verteilt werden soll („prüfe regelmäßig alle X auf Y\"), wenn eine Automatisierung Doppelprüfungen vermeiden muss, wenn eine Check-Registry/CHECKS-LOG-Struktur angelegt oder benutzt wird, oder wenn eine periodische Qualitätsrunde (Quellencheck, Style-Check, Health-Check, Audit) über eine Pipeline fair verteilt werden soll.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: rotation-check\nversion: 1.1.0\ntype: skill\nauthor: Lukas Geiger + Claude\ncreated: 2026-07-03\nupdated: 2026-07-03\ndescription: >\n  Standard-Gerüst für rotierende Pipeline-Checks: Pro Lauf genau ein Ziel aus einer Menge\n  (Projekte, Ordner, Repos) wählen — bevorzugt das am längsten ungeprüfte —, den Check\n  durchführen, Ergebnis in einer Check-Registry und einem Verlaufslog festhalten. Nutze\n  diesen Skill, wenn ein wiederkehrender Check über viele Projekte verteilt werden soll\n  („prüfe regelmäßig alle X auf Y\"), wenn eine Automatisierung Doppelprüfungen vermeiden\n  muss, wenn eine Check-Registry/CHECKS-LOG-Struktur angelegt oder benutzt wird, oder wenn\n  eine periodische Qualitätsrunde (Quellencheck, Style-Check, Health-Check, Audit) über\n  eine Pipeline fair verteilt werden soll.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\n\ncategory: dev\ntags: [automation, check, rotation, registry, pipeline, log, audit, wartung]\nlanguage: de\nstatus: active\n\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\n\nprovenance:\n  origin: \"custom\"\n  origin_path: null\n  origin_version: null\n  origin_repo: \"github.com/ellmos-ai/skills\"\n  last_sync_from_origin: null\n  last_sync_to_origin: null\n  local_changes_since_sync: false\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"rotation-check banner\">\n# Rotation-Check — ein Ziel pro Lauf, faire Abdeckung, Gedächtnis\n\n## Zweck\n\nWer eine Pipeline mit vielen Projekten periodisch prüfen will (Quellen, Stil, Gesundheit,\nSicherheit, Übersetzungen, …), steht vor einem Verteilungsproblem: Alle Projekte pro Lauf zu\nprüfen ist zu teuer; ohne Gedächtnis prüft jeder Lauf zufällig dasselbe. Das Rotations-Muster\nlöst beides: **genau ein Ziel pro Lauf, Auswahl nach „am längsten ungeprüft\", Registry als\nGedächtnis.** So deckt auch ein seltener Takt (täglich/wöchentlich) über Wochen die ganze\nPipeline ab — nachweisbar und ohne Doppelarbeit.\n\nBewährt als Rückgrat eines gewachsenen Bestands produktiver Automationen über mehrere\nProjekt-Pipelines hinweg.\n\n## Bausteine\n\n### 1. Zwei Dateien pro Pipeline (einmalig anlegen)\n\n| Datei | Inhalt | Charakter |\n| --- | --- | --- |\n| `CHECKED-REGISTRY.md` | eine Kompaktzeile pro Check: Ziel, Datum, Checktyp, Ergebnis, nächster Schritt | Zustandsübersicht — wird VOR jeder Zielauswahl gelesen |\n| `CHECKS-LOG.txt` | kurzer Verlaufseintrag pro Lauf mit Details/Evidenz | Journal — append-only |\n\nBeide liegen im Pipeline-Root (nicht im Einzelprojekt), damit ein Lauf sie mit einem Read\nerfassen kann. Registry-Zeilenformat:\n\n```text\n| <ziel> | <YYYY-MM-DD> | <checktyp> | <ok|befund|übersprungen> | <nächster schritt> |\n```\n\n### 2. Auswahlregel\n\n1. Registry und Log lesen (Pflicht, VOR der Auswahl — sonst Doppelprüfung).\n2. Kandidaten: Ziele, die für DIESEN Checktyp noch nie oder am längsten nicht geprüft wurden.\n3. Ausweichen, wenn das Ziel kürzlich von einem **eng verwandten** Check angefasst wurde\n   (z. B. Zitations-Check direkt nach Quellencheck bringt nichts) oder gerade gesperrt/in\n   Bearbeitung ist (Locks respektieren).\n   **Geschwister-Cooldown:** Laufen mehrere verwandte Checks über dieselbe Zielmenge\n   (z. B. Entwicklung, Bugsuche und Review derselben Pipeline), eine Karenzzeit vereinbaren\n   (Erfahrungswert: ~24 h), in der ein von einem Geschwister-Check bearbeitetes Ziel nicht\n   erneut gewählt wird — verhindert Kollisionen und widersprüchliche Parallel-Änderungen.\n4. Vorziehen außer der Reihe nur mit gutem Grund (z. B. große Überarbeitung seit letztem\n   Check) — den Grund im Log nennen.\n\n### 3. Check durchführen — mit Read-only-Exit\n\nDen eigentlichen Check (frei definierbar: Quellencheck, Style-Check, Security-Audit, …)\nauf das EINE gewählte Ziel anwenden. Zwei gültige Ausgänge:\n\n- **Befund:** beheben was in den Scope passt; Größeres als Folgeaufgabe in die projektlokale\n  TODO/AUFGABEN-Datei eintragen (der Check muss nicht alles selbst lösen).\n- **Nichts zu tun:** kurz dokumentieren und enden. Ein Leerlauf ist ein Ergebnis, kein\n  Scheitern — keinesfalls den Scope ausweiten, um „etwas gefunden zu haben\".\n\n### 4. Dokumentieren\n\n- Registry-Zeile ergänzen (kompakt), Log-Eintrag schreiben (Details/Evidenz).\n- **Log-Hygiene:** Werden Registry/Log unübersichtlich (Erfahrungswert: mehrere hundert\n  Zeilen), alten Stand nach `_archiv/` verschieben, frische Datei anlegen, im Kopf auf den\n  Vorgänger verweisen (Pfad + Datum).\n- **Pfad-Drift:** Zeigt ein erwarteter Pfad ins Leere (Ziel verschoben/umbenannt), NICHT neu\n  anlegen — über die maßgebliche Statusdatei/Registry der Pipeline korrigieren und den\n  Fehlpfad in einem Failure-Log festhalten.\n\n### 5. Takt\n\nFrequenz an die Änderungsrate des Geprüften koppeln: Rotations-Checks über stabile Bestände\nlaufen gut wöchentlich (ein Ziel pro Lauf ≈ ganze Pipeline pro Quartal bei ~12 Zielen);\nschnelllebige Checks (z. B. auf aktive Arbeit) täglich. Praxiserfahrung: anfangs stündliche\nChecks wurden fast alle auf täglich/wöchentlich reduziert — die Abdeckung blieb, die Kosten\nfielen.\n\n## Prompt-Vorlage (für Scheduler/Automation)\n\n```text\nVORBEREITUNG: Lies <PIPELINE_ROOT>/<POLICY-DOKUMENTE> sowie <REGISTRY> und <LOG>.\n\nAUFGABE: Wähle genau ein Ziel aus <ZIELMENGE>. Bevorzuge Ziele, die für den Check\n\"<CHECKTYP>\" noch nie oder am längsten nicht geprüft wurden. Wurde ein Ziel kürzlich\nvon diesem oder einem eng verwandten Check geprüft oder ist es gesperrt: ausweichen\noder read-only mit Logeintrag enden.\n\nCHECK: <konkrete Prüf-/Pflegeaufgabe und was bei Befund zu tun ist; Folgearbeiten in\ndie projektlokale TODO-Datei>.\n\nWenn keine Arbeit anfällt: kurz dokumentieren, Lauf beenden.\n\nDOKUMENTATION: Registry-Zeile in <REGISTRY> (Ziel, Datum, Checktyp, Ergebnis, nächster\nSchritt) + Verlaufseintrag in <LOG>. Bei Überlänge: alten Stand nach _archiv/ und\nfrische Datei mit Verweis.\n\nABSCHLUSS: Kurzbericht (Ziel | getan | Ergebnis | Folgeaufgaben).\n```\n\n## Red Flags\n\n| Gedanke | Realität |\n| --- | --- |\n| „Ich wähle einfach ein interessantes Projekt\" | Auswahl nur über die Registry — sonst Lieblingsprojekt-Bias und blinde Flecken. |\n| „Registry lese ich nach dem Check\" | Vorher. Sie ist das Auswahlkriterium, nicht nur das Protokoll. |\n| „Mehrere Ziele pro Lauf schaffen mehr\" | Ein Ziel hält Läufe kurz, idempotent und abbrechbar; Menge kommt über die Rotation. |\n| „Der Leerlauf war umsonst\" | Ein dokumentierter Leerlauf aktualisiert das Gedächtnis — das ist der halbe Wert des Systems. |\n\n## Verwandte Skills\n\n- `workflow-extract` — baut aus Sessions/Fremd-Automationen Automatisierungen; nutzt dieses\n  Gerüst als Standard-Baustein.\n- `pipeline-optimizer` — für den strukturellen Umbau einer Pipeline (Rotation-Check pflegt,\n  Optimizer renoviert).\n\n## Changelog\n\n### 1.1.0 (2026-07-03)\n- Geschwister-Cooldown als Auswahlregel ergänzt (Anti-Kollision zwischen verwandten\n  Checks über dieselbe Zielmenge; Befund aus der Vollklassifikation des Automations-Bestands).\n\n### 1.0.0 (2026-07-03)\n- Initiale Version. Abstrahiert aus dem Codex-Automations-Bestand (Rotations-Muster in\n  ~40 von 77 Automationen: Research-/Software-/Roblox-Checks mit CHECKED-REGISTRY/CHECKS-LOG).\n"}, {"id": "skill:infrastructure:semantic-persona-routing", "name": "semantic-persona-routing", "cat": "infrastructure", "ver": "1.0.0", "status": "active", "desc": "Builds and uses a provider-neutral semantic routing graph from personas, coordinating roles, experts and live skill endpoints. Use when an LLM should route a request through boss-role to expert to skill, extract a portable persona router from an existing agent system, combine a semantic domain map with a lexical skill registry, or expose missing role-to-skill ports instead of silently falling back. Triggers on semantic persona routing, persona umbrella, role router, boss-agent expert skill routing, agent-role export, or requests to make personas reusable across LLM providers.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: semantic-persona-routing\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger + OpenAI\ncreated: 2026-07-28\nupdated: 2026-07-28\ndescription: >\n  Builds and uses a provider-neutral semantic routing graph from personas,\n  coordinating roles, experts and live skill endpoints. Use when an LLM should\n  route a request through boss-role to expert to skill, extract a portable\n  persona router from an existing agent system, combine a semantic domain map\n  with a lexical skill registry, or expose missing role-to-skill ports instead\n  of silently falling back. Triggers on semantic persona routing, persona\n  umbrella, role router, boss-agent expert skill routing, agent-role export, or\n  requests to make personas reusable across LLM providers.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: false\ncategory: infrastructure\ntags: [persona, semantic-routing, agents, experts, skills, umbrella, provider-neutral]\nlanguage: en\nstatus: active\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\nprovenance:\n  origin: \"custom\"\n  origin_path: null\n  origin_version: null\n  origin_repo: \"github.com/ellmos-ai/skills\"\n  last_sync_from_origin: null\n  last_sync_to_origin: null\n  local_changes_since_sync: false\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"semantic-persona-routing banner\">\n\n# Semantic Persona Routing\n\nRoute by capability first and apply personality second. Build a portable map that\nkeeps semantic role choice, deterministic endpoint lookup and provider-specific\nloading separate.\n\n## Routing model\n\n```text\nrequest\n  -> semantic domain/coordinator role\n  -> expert capability\n  -> explicit or live-resolved skill endpoint\n  -> optional persona overlay\n  -> provider adapter loads and executes\n```\n\nA persona controls communication style, priorities and interaction patterns. It\ndoes not grant tools, permissions or subject-matter capability. A role coordinates;\nan expert narrows the domain; a skill is the executable endpoint.\n\n## Build the routing map\n\nUse explicit metadata as authority and lexical similarity only as a candidate:\n\n```bash\npython scripts/build_routing_map.py \\\n  --roles-dir path/to/roles \\\n  --personas-dir path/to/personas \\\n  --skills-dir path/to/skills \\\n  --out routing-map.json\n```\n\nThe builder understands common `SKILL.md` fields such as `type`,\n`orchestrates.experts`, `parent_agents`, `skills`, descriptions and provenance.\nIt produces a runtime map without requiring the source system to be installed.\nRead [routing-map-schema.md](references/routing-map-schema.md) before extending the\nformat.\n\nEach exported skill ID is unique. When multiple source files declare the same\nstable ID, the builder selects the lexicographically first relative source path\ndeterministically and records a `duplicate-skill-id` issue; it never emits two\nskill entries with the same ID. Declared expert and persona skill references are\nnormalized to a clean ID only when that ID exists in the exported registry.\nMalformed, unknown, and normalized references stay visible in `issues`; unknown\nor invalid references never become endpoints or persona compatibility links.\n\nDo not automatically promote `candidate_skills`. Confirm them against a live skill\nresolver or source metadata first.\n\n## Route a request\n\n### 1. Select the coordinator role semantically\n\nCompare the request with role names, descriptions and use cases. Prefer the\nnarrowest role that can coordinate the whole request. Keep multiple candidates\nvisible when confidence is low; ask the user only when the choice materially\nchanges the result.\n\n### 2. Select an expert within the role\n\nUse only experts connected to the chosen coordinator unless the request clearly\nspans roles. A direct expert request may skip the coordinator for execution, but\nretain the coordinator link in the route explanation.\n\n### 3. Resolve executable endpoints\n\nResolve in this order:\n\n1. `endpoint_skills` from explicit source metadata or exact provenance;\n2. a current external skill resolver or local skill finder;\n3. verified `candidate_skills`;\n4. visible `GAP` when no endpoint exists.\n\nNever route to an expert name as though it were an installed skill. A missing\nendpoint is a porting gap, not permission to fabricate one.\n\nRead [endpoint-resolution.md](references/endpoint-resolution.md) when connecting a\nlive registry, lexical finder or provider-specific skill loader.\n\n### 4. Apply the persona overlay\n\nChoose a persona attached to the selected role or expert. If several personas fit,\nprefer one whose declared limits and style match the task. Apply no persona when\nnone is explicitly connected.\n\nPersona instructions cannot override safety rules, locks, user decisions,\nprofessional boundaries or tool permissions.\n\n### 5. Load and execute\n\nUse the provider's native skill/agent loading mechanism. Load the selected live\nskill instructions before execution. Keep the router lean; execution belongs to\nthe worker or current agent with the resolved skills loaded.\n\n## Route receipt\n\nReturn or record:\n\n```text\nROLE: <coordinator or direct>\nEXPERT: <expert or n/a>\nSKILLS: <verified live endpoints>\nPERSONA: <overlay or none>\nRESOLUTION: explicit | provenance | live-resolver | verified-candidate | GAP\nCONFIDENCE: high | medium | low\nWHY: <one short reason>\nGAPS: <missing endpoints or stale-map warnings>\n```\n\nRebuild the map when source roles or skill inventory change. A live resolver may\nsupersede a stale map for endpoint availability, but it must not silently rewrite\nthe semantic role taxonomy.\n\n## Example\n\nRequest: \"Organize my receipts and prepare the tax-year overview.\"\n\nThe router selects an office coordinator, then the tax expert, resolves the\ninstalled tax skill, and finally applies an explicitly linked meticulous tax\npersona. If the tax expert exists but no portable tax skill is installed, report\n`GAP` and continue only through an explicitly configured fallback.\n\n## Changelog\n\n### 1.0.0 (2026-07-28)\n\n- Extracted the provider-neutral role/expert/skill chain from a proven domain\n  router pattern and added portable map generation with visible endpoint gaps.\n"}, {"id": "skill:infrastructure:skill-explorer", "name": "skill-explorer", "cat": "infrastructure", "ver": "1.1.0", "status": "active", "desc": "Manages your own skill landscape: surveys and compares existing skills (Audit mode), researches the web for new skills/plugins (Explore mode), and is at the same time the installer that generates lean subskills (Skill-Finder, family umbrella, maintenance skills) instead of loading a monolith. Use this skill for \"compare/audit skills\", \"which skills are duplicated\", \"form skill families\", \"clean up/consolidate skills\", \"maintain the skill register\", \"find skills/plugins for topic X\", \"install new skills\", \"browse the skill marketplace\", or for `/skill-explorer`. Delivers a sub-report per family and a globally numbered decision list; installs/uninstalls only after a security check and explicit approval.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: skill-explorer\nversion: 1.1.0\ntype: skill\nauthor: Lukas Geiger + Claude\ncreated: 2026-06-17\nupdated: 2026-06-17\ndescription: Manages your own skill landscape: surveys and compares existing skills (Audit mode), researches the web for new skills/plugins (Explore mode), and is at the same time the installer that generates lean subskills (Skill-Finder, family umbrella, maintenance skills) instead of loading a monolith. Use this skill for \"compare/audit skills\", \"which skills are duplicated\", \"form skill families\", \"clean up/consolidate skills\", \"maintain the skill register\", \"find skills/plugins for topic X\", \"install new skills\", \"browse the skill marketplace\", or for `/skill-explorer`. Delivers a sub-report per family and a globally numbered decision list; installs/uninstalls only after a security check and explicit approval.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: infrastructure\ntags: [skills, audit, cluster, recherche, install, security, installer, meta, workflow, branch, fork]\nlanguage: de\nstatus: active\ndependencies: {'tools': ['git'], 'services': ['websearch'], 'protocols': [], 'python': []}\nprovenance: {'origin': 'custom', 'origin_path': '~/.claude/skills/skill-explorer/', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/skills', 'last_sync_from_origin': None, 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"skill-explorer banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Skill-Explorer — Manage the Skill Landscape (Audit · Explore · Installer) (Deutsch)\n\n## Übersicht & Zweck\n\nAs the skill inventory grows, duplicates, unused resources, and unclear \"which skill instead of which\"\nsituations arise — and there are constantly new skills/plugins out there. `skill-explorer`\nbundles three roles into one tool:\n\n| Role | What it does | Detail |\n| --- | --- | --- |\n| **Audit mode** (inward) | survey all skills, cluster them into families, gather capabilities/dependencies/resources, produce a sub-report + numbered recommendations per family | `references/audit-mode.md` |\n| **Explore mode** (outward) | research the web (web/GitHub/Reddit, bilingual) for new skills/plugins on a topic, compare, install gated | `references/explore-mode.md` |\n| **Installer** | *generate* lean subskills instead of a monolith — Skill-Finder, family umbrella, maintenance skills | below + `references/family-care.md` |\n\nInvocation: `/skill-explorer` (Audit as default) or \"… find for topic X\" (Explore). Both modes share\na taxonomy (`references/clustering.md`), a report format (`references/report-format.md`), and the\nnumbering scheme, so the user can respond with a single numbered list.\n\n## Installer Principle & Persistence\n\nInstead of growing monolithically itself, `skill-explorer` *generates* lean, individually\nloadable subskills on demand — so an overlong single skill never has to be loaded:\n\n- **Skill-Finder** ([F]) — an active finder/router analogous to a \"using-superpowers\" doorman that reads\n  the register before every task and routes to the matching family (`references/skill-finder.md`,\n  template `assets/skill-finder-template.md`).\n- **Family umbrella** (c1) — a meta-skill that knows an entire family (`assets/family-umbrella-template.md`).\n- **Maintenance skills** ([P1] families, [P2] register) — keep families/register up to date (`references/family-care.md`).\n\nDecisions are persisted in `~/.claude/skills/skill-explorer/config.json`\n(`references/config.md`, template `assets/config.example.json`): read at startup (known\nfamilies/routers/generated subskills), update after execution — so a re-run never creates anything twice.\n\n## Branch Mechanism (Customizing Third-Party Skills)\n\nA read-only skill (plugin, imported third-party) can be customized without modifying the original:\nthe original directory is copied in full (**branch**); only the copy is then edited. The branch\ncarries four mandatory fields: a reference to the original, the branch date, the author, and the\nreason. Once the branch supersedes the original, the original is deregistered from the runtime\n(`SKILL.md` → `CONTENT.md`) or the family router is pointed to the branch, so two nearly identical\nskills do not collide. Third-party branches stay **private** — they do not go into the public\n`.AI/.SKILLS` library. Details: `references/skill-branching.md`.\n\n## Workflow & Vorgehen\n\n1. **Choose mode:** survey/clean up the inventory → Audit mode. Search/install from outside →\n   Explore mode. (Explore can build on a previous audit/`config.json`.)\n2. **Audit mode** (`references/audit-mode.md`): inventory (script) → family clusters → sub-reports →\n   **one globally numbered decision list** (a/b/c1/c2/c3, plus R/F/P1/P2).\n3. **Explore mode** (`references/explore-mode.md`): bilingual multi-source research → 3 categories\n   per candidate → impact simulation → numbered install/remove recommendations.\n4. **Execute** only after the user's numeric confirmation; register skill creation/changes and\n   update `config.json`.\n\n## Iron Rules\n\n- **Survey ≠ mutation:** cluster everything, but only edit **user-owned** skills; plugin/third-party\n  skills are read-only (never modify the header/delete). To customize a third-party skill, create a\n  **branch** (fork copy) instead — the original remains untouched, all changes are made exclusively\n  on the copy (→ `references/skill-branching.md`).\n- **Extend the register, do not duplicate:** if a skill register exists (index + family map +\n  index skill), extend it instead of creating a fourth one.\n- **Security primarily manual:** before every installation, the model reads the skill itself and judges;\n  `scripts/scan_skill_security.py` is only supporting triage with known limits. Never auto-install.\n- **Registration by origin:** user-authored → Library; third-party → external path, **not** Library.\n\n## Orchestration (model-neutral)\n\nFamily sub-reports or sources/languages are independent work paths. If the platform offers\ncheaper subagents than the orchestrator itself, assign one subagent per family/source\nand, as orchestrator, only consolidate/verify (specialist swarm). Otherwise sequentially yourself.\n\n## Resources\n\n- **Modes:** `references/audit-mode.md`, `references/explore-mode.md`\n- **Shared:** `references/clustering.md`, `references/report-format.md`, `references/config.md`\n- **Audit:** `references/family-care.md`, `references/skill-finder.md`\n- **Explore:** `references/research-method.md`, `references/integration-sim.md`, `references/install-uninstall.md`\n- **Branch:** `references/skill-branching.md`\n- **Scripts:** `scripts/inventory_skills.py` (inventory), `scripts/inject_family_header.py` (header router),\n  `scripts/scan_skill_security.py` (security triage)\n- **Templates:** `assets/family-umbrella-template.md`, `assets/skill-finder-template.md`,\n  `assets/skill-register-template.md`, `assets/config.example.json`, `assets/branch-header.example.md`\n\n## Änderungsprotokoll\n\n### 1.1.0 (2026-06-17)\n- Added branch mechanism: third-party/read-only skills can be customized via a fork copy (branch)\n  — with a reference to the original, date, author, and reason; the original remains untouched.\n  Iron rule \"Survey ≠ mutation\" extended with branch escape hatch. New section\n  `## Branch Mechanism`. New files: `references/skill-branching.md`, `assets/branch-header.example.md`.\n\n### 1.0.0 (2026-06-17)\n- Initial version. Unites inventory audit (family clustering, numbered decisions) and\n  web research (gated install with security triage) in one installer that generates lean subskills."}, {"id": "skill:infrastructure:skill-extractor", "name": "skill-extractor", "cat": "infrastructure", "ver": "1.0.0", "status": "active", "desc": "Extrahiert aus einem Chatverlauf (aktuelle Session oder Transkript-Dateien) einen wiederverwendbaren Skill — oder verbessert einen sehr ähnlichen existierenden Skill, statt ein Duplikat zu erzeugen. Nutze diesen Skill bei „mach daraus einen Skill\", „das sollten wir als Skill festhalten\", „extrahiere Skills aus diesem/alten Chatverläufen\", „diese Arbeitsweise wiederverwendbar machen\", oder bei `/skill-extract`. Deckt auch Bulk-Läufe über viele alte Transkripte ab (mit Datenreduktion über Subagenten). Für wiederkehrende AUTOMATISIERUNGEN (Cron/Schedule/Loop) stattdessen den Schwester-Skill workflow-extract nutzen.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: skill-extractor\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger + Claude\ncreated: 2026-07-03\nupdated: 2026-07-03\ndescription: Extrahiert aus einem Chatverlauf (aktuelle Session oder Transkript-Dateien) einen wiederverwendbaren Skill — oder verbessert einen sehr ähnlichen existierenden Skill, statt ein Duplikat zu erzeugen. Nutze diesen Skill bei „mach daraus einen Skill\", „das sollten wir als Skill festhalten\", „extrahiere Skills aus diesem/alten Chatverläufen\", „diese Arbeitsweise wiederverwendbar machen\", oder bei `/skill-extract`. Deckt auch Bulk-Läufe über viele alte Transkripte ab (mit Datenreduktion über Subagenten). Für wiederkehrende AUTOMATISIERUNGEN (Cron/Schedule/Loop) stattdessen den Schwester-Skill workflow-extract nutzen.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: infrastructure\ntags: [skills, extraction, transcript, chatverlauf, meta, dedup, neutralisierung, workflow]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'custom', 'origin_path': 'None', 'origin_version': 'None', 'origin_repo': 'github.com/ellmos-ai/skills', 'last_sync_from_origin': 'None', 'last_sync_to_origin': 'None', 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"skill-extractor banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n> **English Translation** — Official English version of `skill-extractor`.\n\n\n\n# Skill-Extractor — aus Chatverläufen Skills gewinnen (Deutsch)\n\n## Übersicht & Zweck\n\nWertvolle Arbeitsweisen entstehen in Sessions: Ein Problem wurde mühsam gelöst, der User hat\nmehrfach korrigiert, am Ende steht ein funktionierender Ablauf — und beim nächsten Mal fängt\nder Agent wieder bei null an. Dieser Skill destilliert aus einem Chatverlauf das, was sich zu\nkonservieren lohnt, und macht daraus einen Skill nach den Konventionen der lokalen\nSkill-Bibliothek. Kernprinzip: **Erweitern vor Neuanlegen** — existiert ein sehr ähnlicher\nSkill, wird der verbessert statt ein Duplikat erzeugt.\n\nAbgrenzung: Ergebnis ist hier ein **abrufbarer Skill** (Fähigkeit/Verfahren, das ein Agent bei\nBedarf lädt). Soll aus dem Verlauf eine **selbstlaufende Automatisierung** werden (wiederkehrender\nPrompt, Cron, Schedule), den Schwester-Skill `workflow-extract` nutzen.\n\n## Ablauf\n\n### 1. Quelle bestimmen\n\nDrei Eingabeformen:\n\n| Quelle | Zugang |\n| --- | --- |\n| **Aktuelle Session** | Konversationskontext direkt nutzen — keine Dateien nötig |\n| **Einzelne Transkripte** | Dateien lesen; Fundorte und Parsing: `transcript-quellen.md` |\n| **Bulk (viele alte Verläufe)** | Erst Datenreduktion über Subagenten, dann Extraktion: Abschnitt „Bulk-Modus\" |\n\n### 2. Extraktionswürdiges finden\n\nNicht jede Session enthält einen Skill. Suche nach diesen Signalen — sie zeigen, wo Wissen\nsteckt, das teuer erworben wurde und wieder gebraucht wird:\n\n- **Wiederholung:** Derselbe Ablauf kam ≥2-mal vor (in dieser oder über mehrere Sessions).\n- **Korrekturschleifen:** Der User hat den Agenten mehrfach nachjustiert, bis es stimmte —\n  die Endfassung ist das Destillat, die Korrekturen sind die Begründungen („warum so\").\n- **Explizite Marker:** „merk dir das\", „so machen wir das immer\", „beim nächsten Mal direkt so\".\n- **Werkzeugketten:** Eine nicht-offensichtliche Abfolge von Tools/Befehlen, die funktioniert hat\n  (inklusive der Sackgassen, die vermieden werden sollen).\n- **Entscheidungsregeln:** Kriterien, nach denen zwischen Alternativen gewählt wurde.\n\nHalte pro Kandidat fest: Auslöser (wann braucht man das), Ablauf (Schritte), Begründungen\n(warum so und nicht anders), Fallstricke (was schiefging), Ergebnisform.\n\n### 3. Dedup-Gate: Erweitern vor Neuanlegen\n\nBevor irgendetwas geschrieben wird, die bestehende Landschaft prüfen:\n\n1. Kandidaten-Stichwörter gegen die Skill-Verzeichnisse suchen (Deployment-Ordner des Agenten,\n   z. B. `~/.claude/skills/`, und — falls vorhanden — die kuratierte Skill-Bibliothek als Quelle\n   der Wahrheit; ebenso registrierte Plugin-Skills).\n2. Die 2–3 nächstliegenden Skills wirklich **lesen**, nicht nur Namen vergleichen.\n3. Entscheiden:\n\n| Befund | Aktion |\n| --- | --- |\n| Kandidat ist im Kern schon abgedeckt | **Erweitern:** fehlende Elemente in den bestehenden Skill einarbeiten (neue Sektion, neue Technik, neuer Fallstrick), Version MINOR erhöhen, Changelog-Eintrag |\n| Teilüberlappung, aber anderer Kern | **Neuer Skill** mit Querverweis („Verwandte Skills\") auf die Nachbarn — keine Inhalte duplizieren, sondern verweisen |\n| Nichts Vergleichbares | **Neuer Skill** |\n\nFaustregel: Wenn mehr als die Hälfte des Kandidaten in einem bestehenden Skill steckt, wird\nerweitert. Ein Skill-Bestand voller Fast-Zwillinge ist schlechter als ein gepflegter Skill.\n\n### 4. Neutralisieren\n\nDer Rohstoff ist voller session-spezifischer Details. Vor dem Schreiben nach den Regeln in\n`neutralisierung.md` abstrahieren: Mechanik (allgemeingültig) von Konfiguration (user-/system-\nspezifisch) trennen, konkrete Pfade/Hosts/Namen durch Platzhalter oder einen klar markierten\nKonfigurationsblock ersetzen. Ziel: Der Skill funktioniert für andere User, andere Systeme,\nandere Projekte.\n\n### 5. Skill schreiben\n\n- **Format:** Konventionen der Ziel-Bibliothek beachten (Frontmatter, Namensschema, Sprache,\n  Changelog). In dieser Bibliothek: `docs/CONVENTIONS.md` (vollständiger YAML-Header,\n  kebab-case-Name, Deutsch primär, Semantic Versioning).\n- **Description „pushy\" formulieren:** Die description ist der Trigger-Mechanismus. Sowohl WAS\n  der Skill tut als auch WANN er greifen soll (typische User-Formulierungen) hineinschreiben —\n  Skills werden eher zu selten als zu oft ausgelöst.\n- **Warum vor Was:** Begründungen aus den Korrekturschleifen in den Skill übernehmen. Ein Skill,\n  der nur Schritte auflistet, wird beim ersten Sonderfall falsch angewandt; einer, der erklärt\n  warum, lässt sich übertragen.\n- **Fallstricke dokumentieren:** Die Sackgassen aus der Session sind Gold — als „Red Flags\"- oder\n  „Fallstricke\"-Abschnitt aufnehmen.\n- **Schlank halten:** Unter ~300 Zeilen; Detailmaterial in Referenzdateien auslagern, auf die die\n  SKILL.md verweist.\n\n### 6. Command-Wrapper (optional)\n\nWenn der Skill regelmäßig direkt aufgerufen werden soll, einen Slash-Command anlegen (bei\nClaude Code: kurze Markdown-Datei in `~/.claude/commands/<name>.md`, die auf den Skill zeigt\nund Argumente durchreicht). Konvention: Command = dünner Einstieg, Inhalt lebt im Skill.\n\n### 7. Registrieren und testen\n\n- In der Bibliothek ablegen (richtige Kategorie) und ins Deployment ausrollen (hier:\n  `python skill_sync.py deploy <name>` — Erstinstallation braucht den expliziten Namen).\n- Trigger-Test: 2–3 realistische Prompts formulieren, die den Skill auslösen sollten, und prüfen,\n  ob die description greift.\n- Für einen vollen Eval-Loop (Testfälle, Baseline-Vergleich, Beschreibungs-Optimierung) den\n  `skill-creator` nutzen, falls installiert — dieser Skill hier ist der Extraktor, nicht das Testlabor.\n- Index-/Routing-Pflege: Skill-Finder-/Index-Skills aktualisieren, falls vorhanden\n  (hier: `code-skill-index`, `skill-finder`-Routing-Tabelle).\n\n## Bulk-Modus: viele alte Chatverläufe\n\nTranskripte sind groß (oft >100k Tokens); niemals alle roh in einen Kontext laden.\nMap-Reduce über Subagenten (Muster: `swarm-operations`-Skill, Aufgabenschwarm):\n\n1. **Inventar:** Transkript-Dateien auflisten (Fundorte: `transcript-quellen.md`), nach Projekt/\n   Zeitraum bündeln. Bei sehr großen Beständen zuerst mit vorhandenen Kollektoren/Extraktoren\n   reduzieren (z. B. Prompt-Listener-/Studien-Datensätze, die nur User-Prompts enthalten) —\n   User-Prompts + Korrekturen tragen das meiste Signal.\n2. **Map:** Pro Bündel ein Subagent mit engem Auftrag: „Lies diese Transkripte, melde\n   Skill-Kandidaten als Kompaktliste (Auslöser, Ablauf, Begründungen, Fallstricke, Beleg-Session)\"\n   — nur die Destillate zurückgeben, nie Rohtext.\n3. **Reduce:** Kandidatenlisten zusammenführen, clustern, Duplikate mergen. Häufigkeit zählt:\n   Ein Muster, das in 5 Sessions auftaucht, ist ein stärkerer Kandidat als ein einmaliger Trick.\n4. **Gate + Bau:** Für die Top-Kandidaten Schritte 3–7 des Normalablaufs durchlaufen.\n   Dem User vor dem Massenbau eine nummerierte Kandidatenliste zur Auswahl vorlegen —\n   Bulk-Extraktion erzeugt sonst Skill-Müll.\n\n## Beispiel & Anwendung\n\n```text\nUser: „Wir haben jetzt dreimal PDF-Rechnungen nach demselben Schema geparst —\nmach daraus einen Skill.\"\n\n1. Quelle: aktuelle Session. Signal: Wiederholung (3×) + Korrektur („Beträge immer\n   als Dezimalzahl mit Punkt, nicht Komma\").\n2. Dedup-Gate: Suche findet `pdf`-Skill (generisch, Erzeugung/Extraktion) — Kern\n   überlappt nicht (hier: Rechnungs-Schema + Validierungsregeln) → neuer Skill\n   `invoice-parsing` mit Querverweis auf `pdf`.\n3. Neutralisieren: konkreter Ablageordner und Firmenname → Konfigurationsblock.\n4. Skill schreiben: Schema-Tabelle, die Komma/Punkt-Korrektur als Fallstrick,\n   Changelog 1.0.0. Trigger-Test mit „lies diese Rechnung ein\".\n```\n\n## Red Flags\n\n| Gedanke | Realität |\n| --- | --- |\n| „Ich lege schnell einen neuen Skill an\" | Dedup-Gate zuerst — Erweitern vor Neuanlegen. |\n| „Die Pfade lasse ich drin, ist ja für dieses System\" | Neutralisieren ist Pflicht; Konkretes gehört in einen Konfigurationsblock. |\n| „Der Verlauf ist lang, ich fasse aus dem Gedächtnis zusammen\" | Signale (Korrekturen, Marker) gezielt heraussuchen — das Gedächtnis glättet genau die Stellen, die den Skill wertvoll machen. |\n| „Jede Session ergibt einen Skill\" | Ohne Wiederholungs-/Korrektur-/Marker-Signal: kein Skill. |\n\n## Verwandte Skills\n\n- `workflow-extract` — gleiche Extraktion, aber Ziel ist eine selbstlaufende Automatisierung.\n- `skill-explorer` — Audit/Aufräumen der Skill-Landschaft (nutzt das Dedup-Gate in groß).\n- `skill-creator` (Plugin) — Eval-Loop und Beschreibungs-Optimierung für fertige Skills.\n- `swarm-operations` — Schwarm-Muster für den Bulk-Modus.\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-07-03)\n- Initiale Version. Entstanden aus dem Auftrag, Codex-Automatisierungen und Chatverläufe\n  systematisch zu Skills zu abstrahieren."}, {"id": "skill:infrastructure:skill-family-care", "name": "skill-family-care", "cat": "infrastructure", "ver": "0.1.0", "status": "active", "desc": "Pflege-Skill, der die Skill-Familien aktuell hält, ohne den vollen skill-explorer-Audit zu fahren. Nutze diesen Skill, wenn ein neuer Skill der richtigen Familie zugeordnet, ein Familien-Header-Router nach einer Familienänderung nachgezogen oder ein verwaister Router entfernt werden soll. Auch auslösen bei „Familien pflegen\", „neuen Skill einer Familie zuordnen\", „Router aktualisieren\", „Familien-Header setzen/entfernen\".", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: skill-family-care\nversion: 0.1.0\ntype: skill\nauthor: Lukas Geiger + Claude\ncreated: 2026-06-17\nupdated: 2026-06-17\ndescription: >\n  Pflege-Skill, der die Skill-Familien aktuell hält, ohne den vollen skill-explorer-Audit zu fahren.\n  Nutze diesen Skill, wenn ein neuer Skill der richtigen Familie zugeordnet, ein Familien-Header-Router\n  nach einer Familienänderung nachgezogen oder ein verwaister Router entfernt werden soll. Auch\n  auslösen bei „Familien pflegen\", „neuen Skill einer Familie zuordnen\", „Router aktualisieren\",\n  „Familien-Header setzen/entfernen\".\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\n\ncategory: infrastructure\ntags: [skills, familien, pflege, routing, meta]\nlanguage: de\nstatus: active\n\ndependencies:\n  tools: []\n  services: []\n  protocols: [skill-explorer, code-skill-index]\n  python: []\n\nprovenance:\n  origin: \"custom\"\n  origin_path: \"~/.claude/skills/skill-family-care/\"\n  origin_version: \"0.1.0\"\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"skill-family-care banner\">\n# Skill-Family-Care\n\n## Zweck\n\nHält die Skill-**Familien** aktuell — ohne den vollen Audit-Lauf von `skill-explorer`. Ausgegründet\nnach dem Installer-Prinzip (schlanker Subskill statt Monolith). Referenziert die Skripte von\n`skill-explorer`, kopiert sie nicht.\n\n## Quellen (nicht duplizieren)\n\n- **Familienliste:** `<USER_HOME>\\OneDrive\\.USR\\SKILL-MAP.md` (kanonische Family-/Routing-Map).\n- **Inventar (Ist-Stand):** `skill-explorer/scripts/inventory_skills.py`.\n- **Router setzen/entfernen:** `skill-explorer/scripts/inject_family_header.py`.\n- **Config (welche Familien verlinkt):** `~/.claude/skills/skill-explorer/config.json`.\n\n## Aufgaben\n\n### A — Neuen Skill einer Familie zuordnen\n1. Inventar neu erheben:\n   ```bash\n   PYTHONIOENCODING=utf-8 python ~/.claude/skills/skill-explorer/scripts/inventory_skills.py \\\n       --out ~/.skill-inventory.json --pretty\n   ```\n2. Passende Familie aus `SKILL-MAP.md` wählen (Achsen: Phase/Breite/Rigidität/Wirkung/Rohstoff).\n3. Skill als Mitglied in `config.json` (`families[<fam>].members`) und in `SKILL-MAP.md` eintragen.\n\n### B — Header-Router nach Familienänderung nachziehen\n```bash\nPYTHONIOENCODING=utf-8 python ~/.claude/skills/skill-explorer/scripts/inject_family_header.py \\\n    --family <Familie> --skills s1,s2,s3 --router \"<Wegweiser>\" --inventory ~/.skill-inventory.json\n```\n- Idempotent: ein vorhandener Block derselben Familie wird ersetzt.\n- Nur `editable`/`source=user`-Skills werden verändert (Gate im Skript).\n\n### C — Verwaisten Router entfernen\nGleiches Skript mit `--remove` (kein `--router` nötig).\n\n## Eiserne Regeln\n\n- **Survey ≠ Mutation:** nur user-eigene Skills bekommen Header. Plugin/extern nie anfassen.\n- Nach jeder Änderung `config.json` (`families[*].linked`, `updated`) aktualisieren.\n- Keine Inhalte aus der Family-Map in die Einzelskills kopieren — nur Wegweiser-Block.\n\n## Changelog\n\n### 0.1.0 (2026-06-17)\n- Initiale Version. Erzeugt vom Audit-Modus (P1).\n"}, {"id": "skill:infrastructure:skill-finder", "name": "skill-finder", "cat": "infrastructure", "ver": "0.1.0", "status": "active", "desc": "Aktiver Finder/Router für die eigenen lokalen Skills (Analogon zu using-superpowers). IMMER zu Beginn einer nicht-trivialen Aufgabe nutzen, um zu prüfen, ob ein user-Skill passt, und zum richtigen Skill zu routen. Aktiviert sich bei „welcher Skill passt\", „gibt es dafür einen Skill\", „skill finden\", oder generell vor Aufgaben, die ein lokaler Skill besser löst als ad-hoc-Arbeit.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: skill-finder\nversion: 0.1.0\ntype: skill\nauthor: Lukas Geiger + Claude\ncreated: 2026-06-17\nupdated: 2026-06-17\ndescription: >\n  Aktiver Finder/Router für die eigenen lokalen Skills (Analogon zu using-superpowers). IMMER zu Beginn\n  einer nicht-trivialen Aufgabe nutzen, um zu prüfen, ob ein user-Skill passt, und zum richtigen Skill\n  zu routen. Aktiviert sich bei „welcher Skill passt\", „gibt es dafür einen Skill\", „skill finden\",\n  oder generell vor Aufgaben, die ein lokaler Skill besser löst als ad-hoc-Arbeit.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\n\ncategory: infrastructure\ntags: [skills, finder, routing, discovery, meta]\nlanguage: de\nstatus: active\n\ndependencies:\n  tools: []\n  services: []\n  protocols: [code-skill-index]\n  python: []\n\nprovenance:\n  origin: \"custom\"\n  origin_path: \"~/.claude/skills/skill-finder/\"\n  origin_version: \"0.1.0\"\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"skill-finder banner\">\n# Skill-Finder\n\n## Die Regel\n\nVor jeder nicht-trivialen Aufgabe zuerst prüfen, ob ein lokaler Skill sie besser löst. Schon bei\ngeringem Verdacht den passenden Skill laden und **seiner Live-Anleitung folgen** (Datei lesen, nicht\naus dem Gedächtnis arbeiten). Trifft kein Skill zu, normal fortfahren.\n\n## Familien-Routing\n\n<!-- Generiert/aktualisiert aus SKILL-MAP.md + inventory_skills.py. Thema -> Familie -> Skill.\n     Pflege: Subskill skill-family-care oder neuer skill-explorer-Audit-Lauf. Stand: 2026-06-17 -->\n\n| Thema / Absicht | Familie | Skill(s) |\n|-----------------|---------|----------|\n| Problem durchdenken / analysieren | Denkwerkzeuge | `/structured-thinking` (führt `/think` → `/brainstorm` → `/decide`) |\n| neue Ideen / Kreativität | Denkwerkzeuge | `/brainstorm` (vs `/think` Analyse, `/decide` Auswahl) |\n| Entscheidungs-Stapel | Denkwerkzeuge | `/decision-briefing` |\n| Autorisiertes Nutzerprofil aufbauen oder nutzen | Multi-Agent | `build-your-users-mind` (Aufbau) · `decision-avatar` (Nutzung) |\n| Bug / Testfehler | Coding & Debugging | `/bugfix-protocol` (1 Bug), `/bugsweep` (viele, vor Release) |\n| neues/bestehendes Projekt oder Pipeline | Projekt/Pipeline | `/projekt-pipeline-umbrella` (→ bootstrapper/onboarding/optimizer) |\n| Roblox-Spiel | Game-Dev | `/roblox-dev` (→ `/rojo`, `/roblox-studio`, `/game-design`) |\n| Therapie / Beratung / Krise | Therapie | `/therapie-umbrella` (→ stabilization/guideline/counseling) |\n| Präsentation / Slides | Office | `/academic-pptx` (Inhalt) + `/pptx` (Datei) |\n| Multi-Agent-Koordination | Multi-Agent | `/swarm-operations`, `/model-strategy` |\n| Bewerbung / Selbstmanagement | Persönlich | `/bewerbungsexperte`, `/selbstmanagement` |\n| Skills vergleichen/aufräumen/finden | System/Meta | `skill-explorer` (Audit/Explore), `code-skill-index` (Liste) |\n| System aufsetzen / MCP syncen / Agenten anbinden | System/Meta | `/system-onboarding`, `/mcp-config-sync`, `/agents-bridge` |\n| Datei-Werkzeuge | Utilities | `/document-chunker`, `/migrate-rename`, `/plugin-system` |\n| Chatverlauf → Skill konservieren | System/Meta | `skill-extractor` (`/skill-extract`) |\n| Chatverlauf/Fremd-Automation → Automatisierung | System/Meta | `workflow-extract` (`/automations-extract`) |\n| wiederkehrender Check über viele Projekte | Coding & Debugging | `rotation-check` (Registry/Log-Gerüst) |\n| festgefahrenes Problem, Ideen schürfen | Denkwerkzeuge | `idea-mining` (vs `/brainstorm` = frei/breit) |\n| DE/EN-Dokumentfassungen synchron halten | Utilities | `bilingual-doc-sync` |\n| KI-Spuren/Chat-Reste aus Texten, AI-Disclosure | Utilities | `llm-text-hygiene` |\n| Bedingung/Zeitpunkt/Reihenfolge im Auftrag („erst wenn\", „ab 6 Uhr\", „sobald X fertig\") | Prozess | `condition` (`/if` · `/when` · `/if-only` · `/after` · `/and` · `/or`) |\n\nVollständige Liste: Skill `code-skill-index`.\n\n## Red Flags (Rationalisierungen, die STOP bedeuten)\n\n| Gedanke | Realität |\n|---------|----------|\n| „Das ist nur eine kurze Frage.\" | Fragen sind Aufgaben — Skill-Check zuerst. |\n| „Ich kenne das Konzept.\" | Konzept kennen ≠ Skill nutzen. Live-Datei lesen. |\n| „Der Skill ist Overkill.\" | Einfaches wird komplex — nutzen. |\n| „Ich erkunde erst selbst.\" | Skills sagen WIE man erkundet. Erst prüfen. |\n\n## Pflege\n\nRouting-Tabelle bei Familienänderung aktualisieren (Subskill `skill-family-care` oder neuer\n`inventory_skills.py`-Lauf aus `skill-explorer`).\n\n## Changelog\n\n### 0.2.0 (2026-07-03)\n- Routing-Zeilen für neue Skills: skill-extractor, workflow-extract, rotation-check,\n  idea-mining, bilingual-doc-sync (Codex-Automations-Extraktion).\n\n### 0.1.0 (2026-06-17)\n- Initiale Version. Erzeugt vom Audit-Modus ([F]) als Analogon zu using-superpowers. Routing-Tabelle\n  aus dem Audit vom 2026-06-17 (10 user-Familien).\n"}, {"id": "skill:infrastructure:skill-register-care", "name": "skill-register-care", "cat": "infrastructure", "ver": "0.1.0", "status": "active", "desc": "Pflege-Skill, der das dreiteilige Skill-Register konsistent hält (code-skill-index-Kataloge, Skill-Index, SKILL-MAP Family-/Routing-Map). Nutze diesen Skill für einen Drift-Check zwischen dem realen Skill-Inventar und dem dokumentierten Register: fehlende oder zu viele Einträge melden, Counts korrigieren, Stand-Datum setzen. Auch auslösen bei „Skill-Register pflegen\", „Index aktualisieren\", „Register-Drift prüfen\", „welche Skills fehlen in der Map\".", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: skill-register-care\nversion: 0.1.0\ntype: skill\nauthor: Lukas Geiger + Claude\ncreated: 2026-06-17\nupdated: 2026-06-17\ndescription: >\n  Pflege-Skill, der das dreiteilige Skill-Register konsistent hält (code-skill-index-Kataloge,\n  Skill-Index, SKILL-MAP Family-/Routing-Map). Nutze diesen Skill für einen Drift-Check zwischen dem\n  realen Skill-Inventar und dem dokumentierten Register: fehlende oder zu viele Einträge melden, Counts\n  korrigieren, Stand-Datum setzen. Auch auslösen bei „Skill-Register pflegen\", „Index aktualisieren\",\n  „Register-Drift prüfen\", „welche Skills fehlen in der Map\".\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\n\ncategory: infrastructure\ntags: [skills, register, index, drift, pflege, meta]\nlanguage: de\nstatus: active\n\ndependencies:\n  tools: []\n  services: []\n  protocols: [skill-explorer, code-skill-index]\n  python: []\n\nprovenance:\n  origin: \"custom\"\n  origin_path: \"~/.claude/skills/skill-register-care/\"\n  origin_version: \"0.1.0\"\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"skill-register-care banner\">\n# Skill-Register-Care\n\n## Zweck\n\nHält das **Register** drift-frei. Das Register besteht aus drei verzahnten Artefakten — niemals ein\nviertes anlegen, immer diese drei erweitern:\n\n- `~/.claude/skills/code-skill-index/references/catalog-*.md` (Kategorie-Kataloge)\n- der Skill-Index (Master-Liste)\n- `<USER_HOME>\\OneDrive\\.USR\\SKILL-MAP.md` (Family-/Routing-Map)\n\n## Drift-Check-Prozedur\n\n1. **Ist-Stand erheben:**\n   ```bash\n   PYTHONIOENCODING=utf-8 python ~/.claude/skills/skill-explorer/scripts/inventory_skills.py \\\n       --out ~/.skill-inventory.json --pretty\n   ```\n   Nur `source=user`-Skills sind register-relevant (Plugin/extern bleiben außen vor).\n2. **Soll-Stand lesen:** die drei Register-Artefakte.\n3. **Differenz bilden:**\n   - **Fehlend** (im Inventar, nicht im Register) → nachtragen.\n   - **Verwaist** (im Register, nicht mehr im Inventar) → markieren/entfernen.\n   - **Count-Abweichung** (z. B. „18 Skills\" stimmt nicht mehr) → Zahl korrigieren.\n4. **Nachtragen:** je neuer Skill eine Zeile im passenden `catalog-<kategorie>.md`, eine Zeile im\n   Skill-Index (+ Kopf-Datum) und — falls neue/geänderte Familie — ein Abschnitt in `SKILL-MAP.md`.\n5. **Stand-Datum** in allen berührten Dateien auf das aktuelle Datum setzen.\n\n## Hilfs-Snippet (fehlende user-Skills auflisten)\n\n```bash\nPYTHONIOENCODING=utf-8 python -c \"\nimport json\ninv=json.load(open('<USER_HOME>/.skill-inventory.json',encoding='utf-8'))\nprint('\\n'.join(s['dir'] for s in inv['skills'] if s['source']=='user'))\n\"\n```\nDie Ausgabe gegen die Register-Artefakte abgleichen (manuell oder per grep).\n\n## Eiserne Regeln\n\n- **Kein viertes Register** — nur die drei erweitern.\n- Nur user-authored Skills gehören ins Register; Drittanbieter folgen dem externen Pfad.\n- Datum nicht raten — aktuelles Datum setzen.\n\n## Changelog\n\n### 0.1.0 (2026-06-17)\n- Initiale Version. Erzeugt vom Audit-Modus (P2). Anlass: beim Audit 2026-06-17 fehlten ~10 user-Skills\n  in der SKILL-MAP (swarm-operations, model-strategy, agents-bridge, mcp-config-sync, system-onboarding,\n  update-cli-docs, migrate-rename, plugin-system + Therapie- und Game-Dev-Familie).\n"}, {"id": "skill:infrastructure:staircase-routing", "name": "staircase-routing", "cat": "infrastructure", "ver": "1.0.0", "status": "active", "desc": "Isolated navigation and routing strategy that searches upward and downward through directory hierarchies for signpost documents (CLAUDE.md, AGENTS.md, README.md, RULES.md) and user-configurable buzzwords (via staircase-config.json or config.json). Also known as Up-and-Down Routing or Walking Bass Routing.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: staircase-routing\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger + Gemini (Antigravity)\ncreated: 2026-07-29\nupdated: 2026-07-29\ndescription: >\n  Isolated navigation and routing strategy that searches upward and downward\n  through directory hierarchies for signpost documents (CLAUDE.md, AGENTS.md,\n  README.md, RULES.md) and user-configurable buzzwords (via staircase-config.json\n  or config.json). Also known as Up-and-Down Routing or Walking Bass Routing.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: false\ncategory: infrastructure\ntags: [routing, staircase-routing, up-and-down-routing, walking-bass-routing, signpost, navigation, directory-traversal]\nlanguage: en\nstatus: active\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\nprovenance:\n  origin: \"custom\"\n  origin_path: null\n  origin_version: null\n  origin_repo: \"github.com/ellmos-ai/skills\"\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"staircase-routing banner\">\n\n# Staircase-Routing (Up-and-Down / Walking Bass Routing)\n\nThe **Staircase-Routing** skill (also referred to as *Up-and-Down Routing* or *Walking Bass Routing*) isolates the directory document inspection strategy for AI agents.\n\nWhen an agent enters a directory or works on a file, it uses this strategy to locate authoritative context, rules, and signpost documents before modifying code or taking action.\n\n---\n\n## 1. Signpost Document Standards\n\nBy default, Staircase-Routing looks for standard signpost documents:\n- **Global & Project Controls:** `CLAUDE.md`, `AGENTS.md`, `START.md`, `RULES.md`\n- **Project Overview & Tasks:** `README.md`, `TODO.md`, `NOTIZ.md`, `BEWEISNOTIZ.md`\n- **Custom User Buzzwords:** Configured via `staircase-config.json` or `config.json`.\n\n---\n\n## 2. Traversal Algorithm\n\n```\n                           [ Root / Workspace Level ]\n                           ┌────────────────────────┐\n                           │   CLAUDE.md / RULES.md │ ◄── (Step 2: Read Root Signpost)\n                           └───────────▲────────────┘\n                                       │ (Staircase Up)\n                           ┌───────────┴────────────┐\n                           │ Subfolder / Target Dir │ ◄── (Step 1: Start at CWD)\n                           └───────────┬────────────┘\n                                       │ (Staircase Down)\n                           ┌───────────▼────────────┐\n                           │ Child / Module Dir     │ ◄── (Step 3: Discover Sub-Signposts)\n                           │   module-rules.md      │\n                           └────────────────────────┘\n```\n\n### Step 1: Current Working Directory (CWD) Inspection\n- Inspect the directory of the target file or active working directory.\n- If signpost documents exist, read them immediately.\n\n### Step 2: Upward Traversal (Staircase Up)\n- If **no** signpost document is found in CWD, move up to the parent directory (`..`).\n- Repeat step-by-step upward until a root signpost document (`CLAUDE.md` or `AGENTS.md`) or the workspace boundary is reached.\n- Read all discovered root signposts to establish global directives and project rules.\n\n### Step 3: Downward Inspection (Staircase Down)\n- From the established root directory, step downward into child directories relevant to the task.\n- Discover specialized module-level signposts, domain rules, or component configs. Read them.\n\n---\n\n## 3. User-Configurable Buzzwords (`staircase-config.json`)\n\nAgents can read a local or global `staircase-config.json` to customize target signposts:\n\n```json\n{\n  \"signpost_filenames\": [\n    \"CLAUDE.md\",\n    \"AGENTS.md\",\n    \"START.md\",\n    \"RULES.md\",\n    \"README.md\",\n    \"TODO.md\"\n  ],\n  \"custom_buzzwords\": [\n    \"SECURITY\",\n    \"POLICY\",\n    \"GOVERNANCE\",\n    \"PIPELINE\"\n  ],\n  \"max_upward_depth\": 10,\n  \"exclude_directories\": [\n    \"node_modules\",\n    \".git\",\n    \"__pycache__\",\n    \"dist\",\n    \"build\",\n    \"archive\"\n  ]\n}\n```\n\n---\n\n## 4. Integration with `letter-hooker` & Scheduled Tasks\n\n`staircase-routing` is embedded as a core preflight bootloader in the **`letter-hooker`** skill and the **`antigravity-kontext-and-workflow-loader-and-divider`** scheduled task, ensuring agents always locate and obey signpost documents before initiating edits.\n"}, {"id": "protocol:infrastructure:surface-after-care", "name": "surface-after-care", "cat": "infrastructure", "ver": "1.6.0", "status": "active", "desc": "Regelmäßiger Pflegedurchlauf für ein bereits veröffentlichtes GitHub-Repository (Stufe 1, günstig und oft wiederholbar): zuerst alle Distributionsflächen des Projekts ermitteln (npm, PyPI, Registries, Marketplaces, Stores, Website) und Änderungen später dorthin spiegeln, dann Topics setzen, Privacy-Gate, Dokumente auf Veröffentlichungsabsicht prüfen und interne Planungsdateien nachträglich ignorieren, Banner ergänzen, Aussagen im README gegen den echten Code-Stand abgleichen, Darstellung verbessern, Sprachfassungen der README vervollständigen, Sichtbarkeitsmaßnahmen umsetzen, Eintrag auf der Organisationsseite prüfen sowie offene Issues und Pull Requests abarbeiten. Nutze diesen Skill, wenn ein bestehendes Repo gepflegt, aufgeräumt, aktualisiert, aufgehübscht oder \"mal wieder durchgesehen\" werden soll, wenn ein Repo veraltet oder unaufgeräumt wirkt, bei Formulierungen wie \"Repo-Pflege\", \"after care\", \"Nachpflege\", \"Repo auf Stand bringen\", \"aufräumen und pushen\" oder bei rotierenden Qualitätsrunden über mehrere Repos. Für die tiefe Runde inkl. Rechtscheck und orga-übergreifenden Querverweisen stattdessen full-after-care nutzen; für die Erstveröffentlichung github-repo-care.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: surface-after-care\nversion: 1.6.0\ntype: protocol\nauthor: Lukas Geiger + Claude\ncreated: 2026-07-24\nupdated: 2026-07-24\naliases: [repo-after-care, repo-pflege, after-care, repo-nachpflege, repo-wartung]\ndescription: >\n  Regelmäßiger Pflegedurchlauf für ein bereits veröffentlichtes GitHub-Repository (Stufe 1,\n  günstig und oft wiederholbar): zuerst alle Distributionsflächen des Projekts ermitteln\n  (npm, PyPI, Registries, Marketplaces, Stores, Website) und Änderungen später dorthin spiegeln,\n  dann Topics setzen, Privacy-Gate, Dokumente auf Veröffentlichungsabsicht prüfen und interne\n  Planungsdateien nachträglich ignorieren, Banner ergänzen, Aussagen im README gegen den echten\n  Code-Stand abgleichen, Darstellung verbessern, Sprachfassungen der README vervollständigen,\n  Sichtbarkeitsmaßnahmen umsetzen, Eintrag auf der Organisationsseite prüfen sowie offene\n  Issues und Pull Requests abarbeiten.\n  Nutze diesen Skill, wenn ein bestehendes Repo gepflegt, aufgeräumt, aktualisiert, aufgehübscht\n  oder \"mal wieder durchgesehen\" werden soll, wenn ein Repo veraltet oder unaufgeräumt wirkt,\n  bei Formulierungen wie \"Repo-Pflege\", \"after care\", \"Nachpflege\", \"Repo auf Stand bringen\",\n  \"aufräumen und pushen\" oder bei rotierenden Qualitätsrunden über mehrere Repos.\n  Für die tiefe Runde inkl. Rechtscheck und orga-übergreifenden Querverweisen stattdessen\n  full-after-care nutzen; für die Erstveröffentlichung github-repo-care.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: false\n\ncategory: dev\ntags: [github, repo, maintenance, privacy, i18n, documentation, visibility, issues]\nlanguage: de\nstatus: active\n\ndependencies:\n  tools: [git, gh, rg]\n  services: [GitHub]\n  protocols: []\n  python: []\n\nprovenance:\n  origin: \"custom\"\n  origin_path: null\n  origin_version: null\n  origin_repo: null\n  last_sync_from_origin: null\n  last_sync_to_origin: null\n  local_changes_since_sync: false\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"surface-after-care banner\">\n# Surface After Care — die regelmäßige Pflegerunde für ein veröffentlichtes Repo\n\n## Wann dieser Skill greift\n\nNutze ihn für ein Repository, das **bereits öffentlich ist** und turnusmäßig durchgesehen werden soll. Er ist die günstige Stufe: alles, was sich am Repo selbst entscheiden lässt, ohne fremde Repos zu inventarisieren oder ein Rechtsgutachten anzustoßen.\n\nAbgrenzung zu den Nachbarskills:\n\n| Situation | Skill |\n|---|---|\n| Repo wird zum ersten Mal veröffentlicht | `github-repo-care` |\n| Repo ist public, regelmäßige Pflegerunde | **dieser Skill** |\n| Zusätzlich Rechtscheck + Querverweise über alle Orgas + App-i18n | `full-after-care` (Alias `deep-after-care`) |\n| Reine Rechts-/Privacy-/Lizenzprüfung vor dem Public-Stellen | `repo-publish-check` |\n| Sprachfassungen inhaltlich synchron halten | `bilingual-doc-sync` |\n| Verteilung dieser Runde über viele Repos, fair rotierend | `rotation-check` |\n\n## Kernidee\n\nEin veröffentlichtes Repo driftet in zwei Richtungen auseinander: **Die Doku beschreibt eine ältere Software als die, die im Repo liegt**, und **es sammeln sich Dateien an, die nie für fremde Augen gedacht waren**. Beides ist selten dramatisch, aber beides kostet genau die Nutzer, die man gewinnen will — der eine springt ab, weil die Installationsanleitung nicht mehr passt, der andere, weil er im Wurzelverzeichnis auf `AUFGABEN.txt` und `Plan.txt` stößt und den Eindruck bekommt, hier arbeite jemand nur für sich selbst.\n\nDiese Runde räumt beides auf. Sie ist bewusst wiederholbar: lieber viermal im Jahr eine halbe Stunde als einmal ein Großputz.\n\n## Ablauf\n\nDie Reihenfolge ist nicht willkürlich. Schritt 0 steht am Anfang, weil er den Umfang aller folgenden Schritte bestimmt. Schritt 2 läuft vor allem, was Änderungen pusht — sonst schiebt man Verbesserungen über einen Stand, der erst noch bereinigt werden muss. Schritt 1 ist rein serverseitig und stört dabei nicht.\n\n### 0. Distributionsflächen inventarisieren\n\n**Bevor irgendetwas geändert wird: klären, wo dieses Projekt überall liegt.** Das GitHub-Repo ist selten die einzige Fläche. Eine korrigierte README nützt wenig, wenn die npm-Paketseite weiter die alte Fassung mit der falschen Installationsanweisung zeigt — und genau dort landen die meisten Nutzer, denn Paketregister ranken in Suchmaschinen oft besser als das Repo.\n\n```bash\n# Manifeste verraten die Kanäle\ncat package.json pyproject.toml setup.py Cargo.toml 2>/dev/null | rg -n \"name|version|keywords|repository|homepage\"\nrg -n \"npmjs.com|pypi.org|marketplace|registry|crates.io|hub.docker|zenodo|doi\" README* docs/ .github/ 2>/dev/null\n\n# Veröffentlichten Stand der Kanäle abfragen (nur was zutrifft)\nnpm view <paket> version description keywords 2>/dev/null\npip index versions <paket> 2>/dev/null\ngh release list --repo ORG/REPO --limit 5\n```\n\nTypische Flächen: npm, PyPI, Crates, Docker Hub, MCP-Registry, Plugin-/Skill-Verzeichnisse, VS-Code- oder Browser-Marketplaces, App-Stores, Zenodo/DOI, Projektwebsite, Organisationsprofil, `llms.txt`, Spiegel-Repos auf anderen Hosts.\n\nNotiere die gefundene Liste im Laufprotokoll. Sie ist ab jetzt die **Zielmenge**: Jede Änderung aus den folgenden Schritten wird am Ende gegen diese Liste gespiegelt (siehe „Parität über alle Flächen\"). Findest du eine Fläche, die niemand mehr pflegt und die auf einen toten Stand zeigt, ist das ein eigener Befund — entweder aktualisieren oder bewusst zurückziehen, aber nicht stehen lassen.\n\n### 1. Topics setzen\n\nTopics sind die wichtigste Suchfläche innerhalb von GitHub und kosten fast nichts.\n\n```bash\ngh repo view ORG/REPO --json nameWithOwner,description,repositoryTopics,homepageUrl,visibility\ngh repo edit ORG/REPO --add-topic <topic> --add-topic <topic>\n```\n\nZiel sind ungefähr 5–12 Topics aus drei Richtungen: **was es ist** (`cli`, `mcp-server`, `python-library`), **worum es geht** (`file-management`, `tax`, `note-taking`) und **wie es arbeitet** (`local-first`, `offline`, `privacy`). Orientiere dich an Topics, die bei vergleichbaren Projekten tatsächlich verwendet werden — erfundene Topics finden keine Nutzer. Description und Homepage gleich mitprüfen, sie stehen in derselben Ansicht.\n\nTopics haben auf den anderen Flächen aus Schritt 0 ein Pendant: `keywords` in `package.json`, `keywords`/`classifiers` in `pyprojec
