 no longer occurs\n- [ ] **MRE passes:** Isolated test runs through\n- [ ] **No regression:** Existing tests still pass\n- [ ] **Edge cases:** Empty input, None, large data tested\n- [ ] **Project tools:** Check project tools directory for relevant test/validation tools\n\n### Test Commands\n\n```bash\n# Unit tests (Deutsch)\npython -m pytest tests/ -v\n\n# Only affected tests (Deutsch)\npython -m pytest tests/test_module.py -v -k \"test_name\"\n\n# Type check (Deutsch)\npython -m mypy file.py\n\n# Lint (Deutsch)\npython -m flake8 file.py\n```\n\n---\n\n## Phase 6: Documentation (2 min)\n\n### Bug Report Template\n\n```markdown\n## Bug Report: [Short Title]\n\n**Date:** YYYY-MM-DD\n**Severity:** critical / high / medium / low\n**Component:** [Module/File]\n\n### Symptom\n[What the user sees / error message]\n\n### Root Cause\n[Technical root cause]\n\n### Fix\n[What was changed + why]\n\n### Affected Files\n- `file1.py` — [Change]\n- `file2.py` — [Change]\n\n### Prevention\n[How can this type of bug be prevented in the future?]\n```\n\n### Commit Message Format\n\n```\nfix: [Short description of the fix]\n\nCause: [Root cause in one sentence]\nFix: [What was changed]\nTest: [How verified]\n```\n\n---\n\n## PyQt6 / GUI Debugging — Common Pitfalls\n\n> This section is relevant for desktop GUI projects with PyQt6/PySide6.\n\n### Top 5 PyQt6 Traps\n\n| Trap | Problem | Solution |\n|------|---------|---------|\n| **Signal-Slot Disconnect** | Signal connected but handler doesn't run | `print` in handler, check signature |\n| **Thread Safety** | GUI update from worker thread | `QMetaObject.invokeMethod` or use signal |\n| **Layout Cascade** | Widget invisible/misplaced | `widget.show()`, check layout hierarchy |\n| **Event Loop Block** | GUI freezes | Move long operations to QThread |\n| **Garbage Collection** | Widget suddenly disappears | Keep reference as `self.widget` |\n\n### PyQt6 Debug Helpers\n\n```python\n# Dump widget hierarchy (Deutsch)\ndef dump_widget_tree(widget, indent=0):\n    print(\" \" * indent + f\"{widget.__class__.__name__}: {widget.objectName()}\")\n    for child in widget.findChildren(QWidget):\n        if child.parent() == widget:\n            dump_widget_tree(child, indent + 2)\n\n# Signal debugging (Deutsch)\nfrom PyQt6.QtCore import QObject\noriginal_connect = QObject.connect\ndef debug_connect(self, *args, **kwargs):\n    print(f\"CONNECT: {self.__class__.__name__} -> {args}\")\n    return original_connect(self, *args, **kwargs)\n```\n\n---\n\n## Quick Reference\n\n```\nBUG FOUND?\n     |\n     v\n[Phase 1: Quick Checks]  ──── Obvious? -> FIX\n     |\n     v\n[Phase 2: Diagnosis]  ────────── Cause clear? -> Phase 4\n     |\n     v\n[Phase 3: Isolated Test]  ── Reproducible? -> Phase 4\n     |                              |\n     |                         Not reproducible?\n     |                              |\n     |                         Add logging,\n     |                         wait for recurrence\n     v\n[Phase 4: Fix]  ─────────────── Minimal + understood\n     |\n     v\n[Phase 5: Verification]  ────── Tests green? -> Phase 6\n     |                              |\n     |                         Tests red? -> Back to Phase 4\n     v\n[Phase 6: Documentation]  ───── Bug report + commit\n```\n\n### 20-Minute Rule\n\nIf you're stuck after 20 minutes:\n\n1. **Change approach** — Try a different debugging technique\n2. **Rubber duck** — Explain the problem out loud (or write it down)\n3. **Take a break** — Step away for 5 minutes, return with fresh eyes\n4. **Get help** — Ask a colleague, Stack Overflow, documentation\n5. **Reset** — `git stash`, start completely fresh"}, {"id": "protocol:dev:bugsweep", "name": "bugsweep", "cat": "dev", "ver": "1.1.0", "status": "active", "desc": "Systematic bug sweep with a codebase-scaled target value, doubling escalation, area tracking, and final verification. Use on /bugsweep or whenever the user requests a systematic bug pass.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: bugsweep\nversion: 1.1.0\ntype: protocol\nauthor: Lukas Geiger\ncreated: 2026-06-01\nupdated: 2026-06-13\ndescription: Systematic bug sweep with a codebase-scaled target value, doubling escalation, area tracking, and final verification. Use on /bugsweep or whenever the user requests a systematic bug pass.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: false\ncategory: dev\ntags: [bugs, debugging, sweep, quality-assurance, workflow, convergence]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': ['bugfix-protocol'], 'python': []}\nprovenance: {'origin': 'custom', 'origin_path': '~/.claude/skills/bugsweep/', 'origin_version': '1.0.0', 'last_sync_from_origin': '2026-06-13', 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"bugsweep banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# /bugsweep — Systematic Bug-Sweep Workflow (Deutsch)\n\nIterative bug hunting with a converging stop criterion. Scales with the codebase, escalates when the search looks superficial, and prevents repetition through area tracking.\n\n## 1. Compute the base rate\n\n```\nLOC = productive source lines (src/, lib/ — excluding tests, configs, docs, generated)\nx = max(1, ceil(LOC / 1500))\nbase_rate = x * 3\n```\n\n| LOC | x | Base rate |\n|-----|---|-----------|\n| ~1500 | 1 | 3 |\n| ~3000 | 2 | 6 |\n| ~4500 | 3 | 9 |\n| ~10000 | 7 | 21 |\n\nReport to the user: \"Codebase: {LOC} LOC → base rate = {base_rate} clean search passes.\"\n\n## 2. Search loop\n\n```\ncounter = 0\ntarget = base_rate\nany_bug_found = False\nchecked = []  # (area_name, type: code|task)\n\nLOOP:\n  area = pick_new_area()  # see area rules\n  checked.append(area)\n\n  Perform a thorough bug search\n\n  IF bug found:\n    any_bug_found = True\n    Fix following bugfix-protocol (phases 4+5)\n    Review: see model rule (newer model classes: no external review needed)\n    Commit + push\n    counter = 0  # RESET\n  ELSE:\n    counter += 1\n    Report: \"✓ Clean: {area} — {counter}/{target}\"\n\n  IF counter >= target:\n    IF NOT any_bug_found:\n      # Doubling escalation: not a single bug → search too shallow?\n      target = base_rate * 2\n      any_bug_found = True  # escalate only ONCE\n      Report: \"⚠ No bug in {base_rate} passes → target doubled to {target}.\"\n      CONTINUE LOOP\n    ELSE:\n      GOTO final verification\n```\n\n### Practical notes on the search loop (learned from real sweeps)\n\n- **Non-git repos:** Where there is no `git` (e.g. cloud-synced project folders), a **versioned backup** replaces \"commit + push\": create `file_<ts>.bak` before the first fix. **Caution — the pre-fix backup is NOT a backup of your work:** after the last fix, take a fresh `_FINAL_` backup, otherwise a sync hiccup can wipe the entire fix session.\n- **Many bugs known up front:** If N bugs are already known at the start (e.g. from a previous run), \"per bug: fix → review → commit → reset\" is impractical. Process the known bugs as ONE fix block (joint review at the end) and start counting the base rate / search loop from the first NEWLY found bug. The reset logic still applies to bugs newly found during the sweep.\n- **Same bug in multiple places:** A found defect (e.g. a wrong regex, a broken format assumption) is often copied elsewhere. After each fix, search for the same pattern in other locations — that is a worthwhile dedicated \"area\".\n\n## 3. Area rules (anti-gaming)\n\nAn \"area\" is either a **code focus** or a **task** (purpose of the code).\n\n### Code focus\n- May be **extended** (more files) or **shifted** (different part) between passes\n- Must NOT be exactly the same selection as in an earlier pass\n- OK: pass 1 = `maintenance.py`, pass 5 = `maintenance.py + orchestrator.py` (extended)\n- NOT OK: pass 1 = `maintenance.py`, pass 5 = `maintenance.py` (identical)\n\n### Task (purpose)\n- May be made **more granular** (check a subfunction) or **broader** (related functions together)\n- Must NOT be exactly the same task\n- OK: pass 1 = \"thread safety in the watchdog\", pass 5 = \"thread safety across the whole tray\" (broader)\n- OK: pass 1 = \"process detection\", pass 5 = \"store-marker matching inside process detection\" (more granular)\n- NOT OK: pass 1 = \"thread safety in the watchdog\", pass 5 = \"thread safety in the watchdog\" (identical)\n\n### Naming\n- The area MUST be named BEFORE the search (no retroactive assignment)\n- Format: `\"{name}\" ({type}: code|task)`\n\n## 4. Final verification\n\nOnce counter >= target AND any_bug_found:\n\n**Step A — bugfix-protocol phase 5:**\n- [ ] Full test suite green (`pytest`)\n- [ ] **Actually execute the changed execution path at least once** — not just tests. Green unit tests on code that never calls the changed location are false safety. Run the actually changed path (dry run, smoke run, CLI invocation) and check for tracebacks / signature / naming errors. `py_compile` or a plain import only checks syntax — not whether the path runs.\n- [ ] **Every fix has at least one test that touches it** — a fix without a test that actually triggers the changed branch counts as unverified (for orchestration/network paths, combine mock + dry run if needed).\n- [ ] Type check (if configured)\n- [ ] Lint (if configured)\n- [ ] Edge cases of the session's fixes checked\n\n**Step B — review (model rule):**\n- **Newer model classes (e.g. Claude 5 / Fable class):** NO external advisor/second-model\n  review required. Step A (tests + a real smoke run) is the verification. Optionally, on\n  genuine uncertainty: a fresh review subagent — but verify its findings empirically\n  (test against the unchanged code) before counting them as bugs.\n  Background (sweep experience 2026-06-11): the second reviewer was unavailable, the\n  substitute subagent delivered 1 finding (confidence 85) that a test proved to be a\n  non-bug — an external review did not change the outcome.\n- **Older models:** closing discussion with the advisor (fallback: a second model as\n  reviewer); the advisor confirms or names gaps.\n\n**If a bug is found during verification:**\n→ Fix + test + commit\n→ RESET: counter = 0, target = base_rate (fresh, NO doubling)\n→ Back to the search loop (checked list persists, any_bug_found = True)\n\n**If verification is clean:**\n→ DONE. Commit + push. Print the protocol.\n\n## 5. Protocol (at the end)\n\n```markdown\n## Bug Sweep Result\n\n- **Codebase:** {LOC} LOC\n- **Base rate:** {base_rate} (escalated: {target})\n- **Areas checked:** {len(checked)}\n- **Bugs found:** {count}\n- **Resets:** {reset_count}\n- **Doubling triggered:** yes/no\n- **Fixes:**\n  - {title} — {commit_hash}\n  - ...\n- **Final test suite:** {passed}/{total} green\n- **Review verdict:** self-verification (newer model class) / advisor confirmed / gaps named\n```\n\n## When to use this workflow\n\n- After feature development (quality assurance)\n- Before a release (acceptance sweep)\n- Periodically as a hygiene check\n- When the user types `/bugsweep`\n\n## Interaction with other skills\n\n- **bugfix-protocol:** fix procedure (phases 4+5) for every found bug\n- **systematic-debugging:** for hard-to-reproduce bugs within the sweep\n- **code-review:** can be used as a task area\n\n---\n\n## Änderungsprotokoll\n\n### 1.1.0 (2026-06-13)\n- Backported the model rule for step B (from the local skill installation, state 2026-06-11): newer model classes self-verify via tests + a real smoke run, no external review needed; protocol field \"Review verdict\" extended accordingly\n\n### 1.0.0 (2026-06-13)\n- First publication in the skill library (adopted from local skill installation, state 2026-06-01)"}, {"id": "protocol:dev:dev-cycle", "name": "dev-cycle", "cat": "dev", "ver": "1.1.0", "status": "active", "desc": "8-phase development cycle: Feature requests, current state, functional planning, frontend, backend planning, backend code, tests, use cases. Iterative framework for systematic software development.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: dev-cycle\nversion: 1.1.0\ntype: protocol\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-06-13\ndescription: 8-phase development cycle: Feature requests, current state, functional planning, frontend, backend planning, backend code, tests, use cases. Iterative framework for systematic software development.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: dev\ntags: [development, dev-cycle, phases, workflow, systematic, iterative]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/workflows/dev-zyklus.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"dev-cycle banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Development Cycle (Dev Cycle) (Deutsch)\n\n> **Goal:** Structured process from feature request to validated system.\n> Every development goes through these 8 phases.\n\n---\n\n## Übersicht & Zweck\n\n```\n  +--------------------------------------------------------------+\n  |                    DEVELOPMENT CYCLE                           |\n  +--------------------------------------------------------------+\n  |                                                                |\n  |  Phase 1   Feature Requests (functional requirements)          |\n  |     |                                                          |\n  |     v                                                          |\n  |  Phase 2   Check Current State (What already exists?)          |\n  |     |                                                          |\n  |     v                                                          |\n  |  Phase 3   Functional Planning                                 |\n  |            (Workflows, Agents, Experts, Skills, Services)      |\n  |     |                                                          |\n  |     v                                                          |\n  |  Phase 4   Implement Functional Frontend                       |\n  |            (Skill files, workflow markdown, agent profiles)     |\n  |     |                                                          |\n  |     v                                                          |\n  |  Phase 5   Plan and Align Backend                              |\n  |            (CLI handlers, DB schema, API endpoints)            |\n  |     |                                                          |\n  |     v                                                          |\n  |  Phase 6   Implement Backend Tasks                             |\n  |            (Python code, tools, DB migrations)                 |\n  |     |                                                          |\n  |     v                                                          |\n  |  Phase 7   Technical Tests and Bugfixes                        |\n  |            (B/O/E tests, bugfix protocol)                      |\n  |     |                                                          |\n  |     v                                                          |\n  |  Phase 8   Functional and Feature Test: USE CASES              |\n  |            (End-to-end validation from user perspective)        |\n  |                                                                |\n  +--------------------------------------------------------------+\n\n  Core principles throughout:\n  - Functional description first (before code)\n  - CLI First (everything controllable via terminal)\n  - Clear separation of user data and system data\n```\n\n---\n\n## Phase 1: Feature Requests (Functional Requirements)\n\n**What:** Collect and formulate functional requirements.\n\n**Input:**\n- User wishes, ideas, problems\n- Partner suggestions (LLM assistants)\n- Insights from use cases (feedback loop!)\n\n**Output:**\n- Tasks in the task system (e.g., as issue, ticket, or TODO list)\n- Requirements describe WHAT is desired, not HOW\n\n**Rules:**\n- Always formulate requirements functionally (\"User can do X\")\n- Not technically (\"Implement REST endpoint for X\")\n- Use use cases as requirement source (Phase 8 -> Phase 1)\n\n---\n\n## Phase 2: Check Current State\n\n**What:** Inventory existing functionality.\n\n**Checklist:**\n```\n  [ ] Search existing tools/scripts\n  [ ] Check documentation/help on the topic\n  [ ] Check existing skills/agents/services\n  [ ] Check DB schema (if relevant)\n  [ ] Check use cases - has something similar been tested?\n```\n\n**Output:**\n- Documentation of what exists, what's missing, what needs extension\n- Avoidance of duplicates\n\n---\n\n## Phase 3: Functional Planning\n\n**What:** Plan at the functional level - do NOT write code immediately.\n\n**Planning Levels:**\n\n| Level | Question | Artifact |\n|-------|----------|----------|\n| Workflow | WHEN/HOW is coordination done? | workflows/*.md |\n| Agent | WHO executes? | agents/*.txt |\n| Expert | WHO has domain knowledge? | experts/*/ |\n| Skill | WHAT is done? | skills/*.md |\n| Service | HOW is it done technically? | services/*/ |\n\n**Rules:**\n- Think functionally first, then technically\n- Workflows describe processes, not implementation details\n- Every agent needs a clear profile\n- Services must work without user data\n\n---\n\n## Phase 4: Implement Functional Frontend\n\n**What:** Create skill files, workflow markdown, agent profiles.\n\nThe \"frontend\" here is the functional description layer:\n- Workflow files (.md)\n- Agent profiles (.txt)\n- Expert knowledge\n- Service descriptions\n- Help files\n\n**Output:**\n- All functional descriptions exist\n- An LLM partner could read and understand the workflow\n- The functional layer is fully documented\n\n---\n\n## Phase 5: Plan and Align Backend\n\n**What:** Align technical architecture to the functional frontend.\n\n**Planning Areas:**\n\n| Area | Question | Location |\n|------|----------|----------|\n| CLI Handlers | Which commands? | handlers/*.py |\n| DB Schema | Which tables/columns? | schema/*.sql |\n| API Endpoints | Which GUI endpoints? | server.py |\n| Tools | Which Python scripts? | tools/*.py |\n\n**Output:**\n- Technical plan aligned with the functional frontend\n- DB schema design\n- CLI command structure\n\n---\n\n## Phase 6: Implement Backend Tasks\n\n**What:** Write Python code, DB migrations, CLI handlers.\n\n**Checklist (per task):**\n```\n  [ ] Works without user data (empty DB)?\n  [ ] CLI command available?\n  [ ] Input can come from files/folders?\n  [ ] Output goes to structured DB?\n  [ ] Scan/import is repeatable (idempotent)?\n  [ ] No hardcoded path?\n  [ ] Tool registered and documented?\n  [ ] Help file created?\n```\n\n---\n\n## Phase 7: Technical Tests and Bugfixes\n\n**What:** Ensure technical correctness.\n\n**Test Types (B/O/E):**\n\n| Type | Perspective | Description |\n|------|-------------|-------------|\n| B-Tests | External/Automated | Automated tests, CI/CD |\n| O-Tests | Functional (Input->Output) | Manual functional verification |\n| E-Tests | Subjective/Experience | UX evaluation, ergonomics |\n\n**On bugs:**\n- Apply the bugfix protocol\n- Observe the 20-minute rule (change approach after 20 min)\n- Document lessons learned\n\n---\n\n## Phase 8: Functional and Feature Test - USE CASES\n\n**What:** End-to-end validation from user perspective.\n\n**Use cases serve BOTH purposes:**\n1. **Feature indicators** - What is desired? What should be possible?\n2. **Test scenarios** - Does it actually work from A to Z?\n\n**Use Case Format:**\n```\n  USECASE_NNN: Short Title\n\n  PRECONDITION: What must be in place?\n  INPUT:        What does the user enter / what data?\n  EXPECTED:     What should the result be?\n  TESTS:        Which components are tested?\n```\n\n**Feedback Loop:**\n- Failed use cases -> new tasks in Phase 1\n- Successful use cases -> validated features\n- New use case ideas -> capture as tasks\n\n---\n\n## Summary: The Cycle\n\n```\n  Phase 8 (Use Cases)\n       |\n       | New requirements / bugs\n       v\n  Phase 1 (Feature Requests)  -->  Phase 2 (Current State)\n       ^                                    |\n       |                                    v\n  Phase 7 (Tests/Bugs)         Phase 3 (Functional Planning)\n       ^                                    |\n       |                                    v\n  Phase 6 (Backend Code)       Phase 4 (Functional Frontend)\n       ^                                    |\n       |                                    v\n       +──────────────────── Phase 5 (Backend Planning)\n```\n\nThe cycle is a loop: Use cases validate features and simultaneously\ngenerate new requirements.\n\n---\n\n## Phase-specific skills\n\n| Phase | Specialized skill | Trigger |\n|-------|-------------------|---------|\n| Phases 1-3 | Project bootstrapper (if available) | Create a new project (greenfield) |\n| Phase 2 | [project-onboarding](../project-onboarding/SKILL.en.md) | Take on an existing project |\n| Phases 2-3 | [docs-analysis](../docs-analysis/SKILL.en.md) | Check requirement documents against code |\n| Phases 5-6 | [pipeline-optimizer](../pipeline-optimizer/SKILL.en.md) | Renovate existing structures |\n| Phase 7 | [bugfix-protocol](../bugfix-protocol/SKILL.en.md) | Systematic 6-phase debugging |\n| Phases 7-8 | [bugsweep](../bugsweep/SKILL.en.md) | Converging bug sweep before a release |\n\nIf your skill collection has a skill index, search it for further phase-specific skills.\n\n---\n\n## Änderungsprotokoll\n\n### 1.1.0 (2026-06-13)\n- New \"Phase-specific skills\" table with references to project-onboarding, docs-analysis, pipeline-optimizer, bugfix-protocol, and bugsweep\n\n### 1.0.0 (2026-03-12)\n- Ported from BACH (dev-zyklus v1.0.0)\n\n---\n\n*Created: 2026-01-28 | Ported: 2026-03-12*"}, {"id": "agent:dev:dev-soft-agent", "name": "dev-soft-agent", "cat": "dev", "ver": "0.1.0", "status": "active", "desc": "Automated software development pipeline. Scans projects, prioritizes tasks, analyzes code, and orchestrates development loops. Zero dependencies (Python stdlib only).", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: dev-soft-agent\nversion: 0.1.0\ntype: agent\nauthor: BACH Team\ncreated: 2026-02-21\nupdated: 2026-03-12\ndescription: Automated software development pipeline. Scans projects, prioritizes tasks, analyzes code, and orchestrates development loops. Zero dependencies (Python stdlib only).\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: true\ncategory: dev\ntags: [development, code-analysis, task-management, automation, pipeline]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'MODULAR_AGENTS/devSoftAgent', 'origin_version': '0.1.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"dev-soft-agent banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Dev Soft Agent (Deutsch)\n\nAutomated software development pipeline. Extracted from BACH's ATI agent,\nruns fully standalone with pure Python standard library.\n\n## Components\n\n```\nscripts/\n  config.py              Configuration (scan folders, naming prefixes, weights)\n  project_manager.py     Project scan + classification by naming convention\n  task_engine.py          TASKS.txt parser + code scanner (TODO/FIXME)\n  code_analyzer.py       Static analysis (LOC, imports, classes, functions)\n  dev_loop.py            Orchestrator (DevLoop)\n  policies/\n    naming.py            snake_case / PascalCase / SCREAMING_SNAKE validation\n    encoding.py          UTF-8 enforcement + BOM detection\n    paths.py             Hardcoded path detection\n  prompt_templates/\n    task_prompt.txt      LLM prompt for task processing\n    review_prompt.txt    LLM prompt for code review\n    analysis_prompt.txt  LLM prompt for project analysis\n```\n\n## Usage as Python Library\n\n```python\nfrom scripts.dev_loop import DevLoop\nfrom scripts.config import Config\n\nconfig = Config()\nloop = DevLoop(config)\n\n# Scan projects (Deutsch)\nprojects = loop.scan_projects()\n\n# Select project (weighted random selection by naming convention) (Deutsch)\nproject = loop.select_project()\n\n# Analyze code (Deutsch)\nanalysis = loop.analyze_project()\nprint(f\"{analysis.total_loc} LOC, {analysis.todo_count} TODOs\")\n\n# Load and prioritize tasks (Deutsch)\ntasks = loop.get_tasks()\nfor task in tasks:\n    print(f\"[{task.task_type.name}] {task.description} (Prio: {task.priority})\")\n\n# Complete dev session (Deutsch)\nresult = loop.run_session()\nloop.save_session()\n```\n\n## Usage as CLI\n\n```bash\ncd scripts\npython -m devSoftAgent scan ~/projects\npython -m devSoftAgent select\npython -m devSoftAgent analyze /path/to/project\npython -m devSoftAgent tasks /path/to/project\npython -m devSoftAgent session --project my-project\npython -m devSoftAgent status\n```\n\n## Naming Convention (Project Classification)\n\nProjects are classified based on their folder name:\n\n| Prefix | Label | Weight | Meaning |\n|--------|-------|--------|---------|\n| `RDY` | Ready | 1.0 | Highest priority |\n| `RDY_FAST` | Fast Ready | 0.5 | Quick to complete |\n| `FAST` | Fast | 0.33 | Small task |\n| `DEV` | Development | 0.17 | In development |\n| `REL` | Released | 0.0 | Done, no work needed |\n| `ARC` | Archived | 0.0 | Archived |\n\nWeight determines the probability in random selection.\n\n## TASKS.txt Format\n\n```markdown\n# TASKS - ProjectName (Deutsch)\n# As of: 2026-03-12 (Deutsch)\n\n## OPEN\n- [ ] [BUG] Description of the bug\n- [ ] [FEATURE] New feature\n\n## IN PROGRESS\n- [-] [REFACTOR] Code restructuring\n\n## DONE\n- [x] [BUG] Fixed bug -- DONE 2026-03-01\n```\n\n## Policies\n\nQuality policies that can be automatically checked against code:\n\n- **NamingPolicy:** snake_case for modules/functions, PascalCase for classes\n- **EncodingPolicy:** Enforce UTF-8, detect BOM, flag CRLF\n- **PathPolicy:** Detect and report hardcoded absolute paths\n\n## Änderungsprotokoll\n\n### 0.1.0 (2026-03-12)\n- Migration from MODULAR_AGENTS/devSoftAgent to skill library\n- Project scanner, task engine, code analyzer, DevLoop\n- 3 policies (naming, encoding, paths)\n- 3 prompt templates (task, review, analysis)"}, {"id": "skill:dev:docs-analysis", "name": "docs-analysis", "cat": "dev", "ver": "1.0.0", "status": "active", "desc": "Document requirements analysis: Analyzes concept and requirements documents in the docs/ folder, checks requirements against current code, and creates a consolidated difference report.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: docs-analysis\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-15\nupdated: 2026-03-15\ndescription: Document requirements analysis: Analyzes concept and requirements documents in the docs/ folder, checks requirements against current code, and creates a consolidated difference report.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: dev\ntags: [docs-analysis, requirements, code-review, diff-report, quality-assurance]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/workflows/docs-analyse.md', 'origin_version': '1.2.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-15', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"docs-analysis banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Document Requirements Analysis (Deutsch)\n\n> Analyzes all concept and requirements documents, checks their requirements against the current code, and creates a consolidated difference report.\n\n---\n\n## Übersicht & Zweck\n\nAnalyzes all concept and requirements documents in the ../docs/ folder, checks their requirements against the current code, and creates a consolidated difference report.\n\n---\n\n## Naming Convention\n\n### Prefix and Suffix\nAll analyzed documents receive:\n- **Prefix:** `conN_` where N = analysis version (1, 2, 3, ...)\n- **Suffix:** `_XX` where XX = fulfillment percentage (rounded to nearest 10)\n\n### Archiving Threshold\n- **>= 75% fulfilled:** Document is moved to `../docs/_archive/`\n- **< 75% fulfilled:** Document stays in `../docs/` with prefix/suffix\n- **Threshold configurable** (default: 75)\n\n---\n\n## Process\n\n### Phase 1: Collect Documents\n- List all *.md and *.txt files in ../docs/ (root)\n- Filter out README.txt\n\n### Phase 2: Extract Requirements\nFor each document:\n- Read content\n- Identify requirements (checklists, tables, MISSING/TODO markers)\n- Categorize: Structure, Code, API, DB Schema, CLI, Feature\n\n### Phase 3: Code Verification\nFor each requirement:\n- Determine verification method (Glob, Grep, Read)\n- Execute verification\n- Mark as: FULFILLED, PARTIAL, MISSING\n\n### Phase 4: Assessment\n- Count fulfilled vs. open requirements\n- Calculate fulfillment percentage (%)\n- Decide: archive (>= 75%) or keep (< 75%)\n\n### Phase 5: Generate Output\n- Create REQUIREMENTS_ANALYSIS.md (summary)\n- Create consense_diff.md (only open requirements, by priority)\n\n### Phase 6: Versioning\n- Scan for highest conN_ prefix\n- New version = highest + 1\n\n### Phase 7: Rename and Move\n- Apply new prefix/suffix to documents\n- Archive or keep\n\n---\n\n## Output\n\n| File | Description |\n|------|-------------|\n| `conN_REQUIREMENTS_ANALYSIS.md` | Complete analysis (version N) |\n| `consense_diff_N.md` | Consolidated open requirements |\n| `_archive/conN_*_XX.*` | Archived (>=75%) documents |\n\n---\n\n## Priority Classification\n\n| Priority | Criteria |\n|:--------:|----------|\n| P1 | Core functionality missing, system unusable |\n| P2 | Important feature missing, workaround possible |\n| P3 | Nice-to-have, improves UX |\n| P4 | Cosmetic, documentation, code quality |\n\n---\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-03-15)\n- Ported from BACH v3.8.0\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*"}, {"id": "protocol:dev:github-repo-care", "name": "github-repo-care", "cat": "dev", "ver": "1.0.0", "status": "active", "desc": "Protocol for safely creating, publishing, releasing, auditing, and maintaining GitHub repositories: check local rules and locks, create .gitignore before the first add, run privacy checks, prepare README/i18n/banner/metadata, verify release tags and GitHub releases, and update organization profiles, llms.txt files, and registry links.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: github-repo-care\nversion: 1.0.0\ntype: protocol\nauthor: Lukas Geiger + Codex\ncreated: 2026-06-18\nupdated: 2026-06-18\naliases: [github-pflege, repo-veroeffentlichen, repo-release, privacy-gate, release-gate]\ndescription: Protocol for safely creating, publishing, releasing, auditing, and maintaining GitHub repositories: check local rules and locks, create .gitignore before the first add, run privacy checks, prepare README/i18n/banner/metadata, verify release tags and GitHub releases, and update organization profiles, llms.txt files, and registry links.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: false\ncategory: dev\ntags: [github, repo, release, privacy, i18n, marketing, ci, documentation]\nlanguage: de\nstatus: active\ndependencies: {'tools': ['git', 'gh', 'rg'], 'services': ['GitHub'], 'protocols': [], 'python': []}\nprovenance: {'origin': 'custom', 'origin_path': '~/.codex/skills/github-repo-care/', 'origin_version': '1.0.0', 'origin_repo': None, 'last_sync_from_origin': '2026-06-18', 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"github-repo-care banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# GitHub Repo Care — Publish and Maintain Repositories Cleanly (Deutsch)\n\n## When To Use\n\nUse this skill when a GitHub repository needs to be created, published, released, audited, or maintained. It is especially important before the first public push, for release tags, repository metadata, organization profiles, and privacy checks.\n\nDo not use it for pure implementation work without a GitHub publication step. Finish the relevant development or debugging workflow first, then activate this skill for publication.\n\n## Core Rule\n\nPrepare the repository before the first public push. A correct `.gitignore`, privacy gate, license, README, metadata, and release story are much cheaper before public history exists.\n\n## Workflow & Vorgehen\n\n1. **Read local rules.** Check `AGENTS.md`, `CLAUDE.md`, `START.md`, release policy, naming policy, and lock policy when present.\n2. **Check locks.** If `LOCK.txt` or a matching `LOCK.*.txt` is active, do not edit that scope.\n3. **Fix the repository identity.** Confirm name, organization, visibility, license, and one-sentence purpose.\n4. **Create `.gitignore` before `git add`.** Exclude secrets, local data, databases, build output, virtual environments, caches, IDE files, and private notes.\n5. **Add public basics.** Typical files: `README.md`, `LICENSE`, `CHANGELOG.md`, `SECURITY.md`, `CONTRIBUTING.md`, `CODE_OF_CONDUCT.md`, `llms.txt`, and CI.\n6. **Write the README for discovery.** First viewport: purpose, installation, usage, privacy model, project layout, license, and canonical repository name.\n7. **Add visual signals.** Add a banner, logo, or screenshot when it makes the project easier to understand. Avoid generic decoration when a real product image or clear concept image is possible.\n8. **Plan i18n deliberately.** Minimum: English plus the project language. Preferred standard set for user-facing modules: German, English, Spanish, Simplified Chinese, Japanese, and Russian.\n9. **Run tests and smokes.** Verify locally before claiming success or creating a release.\n10. **Run the privacy gate.** Check the staged/tracked set for secrets, local paths, PII, `.env`, databases, private documents, generated artifacts, and mojibake.\n11. **Commit and push.** Commit only after the gate passes. Then create or connect the GitHub repository, push, and verify remote status.\n12. **Set metadata.** Check description, topics, homepage, visibility, and default branch.\n13. **Create the release.** Create the tag and GitHub release; verify CI for both branch and tag.\n14. **Update discovery surfaces.** Link from the organization profile, `llms.txt`, central registries, local module indexes, and ecosystem READMEs.\n15. **Final verification.** Check the remote README, release page, topics, CI, and links.\n\n## Privacy Gate\n\nSearch the staged or tracked set, not only the visible working tree.\n\n```bash\ngit diff --cached --check\ngit ls-files\nrg -n \"C:\\\\\\\\Us[e]rs\\\\\\\\|C:/Us[e]rs/|/c/Us[e]rs/|s[k]-[A-Za-z0-9]|gh[p]_|gh[o]_|API[_-]?KEY|TO[K]EN|PASS[W]ORD|SEC[R]ET|\\\\x{C3}|\\\\x{C2}|\\\\x{FFFD}\" .\n```\n\nFor public modules, also document a `RELEASE_GATE.md` or equivalent gate: date, checked commands, result, remaining warnings, and intentional exceptions. If a secret was ever committed, deleting it from `HEAD` is not enough; rotate the secret.\n\n## GitHub Metadata\n\nAfter the push, set metadata and release data explicitly.\n\n```bash\ngh repo edit ORG/REPO --description \"Short concrete description\" \\\n  --add-topic local-first --add-topic python --add-topic llm\ngit tag -a v1.0.0 -m \"v1.0.0\"\ngit push origin v1.0.0\ngh release create v1.0.0 --repo ORG/REPO --title \"v1.0.0\" --notes \"...\"\n```\n\nThen verify:\n\n```bash\ngh repo view ORG/REPO --json nameWithOwner,visibility,description,repositoryTopics,url\ngh release view v1.0.0 --repo ORG/REPO --json tagName,url,isDraft,isPrerelease\ngh run list --repo ORG/REPO --limit 5\n```\n\nIf CI is red after a release, the repository is not cleanly published yet. For a just-created initial release, immediately and intentionally moving the fresh tag to the corrected commit is acceptable.\n\n## Common Mistakes\n\n| Mistake | Fix |\n|---|---|\n| `.gitignore` is added after `git add` | Unstage first, fix ignore rules, then add again |\n| README is monolingual although the UI or skill is multilingual | Add language links or localized READMEs |\n| No banner, topics, or description | Add discovery assets before announcement |\n| Release tag exists, but CI is red | Fix CI and verify the new run |\n| Organization README is updated, but `llms.txt` is missed | Update both human and machine-readable surfaces |\n| Local path appears in public docs | Replace it with relative paths or generic examples |\n| Public repo contains a test database or notebook inbox | Remove it from tracking, add ignore rules, rerun the gate |\n\n## Final Checklist\n\n- [ ] Local rules and locks checked.\n- [ ] `.gitignore` existed before the first add.\n- [ ] Public docs, license, security, contributing, changelog, and `llms.txt` present.\n- [ ] README includes repo name, purpose, installation, usage, privacy, and license.\n- [ ] i18n expectation met.\n- [ ] Banner, logo, or screenshot present when useful.\n- [ ] Tests and smokes pass.\n- [ ] Privacy, path, secret, database, and mojibake scans clean.\n- [ ] GitHub description, topics, tag, release, and CI verified.\n- [ ] Organization profile, registry, and ecosystem links updated.\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-06-18)\n- Created initial repository care and publication protocol."}, {"id": "protocol:dev:load-project", "name": "load-project", "cat": "dev", "ver": "1.1.0", "status": "active", "desc": "Zu Beginn einer konkreten Projektaufgabe oder bei unklarem Kontext: Ziel auflösen, geltende Regelhierarchie laden, verbindliche Referenzen verfolgen und vor der eigentlichen Arbeit einen evidenzbasierten Lagebericht erstellen.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: load-project\nversion: 1.1.0\ntype: protocol\nauthor: Claude + Codex\ncreated: 2026-06-17\nupdated: 2026-07-28\ndescription: >\n  Zu Beginn einer konkreten Projektaufgabe oder bei unklarem Kontext: Ziel\n  auflösen, geltende Regelhierarchie laden, verbindliche Referenzen verfolgen\n  und vor der eigentlichen Arbeit einen evidenzbasierten Lagebericht erstellen.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\n\ncategory: infrastructure\ntags: [projekt, boot, kontext, regeln, locks, orientierung, onboarding]\nlanguage: de\nstatus: active\n\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\n\nprovenance:\n  origin: \"custom\"\n  origin_path: \"local-agent-skills/load-project/\"\n  origin_version: \"1.0.0\"\n  origin_repo: null\n  last_sync_from_origin: \"2026-07-28\"\n  last_sync_to_origin: null\n  local_changes_since_sync: true\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"load-project banner\">\n# Load Project\n\n## Zweck\n\nNutze diesen Skill zu Beginn einer konkreten Projektaufgabe oder wenn der\nArbeitskontext unklar geworden ist. Ziel ist kein vollständiger Repository-Audit,\nsondern der kleinste belastbare Kontext, mit dem sicher weitergearbeitet werden\nkann.\n\n## Konfiguration\n\nDer Skill benötigt keine festen Verzeichnisnamen. Lokale Installationen können\noptional folgende Werte in ihren allgemeinen Agentenregeln oder einer\nprojektlokalen Konfiguration festlegen:\n\n- bekannte Workspace-Wurzeln,\n- bevorzugte Dateiwerkzeuge,\n- Namen zusätzlicher Boot- oder Registry-Dateien,\n- Lock-Prüfer,\n- projektspezifische Rollen und Prioritäten.\n\nFehlt eine solche Konfiguration, arbeitet der Skill ausschließlich mit dem\nangegebenen Ziel und den dort auffindbaren Projektregeln.\n\n## Ablauf\n\n### 1. Ziel auflösen\n\n1. Expliziten Pfad, Projektnamen oder aktuelle Arbeitsmappe als Startpunkt nehmen.\n2. Den tatsächlichen Projekt- oder Repository-Root bestimmen.\n3. Mehrdeutige Treffer anhand von Aufgabe, Root-Dokumenten und Repository-Grenzen\n   eingrenzen; bei materiell unterschiedlichen Zielen nicht raten.\n\n### 2. Regelhierarchie laden\n\nVom allgemeinen zum spezifischen Kontext lesen:\n\n1. globale Agenten- und Sicherheitsregeln,\n2. Workspace- oder Pipeline-Regeln,\n3. Projekt- und Repository-Regeln,\n4. aufgabenbezogene Anweisungen.\n\nSpezifischere Regeln gelten innerhalb ihres Scopes; höherrangige Sicherheits- und\nAutorisierungsgrenzen bleiben bestehen.\n\n### 3. Root-Dokumente nach Rollen lesen\n\nDateinamen sind Hinweise, keine feste Norm. Suche gezielt nach Dokumenten mit\ndiesen Rollen:\n\n| Rolle | Typischer Inhalt |\n|---|---|\n| Einstieg | Zweck, Navigation, Startanweisung |\n| Regeln | Arbeitsweise, Sprache, Sicherheit, Konventionen |\n| Architektur | Komponenten, Datenfluss, Grenzen |\n| Status | aktueller Stand, offene Probleme, letzte Prüfung |\n| Aufgaben | priorisierte nächste Arbeit |\n| Register | kanonische Projekte, Checks oder Veröffentlichungen |\n| Nachweis | Tests, Prüfprotokolle, Beweisnotizen |\n| Übergabe | laufende Arbeit, fremde Änderungen, nächster Schritt |\n\nNur die für die konkrete Aufgabe relevanten Rollen laden.\n\n### 4. Verbindliche Referenzen verfolgen\n\nWenn eine gelesene Regel weitere Dateien ausdrücklich als Pflichtlektüre nennt,\ndiese gezielt nachladen. Referenzketten beenden, sobald sie für die Aufgabe keinen\nzusätzlichen verbindlichen Kontext mehr liefern.\n\n### 5. Zustand und Sperren prüfen\n\n- Locks anhand der lokalen Policy auf Owner, Scope, Zeitstempel und\n  Gültigkeitskriterium prüfen; ohne definierte Stale-Regel einen Lock nie\n  eigenmächtig für veraltet erklären,\n- Versionskontrollstatus und fremde Änderungen,\n- laufende Prozesse oder Checkpoints, sofern relevant,\n- Aktualität von Registern, Tests und Statusangaben.\n\nDen Ausgangszustand der betroffenen Bereiche vor Änderungen als Status-/Diff-\nBaseline sichern. Lassen sich vorhandene Änderungen nicht sicher zuordnen, gelten\nsie vorsorglich als fremd und bleiben unberührt.\n\nMomentaufnahmen als solche behandeln und vor riskanten Aktionen erneut prüfen.\n\n### 6. Lagebericht erstellen\n\nVor der Umsetzung knapp festhalten:\n\n```text\nZiel:\nProjekt-Root:\nGeltende Regeln:\nEvidenzquellen:\nSnapshot-Zeitpunkt:\nRelevanter Ist-Zustand:\nLocks oder fremde Änderungen:\nErfolgskriterium:\nNächster sicherer Schritt:\n```\n\nQuellen nur so genau nennen, wie es zur Überprüfbarkeit nötig ist. Secrets,\npersonenbezogene Daten und vertrauliche Inhalte redigieren und nicht in den\nLagebericht kopieren.\n\nWenn die Aufgabe damit eindeutig und autorisiert ist, direkt weiterarbeiten.\n\n## Grenzen\n\n- Keine breite, unbeschränkte Dateisuche als Standard.\n- Keine fehlenden Regeln oder Register neu erfinden.\n- Keine alte Statusmeldung als aktuellen Nachweis behandeln.\n- Keine fremden Änderungen überschreiben.\n- Kein Projekt-Onboarding durchführen, wenn nur Kontext für eine konkrete Aufgabe\n  geladen werden soll.\n\n## Changelog\n\n### 1.1.0 (2026-07-28)\n- Feste Nutzer-, Workspace-, Tool- und Providerbindungen entfernt.\n- Rollenbasierte Dokumenterkennung und optionale lokale Konfiguration eingeführt.\n- Lock-Gültigkeit, Dirty-Tree-Provenienz, Snapshot-Nachweise und redigierte\n  Lageberichte operationalisiert.\n\n### 1.0.0 (2026-06-17)\n- Lokale Ausgangsfassung.\n"}, {"id": "skill:dev:migrate-rename", "name": "migrate-rename", "cat": "dev", "ver": "1.0.0", "status": "active", "desc": "Evolutionary file renaming with wrapper files. Enables renames without hard breaks — references are organically updated through usage.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: migrate-rename\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-15\nupdated: 2026-03-15\ndescription: Evolutionary file renaming with wrapper files. Enables renames without hard breaks — references are organically updated through usage.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: dev\ntags: [migration, renaming, wrapper, evolutionary, refactoring]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/workflows/migrate-rename.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-15', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"migrate-rename banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# File Renaming with Wrappers (Evolutionary Migration) (Deutsch)\n\n> Enables file renames WITHOUT hard breaks. References are organically updated through daily usage.\n\n---\n\n## Principle: Evolutionary Migration\n\n```\nBEFORE:                          AFTER:\nold_file.md                      new_file.md (renamed)\n   |                                |\n   +-- Reference A                  +-- old_file.md (wrapper)\n   +-- Reference B                         |\n   +-- Reference C                         +-- Log table\n                                           +-- Instructions\n                                           +-- Link to new_file.md\n```\n\nWhen someone accesses the old path:\n1. Lands at the wrapper file\n2. Adds an entry to the log\n3. Corrects the reference that brought them here\n4. Proceeds to the actual file\n\n---\n\n## Step by Step\n\n### 1. Rename the File\n\n```bash\nmv old_file.md new_file.md\n```\n\n### 2. Create Wrapper File\n\nCreate `old_file.md` with the following content:\n\n```markdown\n# OLD_FILE.md - REDIRECTED (Deutsch)\n\n**Status:** This file has been renamed to `new_file.md`\n\n---\n\n## Migration Log\n\n| Date | Who | Origin | Reference corrected? |\n|------|-----|--------|---------------------|\n| YYYY-MM-DD | [Name] | Initial migration | n/a (wrapper created) |\n\n---\n\n## Instructions\n\n1. **Leave a log entry** (in table above)\n2. **Check origin**: What sent you here?\n3. **Correct reference**: Change `old_file.md` -> `new_file.md`\n4. **Go to the actual file**: [new_file.md](new_file.md)\n\n---\n\n**Target file:** [new_file.md](new_file.md)\n```\n\n### 3. Immediately Correct Critical References\n- Help files (primary documentation)\n- System prompt references\n- CLI code that directly uses the path\n\n### 4. Migrate Remaining References Evolutionarily\nThe rest is automatically corrected through usage.\n\n---\n\n## When to Use the Wrapper Method?\n\n**YES - Wrapper useful:**\n- Many potential references\n- File is referenced by various partners/tools\n- Not a critical system file\n\n**NO - Change all directly:**\n- Few, known references\n- Critical system files (config, DB schema)\n- Performance-critical paths\n\n---\n\n## Cleanup\n\nAfter approximately 30 days or when the log shows no new entries:\n1. Move wrapper file to `_archive/deprecated/`\n2. Or delete completely (if no more entries)\n\n---\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-03-15)\n- Ported from BACH v3.8.0\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*"}, {"id": "skill:dev:model-strategy", "name": "model-strategy", "cat": "dev", "ver": "2.0.0", "status": "active", "desc": "Multi-model orchestration and model-switching strategy. Score-based model selection, cross-agent delegation (Gemini, Codex, Ollama), advisor pairing, escalation triggers, permission matrix, and cost-efficiency optimization.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: model-strategy\nversion: 2.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-15\nupdated: 2026-06-13\ndescription: Multi-model orchestration and model-switching strategy. Score-based model selection, cross-agent delegation (Gemini, Codex, Ollama), advisor pairing, escalation triggers, permission matrix, and cost-efficiency optimization.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: dev\ntags: [model-switching, orchestration, multi-model, cost-optimization, routing, cross-agent, advisor]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/workflows/ing-strategie.md', 'origin_version': '2.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-15', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"model-strategy banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Model-Switching Strategy (Deutsch)\n\n> Multi-model orchestration: score-based model selection, cross-agent delegation, advisor pairing, escalation triggers, and cost-efficiency optimization\n\n---\n\n## 1. Model catalog\n\n### Claude (subagent-capable via the Agent tool)\n\n```\nLevel 4 (Reviewer):   Opus 4.8  — advisor, math review     [user only: /model, /advisor]\nLevel 3 (Strategist): Opus 4.6  — architecture, concepts   [subagent: model:\"opus\"]\nLevel 3 (Creative):   Fable 5   — creative texts, stories  [subagent: model:\"fable\"]\nLevel 2 (Workhorse):  Sonnet 4.6— implementation, debug    [subagent: model:\"sonnet\"]\nLevel 1 (Fast):       Haiku 4.5 — boilerplate, formatting  [subagent: model:\"haiku\"]\n```\n\n### External agents (companion scripts / SSH)\n\n```\nLevel 2-3: Gemini 3.5 pro  — research, scientific databases [agy-companion CLI]\nLevel 2:   Gemini 3.5 flash— fast research                  [agy-companion CLI]\nLevel 2-3: Codex 5.5 (GPT) — code review, code generation   [codex-companion CLI]\nLevel 2:   Codex 4.5 (GPT) — simpler code tasks             [codex-companion CLI]\n```\n\n### Local models (token-free, 24/7)\n\n```\nLevel 1-2: Ollama (Qwen 3.5:35b-a3b) — Haiku-to-Sonnet level [<ollama-host>:11434]\n           Invocation: SSH + curl http://<ollama-host>:11434/v1/chat/completions\n           Or: delegation via an agent-system control API (if available)\n```\n\n### Reachability matrix\n\n| Model | LLM-startable | Invocation path | Constraints |\n|-------|---------------|-----------------|-------------|\n| Sonnet 4.6 | Yes | `Agent(model:\"sonnet\")` | — |\n| Opus 4.6 | Yes | `Agent(model:\"opus\")` | — |\n| Haiku 4.5 | Yes | `Agent(model:\"haiku\")` | — |\n| Fable 5 | Yes | `Agent(model:\"fable\")` | — |\n| Opus 4.8 | Advisor only | `advisor()` in session | user must set `/advisor` |\n| Gemini 3.5 | Yes (Bash) | `companion-for-agy \"prompt\"` | Windows-only, stdout workaround |\n| Codex 5.5/4.5 | Yes (Bash) | `node codex-companion.mjs task \"prompt\"` | auth required |\n| Ollama | Yes (SSH/curl) | SSH + curl to the Ollama host API | VPN/Tailscale must be active |\n| Opus 4.8 as main model | No | user: `/model opus 4.8` | user action only |\n| Fable 5 as main model | No | user: `/model fable` | user action only |\n\n---\n\n## 2. Score computation\n\n```\nDimensions (0-10):\n  CLARITY     : How unambiguous is the task?\n  COMPLEXITY  : How many components?\n  CREATIVITY  : New solutions needed?\n  CONTEXT     : How much prior knowledge?\n  CRITICALITY : How important is perfection?\n\nSCORE = (10 - CLARITY) + COMPLEXITY + CREATIVITY + CONTEXT + CRITICALITY\n```\n\n### Score thresholds\n\n| Score | Model | Examples |\n|-------|-------|----------|\n| 0-8 | Ollama (local host) | prompt generation, summaries, simple texts |\n| 9-12 | Haiku | __init__.py, formatting, boilerplate |\n| 13-22 | Sonnet | implementation, bug fixes, standard code |\n| 13-22 | Gemini 3.5 | research, literature search, scientific databases |\n| 13-22 | Codex 5.5 | code generation (Luau, Node.js), compute scripts |\n| 23-28 | Sonnet + advisor review | complex code with quality check |\n| 23-35 | Fable 5 | creative texts, marketing, storytelling |\n| 29-40 | Opus 4.6 | architecture, strategy, paper writing |\n| 35-50 | Opus 4.6 + advisor | proofs, architecture decisions, statistics |\n| 40-50 | Opus 4.8 (user recommendation) | mathematical proof work, highest rigor |\n\n---\n\n## 3. Cross-agent delegation\n\n### Which external agent for what?\n\n| Task | Best agent | Reason |\n|------|-----------|--------|\n| Scientific literature search | Gemini 3.5 pro | native OpenAlex/arXiv/PubMed skills |\n| Code review (second opinion) | Codex 5.5 | independent perspective |\n| Simple text generation | Ollama (local host) | token-free, 24/7 |\n| Creative texts, marketing | Fable 5 | strongest creative output |\n| Mathematical proofs | Opus 4.8 (advisor) | highest analytical depth |\n\n### Exclusions (documented weaknesses)\n\n- **Gemini:** NOT for mathematical reviews/proof work (documented direction error in a proof review, 2026-06-07)\n- **Codex 4.5:** only when 5.5 is unavailable; otherwise always 5.5\n\n### Invocation paths\n\n> Replace the placeholders `<host>`, `<ollama-host>`, `<tailscale-ip>`, `<user>`, and `~/.ssh/<key>` with your own infrastructure.\n\n**Gemini (via companion-for-agy):**\n```\ncompanion-for-agy --researcher --json --timeout 120000 \"research prompt\"\n```\n\n**Codex (via codex-companion):**\n```\nnode \"~/.claude/plugins/cache/openai-codex/codex/1.0.4/scripts/codex-companion.mjs\" task --effort high \"code prompt\"\n```\n\n**Ollama on a remote host (via SSH):**\n```\nssh -i ~/.ssh/<key> <user>@<tailscale-ip> \"curl -s http://localhost:11434/v1/chat/completions -d '{\\\"model\\\":\\\"qwen3.5:35b-a3b\\\",\\\"messages\\\":[{\\\"role\\\":\\\"user\\\",\\\"content\\\":\\\"Prompt\\\"}]}'\"\n```\n\n**Delegation to an agent system with tools (example):**\n```\ncurl -s -X POST http://<host>:8081/api/chat -H \"Content-Type: application/json\" -d '{\"prompt\": \"...\", \"chat_id\": \"claude-delegate\"}'\n```\n\n---\n\n## 4. Advisor pairing\n\n### Mechanics\n\n`advisor()` is a **session-level tool** — the advisor model is set by the user via `/advisor`, not programmatically. This yields these pairing patterns:\n\n| Pattern | How it works | When to use |\n|---------|--------------|-------------|\n| **Session advisor** | user sets `/advisor opus 4.8`, agent calls `advisor()` | standard for proofs/architecture |\n| **Orchestrator-as-reviewer** | Opus main model reviews Sonnet subagent output | orchestrator is stronger than the worker |\n| **Counter-agent** | agent A works, agent B checks adversarially | independent verification, 2 perspectives |\n| **User recommendation** | agent recommends: \"do this task with opus 4.8 + advisor\" | when the current session is too weak |\n\n### When to recommend an advisor?\n\n- Mathematical proof work (score ≥ 35)\n- Architecture decisions with long-term consequences\n- Statistical methodology / study design\n- Complex bugs after 2+ unsuccessful debug cycles\n\n### When NOT to use an advisor?\n\n- Routine code, content, formatting (score < 23)\n- Simple feature implementation\n- Well-defined, non-critical tasks\n\n---\n\n## 5. Escalation triggers\n\n### Ollama -> Haiku\n- File access required\n- Code analysis needed\n\n### Haiku -> Sonnet\n- More than 2 files affected\n- Decision between alternatives needed\n- Unexpected error occurred\n- Delete operation requested\n\n### Sonnet -> Opus\n- Architecture decision required\n- 3+ systems must be integrated\n- Requirements contradictory/unclear\n- Strategic planning needed\n\n### Sonnet -> Gemini (lateral)\n- Scientific research needed\n- Bibliography verification\n\n### Sonnet -> Codex (lateral)\n- Code review as a second opinion\n- Advisor overloaded (fallback reviewer)\n\n### Opus -> Opus + advisor\n- Proof review needed\n- Critical architecture decision\n- Statistical methodology\n\n### De-escalation\n- Concept defined -> Sonnet takes over implementation\n- Task trivial/repetitive -> Haiku takes over\n- Text only, no tool access -> Ollama takes over\n\n---\n\n## 6. Permission matrix\n\n| Operation | Ollama | Haiku | Sonnet | Opus | Gemini | Codex |\n|-----------|--------|-------|--------|------|--------|-------|\n| Read files | - | Yes | Yes | Yes | Yes* | Yes* |\n| Write files | - | Yes | Yes | Yes | Yes* | Yes* |\n| Delete files | - | - | Yes** | Yes | - | - |\n| System commands | - | - | Yes** | Yes | Yes* | Yes* |\n| Architecture decisions | - | - | - | Yes | - | - |\n| Web research | - | - | Yes | Yes | Yes | - |\n| Call advisor() | - | - | Yes | Yes | - | - |\n\n*via companion script in its own sandbox mode\n**with user confirmation\n\n---\n\n## 7. Cost efficiency\n\n### Token savings through routing\n\n| Task type | Without routing | With routing | Savings |\n|-----------|-----------------|--------------|---------|\n| Trivial | Opus tokens | Ollama (free) | 100% |\n| Boilerplate | Opus tokens | Haiku tokens | ~80% |\n| Standard code | Opus tokens | Sonnet tokens | ~50% |\n| Research | Claude tokens | Gemini tokens | ~70% (different budget) |\n| Code review | advisor() tokens | Codex tokens | ~60% (different budget) |\n\n---\n\n## 8. Golden rule\n\n> \"Opus thinks, Sonnet builds, Haiku executes, Ollama saves. Gemini researches, Codex reviews, Fable narrates.\"\n\n---\n\n## Änderungsprotokoll\n\n### 2.0.0 (2026-06-12)\n- Cross-agent delegation: Gemini, Codex, Ollama (local host) as routing targets\n- Advisor pairing: 4 patterns (session advisor, orchestrator-as-reviewer, counter-agent, user recommendation)\n- Reachability matrix: LLM-startable vs. user-only documented\n- Ollama (Qwen 3.5:35b-a3b, Haiku-to-Sonnet level) added as level 1-2\n- Lateral escalation: Sonnet -> Gemini (research), Sonnet -> Codex (review)\n- Exclusions documented (Gemini not for math)\n- Score thresholds extended to all models\n\n### 1.0.0 (2026-03-15)\n- Ported from BACH v3.8.0 (ing-strategie v2.0.0)\n\n---\n\n*Ported from BACH v3.8.0 | Extended with cross-agent + advisor v2.0.0*"}, {"id": "skill:dev:piggyback-hosting", "name": "piggyback-hosting", "cat": "dev", "ver": "1.0.0", "status": "active", "desc": "Hosting pattern for turning a locally-built application (own database, own API key, in-process state) into a safely hosted one without building user management. Core move — the host stores nothing, the visitor's browser stores everything — so per-visitor accounts, access checks and deletion deadlines become moot instead of needing to be solved. Use when a locally-built app is about to be hosted for multiple visitors, when asked to \"make this hostable without a login\", \"avoid building user accounts\", \"shrink the privacy policy for a hosted tool\", \"who is the data controller if we store nothing\", or when choosing/implementing a server mode (`local`, `huckepack-gift`, `huckepack-only-host`, `pay-membership`). Ships a data-flow-plan template, a privacy-notice template, and a first-look legal assessment (GDPR/TDDDG/UWG, German) as references.", "langs": ["en"], "text": "---\nname: piggyback-hosting\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger + Claude\ncreated: 2026-08-02\nupdated: 2026-08-07\ndescription: Hosting pattern for turning a locally-built application (own database, own API key, in-process state) into a safely hosted one without building user management. Core move — the host stores nothing, the visitor's browser stores everything — so per-visitor accounts, access checks and deletion deadlines become moot instead of needing to be solved. Use when a locally-built app is about to be hosted for multiple visitors, when asked to \"make this hostable without a login\", \"avoid building user accounts\", \"shrink the privacy policy for a hosted tool\", \"who is the data controller if we store nothing\", or when choosing/implementing a server mode (`local`, `huckepack-gift`, `huckepack-only-host`, `pay-membership`). Ships a data-flow-plan template, a privacy-notice template, and a first-look legal assessment (GDPR/TDDDG/UWG, German) as references.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\n\ncategory: dev\ntags: [hosting, privacy, gdpr, dsgvo, byok, client-side-storage, deployment, no-login]\nlanguage: en\nstatus: active\n\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\n\nprovenance:\n  origin: \"custom\"\n  origin_path: null\n  origin_version: null\n  origin_repo: \"github.com/ellmos-ai/skills\"\n  last_sync_from_origin: null\n---\n\n# piggyback-hosting\n\n**A hosting pattern for applications that never accept other people's data in\nthe first place.**\n\n> Blueprint born on 2026-08-02 while building three call agents. Reusable for\n> any application that was designed for a single local user but should also\n> be hostable for others.\n\n## On the name\n\nIn English this pattern is called **piggyback** — riding on infrastructure\nyou don't own is already the term of art for it. English prose in this skill\ntherefore says *piggyback*; **\"huckepack\" is the German working title** the\npattern was built under, and it is also the name of the repository this skill\nwas migrated from. **The literal mode values stay `huckepack-gift` and\n`huckepack-only-host`** — they are what ships in code and configuration, spelled\nexactly that way, regardless of the language the surrounding prose is in.\n\n## The problem\n\nAn application gets built locally: a database, an API key, state living in\nthe process. On your own machine that is simply correct. The moment someone\nhosts it for others, each of those three assumptions turns into a bug — every\nvisitor shares the same state, the same database, the same key. Whoever opens\nthe page sees everyone else's data.\n\nThe usual fix is user management: accounts, login, access checks, deletion\ndeadlines, a privacy notice, a data-processing agreement. Often a bigger\nundertaking than the application itself.\n\n## The idea\n\n**The visitor keeps everything on their own device. The host keeps nothing.**\n\nThis doesn't solve user management — it makes it **moot**. Where no one\nelse's data sits on the server, there is nothing to wall off between\nvisitors, nothing to delete on a schedule, and the privacy notice shrinks to\nwhat the service actually does.\n\n## The three modes\n\n| Mode | API key | Data | User management |\n|---|---|---|---|\n| **`huckepack-gift`** | from the host | on the visitor's device | none |\n| **`huckepack-only-host`** | from the visitor | on the visitor's device | none |\n| **`pay-membership`** | host's, billed | server | required |\n\n- **`huckepack-gift`** — the host supplies their own key and gives the\n  execution away for free. An invitation to try the tool with no friction.\n- **`huckepack-only-host`** — the visitor brings their own key. The host pays\n  nothing and stores nothing.\n- **`pay-membership`** — deliberately kept as a stub. This is where everything\n  the other two avoid — accounts, billing, server-side storage — becomes\n  necessary again. It's a separate undertaking, not a flag to flip.\n\nThere is always a **`local`** default: whoever configures nothing gets the\napplication exactly as it ran before, on their own machine.\n\n## The building blocks\n\n| Block | Purpose |\n|---|---|\n| Mode as an install-time setting | a property of the deployment, not of the session |\n| Swappable storage layer | same database, different location |\n| SQLite in the browser (WASM + OPFS) | same schema, same queries, different execution site |\n| Key field, masked | only in `only-host` mode, never logged |\n| Export and import | **not optional** — browser data is volatile |\n| Receipt as a downloadable file, target folder selectable | no server involved in delivering it |\n\nThe real engineering effort sits in making the storage layer swappable: the\napplication writes to SQLite either way, but a layer in between decides\nwhether that write lands on the server or in the visitor's browser\n(`sql.js` / the official SQLite-WASM build, persisted via the Origin Private\nFile System). Rank the browser-storage options by weight if WASM is too\nheavy: SQLite-WASM + OPFS (a real database, most capacity) > IndexedDB\n(structured, its own query model) > `localStorage` (fine only for small\nthings like language and theme).\n\n## What this pattern does not solve — said plainly\n\n- **Browser data deleted means everything is gone.** There is no server-side\n  copy. This is why export is a condition, not a nice-to-have feature.\n- **No device switch** without an export and an import.\n- **The key living in the browser** (`only-host`) is less protected than one\n  on a server. It does belong to the visitor, though, and the alternative\n  would be handing it to the host — not obviously the safer choice.\n- **Execution still runs through the host.** For services that reach a third\n  party — a phone call, for instance — the host processes that third party's\n  data regardless of where the visitor's own records live. A privacy notice\n  does not become unnecessary, only short.\n\n## What the legal check found\n\nA first-look legal review (`references/RECHT.md`, in German — it examines\nGerman and EU statutes, so quoting them in translation would be less\naccurate, not more accessible) checked the pattern against GDPR, TDDDG and\nUWG. **Ersteinschätzung mit Fundstellen, keine Rechtsberatung** — a first\nassessment with citations, not legal advice. Three findings in one line each:\n\n- **The host stays the data controller even while storing nothing.**\n  GDPR Art. 4(7) attaches controllership to deciding purposes and means, not\n  to storage; the CJEU has said so explicitly (C-683/21). What becomes moot\n  is **user management**, not responsibility.\n- **Nothing shrinks for the person who gets contacted.** Information duties\n  under Art. 14, a documented legal-basis balancing test, a data-processing\n  agreement with whatever service performs the contact — these are usually\n  the longest sections of a privacy notice, and the pattern doesn't touch\n  them.\n- **The household exemption helps the visitor, not the host.** It covers\n  purely personal use by a natural person; a service offered to others is not\n  a purely personal activity. That is exactly where piggyback hosting begins.\n\nThe gain is in the **volume of obligations and the size of the exposure**,\nnot in their kind — which is also the more honest claim to make about the\npattern.\n\n## How to apply this pattern\n\n1. Read `references/DATA-FLOW-TEMPLATE.md` and fill it in for the actual\n   application, evidence-first (every row needs a `file:line`, or \"not\n   found\"). This surfaces exactly which local assumptions break under\n   multi-visitor hosting before any code changes.\n2. Decide which modes the application actually needs — `local` is always the\n   default; `huckepack-gift` and `huckepack-only-host` are the two that avoid\n   user management; `pay-membership` stays a stub unless there is a concrete\n   reason to build real accounts.\n3. Make the storage layer swappable (the core engineering step above), add\n   the masked key field for `only-host`, and wire up export/import before\n   anything ships — it is the safety net for volatile browser storage.\n4. Fill in `references/PRIVACY-TEMPLATE.md` for the concrete deployment;\n   delete the blocks that don't apply, verify every provider fact from\n   current contracts, and get a case-specific legal review before real data\n   is processed. The template is a starting point, not a finished notice.\n5. For any installation touching real third parties (phone calls, messages\n   to people who did not sign up themselves) or research participants, treat\n   `references/RECHT.md`'s recommendations as a checklist, not as clearance —\n   involve a lawyer before the first public run.\n\n## References\n\n- `references/DATA-FLOW-TEMPLATE.md` — template and method for a data-flow\n  plan: every row needs a file:line, or it's a belief, not a finding.\n- `references/PRIVACY-TEMPLATE.md` — sample privacy notice with marked\n  placeholders for a piggyback installation.\n- `references/RECHT.md` — first-look legal assessment (German) with GDPR,\n  TDDDG and UWG citations.\n\nBoth templates are **samples, not legal advice**. Whoever hosts an\napplication adapts them and is responsible for the result.\n\n## Origin\n\nEmerged while building HungryCall, Ringedingeding and ResearchCall — three\ncall agents where a data-flow audit showed that hosting them unmodified would\nhave been a privacy incident with a name attached to it. Migrated from the\nstandalone `huckepack` repository into this skill library.\n"}, {"id": "protocol:dev:pipeline-optimizer", "name": "pipeline-optimizer", "cat": "dev", "ver": "1.2.0", "status": "active", "desc": "Structured 6-step procedure for improving, renovating, or rebuilding existing pipelines, individual project folders, documentation structures, or software stacks. Addressable as \"pipeline optimizer\" (for whole topic pipelines, e.g. a software, research, or game-dev pipeline) or \"project-folder optimizer\" (for individual project folders within a pipeline, e.g. a single software tool or paper project). Triggers on tasks like \"improve pipeline X\", \"optimize the stack\", \"rebuild Y\", \"renovation\", \"pipeline refactoring\", \"clean up project folder\", \"improve folder structure\", \"unify conventions\", \"documentation consolidation\", \"integrate into existing system\", or any substantial intervention in established structures. Delivers building-stock analysis, purpose clarification, ideal sketch, gap plan, empirical pain-point identification, and retests with fresh subagents. Prevents parallel standards, duplication, and pipeline breaks.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: pipeline-optimizer\nversion: 1.2.0\ntype: protocol\nauthor: Lukas Geiger (method) + Claude (write-up)\ncreated: 2026-05-16\nupdated: 2026-06-13\naliases: [project-folder-optimizer, pipeline-renovator, project-renovator]\ndescription: Structured 6-step procedure for improving, renovating, or rebuilding existing pipelines, individual project folders, documentation structures, or software stacks. Addressable as \"pipeline optimizer\" (for whole topic pipelines, e.g. a software, research, or game-dev pipeline) or \"project-folder optimizer\" (for individual project folders within a pipeline, e.g. a single software tool or paper project). Triggers on tasks like \"improve pipeline X\", \"optimize the stack\", \"rebuild Y\", \"renovation\", \"pipeline refactoring\", \"clean up project folder\", \"improve folder structure\", \"unify conventions\", \"documentation consolidation\", \"integrate into existing system\", or any substantial intervention in established structures. Delivers building-stock analysis, purpose clarification, ideal sketch, gap plan, empirical pain-point identification, and retests with fresh subagents. Prevents parallel standards, duplication, and pipeline breaks.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: false\ncategory: dev\ntags: [pipeline, renovation, refactoring, stack, workflow, lessons-learned]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'custom', 'origin_path': '~/.claude/skills/pipeline-optimizer/', 'origin_version': '1.1.1', 'last_sync_from_origin': '2026-05-16', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"pipeline-optimizer banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Pipeline Optimizer / Project-Folder Optimizer (Deutsch)\n\n**6-step renovation without incompatibilities** — applicable at two scales:\n\n| Trigger name | Scope | Example |\n|---|---|---|\n| **Pipeline optimizer** | Whole pipelines, stacks, documentation structures | Your topic pipelines, e.g. `software/`, `research/`, `games/`, an agent system |\n| **Project-folder optimizer** | Individual project folders within a pipeline | A software tool, a paper project, a game project |\n\nA **pipeline** here means a topic-oriented top-level structure in which multiple projects live under shared conventions (e.g. a software pipeline with release rules, a research pipeline with a publication procedure).\n\nBoth use the same 6-step workflow — the only difference is the **scope** (pipeline-wide vs. single project) and, accordingly, the depth of the building-stock survey in step A.\n\n## When this skill applies\n\nThe skill applies as soon as you are asked to improve, rebuild, or extend an **existing** structure — not for greenfield construction. Concrete triggers:\n\n**Pipeline level** (scope: whole pipeline):\n- \"Make pipeline X better\"\n- \"Optimize the stack\"\n- \"Renovate the software pipeline\"\n- \"Documentation consolidation in the research pipeline\"\n- Substantial intervention in a topic pipeline, central `_tools/`, or system components\n\n**Project-folder level** (scope: single project folder):\n- \"Clean up / optimize project folder X\"\n- \"Improve the folder structure in Y\"\n- \"Refactor a single tool\"\n- \"Unify a paper-project setup\"\n- \"Align a game project folder with the pipeline standard\"\n\n**Cross-cutting:**\n- \"Rebuild X / integrate it into existing Y\"\n- \"Refactoring\", \"consolidation\"\n- \"Unify conventions\"\n- \"Integrate into an existing system\"\n\n## The building-stock metaphor\n\nRenovating a house first requires knowing **what it is made of** (stone, wood, plastic), **what it is for** (mountain hut, software forge), and **where it already fulfills functions**. The same discipline applies to pipelines.\n\n---\n\n## Procedure — 6 steps (do NOT skip, do NOT reorder)\n\n### Step A — Survey the building stock\n\n**Question:** What is the house made of?\n\n**Pipeline scope** (all root docs + tools + templates):\n- [ ] **Read all root documents completely** (not just snippets/insertion points)\n- [ ] Go through template folders (`_templates/`, `_TEMPLATES/`) and tool folders (`_tools/`)\n- [ ] Policy files: e.g. GITHUB-POLICY.md, RELEASE-MANAGEMENT.md, QUALITY_RULES.md, NAMING-SYSTEM.md, publication procedures, …\n- [ ] Status snapshots: e.g. PROJECT_STATUS.md, status overviews, releases.json, registry files\n- [ ] Checklists: e.g. release checklists, build/PDF checklists\n- [ ] Workflows: AGENTS.md, GUIDE.md, SKILL.md\n- [ ] Lessons-learned files: LESSONS_LEARNED.md, MEMORY.md, loop-state files\n\n**Project-folder scope** (single-project substance + relevant pipeline conventions):\n- [ ] **Read all markdown and control files in the project folder** (README, CHANGELOG, TASKS/TODO, DONE, CONCEPT, action plan, proof notes, …)\n- [ ] **Survey the code structure:** src/, tests/, build configuration (pyproject.toml, requirements.txt, project manifests, toolchain files, …)\n- [ ] **Take the parent pipeline's conventions into account** (e.g. for a software project: GitHub policy, naming system, release management, templates)\n- [ ] **Scan existing tools/scripts in the project** (`_tools/`, `_scripts/`, build_*.bat, START scripts)\n- [ ] **Configuration files:** `.gitignore`, LICENSE, NOTICE, SECURITY.md, CODE_OF_CONDUCT.md\n\n**Anti-pattern:** Using `grep -l \"<keyword>\"` to find insertion points and inserting there without knowing the file's context.\n\n**Output:** Inventory note with all relevant conventions, tools, and templates at the chosen scope.\n\n### Step B — Identify the purpose\n\n**Question:** What does the house exist for?\n\nState the purpose explicitly in 1-2 sentences.\n\n**Pipeline examples:**\n\n| Pipeline | Purpose |\n|---|---|\n| Software pipeline | Develop, test, and release desktop apps + browser tools to stores/GitHub |\n| Research pipeline | Write scientific papers, peer-review them, publish to repositories/preprint servers |\n| Game pipeline | Develop games and publish them on the target platform |\n| Agent system | LLM system for multi-agent orchestration |\n\n**Project-folder examples:**\n\n| Project folder | Purpose |\n|---|---|\n| `software/PlannerApp` | Planning desktop app, commercial, private repo |\n| `research/CosmologyModel` | Model paper series + numerical computations |\n| `games/SortingChaos` | Sorting game, alpha stage, level progression |\n\nThe purpose **steers every intervention** — measures that do not serve the purpose are dropped.\n\n### Step C — Sketch the ideal picture\n\n**Question:** What would a perfect house for this purpose look like?\n\n- Sketch it from your own perspective (short, max. 10 points)\n- Bring in a best-practice comparison (e.g. Vercel stack for SaaS, scientific-python stack for research)\n- Do not descend into detail optimization — a top-level sketch is enough\n\n**Output:** 5-10 points \"ideal state per pipeline\"\n\n### Step D — Gap analysis + plan\n\n**Four questions per pipeline:**\n\n1. **What does the house already have?** — Even if solved differently from the ideal but **functionally equivalent**.\n   *Example:* The ideal says \"pip-licenses for third-party licenses\". Reality: a custom generator script wraps it → functionally equivalent, no intervention needed.\n\n2. **What impedes the function?** — Existing structures that cause breaks or extra effort today.\n\n3. **What is non-functional?** — Dead code, outdated conventions, unused tools.\n\n4. **What would measurably improve functions?** — Concrete interventions with expected benefit.\n\n→ From this, a **concrete plan**:\n- What gets **newly built**?\n- What gets **extended**?\n- What gets **demolished**?\n- What stays **unchanged** (important to name!)\n\n**Output:** Plan table with columns *Intervention* / *Existing* / *Measure* / *Rationale*\n\n### Step E — Work empirically\n\nDo not only plan top-down — collect pain points:\n\n- [ ] **Known bugs**: issue tracker, TASKS/TODO/DONE files\n- [ ] **Error history**: lessons-learned files, bugfix logs, check registries\n- [ ] **Automation breaks**: \"What do I always have to do manually?\"\n- [ ] **User interview**: ask specifically — pain points, wishes, workarounds\n- [ ] **Self-test**: walk through the pipeline (create a new project, run a build, simulate a release) — where does it break?\n\nThe empirically found pain points **prioritize the plan** from step D.\n\n### Step F — Retests after implementation\n\n- [ ] Commission **fresh subagents** (unburdened by the renovation context) to walk through the changed workflow\n- [ ] **Measurable before/after values**: setup time, error rate, number of manual steps, build time\n- [ ] **Anti-regression check**: do existing workflows still work after the change?\n- [ ] If there is **no measurable improvement** or a regression: **roll back** the renovation or readjust\n\n## Anti-patterns (forbidden)\n\n| Anti-pattern | Damage | Antidote |\n|---|---|---|\n| Searching insertion points instead of reading docs | Parallel standards | Step A in full |\n| Transferring \"best practice from X\" 1:1 | Incompatibility | Step D compares functionally |\n| Creating a new file without checking conventions | Duplication (e.g. NOTICE.md ↔ THIRD_PARTY_LICENSES.txt) | Step A + step D |\n| Planning top-down without empirics | Solution misses the pain point | Step E before finalizing the plan |\n| Not testing your own change | Undetected regression | Step F with a fresh agent |\n| \"Clarify later\" with unclear status | User discovers the conflict afterwards | When unsure, walk step D through with the user again |\n\n## Case study — the NOTICE.md incident\n\n**Assignment:** Implement pipeline
