t that knows and unifies the three specialist skills `/rojo` (filesystem→Studio sync, project setup), `/rbx-studio` (editor, MCP, assets, malware scan) and `/game-design` (roles, workflows, GDD). Use this skill for ANY Roblox game-dev undertaking: planning/building/setting up a Roblox game, scaffolding a new project, defining code architecture (Main + manager modules, _G.ClientState + HUD, remotes in GameEnums), avoiding Luau/Roblox pitfalls, or when it is unclear which of the Roblox specialist skills fits — routing happens from here. Also trigger on \"develop Roblox game\", \"build Roblox game\", \"new Roblox project\", \"Luau project structure\", \"how do I organize Roblox code\", \"Roblox dev setup\".", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: rbx-dev\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger + Claude\ncreated: 2026-06-17\nupdated: 2026-06-17\ndescription: Meta-skill for complete Roblox game development with Rojo — the entry point that knows and unifies the three specialist skills `/rojo` (filesystem→Studio sync, project setup), `/rbx-studio` (editor, MCP, assets, malware scan) and `/game-design` (roles, workflows, GDD). Use this skill for ANY Roblox game-dev undertaking: planning/building/setting up a Roblox game, scaffolding a new project, defining code architecture (Main + manager modules, _G.ClientState + HUD, remotes in GameEnums), avoiding Luau/Roblox pitfalls, or when it is unclear which of the Roblox specialist skills fits — routing happens from here. Also trigger on \"develop Roblox game\", \"build Roblox game\", \"new Roblox project\", \"Luau project structure\", \"how do I organize Roblox code\", \"Roblox dev setup\".\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: game-dev\ntags: [roblox, luau, rojo, studio, game-design, architektur, meta, gamedev]\nlanguage: de\nstatus: active\ndependencies: {'tools': ['rojo', 'rokit'], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'custom', 'origin_path': '~/.claude/skills/rbx-dev/', 'origin_version': '1.0.0', 'origin_repo': None, 'last_sync_from_origin': None, 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"rbx-dev banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n> **Note:** Not affiliated with Roblox Corporation; \"Roblox\" is a trademark of its owners. \"rbx\" is the common community shorthand.\n\n\n\n# Roblox-Dev — Meta-Skill for Roblox Game Development (Deutsch)\n\n## Übersicht & Zweck\n\nThe central entry point for Roblox game dev with a Rojo-based, version-controllable workflow.\nThis skill bundles the overarching knowledge — project structure, architecture patterns and the\nmost important Luau pitfalls — and routes specialist questions to the three sub-skills:\n\n| Sub-skill | What for |\n| --- | --- |\n| **`/rojo`** | Filesystem→Studio sync, `default.project.json`, rokit/Wally/Lune, project skeleton, sync problems |\n| **`/rbx-studio`** | Studio operation, scene-vs-code mode, Studio MCP, asset pipeline, **malware scan** |\n| **`/game-design`** | Roles & subtasks, development chains, Game Design Document (KONZEPT.md), multi-agent |\n\n> Routing rule: If it's about **sync/build/setup** → `/rojo`. About **editor/assets/testing in Studio**\n> → `/rbx-studio`. About **concept/roles/process** → `/game-design`. About **code architecture,\n> Luau pitfalls or the overall flow** → stay here.\n\n## Stack at a Glance\n\n- **Language:** Luau (`.luau`, not `.lua`). Code in English, comments/docs in German, UI texts in German.\n- **Sync:** Rojo via rokit (pinned tool versions). Filesystem = source of truth.\n- **Tools:** Rojo (sync/build), Lune (tests/scripts outside Studio), Wally (packages),\n  optionally Knit (service/controller framework, new projects), Selene (linter).\n- **Control:** Roblox-Studio-MCP for AI-driven inspection/tests/asset insertion.\n\n## Project Structure (Standard)\n\n```\nProjektName/\n├── default.project.json     # Rojo-Mapping\n├── rokit.toml               # gepinnte Tool-Versionen\n├── wally.toml               # Package-Dependencies\n├── KONZEPT.md               # Game Design Document\n├── src/\n│   ├── shared/              # → ReplicatedStorage(.ProjektName.shared)\n│   │   ├── Config.luau      # zentrale Werte, States, Gameplay-Parameter\n│   │   ├── GameEnums.luau   # Enums, Remote-Namen, Konstanten\n│   │   └── *Defs.luau       # Datendefinitionen (Items, Einheiten, Level)\n│   ├── server/              # → ServerScriptService(.ProjektName)\n│   │   ├── Main.server.luau # EINZIGER Server-Entry-Point (Script)\n│   │   └── *Manager.luau    # ModuleScripts, von Main per require() geladen\n│   ├── client/              # → StarterPlayerScripts(.ProjektName)\n│   │   └── GameClient.client.luau   # Client-Entry-Point (LocalScript)\n│   └── gui/                 # → StarterGui(.ProjektName)\n│       └── *HUD.client.luau # GUI-Aufbau + Heartbeat-Loop\n└── assets/                  # optionale .rbxm/.rbxl (scriptfrei)\n```\n\nA skeleton is created by `/rojo` via `scaffold_roblox_project.sh`.\n\n## Architecture Patterns\n\n**Server — Main + manager modules.** Only **one** Script per project: `Main.server.luau`. It\ncentrally creates the remotes folder and loads all feature modules via `require()`:\n```lua\nMain.server.luau (Script)\n  ├─ require(StationManager)     -- .luau ModuleScripts\n  ├─ require(PlayerSession)\n  └─ erstellt RemoteEvents → verbindet OnServerEvent-Handler\n```\nAll other server files are `.luau` (ModuleScripts).\n\n**Client — shared state + HUD.** The GameClient writes a shared state, the HUD reads\nit in the Heartbeat:\n```lua\n-- GameClient:\n_G.ClientState = { gameState = \"Lobby\", health = 100 }\n-- HUD:\nRunService.Heartbeat:Connect(function()\n    local cs = _G.ClientState; if not cs then return end\n    healthBar.Size = UDim2.new(cs.health / cs.maxHealth, 0, 1, 0)\nend)\n```\n\n**Remotes — centralized in GameEnums.** Define remote names once in `GameEnums.Remotes`;\nthe server creates the events from them, the client looks them up via the same names. That way there are no\nstring mismatches between server and client.\n\n## Overall Flow of a Game\n\n1. **Concept** (`/game-design`): KONZEPT.md — genre, USP, 3–4 core mechanics, monetization.\n2. **Setup** (`/rojo`): scaffold the skeleton, define the `default.project.json` mapping.\n3. **Backend**: Config → GameEnums → *Defs → Main.server → *Manager.\n4. **Frontend**: GameClient → HUD.\n5. **Greybox playtest** (`/rbx-studio`): gameplay first, parts + optionally AI materials.\n6. **Asset upgrade** (`/rbx-studio`): Creator Store assets, **malware scan**, scene as .rbxl.\n7. **Test** (`/game-design`): QA + game critic + persona blind tests, iterate.\n8. **Release** (`/game-design` business role): store page, monetization, live ops.\n\n## Luau/Roblox Pitfalls (Short List)\n\nThe most common pitfalls — full, annotated list:\n[`references/lessons-learned-luau.md`](references/lessons-learned-luau.md).\n\n- Semicolon after `task.wait(x)` when more code follows on the same line.\n- `Model.Position` does not exist → `model:GetPivot().Position`.\n- `#table` on dictionaries = 0 → count manually.\n- `mouse.Hit` can be nil → check before use.\n- DataStore calls **always** in `pcall`.\n- `tick()` deprecated → `os.clock()`; `SetPrimaryPartCFrame` → `PivotTo`.\n- Event names centralized in `GameEnums.Remotes`; create all remotes in `Main.server.luau`.\n- No circular `require`s (otherwise deadlock).\n- `require()` only on `.luau` ModuleScripts, never on Scripts/LocalScripts.\n\n## Before Every Commit (Checklist)\n\n- [ ] Semicolons after `task.wait(...)` in multi-statement lines\n- [ ] no `Model.Position`, no `tick()`, no `SetPrimaryPartCFrame`\n- [ ] DataStore in `pcall`, `mouse.Hit` checked for nil\n- [ ] event names match server↔client (via GameEnums)\n- [ ] all RemoteEvents created in `Main.server.luau`\n- [ ] no circular requires\n- [ ] marketplace assets scanned (`/rbx-studio` → malware scan), reports filed\n\n## Knowledge Sources\n\n- **Current engine/creator docs:** Context7 MCP — `resolve-library-id` →\n  `/websites/create_roblox_reference_engine` (engine API) and `/roblox/creator-docs`\n  (tutorials/guides); fallback <https://create.roblox.com/docs>.\n- **Reference pipeline** (if present on this system): `<your Roblox project pipeline>` —\n  including `SKILL.md`, `GUIDE.md`, `LESSONS_LEARNED.md`, `ROJO_FAQ.md`, `ROBLOX_MCP_FAQ.md`,\n  `AGENT_ROLES.md`, `_malware_reports/PATTERNS.md`, `_knowledge/` (local API cache).\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-06-17)\n- Initial version. Meta-skill over `/rojo`, `/rbx-studio`, `/game-design`; project structure,\n  architecture patterns and Luau lessons distilled from the `.ROBLOX` pipeline, user-neutral."}, {"id": "skill:game-dev:rbx-studio", "name": "rbx-studio", "cat": "game-dev", "ver": "1.0.0", "status": "active", "desc": "Operating Roblox Studio for game development — the visual editor in which the 3D scene is built, tested, and published. Use this skill for: Studio basics (Explorer, Workspace, play-test, saving the place as .rbxl), the interplay with Rojo (Connect, scene-vs-code mode), AI control of Studio via the Roblox-Studio-MCP (execute_luau, insert_from_creator_store, generate_material, screen_capture, Play/Stop, reading the Console), the complete asset-pipeline workflow (Creator Store → clean up → kit → scene → .rbxl → Rojo brings it to life), and above all the MANDATORY malware scan for marketplace assets. Also trigger on \"embed an asset from the Store\", \"Studio MCP not working\", \"studios: []\", \"generate material\", \"save scene\", \"is this Roblox asset safe\", \"scripts disappear after Play\".", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: rbx-studio\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger + Claude\ncreated: 2026-06-17\nupdated: 2026-06-17\ndescription: Operating Roblox Studio for game development — the visual editor in which the 3D scene is built, tested, and published. Use this skill for: Studio basics (Explorer, Workspace, play-test, saving the place as .rbxl), the interplay with Rojo (Connect, scene-vs-code mode), AI control of Studio via the Roblox-Studio-MCP (execute_luau, insert_from_creator_store, generate_material, screen_capture, Play/Stop, reading the Console), the complete asset-pipeline workflow (Creator Store → clean up → kit → scene → .rbxl → Rojo brings it to life), and above all the MANDATORY malware scan for marketplace assets. Also trigger on \"embed an asset from the Store\", \"Studio MCP not working\", \"studios: []\", \"generate material\", \"save scene\", \"is this Roblox asset safe\", \"scripts disappear after Play\".\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: game-dev\ntags: [roblox, studio, mcp, assets, creator-store, malware, luau, gamedev]\nlanguage: de\nstatus: active\ndependencies: {'tools': ['rojo'], 'services': ['roblox-studio-mcp'], 'protocols': [], 'python': []}\nprovenance: {'origin': 'custom', 'origin_path': '~/.claude/skills/rbx-studio/', 'origin_version': '1.0.0', 'origin_repo': None, 'last_sync_from_origin': None, 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"rbx-studio banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n> **Note:** Not affiliated with Roblox Corporation; \"Roblox\" is a trademark of its owners. \"rbx\" is the common community shorthand.\n\n\n\n# Roblox Studio — Editor, Test, Assets, MCP (Deutsch)\n\n## Übersicht & Zweck\n\nRoblox Studio is the official editor: build the 3D scene, test the game in play mode,\ninsert assets from the Creator Store, and publish the place. In a Rojo workflow,\nStudio owns the **scene** (Workspace, Terrain, placed models) and the **testing** —\nthe **code** comes via Rojo from the filesystem (see skill `/rojo`).\n\nThis skill covers: Studio basics, the clean separation of scene and code work,\nAI control via the Roblox-Studio-MCP, and the asset workflow including the\n**mandatory malware scan** for every marketplace asset.\n\n## Basics\n\n- **Explorer** — tree of all instances (Workspace, ServerScriptService, ReplicatedStorage, …).\n  With Rojo active, the mapped areas are populated live from the filesystem.\n- **Play-Test** — the green Play button (or F5) starts a local server+client session.\n  After every start, **check the Output console for errors** — the most important debug reflex.\n- **Save place** — File → Save As → `.rbxl` (binary) or `.rbxlx` (XML, diffable).\n  The saved place contains the **scene**. Code lives in the filesystem, not in the place.\n\n## The critical workflow: scene mode vs. code mode\n\nOn Connect, Rojo overwrites all mapped script areas with the filesystem content.\nThe `Workspace` (3D scene) is **not** mapped and stays intact. From this follows the\nmost important rule of daily work — never mix the two modes:\n\n**Mode A — edit the scene (Rojo OFF):**\n1. Stop the Rojo server (`taskkill //F //IM rojo.exe` or Ctrl+C).\n2. Open the place in Studio, place assets, build the world, arrange.\n3. File → Save → the `.rbxl` now holds the new scene.\n\n**Mode B — test the code (Rojo ON):**\n1. Open the same place in Studio.\n2. Start `rojo serve` → in Studio's Rojo plugin → Connect.\n3. Press Play and test. Rojo syncs the scripts; the Workspace comes from the `.rbxl`.\n4. While Rojo is running, **do not** save (otherwise the Rojo state freezes into the `.rbxl`).\n\nThis way, scene work (Studio) and code work (editor + Rojo) can run in parallel and\nconflict-free — artists build scenes, developers write code.\n\n## Roblox-Studio-MCP — AI controls Studio\n\nThe Roblox-Studio-MCP lets Claude/Gemini/Codex directly control a **running** Studio\ninstance: execute code, inspect, Play/Stop, read the Console, insert assets. It does **not**\nreplace Rojo — it complements it: Rojo for persistent code changes, MCP for inspection,\ntests, asset insertion, and material generation.\n\n```\nEditor + Rojo  ──(persistenter Code-Sync)──►  Studio (laufend)  ◄──(Inspektion/Test/Insert)──  MCP ◄── KI\n```\n\n### Available MCP tools (typical)\n\n| Tool | Purpose |\n| --- | --- |\n| `list_roblox_studios` / `set_active_studio` | list open instances / select the active one |\n| `search_game_tree` / `inspect_instance` | search the hierarchy / read properties |\n| `execute_luau` | execute Luau code directly in Studio |\n| `script_read` / `script_grep` / `script_search` | analyze scripts |\n| `multi_edit` | change multiple instances/scripts in a batch |\n| `start_stop_play` | control Play/Stop |\n| `get_console_output` | read the Output log |\n| `screen_capture` | screenshot of the scene |\n| `insert_from_creator_store` | insert an asset from the Creator Store |\n| `generate_material` | generate an AI material/texture (MaterialVariant) |\n| `character_navigation` / `user_keyboard_input` / `user_mouse_input` | simulate input |\n\n### Setup (user-neutral)\n\nThe MCP runs as a server shipped with Studio, often connected via a thin JSON-filter wrapper\n(it filters out non-JSON banners that some clients otherwise cannot parse):\n\n- MCP batch (Windows): `%LOCALAPPDATA%\\Roblox\\mcp.bat`\n- optional wrapper: `<your roblox-mcp wrapper>`\n  (if present on this system; shared by Claude/Codex/Gemini)\n- Client configs: `~/.claude/mcp.json` · `~/.codex/config.toml` · `~/.gemini/antigravity/mcp_config.json`\n\nExample entry (`~/.claude/mcp.json`):\n```json\n{\n  \"mcpServers\": {\n    \"Roblox_Studio\": {\n      \"command\": \"node\",\n      \"args\": [\"<your roblox-mcp wrapper>\",\n               \"cmd.exe\", \"/c\", \"%LOCALAPPDATA%\\\\Roblox\\\\mcp.bat\"]\n    }\n  }\n}\n```\n\n### Common MCP problems\n\n| Symptom | Meaning / fix |\n| --- | --- |\n| `studios: []` or `Not connected to WS host` | not immediately \"broken\": send `initialize` → wait 2–3 s → `list_roblox_studios`; otherwise restart Studio |\n| `Error: connection closed: initialized request` | Studio is not open at all — start Studio, load the place, try again |\n| scripts written via MCP gone after Play/Stop | MCP edits to code are not persistent — for lasting code changes use **Rojo** |\n| value via `require()` in the plugin VM is wrong | the plugin VM has its own require cache — to verify, read `.Source` directly or check the server log after Play |\n\n## Asset pipeline (Creator Store → game)\n\nGreybox first (gameplay), assets later (before release). The proven sequence:\n\n```\nSTORE DURCHSUCHEN   → z. B. \"medieval\" → mehrere Kandidaten laden\nAUSSORTIEREN        → stilfremde/hässliche raus, 5–8 passende behalten\nBEREINIGEN          → ALLE Scripts entfernen (Malware!), nur Geometrie/Meshes behalten\nKIT / SET BAUEN     → aus Basis-Assets Varianten ableiten (gleiche Materials/Proportionen)\nSZENE BAUEN (Studio)→ Assets zur Kulisse zusammensetzen (Dorf, Arena, Park)\nALS .RBXL SPEICHERN → die Kulisse ist die \"Bühne\"\nROJO BELEBT ES      → Scripts/Gameplay/HUD kommen per Rojo dazu; Workspace bleibt unangetastet\n```\n\n**Variant technique (\"modular kit\"):** Take a good base asset and derive a whole\nset from it (house → tower, barn, smithy, ruin). They all share materials, colors, and\nproportions → a consistent look with minimal effort, the way pro studios do it.\n\n**Asset sources (priority):** Creator Store (free, huge, **malware check mandatory**) →\nAI materials (`generate_material`) → your own meshes (Blender → .fbx) → purchased asset packs.\n\n## MANDATORY: malware scan for marketplace assets\n\nCreator Store assets can contain obfuscated malicious scripts (backdoors, remote code,\nbot-network hooks). Scan **every** imported asset before use and remove all scripts —\nkeep only geometry/meshes.\n\n- Pattern reference: [`references/malware-patterns.md`](references/malware-patterns.md) — the 8\n  known obfuscation patterns (reversed attribute payload, fake system script, remote\n  `require()`, `loadstring`, `string.char`, `getfenv/setfenv`, hidden Values, delayed execution).\n- Scanner: [`scripts/scan_asset_malware.luau`](scripts/scan_asset_malware.luau) — run it in Studio via\n  `execute_luau` (or the Command Bar); it checks an instance against all patterns and reports finds.\n\n**Red flags immediately:** a large script in a pure decoration model · reversed strings in\nattributes · `require(<number>)` · `loadstring` · `HttpService` in an asset that needs no\nnetworking. When in doubt: delete the script. Document finds (e.g. `_malware_reports/YYYY-MM-DD_*.md`\nin the reference pipeline).\n\n## Important Luau/Studio pitfalls (excerpt)\n\nThe most common ones that bite in Studio — the full list is kept by the skill `/rbx-dev`:\n\n- `Model.Position` does not exist → `model:GetPivot().Position`.\n- `tick()` is deprecated → `os.clock()` / `workspace:GetServerTimeNow()`.\n- `SetPrimaryPartCFrame()` deprecated → `model:PivotTo(cf)`.\n- DataStore calls **always** in `pcall`.\n- Baseplate + procedural floor at the same height → Z-fighting (flicker): remove the baseplate\n  or raise the floor by +0.1 studs.\n- Keep an eye on the part budget (~50–80 parts per procedurally generated room).\n\n## Further reading\n\n- Sister skills: `/rojo` (sync, project setup), `/game-design` (roles, workflows, GDD),\n  meta skill `/rbx-dev` (architecture patterns + all Luau lessons).\n- Engine/Creator docs: Context7 MCP (`/websites/create_roblox_reference_engine`,\n  `/roblox/creator-docs`) or <https://create.roblox.com/docs>.\n- Reference pipeline (if present): `<your Roblox project pipeline>`\n  (`ROBLOX_MCP_FAQ.md`, `ASSET_PIPELINE.md`, `_malware_reports/PATTERNS.md`).\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-06-17)\n- Initial version. Distilled from the `.ROBLOX` pipeline (ROBLOX_MCP_FAQ, ASSET_PIPELINE,\n  PATTERNS, LESSONS_LEARNED), written user-neutral."}, {"id": "skill:game-dev:rojo", "name": "rojo", "cat": "game-dev", "ver": "1.0.0", "status": "active", "desc": "Operating Rojo — the filesystem-to-Roblox-Studio sync tool for professional Roblox development in VS Code / Claude Code instead of the Studio editor. Use this skill whenever Rojo is involved: `rojo serve`/`rojo build`, writing or debugging `default.project.json`, rokit/rokit.toml and tool versions (Rojo, Lune, Wally), nested vs. flat path mapping (ReplicatedStorage.Project.shared), connect/port/sync problems, or when a Roblox project skeleton needs to be created. Also trigger on \"rojo connect not working\", \"scripts end up in the wrong place in Studio\", \"how do I map src/ to Studio\", \"port 34872 in use\", \"ModuleScript vs Script in Rojo\".", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: rojo\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger + Claude\ncreated: 2026-06-17\nupdated: 2026-06-17\ndescription: Operating Rojo — the filesystem-to-Roblox-Studio sync tool for professional Roblox development in VS Code / Claude Code instead of the Studio editor. Use this skill whenever Rojo is involved: `rojo serve`/`rojo build`, writing or debugging `default.project.json`, rokit/rokit.toml and tool versions (Rojo, Lune, Wally), nested vs. flat path mapping (ReplicatedStorage.Project.shared), connect/port/sync problems, or when a Roblox project skeleton needs to be created. Also trigger on \"rojo connect not working\", \"scripts end up in the wrong place in Studio\", \"how do I map src/ to Studio\", \"port 34872 in use\", \"ModuleScript vs Script in Rojo\".\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: game-dev\ntags: [rojo, roblox, luau, rokit, wally, lune, sync, build, gamedev]\nlanguage: de\nstatus: active\ndependencies: {'tools': ['rojo', 'rokit'], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'custom', 'origin_path': '~/.claude/skills/rojo/', 'origin_version': '1.0.0', 'origin_repo': None, 'last_sync_from_origin': None, 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"rojo banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Rojo — Filesystem → Roblox Studio Sync (Deutsch)\n\n## Übersicht & Zweck\n\nRojo connects a normal filesystem project (`.luau` files in `src/`, versioned with Git)\nto Roblox Studio. You write code in the editor of your choice (VS Code, Claude Code), and Rojo\nsyncs it live into a running Studio instance. This makes Roblox code versionable,\ndiffable and editable with real tools — instead of living in the built-in Studio script editor.\n\nUse this skill for everything around Rojo setup, the `default.project.json` mapping, the\ntoolchain (rokit/Wally/Lune) and typical sync problems.\n\n## Mental Model\n\n```\nVS Code / Claude Code          rojo serve            Roblox Studio\n   src/server/*.luau   ──────►  (localhost:34872) ──►  ServerScriptService.*\n   src/client/*.luau            Live-Sync               StarterPlayerScripts.*\n   src/shared/*.luau                                    ReplicatedStorage.*\n   src/gui/*.luau                                       StarterGui.*\n```\n\n**Core rule:** The filesystem is the source of truth. On every connect, Rojo overwrites\nthe mapped Studio areas with the filesystem content. Therefore, **never** edit code\nin Studio (it is lost on the next sync), only in the editor. The `Workspace`\n(3D scene, terrain) is **not** mapped by Rojo and is preserved — see skill\n`/rbx-studio` for the scene-vs-code workflow.\n\n## File Extensions → Roblox Type (Rojo Convention)\n\nRojo derives the instance type from the extension. This is the most common source of errors:\n\n| File               | Roblox Type   | `require()`-able | Role                      |\n| ------------------ | ------------- | --------------- | ------------------------- |\n| `Foo.luau`         | ModuleScript  | **yes**         | Logic module, definitions |\n| `Foo.server.luau`  | Script        | no              | Server entry point        |\n| `Foo.client.luau`  | LocalScript   | no              | Client entry point        |\n| `init.luau`        | becomes the folder node itself | yes | makes the folder a ModuleScript |\n\n> Rule of thumb: **Only entry points** are `.server.luau`/`.client.luau`. Everything loaded via\n> `require()` **must** be a `.luau` ModuleScript. Calling `require()` on a\n> Script/LocalScript throws \"Attempted to call require with invalid argument(s)\".\n\n## CLI Commands\n\n```bash\nrojo serve default.project.json     # Live-Sync-Server starten (Standard-Port 34872)\nrojo serve                          # nutzt default.project.json automatisch\nrojo build default.project.json -o game.rbxlx   # einmaliger Build → Place-Datei (XML)\nrojo build default.project.json -o game.rbxl    # Build → Place-Datei (binär)\nrojo plugin install                 # Rojo-Studio-Plugin installieren (einmalig)\nrojo --version                      # installierte Version prüfen\n```\n\nAfter `rojo serve`: in Studio, open the Rojo plugin → **Connect** (localhost:34872).\n`rojo build` does not need a running Studio — ideal for CI, smoke tests and releases.\n\n## `default.project.json` — the Mapping\n\nThis file maps filesystem paths onto the Roblox data model hierarchy. Keys:\n\n- `name` — project name (display)\n- `$className` — Roblox class of the node (`DataModel`, `ServerScriptService`, `Folder`, …)\n- `$path` — filesystem path that is synced under this node (relative to the project root)\n\nA ready-to-use standard template is located at [`assets/default.project.json`](assets/default.project.json).\n\n### Flat vs. Nested — the most important decision\n\nYour code must match the mapping. Two variants:\n\n**Flat** — the content of `src/server` ends up directly in `ServerScriptService`:\n```json\n\"ServerScriptService\": { \"$className\": \"ServerScriptService\", \"$path\": \"src/server\" }\n```\n→ Code references e.g. `ReplicatedStorage.Config`, `ReplicatedStorage.GameEnums`.\n\n**Nested** — the content ends up in `ServerScriptService.ProjectName`:\n```json\n\"ServerScriptService\": {\n  \"$className\": \"ServerScriptService\",\n  \"ProjektName\": { \"$path\": \"src/server\" }\n}\n```\n→ Code references `ReplicatedStorage.ProjectName.shared.Config` etc.\n\nBoth are valid. Decide project-wide on **one** variant and keep every\n`require`/`WaitForChild` path consistent with it. Symptom on mismatch: `WaitForChild(...)`\nhangs indefinitely (infinite yield), because the expected node is located elsewhere.\n\n## Toolchain via rokit\n\n[rokit](https://github.com/rojo-rbx/rokit) is the toolchain manager. A `rokit.toml` in the\nproject (or parent folder) pins exact tool versions → reproducible builds on all\nmachines. If it is missing, you get `Failed to find tool 'rojo' in any project manifest file`.\n\nStandard `rokit.toml` (see [`assets/rokit.toml`](assets/rokit.toml)):\n```toml\n[tools]\nrojo = \"rojo-rbx/rojo@7.4.4\"\nlune = \"lune-org/lune@0.10.4\"\nwally = \"UpliftGames/wally@0.3.2\"\n```\n\n> Version note: 7.4.4 is the version pinned consistently throughout the reference pipeline.\n> Newer projects can go to 7.6.x — but check first with `rojo build` against the project,\n> since the project format can change between major versions.\n\nAfter cloning/setup: `rokit install` pulls all pinned tools.\n\n- **Lune** — Luau runner outside Studio (unit tests, build scripts, asset processing).\n- **Wally** — package manager: `wally install` → `Packages/` → in Studio under\n  `ReplicatedStorage.Packages`. Dependencies are listed in `wally.toml` (see\n  [`assets/wally.toml`](assets/wally.toml)), e.g. the framework `sleitnick/knit@1.7.0`.\n\n## Creating a New Project\n\nThe script [`scripts/scaffold_roblox_project.sh`](scripts/scaffold_roblox_project.sh) creates a\ncomplete Rojo skeleton (project.json, rokit.toml, wally.toml, `src/{shared,server,client,gui}/`\nwith starter files, KONZEPT stub):\n\n```bash\nbash scripts/scaffold_roblox_project.sh MeinSpiel        # flaches Mapping (Default)\nbash scripts/scaffold_roblox_project.sh MeinSpiel --nested   # verschachteltes Mapping\n```\n\nAfter that: `cd MeinSpiel && rokit install && rojo serve`.\n\n## Troubleshooting\n\n| Symptom | Cause | Solution |\n| --- | --- | --- |\n| `Failed to find tool 'rojo'` | no `rokit.toml` | create `rokit.toml` with a Rojo pin in the project/parent folder, `rokit install` |\n| `require` throws \"invalid argument(s)\" | `require()` on a Script/LocalScript | only `.luau` ModuleScripts are require-able; check the extension |\n| Port 34872 in use (`os error 10048`) | old Rojo process is running | `tasklist \\| grep -i rojo` → `taskkill //PID <PID> //F`, then `rojo serve` again |\n| Scripts end up in the wrong place in Studio | flat instead of nested mapping (or vice versa) | adjust `default.project.json` to the code paths (see above) |\n| `WaitForChild` hangs indefinitely | expected node does not exist / server error before creation | **check the server console for errors first**; check mapping + creation order |\n| Sync stops after file rename | Rojo does not detect the rename immediately | stop the server (Ctrl+C) + restart it, in Studio Disconnect→Reconnect |\n| Change in Studio gone after reconnect | Studio edit instead of filesystem edit | change code **only** in the editor; Rojo overwrites mapped areas |\n\n### Known Rojo Limitations\n\n1. **No terrain/Workspace sync** — build the 3D scene & terrain in Studio or generate it via code.\n2. **No `.rbxl` merge** — place files are binary, not git-mergeable. Never use as the primary source.\n3. **No live sync in Play mode** — changes during Play are discarded on Stop.\n4. **Git Bash path translation** — `/c/...` can be translated to `C:/...` and break Rojo paths; when in doubt, use relative paths or native Windows paths.\n\n## Linting (Selene)\n\nRoblox Luau projects are usually linted with **Selene** (`selene.toml` in the root,\n`std = \"roblox\"`). Allow globals like `_G` via `global_usage = \"allow\"` if the project\nuses them for shared client state. Run Selene from the directory containing the Roblox API definition\n(`roblox.yml`).\n\n## Further Reading\n\n- Sister skills: `/rbx-studio` (Studio operation, MCP, assets), `/game-design`\n  (roles, workflows, GDD), meta-skill `/rbx-dev` (combines all three + architecture patterns).\n- Current engine/Rojo docs: Context7 MCP (`resolve-library-id` →\n  `/websites/create_roblox_reference_engine`, `/roblox/creator-docs`) or\n  <https://rojo.space/docs/>.\n- If present on this system, a project-rich reference pipeline is located at\n  `<your Roblox project pipeline>` (incl. `ROJO_FAQ.md`, `SKILL.md`).\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-06-17)\n- Initial version. Distilled from the `.ROBLOX` pipeline (ROJO_FAQ, ROJO_START, _template),\n  written in a user-neutral way."}, {"id": "skill:game-dev:using-blender", "name": "using-blender", "cat": "game-dev", "ver": "1.0.0", "status": "active", "desc": "General Blender workflow skill for AI agents working with .blend, .fbx, .obj, .glb, glTF, materials, scene inspection, bpy automation, headless Blender batch runs, export/reimport validation, previews, and optional Blender MCP control. Use when a task asks to open, inspect, create, automate, convert, optimize, render, or verify Blender or 3D asset files in a user-agnostic way.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: using-blender\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger + Codex\ncreated: 2026-06-20\nupdated: 2026-06-20\ndescription: General Blender workflow skill for AI agents working with .blend, .fbx, .obj, .glb, glTF, materials, scene inspection, bpy automation, headless Blender batch runs, export/reimport validation, previews, and optional Blender MCP control. Use when a task asks to open, inspect, create, automate, convert, optimize, render, or verify Blender or 3D asset files in a user-agnostic way.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ndependencies: {'tools': ['blender'], 'services': [], 'protocols': [], 'python': []}\ncategory: game-dev\ntags: [blender, bpy, 3d, assets, fbx, glb, gltf, mcp]\nlanguage: de\nstatus: active\nprovenance: {'origin': 'custom', 'origin_path': 'skills/game-dev/using-blender', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/skills', 'last_sync_from_origin': 'None', 'last_sync_to_origin': 'None', 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"using-blender banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n> **English Translation** — Official English version of `using-blender`.\n\n\n# Using Blender (Deutsch)\n\n## Kernregel\n\nArbeite mit Blender in drei Modi, passend zur Aufgabe:\n\n1. **GUI-Modus:** Blender sichtbar öffnen, wenn der Nutzer ein Asset anschauen, beurteilen oder manuell weiterbearbeiten will.\n2. **Headless-Modus:** `blender --background --python <script.py>` nutzen, wenn Export, Reimport, Batch-Verarbeitung oder deterministische Prüfung gefragt ist.\n3. **MCP-Modus:** Nur verwenden, wenn ein laufendes Blender-Addon bewusst verbunden ist und Live-Szenensteuerung nötig ist. Vorher Sicherheits- und Lizenzlage prüfen.\n\n## Standardablauf\n\n1. Ziel klären: ansehen, erzeugen, konvertieren, optimieren, rendern oder verifizieren.\n2. Bestehende Dateien lesen: Manifest, README, Exportformate und vorhandene Prüfergebnisse zuerst.\n3. Blender-Pfad ermitteln: `blender` auf PATH, projektspezifische Konfiguration oder Nutzerpfad. Keine lokalen Privatpfade in publizierbare Doku schreiben.\n4. Für Automatisierung ein kleines `bpy`-Script verwenden, das Eingaben, Ausgaben und Fehler explizit macht.\n5. Nach jedem Export mindestens einen Reimport- oder Ladecheck ausführen, bevor das Ergebnis als nutzbar gilt.\n6. Artefakte knapp dokumentieren: Quelle, Exportformate, Toolversion, Prüfstatus und bekannte Grenzen.\n\n## Export- und Prüfregeln\n\n- Für allgemeine Web-/Preview-Nutzung bevorzugt `.glb`.\n- Für Game-Engines und DCC-Austausch zusätzlich `.fbx` oder `.obj/.mtl` anbieten, wenn der Zielworkflow das braucht.\n- Für Roundtrips immer prüfen: Datei existiert, nicht leer, kann reimportiert werden, erwartete Objekt-/Materialnamen sind vorhanden.\n- Für große Assets Metriken erfassen: Mesh-Anzahl, Materialien, Bounding Box, Dateigröße und optional Triangle Count.\n- Für Renderprüfungen kleine Preview-Auflösung verwenden, bevor teure Cycles- oder Full-HD-Renders gestartet werden.\n\n## Sicherheitsregeln\n\n- `bpy`-Code ist lokaler Python-Code mit Dateisystemzugriff. Nur selbst geschriebene oder auditierte Scripts ausführen.\n- Keine fremden Blender-Addons, Asset-Downloader oder Telemetrie-Server aktivieren, ohne Lizenz- und Datenschutzcheck.\n- Bei MCP-Servern mit beliebigem `execute_python`-Tool vorher Scope, Netzwerk, Arbeitsverzeichnis und Timeout begrenzen.\n- Bei Marketplace- oder externen Assets die Lizenz separat prüfen. Die technische Ladefähigkeit ersetzt keine Nutzungsrechte.\n\n## MCP-Optionen\n\nFür Live-Steuerung lies [references/blender-mcp-review.md](references/blender-mcp-review.md), wenn ein Blender-MCP-Server ausgewählt, installiert oder bewertet werden soll.\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-06-20)\n- Initialer nutzeragnostischer Blender-Skill mit GUI-, Headless- und MCP-Routing."}, {"id": "protocol:infrastructure:agent-config-sync", "name": "agent-config-sync", "cat": "infrastructure", "ver": "0.3.0", "status": "active", "desc": "Provider-neutral planner for synchronizing MCP configuration, skills and rule files across agent providers and app classes. It discovers evidenced local options and lets the user choose truth, targets, direction and conflicts.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: agent-config-sync\nversion: 0.3.0\ntype: protocol\nauthor: Lukas Geiger + Claude + Codex\ncreated: 2026-06-20\nupdated: 2026-07-27\ndescription: Provider-neutral planner for synchronizing MCP configuration, skills and rule files across agent providers and app classes. It discovers evidenced local options and lets the user choose truth, targets, direction and conflicts.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: false\ncategory: infrastructure\ntags: [mcp, skills, rules, sync, provider-neutral, discovery, multi-agent]\nlanguage: de\nstatus: active\naliases: [mcp-skill-sync, multi-agent-sync, tool-config-sync, agent-sync]\ndependencies: {'tools': ['python'], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'custom', 'origin_path': 'skills/infrastructure/agent-config-sync/', 'origin_version': '0.3.0', 'last_sync_from_origin': None, 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"agent-config-sync banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Agent Config Sync (Deutsch)\n\nThe skill separates endpoint selection, resources and truth. Run:\n\n```bash\npython scripts/sync.py --discover\npython scripts/sync.py --offer\n```\n\nThe user can select an explicit endpoint list, one provider across app classes,\none app class across providers, or all detected endpoints. Detection is\nevidence, not authorization.\n\nTruth can be one endpoint, one file, an ordered set of files such as multiple\n`AGENTS.md` layers, or a skills directory. No filename or provider is the\nimplicit hub. Without a selected truth source, plans stay blocked.\n\nReview `--status` and `--plan`; only use `--apply --yes` after approval.\nMCP blocks and skill directories are implemented. Rule-file topologies remain\nfail-closed until the user selects a merge/redirect adapter."}, {"id": "skill:infrastructure:agents-bridge", "name": "agents-bridge", "cat": "infrastructure", "ver": "2.0.0", "status": "active", "desc": "Provider- and user-neutral bridge for agent, CLI, and IDE boot rules. It discovers known bootstrap surfaces, requires the user to select one or more ordered truth sources, and renders small loaders without duplicating rules.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: agents-bridge\nversion: 2.0.0\ntype: skill\ndescription: Provider- and user-neutral bridge for agent, CLI, and IDE boot rules. It discovers known bootstrap surfaces, requires the user to select one or more ordered truth sources, and renders small loaders without duplicating rules.\n\ncategory: infrastructure\ntags: [multi-agent, bootstrap, rules, agents-md, provider-neutral]\nlanguage: de\nstatus: active\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"agents-bridge banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# AGENTS-BRIDGE (Deutsch)\n\nUse this skill to connect an agent or IDE to explicitly selected rule files.\nNo provider, filename, host, or cloud directory is implicitly canonical.\n\n## Workflow & Vorgehen\n\n1. Read all local instructions that govern the source and target paths.\n2. Run `python scripts/bridge.py discover` and optionally pass `--project`.\n3. Ask the user to select the ordered truth sources and the target. An empty\n   selection authorizes no write.\n4. Prefer a redirect or ordered loader. Use a generated copy only when the\n   target cannot load references, and record provenance plus drift checks.\n5. Preview with:\n\n   ```text\n   python scripts/bridge.py render --truth <path> --target-kind generic\n   ```\n\n6. Create or change the target only after reviewing the preview.\n7. Prove that the target agent actually read every selected source.\n\nSee `references/agent-conventions.md`,\n`references/truth-topologies.md`, and\n`references/inventory-contract.md`.\n\n`agent-config-sync` manages broader configuration topologies.\n`agents-bridge` is limited to boot and rule access. Runtime partner bridges and\nschedulers are separate components."}, {"id": "tool:infrastructure:ai-portable-setup", "name": "ai-portable-setup", "cat": "infrastructure", "ver": "1.0.0", "status": "active", "desc": "Creates a portable AI workspace on a USB drive or any drive. RAG pipeline with local LLM models (Ollama), vector database (ChromaDB), and preconfigured prompts.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: ai-portable-setup\nversion: 1.0.0\ntype: tool\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Creates a portable AI workspace on a USB drive or any drive. RAG pipeline with local LLM models (Ollama), vector database (ChromaDB), and preconfigured prompts.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: infrastructure\ntags: [portable, rag, ollama, usb-drive, offline, local-llm]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': ['ollama'], 'protocols': [], 'python': ['chromadb', 'ollama']}\nprovenance: {'origin': 'bach', 'origin_path': 'MODULAR_AGENTS/AI-Portable', 'origin_version': '0.1.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"ai-portable-setup banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# AI Portable Setup (Deutsch)\n\nCreates a portable AI workspace with a local RAG pipeline.\nDesigned for USB drives or external drives — works offline\nwith Ollama and local embedding models.\n\n## Quick Start\n\n```bash\n# Create structure on USB drive (Deutsch)\npython setup_portable.py E:\\AI-Portable\n\n# Then on the target system: (Deutsch)\ncd E:\\AI-Portable\npython -m venv venv\nvenv\\Scripts\\activate          # Windows\npip install chromadb ollama\n\n# Index documents (Deutsch)\npython rag/ingest.py\n\n# Query (Deutsch)\npython rag/query.py \"My question...\"\npython rag/query.py --mode icf \"Observations about the client\"\n```\n\n## Generated Directory Structure\n\n```\nAI-Portable/\n  models/\n    llm/                  Local LLM models (Mistral, Llama, etc.)\n    embeddings/           Embedding models (nomic-embed-text, bge-small)\n    tts/                  Optional: Text-to-Speech (Piper, Coqui)\n  db/\n    chroma/               ChromaDB vector database\n    sqlite/               Metadata DB\n  documents/\n    code/                 Code snippets, projects\n    general/              General documents\n  rag/\n    ingest.py             Ingest and index files\n    query.py              RAG queries with mode selection\n    pipeline.py           Main RAG pipeline (embed + query + LLM)\n  prompts/\n    coding.txt            Coding assistant prompt\n    icf.txt               ICF structuring prompt\n    rpg.txt               Pen-and-paper game master prompt\n  templates/              Word/PDF templates\n  venv/                   Portable Python environment\n```\n\n## RAG Pipeline\n\n```\nDocuments -> Chunking -> Embedding (nomic-embed-text)\n                              |\n                              v\n                         ChromaDB (local)\n                              |\nQuery -> Embedding -> Similarity Search -> Top-K Chunks\n                                              |\n                                              v\n                                    Context + Prompt -> Ollama (Mistral)\n                                              |\n                                              v\n                                          Response\n```\n\n## Query Modes\n\n| Mode | Prompt | Usage |\n|------|--------|-------|\n| `default` | General assistant | Standard queries |\n| `icf` | ICF structuring | Classify observations according to ICF |\n| `coding` | Coding assistant | Write and explain code |\n| `rpg` | Game master | Pen-and-paper role-playing |\n\n## Requirements on Target System\n\n- Python 3.10+\n- Ollama (with `mistral:instruct` and `nomic-embed-text`)\n- ~8 GB RAM for Mistral\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-03-12)\n- Consolidation from MODULAR_AGENTS/AI-Portable\n- Setup script as single-file skill\n- 4 preconfigured prompts (coding, icf, rpg, default)\n- RAG pipeline (ingest, query, pipeline)"}, {"id": "skill:infrastructure:automation-self-care", "name": "automation-self-care", "cat": "infrastructure", "ver": "1.0.1", "status": "active", "desc": "Builds and operates a provider-neutral self-care core set for scheduled LLM tasks and desktop-app automations. Use when an agent should discover its native scheduler, install recurring hygiene, prompt-quality, frequency, load, resource, cross-system, permission and runtime checks, or continuously improve an existing automation fleet with rollback, readback and deletion protection. Triggers on automation self-care, scheduler task care, desktop app automation maintenance, automation fleet audit, self-healing schedules, requests to recreate the ANTIGRAVITY-style maintenance task family, core-set-textautomations, basic-text-automations, textbased-automation-core, textbased-automation-drivers, or textbased-desktopapp-automations.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: automation-self-care\nversion: 1.0.1\ntype: skill\nauthor: Lukas Geiger + OpenAI\ncreated: 2026-07-28\nupdated: 2026-07-30\ndescription: >\n  Builds and operates a provider-neutral self-care core set for scheduled LLM\n  tasks and desktop-app automations. Use when an agent should discover its\n  native scheduler, install recurring hygiene, prompt-quality, frequency,\n  load, resource, cross-system, permission and runtime checks, or continuously\n  improve an existing automation fleet with rollback, readback and deletion\n  protection. Triggers on automation self-care, scheduler task care, desktop\n  app automation maintenance, automation fleet audit, self-healing schedules,\n  requests to recreate the ANTIGRAVITY-style maintenance task family,\n  core-set-textautomations, basic-text-automations, textbased-automation-core,\n  textbased-automation-drivers, or textbased-desktopapp-automations.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: false\ncategory: infrastructure\ntags: [automation, scheduler, desktop-apps, self-care, maintenance, rollback, cross-system]\nlanguage: en\nstatus: active\naliases: [core-set-textautomations, basic-text-automations, textbased-automation-core, textbased-automation-drivers, textbased-desktopapp-automations]\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\nprovenance:\n  origin: \"custom\"\n  origin_path: null\n  origin_version: null\n  origin_repo: \"github.com/ellmos-ai/skills\"\n  last_sync_from_origin: null\n  last_sync_to_origin: null\n  local_changes_since_sync: false\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"automation-self-care banner\">\n\n# Automation Self-Care\n\nCreate a native, provider-specific maintenance fleet from one provider-neutral\ncontrol loop. Preserve the original intent of the ANTIGRAVITY task family while\nrequiring evidence, reversible changes and native readback.\n\n## Non-negotiable boundaries\n\n- Treat discovery, planning, approval, mutation and readback as separate phases.\n- Use the target app's supported automation API, command or UI. Never assume that\n  editing a storage file changes live app state.\n- Read local rules, locks, deletion/suppression logs and existing schedules before\n  proposing a task.\n- Do not invent scheduler support. If create/update/readback cannot be proven,\n  produce a manual installation plan and stop before mutation.\n- Make at most one independently testable tuning change per care run.\n- Protect the care tasks from disabling themselves or reducing their own cadence\n  below the configured recovery floor.\n- Preserve the previous prompt, schedule, model, permissions and enabled state so\n  every mutation can be rolled back.\n- Count success only after outcome evidence, not merely scheduler start or exit 0.\n- Never copy secrets, private prompts or personal data into a shared registry.\n\n## Workflow\n\n### 1. Discover the native automation surface\n\nInventory the current actor, provider, app class, scheduler surface, supported\noperations, state files, run history, usage telemetry and readback method. Record\ncapabilities using the profile contract in\n[provider-adapter-contract.md](references/provider-adapter-contract.md).\n\nDistinguish native desktop-app schedules, CLI/headless execution, OS scheduler or\nservice starter, general scheduler service, workflow engine, and unsupported or\nUI-only automation. Do not equate the existence of a config file with a supported\nmutation path.\n\n### 2. Inventory the fleet\n\nFor each task capture a stable local identifier, purpose, prompt fingerprint,\nschedule, enabled state, model, permissions, target paths, last scheduler event,\nlast successful outcome and current owner. Keep prompt content local.\n\nCheck the authoritative live surface twice before mutation when the app can rewrite\nstate from memory.\n\n### 3. Design the core set\n\nRead [core-set.md](references/core-set.md). Select either:\n\n- `compact`: five care tasks combining frequency with load distribution; or\n- `full`: nine focused tasks corresponding to the original maintenance family.\n\nGenerate a provider-neutral plan:\n\n```bash\npython scripts/build_core_set.py provider-profile.json \\\n  --topology compact --out automation-care-plan.json\n```\n\nThe generator never installs tasks. Review every `blocked` capability and choose\ncollision-free local times before applying the plan.\n\n### 4. Stage installation\n\nInstall through the native provider adapter:\n\n1. Start with hygiene in read-only mode.\n2. Add resource protection.\n3. Add prompt-quality tuning with rollback.\n4. Add frequency and load tuning only after enough run evidence exists.\n5. Add cross-system coordination last.\n\nCreate new or imported tasks disabled unless the user explicitly approved active\ninstallation. For an unattended pilot, require a deletion log, before-state\nsnapshot, run receipt and rollback path first.\n\n### 5. Run the care loop\n\nEvery care task follows:\n\n```text\nfollow-up previous change\n  -> collect current evidence\n  -> classify one cause\n  -> choose zero or one change\n  -> mutate through native surface\n  -> read back\n  -> write receipt and next-check condition\n```\n\nUse the hypothesis catalogue and evidence rules in\n[core-set.md](references/core-set.md). Unknown cause means observe, narrow\npermissions or pause safely; never guess a repair.\n\n### 6. Coordinate across actors\n\nKeep local app state authoritative. Share only task contracts, coverage, status,\nreceipts and sanitized fingerprints. Redundant read-only reviews are allowed;\nsingle-writer mutations require a claim or an equivalent native lock.\n\n### 7. Systems Without Native Event Hooks (Letter-Hooker Extension)\n\n\nTreat token or subscription limitation as capacity state, not a broken actor.\nReturn delegated coverage after the original actor produces a successful receipt.\n\n## Required outputs\n\nFor each setup or care run report:\n\n- discovered native surface and unsupported capabilities;\n- selected topology and tasks created, proposed or skipped;\n- exact mutation and before/after readback;\n- evidence of outcome or open observation window;\n- rollback location and return condition;\n- shared coverage update, if a coordination registry exists.\n\n## Example\n\nUser: \"Set up self-maintaining schedules in this desktop app.\"\n\nDiscover whether the app can list, create, update and verify scheduled tasks.\nGenerate the compact plan, present unsupported capabilities, then install only the\napproved tasks through the native surface. A folder containing a task prompt\nwithout a live scheduler registration is not a completed setup.\n\n## Changelog\n\n### 1.0.1 (2026-07-30)\n\n- Added provider-neutral text-automation and desktop-app automation aliases.\n\n### 1.0.0 (2026-07-28)\n\n- Consolidated the original ANTIGRAVITY maintenance family, the F1-F6 control\n  loop and later provider-specific adaptations into a neutral core-set skill.\n"}, {"id": "skill:infrastructure:cloud-communication-protocols", "name": "cloud-communication-protocols", "cat": "infrastructure", "ver": "0.0.0", "status": "active", "desc": "Umbrella skill for cloud-bridged communication protocols between agents on different machines (Ping-Pong, agent-beam, listeners and future protocols). Use when coordinating work across machines via a shared sync folder or message yard.", "langs": [], "text": "---\nname: cloud-communication-protocols\ndescription: Umbrella skill for cloud-bridged communication protocols between agents on different machines (Ping-Pong, agent-beam, listeners and future protocols). Use when coordinating work across machines via a shared sync folder or message yard.\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"cloud-communication-protocols banner\">\n\n# cloud-communication-protocols\n\nFamily of protocols that let two or more agents on different machines\ncoordinate through a shared, cloud-synchronized folder (the \"yard\") instead of\na direct channel. This skill is the **umbrella**: it collects the protocols,\nnames which one is proven, and gates the ones still in concept.\n\n## When to use\n\n- Work spans two or more machines (verification, mirrored setups, pilots)\n  and there is no direct agent-to-agent channel.\n- You need a common vocabulary for assignments, answers, cadence and\n  escalation across those machines.\n\n## Protocols in this family\n\n### 1. Ping-Pong (proven, base protocol)\n\nTwo or more workers with offset scheduled scans bridge the cloud-sync\nlatency: each side scans the yard for assignments addressed to itself,\nexecutes, leaves the answer, and may issue follow-ups for the other side.\n\nCore rules: write only in your own slot, receipts for every action,\nidempotency, no secrets in the yard (public keys/fingerprints/paths only),\ncooperative error deltas, readback-over-log verification.\n\nCadence control is **not** part of the base protocol; it is provided by the\ncompanion skill **`cron-tuner`** (self-tuning loop) and by peer-instructed\ncadence signals (`CADENCE: match 15m` / `CADENCE: pause …`). A mutual `WAKE:`\nchannel allows out-of-cycle scans as a hint, never as authority.\n\nFull specification and reference evidence:\n`dev-bricks/system-gap-master` → `docs/communications-protocols-skill.md`.\n\n### 2. agent-beam (concept, gated)\n\nFor urgent work: a package of prompt + starter script is placed in the\ntarget slot, and a watcher on the target machine starts a local agent run\non it — the agent \"lands\" with assignment and starter and begins immediately.\n\nGated: requires a signed-starter trust contract, quarantine/review step and\nexplicit operator approval before any activation.\n\n### 3. listeners / ear-to-ear-listening (concept, gated)\n\nWatchers observe triggers in the yard (file arrivals, flag files, registry\nchanges) and start agents on the other machine. \"Ear-to-ear\": one host's\nlistener watches the other host's inbox.\n\nGated: debouncing rules, trigger whitelists per slot and a security contract\nare required first.\n\n## Shared invariants (all protocols)\n\n- The yard is transport, never a workspace and never a secret store.\n- Every action leaves a verifiable receipt; \"done\" without an artifact is\n  not done.\n- Failure handling is cooperative: error deltas with hypothesis and\n  counter-test, second opinions welcome.\n- Absence of a partner is handled by the platform's vacancy rule\n  (e.g. 48 h), not by escalation.\n\n## Adding new protocols\n\nNew protocols join this family as a subchapter in\n`communications-protocols-skill.md` (concept first, with its own security\ncontract and evidence before \"proven\"). List them here with one line each:\nname, state (concept/pilot/proven), purpose.\n"}, {"id": "skill:infrastructure:cron-tuner", "name": "cron-tuner", "cat": "infrastructure", "ver": "0.0.0", "status": "active", "desc": "Self-tuning cadence control loop for recurring agent scans. Use when a scheduled scan should sharpen its interval on activity and cool down on silence, without operator intervention.", "langs": [], "text": "---\nname: cron-tuner\ndescription: Self-tuning cadence control loop for recurring agent scans. Use when a scheduled scan should sharpen its interval on activity and cool down on silence, without operator intervention.\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"cron-tuner banner\">\n\n# cron-tuner — self-tuning cadence control loop\n\nA **self-tuning** control loop for recurring, schedule-driven work (cron jobs,\nscheduled tasks, timers). Instead of a fixed interval, the job adapts its own\ncadence: it sharpens when there is work and cools down when there is none.\nHost- and platform-neutral; the pattern works with any scheduler.\n\n## When to use\n\n- A recurring scan (mailbox watch, sync-yard scan, queue poll) should react\n  quickly during an active \"match\" and stay cheap during idle phases.\n- You want the adaptation to be **auditable** (a state file) instead of\n  implicit in a conversation or a person's head.\n\n## Concepts\n\n- **Control loop**: measure → decide → act → persist. Every run ends by\n  writing its state; every run starts by reading it.\n- **Activation**: new work found → jump straight to the fastest interval.\n- **Cooldown ladder**: empty runs advance down a ladder; each step only\n  applies when the interval actually changes.\n- **Cap**: never relax beyond a defined maximum interval.\n\n## Reference scheme\n\n| Condition | New interval |\n|---|---|\n| new work found | fastest (e.g. 15 min) |\n| 4 consecutive empty runs | 30 min |\n| 6 consecutive empty runs | 1 h |\n| each further empty run | double (2 h, 4 h, 8 h) |\n| cap | 24 h (never higher) |\n\nTune the thresholds to the workload; keep the doubling simple and the cap explicit.\n\n## State file (required)\n\nOne small JSON file per worker, e.g. `cron-tuner-state.json`:\n\n```json\n{\n  \"empty_runs\": 0,\n  \"interval_minutes\": 15,\n  \"note\": \"cron-tuner state\"\n}\n```\n\nRules:\n\n1. **File, not memory.** The counter must survive context compaction,\n   session restarts and operator changes, and must be inspectable by humans\n   and other agents. Do not track cadence in conversation history.\n2. **Rewrite only on change.** Persist the state every run, but only\n   replace the scheduled job when the interval actually changes.\n3. **New job = new schedule, same state.** Changing cadence means deleting\n   the old job and creating a new one with the new interval; the counter\n   continues.\n\n## Operating rules\n\n- **Work decides, not mood.** Only observed arrivals change the cadence —\n  never expectations or approximations.\n- **Anti-herd offsets.** Avoid full-hour and half-hour marks for the fastest\n  interval (e.g. minutes 7/22/37/52) so fleets do not fire in lockstep.\n- **Fail-safe:** if a peer system goes silent, the normal vacancy/absence\n  policy applies — the tuner never escalates into polling floods.\n- **Receipts:** every cadence change is logged with reason, old interval and\n  new interval.\n\n## Extensibility (registry of loop types)\n\nThe skill is the home for additional self-tuning loop types over time:\n\n- **cooldown** (this scheme: silence → slower)\n- **backoff** (failures → slower, success → faster)\n- **burst** (spike of arrivals → temporary fast mode with an explicit end)\n- **wake-assist** (external wake message → immediate out-of-cycle run)\n\nNew loop types get a subchapter here plus their own state-file schema.\n"}, {"id": "protocol:infrastructure:full-after-care", "name": "full-after-care", "cat": "infrastructure", "ver": "1.0.0", "status": "active", "desc": "Tiefe Pflegerunde für ein veröffentlichtes GitHub-Repository (Stufe 2): enthält den vollständigen surface-after-care-Durchlauf und ergänzt ihn um drei teure Schritte — rechtliche Ersteinschätzung über die Law-Checker mit Wiedervorlage nach einem Jahr (Gutachten bleibt gitignored im Repo), Querverweise zu verwandten Repos über ALLE Organisationen hinweg sowie das Nachziehen aller Sprachen auf App-Ebene, nicht nur in der Doku. Nutze diesen Skill bei \"full after care\", \"deep after care\", \"tiefe Repo-Pflege\", \"große Runde\", \"Repo grundlegend durchgehen\", wenn ein Repo länger nicht geprüft wurde, vor größeren Releases oder wenn rechtliche Relevanz, Querverweise oder Mehrsprachigkeit ausdrücklich Thema sind. Für die günstige, oft wiederholte Runde stattdessen surface-after-care; für die Erstveröffentlichung github-repo-care.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: full-after-care\nversion: 1.0.0\ntype: protocol\nauthor: Lukas Geiger + Claude\ncreated: 2026-07-24\nupdated: 2026-07-24\naliases: [deep-after-care, repo-after-care-full, tiefe-repo-pflege, repo-tiefenpflege]\ndescription: >\n  Tiefe Pflegerunde für ein veröffentlichtes GitHub-Repository (Stufe 2): enthält den\n  vollständigen surface-after-care-Durchlauf und ergänzt ihn um drei teure Schritte —\n  rechtliche Ersteinschätzung über die Law-Checker mit Wiedervorlage nach einem Jahr\n  (Gutachten bleibt gitignored im Repo), Querverweise zu verwandten Repos über ALLE\n  Organisationen hinweg sowie das Nachziehen aller Sprachen auf App-Ebene, nicht nur in der\n  Doku. Nutze diesen Skill bei \"full after care\", \"deep after care\", \"tiefe Repo-Pflege\",\n  \"große Runde\", \"Repo grundlegend durchgehen\", wenn ein Repo länger nicht geprüft wurde,\n  vor größeren Releases oder wenn rechtliche Relevanz, Querverweise oder Mehrsprachigkeit\n  ausdrücklich Thema sind. Für die günstige, oft wiederholte Runde stattdessen\n  surface-after-care; für die Erstveröffentlichung github-repo-care.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: false\n\ncategory: dev\ntags: [github, repo, maintenance, legal, i18n, cross-linking, organization, documentation]\nlanguage: de\nstatus: active\n\ndependencies:\n  tools: [git, gh, rg]\n  services: [GitHub]\n  protocols: [surface-after-care]\n  python: []\n\nprovenance:\n  origin: \"custom\"\n  origin_path: null\n  origin_version: null\n  origin_repo: null\n  last_sync_from_origin: null\n  last_sync_to_origin: null\n  local_changes_since_sync: false\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"full-after-care banner\">\n# Full After Care — die tiefe Runde (Synonym: Deep After Care)\n\n## Wann dieser Skill greift\n\nNutze ihn, wenn ein veröffentlichtes Repo **grundlegend** durchgegangen werden soll: länger nicht geprüft, vor einem größeren Release, bei rechtlich relevanten Gegenständen, oder wenn die Verzahnung mit den übrigen eigenen Projekten Thema ist.\n\nDer Unterschied zur günstigen Runde ist der Aufwand, nicht die Sorgfalt: Stufe 2 verlässt die Grenzen des einzelnen Repos. Sie fragt Fremdquellen an (Rechtslage), inventarisiert **alle** Organisationen und greift in die Anwendung selbst ein (Sprachen). Deshalb läuft sie seltener — typischerweise einmal pro Repo und Jahr oder anlassbezogen.\n\n## Ablauf\n\n### Stufe 1 zuerst vollständig\n\nFühre **`surface-after-care` komplett aus** — inklusive Schritt 0 (Distributionsflächen), Privacy-Gate, Veröffentlichungsabsicht, Banner, Ist-Soll-Abgleich, README-Sprachen, Sichtbarkeit, Organisationseintrag, Issues und PRs sowie Commit, Push und Flächen-Parität. Nichts davon wird hier wiederholt oder abgekürzt.\n\nDie drei folgenden Schritte kommen obendrauf. Sie erzeugen ihrerseits Änderungen an Doku und Code — pushe sie im selben Rhythmus wie in Stufe 1 beschrieben, in thematisch getrennten Commits.\n\n---\n\n### 5. Rechtliche Ersteinschätzung mit Jahres-Wiedervorlage\n\n#### Zuerst: Ist eine Einschätzung überhaupt fällig?\n\nSieh in `_after-care/RECHTSCHECK.md` nach (der Ordner ist gitignored, siehe unten). Steht dort ein Prüfdatum, das **weniger als ein Jahr** zurückliegt, wird dieser Schritt **übersprungen** — auch in der tiefen Runde. Eine frische Einschätzung noch einmal einzuholen kostet Zeit und Geld und bringt nichts Neues.\n\nIst das Datum **älter als ein Jahr** oder existiert die Datei nicht, wird geprüft. Der Grund für die Wiedervorlage ist nicht, dass das Gutachten schlechter wird, sondern dass sich die **Rechtslage** ändert: neue Verordnungen, geänderte Schwellenwerte, neue Rechtsprechung, veränderte Plattformregeln. Ein zwei Jahre altes Gutachten kann formal korrekt und praktisch überholt sein.\n\nAußerhalb des Jahresrhythmus ist eine Neubewertung fällig, wenn sich der **Gegenstand** geändert hat: neue Datenkategorien, neuer Vertriebsweg, neues Geschäftsmodell, Lizenzwechsel, neue Abhängigkeit mit Copyleft, Ausweitung auf einen anderen Rechtsraum.\n\n#### Ist das Repo rechtlich relevant?\n\nNicht jedes Projekt braucht das. Auslöser sind unter anderem:\n\n- verarbeitet personenbezogene Daten, auch nur lokal\n- greift auf fremde Dienste, Webseiten oder Schnittstellen zu (Nutzungsbedingungen, Scraping)\n- gibt Auskunft in regulierten Feldern (Recht, Medizin, Steuern, Finanzen)\n- trägt fremde Marken, Namen oder Logos im Namen, in der Doku oder im UI\n- enthält Abhängigkeiten mit Copyleft oder unklarer Lizenz, oder liefert fremde Inhalte mit\n- richtet sich an Minderjährige, verarbeitet Zahlungen, oder fällt unter Ausfuhr-/Kryptoregeln\n- trifft automatisiert Entscheidungen über Menschen oder wird als KI-System eingeordnet\n\nTrifft nichts davon zu, halte im Laufprotokoll **fest, dass geprüft und verneint wurde** — sonst stellt die nächste Runde dieselbe Frage von vorn.\n\n#### Einschätzung einholen\n\nNutze die Law-Checker (Skill `law-checker`, Modul `law-checker`) und lege ihr den konkreten Sachverhalt vor: was die Anwendung tut, welche Daten sie berührt, über welche Kanäle sie vertrieben wird, welche Lizenzen mitlaufen, an wen sie sich richtet. Je konkreter der Sachverhalt, desto brauchbarer die Fundstellen. Ergebnis ist eine Ersteinschätzung mit Paragraphen-Belegen — **keine Rechtsberatung**; bei ernsthaftem Risiko ist das Ergebnis die Empfehlung, anwaltlich prüfen zu lassen, nicht das Urteil selbst.\n\n#### Ablage\n\n```\n_after-care/\n├── LOG.md                    # Laufprotokoll beider Stufen\n└── RECHTSCHECK.md            # Datum, Gegenstand, Ergebnis, Auflagen, Wiedervorlage\n```\n\n`_after-care/` gehört in die `.gitignore`. Das ist kein Versteckspiel, sondern dieselbe Regel wie in Schritt 2b der Stufe 1: interne Arbeitsdokumente sind kein Repo-Inhalt. Bei einem Gutachten kommt hinzu, dass eine öffentlich mitgelieferte Risikoanalyse als Eingeständnis gelesen werden kann und Angreifern eine Landkarte liefert. Alternativ kann die Ablage außerhalb des Repos in einem eigenen Ordner erfolgen — wichtig ist nur, dass sie beim nächsten Lauf **auffindbar** ist, sonst greift die Jahresregel nicht.\n\nKopfzeile der Datei, maschinell lesbar halten:\n\n```markdown\n# Rechtscheck — <Projekt>\ngeprüft: 2026-07-24\ngegenstand: lokale Dateiverwaltung, keine Cloud, keine personenbezogenen Daten Dritter\nergebnis: unbedenklich\nauflagen: Hinweis auf MIT-Lizenz der eingebetteten Bibliothek X im README\nwiedervorlage: 2027-07-24\n```\n\nWas aus der Einschätzung **öffentlich** wird, sind nur die **Konsequenzen**: eine Lizenzangabe, ein Haftungsausschluss, ein Datenschutzhinweis, eine präzisierte Beschreibung dessen, was die App tut. Diese Änderungen gehören ins Repo — die Begründung dahinter nicht.\n\n---\n\n### 9. Querverweise über alle Organisationen\n\nStufe 1 fragt nur, ob das Repo auf den Organisationsseiten steht. Stufe 2 geht eine Ebene tiefer: **Welche einzelnen Repos aus allen eigenen Organisationen hängen mit diesem hier zusammen — und wissen beide Seiten davon?**\n\n```bash\ngh api user/orgs --jq '.[].login'\nfor ORG in $(gh api user/orgs --jq '.[].login'); do\n  gh repo list \"$ORG\" --limit 200 --json name,description,updatedAt,isArchived,primaryLanguage\ndone\n```\n\nDer Ertrag entsteht nicht durch das Auflisten, sondern durch das Erkennen von Beziehungen. Relevante Typen:\n\n- **nutzt / wird genutzt von** — echte technische Abhängigkeit in beide Richtungen\n- **gehört zur selben Familie** — gemeinsame Produktlinie, gemeinsames Präfix, gemeinsame Architektur\n- **löst dasselbe Problem anders** — ein Nutzer, der auf dem einen landet, will oft das andere kennen\n- **Vorgänger / Nachfolger** — abgelöste Projekte brauchen einen Wegweiser, sonst landen Nutzer dauerhaft auf dem toten Stand\n- **Baustein / Komposition** — Bibliothek und die Anwendung, die sie einsetzt\n\nSetze die Verweise **bidirektional**. Eine Einbahnstraße ist der häufigste Fehler dieses Schritts: Man ergänzt im gepflegten Repo eine Liste verwandter Projekte, und in den verwandten Projekten steht nichts. Wer dort landet, findet den Weg nie zurück.\n\nDer Rückverweis wird im Gegen-Repo also tatsächlich gesetzt — nach der **Dirty-Tree-Regel** aus Schritt 11 der Stufe 1, kurz zusammengefasst: sauberer Baum → eigener Commit und Push; dirty in anderen Dateien → pfadgenau committen, nicht pushen; dirty in der Zieldatei oder aktive Sperre → nicht anfassen. Wird der Verweis nicht gesetzt, gehört er in die Aufgabenliste des Ziel-Repos (`AUFGABEN.txt`/`TODO.md`), bei Sperre nur ins eigene Laufprotokoll. So bleibt die Runde in sich abgeschlossen, ohne fremde Arbeitsstände zu gefährden und ohne dass der Verweis verloren geht.\n\nFormuliere Verweise nutzenorientiert, nicht als Namensliste: „**projekt-b** — liest die von diesem Werkzeug erzeugten Exporte und macht daraus Berichte\" ist brauchbar, „siehe auch: projekt-b\" nicht.\n\nArchivierte und offensichtlich tote Repos werden nicht verlinkt — außer als expliziter Nachfolger-Hinweis in die andere Richtung.\n\nDiese Inventur ist der teuerste Teil der Runde. Wenn viele Organisationen und Repos zu prüfen sind, lohnt es sich, das Ergebnis der Repo-Inventur im Laufprotokoll abzulegen, damit die nächste tiefe Runde eines anderen Repos darauf aufsetzen kann.\n\n---\n\n### Alle Sprachen auf App-Ebene nachziehen\n\nStufe 1 sorgt für die README-Sprachfassungen. Hier geht es um das **Produkt selbst**: Oberflächentexte, Meldungen, Hilfen, CLI-Ausgaben, Fehlermeldungen, Store- und Registry-Beschreibungen.\n\nErmittle zuerst, welche Sprachen die Anwendung technisch bereits kennt und wie sie sie verwaltet:\n\n```bash\nrg -l \"gettext|i18n|locale|translations|LC_MESSAGES|\\.po$|messages\\.json\" --hidden\nfd -e po -e pot -e ftl . 2>/dev/null; ls locales/ i18n/ lang/ translations/ 2>/dev/null\n```\n\nDann die Lücken schließen, entlang von drei Fragen:\n\n1. **Fehlen Sprachen**, die das Projekt haben sollte? Standardsprachen sind Deutsch, Englisch, Spanisch, vereinfachtes Chinesisch, Japanisch, Russisch — bei nutzernahen Anwendungen. Bei entwicklernahen Bibliotheken ist Englisch allein oft die richtige Antwort; eine unnötige Sprache ist dauerhafte Pflegelast, kein Gewinn.\n2. **Sind die vorhandenen Sprachen vollständig?** Nach jedem Feature-Zyklus hängen die Nebensprachen hinterher. Neue Schlüssel ohne Übersetzung fallen im Betrieb oft auf die Leitsprache zurück und damit gar nicht auf — deshalb hier gezielt gegen die Leitsprache diffen, statt sich auf den Augenschein zu verlassen.\n3. **Ist die Sprachwahl für Nutzer erreichbar?** Eine vollständige Übersetzung, die niemand einschalten kann, wirkt wie keine. Umschalter vorhanden, Auswahl persistent, Systemsprache als Vorgabe erkannt?\n\nHalte dich an den im Projekt etablierten i18n-Mechanismus und führe keinen zweiten daneben ein. Prüfe die Ergebnisse in der **echten Oberfläche**, nicht nur in der Ressourcendatei: zu lange Zeichenketten brechen Layouts, und fehlende Zeichensatz-Unterstützung zeigt sich erst im Rendering (fehlende CJK-Glyphen erscheinen als leere Kästen).\n\nZum Schluss die Flächen aus Schritt 0 der Stufe 1 mitnehmen: Store- und Registry-Beschreibungen haben eigene Sprachfelder, die von der App-Übersetzung nicht automatisch mitwandern.\n\n## Laufprotokoll\n\nErgänze `_after-care/LOG.md` um einen Eintrag mit der Stufe `full`:\n\n```markdown\n## 2026-07-24 — full\n- Stufe 1 vollständig gelaufen (siehe Eintrag oben)\n- Rechtscheck: fällig (letzter 2025-06-02) -> neu eingeholt, Ergebnis unbedenklich,\n  Auflage Lizenzhinweis Bibliothek X umgesetzt, Wiedervorlage 2027-07-24\n- Querverweise: 4 Orgas / 38 Repos geprüft, 3 Beziehungen gefunden,\n  bidirektional gesetzt; Rückverweis in repo-y offen (dort aktiver Lock)\n- Sprachen App-Ebene: ES ergänzt (312 Schlüssel), JA auf Stand gebracht,\n  Umschalter war vorhanden aber nicht persistent -> gefixt\n```\n\n## Häufige Fehler\n\n| Fehler | Korrektur |\n|---|---|\n| Rechtscheck erneut eingeholt, obwohl der letzte 3 Monate alt war | Datum in `RECHTSCHECK.md` zuerst lesen — unter einem Jahr wird übersprungen |\n| Rechtscheck übersprungen, weil „hat sich nichts geändert\" | Die Rechtslage ändert sich unabhängig vom Projekt; ab einem Jahr wird geprüft |\n| Gutachten ins Repo committet | `_after-care/` gehört in die `.gitignore`; öffentlich werden nur die Konsequenzen |\n| Verneinte Rechtsrelevanz nicht dokumentiert | Auch ein „nicht relevant\" ist ein Befund und gehört ins Protokoll |\n| Querverweise nur im gepflegten Repo gesetzt | Bidirektional setzen, sonst ist es eine Einbahnstraße |\n| Nur die eigene Orga geprüft | Stufe 2 heißt alle Organisationen — genau das unterscheidet sie von Stufe 1 |\n| Verweise als blosse Namensliste | Nutzen in einem Halbsatz erklären, sonst klickt niemand |\n| Neue Sprache angelegt, aber nicht im UI erreichbar | Umschalter, Persistenz und Systemsprachen-Erkennung mitprüfen |\n| Übersetzung nur in der Ressourcendatei geprüft | In der echten Oberfläche prüfen — Layoutbrüche und fehlende Glyphen zeigen sich erst dort |\n| Store-/Registry-Sprachfelder vergessen | Sie wandern nicht mit der App-Übersetzung mit |\n\n## Abschluss-Checkliste\n\n- [ ] `surface-after-care` vollständig durchlaufen (inkl. Push und Flächen-Parität).\n- [ ] Rechtsrelevanz geprüft; Ergebnis dokumentiert — auch wenn verneint.\n- [ ] Rechtscheck fällig gewesen? Wenn ja: eingeholt, Auflagen umgesetzt, Wiedervorlage gesetzt.\n- [ ] `_after-care/` in der `.gitignore`, Gutachten nicht getrackt.\n- [ ] Alle Organisationen inventarisiert, Beziehungen bestimmt.\n- [ ] Querverweise bidirektional gesetzt, in den Gegen-Repos committet und gepusht.\n- [ ] Wegen dirty tree oder Sperre übersprungene Gegen-Repos als offene Punkte notiert.\n- [ ] App-Sprachen vollständig, Umschalter erreichbar, in der Oberfläche geprüft.\n- [ ] Store-/Registry-Sprachfelder mitgezogen.\n- [ ] Laufprotokoll-Eintrag mit Stufe `full` geschrieben.\n\n## Changelog\n\n### 1.0.0 (2026-07-24)\n- Initiale Version. Stufe 2 der Repo-Nachpflege, aufbauend auf `surface-after-care`.\n"}, {"id": "skill:infrastructure:headless", "name": "headless", "cat": "infrastructure", "ver": "0.0.0", "status": "active", "desc": "", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nlanguage: de\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"headless banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n> **English Translation** — Official English version of `headless`.\n\n\n# Headless (Deutsch)\n\n## Übersicht & Zweck\n\nNutze diesen Skill, wenn die auftraggebende Person ausdrücklich einen längeren,\nautonomen Lauf ohne laufende Rückfragen wünscht. Der Modus erhöht die\nAusdauer, nicht die Berechtigung.\n\nEin einzelner nicht ausführbarer Punkt darf unabhängige, sichere Restarbeit nicht\nunnötig stoppen.\n\n## Startbedingungen\n\nVor Beginn festhalten:\n\n- konkretes Ziel und Erfolgskriterium,\n- positiver und negativer Scope,\n- verfügbare Zeit- oder Kostenbudgets,\n- erlaubte Seiteneffekte,\n- Projektregeln, Sperren und fremde Änderungen,\n- Pfad oder Mechanismus für Checkpoints,\n- optional ein zulässiges lokales Entscheidungsprofil.\n\nFehlt ein Entscheidungsprofil, werden nur explizite Regeln und sichere\nStandardannahmen verwendet. Die Runtime darf keine Person imitieren.\n\n## Entscheidungsstufen\n\n| Stufe | Grundlage | Verhalten |\n|---|---|---|\n| hoch | explizite Regel oder mehrfach bestätigtes Muster | entscheiden; nur bei vorhandener Autorität ausführen |\n| mittel | plausible, reversible Standardentscheidung | entscheiden, Annahme markieren, sicher fortsetzen |\n| niedrig | neuartig, widersprüchlich oder ohne belastbaren Rahmen | nicht raten; zurückstellen oder eskalieren |\n\nKonfidenz in die Entscheidung und Autorität zur Ausführung sind getrennte Achsen.\n\n## Laufprotokoll\n\n1. **Kontext laden.** Regeln, Zustand, Locks und Ziel prüfen.\n2. **Arbeit zerlegen.** Unabhängige Pakete, Entscheidungspunkte und\n   Freigabepunkte markieren. Werden mindestens zwei unabhängige Worker eingesetzt,\n   das Auftrags- und Evidenzprotokoll des `orchestrator` anwenden, sofern es\n   verfügbar ist.\n3. **Sichere Arbeit ausführen.** Reversible, autorisierte Schritte fortsetzen.\n4. **Entscheidungen behandeln.**\n   - Mit zulässigem Profil: Verfahren des `decision-avatar` verwenden.\n   - Ohne Profil: nur aus expliziten Projekt- oder Auftragsregeln ableiten.\n5. **Nicht ausführbare Punkte parken.** Entscheidung oder Empfehlung festhalten,\n   Ausführung aber nicht vorwegnehmen.\n6. **Unabhängige Arbeit fortsetzen.** Ein geparkter Punkt blockiert nur seine\n   echten Abhängigkeiten.\n7. **Checkpoint schreiben.** Ziel, erledigte Schritte, Evidenz, Annahmen,\n   geparkte Punkte und nächsten Schritt sichern.\n8. **Abschluss prüfen.** Ergebnisse selbst verifizieren und offene Entscheidungen\n   in einer kompakten Liste bündeln.\n\n## Entscheidungsprotokoll\n\nFür jede nicht triviale Annahme erfassen:\n\n```text\nID:\nEntscheidung:\nGrundlage:\nKonfidenz:\nAusgeführt: ja/nein\nEvidenz:\nRücknahme oder Korrektur:\n```\n\nAgentenentscheidungen dürfen später nicht als Aussagen der auftraggebenden Person\nbehandelt werden.\n\n## Paketlokale Stopps\n\nEin einzelnes Paket stoppen und parken, wenn es neue Autorität, eine irreversible\nexterne Aktion, unklare Regeln oder einen Konflikt benötigt. Danach prüfen, welche\nanderen Pakete davon wirklich abhängig sind.\n\n## Stop-Bedingungen des Gesamtlaufs\n\nDer gesamte Lauf stoppt nur, wenn:\n\n- keine sichere, unabhängige Arbeit mehr möglich ist,\n- eine notwendige Entscheidung niedrige Konfidenz hat,\n- alle verbleibenden Arbeitspakete neue externe oder irreversible Autorität\n  erfordern,\n- eine Sperre, ein Konflikt oder ein Sicherheitsrisiko den gesamten verbleibenden\n  Scope betrifft,\n- das vereinbarte Budget erreicht ist,\n- der aktuelle Zustand nicht mehr zuverlässig gesichert werden kann.\n\n## Abschlussformat\n\n```text\nErreicht:\nVerifiziert durch:\nAnnahmen:\nZurückgestellte Entscheidungen:\nNicht ausgeführte Seiteneffekte:\nNächster sinnvoller Schritt:\n```\n\n## Änderungsprotokoll\n\n### 1.1.0 (2026-07-28)\n- Persönliche Avatar-, Pfad-, Kommando- und Providerbindungen entfernt.\n- Konfidenz und Ausführungsautorität getrennt.\n- Fortsetzung unabhängiger Arbeit und gebündelte Eskalation präzisiert.\n- Paketlokale Blocker ausdrücklich vom Stopp des Gesamtlaufs getrennt.\n\n### 1.0.0 (2026-06-17)\n- Lokale Ausgangsfassung."}, {"id": "skill:infrastructure:letter-hooker", "name": "letter-hooker", "cat": "infrastructure", "ver": "1.0.0", "status": "active", "desc": "Extends automation-self-care with Letter Hooks, Preflight Bootloaders, Document Traversal Rules, and Self-Healing Prompt Context Enrichment for AI agents and CLIs that lack native, event-driven JSON lifecycle hooks (such as Antigravity / Gemini CLI). Use when an agent needs to inject preflight rules, search memory/gardener before work begins, enforce directory document reading strategies (CLAUDE.md / AGENTS.md), or dynamically route sidecar tasks to skills and security protocols.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "tex
