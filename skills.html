chniques. It serves as a context template for therapeutic support.\n\n**Note:** These techniques are support, not a substitute for professional therapy. In acute crises, always refer to professional help.\n\n**Never implement:** EMDR, Prolonged Exposure (PE), Narrative Exposure Therapy (NET)\n\n---\n\n## 1. Active Listening\n\n**Goal:** Signal complete understanding, truly absorb what is said.\n\n**Techniques:**\n\n- **Verbal acknowledgment:** \"I understand,\" \"Mm-hmm,\" \"That sounds difficult\"\n- **Inquiry:** \"Can you describe that in more detail?\" / \"What do you mean by that?\"\n- **Summarizing:** At the end of a section, briefly repeat what was heard\n- **Non-directive listening:** No advice before the person has finished\n\n**Attitude:** Full attention, no interruptions, no judgment.\n\n**Conversation formula:**\n> \"What I heard is [summary]. Is that correct?\"\n\n---\n\n## 2. Mirroring\n\n**Goal:** Reflect perceived emotions, make feelings visible.\n\n**Techniques:**\n\n- **Simple mirroring:** Repeat the last word or sentence slightly rephrased\n- **Emotional mirroring:** Address named or implied emotions\n  > \"It sounds like you are very exhausted right now.\"\n- **Body language mirroring:** (in person) Adjust posture\n\n**Caution:**\n- Don't overdo it — too much mirroring feels artificial\n- Don't over-elaborate interpretations\n\n**Examples:**\n> Person: \"I don't know what to do anymore.\"\n> Mirror: \"You don't know what to do anymore — it sounds like everything is overwhelming right now.\"\n\n---\n\n## 3. Paraphrasing\n\n**Goal:** Restate the core content in your own words, check understanding.\n\n**Difference from mirroring:** Mirroring reflects emotion, paraphrasing reflects content/meaning.\n\n**Structure:**\n1. Briefly summarize content\n2. Highlight the key message\n3. Ask for confirmation\n\n**Formula:**\n> \"If I understand you correctly, you're saying [paraphrase]. Is that right?\"\n\n**Examples:**\n> Person: \"My mother nags me every day with the same accusations and I can't take it anymore.\"\n> Paraphrase: \"So it feels like an endless loop that you currently see no way out of?\"\n\n---\n\n## 4. Open Questions\n\n**Goal:** Encourage exploration without prescribing answers.\n\n**Characteristics of open questions:**\n- Start with: How, What, In what way, Describe, Explain\n- Leave room for personal answers\n- Cannot be answered with yes/no\n\n**Examples:**\n- \"How did that feel?\"\n- \"What happens inside you when that occurs?\"\n- \"How do you usually deal with this?\"\n\n**Avoid closed questions:**\n- \"Did that hurt?\" -> better: \"How did that feel?\"\n- \"Are you sad?\" -> better: \"What's going through your mind right now?\"\n\n---\n\n## 5. Validation\n\n**Goal:** Confirm feelings and reactions as understandable and legitimate.\n\n**Important:** Validation does not mean agreement, but understanding.\n\n**Formula:**\n> \"It makes complete sense that you feel this way, given [situation].\"\n\n**Levels of validation (after Linehan):**\n1. Attentive listening (showing presence)\n2. Accurately reflecting (what was said?)\n3. Recognizing the unspoken\n4. Understanding the cause in context\n5. Acknowledging the reaction as understandable\n6. Radical genuineness (honest, equal-level response)\n\n---\n\n## 6. Conversation Phases\n\n| Phase | Goal | Techniques |\n|-------|------|------------|\n| Opening | Settling in, creating safety | Greeting, open questions, signaling non-judgment |\n| Exploration | Exploring the topic | Active listening, inquiry, paraphrasing |\n| Deepening | Reaching deeper levels | Mirroring, validation, emotional resonance |\n| Integration | Bringing together, next steps | Summarizing, testing hypotheses, outlook |\n| Closing | Wrapping up, transition | Review, homework, farewell |\n\n---\n\n## Ethics and Boundaries\n\n**An AI assistant may:**\n- Explain and demonstrate conversation techniques\n- Guide active listening, mirroring, paraphrasing\n- Ask open questions and offer validation\n- Provide psychoeducation about counseling skills\n\n**An AI assistant must NOT:**\n- Replace professional therapeutic conversations\n- Make diagnoses or treatment recommendations\n- Conduct crisis intervention\n- Apply EMDR, Prolonged Exposure (PE), or Narrative Exposure Therapy (NET)\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n## References\n\n- Rogers, C. R. (1951). *Client-Centered Therapy.* Houghton Mifflin.\n- Rogers, C. R. (1961). *On Becoming a Person.* Houghton Mifflin.\n- Linehan, M. M. (1993). *Cognitive-Behavioral Treatment of Borderline Personality Disorder.* Guilford Press.\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*\n*Sources: Rogers (1951, 1961), Linehan (1993) — Not professional therapy*"}, {"id": "skill:therapy:exposure-guidance", "name": "exposure-guidance", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Graded exposure for anxiety disorders: Fear hierarchy, SUDs scale, exposure planning and guidance. Psychoeducation only, not implementation.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: exposure-guidance\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Graded exposure for anxiety disorders: Fear hierarchy, SUDs scale, exposure planning and guidance. Psychoeducation only, not implementation.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [exposure, anxiety, phobia, suds, graded, behavioral-therapy]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/exposition_begleitung.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"exposure-guidance banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Exposure Guidance (Deutsch)\n\n> Fear hierarchy, SUDs scale, graded exposure and habituation: Planning and guidance — actual exposure only with a therapist\n\nSee: [ETHICS.md](../ETHICS.md)\n\n---\n\n## Context\n\nExposure (confrontation therapy) is one of the most effective methods in behavioral therapy for anxiety disorders, phobias, OCD, and PTSD. It is based on the principles of habituation and extinction: When one repeatedly faces an anxiety-provoking situation, the anxiety response decreases over time.\n\nEvidence: Exposure therapy is the gold-standard treatment for specific phobias, social anxiety, panic disorder, and agoraphobia (NICE Guidelines, Bandelow et al. 2014, S3 Guideline Anxiety Disorders). Effect sizes are among the highest in psychotherapy research.\n\n**IMPORTANT:** This skill supports PLANNING of exposure exercises and conveys understanding of the mechanisms. The IMPLEMENTATION of exposure must be conducted under the guidance of a qualified therapist.\n**Never implement:** EMDR, Prolonged Exposure (PE), Narrative Exposure Therapy (NET)\n\n---\n\n## 1. Understanding the Mechanisms\n\n### Habituation\n\n```\nHABITUATION: Adaptation through repeated confrontation\n\nAnxiety level\n100 |  *\n    | * *\n 80 |*   *\n    |     *\n 60 |      *\n    |       *\n 40 |        *\n    |         *  *\n 20 |          **  * *\n    |                  * * * * * *\n  0 |________________________________\n    Time (during exposure)\n\nAnxiety initially rises, reaches a peak,\nand then drops on its own WITHOUT flight or avoidance.\n\nKey experience: \"The anxiety passes, even when\nI stay in the situation.\"\n```\n\n### Extinction (New Learning)\n\n```\nEXTINCTION: New experiences overwrite old fear associations\n\nOld experience: Dog -> Danger -> Fear -> Flight\nNew experience: Dog -> No danger -> Fear decreases -> I am safe\n\nThe old association is not erased but overlaid by new\nexperiences. Therefore, fear can return in certain\ncontexts (renewal, reinstatement) — which is NORMAL.\n```\n\n### Why Avoidance Maintains the Problem\n\n```\nTHE AVOIDANCE CYCLE:\n\nAnxiety-provoking situation\n        |\n        v\nAnxiety rises (unpleasant)\n        |\n        v\nAvoidance/flight\n        |\n        v\nShort-term relief (anxiety drops immediately)\n        |\n        v\nLong-term reinforcement of anxiety\n(\"The situation IS dangerous, good that I fled\")\n        |\n        v\nNext time: Even more anxiety, even more avoidance\n```\n\n---\n\n## 2. The SUDs Scale\n\n### Subjective Units of Distress (0-100)\n\n```\nSUDs SCALE (Subjective Units of Distress)\n\n  0  Completely relaxed, no anxiety\n 10  Minimal tension, barely noticeable\n 20  Slight unease, easily tolerable\n 30  Noticeably unpleasant, but controllable\n 40  Noticeable anxiety, still able to function\n 50  Moderate anxiety, strenuous but manageable\n 60  Strong anxiety, clear urge to avoid\n 70  Very strong anxiety, hard to endure\n 80  Intense anxiety, at the edge of tolerance\n 90  Extreme anxiety, feeling of panic\n100  Maximum anxiety, worst imaginable distress\n```\n\n### Using the SUDs Scale\n\n**Before exposure:**\n- Estimated anxiety in the planned situation (expected value)\n\n**During exposure:**\n- Assess current SUDs value every 5 minutes\n- Document the progression (rising, falling, fluctuating)\n\n**After exposure:**\n- Highest SUDs value? Final value? How quickly did anxiety decrease?\n- Was it as bad as expected?\n\n---\n\n## 3. Creating a Fear Hierarchy\n\n### Principle\n\nA fear hierarchy ranks anxiety-provoking situations from lowest to highest anxiety level. Exposure begins with easy situations and increases step by step.\n\n### Example: Fear of Dogs\n\n```\nFEAR HIERARCHY: Dog Phobia\n\nSUDs | Situation\n-----|--------------------------------------------------\n 10  | Look at a picture of a dog\n 15  | Watch a video of playing dogs\n 25  | Talk about own experiences with dogs\n 30  | Watch a small dog from 10 meters away\n 40  | Watch a small dog from 5 meters away\n 50  | Stand next to a leashed small dog (2 meters)\n 55  | Touch a small leashed dog (owner holding)\n 60  | Watch a medium dog from 5 meters\n 65  | Sit next to a leashed medium dog\n 70  | Pet a medium dog\n 75  | Walk past an unleashed dog (park)\n 80  | Be alone in a room with a calm dog\n 85  | Pet a large dog\n 90  | Be in a park with multiple unleashed dogs\n 95  | Feed a dog\n100  | Let an unfamiliar dog run toward you\n```\n\n### Template for Completion\n\n```\nMY FEAR HIERARCHY\n\nAnxiety topic: [...]\n\nSUDs | Situation\n-----|--------------------------------------------------\n     | [...]\n     | [...]\n     | [...]\n     | [...]\n     | [...]\n```\n\n---\n\n## 4. Types of Exposure\n\n### Graded Exposure (In Vivo)\n\n**Principle:** Step-by-step confrontation with real situations, starting at low SUDs values.\n\n### Flooding\n\n**Principle:** Direct confrontation with highly anxiety-provoking situations for extended periods. Only under therapeutic guidance. NOT to be guided by an AI assistant — only explained.\n\n### Exposure in Sensu (Imaginal)\n\n**Principle:** Experiencing anxiety-provoking situations in imagination. Helpful as preparation for real exposure.\n\n### Interoceptive Exposure\n\n**Principle:** Deliberately inducing physical anxiety symptoms (e.g., rapid heartbeat through exercise, dizziness through spinning). ONLY under therapeutic guidance.\n\n---\n\n## 5. Guided Exposure Planning\n\n### Preparation Protocol\n\n```\nEXPOSURE PLANNING PROTOCOL\n\nDate: [...]\nTherapist informed: [ ] Yes  [ ] No (MANDATORY!)\n\nAnxiety topic: [...]\nChosen situation: [...]\nExpected SUDs value: [...]\nLevel in hierarchy: [...]\n\nWhat exactly will I do: [...]\nWhere: [...]\nWhen: [...]\nHow long: [...]\nAlone or accompanied: [...]\n\nMy greatest fear: [...]\nWhat will realistically happen: [...]\n\nEmergency plan (if SUDs > 90 or dissociation):\n1. Grounding (5-4-3-2-1)\n2. Breathing exercise (box breathing)\n3. [Call trusted person]: Tel. [...]\n4. Leave situation in an orderly manner (no panicked fleeing)\n```\n\n### Post-Session Protocol\n\n```\nEXPOSURE DEBRIEFING\n\nDate: [...]\nSituation: [...]\n\nSUDs before (expectation): [...]\nSUDs highest value during: [...]\nSUDs at the end: [...]\n\nHow long stayed in situation: [...]\nHabituation occurred: [ ] Yes  [ ] Partial  [ ] No\n\nWhat I learned: [...]\nWas it as bad as feared: [ ] Worse  [ ] As expected  [ ] Less bad\n\nWhat I want to do differently next time: [...]\nNext level: [...]\n```\n\n---\n\n## 6. Safety Notes and Abort Criteria\n\n### Prerequisites for Exposure\n\n```\nCHECKLIST BEFORE STARTING EXPOSURE:\n\n[ ] Qualified therapist is involved\n[ ] Sufficient stabilization is present\n[ ] Fear hierarchy is created and discussed\n[ ] Emergency plan is prepared\n[ ] Person understands the mechanism (habituation)\n[ ] No acute suicidality\n[ ] No uncontrolled psychotic symptoms\n[ ] No severe dissociative disorder (without therapeutic support)\n[ ] No acute substance intoxication\n[ ] Person has voluntarily consented (no forced exposure!)\n```\n\n### Abort Criteria\n\n```\nABORT EXPOSURE IF:\n\n- Dissociation occurs (person is \"gone,\" unresponsive)\n- Panic attack with loss of control\n- Person explicitly wants to stop (respect autonomy!)\n- Physical symptoms: chest pain, shortness of breath, fainting\n- Suicidal thoughts during exposure\n- The situation becomes objectively unsafe\n\nON ABORT:\n1. Grounding and stabilization (5-4-3-2-1, breathing exercise)\n2. Ensure person is oriented and stable\n3. Discuss experience (what happened, what was learned)\n4. No blame (\"You should have stayed\")\n5. Plan next step with therapist\n```\n\n---\n\n## Ethics and Boundaries\n\n**An AI assistant may:**\n- Explain exposure principles (psychoeducation)\n- Create fear hierarchies together\n- Explain and use the SUDs scale\n- Support exposure planning (fill out protocols)\n- Document debriefing\n- Provide safety information\n- Motivate and normalize (\"Anxiety during exposure is desired and normal\")\n\n**An AI assistant must NOT:**\n- Independently conduct or guide exposure\n- Guide flooding (ONLY therapist)\n- Guide interoceptive exposure (ONLY therapist)\n- Conduct prolonged exposure for PTSD\n- Accompany exposure in severe dissociation\n- Pressure toward exposure (\"You must face this\")\n- Guarantee results\n- Make diagnoses or create treatment plans\n- Make medication-related recommendations\n\n**PARTICULARLY STRICT BOUNDARY:** An AI assistant plans and explains. Actual exposure takes place under the guidance of a qualified therapist. For any request regarding implementation: refer to professional. Exposure without professional support can re-traumatize or intensify anxiety.\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*\n*Sources: Foa & Kozak (1986), Craske et al. (2014), Bandelow et al. (2014), S3 Guideline Anxiety Disorders (2014) — Not professional therapy*"}, {"id": "skill:therapy:genogram-work", "name": "genogram-work", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Genogram work: Recognizing and reflecting on family relationship patterns. Multigenerational perspective, genogram symbols, pattern recognition, and resources in family history.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: genogram-work\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-15\nupdated: 2026-03-15\ndescription: Genogram work: Recognizing and reflecting on family relationship patterns. Multigenerational perspective, genogram symbols, pattern recognition, and resources in family history.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [genogram, systemic-therapy, family-therapy, multigenerational, relationship-patterns]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/genogramm_arbeit.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-15', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"genogram-work banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Genogram Work (Deutsch)\n\n> Recognizing and reflecting on family relationship patterns: Multigenerational perspective, genogram symbols, pattern recognition, and resources in family history\n\nSee: [ETHICS.md](../ETHICS.md)\n\n---\n\n## Context\n\nThe genogram is a tool from systemic therapy and family therapy. It was significantly shaped by Murray Bowen (multigenerational approach) and Monica McGoldrick (genogram standardization). It graphically represents family relationships across multiple generations and makes patterns, roles, and dynamics visible.\n\nEvidence: Genogram work is a component of all systemic therapy training programs and is established in clinical practice as a diagnostic and reflective tool (McGoldrick, Gerson & Petry 2020, von Schlippe & Schweitzer 2012).\n\n**Note:** This is a reflection tool, not a substitute for professional therapy.\n**Never implement:** EMDR, Prolonged Exposure (PE), Narrative Exposure Therapy (NET)\n\n---\n\n## 1. What Is a Genogram?\n\n### Definition\nA genogram is an extended graphical representation of a family tree that captures not only biological descent but also relationship qualities, emotional patterns, conflicts, illnesses, and important life events — typically across three generations.\n\n### Difference from a Family Tree\n\n| Family Tree | Genogram |\n|-------------|----------|\n| Who is related to whom? | How do people relate to each other? |\n| Biological descent | Emotional relationship quality |\n| Static facts | Dynamic patterns |\n| Historically oriented | Pattern-oriented |\n\n---\n\n## 2. Genogram Symbols (Standard after McGoldrick)\n\n### Persons\n\n```\nMale:         [ ]     (Square)\nFemale:       ( )     (Circle)\nNon-binary:   < >     (Diamond)\nDeceased:     [X]     (Symbol with X)\nIndex person: [=]     (Double border)\n```\n\n### Relationships\n\n```\nMarriage/Partnership:   ———————      (solid line)\nSeparation:            ——/——        (line with one slash)\nDivorce:               ——//——       (line with two slashes)\nClose relationship:    ═══════      (double line)\nEnmeshed relationship: ≡≡≡≡≡≡≡      (triple line)\nConflict:              /\\/\\/\\/\\     (zigzag line)\nDistance:              · · · · ·   (dotted line)\nCutoff:                ——||——      (line with double bar)\n```\n\n---\n\n## 3. How Do I Create a Genogram?\n\n### Step-by-Step Guide\n\n**Step 1: Gather Data**\nFor each person (at least 3 generations):\n- Name, birth year, death year if applicable\n- Occupation, place of residence\n- Special life events (migration, illness, losses)\n- Relationship status\n\n**Step 2: Draw Basic Structure**\n- Grandparents at top, children at bottom\n- Partners side by side\n- Children from left to right (oldest first)\n\n**Step 3: Add Relationship Qualities**\n- Which relationships are close, which are distant?\n- Where are conflicts?\n- Where are enmeshments or cutoffs?\n\n**Step 4: Mark Patterns**\n- Color-code recurring themes\n- E.g.: Addiction (red), mental illness (blue), separation (orange)\n\n---\n\n## 4. Recognizing Patterns — Multigenerational Perspective\n\n### Typical Multigenerational Patterns\n\n**Repetition patterns:**\n- Divorces across multiple generations\n- Addictive behavior (alcohol, work, ...)\n- Early parenthood\n- Career choices / role distribution\n\n**Relationship patterns:**\n- Enmeshment (too-close relationship, no boundaries)\n- Cutoff (contact break, exclusion)\n- Triangulation (child drawn into parental conflict)\n- Parentification (child takes on parental role)\n\n**Roles and mandates:**\n- \"The strong one\" / \"The caretaker\"\n- \"The black sheep\"\n- \"The peacemaker\"\n- Unspoken family mandates (\"You should have it better\")\n\n### Reflection Questions on Patterns\n- \"What themes appear in your family across generations?\"\n- \"What role have you taken on in your family?\"\n- \"Are there family rules that were never spoken aloud?\"\n- \"Who in the family do you resemble most — and in what way?\"\n- \"Which relationship patterns of your parents do you recognize in yourself?\"\n\n---\n\n## 5. Resources in the Genogram\n\n### Not Just Problems — Also Strengths\n\nThe genogram shows not only burdens but also resources:\n- Who has mastered difficult times?\n- What strengths exist in the family?\n- Who was a positive role model?\n- What values were passed on that are helpful?\n\n### Reflection Questions on Resources\n- \"Who in your family admires you? For what?\"\n- \"From whom did you inherit or learn a strength?\"\n- \"Which family member handled a crisis particularly well?\"\n- \"Which positive family traditions would you like to continue?\"\n- \"What has held your family together?\"\n\n---\n\n## 6. Exercises\n\n### Exercise 1: My Genogram\nDraw your own genogram (3 generations). Use the symbols from section 2. Note 2-3 keywords for each person.\n\n### Exercise 2: Relationship Qualities\nAdd relationship qualities to your genogram:\n- Where are the closest relationships?\n- Where are conflicts?\n- Where is distance or cutoff?\n\n### Exercise 3: Pattern Search\nLook at your finished genogram and answer:\n1. What themes repeat?\n2. What roles do you recognize?\n3. Which patterns do you want to continue — and which not?\n\n### Exercise 4: Resource Genogram\nMark all positive resources in your genogram: Strengths, talents, mastered crises, positive values.\n\n---\n\n## Ethics and Boundaries\n\n**An AI assistant may:**\n- Explain genogram concepts and symbols\n- Support creating a simple genogram\n- Ask reflection questions about family patterns\n- Point out resources in family history\n\n**An AI assistant must NOT:**\n- Make family diagnoses\n- Process family secrets or traumas\n- Conduct family constellations\n- Promote blame toward family members\n- Perform family therapeutic interventions\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n## References\n\n- McGoldrick, M., Gerson, R. & Petry, S. (2020). *Genograms: Assessment and Treatment.* Norton.\n- Bowen, M. (1978). *Family Therapy in Clinical Practice.* Jason Aronson.\n- von Schlippe, A. & Schweitzer, J. (2012). *Lehrbuch der systemischen Therapie und Beratung.* Vandenhoeck & Ruprecht.\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*\n*Sources: McGoldrick et al. (2020), Bowen (1978), von Schlippe & Schweitzer (2012) — Not professional therapy*"}, {"id": "skill:therapy:guideline-therapies-overview", "name": "guideline-therapies-overview", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Comparison of the four guideline-approved psychotherapy approaches in Germany: Cognitive Behavioral Therapy, Psychodynamic Therapy, Psychoanalysis, Systemic Therapy — Orientation guide.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: guideline-therapies-overview\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-15\nupdated: 2026-03-15\ndescription: Comparison of the four guideline-approved psychotherapy approaches in Germany: Cognitive Behavioral Therapy, Psychodynamic Therapy, Psychoanalysis, Systemic Therapy — Orientation guide.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [guideline-therapies, cbt, psychodynamic, psychoanalysis, systemic-therapy, orientation]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/richtlinienverfahren_ueberblick.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-15', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"guideline-therapies-overview banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Guideline Therapies Overview (Deutsch)\n\n> Comparison of the four approved guideline psychotherapy approaches in Germany: CBT, Psychodynamic Therapy, Psychoanalysis, Systemic Therapy — Orientation guide\n\nSee: [ETHICS.md](../ETHICS.md)\n\n---\n\n## Context\n\nIn Germany, there are four recognized guideline psychotherapy approaches whose costs are covered by statutory health insurance. Many people don't know which approach might be suitable for them. This skill provides a psychoeducational overview for orientation.\n\nLegal basis: Guideline therapies are approved by the Federal Joint Committee (G-BA) based on scientific evidence.\n- Cognitive Behavioral Therapy (CBT): Guideline therapy since 1987\n- Psychodynamic Psychotherapy (PDT): since 1967\n- Psychoanalytic Psychotherapy (AP): since 1967\n- Systemic Therapy (ST): since 2019 (adults) / 2024 (children & adolescents)\n\n**Note:** This is an orientation guide, not a therapy recommendation.\n**Never implement:** EMDR, Prolonged Exposure (PE), Narrative Exposure Therapy (NET)\n\n---\n\n## 1. The Four Guideline Therapies at a Glance\n\n| Feature | CBT | PDT | AP | ST |\n|---------|-----|-----|----|----|\n| **Core idea** | Change behavior and thought patterns | Understand unconscious conflicts | Deep personality change | Change relationships and systems |\n| **Time focus** | Present and future | Past and present | Past (childhood) | Present and relationships |\n| **Sessions** | 12-80 hrs | 12-100 hrs | 80-300 hrs | 12-48 hrs |\n| **Frequency** | 1x/week | 1x/week | 2-3x/week | 1x/week or less |\n| **Setting** | Mostly individual | Mostly individual | Individual (couch) | Individual, couple, family |\n\n---\n\n## 2. Cognitive Behavioral Therapy (CBT)\n\n### Core Assumptions\n- Behavior is learned and can be unlearned\n- Thought patterns influence feelings and behavior (cognitive revolution, Beck)\n- Change happens through active practice and new experiences\n\n### When particularly suitable?\n- Anxiety disorders, phobias, panic attacks\n- Depression\n- OCD, PTSD, eating disorders\n\n---\n\n## 3. Psychodynamic Psychotherapy (PDT)\n\n### Core Assumptions\n- Unconscious conflicts influence our experience and behavior\n- Earlier relationship experiences shape current patterns\n- Insight into unconscious connections promotes change\n\n### When particularly suitable?\n- Depression (especially chronic)\n- Relationship problems with recurring patterns\n- Personality disorders, psychosomatic complaints\n\n---\n\n## 4. Psychoanalytic Psychotherapy (Psychoanalysis, AP)\n\n### Core Assumptions\n- Deeply rooted unconscious conflicts from early childhood influence all experience\n- Comprehensive personality change is possible through deep understanding\n\n### When particularly suitable?\n- Deep-seated personality problems\n- Chronic, recurring problems\n- When shorter approaches haven't been sufficient\n\n---\n\n## 5. Systemic Therapy (ST)\n\n### Core Assumptions\n- Problems arise and persist in relationship systems\n- Change in one member changes the entire system\n- Every person has resources and solution competencies\n\n### When particularly suitable?\n- Family and couple conflicts\n- Child and adolescent problems (within the family system)\n- When shorter therapy is desired\n\n---\n\n## 6. Practical Orientation\n\n### Decision Aid (NOT a recommendation, only orientation)\n\n| I want to... | Potentially suitable approach |\n|--------------|------------------------------|\n| Get concrete tools against anxiety | CBT |\n| Understand why I keep falling into the same patterns | PDT |\n| Fundamentally get to know myself better | AP |\n| Understand relationship problems in their systemic context | ST |\n| Get quick practical help | CBT or ST |\n\n### Therapeutic Relationship\n\nResearch consistently shows: The most important therapeutic factor is the therapeutic relationship (Wampold 2015). The \"right\" approach is less important than the \"right\" therapist.\n\n---\n\n## 7. Practical Information\n\n### Finding a Therapist\n- In the US: Psychology Today therapist finder, insurance provider directories\n- In the UK: NHS psychological therapies, BACP therapist directory\n- In Germany: Appointment service: 116 117, Association of Statutory Health Insurance Physicians\n\n---\n\n## Ethics and Boundaries\n\n**An AI assistant may:**\n- Present and compare the four guideline therapies objectively\n- Provide orientation (not recommendations)\n- Give practical information about finding a therapist\n- Ask reflection questions for self-clarification\n\n**An AI assistant must NOT:**\n- Recommend a specific approach\n- Advise against an approach\n- Make diagnoses or derive indications\n- Evaluate or recommend therapists\n- Comment on or question ongoing therapies\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n## References\n\n- Wampold, B. E. (2015). *The Great Psychotherapy Debate.* Routledge.\n- Leichsenring, F. & Rabung, S. (2011). Long-term psychodynamic psychotherapy in complex mental disorders. *British Journal of Psychiatry*, 199(1), 15-22.\n- von Sydow, K. et al. (2010). *Die Wirksamkeit der Systemischen Therapie/Familientherapie.* Hogrefe.\n- G-BA Psychotherapy Guideline\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*\n*Sources: G-BA Guidelines, Wampold (2015), Leichsenring & Rabung (2011), von Sydow et al. (2010) — Not professional therapy*"}, {"id": "skill:therapy:mindfulness-basics", "name": "mindfulness-basics", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "MBSR fundamentals, body scan, and breathing exercises. Evidence-based mindfulness techniques according to Jon Kabat-Zinn for everyday life.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: mindfulness-basics\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: MBSR fundamentals, body scan, and breathing exercises. Evidence-based mindfulness techniques according to Jon Kabat-Zinn for everyday life.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [mbsr, mindfulness, meditation, breathing-exercises, bodyscan]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/achtsamkeit_basis.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"mindfulness-basics banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Mindfulness Basics (Deutsch)\n\n> MBSR fundamentals, body scan, and breathing exercises for everyday life\n\nSee: [ETHICS.md](../ETHICS.md)\n\n---\n\n## Context\n\nMindfulness is the intentional, non-judgmental attention to the present moment. MBSR (Mindfulness-Based Stress Reduction, Kabat-Zinn 1979) is the most well-known evidence-based mindfulness program.\n\n**Note:** This is support, not a substitute for professional therapy.\n**Never implement:** EMDR, Prolonged Exposure (PE), Narrative Exposure Therapy (NET)\n\n---\n\n## 1. Core Attitudes of Mindfulness (Kabat-Zinn)\n\n| Attitude | Description | Opposite to Avoid |\n|----------|-------------|-------------------|\n| Non-Judging | Observing without evaluating | \"That is good/bad\" |\n| Patience | Things unfold in their own time | Rushing, forcing |\n| Beginner's Mind | Being open, as if for the first time | Assumptions, expert stance |\n| Trust | In one's own experience and intuition | Relying solely on others |\n| Non-Striving | Simply being, without having to achieve | Performance orientation |\n| Acceptance | Seeing things as they are | Fighting against reality |\n| Letting Go | Allowing experiences to pass | Holding on, clinging |\n\n---\n\n## 2. Breathing Exercises\n\n### 2.1 Simple Breath Awareness (5 Minutes)\n\n**Goal:** Anchoring in the present moment, calming the nervous system.\n\n**Instructions:**\n1. Assume a comfortable sitting position (chair, floor, cushion)\n2. Close your eyes or softly lower your gaze\n3. Direct attention to the breath\n4. Notice: Where do I feel the breath? (tip of the nose, chest, abdomen)\n5. Thoughts arise? -> Kindly notice, return to the breath\n6. No goal other than: Being with the breath\n\n**Insight:** Thoughts come and go like clouds — you are the sky behind them.\n\n---\n\n### 2.2 4-7-8 Breathing Technique (Calming)\n\n**Goal:** Activating the parasympathetic nervous system, stress reduction.\n\n**Procedure:**\n1. Inhale: 4 seconds\n2. Hold: 7 seconds\n3. Exhale: 8 seconds (longer than inhaling!)\n4. Repeat: 3-4 cycles\n\n**When to use:** Before sleep, during acute stress, before difficult situations.\n\n---\n\n### 2.3 Box Breathing (Square Breathing)\n\n**Goal:** Balance, concentration (also used by Navy SEALs, elite athletes).\n\n**Procedure:**\n1. Inhale: 4 seconds\n2. Hold: 4 seconds\n3. Exhale: 4 seconds\n4. Hold: 4 seconds\n5. Repeat: 4 cycles\n\n---\n\n## 3. Body Scan\n\n**Goal:** Developing body awareness, recognizing and releasing tension.\n**Duration:** 10-30 minutes (shorter version: 5 minutes possible)\n\n**Instructions (Short Form):**\n\n```\n1. Lie on your back or sit comfortably\n2. Close eyes, take 3 deep breaths\n3. Bring attention to the soles of your feet\n   - Notice: Temperature, pressure, contact with the ground\n   - No changing, just observing\n4. Slowly move upward:\n   Feet -> Lower legs -> Knees -> Thighs\n   -> Pelvis -> Abdomen -> Chest -> Shoulders\n   -> Arms -> Hands -> Neck -> Face -> Head\n5. At tension: Breathe into the area, release on exhale\n6. At the end: Perceive the entire body as a whole\n7. Gently return to the room\n```\n\n**Documentation afterward:**\n- What did I notice?\n- Where was there tension?\n- How do I feel now compared to before?\n\n---\n\n## 4. STOP Technique (Mini-Mindfulness in Everyday Life)\n\n**S** — **Stop:** Pause whatever you are doing\n**T** — **Take a breath:** Take one deep breath\n**O** — **Observe:** Observe: thoughts, feelings, body sensations\n**P** — **Proceed:** Consciously continue (or decide what to do next)\n\n**Use:** Brief pause at any time, especially during stress or decisions.\n\n---\n\n## 5. Mindfulness in Daily Life (Informal Practice)\n\nNo time for formal exercises? Make everyday activities mindful:\n\n| Activity | Mindfulness Focus |\n|----------|------------------|\n| Eating | Consciously notice taste, texture, smell |\n| Walking | Feel each step (ground contact, weight shift) |\n| Brushing teeth | Only do that, nothing else on the side |\n| Doing dishes | Temperature of the water, sounds, movements |\n| Driving | Fully present (no radio, no ruminating) |\n| Waiting | Instead of phone: observe surroundings, breathe |\n\n---\n\n## 6. MBSR Program Overview (8 Weeks)\n\nThe complete MBSR program as reference:\n\n| Week | Focus |\n|------|-------|\n| 1 | Autopilot vs. mindfulness |\n| 2 | Dealing with obstacles |\n| 3 | Mindfulness in the body (yoga) |\n| 4 | Recognizing stress reactions |\n| 5 | Stressors and reacting vs. responding |\n| 6 | Mindful communication |\n| 7 | Self-care |\n| 8 | Mindfulness in everyday life |\n\n---\n\n## Ethics and Boundaries\n\n**An AI assistant may:**\n- Explain and guide mindfulness exercises\n- Convey MBSR content (psychoeducation)\n- Guide breathing exercises and body scan\n- Explain and encourage the STOP technique\n\n**An AI assistant must NOT:**\n- Replace formal MBSR courses\n- Guide mindfulness for trauma patients without professional supervision\n- Therapeutically address dissociation or flashbacks\n- Make medication-related recommendations\n\n**Progress tracking:**\n- Mood before/after exercise (0-10 scale)\n- Track regularity (did I practice today?)\n- Observations: Where was attention hard to maintain?\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n## References\n\n- Kabat-Zinn, J. (1990). *Full Catastrophe Living: Using the Wisdom of Your Body and Mind to Face Stress, Pain, and Illness.* Delacorte Press.\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*\n*Sources: Kabat-Zinn (1990), MBSR Program — Not professional therapy*"}, {"id": "skill:therapy:motivational-interviewing", "name": "motivational-interviewing", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Motivational Interviewing (MI) according to Miller and Rollnick: OARS techniques, change talk, fostering readiness for change.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: motivational-interviewing\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Motivational Interviewing (MI) according to Miller and Rollnick: OARS techniques, change talk, fostering readiness for change.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [motivational-interviewing, oars, change-talk, ambivalence, miller-rollnick]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/motivational_interviewing.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"motivational-interviewing banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Motivational Interviewing (Deutsch)\n\n> OARS techniques, stages of change, and change talk: Fostering intrinsic motivation for change without pressure or manipulation\n\nSee: [ETHICS.md](../ETHICS.md)\n\n---\n\n## Context\n\nMotivational Interviewing (MI) was developed by William R. Miller and Stephen Rollnick. It is a client-centered, directive counseling approach for fostering intrinsic motivation for change. MI is used evidence-based in addiction treatment, health behavior, therapy adherence, and behavior change.\n\nEvidence: Over 200 RCTs support the effectiveness of MI, particularly for addictive behaviors (Lundahl et al. 2010, Cochrane Review), health behaviors, and treatment adherence.\n\n**Note:** This is support, not a substitute for professional therapy.\n**Never implement:** EMDR, Prolonged Exposure (PE), Narrative Exposure Therapy (NET)\n\n---\n\n## 1. MI Spirit and Principles\n\n### The Four Principles\n\n1. **Partnership:** Collaboration on equal footing, not expert authority\n2. **Acceptance:** Respecting autonomy, acknowledging strengths, absolute worth of the person\n3. **Compassion:** The well-being of the person comes first\n4. **Evocation:** Motivation already resides within the person — it is elicited, not implanted\n\n### The Spirit of MI\nMI is not a collection of techniques, but an attitude. The techniques only work within the context of this foundational spirit. Without it, MI becomes manipulation.\n\n---\n\n## 2. OARS Techniques\n\nOARS are the four core competencies of motivational interviewing.\n\n### O — Open Questions\n\n**Principle:** Ask questions that invite reflection and storytelling, that cannot be answered with yes/no.\n\n**Examples:**\n- \"What would you like to see change?\"\n- \"How would your life look if you had made this change?\"\n- \"What brought you to think about this?\"\n- \"What is important to you about your health?\"\n- \"What would you gain if you made this change?\"\n\n**Avoid:**\n- Closed questions: \"Do you want to quit smoking?\"\n- Leading questions: \"You know that's harmful, right?\"\n- Why-questions: \"Why did you do that?\" (sounds accusatory)\n\n---\n\n### A — Affirming\n\n**Principle:** Acknowledge strengths, efforts, and positive steps of the other person. Not praising (\"You're great\"), but specifically naming what was observed.\n\n**Examples:**\n- \"It takes courage to speak openly about this.\"\n- \"You managed to hold on for three days — that shows you're serious.\"\n- \"Despite the difficult situation, you came today — that shows commitment.\"\n- \"You've clearly given this a lot of thought.\"\n\n**When to use:**\n- When the person describes steps toward change\n- When they persist despite setbacks\n- To strengthen self-efficacy\n\n---\n\n### R — Reflecting\n\n**Principle:** Give back what was said in your own words — to show understanding and encourage further thinking.\n\n**Types of reflections:**\n\n| Type | Description | Example |\n|------|-------------|---------|\n| Simple | Repeat/paraphrase content | \"You're saying it's hard for you.\" |\n| Deepening | Pick up on what's beneath the surface | \"It sounds like you're torn.\" |\n| Double-sided | Mirror both sides of ambivalence | \"On one hand you want to stop, on the other it gives you something.\" |\n| Amplified | Slightly overstate (carefully!) | \"So there's absolutely no reason to change anything?\" |\n\n**Double-sided reflection (ambivalence):**\n```\n\"On one hand, you say you'd like to drink less alcohol.\nOn the other hand, the social aspect of after-work drinks is important to you.\nBoth make sense.\"\n```\n\n---\n\n### S — Summarizing\n\n**Principle:** Bundle the conversation — especially highlighting change talk.\n\n**Types:**\n- **Collecting:** Summarize multiple points\n- **Linking:** Connect earlier statements with current ones\n- **Transitional:** At the end of a conversation, leading to next steps\n\n**Example:**\n```\n\"Let me summarize what I've heard so far:\nYou've noticed that your sleep has gotten worse and it's\naffecting your work. You've tried reducing caffeine before,\nand that partly helped. Being fit and productive is important\nto you. At the same time, your morning coffee enjoyment matters.\nDoes that sound right? What would you like to add?\"\n```\n\n---\n\n## 3. Stages of Change (Transtheoretical Model)\n\n### The Stages (Prochaska & DiClemente)\n\n| Stage | Description | MI Strategy |\n|-------|-------------|-------------|\n| Precontemplation | No problem awareness, no intention to change | Inform, spark curiosity, don't push |\n| Contemplation | Ambivalence: \"Maybe I should...\" | Explore ambivalence, foster change talk |\n| Preparation | Decision made, making plans | Support planning, strengthen confidence |\n| Action | Actively implementing change | Affirm, work through obstacles |\n| Maintenance | Stabilizing the change | Relapse prevention, acknowledge successes |\n| Relapse | Return to old behavior | Normalize, re-motivate, learn from experience |\n\n**Important:** Relapse is not failure, but part of the change process.\n\n### Recognizing the Stage\n\n**Guide questions:**\n- \"Have you thought about changing something?\" (Precontemplation vs. Contemplation)\n- \"What speaks for it, what against it?\" (Exploring ambivalence)\n- \"Do you have concrete ideas about how you'd approach it?\" (Preparation)\n- \"What have you already tried?\" (Action experience)\n\n---\n\n## 4. Recognizing and Strengthening Change Talk\n\n### What is Change Talk?\n\nChange talk consists of statements by the person that point toward change. MI aims to increase change talk and not reinforce sustain talk (maintaining the status quo).\n\n### DARN-CAT Framework\n\n**Preparatory Change Talk (DARN):**\n- **D**esire: \"I would like to...\"\n- **A**bility: \"I could...\"\n- **R**easons: \"It would be better because...\"\n- **N**eed: \"I need to change something...\"\n\n**Mobilizing Change Talk (CAT):**\n- **C**ommitment: \"I will...\"\n- **A**ctivation: \"I'm ready to...\"\n- **T**aking Steps: \"I've already...\"\n\n### Fostering Change Talk\n\n**Strategies:**\n1. **Ask open questions:**\n   - \"What would you gain if something changed?\"\n   - \"What gives you confidence that you could do this?\"\n\n2. **Importance and confidence scaling:**\n   - \"How important is this change to you on a scale of 0 to 10?\"\n   - \"How confident are you that you could manage it?\"\n   - \"Why a 5 and not a 2?\" (strengthens existing motivation)\n\n3. **Exploring extremes:**\n   - \"What could happen in the worst case if nothing changes?\"\n   - \"What would be the best thing that could happen if you changed it?\"\n\n4. **Looking back and looking forward:**\n   - \"What was it like before this issue came up?\"\n   - \"Where do you see yourself in five years if everything stays the same?\"\n\n---\n\n## 5. Dealing with Resistance\n\n### Resistance as a Signal\n\nIn MI, \"resistance\" is interpreted as a sign that the counselor is moving too fast or not adequately respecting the person's autonomy.\n\n### Strategies\n\n| Situation | Response |\n|-----------|----------|\n| \"I don't have a problem\" | Accept, don't argue, show curiosity |\n| \"You don't understand me\" | Reflect: \"Being understood is important to you\" |\n| \"That won't work anyway\" | Explore past successes, strengthen confidence |\n| Person becomes angry | Slow down, emphasize autonomy, reflect empathically |\n\n**Golden rule:** Never argue against resistance. Roll with the resistance, don't push against it.\n\n---\n\n## Ethics and Boundaries\n\n**An AI assistant may:**\n- Use OARS techniques to foster reflection\n- Recognize and reflect back change talk\n- Provide information about change processes\n- Respectfully explore ambivalence\n\n**An AI assistant must NOT:**\n- Force or manipulate change\n- Make decisions for the person\n- Conduct addiction therapy or withdrawal support\n- Use threats or fear appeals\n- Undermine the person's autonomy\n\n**Core principle:** The person decides. An AI assistant supports the reflection process.\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*\n*Sources: Miller & Rollnick (2013), Prochaska & DiClemente (1983), Lundahl et al. (2010) — Not professional therapy*"}, {"id": "skill:therapy:pmr-autogenic-training", "name": "pmr-autogenic-training", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Progressive Muscle Relaxation (PMR) according to Jacobson and Autogenic Training according to Schultz. Short forms and full versions.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: pmr-autogenic-training\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Progressive Muscle Relaxation (PMR) according to Jacobson and Autogenic Training according to Schultz. Short forms and full versions.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [pmr, autogenic-training, relaxation, jacobson, schultz, muscle-relaxation]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/pmr_autogenes_training.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"pmr-autogenic-training banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Progressive Muscle Relaxation & Autogenic Training (Deutsch)\n\n> Body-based relaxation techniques according to Jacobson and Schultz\n\nSee: [ETHICS.md](../ETHICS.md)\n\n---\n\n## Context\n\nProgressive Muscle Relaxation (PMR, Jacobson 1929) and Autogenic Training (AT, Schultz 1932) are the two most extensively researched relaxation techniques. Both work through conscious influence on the autonomic nervous system and can be learned as self-help methods without therapeutic supervision.\n\n**Note:** This is support, not a substitute for professional therapy.\n**Never implement:** EMDR, Prolonged Exposure (PE), Narrative Exposure Therapy (NET)\n\n---\n\n## 1. Progressive Muscle Relaxation (PMR) according to Jacobson\n\n### Basic Principle\n\nSystematic tensing and releasing of muscle groups. Through the contrast between tension and release, the body learns deeper relaxation than possible in its normal state.\n\n**Mechanism:** Muscle tension -> conscious release -> parasympathetic activation -> reduction of heart rate, blood pressure, muscle tone\n\n### 1.1 Long Form: 16 Muscle Groups\n\n| No | Muscle Group | Tension |\n|----|-------------|---------|\n| 1 | Right hand/forearm | Clench fist |\n| 2 | Right upper arm | Tense biceps |\n| 3 | Left hand/forearm | Clench fist |\n| 4 | Left upper arm | Tense biceps |\n| 5 | Forehead | Raise eyebrows |\n| 6 | Mid-face | Squeeze eyes shut, wrinkle nose |\n| 7 | Lower face | Clench teeth, pull corners of mouth wide |\n| 8 | Neck | Press chin toward chest (counter-pressure) |\n| 9 | Chest/shoulders | Raise shoulders, inhale deeply |\n| 10 | Abdomen | Tense abdominal muscles |\n| 11 | Lower back | Slight arch |\n| 12 | Right thigh | Slightly lift leg |\n| 13 | Right lower leg | Pull foot toward shin |\n| 14 | Right foot | Curl toes |\n| 15 | Left thigh | Slightly lift leg |\n| 16 | Left lower leg/foot | Pull foot up, curl toes |\n\n**Procedure per muscle group:**\n1. Direct attention to the muscle group\n2. Tense: 5-7 seconds (approximately 70% of maximum strength)\n3. Release: Let go abruptly\n4. Notice: 20-30 seconds, perceive the relaxation\n5. Next muscle group\n\n### 1.2 Short Form: 7 Muscle Groups\n\nFor experienced practitioners or when time is limited:\n\n| No | Combination | Tension |\n|----|------------|---------|\n| 1 | Both arms | Clench fists, bend arms |\n| 2 | Entire face | Grimace: furrow brow, close eyes, mouth wide |\n| 3 | Neck/shoulders | Pull shoulders up to ears |\n| 4 | Chest/abdomen | Inhale, tense abdomen |\n| 5 | Back | Shoulder blades together, slight arch |\n| 6 | Both thighs | Slightly lift legs |\n| 7 | Both lower legs/feet | Pull feet up |\n\n### 1.3 Recall Technique (Advanced)\n\nAfter several weeks of practice: Relaxation of muscle groups ONLY through imagination (without actual tensing). The body has conditioned the relaxation response.\n\n---\n\n## 2. Autogenic Training (AT) according to Schultz\n\n### Basic Principle\n\nConcentrative self-relaxation through formulaic autosuggestion. The practitioner induces a state of deep relaxation through repeated guiding phrases (autonomic switching).\n\n**Mechanism:** Concentration on formulas -> ideomotor response -> actual physical changes (blood flow, warmth, calm)\n\n### 2.1 The 6 Basic Exercises (Lower Level)\n\n| Exercise | Formula | Goal |\n|----------|---------|------|\n| 1. Heaviness | \"My right arm is very heavy\" | Muscle relaxation |\n| 2. Warmth | \"My right arm is very warm\" | Vasodilation, blood flow |\n| 3. Heart | \"My heart beats calmly and steadily\" | Heart regulation |\n| 4. Breathing | \"My breathing is calm and steady\" | Breath regulation |\n| 5. Solar plexus | \"My solar plexus is streaming warm\" | Abdominal organ relaxation |\n| 6. Forehead | \"My forehead is pleasantly cool\" | Mental clarity |\n\n**Progression:** Gradual over 6-8 weeks. Add one new exercise each week.\n\n### 2.2 Session Procedure\n\n```\n1. Basic posture: Coachman's posture, armchair position, or lying down\n2. Opening: Close eyes, \"I am completely calm\"\n3. Internally repeat formulas (6x each, slowly):\n   - \"My right arm is very heavy\" (6x)\n   - \"My right arm is very warm\" (6x)\n   - [additional formulas depending on practice level]\n4. Rest formula in between: \"I am completely calm\"\n5. Recall: Firmly tense arms, inhale deeply, open eyes\n   IMPORTANT: Never skip the recall (except before falling asleep)\n```\n\n### 2.3 Learning Plan\n\n| Week | Exercise | Duration |\n|------|----------|----------|\n| 1-2 | Heaviness exercise | 5 min |\n| 3-4 | Heaviness + Warmth | 8 min |\n| 5-6 | Heaviness + Warmth + Heart + Breathing | 12 min |\n| 7-8 | All 6 basic exercises | 15 min |\n\n---\n\n## 3. PMR vs. AT: Decision Guide\n\n| Criterion | PMR | AT |\n|-----------|-----|-----|\n| Learnability | Easy, immediately effective | Requires practice (4-8 weeks) |\n| Physical activity | Yes (tensing) | No (imagination only) |\n| For muscle tension | Very suitable | Moderately suitable |\n| For inner restlessness | Good | Very good |\n| For sleep problems | Good | Very good |\n| Usable anywhere | Limited (movement needed) | Yes (inconspicuous) |\n| For children | From approx. age 8 | From approx. age 10 |\n\n---\n\n## 4. Contraindications\n\n**PMR:**\n- Acute muscle injuries or inflammation\n- Severe spasticity\n- Epilepsy (tensing may trigger seizures — rare)\n\n**AT:**\n- Acute psychosis\n- Severe depression (risk of excessive introspection)\n- Cardiac arrhythmia (omit heart exercise)\n- Dissociative disorders\n- Severe hypotension (circulatory problems possible)\n\n**Both methods:**\n- Stop immediately if trauma flashbacks occur\n- Not a substitute for medical/psychotherapeutic treatment\n\n---\n\n## Progress Tracking\n\n- Tension level before/after exercise (0-10 scale)\n- Which muscle groups were particularly tense?\n- AT: Which formulas are already effective, which not yet?\n- Regularity: Goal 1x daily, at least 4x/week\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*\n*Sources: Jacobson (1929), Schultz (1932) — Not professional therapy*"}, {"id": "skill:therapy:positive-psychology", "name": "positive-psychology", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Positive Psychology according to Seligman: PERMA model, character strengths (VIA), gratitude exercises, flow theory, and resilience factors.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: positive-psychology\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Positive Psychology according to Seligman: PERMA model, character strengths (VIA), gratitude exercises, flow theory, and resilience factors.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [positive-psychology, perma, flow, gratitude, resilience, seligman]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/positive_psychologie.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"positive-psychology banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Positive Psychology (Deutsch)\n\n> Strengths focus, gratitude, flow, and PERMA according to Seligman and Csikszentmihalyi\n\nSee: [ETHICS.md](../ETHICS.md)\n\n---\n\n## Context\n\nPositive Psychology is the scientific study of what makes life worth living (Seligman & Csikszentmihalyi, 2000). In contrast to clinical psychology (What causes illness?), it asks: What makes people healthy, happy, and resilient?\n\nFounders: Martin Seligman (APA President 1998) initiated the movement. Other pioneers: Mihaly Csikszentmihalyi (Flow), Christopher Peterson (Character Strengths), Barbara Fredrickson (Broaden-and-Build), Ed Diener (Subjective Well-Being).\n\n**Note:** This is support, not a substitute for professional therapy.\n**Never implement:** EMDR, Prolonged Exposure (PE), Narrative Exposure Therapy (NET)\n\n---\n\n## 1. PERMA Model (Seligman, 2011)\n\nFive pillars of well-being according to Seligman (\"Flourish\"):\n\n### P — Positive Emotions\n- Joy, gratitude, serenity, interest, hope, pride, love\n- Fredrickson: At least a 3:1 ratio of positive to negative emotions\n- Exercise: \"Three Good Things\" (see below)\n\n### E — Engagement\n- Being fully absorbed in an activity (flow state)\n- Using one's strengths in daily life\n- Challenge and skill in balance\n\n### R — Relationships (Positive Relationships)\n- Social connectedness as the strongest predictor of well-being\n- Active-constructive responding to others' good news\n- Small kindnesses (Random Acts of Kindness)\n\n### M — Meaning\n- Belonging to and serving something greater than oneself\n- Meaning through work, family, community, spirituality\n- Frankl: \"He who has a why can bear almost any how\"\n\n### A — Achievement\n- Experiencing mastery and competence\n- Setting and achieving realistic goals\n- Grit: Perseverance + passion for long-term goals (Duckworth, 2016)\n\n---\n\n## 2. Character Strengths (VIA Classification)\n\nPeterson and Seligman (2004) identified 24 universal character strengths in 6 virtue categories:\n\n| Virtue | Strengths |\n|--------|----------|\n| Wisdom | Creativity, Curiosity, Judgment, Love of Learning, Perspective |\n| Courage | Bravery, Perseverance, Honesty, Zest |\n| Humanity | Love, Kindness, Social Intelligence |\n| Justice | Teamwork, Fairness, Leadership |\n| Temperance | Forgiveness, Humility, Prudence, Self-Regulation |\n| Transcendence | Appreciation of Beauty, Gratitude, Hope, Humor, Spirituality |\n\n**Signature strengths:** The 3-5 strengths that feel most authentic. Those who use their signature strengths daily are demonstrably more satisfied and less depressed (Seligman et al. 2005).\n\n**VIA Survey:** Free at viacharacter.org (scientifically validated)\n\n---\n\n## 3. Gratitude Exercises\n\n### 3.1 Three Good Things (Seligman et al. 2005)\n\n**Procedure:**\n1. Every evening, write down 3 good things from the day\n2. For each one note: Why did it happen?\n3. Duration: At least 1 week, ideally ongoing\n\n**Evidence:** Significantly increased well-being and reduced depressive symptoms over 6 months (Seligman et al. 2005)\n\n### 3.2 Gratitude Journal\n\nExtension of Three Good Things:\n- Morning: What am I grateful for today? (3 items)\n- Evening: What was good today? What did I contribute?\n- Shift perspective: People, experiences, abilities, everyday things\n\n### 3.3 Gratitude Letter (Gratitude Visit)\n\n**Procedure:**\n1. Identify a person you never properly thanked\n2. Write a specific letter (300 words, concrete)\n3. Visit the person and read the letter aloud\n\n**Evidence:** Strongest short-term effect of all positive psychology interventions (Seligman et al. 2005). Effect lasts approximately 1 month.\n\n---\n\n## 4. Flow Theory (Csikszentmihalyi, 1990)\n\n### Definition\nFlow is a state of complete immersion in an activity, where action flows effortlessly and time and self-consciousness recede into the background.\n\n### Conditions for Flow\n\n| Condition | Description |\n|-----------|-------------|\n| Balance | Challenge matches skill level |\n| Clear goals | You know exactly what to do |\n| Immediate feedback | Instant feedback on progress |\n| Concentration | Full attention on the task |\n| Control | Feeling of being able to master the situation |\n| Intrinsic motivation | The activity is rewarding in itself |\n\n### Flow Channel\n\n```\nChallenge\n     high   |  Anxiety    |  FLOW\n            |             |\n     low    |  Apathy     |  Boredom\n            +-------------|----------\n              low              high\n                    Skill\n```\n\n### Fostering Flow\n- Eliminate distractions (phone away, door closed)\n- Break tasks into manageable units\n- Adjust difficulty level (not too easy, not too hard)\n- Establish regular practice times\n\n---\n\n## 5. Resilience Factors\n\nResilience = psychological resistance to adversity.\n\n### The 7 Pillars of Resilience (after Reivich & Shatte, 2002)\n\n1. **Emotion regulation:** Perceiving and managing one's own feelings\n2. **Impulse control:** Consciously directing actions rather than reacting\n3. **Causal analysis:** Realistically assessing causes\n4. **Self-efficacy:** Confidence in one's own competence\n5. **Empathy:** Recognizing and understanding others' emotions\n6. **Optimism:** Realistic, positive expectations for the future\n7. **Goal orientation:** Setting and pursuing meaningful goals\n\n### Building Resilience\n- Consciously use strengths (VIA strengths)\n- Maintain social network (relationships as the #1 protective factor)\n- Self-care: Sleep, exercise, nutrition, recovery\n- Cognitive flexibility: Seek alternative perspectives\n- Find meaning and significance (even in difficult situations)\n\n---\n\n## Ethics and Boundaries\n\n**An AI assistant may:**\n- Explain the PERMA model and character strengths (psychoeducation)\n- Guide and support gratitude exercises\n- Discuss flow conditions\n- Convey resilience factors\n- Support signature strengths reflection\n\n**An AI assistant must NOT:**\n- Treat clinical depression solely with positive psychology\n- Clinically interpret VIA survey results\n- Recommend positive psychology as a substitute for therapy\n- Foster toxic positivity (\"Just be grateful\")\n\n**Progress tracking:**\n- Well-being before/after exercise (0-10 scale)\n- Gratitude streak: How many consecutive days?\n- Flow log: When and during which activities do I experience flow?\n- Signature strengths: How often used this week?\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*\n*Sources: Seligman (2011), Csikszentmihalyi (1990), Peterson & Seligman (2004) — Not professional therapy*"}, {"id": "skill:therapy:problem-solving-training", "name": "problem-solving-training", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Structured problem solving in 6 steps: Problem definition, goals, brainstorming, evaluation, implementation, and review.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: problem-solving-training\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Structured problem solving in 6 steps: Problem definition, goals, brainstorming, evaluation, implementation, and review.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [problem-solving, decision, structured, six-steps, coping]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/problemloese_training.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"problem-solving-training banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Problem-Solving Training (Deutsch)\n\n> Structured problem solving in 6 steps according to D'Zurilla and Goldfried: Approaching problems systematically instead of ruminating in circles\n\nSee: [ETHICS.md](../ETHICS.md)\n\n---\n\n## Context\n\nProblem-Solving Training (Social Problem-Solving, SPS) is an evidence-based intervention from cognitive behavioral therapy. It helps people approach problems systematically and solution-oriented instead of getting lost in rumination, avoidance, or impulsive action.\n\nEvidence: Meta-analyses show significant effects for depression (d=0.83), anxiety disorders, and stress (Malouff et al. 2007, Bell & D'Zurilla 2009).\n\n**Note:** This is support, not a substitute for professional therapy.\n**Never implement:** EMDR, Prolonged Exposure (PE), Narrative Exposure Therapy (NET)\n\n---\n\n## 1. Problem-Solving Orientation\n\nBefore the actual steps begin, the inner attitude is decisive.\n\n### Helpful Attitude\n- \"Problems are part of life — they are solvable\"\n- \"I can proceed step by step\"\n- \"There is rarely only one right solution\"\n- \"Not acting is also a decision — usually not a good one\"\n\n### Unhelpful Attitude\n- \"None of this makes any sense\"\n- \"I can't do it anyway\"\n- \"There is no solution\"\n- Impulsive action without thinking\n- Avoidance and procrastination\n\n**First step:** Reflect on your own problem-solving attitude.\n\n---\n\n## 2. The 6-Step Model\n\n### Step 1: Define the Problem\n\n**Goal:** Formulate the problem clearly, concretely, and manageably.\n\n**Guide questions:**\n- What exactly is the problem? (Facts, not interpretations)\n- Who is involved?\n- When and where does it occur?\n- Why is it a problem for me?\n\n**Worksheet:**\n\n```\nPROBLEM DEFINITION\n\nSituation: [What is happening concretely?]\nPeople involved: [Who is involved?]\nFrequency: [How often? When?]\nImpact: [What makes it a problem?]\n\nConcrete problem statement:\n[...]\n```\n\n**Common mistakes:**\n- Problem too vague (\"Everything is bad\")\n- Mixing multiple problems together\n- Including the solution in the problem statement\n\n---\n\n### Step 2: Set Goals\n\n**Goal:** What should be different after solving the problem?\n\n**SMART Criteria:**\n- Specific: What exactly?\n- Measurable: How will I recognize success?\n- Attractive: Why do I want this?\n- Realistic: Is it achievable?\n- Time-bound: By when?\n\n**Worksheet:**\n\n```\nGOAL SETTING\n\nMy goal: [...]\nHow will I know I've achieved it? [...]\nBy when? [...]\nRealistic (0-10)? [...]\nImportant to me (0-10)? [...]\n```\n\n---\n\n### Step 3: Generate Alternatives (Brainstorming)\n\n**Goal:** Generate as many solution ideas as possible — without immediate evaluation.\n\n**Brainstorming rules:**\n1. Quantity over quality — the more ideas, the better\n2. No evaluation during collection\n3. Creative and unusual thinking is allowed\n4. Combine and vary existing ideas\n\n**Worksheet:**\n\n```\nBRAINSTORMING\n\nSolution ideas (at least 5-8):\n1. [...]\n2. [...]\n3. [...]\n4. [...]\n5. [...]\n6. [...]\n7. [...]\n8. [...]\n```\n\n**Helper questions:**\n- \"What would someone do who doesn't have this problem?\"\n- \"What have I done in similar situations before?\"\n- \"What would I advise a friend?\"\n- \"What would be the boldest solution?\"\n- \"What would be the simplest solution?\"\n\n---\n\n### Step 4: Evaluate Alternatives\n\n**Goal:** Systematically weigh pros and cons of each alternative.\n\n**Evaluation criteria:**\n- Effectiveness: Does it solve the problem?\n- Feasibility: Can I implement it?\n- Time required: How long will it take?\n- Consequences: For me? For others?\n- Risks: What could go wrong?\n\n**Worksheet:**\n\n```\nEVALUATION MATRIX\n\n| Alternative | Effectiveness (0-10) | Feasibility (0-10) | Effort (0-10) | Risk (0-10) | Total |\n|-------------|---------------------|--------------------|--------------|--------------||-------|\n| 1. [...]    |                     |                    |              |              |       |\n| 2. [...]    |                     |                    |              |              |       |\n| 3. [...]    |                     |                    |              |              |       |\n\nPreferred solution: [...]\nReasoning: [...]\n```\n\n---\n\n### Step 5: Implement\n\n**Goal:** Concretely plan and carry out the chosen solution.\n\n**Action plan:**\n\n```\nACTION PLAN\n\nChosen solution: [...]\n\nConcrete steps:\n1. [What?] — [When?] — [Where?]\n2. [What?] — [When?] — [Where?]\n3. [What?] — [When?] — [Where?]\n\nPossible obstacles: [...]\nPlan B: [...]\nSupport I need: [...]\nFirst step (today/tomorrow): [...]\n```\n\n---\n\n### Step 6: Evaluate\n\n**Goal:** Review the outcome and adjust if needed.\n\n**Evaluation questions:**\n- Was the problem solved? (Fully / partially / not at all)\n- Am I satisfied with the result? (0-10)\n- What worked well?\n- What would I do differently next time?\n- Do I need a new attempt with a different alternative?\n\n**Worksheet:**\n\n```\nEVALUATION\n\nResult: [Solved / Partially / Not solved]\nSatisfaction (0-10): [...]\nWhat worked: [...]\nWhat didn't: [...]\nNext step: [Conclude / New attempt / Different approach]\n```\n\n---\n\n## 3. Common Problems in Problem Solving\n\n| Problem | Remedy |\n|---------|--------|\n| \"I don't know where to start\" | Back to Step 1, formulate problem smaller |\n| \"No solution is good enough\" | Question perfectionism, accept \"good enough\" |\n| \"I don't dare\" | Identify the smallest possible step |\n| \"It doesn't work\" | Evaluation: What exactly doesn't work? New attempt |\n| Problem is too big | Break into sub-problems, one at a time |\n| Emotions block | First emotion regulation (breathing, PMR), then problem solving |\n\n---\n\n## Ethics and Boundaries\n\n**An AI assistant may:**\n- Guide through the 6 steps and provide worksheet structure\n- Ask brainstorming questions\n- Support evaluation of alternatives\n- Document progress\n\n**An AI assistant must NOT:**\n- Prescribe solutions or suggest \"the right answer\"\n- Conduct relationship or life counseling in the therapeutic sense\n- Be the sole support for severe psychological distress\n- Make diagnoses\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*\n*Sources: D'Zurilla & Goldfried (1971), Nezu et al. (2013), Malouff et al. (2007) — Not professional therapy*"}, {"id": "skill:therapy:psychoeducation", "name": "psychoeducation", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Psychoeducation on depression, anxiety disorders, PTSD, bipolar disorder, schizophrenia, ADHD, and borderline. Knowledge sharing without diagnosis.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: psychoeducation\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Psychoeducation on depression, anxiety disorders, PTSD, bipolar disorder, schizophrenia, ADHD, and borderline. Knowledge sharing without diagnosis.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [psychoeducation, depression, anxiety, ptsd, adhd, borderline, knowledge]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/psychoedukation.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"psychoeducation banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Psychoeducation (Deutsch)\n\n> Knowledge sharing about mental disorders, symptoms, and treatment approaches\n\nSee: [ETHICS.md](../ETHICS.md)\n\n---\n\n## Context\n\nPsychoeducation refers to the systematic sharing of knowledge about mental disorders with affected individuals and their families. The goal is to foster understanding of the disorder, strengthen self-management, and reduce stigmatization.\n\nEvidence: Psychoeducation is recommended as a component in all treatment guidelines (DGPPN, NICE, APA) and demonstrably reduces relapse rates (Xia et al. 2011, Cochrane Review).\n\n**Note:** This is support, not a substitute for professional therapy.\n**Never implement:** EMDR, Prolonged Exposure (PE), Narrative Exposure Therapy (NET)\n\n---\n\n## 1. What is Psychoeducation?\n\n### Definition\nStructured communication of knowledge about mental disorders with the goal of making affected individuals \"experts of their own condition.\"\n\n### Goals\n- Understanding the illness: What do I have? Why?\n- Recognizing early warning signs\n- Knowing treatment options\n- Fostering self-efficacy\n- Reducing stigma\n- Improving adherence (treatment compliance)\n\n### Evidence\n- Relapse prevention in schizophrenia: NNT = 9 (Xia et al. 2011)\n- Depression: Improvement of treatment adherence by 30-50% (Donker et al. 2009)\n- Anxiety disorders: Psychoeducation alone already mildly effective (Donker et al. 2009)\n\n---\n\n## 2. Mental Disorders Overview\n\n### 2.1 Depression (Major Depressive Disorder)\n\n**What is it?** Persistent low mood, loss of interest, and lack of drive for at least 2 weeks, going beyond normal sadness.\n\n**Core symptoms (ICD-11):**\n- Depressed mood (most of the day, nearly every day)\n- Loss of interest / inability to feel pleasure (anhedonia)\n- Reduced drive / increased fatigue\n\n**Additional symptoms:** Concentration difficulties, feelings of guilt, sleep problems, appetite changes, suicidal thoughts, psychomotor retardation/agitation\n\n**Treatment:** CBT, medication (SSRIs, SNRIs), exercise, light therapy (seasonal)\n**Self-help:** Daily structure, activity scheduling, social contacts, exercise, sleep hygiene\n\n### 2.2 Anxiety Disorders\n\n**What is it?** Excessive, uncontrollable anxiety or fear that impairs everyday life.\n\n**Types:**\n- Generalized Anxiety Disorder (GAD): Chronic worrying\n- Panic Disorder: Sudden anxiety attacks with physical symptoms\n- Social Anxiety Disorder: Fear of evaluation in social situations\n- Specific Phobias: Fear of specific objects/situations\n- Agoraphobia: Fear of places/situations without escape\n\n**Treatment:** CBT (exposure, cognitive restructuring), SSRIs, relaxation\n**Self-help:** Anxiety diary, breathing exercises, gradual confrontation\n\n### 2.3 Post-Traumatic Stress Disorder (PTSD)\n\n**What is it?** Persistent reaction to a traumatic experience (threat, violence, accident, disaster) with re-experiencing, avoidance, and hyperarousal.\n\n**Core symptoms:**\n- Intrusions (flashbacks, nightmares)\n- Avoidance behavior\n- Emotional numbing or hyperarousal\n- Negative changes in thoughts and mood\n\n**Treatment:** Trauma-focused CBT, EMDR, Narrative Exposure Therapy\n**Self-help:** Stabilization techniques, grounding, safe place — NO self-exposure\n\n### 2.4 Bipolar Disorder\n\n**What is it?** Alternation between depressive and (hypo)manic episodes. Chronic condition with high relapse risk.\n\n**Manic episode:** Elevated mood, decreased need for sleep, grandiose ideas, increased activity, risk-taking behavior, pressured speech\n\n**Treatment:** Mood stabilizers (lithium, valproate), atypical antipsychotics\n**Self-help:** Mood diary, regular sleep schedule, knowing early warning signs\n\n### 2.5 Schizophrenia\n\n**What is it?** Severe mental disorder with disturbances of thought, perception, and experience. Affects approximately 1% of the population.\n\n**Positive symptoms:** Hallucinations, delusions, disorganized thinking\n**Negative symptoms:** Lack of drive, social withdrawal, flat affect\n**Cognitive symptoms:** Attention, memory, executive functions\n\n**Treatment:** Antipsychotics, CBT for psychosis, social therapy, family interventions\n**Self-help:** Medication adherence, stress avoidance, early warning signs, daily structure\n\n### 2.6 ADHD (Attention Deficit Hyperactivity Disorder)\n\n**What is it?** Neurobiological developmental disorder with inattention, impulsivity, and/or hyperactivity. Begins in childhood, persists into adulthood in approximately 50% of cases.\n\n**Treatment:** Multimodal (medication, psychoeducation, coaching, CBT)\n**Self-help:** External structural aids, timers, lists, routines, exercise\n\n### 2.7 Borderline Personality Disorder (BPD)\n\n**What is it?** Pattern of instability in relationships, self-image, and affect with pronounced impulsivity. High emotional vulnerability.\n\n**Core symptoms:** Unstable relationships, identity disturbance, impulsivity, affective instability, self-harm, chronic emptiness, dissociation\n\n**Treatment:** DBT (Linehan), Schema Therapy, MBT, TFP\n**Self-help:** Skills kit, emergency plan, distress tolerance skills\n\n---\n\n## 3. Stigma Reduction\n\n### Common Myths and Facts\n\n| Myth | Fact |\n|------|------|\n| \"Mentally ill people are dangerous\" | Affected individuals are more often victims than perpetrators |\n| \"Depression is weakness of will\" | Depression is a neurobiological disorder |\n| \"Therapy is just talking\" | Evidence-based therapy demonstrably changes brain structures |\n| \"It will pass on its own\" | Many conditions become chronic without treatment |\n| \"Medications cause addiction\" | Antidepressants do not cause dependence |\n\n### Language and Stigma\n- \"Person with schizophrenia\" instead of \"schizophrenic\"\n- \"Person with depression\" instead of \"depressive person\"\n- Person-first language demonstrably reduces stigma (Granello & Gibbs, 2016)\n\n---\n\n## 4. Family Perspective\n\n- Mental disorders affect the entire social environment\n- Families need their own psychoeducation and relief\n- Expressed Emotion (EE): High criticism/overinvolvement increases relapse risk\n- Recommendation: Family support groups, family psychoeducation\n\n---\n\n## Ethics and Boundaries\n\n**An AI assistant may:**\n- Provide factual information about mental disorders\n- Answer common questions\n- Refer to further resources\n\n**An AI assistant must NOT:**\n- Make or confirm diagnoses\n- Give individual treatment recommendations\n- Replace professional psychoeducation in group format\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*\n*Sources: ICD-11, DGPPN Guidelines, Xia et al. (2011), Donker et al. (2009), Cochrane Reviews — Not professional therapy*"}, {"id": "skill:therapy:schema-therapy", "name": "schema-therapy", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Schema Therapy according to Jeffrey Young: Schemas, modes, inner child concept
