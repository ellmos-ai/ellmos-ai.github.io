 improvements across several topic pipelines (software, research, games).\n\n**Mistake:** Step A skipped — only insertion points searched instead of reading the full policy files.\n\n**Consequence:** `NOTICE.md` introduced as a \"new license file\" in 7 files, although `THIRD_PARTY_LICENSES.txt` + a custom license generator (wrapper around `pip-licenses`) were already established — documented in the pipeline's GitHub policy (mandatory files + license checklist). All software projects already had THIRD_PARTY files.\n\n**Detection:** Only after the user asked (\"I'm fairly sure we already had rights management\").\n\n**Correction:** NOTICE.md removed from the project template, 6 further files adjusted, the existing license generator referenced instead of `pip-licenses`.\n\n**Lesson:** Had step A been executed in full, the conflict would have been detected before writing.\n\n## Rules of thumb\n\n1. **For \"improve the pipeline\", first read as long as you write.**\n2. **No new standard without proof that no existing one exists.**\n3. **Use existing tools/wrappers instead of new parallel ones.**\n4. **\"More of the same\" is usually worse than \"extend what exists\".**\n5. **Rolling back on conflict** is always better than running two parallel standards.\n\n## Completion checklist\n\nBefore reporting a pipeline renovation as \"done\":\n\n- [ ] Step A: all relevant root docs read?\n- [ ] Step B: pipeline purpose stated in 1-2 sentences?\n- [ ] Step C: ideal picture sketched (5-10 points)?\n- [ ] Step D: gap analysis with table (what stays / what is extended / what is new / what goes)?\n- [ ] Step E: empirics checked (bugs, lessons, self-test, user interview)?\n- [ ] Plan agreed with the user?\n- [ ] Step F: tested with a fresh subagent — improvement measurable?\n- [ ] No parallel standards introduced?\n- [ ] On conflicts: rolled back or honestly accounted for?\n\n## Optimal project-folder structure (for the project-folder optimizer)\n\nWhen the skill is applied to **a single project folder**, the following combined recommendation helps as an ideal reference (step C):\n\n### Anthropic standard (Claude Code)\n\n| File/folder | Function |\n|---|---|\n| `CLAUDE.md` (root) | Auto-loaded by Claude Code, project-specific instructions |\n| `.claude/settings.json` | Permissions, env vars, model selection (committed) |\n| `.claude/settings.local.json` | Local overrides (do NOT commit, add to `.gitignore`) |\n| `.claude/commands/*.md` | Custom slash commands |\n| `.claude/agents/*.md` | Custom subagents |\n| `.claude/skills/<name>/SKILL.md` | Project skills |\n\n### Your own project-docs template (recommended)\n\nIf you maintain your own project documentation template (e.g. under `<your-workspace>/_templates/project-docs/`), **three build-out profiles** pay off. Example split: **MINIMAL** provides the session core set with 7 root files (`AGENTS.md`, `CLAUDE.md`, `README.md`, `START.md`, `STATE.md`, `TODO.md`, `DONE.md`) plus `_tools/`. **STANDARD** adds `CHANGELOG.md`, `DECISIONS.md`, and `PATTERNS.md`. **FULL** expands to 14 root files and additionally adds `ARCHITECTURE.md`, `WORKFLOWS.md`, `TOOLS.md`, `GLOSSARY.md` as well as `workflows/` and `.github/`.\n\n→ **Use such a template as the base for new projects** (copy instead of creating manually).\n\n### Pipeline-specific additions (examples)\n\nDepending on the pipeline, further mandatory files come on top — typical patterns:\n\n- **Software project:** LICENSE, CODE_OF_CONDUCT.md, SECURITY.md, CONTRIBUTING.md, THIRD_PARTY_LICENSES.txt (generated), pyproject.toml/requirements.txt, entry in the pipeline's central release registry. → If available: use the pipeline's cookiecutter template.\n- **Research project:** concept document, action plan, publication plan, archive/source/result/data folders (`_archive/`, `_sources/`, `_results/`, `_data/`), `paper/` for LaTeX. For proof projects: a proof-note file with the proof chain and status.\n- **Game project:** project manifest and toolchain files of the engine (e.g. for Roblox/Rojo: default.project.json, rokit.toml, wally.toml, selene.toml), game design document, `src/{server,client,shared}/` per engine convention.\n\n### Full detail reference\n\n→ See **`references/optimal-project-structure.md`** in this skill folder (German). Contains:\n- Example `settings.json` (Anthropic schema)\n- Mandatory `.gitignore` entries\n- Anti-patterns (what does NOT belong in project folders)\n- Recommended workflows per pipeline type (software/research/game)\n- YAML header convention for documentation files\n- Auto-check sketch\n\n## Related skills (when to use instead of this one?)\n\n| Skill | When to use |\n|---|---|\n| **`project-onboarding`** | Take an EXTERNAL existing repo into your own system |\n| Project bootstrapper (if available) | Create a NEW project in an existing pipeline (greenfield, no rebuild) |\n| Pipeline bootstrapper (if available) | Create a COMPLETELY NEW pipeline (rare case) |\n| System onboarding (if available) | Set up a new machine |\n\nThe **pipeline optimizer** is responsible for **renovation**, not new construction or adoption. If your skill collection has a skill index, search it for matching bootstrapping skills.\n\n## Cross-references\n\n- Detail reference: `references/optimal-project-structure.md` (in this skill folder)\n- Anthropic Claude Code docs: `https://docs.claude.com/en/docs/claude-code`\n- If available: global user rules (e.g. a \"renovations\" section in your `~/CLAUDE.md`) and pipeline-specific stack descriptions\n\n## Scope choice: pipeline vs. project folder\n\nIf it is unclear which scope is meant, **clarify before step A**:\n\n| Clue | Scope |\n|---|---|\n| \"Improve the whole software pipeline\" | Pipeline |\n| \"Clean up the folder of tool X\" | Project folder |\n| \"Synchronize the central release registry\" | Pipeline (central asset) |\n| \"Refactor the AssetBuilder in game Y\" | Project folder |\n| \"Introduce a check convention pipeline-wide\" | Pipeline |\n| \"Create a check file in project Z\" | Project folder |\n\nAt **project-folder scope**, additionally always briefly check the parent pipeline's conventions (step A extended) so the intervention stays compatible with the pipeline.\n\n---\n\n## Änderungsprotokoll\n\n### 1.2.0 (2026-06-13)\n- First publication in the skill library: personal paths, concrete pipeline/project names, and references to private skills replaced with generic examples; the procedure itself (6 steps, anti-patterns, case study, checklists) unchanged\n\n### 1.1.1 (2026-06-01) and earlier\n- Internal versions (private skill directory, before publication)"}, {"id": "tool:dev:plugin-system", "name": "plugin-system", "cat": "dev", "ver": "1.0.0", "status": "active", "desc": "Generic plugin system for Python applications. Auto-discovery, validation, fault tolerance. Zero dependencies (Python stdlib only).", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: plugin-system\nversion: 1.0.0\ntype: tool\nauthor: BACH Team\ncreated: 2026-02-21\nupdated: 2026-03-12\ndescription: Generic plugin system for Python applications. Auto-discovery, validation, fault tolerance. Zero dependencies (Python stdlib only).\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: true\ncategory: dev\ntags: [plugin, framework, extensibility, cli, architecture]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'MODULAR_AGENTS/plugins', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"plugin-system banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Plugin System (Deutsch)\n\nFault-tolerant plugin system for Python CLI applications.\nA faulty plugin never stops the rest of the application.\n\n## Core Features\n\n- **Auto-Discovery:** Automatically finds plugins in a directory\n- **Validation:** Checks `name`, `version`, `execute()` on each plugin class\n- **Fault Tolerance:** Defective plugins are logged but not loaded\n- **Zero Dependencies:** Python standard library only\n\n## Files\n\n```\nscripts/\n  plugin_system.py       Core: PluginBase (ABC) + PluginManager\n  cli_demo.py            Demo CLI with argparse\n  test_plugin_system.py  16+ unit tests\nexamples/\n  hello.py               Hello World plugin\n  calculator.py          Calculator plugin\n  systeminfo.py          System Info plugin\n```\n\n## Quick Start\n\n### 1. Create a Plugin\n\n```python\nfrom plugin_system import PluginBase\n\nclass MyPlugin(PluginBase):\n    name = \"MyPlugin\"\n    version = \"1.0.0\"\n\n    def execute(self, *args, **kwargs):\n        return {\"status\": \"ok\", \"message\": \"Hello!\"}\n```\n\n### 2. Use PluginManager\n\n```python\nfrom plugin_system import PluginManager\n\nmanager = PluginManager(plugins_dir=\"./my_plugins\")\nplugins = manager.discover_plugins()\n\n# List all plugins (Deutsch)\nmanager.list_plugins()\n\n# Execute a plugin (Deutsch)\nsuccess, result = manager.execute_plugin(\"MyPlugin\", param=\"value\")\nif success:\n    print(result)\n```\n\n### 3. Integrate into Your App\n\n```python\nclass MyApp:\n    def __init__(self):\n        self.plugins = PluginManager(\"./plugins\")\n        self.plugins.discover_plugins()\n\n    def run_command(self, command, **params):\n        success, result = self.plugins.execute_plugin(command, **params)\n        return result if success else None\n```\n\n## Plugin Interface\n\nEvery plugin must:\n\n| Requirement | Details |\n|-------------|---------|\n| Inherit `PluginBase` | `from plugin_system import PluginBase` |\n| Set `name` | Class attribute, non-empty |\n| Set `version` | Class attribute, semantic versioning |\n| Implement `execute()` | Arbitrary `*args, **kwargs` |\n\n## Fault Tolerance\n\n| Error Type | Behavior |\n|-----------|----------|\n| SyntaxError in plugin | Plugin is skipped, rest loads |\n| Missing attributes | Plugin is marked as `is_valid=False` |\n| Exception in `execute()` | Returns `(False, error_message)` |\n| No plugin in directory | Empty list, no crash |\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-03-12)\n- Migration from MODULAR_AGENTS/plugins to skill library\n- PluginBase ABC + PluginManager\n- 3 example plugins (Hello, Calculator, SystemInfo)\n- 16+ unit tests\n- CLI demo with argparse"}, {"id": "protocol:dev:project-onboarding", "name": "project-onboarding", "cat": "dev", "ver": "1.0.0", "status": "active", "desc": "Standard procedure for onboarding new software projects: Feature analysis, code quality review, onboarding checklist, and task creation.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: project-onboarding\nversion: 1.0.0\ntype: protocol\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Standard procedure for onboarding new software projects: Feature analysis, code quality review, onboarding checklist, and task creation.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: dev\ntags: [onboarding, project, intake, analysis, checklist, code-review]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/workflows/projekt-aufnahme.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"project-onboarding banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Standard Onboarding Procedure for New Software Projects (Deutsch)\n\n**Version:** 1.0\n**Date:** 2026-03-12\n\n---\n\n## Übersicht & Zweck\n\nThis procedure defines which steps to perform on newly discovered software folders before they are added to a task management system.\n\n```\n+─────────────────────────────────────────────────────+\n|           STANDARD ONBOARDING PROCEDURE              |\n+─────────────────────────────────────────────────────+\n|  1. Create feature analysis                          |\n|  2. Code quality review (standard tests)             |\n|  3. Create TASKS.txt                                 |\n|  4. Add to task management                           |\n+─────────────────────────────────────────────────────+\n```\n\n---\n\n## Phase 1: Feature Analysis\n\n**Purpose:** Understand the tool, its functions, and development status.\n\n**Create file:** `Feature_Analysis_<ToolName>.md`\n\n### Template\n\n```markdown\n# Feature Analysis: <ToolName> (Deutsch)\n\n## Brief Description\nA short sentence describing what the tool does.\n\n---\n\n## Highlights\n\n| Feature | Description |\n|---------|-------------|\n| **Feature 1** | Description |\n| **Feature 2** | Description |\n\n---\n\n## Development Stage Assessment\n\n### Current Status: **<Status> (<X>%)**\n\nPossible statuses:\n- Prototype (0-30%)\n- Alpha (30-60%)\n- Beta (60-85%)\n- Production Ready (85-95%)\n- Release (95-100%)\n\n| Category | Rating (1-5) | Details |\n|----------|:------------:|---------|\n| **Functionality** | 3 | |\n| **UI/UX** | 3 | |\n| **Stability** | 3 | |\n| **Documentation** | 3 | |\n\n---\n\n## Recommended Extensions\n\n### Priority: High\n1. ...\n\n### Priority: Medium\n2. ...\n\n### Priority: Low\n3. ...\n\n---\n\n## Technical Details\n\nFramework:      <Framework>\nFile size:      <X> lines of Python\nMain file:      <main.py>\n\n---\n*Analysis created: <Date>*\n```\n\n---\n\n## Phase 2: Code Quality Review\n\n**Purpose:** Ensure technical quality, identify known issues.\n\n### Recommended Checks\n\n| Test | Tool | Description |\n|------|------|-------------|\n| **Encoding** | Encoding checker (e.g., `chardet`, `file`) | Ensure UTF-8 |\n| **Method Analysis** | Linter (e.g., `pylint`, `flake8`) | Find large methods |\n| **Indentation** | Formatter (e.g., `black`, `autopep8`) | Check consistency |\n| **Imports** | Import checker (e.g., `isort`, `pylint`) | Find unused imports |\n\n### Check Points\n\n- [ ] All .py files UTF-8 encoded?\n- [ ] No unusually large methods (>100 lines)?\n- [ ] Consistent indentation (spaces vs tabs)?\n- [ ] Unused imports removed?\n- [ ] Docstrings present?\n\n### Document Results\n\nRecord issues in TASKS.txt under \"QUALITY REVIEW\".\n\n---\n\n## Phase 3: Create TASKS.txt\n\n**Purpose:** Capture open tasks in a structured format.\n\n**Create file:** `TASKS.txt` in the project folder\n\n### Template\n\n```\nTASKS - <ToolName> V<Version>\n==============================\nStatus: <Status>\nDate: <Date>\n\nOPEN TASKS:\n[ ] <Task 1> - Effort: <LOW|MEDIUM|HIGH>\n[ ] <Task 2> - Effort: <LOW|MEDIUM|HIGH>\n\n---\nDONE (Archive):\n- <Completed task> (<Version>, <Date>)\n```\n\n### Status Values\n\n| Status | Meaning |\n|--------|---------|\n| NEWLY DISCOVERED | Not yet analyzed |\n| ANALYSIS NEEDED | Feature analysis in progress |\n| QUALITY REVIEW | Code tests running |\n| VALIDATED & READY | Ready for features |\n| MVP | Minimum Viable Product |\n| BUILD ONLY | Only compilation needed |\n| BLOCKED | Waiting for user test/decision |\n\n---\n\n## Phase 4: Task Management Integration\n\nAfter completing phases 1-3:\n\n1. **Transfer tasks:** Create TASKS.txt entries as tasks/issues\n2. **Verify:** All tasks correctly categorized?\n3. **Categorize:** Assign project to appropriate category (single tool, suite, library, etc.)\n\n### Automatic Onboarding Tasks\n\nFor new projects, create the following standard tasks:\n\n| Task | Description | Effort |\n|------|-------------|--------|\n| onb_1 | Create feature analysis | medium |\n| onb_2 | Code quality review | low |\n| onb_3 | Create TASKS.txt | low |\n\nTasks have dependencies: onb_2 depends on onb_1, onb_3 depends on onb_2.\n\n---\n\n## Quick Checklist\n\n```\n[ ] 1. Feature_Analysis_<Name>.md created\n[ ] 2. Code quality review completed (linter, encoding, imports)\n[ ] 3. TASKS.txt created with status\n[ ] 4. Tasks added to task management\n```\n\n---\n\n## Beispiel & Anwendung\n\n```bash\n# 1. Feature analysis (Deutsch)\n# -> Create Feature_Analysis_MyTool.md (see template) (Deutsch)\n\n# 2. Code quality (Deutsch)\npylint MyTool/main.py\nflake8 MyTool/main.py\nfile -i MyTool/main.py  # Check encoding\n\n# 3. TASKS.txt (Deutsch)\n# -> Create in tool folder with status \"QUALITY REVIEW\" (Deutsch)\n\n# 4. Create tasks (Deutsch)\n# -> Capture TASKS.txt entries as issues/tickets (Deutsch)\n```\n\n---\n\n*Created: 2026-01-10 | Ported: 2026-03-12*"}, {"id": "skill:dev:projekt-pipeline-umbrella", "name": "projekt-pipeline-umbrella", "cat": "dev", "ver": "0.1.0", "status": "active", "desc": "Meta-/Umbrella-Skill für die Familie „Projekt-/Pipeline-Aufbau & -Umbau\". Kennt alle Skills für Anlegen, Aufnehmen, Umbauen und Analysieren von Projekten und Pipelines und leitet zum passenden weiter. Nutze diesen Skill, wenn unklar ist, ob etwas neu angelegt (Greenfield) oder umgebaut (Bestand) werden soll bzw. ob es um ein einzelnes Projekt oder eine ganze Pipeline geht. Auch auslösen bei „neues Projekt/Pipeline anlegen\", „bestehendes umbauen\", „Projekt aufnehmen\", „Ordnerstruktur renovieren\", „welcher Bootstrapper passt\".", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: projekt-pipeline-umbrella\nversion: 0.1.0\ntype: skill\nauthor: Lukas Geiger + Claude\ncreated: 2026-06-17\nupdated: 2026-06-17\ndescription: >\n  Meta-/Umbrella-Skill für die Familie „Projekt-/Pipeline-Aufbau & -Umbau\". Kennt alle Skills für\n  Anlegen, Aufnehmen, Umbauen und Analysieren von Projekten und Pipelines und leitet zum passenden\n  weiter. Nutze diesen Skill, wenn unklar ist, ob etwas neu angelegt (Greenfield) oder umgebaut\n  (Bestand) werden soll bzw. ob es um ein einzelnes Projekt oder eine ganze Pipeline geht. Auch\n  auslösen bei „neues Projekt/Pipeline anlegen\", „bestehendes umbauen\", „Projekt aufnehmen\",\n  „Ordnerstruktur renovieren\", „welcher Bootstrapper passt\".\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\n\ncategory: dev\ntags: [projekt, pipeline, bootstrap, umbau, umbrella, meta, routing]\nlanguage: de\nstatus: active\n\ndependencies:\n  tools: []\n  services: []\n  protocols: [project-bootstrapper, pipeline-bootstrapper, project-onboarding, pipeline-optimizer, docs-analysis, dev-cycle]\n  python: []\n\nprovenance:\n  origin: \"custom\"\n  origin_path: \"~/.claude/skills/projekt-pipeline-umbrella/\"\n  origin_version: \"0.1.0\"\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"projekt-pipeline-umbrella banner\">\n# Projekt-/Pipeline-Aufbau & -Umbau — Umbrella\n\n## Zweck\n\nEinstiegspunkt für die Familie „Projekt-/Pipeline-Aufbau & -Umbau\". Die Mitglieder sortieren sich\nentlang zweier Achsen: **Greenfield vs. Bestand** und **Projekt-Ebene vs. Pipeline-Ebene**. Diese\nUmbrella verhindert die häufige Verwechslung „bootstrap\" vs. „optimize\" vs. „onboard\".\n\n## Mitglieder & Routing\n\n| Skill | Wofür | Wann diesen statt der anderen |\n|-------|-------|-------------------------------|\n| `/project-bootstrapper` | NEUES Projekt **in** bestehender Pipeline anlegen | Greenfield, Projekt-Ebene |\n| `/pipeline-bootstrapper` | KOMPLETT NEUE Top-Level-Pipeline anlegen | Greenfield, Pipeline-Ebene (selten) |\n| `/project-onboarding` | bestehendes Projekt aufnehmen/erfassen | Bestand, Projekt-Ebene |\n| `/pipeline-optimizer` | bestehende Pipeline/Struktur renovieren (6-Schritte-Verfahren) | Bestand, Umbau |\n| `/docs-analysis` | Anforderungs-/Konzeptdocs gegen aktuellen Code prüfen | Bestand, Analyse (kein Umbau) |\n| `/dev-cycle` | 8-Phasen-Entwicklungsrahmen für das eigentliche Bauen | quer: das WIE der Entwicklung |\n\n> Routing-Regel: **neu + Projekt** → `/project-bootstrapper` · **neu + Pipeline** →\n> `/pipeline-bootstrapper` · **Bestand aufnehmen** → `/project-onboarding` · **Bestand umbauen** →\n> `/pipeline-optimizer` · **nur prüfen** → `/docs-analysis` · **bauen** → `/dev-cycle`.\n\n## Gut gekoppelte Kombinationen\n\n- `/project-onboarding` (zuerst: Bestand erfassen) → `/pipeline-optimizer` (danach: gezielt umbauen) —\n  erst verstehen, dann renovieren (deckt das 6-Schritte-Prinzip „erst lesen, dann schreiben\").\n- `/docs-analysis` (Lücken finden) → `/dev-cycle` (Lücken schließen).\n- `/project-bootstrapper` (Gerüst) → `/dev-cycle` (Inhalt entwickeln).\n\n## Gemeinsame Konventionen\n\n- Bestehende Pipeline-Konventionen (Registry, Templates, CLAUDE.md) immer zuerst lesen — keine\n  Parallel-Standards anlegen.\n- Greenfield-Skills legen an, Bestand-Skills renovieren — nicht vermischen.\n- Live-Dateien der Einzelskills vor Anwendung lesen.\n\n## Changelog\n\n### 0.1.0 (2026-06-17)\n- Initiale Version. Erzeugt vom Audit-Modus (3c1) für die Familie Projekt-/Pipeline.\n"}, {"id": "skill:dev:repo-publish-check", "name": "repo-publish-check", "cat": "dev", "ver": "1.1.0", "status": "active", "desc": "Nutzerneutrale Prüfung von Repositories vor einer Veröffentlichung oder bei einer erneuten öffentlichen Prüfung. Kontrolliert Privacy, Geheimnisse, Lizenzen, Drittinhalte, Dokumentation und Freigabestatus, ohne die Veröffentlichung selbst vorzunehmen.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: repo-publish-check\ndescription: Nutzerneutrale Prüfung von Repositories vor einer Veröffentlichung oder bei einer erneuten öffentlichen Prüfung. Kontrolliert Privacy, Geheimnisse, Lizenzen, Drittinhalte, Dokumentation und Freigabestatus, ohne die Veröffentlichung selbst vorzunehmen.\nversion: 1.1.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-07-30\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: dev\ntags: [release, privacy, license, repository, publication]\nlanguage: de\nstatus: active\ndependencies:\n  tools: [git]\n  services: []\n  protocols: []\n  python: []\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"repo-publish-check banner\">\n\n# Repo Publish Check\n\n## Zweck\n\nPrüfe ein Repository vor der ersten Veröffentlichung oder bei einer späteren\nNachprüfung. Ein negatives Ergebnis ist zulässig. Ändere die Sichtbarkeit erst,\nwenn der Repository-Eigentümer das ausdrücklich freigegeben hat.\n\nDer Skill erstellt keine Rechtsgutachten. Bei einer rechtlich sensiblen Domäne\noder einem unklaren Einzelfall wird der öffentliche Skill `law-checker`\nhinzugezogen. Eine professionelle Rechtsberatung ersetzt auch dieser nicht.\n\n## Datenschutz für Prüfberichte\n\nPrüfberichte und Risikobewertungen werden nicht in das geprüfte Repository\ncommittet. Lege sie in einem vom Projekt getrennten, privaten Prüfbereich ab\noder verwende einen gitignorierten Ordner wie `<private-review-dir>`.\nÖffentlich werden nur die notwendigen Korrekturen, zum Beispiel eine\nLizenzangabe, ein Datenschutzhinweis oder eine präzisere Beschreibung.\n\n## Prüfablauf\n\n1. **Veröffentlichungsumfang festlegen**\n   - Prüfe den tatsächlich getrackten Baum mit `git ls-files`.\n   - Schließe interne Notizen, Berichte, Testdaten, lokale Konfigurationen und\n     Sperrdateien aus.\n   - Prüfe `.gitignore` und Paket-Allowlisten vor dem Commit.\n\n2. **Privacy- und Secret-Scan**\n   - Suche im Arbeitsbaum nach E-Mail-Adressen, Zugangsdaten, Tokens,\n     privaten Schlüsseln, lokalen Benutzerpfaden und personenbezogenen Daten.\n   - Prüfe zusätzlich die gesamte erreichbare Git-Historie.\n   - Klassifiziere jeden Fund als beabsichtigt, zu entfernen oder als\n     dokumentiertes Restrisiko.\n   - Bereinige problematische historische Inhalte vor einer Veröffentlichung.\n\n3. **Lizenz und Herkunft**\n   - Eine passende `LICENSE`-Datei muss vorhanden sein.\n   - Dokumentiere, ob die Lizenz Code, Prompts, Dokumentation und Medien\n     abdeckt.\n   - Inventarisiere Drittbestandteile und übernommene Inhalte mit ihrer\n     Herkunft und Lizenz.\n   - Veröffentliche fremde Bestandteile nur, wenn die Lizenz und die\n     kuratorische Veröffentlichungsentscheidung dies erlauben.\n\n4. **Zweck und sensible Domänen**\n   - Beschreibe klar, was das Projekt leistet und was nicht.\n   - Bei Recht, Gesundheit, Finanzen, Sicherheit oder personenbezogenen Daten:\n     dokumentiere Grenzen, Datenflüsse und ausgeschlossene Einsätze.\n   - Hole bei Rechtsfragen über `law-checker` eine aktuelle Ersteinschätzung\n     ein.\n\n5. **Datenschutz und Cloud-Nutzung**\n   - Minimiere verarbeitete Daten.\n   - Weise auf externe Dienste und Cloud-Verarbeitung hin.\n   - Fordere Nutzer auf, keine vertraulichen Falldaten in öffentliche Issues\n     oder Diskussionen einzustellen.\n\n6. **KI- und Produkthinweise**\n   - Dokumentiere bei KI-Bezug Zweckbestimmung, Anbieterrolle, wesentliche\n     Grenzen und relevante Transparenzhinweise.\n   - Behaupte keine Zulassung, Zertifizierung oder Prüfqualität, die nicht\n     belegt ist.\n\n7. **Name und Außendarstellung**\n   - Prüfe Slug- und Paketnamen sowie mögliche Markenüberschneidungen.\n   - Eine normale Web- oder Plattform-Suche ersetzt keine amtliche\n     Markenrecherche.\n   - README, Beschreibung und Badges müssen den tatsächlichen Funktionsumfang\n     wiedergeben.\n\n8. **Abschluss**\n   - Dokumentiere Funde, Korrekturen, offene Risiken und ein Ampelergebnis im\n     privaten Prüfbericht.\n   - Verifiziere den finalen Commit erneut.\n   - Hole die ausdrückliche Freigabe des Repository-Eigentümers ein.\n   - Erst danach darf ein separater, autorisierter Schritt die Sichtbarkeit\n     ändern.\n\n## Nachprüfung bereits öffentlicher Repositories\n\nPrüfe mindestens Privacy und Geheimnisse, Lizenzabdeckung, Drittinhalte,\nDisclaimer und Außendarstellung. Kritische Funde in der Historie werden sofort\nan den Repository-Eigentümer gemeldet und nicht stillschweigend überschrieben.\n\nEine Organisation kann eine eigene private Warteschlange und Berichtsablage\nführen. Diese gehören nicht in den öffentlichen Skill. Überfällige\nNachprüfungen können nach Risiko, Sichtbarkeit und Alter des letzten privaten\nPrüfberichts priorisiert werden.\n\n## Ergebnisformat\n\n```markdown\n# Veröffentlichungsprüfung — <Repository>\n- Stand: <Commit>\n- Modus: vor Veröffentlichung | Nachprüfung\n- Privacy/Secrets: grün | gelb | rot\n- Lizenz/Drittinhalte: grün | gelb | rot\n- Dokumentation/Außendarstellung: grün | gelb | rot\n- Korrekturen: <Liste>\n- Offene Risiken: <Liste>\n- Freigabe: ausstehend | erteilt\n```\n\n## Grenzen\n\n- Der Skill veröffentlicht nichts selbst.\n- Er ersetzt keine Rechtsberatung oder amtliche Markenrecherche.\n- Ein grüner Quellcode-Scan beweist nicht, dass frühere öffentliche Kopien,\n  Paket-Registries oder Caches bereinigt sind.\n"}, {"id": "method:dev:software-in-worten", "name": "software-in-worten", "cat": "dev", "ver": "1.0.0", "status": "stable", "desc": "Übersetzt zwischen Benutzeroberfläche und Text — in beide Richtungen. Aus einer beschriebenen Oberfläche wird ein Skill; aus einem Skill wird eine Oberfläche. Nutzen, wenn eine Anwendung entworfen wird und der Ablauf noch unklar ist, wenn ein bestehendes Werkzeug als Skill verfügbar gemacht werden soll, wenn Oberfläche und Agentenzugang auseinanderdriften, oder wenn ein Skill zu lang wird und niemand weiß warum.", "langs": ["de"], "text": "---\nname: software-in-worten\nversion: 1.0.0\ntype: method\nauthor: ellmos (aus einem Entwurfsgespräch von Lukas Geiger, 2026-08-02)\ncreated: 2026-08-02\ndescription: >\n  Übersetzt zwischen Benutzeroberfläche und Text — in beide Richtungen. Aus einer\n  beschriebenen Oberfläche wird ein Skill; aus einem Skill wird eine Oberfläche. Nutzen,\n  wenn eine Anwendung entworfen wird und der Ablauf noch unklar ist, wenn ein bestehendes\n  Werkzeug als Skill verfügbar gemacht werden soll, wenn Oberfläche und Agentenzugang\n  auseinanderdriften, oder wenn ein Skill zu lang wird und niemand weiß warum.\ncategory: dev\ntags: [design, ui, skills, methodik, uebersetzung, entwurf]\nlanguage: de\nstatus: stable\nstandalone: true\n---\n\n# Software in Worten\n\n## Der Gedanke\n\nMenschen entwerfen **visuell**: *Wie will ich das bedienen?* Agenten lesen **Text**.\nSolange beides getrennt entsteht, driftet es auseinander — die Oberfläche kann etwas, das\nder Skill nicht kennt, und umgekehrt.\n\nBeides ist aber dasselbe, nur in verschiedenen Aggregatzuständen. Es gibt eine\nÜbersetzung, und wer sie kennt, arbeitet in beide Richtungen:\n\n> **Aus Worten eine Oberfläche entwerfen. Und eine Oberfläche zurück in Worte bringen.**\n\n---\n\n## Die Übersetzungstabelle\n\n| In der Oberfläche | Was es bedeutet | In Text |\n|---|---|---|\n| **Mauszeiger** | *ich kann auswählen* — der Raum des Möglichen | die Menge der Optionen an dieser Stelle |\n| **Markieren** | *das will ich haben* | eine Auswahl, ein Wert |\n| **Klick** | *ich entscheide mich, ich will dahin* | **der Prompt** — die Antwort des Nutzers |\n| **Feld, Schalter, Einstellung** | eine Entscheidung, die bleibt | **Config** |\n| **Einstellungen der ganzen Software** | Entscheidungen, die überall gelten | **Policies** |\n| **Formular, Eingabemaske** | eine Sammlung zusammengehöriger Entscheidungen | **Template** |\n| **Knopf, der etwas startet** | *jetzt passiert etwas* | **Skill** oder **Workflow** wird ausgelöst |\n| **Was danach abläuft** | die Schrittfolge | Anweisungen im Skill — oder ein **Skript** |\n| **Fortschrittsanzeige** | *es läuft, und wie weit* | Statusmeldungen im Ablauf |\n| **Erfolgsmeldung, Ergebnisansicht** | *das kam heraus* | die Rückgabe — in der Oberfläche nur schöner gesetzt |\n| **Projekt** | ein abgegrenzter Arbeitsstand | ein **Ordner** — und weil er selbst in einem Ordner liegt, Teil der Software |\n| **Ansicht, Tab, Bereich** | ein Zustand, in dem man gerade ist | ein Schritt im Ablaufbaum |\n\n**Die zentrale Zeile ist der Klick.** Ein Klick ist nichts anderes als das, was ein Nutzer\nim Gespräch sagen würde — nur schneller. **Der Klick ist der Prompt.** Und auf einen Prompt\nfolgt eine Reaktion: eine neue Frage, eine neue Ansicht, ein neuer Zustand.\n\n---\n\n## Der Ablauf ist ein Baum\n\nJede Anwendung ist eine Folge von Entscheidungen, zwischen denen etwas passiert:\n\n```\nVoraussetzungen geklärt?   →  Referenzen · Kandidatenliste · Nummern · Reihenfolge\n        ↓\nEinverständnis des Nutzers →  START\n        ↓\nWill er mitlesen?          →  ja: Mitleseansicht öffnen\nWill er Zwischenmeldungen? →  ja: bei jedem Ereignis melden (durch, abgelehnt, Status)\n        ↓\n        [ AUSFÜHRUNG — oft ausgelagert an andere Software ]\n        ↓\nRückgabe kommt zurück      →  auswerten\n        ↓\nWas will er wissen?        →  das Ergebnis in seinen Begriffen:\n                              „bestellt bei X, 40 Minuten, 30 Euro\"\n```\n\n**Drei Teile, immer dieselben:**\n\n1. **Entscheidungen** — wenn-dann, bis alles Nötige beisammen ist\n2. **Ausführung** — häufig gar nicht im eigenen Werkzeug, sondern ausgelagert\n3. **Rückmeldung** — das Ergebnis zurück an den Menschen, in seiner Sprache\n\nDer dritte Teil wird beim Entwurf am häufigsten unterschätzt. **Kommunikation läuft über\ndie Sinne** — als Text, als Bild, als Ton. Eine Oberfläche gestaltet das aus; ein Skill\nbeschreibt, *was* gemeldet wird und *wann*.\n\n---\n\n## Die Zwischenebene: das Blueprint\n\nZwischen „beschrieben\" und „gebaut\" fehlt eine Stufe. Sie heißt **Blueprint** und ist\n**Text, dessen Anordnung dem Bild entspricht** — ein Screen, den man lesen kann:\n\n```\n Worauf hast du Hunger?   [ Burger                        ]\n Wohin liefern?           [ Dorfstraße 1, 16321 Bernau    ]\n Höchstbetrag             [ 35 ] €   ⓘ Endbetrag an der Haustür\n Modus                    (•) Lieferung  ( ) Tisch  ( ) Abholung\n\n Kandidaten (ziehen zum Umsortieren)            ↻ neu suchen\n ┌────────────────────────────────────────────────────┐\n │ ≡ 1  Burger House Dorfstadt      ★ Favorit   offen │\n │ ≡ 2  Pizzeria Roma                            offen │\n └────────────────────────────────────────────────────┘\n\n [ Trockenlauf ansehen ]   [ Wirklich anrufen → 4 Anrufe, ~0,20 € ]\n```\n\n**Warum diese Stufe so viel bringt:**\n\nEin Blueprint ist **gleichzeitig lesbar und ansehbar**. Der Mensch sieht sein Bild wieder,\nder Agent sieht Felder, Typen und Reihenfolge. Es entsteht in Minuten, kostet nichts und\nlässt sich im Gespräch korrigieren — anders als eine gebaute Oberfläche.\n\n**Und aus dem Blueprint fällt der Skill fast von selbst:**\n\n> **Was muss der Agent können, wissen und tun — in welcher Reihenfolge —\n> um dieses Blueprint auszufüllen?**\n\nJedes Feld wird eine Frage. Die Anordnung wird die Reihenfolge. Was vorbelegt ist, wird\nnicht gefragt. Was als Knopf dasteht, wird ein Schritt. Danach reichert man an, was der\nAgent zusätzlich wissen muss — Fachwissen, Grenzen, Fallstricke.\n\n**Drei Stufen also:** Beschreibung → **Blueprint** → Skill *(und von dort ebenso gut in\neine gebaute Oberfläche)*.\n\n### Ein leeres Feld ist eine Frage — und die Frage hat einen Zweck\n\n`[ 35 ] €` sieht aus wie eine Zahl. Es ist aber eine **Datenabfrage an einen Menschen**,\nund sie hat einen Grund, der meist ungesagt bleibt:\n\n> **Wir brauchen diesen Höchstbetrag, weil er die Bedingung ist, unter der überhaupt\n> bestellt wird.**\n\nDas Feld trägt also drei Dinge auf einmal: **was** hineingehört, **warum** es gebraucht\nwird, und **wo es später wirkt**. In einer Oberfläche steckt das im Layout und im\nHilfetext. Im Text muss es hingeschrieben werden — sonst geht es verloren.\n\n**Deshalb gehört unter jedes Blueprint eine Feldlegende:**\n\n| | |\n|---|---|\n| **Frage** | wie ein Mensch danach gefragt würde |\n| **Typ** | Zahl, Text, Auswahl, Liste, geordnete Liste, Datum … |\n| **Zweck** | wofür der Wert später gebraucht wird — *„Abbruchkriterium in der Kaskade\"* |\n| **Vorbedingung** | was dasein muss, damit das Feld überhaupt sinnvoll ist |\n| **Nachbedingung** | was gilt, nachdem es gefüllt ist |\n| **Wenn leer** | still akzeptieren · Vorgabe setzen · nachfragen · blockieren |\n| **Wenn falsch** | Meldung, Rückfrage, Korrekturvorschlag |\n\n**Die letzten beiden Zeilen sind die, die man am ehesten vergisst** — und die im Betrieb\nden meisten Ärger machen. *„Preis egal\"* ist eine gültige Antwort und muss als solche\nvorgesehen sein, nicht als Fehler.\n\n### Das Feld ist offen — die Frage schränkt ein\n\nEin leeres Feld ist **alles und nichts**, wie ein leeres Kontextfenster: eine Einladung,\nirgendetwas hineinzuschreiben. Aber was?\n\n**Eingeschränkt wird nicht durch das Feld, sondern durch das, was darum herum steht** —\nmeist durch den verbundenen Text davor, darüber oder daneben:\n\n> *„Wie viel soll es höchstens kosten?\"*\n\nDiese Frage schränkt **semantisch und pragmatisch** ein. Das Feld selbst lässt weiterhin\nalles zu — und wenn jemand diese Freiheit nutzt, **verliert es seinen Zweck**. Deshalb\nspringen die Feldbedingungen ein: *nur Zahlen*. Nicht, weil „fünfunddreißig\" unverständlich\nwäre, sondern weil es schwerer zu verarbeiten und länger zu schreiben ist.\n\n**Daraus folgt die Arbeitsrichtung: Aus der Frage leiten sich die Feldregeln ab, nicht\numgekehrt.** Wer zuerst den Datentyp festlegt, hat die Frage schon vergessen.\n\nUnd die Frage trägt meist auch den **Zweck** — deshalb steht bei Menschen oft ein\nInfo-Zeichen daneben:\n\n> *„Wir nehmen kein Angebot an, das über diesem Preis liegt.\"*\n\nDas ist keine Höflichkeit, sondern die eigentliche Bedeutung des Feldes: **eine Präferenz\ndes Nutzers, die später als hartes Gate wirkt.**\n\n### Die Kontrollgrenze — und warum alles mitgegeben werden muss\n\nAus einem Feld folgt eine Kette:\n\n```\nFeld „Höchstbetrag\"\n   → der Wert wird später gebraucht        (Zweck)\n   → für eine Prüfung                       (Gate)\n   → also muss der Gegenwert erhoben werden (neue Frage, an anderer Stelle)\n   → diese Frage stellt niemand von uns     (sie steht im Prompt)\n```\n\n**Und hier verläuft die entscheidende Linie: Mit dem Prompt verlässt es unsere\nKontrollebene.** Danach gibt es keinen Zugriff mehr — kein Nachfassen, kein Eingreifen,\nkeine zweite Chance.\n\nDeshalb muss **alles** mitgegeben werden, was drüben gebraucht wird:\n\n- **der Wert selbst** — 35 €\n- **die Anweisung, den Gegenwert zu erheben** — nach dem Preis fragen\n- **was gilt, wenn er höher ist** — ablehnen, bedanken, freundlich beenden\n- **was gilt, wenn keiner genannt wird** — nicht schätzen, ablehnen\n- **was gilt, wenn das Gegenüber nicht mit einer Maschine sprechen will** — um einen\n  persönlichen Rückruf bitten und die Nummer als Wert zurückgeben\n\nDer letzte Punkt zeigt die Richtung, in die man beim Entwerfen am seltensten denkt:\n**Auch der Ausnahmefall muss einen Wert zurückliefern**, sonst kommt beim Menschen nichts\nan außer „hat nicht geklappt\".\n\n### Der Prompt ist ein erzeugter Skill\n\nDamit ist klar, was ein Prompt eigentlich ist:\n\n> **Ein Prompt ist ein Skill, den die Oberfläche gerade erst zusammengebaut hat** — aus\n> den Entscheidungen, Klicks und Werten dieses einen Laufs. Personalisiert, auf den Zweck\n> zugeschnitten, und gezwungen, alles Gewollte **in Sprache** auszudrücken.\n\nEin fest geschriebener Skill sagt, wie man es *immer* macht. Ein Prompt sagt, wie es\n*diesmal* laufen soll. Beide sind dieselbe Form — der eine bleibt, der andere entsteht im\nMoment und ist danach weg.\n\n**Praktisch heißt das:** Wer den Prompt-Aufbau als Textbaustein-Bastelei behandelt, baut\nschlechte Prompts. Wer ihn als *Skill-Erzeugung* behandelt — mit Zweck, Regeln, Grenzen,\nAusnahmen und Rückgabewerten —, baut gute.\n\n### Warten ist kein Nichtstun, sondern Nichtwissen\n\nNach dem Absenden hat der Mensch die Kontrolle abgegeben. Was er jetzt braucht, ist nicht\nGeduld, sondern **Information**: *Was passiert gerade? Wo stehen wir?*\n\nDer Agent bekommt das ohnehin — er fragt den Fortschritt ab. **Der Mensch sieht davon\nnichts, solange es niemand übersetzt.** Genau dafür gibt es Fortschrittsbalken,\nmitlaufende Protokolle und Statuszeilen: Sie sind keine Verzierung, sondern die\nÜbersetzung eines Datenstroms in etwas, das ein Wartender aushält.\n\n### Die Rückmeldung ist ein Rück-Prompt\n\nDie Erfolgsmeldung ist kein Abschluss, sondern eine **Übergabe zurück**:\n\n> *„Das ist das Ergebnis deines Auftrags.\"*\n\nErst damit kann der Mensch bewerten und weiterhandeln. Und genau deshalb muss sie\nvollständig sein: *„Bestellt — aber drei Pizzen statt einer. Gut, dass die Rückrufnummer\ndasteht, ich rufe selbst an.\"*\n\n**Ohne brauchbare Rückgabe kann niemand weiterverarbeiten.** Eine Meldung, die nur „hat\ngeklappt\" sagt, hat den Kreis nicht geschlossen.\n\n### Fragen- und Feldanalyse\n\nFür **jedes** Element eines Blueprints — Feld, Knopf, Auswahl, Anzeige — dieselben Fragen:\n\n| | |\n|---|---|\n| **Was ist gewollt, und wozu?** | die Absicht hinter dem Element |\n| **Was passiert beim Absenden?** | sofort verarbeitet, oder erst gespeichert? |\n| **Wo und wann wird der Wert wieder gebraucht?** | die Stelle, an der er wirkt |\n| **Wie lange muss er vorgehalten werden?** | über den Klick hinaus? über den Lauf hinaus? |\n| **Was muss damit geschehen?** | prüfen, mitgeben, anzeigen, verwerfen |\n\nDer Höchstbetrag zum Beispiel wird **nicht sofort** gebraucht. Er wird gespeichert,\nmitgeschleppt und wirkt erst im Gespräch — also braucht es einen Ort, an dem er liegt,\nund eine Stelle, an der er in den Prompt wandert.\n\n### Weichen bestimmen den Frage-Algorithmus\n\nEine Auswahl ist selten nur ein Wert. Oft ist sie eine **Weiche**, die den ganzen weiteren\nAblauf umstellt:\n\n| Modus | Erste Frage im Gespräch | Was entfällt | Was hinzukommt |\n|---|---|---|---|\n| **Lieferung** | *„Liefern Sie hierhin?\"* — Nein beendet den Anruf sofort | — | Lieferadresse |\n| **Abholung** | entfällt | die Lieferfrage | Abholzeit |\n| **Tisch** | *„Haben Sie offen, und ist um X ein Tisch frei?\"* | die ganze Preisprüfung | Personenzahl, Kinder, Sitzwunsch, Zeitraum |\n\n**Die Reihenfolge im Gespräch folgt der Ausschlusskraft, nicht der Neugier.** Wer nicht\nliefert, muss nicht nach dem Essen gefragt werden — die härteste Bedingung kommt zuerst,\nweil sie am schnellsten zum nächsten Kandidaten führt.\n\nUnd: **Vieles bleibt über die Weichen hinweg gleich.** Der Höchstbetrag gilt bei Lieferung\nwie Abholung, die Kandidatenliste ebenso. Nur der Fragealgorithmus wechselt.\n\n### Der Kreis\n\n```\nProblem  →  Use Case  →  Wille        „Ich bin auf dem Land und habe Hunger\"\n   ↓\nwas ich will, wird zu Bedingungen     5 Personen · 19 Uhr · Italiener · nicht der eine\n   ↓\nBedingungen brauchen Daten            → daraus ergeben sich die FELDER\n   ↓\nFelder + Entscheidungen               → daraus wird der PROMPT (der erzeugte Skill)\n   ↓\n                [ Ausführung jenseits der Kontrollgrenze ]\n   ↓\nRückgabe empfangen und speichern      → nur, was vorher mitgegeben wurde, kommt zurück\n   ↓\nübersetzen in Sicht- und Hörbares     → MELDUNG an den Menschen\n   ↓\ner bewertet und entscheidet neu       → zurück nach oben\n```\n\n**Der Use Case begründet die Daten, die Daten begründen die Felder.** Wer bei den Feldern\nanfängt, erfindet Formulare. Wer beim Willen anfängt, bekommt sie geschenkt.\n\n### Zwischen zwei Blueprints steht die Kausalität\n\nEin Blueprint ist eine **statische Anordnung**. Mehrere hintereinander ergeben noch keinen\nAblauf — dazwischen passiert etwas, und **dieses Dazwischen ist die eigentliche Logik**:\nWas geschieht, wenn hier geklickt wird? Welche Prüfung läuft? Was wird gespeichert?\nWas wird ausgelöst?\n\nDrei Wege, diese Zeitebene sichtbar zu machen:\n\n1. **Beschriftung im Bild** — Pfeile und kurze Notizen zwischen den Blueprints\n2. **Vorher/Nachher-Paare** — derselbe Ausschnitt in zwei Zuständen, „vor dem Klick\" und\n   „nach dem Klick\"\n3. **Verschriftlichung** — Vor- und Nachbedingungen als Text unter dem Bild\n\nDer dritte Weg trägt am weitesten, weil er ausführbar ist. Die ersten beiden helfen dem\nMenschen beim Verstehen.\n\n### Aus den Feldern ergibt sich das Datenmodell\n\nWer ein Feld „Kontakt hinzufügen\" beschreibt, hat damit schon entschieden, dass es\nAdressaten gibt, dass sie gespeichert werden und welche Angaben dazugehören. **Die\nDatentabelle richtet sich nach den Feldern, nicht umgekehrt.**\n\nDeshalb lohnt es sich, die Feldlegende vollständig zu machen, bevor irgendein Schema\nentworfen wird: Jedes Feld mit Typ und Zweck ist eine Spalte, jede wiederholbare Gruppe\neine Tabelle, jede Beziehung zwischen Feldern ein Verweis.\n\n## Richtung 1: Aus Worten eine Oberfläche\n\n**Wenn zuerst der Ablauf beschrieben wurde.**\n\n1. **Entscheidungen sammeln.** Jede Stelle, an der etwas festgelegt wird. Dabei sortieren:\n   - **Pflicht** — ohne das geht es nicht weiter → **Muss-Feld**\n   - **Ableitbar** — kann aus Kontext oder Bestand kommen → **vorbelegtes Feld** mit\n     Korrekturmöglichkeit\n   - **Optional** — verbessert das Ergebnis → **zugeklappter Bereich**\n   - **Gate** — unumkehrbar, kostet Geld, erreicht Menschen → **Bestätigungsschritt**\n2. **Zusammengehöriges bündeln** → eine Maske, ein Template.\n3. **Den Baum in Ansichten schneiden.** Ein Zustand = eine Ansicht.\n4. **Rückmeldungen entwerfen.** Was wird wann gemeldet? Fortschritt, Zwischenstand,\n   Ergebnis.\n5. **Was durchgehend gilt, einmal festlegen** — Farbe, Typografie, Schnitt, Bewegung.\n   Das sind Policies für die Oberfläche.\n\n**Der Gewinn:** Ein Formular, das aus einem Gesprächsablauf entsteht, ist fast immer\nschlanker als eines vom Reißbrett. Man merkt beim Formulieren, welche Frage überflüssig ist.\n\n## Richtung 2: Aus einer Oberfläche Worte\n\n**Wenn die Anwendung schon existiert oder beschrieben ist.**\n\n1. **Jeden Klick als Frage formulieren.** Was fragt dieser Knopf den Nutzer eigentlich?\n2. **Jedes Feld als Config-Eintrag** — mit Vorgabewert, Typ und Hilfetext.\n3. **Jede Ansicht als Schritt** im Ablauf.\n4. **Jede Meldung als Rückgabe** — was wird berichtet, in welchen Worten?\n5. **Prüfen, was die Oberfläche implizit weiß** — Reihenfolgen, Sperren, Abhängigkeiten,\n   die nirgends stehen, sondern nur im Layout stecken. **Das ist der Teil, der beim\n   Übersetzen am leichtesten verlorengeht.**\n\n### Warum diese Richtung schwerer ist — und wie man sie trotzdem geht\n\nRichtung 1 fällt leicht, Richtung 2 fühlt sich zäh an. Das hat einen Grund:\n\n> **Ein Skill ist Zeit. Ein Screen ist Fläche.**\n> Erst dies, dann jenes — gegen alles gleichzeitig sichtbar.\n\nMan übersetzt also nicht Zeile für Zeile, sondern **schneidet einen Ablauf in Flächen**.\nDie Schnittkante ist immer dieselbe:\n\n**Ein Screen entsteht dort, wo der Ablauf auf einen Menschen wartet.**\n\nAlles zwischen zwei Wartepunkten läuft von selbst — das wird **kein** Screen, sondern\nhöchstens eine Fortschrittsanzeige. Wer für jeden Schritt eine Ansicht baut, baut ein\nKlickgefängnis.\n\n**Und die wenn-dann-Ketten?** Sie werden nicht alle sichtbar. Vier Fälle:\n\n| Art der Bedingung | Was daraus wird |\n|---|---|\n| **Der Mensch legt sie fest** („höchstens 35 €\") | ein **Feld** — vor dem Start |\n| **Das System prüft sie** („Preis über Limit\") | ein **Ergebnis** — danach, mit Begründung |\n| **Sie ändert, was der Mensch sieht** („kein Treffer\") | ein **Zustand** desselben Screens, kein neuer |\n| **Sie ist reine Mechanik** (Wiederholungen, Zeitüberschreitungen, Formatprüfung) | **gar nichts** — sie bleibt unsichtbar |\n\n**Der vierte Fall ist der häufigste.** Die meisten Verzweigungen eines Skripts gehören nie\nauf einen Bildschirm. Wer sie trotzdem zeigt, verwechselt Ablaufdiagramm mit Oberfläche.\n\n**Praktisch in vier Schritten:**\n\n1. **Wartepunkte markieren** — jede Stelle, an der ein Mensch entscheidet, bestätigt oder\n   etwas eingibt. Das sind die Screens, und es sind meist überraschend wenige.\n2. **Rückwärts einsammeln** — was muss vor diesem Wartepunkt bekannt sein? Diese Werte\n   sind die Felder des Screens.\n3. **Vorwärts einsammeln** — was passiert danach, und was davon muss der Mensch erfahren?\n   Das ist die Rückmeldung.\n4. **Den Rest weglassen** — alles, was weder Eingabe noch Meldung ist, bleibt unsichtbar.\n\n---\n\n## Der Gradient: Skill ↔ Skript\n\n```\nweit von der Software                                    nah an der Software\n   Skill trägt alles                                    Skript trägt alles\n        │                                                       │\n   ausführlicher Text          ────────────►         knappe Bedienungsanleitung\n   jeder Schritt erklärt                             „ruf dies auf, dann jenes\"\n   funktioniert ohne Werkzeug                        funktioniert nur mit Werkzeug\n```\n\n**Je mehr ein Vorgang automatisiert ist, desto weniger muss der Skill erklären.**\nEr wird kürzer und konkreter — irgendwann ist er kaum mehr als eine Bedienung für die\nSkripte: *wann nimmt man dieses Werkzeug, was gibt man hinein, woran erkennt man, dass es\ngeklappt hat.*\n\nZwei Umkehrschlüsse, die im Alltag helfen:\n\n- **Wird ein Skill zu lang, fehlt ein Skript.** Länge ist ein Signal: Was sich wiederholt\n  und mechanisch ist, gehört automatisiert.\n- **Wird ein Skript unverständlich, fehlt ein Skill.** Ein Werkzeug ohne Text darüber ist\n  nur für den benutzbar, der es gebaut hat.\n\n---\n\n## Die gemeinsame Währung\n\n**Jede Einstellung existiert dreifach** — als Config-Wert, als Frage im Skill, als Feld in\nder Oberfläche. Damit sie nicht auseinanderlaufen, wird die Darstellung **einmal**\nbeschrieben und von allen dreien gelesen:\n\n```yaml\nfield: sample.method\nlabel: \"Ziehungsverfahren\"                       # Oberfläche\nquestion: \"Wie soll gezogen werden — zufällig, geschichtet oder alle?\"   # Skill\ntype: choice\noptions: [random, stratified, census]\ndefault: random\nhelp: \"Geschichtet nur, wenn die Merkmale in der Grundlage stehen.\"\nlocked: false        # true = nicht abschaltbar, erscheint in keiner Oberfläche\n```\n\n**Was `locked` ist, taucht nirgends als Option auf.** Manche Dinge sind keine Einstellung,\nsondern Teil des Gerüsts.\n\n---\n\n## Wann dieser Skill hilft\n\n- Eine Anwendung wird entworfen und der Ablauf ist noch unklar → **Richtung 1**\n- Ein bestehendes Werkzeug soll für Agenten nutzbar werden → **Richtung 2**\n- Oberfläche und Agentenzugang driften auseinander → **gemeinsame Währung** einführen\n- Ein Skill wird zu lang und niemand weiß warum → **Gradient** prüfen\n- Ein Entwurfsgespräch soll festgehalten werden, bevor es verfliegt → Tabelle + Baum\n\n## Verwandtes\n\n`condition` übersetzt Bedingungen, Zeitpunkte und Reihenfolgen in prüfbare Gates\n(`/if`, `/when`, `/after`, `/and`, `/or`) — dieselbe Bewegung für den Sonderfall Ablaufsteuerung.\n`skill-extractor` gewinnt Skills aus Gesprächsverläufen. `plugin-system` macht eigene\nSkripte auffindbar.\n"}, {"id": "skill:dev:trampelpfadanalyse", "name": "trampelpfadanalyse", "cat": "dev", "ver": "0.1.0", "status": "active", "desc": "Error analysis for pipeline and control-file workflows: check whether a convention or procedure is actually visible and discoverable to an LLM. Empirical baseline → intervention → retest comparison using naive subagents (isolated sandbox copies, identical test case, quantitative success measurement). Use this skill when agents repeatedly ignore a rule/README/convention or navigate incorrectly, and you want to measure whether a documentation change actually changes the behavior. Triggers on \"is the convention even seen\", \"why does no agent follow the rule\", \"make a doc signpost measurably effective\", \"desire-path analysis\", \"trampelpfadanalyse\".", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: trampelpfadanalyse\nversion: 0.1.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-06-21\nupdated: 2026-06-21\ndescription: Error analysis for pipeline and control-file workflows: check whether a convention or procedure is actually visible and discoverable to an LLM. Empirical baseline → intervention → retest comparison using naive subagents (isolated sandbox copies, identical test case, quantitative success measurement). Use this skill when agents repeatedly ignore a rule/README/convention or navigate incorrectly, and you want to measure whether a documentation change actually changes the behavior. Triggers on \"is the convention even seen\", \"why does no agent follow the rule\", \"make a doc signpost measurably effective\", \"desire-path analysis\", \"trampelpfadanalyse\".\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: dev\ntags: [workflow, error-analysis, llm-ux, doc-audit, baseline-retest, naive-subagent, empirical, pipeline, control-file]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/workflows/system/trampelpfadanalyse.md', 'origin_version': '2.0', 'origin_repo': 'github.com/ellmos-ai/swarm-ai', 'last_sync_from_origin': '2026-06-21', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"trampelpfadanalyse banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Desire-Path Analysis — Making Conventions Empirically Visible to LLMs (Deutsch)\n\nA method for uncovering errors in pipeline and control-file workflows that do not come\nfrom broken code, but from a **convention being invisible to an LLM**. Instead of\nguessing whether a README or rule is \"clear enough\", you measure it empirically: naive\nsubagents with no prior knowledge are turned loose on the workflow, their behavior\nbecomes the **baseline**, a targeted documentation change (a \"signpost\") is the\n**intervention**, and fresh naive subagents provide the **retest**. The diff against the\nbaseline is the success measurement.\n\nThe name comes from the *desire path* (German: *Trampelpfad*): where people actually walk\ninstead of on the paved route is where a path belongs. By analogy, the paths of naive\nLLMs show where documentation/guardrails are actually needed — not where we assume them.\n\n## When to use this skill\n\n- Agents repeatedly ignore a rule/convention even though it is documented.\n- You want to know whether a procedure is **visible/discoverable** to an LLM before\n  writing more docs (\"is anyone here talking to a wall?\").\n- After a restructuring (new directories, renames): can agents still find the entry points?\n- You made a documentation change and want to **prove** it works — not just hope so.\n- Onboarding test before integrating new LLM partners into a pipeline.\n\nNot for: pure code bugs (→ systematic debugging), or selecting swarm coordination patterns\nfor a production task (→ see `swarm-operations`). This skill uses a swarm of naive agents\nexclusively as a **measuring instrument**.\n\n## Core idea in one sentence\n\nTreat documentation like UX: what counts is not what you wrote, but what an unbiased user\n(here: a naive agent) actually does with it — and you measure that, change it, and measure\nagain.\n\n---\n\n## The process: 5 steps\n\n```\n1. BASELINE       naive subagents → measure current behavior (quantitative)\n2. PATH ANALYSIS  where exactly does it fail? which doc location misleads?\n3. INTERVENTION   put up a \"signpost\" (README/convention made more prominent)\n4. RETEST         FRESH naive subagents, identical test case\n5. DIFF           retest vs. baseline → success measurement + honest assessment\n```\n\n### Step 1 — Baseline: measure current behavior naively\n\nFirst phrase the problem as a **testable question**, e.g. \"Does an agent create a log at\nthe convention-mandated location?\" or \"Does an agent find the pipeline's entry point?\".\n\nThen turn naive subagents loose:\n\n- **Naive means:** no project memory, no skills, no prior hints — the agent only knows the\n  entry path and the task. This measures **pure discoverability via the existing docs**,\n  not the agent's prior knowledge.\n- **Isolated sandbox copies:** each probe agent works on its own copy of the affected\n  folder/workflow, so probes do not influence each other and the real state stays untouched.\n- **Same test case, multiple repetitions:** variability is real. One probe is an anecdote;\n  n repetitions (e.g. 3, or more if needed) yield a rate.\n- **A cheap, \"naive\" model** is sufficient and realistic — it should not guess cleverly,\n  but show where the docs lead an average agent.\n\nMinimal probe prompt (adjust placeholders):\n\n```\nYou are exploring <SYSTEM>. It is located at: <PATH>.\nTASK: <specific task>.\nRULES:\n1. You only know the path above, nothing else.\n2. Explore to complete the task. Max. <N> steps.\n3. Report at the end: VISITED_DIRECTORIES, READ_FILES,\n   TASK_COMPLETED (yes/no), MOST_HELPFUL_FILE.\n```\n\n**Record as baseline metrics** (always quantitative, never \"feels better\"):\n\n| Metric | Meaning |\n|---|---|\n| Success rate | how often the task was completed per convention (e.g. 0/3) |\n| Wrong behavior | how often the wrong location/method (e.g. 3/3 collective log instead of per-entry) |\n| Paths to goal | how many steps/detours to reach the goal |\n| Blind spots | which relevant file/location nobody opens |\n\n### Step 2 — Path analysis: where does it really fail?\n\nEvaluate the probe reports together (a \"heatmap\" of visited locations is enough):\n\n- Which file is read **often** (HOT)? If orientation is missing there, that is the most\n  effective place for a signpost.\n- Which relevant location is **never** opened (COLD / blind spot)? It is effectively\n  invisible — no matter how good its content is.\n- Where does an agent loop or bypass the convention (dead end, circumvention)? That marks\n  the concrete documentation gap.\n\nFindings table:\n\n| Finding | Meaning | Action (→ Step 3) |\n|---|---|---|\n| HOT + no orientation | high traffic, no signpost | place the signpost right there |\n| WARM + errors | agents arrive, stumble | add example/clarification |\n| COLD | location is never found | link to it from a HOT file |\n| Circumvention | convention is bypassed | hint at the point of circumvention |\n\nOutcome of Step 2: **one concrete, localized hypothesis** — \"Agents read X, but X does not\nmention the convention; that is why they end up at Y.\"\n\n### Step 3 — Intervention: put up a signpost\n\nPut up **exactly one** signpost (one variable per pass, otherwise the diff is not\ninterpretable). Typical signposts:\n\n- Place the convention **prominently where the HOT path already passes** (e.g. a short,\n  explicit hint at the very top of the most-read README/control file).\n- A **quick-navigation table** at the start of the central architecture/overview file that\n  points to former blind spots.\n- A **signpost/cross-reference** from a HOT file to a COLD location.\n- Optionally a **guardrail** (e.g. a PreToolUse hint) for dangerous or convention-violating\n  actions.\n\nKeep the signpost short and unmissable — agents skim, they rarely read at length.\n\n### Step 4 — Retest with FRESH naive subagents\n\nRepeat Step 1 **identically** — same task, same number of repetitions, same model, same\nnaive condition — but on sandbox copies **with** the new signpost. Important:\n\n- **Fresh** agents with no memory of the baseline run (otherwise you measure learning, not\n  discoverability).\n- **Only the signpost** differs from the baseline setup.\n\n### Step 5 — Diff against baseline + honest success measurement\n\nPut retest and baseline directly side by side:\n\n| Metric | Baseline | After signpost | Δ |\n|---|---|---|---|\n| Success rate | e.g. 0/3 | e.g. 3/3 | +3 |\n| Wrong behavior | e.g. 3/3 | e.g. 0/3 | −3 |\n| Blind spots | e.g. 1 | e.g. 0 | −1 |\n\nAssessment — and do not sugarcoat here:\n\n- **Works** (wrong behavior measurably drops): keep the signpost, document it.\n- **Does not work** (little Δ): the signpost was in the wrong place or too subtle → back to\n  Step 2/3, different signpost, measure again.\n- **State limits openly:** small n are indicators, not proofs; a naive agent models \"average\n  uninformed\", not every real user; explicitly check for false positives/negatives in the\n  success scoring (what exactly counted as \"completed\"?).\n\n---\n\n## Mini case study (real, with actual numbers)\n\nProblem: A ticket pipeline mandated that trivial completions each get **one** dedicated\nper-ticket log — but agents instead put everything into **one collective log**.\n\n- **Step 1 (baseline):** 3 naive subagents, same task → **3/3 used the collective log**\n  (convention not followed).\n- **Step 2 (path analysis):** the most-read README did not mention the per-ticket rule at a\n  visible spot → the naive path led to the collective log.\n- **Step 3 (intervention):** a short, explicit \"signpost\" about the logging convention\n  placed prominently in the README.\n- **Step 4 (retest):** 3 fresh naive subagents, identical task.\n- **Step 5 (diff):** **3/3 wrong → 0/3 wrong**, all three created a correct per-ticket log.\n  (Documented in ticket T-20260621-44.)\n\nLesson: The convention was not \"worded too weakly\" — it was **invisible** on the path that\nwas actually read. The signpost in the right place, empirically verified, solved the problem.\n\n---\n\n## Source and related methods\n\nThis method comes from Desire-Path Analysis v2.0 (swarm as an empirical measuring instrument\nfor LLM behavior). The original reference results of a large run (100 naive probes) are\ndocumented as evidence from the source: the biggest blind spot was a help directory that\n**0/100** agents visited (despite many help files), and the task \"create a new skill\"\nsucceeded **0%** because nobody found the templates directory — both classic visibility, not\ncontent, problems.\n\n## See also\n\n- `swarm-operations` (dev) — catalog of swarm **coordination patterns** for production\n  tasks; it carries desire-path analysis only as a conceptual section. This skill is the\n  applicable **process** variant with a baseline→retest loop.\n- `pipeline-optimizer` (dev) — 6-step pipeline renovation; its retest with fresh subagents\n  corresponds to Steps 4–5 here.\n- `bugfix-protocol` / systematic debugging — for real code bugs rather than visibility\n  problems.\n\n## Änderungsprotokoll\n\n### 0.1.0 (2026-06-21)\n- Initial port from Desire-Path Analysis v2.0 (source: swarm-ai/BACH).\n- Focused on the applicable 5-step process (baseline → path analysis → intervention →\n  retest → diff); swarm coordination patterns deliberately omitted (they stay in\n  `swarm-operations`). User-neutral with placeholders; real mini case study."}, {"id": "skill:education:academic-study-control", "name": "academic-study-control", "cat": "education", "ver": "1.0.0", "status": "active", "desc": "Akademisches Studien- und Fristenmanagement mit Quellenprüfung, Datenschutz und realistischer Handlungsplanung.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: academic-study-control\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-07-30\ndescription: >\n  Akademisches Studien- und Fristenmanagement mit Quellenprüfung, Datenschutz\n  und realistischer Handlungsplanung.\nstandalone: true\nanthropic_compatible: true\ncategory: education\ntags: [academic, study-management, deadlines, organization, university]\naliases: [academic-study-control, academic-study-control-de]\nlanguage: de\nstatus: active\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"academic-study-control banner\">\n\n# Akademisches Studien- und Fristenmanagement (Deutsch)\n\nDieser Skill bietet eine systematische Unterstützung für die Studienorganisation, Fristenüberwachung und Prüfungsplanung.\n\n## 1. Übersicht und Ziele\n\n- **Fristen- und Prüfungssteuerung:** Erstellung verbindlicher Studien- und Prüfungspläne.\n- **Quellen- und Regelkonformität:** Abgleich mit offiziellen Prüfungsordnungen und Modulhandbüchern.\n- **Datenschutz & Anonymisierung:** Trennung von personenbezogenen Daten und fachlichen Inhalten.\n\n## 2. Arbeitsablauf und Schritte\n\n1. **Zielklärung:** Identifikation von Prüfungs- oder Abgabefristen.\n2. **Bestandsaufnahme:** Abgleich mit Prüfungsordnung, LMS und bisherigen Ergebnissen.\n3. **Recherche:** Einholen aktueller Fristen von offiziellen Hochschulseiten.\n4. **Planerstellung:** Rückwärtsplanung von Abgabeterminen mit realistischen Pufferzeiten.\n5. **Ergebnisdokumentation:** Ausgabe einer kompakten Übersichtstabelle.\n\n## 3. Grenzen und Regeln\n\n- **Offizielle Quellen vorrangig:** Bei Widersprüchen gilt stets die offizielle Prüfungsordnung.\n- **Keine Zugangsdatenspeicherung:** Anmeldedaten für Portale werden nicht gespeichert.\n- **Pufferzeiten einplanen:** Jeder Plan muss unvorhergesehene Verzögerungen berücksichtigen.\n"}, {"id": "skill:education:academic-study-learn", "name": "academic-study-learn", "cat": "education", "ver": "1.0.0", "status": "active", "desc": "Aktives Lernen, Erarbeitung von Fachinhalten und strukturierte Erstellung von Synthesen.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: academic-study-learn\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-07-30\ndescription: >\n  Aktives Lernen, Erarbeitung von Fachinhalten und strukturierte Erstellung von Synthesen.\nstandalone: true\nanthropic_compatible: true\ncategory: education\ntags: [academic, active-learning, study-techniques, note-taking]\naliases: [academic-study-learn, academic-study-learn-de]\nlanguage: de\nstatus: active\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"academic-study-learn banner\">\n\n# Aktives Lernen und Wissensaufbereitung (Deutsch)\n\nDieser Skill bietet Methoden zur aktiven Erarbeitung komplexer wissenschaftlicher Inhalte.\n\n## 1. Übersicht und Ziele\n\n- **Aktives Erinnern & Abruf:** Festigung von Fachwissen im Langzeitgedächtnis.\n- **Feynman-Methode:** Einfache Erklärung abstrakter Konzepte zur Erkennung von Verständnislücken.\n- **Strukturierte Notizen:** Erstellung von Zusammenfassungen und Begriffskarten.\n\n## 2. Arbeitsablauf und Schritte\n\n1. **Sichtung des Quellmaterials:** Identifikation der zentralen Thesen und Begriffe.\n2. **Freie Rekonstruktion:** Formulierung der Inhalte aus dem Gedächtnis.\n3. **Abgleich & Lückenanalyse:** Identifikation unklarer Stellen im Quelltext.\n4. **Synthese:** Erstellung einer prägnanten Notiz oder Wissenskarte.\n\n## 3. Grenzen und Regeln\n\n- **Verständnis vor Auswendiglernen:** Die logische Struktur steht an erster Stelle.\n- **Geprüfte Quellengrundlage:** Nur wissenschaftlich fundierte Materialien verwenden.\n"}, {"id": "skill:education:academic-study-test", "name": "academic-study-test", "cat": "education", "ver": "1.0.0", "status": "active", "desc": "Prüfungsvorbereitung, Selbsttests, Probeklausuren und systematische Fehleranalyse.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: academic-study-test\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-07-30\ndescription: >\n  Prüfungsvorbereitung, Selbsttests, Probeklausuren und systematische Fehleranalyse.\nstandalone: true\nanthropic_compatible: true\ncategory: education\ntags: [academic, test-preparation, mock-exams, self-testing]\naliases: [academic-study-test, academic-study-test-de]\nlanguage: de\nstatus: active\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"academic-study-test banner\">\n\n# Prüfungsvorbereitung und Selbsttests (Deutsch)\n\nDieser Skill ermöglicht die Erstellung realistischer Übungsaufgaben und die Durchführung objektiver Leistungskontrollen.\n\n## 1. Übersicht und Ziele\n\n- **Simulierte Prüfungen:** Erstellung von Aufgaben im Zielformat der Prüfung.\n- **Fehleranalyse:** Systematische Kategorisierung von Verständnis- und Leichtsinnsfehlern.\n- **Zeitmanagement:** Training unter realen Zeitbedingungen.\n\n## 2. Arbeitsablauf und Schritte\n\n1. **Aufgabenstellung:** Entwurf von Fragen basierend auf dem Anforderungsprofil.\n2. **Klausursimulation:** Bearbeitung ohne Zuhilfenahme von Unterlagen.\n3. **Auswertung:** Objektive Bewertung nach Musterlösung und Bewertungsschema.\n4. **Gezielte Nacharbeit:** Schwerpunkmäßige Aufarbeitung mangelhafter Bereiche.\n\n## 3. Grenzen und Regeln\n\n- **Strenge Korrektur:** Keine Punkte für unvollständige oder vage Antworten.\n- **Fehler als Lernchance:** Nutzung der Diagnose zur gezielten Schließung von Wissenslücken.\n"}, {"id": "skill:education:foerderplaner", "name": "foerderplaner", "cat": "education", "ver": "2.0.0", "status": "stable", "desc": "Plant Unterricht, Lernangebote und individuelle Förderung ohne Berichtsgenerator oder persönliche Vorlagen.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: foerderplaner\nversion: 2.0.0\ntype: skill\nauthor: ellmos contributors\ncreated: 2026-07-30\nupdated: 2026-07-30\ndescription: >\n  Plant Unterricht, Lernangebote und individuelle Förderung ohne Berichtsgenerator oder persönliche Vorlagen.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: education\ntags: [education, support, lesson-planning, differentiation]\nlanguage: de\nstatus: stable\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\nprovenance:\n  origin: public-neutral\n  origin_license: MIT\n  notes: Public core only; adapters and private profiles are excluded.\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"foerderplaner banner\">\n\n# Unterrichts- und Förderplaner\n\n## Zweck\n\nAus Ausgangslage und Lernziel konkrete, überprüfbare Förder- und Unterrichtsschritte entwickeln.\n\n**Ergebnis:** Ziele, Maßnahmen, Differenzierung, Beobachtungskriterien und Überprüfungstermine.\n\n## Arbeitsablauf\n\n1. Ziel, Kontext und gewünschtes Ausgabeformat klären.\n2. Nur die im aktuellen Auftrag bereitgestellten Informationen verwenden.\n3. Das Ergebnis strukturiert und nachvollziehbar erstellen.\n4. Annahmen kennzeichnen und vor externen Änderungen eine Bestätigung einholen.\n\n## Beispiel\n\n**Eingabe:** Plane eine vierwöchige Förderung zum sinnentnehmenden Lesen für eine anonymisierte Lerngruppe.\n\n**Ergebnis:** Ziele, Maßnahmen, Differenzierung, Beobachtungskriterien und Überprüfungstermine.\n\n## Öffentlicher Kern und private Erweiterungen\n\nDieser öffentliche Skill enthält ausschließlich die übertragbare Methode. App-spezifische Adapter, Konten, lokale Pfade, Datenbanken und persönliche Voreinstellungen gehören in ein privates Zusatzprofil oder einen privaten Fork und dürfen nicht in dieses Repository übernommen werden.\n\nOhne privates Profil arbeitet der Skill nur mit Informationen, die im aktuellen Auftrag ausdrücklich bereitgestellt wurden.\n\n## Grenzen und Datenschutz\n\n- Daten werden nicht standardmäßig gespeichert.\n- Keine Quelle, Datei oder Schnittstelle wird ohne ausdrückliche Freigabe geöffnet oder verändert.\n- Der Skill erstellt keine Förderberichte, Zeugnisse oder amtlichen Bewertungen. Für allgemeine Berichtserstellung kann separat `report-forge` verwendet werden; persönliche Berichtsvorlagen bleiben privat.\n\n## Änderungsprotokoll\n\n### 2.0.0 (2026-07-30)\n\n- Nutzerneutraler öffentlicher Kern; private Integrationen und persönliche Profile entfernt.\n"}, {"id": "skill:education:worksheet-generator", "name": "worksheet-generator", "cat": "education", "ver": "0.1.0", "status": "active", "desc": "Erstellung von Arbeitsblättern und Übungsmaterialien für Unterricht und Förderung.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: worksheet-generator\nversion: 0.1.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-07-23\nupdated: 2026-07-30\ndescription: >\n  Erstellung von Arbeitsblättern und Übungsmaterialien für Unterricht und Förderung.\nstandalone: true\nanthropic_compatible: true\ncategory: education\ntags: [worksheets, icf, education, therapy-support, wrapper]\naliases: [worksheet-generator, worksheet-generator-de]\nlanguage: de\nstatus: active\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"worksheet-generator banner\">\n\n# Arbeitsblatt- und Übungsmaterial-Generator (Deutsch)\n\nDieser Skill ermöglicht die automatische Erstellung differenzierter Arbeitsblätter und Lernmaterialien.\n\n## 1. Übersicht und Ziele\n\n- **Bedürfnisgerechte Aufgaben:** Erstellung von Aufgaben nach Altersstufe und Leistungsniveau.\n- **Didaktischer Aufbau:** Aufbereitung mit klaren Arbeitsanweisungen und Lösungsblättern.\n- **Strukturierte Formate:** Ausgabe in Markdown, HTML oder DOCX.\n\n## 2. Arbeitsablauf und Schritte\n\n1. **Themen- und Zieldefinition:** Vorgabe des Lernziels ohne Klientendaten.\n2. **Niveauanpassung:** Festlegung von Schwierigkeitsgrad und Altersgruppe.\n3. **Entwurfserstellung:** Generierung der Aufgabenstruktur.\n4. **Prüfung:** Didaktische Kontrolle vor der Vervielfältigung.\n\n## 3. Grenzen und Regeln\n\n- **Anonymisierte Vorgaben:** Keine Nutzung von Schülernamen.\n- **Entwurfscharakter:** Alle Arbeitsblätter müssen vor der Ausgabe durch die Lehrkraft geprüft werden.\n"}, {"id": "skill:game-dev:game-design", "name": "game-design", "cat": "game-dev", "ver": "1.0.0", "status": "active", "desc": "How game development works as a process — roles, subtasks, workflows and role descriptions, especially (but not only) for Roblox. Use this skill when it's about the ORGANIZATION of game dev rather than concrete code: Which roles exist (Creative Director, Engineer, Artist, Polish/Audio, Business, QA-Tester, Game Critic)? Who does which subtask? What does a development chain (concept → backend → frontend → polish → test) look like? How do you write a Game Design Document / KONZEPT.md? How do several (AI) agents divide up a game? Also trigger on \"plan a new game\", \"create Game Design Document\", \"which roles do I need for my game\", \"development workflow for a game\", \"who tests the game\", \"structure a game idea\", \"Roblox genre/monetization\".", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: game-design\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger + Claude\ncreated: 2026-06-17\nupdated: 2026-06-17\ndescription: How game development works as a process — roles, subtasks, workflows and role descriptions, especially (but not only) for Roblox. Use this skill when it's about the ORGANIZATION of game dev rather than concrete code: Which roles exist (Creative Director, Engineer, Artist, Polish/Audio, Business, QA-Tester, Game Critic)? Who does which subtask? What does a development chain (concept → backend → frontend → polish → test) look like? How do you write a Game Design Document / KONZEPT.md? How do several (AI) agents divide up a game? Also trigger on \"plan a new game\", \"create Game Design Document\", \"which roles do I need for my game\", \"development workflow for a game\", \"who tests the game\", \"structure a game idea\", \"Roblox genre/monetization\".\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: game-dev\ntags: [game-design, roblox, rollen, workflow, gdd, konzept, monetarisierung, qa, gamedev]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'custom', 'origin_path': '~/.claude/skills/game-design/', 'origin_version': '1.0.0', 'origin_repo': None, 'last_sync_from_origin': None, 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"game-design banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Game Design — Roles, Subtasks & Workflows (Deutsch)\n\n## Übersicht & Zweck\n\nGame development is teamwork made of clearly separated disciplines — even when a single person\nor one AI agent takes on several of them. This skill provides the **organizational model**:\nwhich roles exist, which subtasks belong to them, in what order they interact\nand how to capture a game as a concept (GDD). For the *technical* how, see `/rojo` (sync),\n`/rbx-studio` (editor/assets) and the meta-skill `/rbx-dev` (architecture).\n\nUse this skill when planning a new game, when dividing up the work (also across\nseveral AI agents) and when writing/reviewing a Game Design Document.\n\n## The Roles (5 development + 2 test)\n\nA proven, compact role distribution. Full descriptions with all subtasks:\n[`references/roles-and-workflows.md`](references/roles-and-workflows.md).\n\n| Role | Focus | Core subtasks |\n| --- | --- | --- |\n| **Creative Director** | WHAT & WHY & for WHOM | GDD/KONZEPT, design & balance mechanics, prioritization/sprints, story, UX flow |\n| **Engineer** | HOW (technical) | Server/client/shared code, game loop, networking/remotes, DevOps (Rojo, build), bugfixing |\n| **Artist** | how the world looks | World/level building, lighting & atmosphere, particles, asset sourcing (incl. malware check) |\n| **Polish / Audio** | how it feels & sounds | SFX/music/ambient, animations, UI/UX fine-tuning, \"juice\" (screen shake, hit-stop), feedback |\n| **Business** | outward-facing | Store page, icon/thumbnail, monetization (gamepass/products/pass), analytics, community |\n| **QA-Tester** | technically correct? | Bug scans in code, playtests + check console, reproducible reports, regression, performance |\n| **Game Critic** | is it fun? | First/long impression from the player's view, honest assessment (fun, clarity, fairness), suggestions |\n\n**Basic rule:** Development and testing are **separate** roles — ideally separate people\nor agents. Whoever writes code does not test it objectively. The Game Critic may be tough.\n\n## Workflow & Vorgehen\n\nWork flows as a chain from role to role. The most important patterns:\n\n**Standard feature chain:**\n```\nCreative Director (plans feature) → Engineer (backend) → Artist (frontend/assets)\n→ Polish/Audio (sound + fine-tuning) → QA-Tester (technical test)\n→ Game Critic (player perspective) → Creative Director (feedback → next iteration)\n```\n\n**Quick-fix chain:** QA-Tester (bug) → Engineer (fix) → QA-Tester (verifies).\n\n**Asset chain:** Artist (store search) → Artist (malware scan) → Artist (integrate) → QA (visual).\n\n**Polish chain:** Game Critic (weakness) → Polish/Audio → Artist → Game Critic (re-check).\n\n**Human-in-the-loop:** [agent chain] → human tester → Creative Director (feedback) → [chain].\n\nEach iteration should leave a short changelog. Stop condition: time budget reached\n**or** quality goal met.\n\n### Persona-based testing\n\nA game only survives if very different players can cope with it. Therefore test (also\nsimulated by agents) from several **personas** instead of only from your own perspective — varied\nby age, experience, platform (PC/mobile/tablet/console), attention span, language and\naccessibility. Examples: a 9-year-old casual kid on a tablet who only wants to press buttons; a\n12-year-old core player on PC who looks for the meta; a 60+ beginner who needs big buttons.\nPersona tests should run **blind** (the tester does not know the design intent).\n\n## Game Design Document (KONZEPT.md)\n\nCapture every game in a concise GDD — template:\n[`assets/KONZEPT_template.md`](assets/KONZEPT_template.md). Minimum structure:\n\n- **Vision** — 1–2 sentences: What is the game?\n- **Genre / reference** — classification + reference titles.\n- **Core mechanics** — **max. 3–4** (focus forces quality).\n- **Gameplay loop** — the player's minute-by-minute loop.\n- **Game modes / time formats** — if relevant.\n- **Monetization** — gamepasses, developer products, battle pass, shop.\n- **Tech** — stack (Rojo/frameworks), rough architecture.\n- **Next steps** — implementation checklist.\n- **Known bugs / open issues**.\n\n## Multi-agent division of labor\n\nSeveral AI agents (or human+AI) can divide up a game — two modes:\n\n- **Swarm** — same task, different areas (e.g. three agents each balance one system).\n- **Team** — different roles, coordinated with each other (Engineer + Artist + Polish in parallel on\n  one feature, coordinated by the Creative Director).\n\nProven in practice: **never** give development and testing to the same agent; fix role prompts per role\n(system prompt = role description); each chain iteration ends with a changelog +\ntest report; the human remains the quality gate.\n\n## Roblox-specific market context (orientation)\n\nPlatform knowledge that grounds the concept work for Roblox (no guarantee, just rules of thumb):\n\n- **Profitable genres:** Simulator, RPG, Tycoon, Horror, Obby — very different scaling\n  and effort.\n- **Underserved niches (higher risk, less competition):** real strategy/RTS-lite,\n  high-quality sports games, cozy/life sim, co-op puzzle/escape, auto-battler.\n- **Golden monetization rules:** (1) LiveOps is mandatory (updates every 2–4 weeks),\n  (2) monetization should *support* gameplay, not block it, (3) social design (trading,\n  co-op) is infrastructure, (4) mobile-first (50%+ play on phones), (5) content-creator\n  suitability (YouTube/TikTok) is marketing.\n\n> For current, reliable market figures, research instead of estimating — the points above are\n> stable heuristics, not live data.\n\n## Further reading\n\n- Sister skills: `/rojo`, `/rbx-studio`; meta-skill `/rbx-dev` (architecture patterns,\n  project structure, Luau lessons).\n- Reference pipeline (if available): `<your Roblox project pipeline>` (`AGENT_ROLES.md`, `GUIDE.md`,\n  `IDEAS.md`, market analyses).\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-06-17)\n- Initial version. Generic role/workflow framework, distilled from `.ROBLOX/AGENT_ROLES.md`\n  & `GUIDE.md`, user-neutral (without project-specific portfolio)."}, {"id": "skill:game-dev:rbx-dev", "name": "rbx-dev", "cat": "game-dev", "ver": "1.0.0", "status": "active", "desc": "Meta-skill for complete Roblox game development with Rojo — the entry poin
