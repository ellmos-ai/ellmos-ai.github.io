t.toml`, Kategorien und Tags in Marketplaces und Stores. Halte sie inhaltlich gleich — sie sind dieselbe Entscheidung, nur an mehreren Orten.\n\n### 2a. Privacy-Gate — läuft immer\n\nDieser Schritt entfällt nie, auch nicht bei einer scheinbar harmlosen Runde. Gesucht wird im **getrackten** Set, nicht im sichtbaren Arbeitsbaum, denn genau das ist der Unterschied zwischen \"sieht sauber aus\" und \"ist sauber\".\n\n```bash\ngit ls-files\nrg -n \"C:\\\\\\\\Us[e]rs\\\\\\\\|/home/[a-z]|s[k]-[A-Za-z0-9]{16}|gh[p]_|gh[o]_|AKIA[0-9A-Z]{16}|API[_-]?KEY|TO[K]EN|PASS[W]ORD|SEC[R]ET|BEGIN [A-Z ]*PRIVATE KEY\" $(git ls-files)\nrg -n \"\\x{C3}\\x{83}|\\x{C2}\\x{A0}|\\x{FFFD}\" $(git ls-files -- '*.md' '*.txt' '*.json')\n```\n\nErgänze das Muster um die **Namen deiner eigenen internen Ablagen** — Pipeline-Ordner, Themenverzeichnisse, private Arbeitsbereiche:\n\n```bash\nrg -n \"\\.SOFTWARE|\\.RESEARCH|_control-center|<weitere eigene Ordnernamen>\" $(git ls-files)\n```\n\nSolche Verweise sind keine Secrets und lösen keinen Alarm aus, deshalb rutschen sie durch — aber sie sind für Leser **unauflösbar** („zurückübertragen aus der .SOFTWARE-Pipeline\" sagt Fremden nichts) und geben die eigene Struktur preis. Sie werden ersetzt oder entfernt, nicht bloß toleriert. Eine Suche, die nur nach `C:\\Users\\…` und Token-Mustern fahndet, findet sie garantiert nicht.\n\nFündig geworden? Dann entscheidet die **Art** des Fundes über das Vorgehen — siehe Abschnitt „Force-Push-Regel\". Ein Secret, das jemals committet wurde, ist verbrannt: Entfernen aus `HEAD` genügt nicht, es muss rotiert werden.\n\n### 2b. Veröffentlichungsabsicht der Dokumente prüfen\n\nDer eigentliche Kern dieser Runde. Gehe die getrackten `.md`, `.txt` und `.json` durch und frage bei jeder Datei: **War die je für Fremde gedacht?**\n\n```bash\ngit ls-files -- '*.md' '*.txt' '*.json' | sort\n```\n\nNicht anhand des Dateinamens raten — kurz hineinsehen. Ein `PLAN.md` kann eine öffentliche Roadmap sein, ein harmlos klingendes `notes.md` die interne Preisstrategie. Drei Kategorien:\n\n**Gehört ins Repo** — README, LICENSE, CHANGELOG, SECURITY, CONTRIBUTING, `docs/`, API-Referenzen, Beispiel-Configs, echte Roadmaps, Manifeste (`package.json`, `pyproject.toml`), Lockfiles, CI-Konfiguration.\n\n**Gehört nicht ins Repo, ist aber unkritisch** — der Normalfall dieser Runde. Aufgaben- und Planungsdateien (`AUFGABEN.txt`, `Plan.txt`, `TODO-intern.md`), Session-Notizen und Übergaben (`HANDOFF`, `BRIEFING`, `_handoff/`), Statusdateien der eigenen Pipeline, Entwicklungstagebücher, `_archive/`, Registry- und Index-JSONs mit lokalen Pfaden, Zwischenstände und generierte Artefakte, Agenten-Arbeitsdateien. Solche Dateien sind nicht gefährlich, aber sie erzeugen Unübersichtlichkeit und den Eindruck einer fremden Baustelle. Behandlung: `.gitignore` ergänzen, `git rm --cached <datei>` und **ganz normal pushen**.\n\n**Gehört nicht ins Repo und ist heikel** — Credentials, personenbezogene Daten, Kundendaten, interne Kalkulationen, Preis- und Verhandlungsstrategien, unveröffentlichte Geschäftspläne, Vertragsentwürfe, alles mit Wettbewerbswert. Hier reicht ein normaler Commit nicht, siehe Force-Push-Regel.\n\nBei `.json` lohnt ein zweiter Blick: Manifeste und Lockfiles bleiben, aber lokale Configs, Task-/Registry-Dateien, Export-Dumps und alles mit absoluten Pfaden oder Hostnamen sind typische blinde Passagiere.\n\nWenn du eine Datei entfernst, die jemand suchen könnte (eine Roadmap etwa), erwähne im Commit oder im README kurz, wo die Information jetzt lebt — sonst wirkt es wie ein Rückschritt.\n\n### 3. Banner\n\nEin Banner entscheidet mit darüber, ob jemand überhaupt anfängt zu lesen. Prüfe, ob eines existiert und im README als erstes Element eingebunden ist.\n\nFehlt es, gibt es drei Wege — in dieser Reihenfolge sinnvoll:\n\n1. **Bildgenerator eines Agenten** (z. B. agy; das Wort „generiere\" ist dort der Trigger für echte PNG-Erzeugung), wenn ein Bildmotiv besser passt als Typografie.\n2. **Codex**, wenn das Banner aus Code entstehen soll und ein Stilvorbild existiert, an dem es sich orientieren kann.\n3. **Selbst als SVG**, wenn das Banner primär Wortmarke plus Formsprache ist — das ist oft die schnellste und am besten kontrollierbare Variante, und SVG bleibt später änderbar.\n\nHalte die Familie ein, wenn das Projekt zu einer Gruppe gehört: gleiche Grundfarbe, gleiche Ästhetik, gleiche Wortmarken-Behandlung. Ein Banner, das aus der Reihe fällt, wirkt schlechter als keines. Übliche Größe 1200x300; als PNG ins Repo, das SVG als Quelle daneben.\n\n### 4. Aussagen gegen den echten Stand abgleichen\n\nHier entsteht der meiste Wert. Das README behauptet Dinge — prüfe sie nach, statt sie zu glauben:\n\n- **Version** im README/Badge gegen `pyproject.toml`/`package.json`/`__version__` und gegen den letzten Release-Tag. Bei mehreren Versionsträgern alle prüfen, nicht nur einen.\n- **Installationsweg** wirklich durchspielen, zumindest lesend: Existiert das Paket unter dem genannten Namen? Stimmen Kommandos und Flags?\n- **Feature-Liste** gegen den Code: Ist alles Genannte da, und fehlt Neues in der Liste?\n- **Zahlen** (Anzahl Tools, unterstützte Formate, Testabdeckung) an der Quelle nachzählen statt fortzuschreiben. Zahlen im README veralten still.\n- **Screenshots** gegen die aktuelle Oberfläche.\n- **Requirements** (Python-/Node-Version, Abhängigkeiten) gegen die Manifeste.\n- **Links** auf Nachbarprojekte, Doku und Registries: laufen sie noch?\n\n**Eine Korrektur gilt für alle Flächen, nicht nur für die, auf der sie auffiel.** Wenn sich eine inhaltliche Aussage als falsch erweist — besonders wenn der Auftraggeber sie richtigstellt —, dann steht dieselbe Aussage mit hoher Wahrscheinlichkeit noch anderswo: im Organisationsprofil, in der `llms.txt`, in der zweiten Sprachfassung, im README eines Nachbarprojekts. Suche gezielt danach, bevor du den Punkt abhakst:\n\n```bash\ngh search code \"<prägnante Formulierung>\" --owner ORG\n```\n\nSonst korrigierst du eine Stelle und lässt drei stehen — und der Widerspruch fällt erst auf, wenn das nächste Repo an die Reihe kommt. Das kostet nicht nur Zeit, es beschädigt auch das Vertrauen in die Doku: Wer zwei Beschreibungen derselben Sache findet, glaubt keiner mehr.\n\nAnschließend die **Darstellung** verbessern, wo sie schwach ist: lange Aufzählungen von Optionen werden als Tabelle lesbarer; Codeblöcke brauchen Sprach-Tags; eine Struktur- oder Ablaufübersicht ist als Mermaid-Diagramm oder ASCII-Baum schneller erfasst als in Prosa; die erste Bildschirmhöhe sollte Zweck, Installation und ein Nutzungsbeispiel zeigen, nicht Badges und Vorgeschichte. Wenn das README über ~400 Zeilen geht, lagere Details nach `docs/` aus und verlinke.\n\n**Sprachregel für READMEs:** Standard ist eine **englische `README.md`** plus **deutsche Zweitfassung**. Ausnahme: Der Gegenstandsbereich der Anwendung ist selbst deutsch (deutsches Recht, deutsches Steuer- oder Förderwesen, deutschsprachige Zielgruppe) oder es existiert bisher ausschließlich eine deutsche Fassung — dann bleibt Deutsch die Hauptsprache. Für jede weitere Sprache, die das Projekt bereits spricht, gehört eine eigene README-Fassung dazu. Halte dich an die im Repo schon verwendete Namenskonvention (`README_de.md`, `README.de.md`, `docs/README.de.md`) und erfinde keine zweite daneben. Verlinke die Fassungen gegenseitig in der Kopfzeile.\n\n### 6. Fehlende Standardsprachen anlegen\n\nErgänze die READMEs, die von den **Standardsprachen** fehlen: Deutsch, Englisch, Spanisch, vereinfachtes Chinesisch, Japanisch, Russisch. Der Zweck ist Reichweite, deshalb gilt das vor allem für nutzernahe Projekte — bei einer entwicklernahen Bibliothek mit rein englischem Publikum ist eine russische README kein Gewinn, sondern nur weitere Pflegelast. Entscheide bewusst und halte die Entscheidung im Laufprotokoll fest, damit die nächste Runde sie nicht neu diskutiert.\n\nNeue Fassungen werden **befüllt, nicht angelegt und leer gelassen** — ein Stub mit „TODO: translate\" ist schlechter als gar keine Datei, weil er Vollständigkeit vortäuscht. Inhaltliche Parallelität und Rückangleichung regelt `bilingual-doc-sync`; bei mehr als zwei Fassungen lohnt es sich, diesen Skill für den Abgleich hinzuzuziehen.\n\n### 7. Sichtbarkeit und Werbung\n\nUeberlege, welche Maßnahmen für **dieses** Projekt tatsächlich Nutzer bringen, und setze sie um:\n\n- **Registries**, in die das Projekt technisch gehört: Paketregister (npm, PyPI), MCP-Registry, Plugin-/Skill-Verzeichnisse, Marketplaces.\n- **Kuratierte Listen** (`awesome-*` und thematische Sammlungen), sofern die Aufnahmekriterien wirklich erfüllt sind. Ein PR an eine Liste, deren Kriterien das Projekt verfehlt, kostet Reputation.\n- **Eigene Flächen**: Organisationsprofil, `llms.txt`, Projektwebsite, README des Oekosystems, Verweise aus verwandten eigenen Repos.\n- **Release-Notes** als Anlass: Ein Release ohne erzählte Neuerung wird nicht wahrgenommen.\n\n**Freigabe-Gate:** Alles, was nach außen geht — PRs an fremde Repos, Einträge in fremde Listen, Posts, Einreichungen — wird **vorgeschlagen und erst nach ausdrücklicher Freigabe ausgeführt**, sofern keine Dauerfreigabe für diesen Kanal existiert. Änderungen an eigenen Flächen brauchen dieses Gate nicht. Der Grund ist schlicht: Ein zurückgezogener PR an ein fremdes Repo ist öffentlich sichtbar und fällt auf das Projekt zurück.\n\n### 8. Eintrag auf den Organisationsseiten\n\nZuerst die eigene Organisation: Ist das Repo im Profil-README (`ORG/.github` → `profile/README.md`) überhaupt aufgeführt, in der richtigen Rubrik, mit aktueller Beschreibung?\n\n```bash\ngh api user/orgs --jq '.[].login'\n```\n\nDann durch **alle** Organisationen gehen und je Organisation eine einzige Frage beantworten: Würde ein Besucher dieser Organisationsseite von diesem Repo profitieren? Meist lautet die Antwort nein — dann ist „nicht verlinken\" das richtige Ergebnis und keine Lücke. Wo die Antwort ja lautet (thematische Nähe, gemeinsame Nutzer, ein Werkzeug, das die dortigen Projekte ergänzt), setze den Verweis mit einer Zeile, die den Nutzen erklärt, nicht nur den Namen nennt.\n\nDas Profil liegt in einem eigenen Repo (`ORG/.github`). Änderungen dort werden mitgepflegt und gepusht — nach der Dirty-Tree-Regel aus Schritt 11.\n\n### 10. Issues und Pull Requests\n\n```bash\ngh issue list --repo ORG/REPO --state open --limit 50\ngh pr list --repo ORG/REPO --state open --limit 30\n```\n\nArbeite sie durch statt sie nur zu zählen:\n\n- **Fixbare Bugs** direkt beheben — in dieser Runde ist der Kontext ohnehin geladen. Kleine, klar umrissene Fixes mit Test und Verweis auf die Issue-Nummer.\n- **Bereits erledigte Issues** schließen, mit einem Satz, was sie gelöst hat.\n- **Unklare Meldungen** brauchen eine gezielte Rückfrage (Version, Betriebssystem, Reproduktionsschritte).\n- **PRs**: Diff wirklich lesen, Tests laufen lassen, dann mergen oder begründet zurückmelden. Ein PR, der monatelang unbeantwortet liegt, kostet mehr Wohlwollen als eine höfliche Ablehnung.\n- **Stale-Fälle** auflösen statt weiterschleppen.\n\n**Freigabe-Gate:** Öffentliche Kommentare, Schließungen mit Begründung und Merges fremder Beiträge sind Kommunikation nach außen — vor der Ausführung vorlegen, sofern keine Dauerfreigabe besteht. Reine Code-Fixes im eigenen Repo sind davon nicht betroffen.\n\n### 11. Committen, pushen, verifizieren\n\nDie Runde endet nicht mit den Änderungen, sondern damit, dass sie **draussen sind**. Ein Arbeitsbaum voller ungepushter Verbesserungen ist das schlechteste Ergebnis: Die nächste Session — möglicherweise ein anderer Agent oder ein anderes Gerät — muss sich erst in einen fremden, halbfertigen Stand einarbeiten, und auf den öffentlichen Flächen hat sich nichts verbessert.\n\nVor dem Push kurz absichern, was überprüfbar ist: Tests und Smokes laufen lassen, bei Doku-Änderungen die Links und die gerenderte Ansicht prüfen. Dann in **thematisch getrennten Commits** bündeln, statt alles in einen Sammel-Commit zu werfen — Aufräumen, Doku-Aktualisierung und Bugfixes sind drei verschiedene Dinge, und wer später einen davon zurückdrehen will, ist dankbar dafür:\n\n```bash\ngit add .gitignore && git rm --cached <interne dateien>\ngit commit -m \"chore: interne Arbeitsdateien aus dem Repo nehmen\"\ngit commit -am \"docs: README auf aktuellen Stand (Version, Toolzahl, Screenshots)\"\ngit commit -am \"fix: <Issue-Nummer> ...\"\n\ngit pull --rebase        # bei divergiertem Branch, vor dem Push\ngit push\n```\n\nDanach verifizieren statt annehmen: Remote-README in der gerenderten Ansicht, CI-Lauf, Release- und Tag-Stand.\n\n```bash\ngh run list --repo ORG/REPO --limit 3\ngh repo view ORG/REPO --json description,repositoryTopics,url\n```\n\n**Wenn die CI rot ist, obwohl dein Commit nur Doku anfasste**, liegt die Ursache fast nie an dir. Der mit Abstand häufigste Fall — bei dieser Repo-Familie an einem einzigen Tag **dreimal** getroffen — ist ein **ungepinnter Linter ohne festgeschriebenen Regelsatz**. Prüfe das **zuerst**, bevor du irgendetwas an deinem Commit vermutest.\n\nDer Mechanismus: Läuft im Workflow `ruff check` (oder flake8, eslint …) gegen eine ungepinnte Dependency (`ruff>=0.12`, oder gar keine Version), und fehlt eine explizite Regel-Auswahl (`[tool.ruff.lint] select = [...]`, bei fehlendem `pyproject.toml` eine eigene `ruff.toml`), dann folgt der Lint dem Default der **jeweils frisch installierten** Version. Ein neues Linter-Release verschiebt diesen Default, und eine unveränderte Codebasis wird rot. Die Verräter:\n\n- Regel-Codes, die das Projekt nie hatte (`UP045`, `UP006`, `BLE001`, `RUF100`, `DTZ005`, `N999` …), teils in dreistelliger Zahl.\n- Der Bruch fällt oft **plattform-gespalten** aus: Runner mit gecachter älterer Version bleiben grün, frische werden rot.\n- Manchmal beanstandet eine Regel etwas Unbehebbares (`N999` den Paketnamen selbst) — sicheres Zeichen, dass sie nie Standard war.\n\nFix: den Regelsatz festschreiben, der vorher grün war — `select = [\"E4\",\"E7\",\"E9\",\"F\"]` sind die klassischen ruff-Defaults. Existiert kein `pyproject.toml`, lege eine `ruff.toml` an. Verifiziere gegen die **neue** Linter-Version selbst (installieren, ohne Config die Funde reproduzieren, mit Config „passed\"). Die neuen Regeln kommen als **Aufgabe** ins Projekt — bewusst übernehmen ist eine Entscheidung, kein Nebeneffekt eines Tool-Updates. Das ist ein echter, wiederkehrender Befund: Ohne den Pin bricht die CI beim nächsten Linter-Release wieder, und zwar in **jedem** so konfigurierten Repo.\n\nZwei Fälle, in denen **nicht** gepusht wird: wenn für das Projekt eine Veröffentlichungs- oder Einreichungssperre gilt, oder wenn der Stand erklärtermaßen unfertig ist. Beides sind Ausnahmen, die man begründet — der Normalfall ist: committen und pushen.\n\nBei einer Veröffentlichungssperre wird die Runde nicht abgebrochen, sondern **umgeleitet**: auf einem eigenen Branch (`judging-hold/…`, `freeze/…`) lokal committen, den Hauptbranch unangetastet auf dem eingereichten Stand lassen, den Sperrgrund im Laufprotokoll vermerken und nach Aufhebung nachziehen. Wichtig ist dabei, konsequent zu sein: Gesperrt ist nicht nur `git push`, sondern **jede remote sichtbare Änderung** — Topics, Beschreibung, Homepage, Releases, Issue- und PR-Aktionen verändern das veröffentlichte Projekt genauso.\n\nExistieren weitere Klone desselben Repos (zweites Gerät, Deploy-Kopie, Spiegel), ziehe sie unmittelbar nach dem Push nach. Ein Klon, der zehn Commits zurückliegt, produziert bei der nächsten Fehlersuche Diagnosen an einem Stand, den es nicht mehr gibt.\n\n#### Änderungen an anderen Repos — Dirty-Tree-Ausnahme\n\nDiese Runde erzeugt regelmäßig Änderungen **außerhalb** des gepflegten Repos: eine Zeile im Organisationsprofil (Schritt 8), später in der tiefen Runde ein Rückverweis in einem verwandten Repo. Solche Änderungen werden ebenfalls committet und gepusht — ein unveröffentlichter Rückverweis ist kein Rückverweis.\n\nVor dem Anfassen eines fremden Repos kurz dessen Zustand prüfen:\n\n```bash\ngit -C <pfad> status --porcelain\n```\n\n**Sauberer Arbeitsbaum** → Änderung vornehmen, in einem **eigenen, thematisch klaren Commit** (`docs: link <projekt>`) committen und pushen. Nicht mit den Commits des gepflegten Repos vermischen: Es ist ein anderes Repo mit eigener Historie und eigenen Lesern.\n\n**Dirty, aber die Fremdänderungen liegen in anderen Dateien** → die eigene Änderung ist trotzdem sauber machbar. Stage und committe **pfadgenau nur die eigene Datei**, damit fremde, ungeprüfte Arbeit nicht mitwandert:\n\n```bash\ngit -C <pfad> add README.md\ngit -C <pfad> commit -m \"docs: link <projekt>\"     # nur der gestagte Pfad\n```\n\nAber **nicht pushen**. Der Commit ist lokal harmlos; ein Push wäre es nicht unbedingt: Du weißt nicht, worauf der andere Arbeitsstand hinausläuft — vielleicht wird er gerade amendiert, rebased oder anders geschnitten, und dein Commit zwingt ihn dazu, sich damit auseinanderzusetzen. Der lokale Commit sichert die Arbeit, ohne jemandem etwas aufzuzwingen; der Lauf, der sich später jenem Repo zuwendet, findet ihn vor und nimmt ihn mit.\n\n**Dirty in genau der Datei, die du ändern müsstest** → nicht anfassen. Hier müsstest du auf einem fremden Zwischenstand aufsetzen und ihn mit-committen; den erst zu verstehen kostet mehr, als dieser eine Verweis wert ist.\n\n**Aktive Sperre (`LOCK*.txt`) im Ziel-Repo** → **zuerst den Lock lesen, statt ihn als pauschales Verbot zu behandeln.** Eine Sperre beschreibt ihren eigenen Umfang, und der ist oft enger als „gar nichts\". Typische Fälle:\n\n- **Bearbeitungssperre** („hier arbeitet gerade jemand\") → nichts anfassen, auch keine Nebendatei.\n- **Reine Veröffentlichungs-/Push-Sperre** (Einreichung, Judging, Freeze) → lokale Arbeit bleibt erlaubt, nur der Remote-Kontakt ist gesperrt. Dann auf einem eigenen Branch arbeiten und lokal committen; **remote-wirksame Schritte entfallen** — nicht nur der Push, sondern auch Topics, Beschreibung, Homepage, Releases und Issue-/PR-Aktionen, denn auch die verändern das veröffentlichte Projekt.\n\nEin Lock, der nur den Push sperrt, als Komplettverbot zu lesen, kostet den gesamten lokalen Teil der Runde ohne Sicherheitsgewinn. Umgekehrt reicht es nicht, nur den Push zu unterlassen und trotzdem Metadaten zu ändern. Im Zweifel den Lock zitieren und nachfragen.\n\n#### Der Wunsch darf nicht verloren gehen\n\nWird die Änderung aus einem dieser Gründe **nicht** ausgeführt, wandert sie in die Aufgabenliste des Ziel-Repos — `AUFGABEN.txt`, `TODO.md` oder `TODO.txt`, je nachdem, was dort existiert. Ein Eintrag mit Datum, gewünschter Änderung und Grund:\n\n```markdown\n- [ ] [2026-07-24, after-care] Rückverweis auf <projekt> im README ergänzen\n      (übersprungen: README hatte uncommittete Fremdänderungen)\n```\n\nDas ist der Unterschied zwischen „verschoben\" und „vergessen\": Die Aufgabenliste liegt dort, wo der nächste Bearbeiter dieses Repos ohnehin hineinsieht — verlässlicher als ein Vermerk im Protokoll eines fremden Laufs. Existiert keine Aufgabenliste, lege keine an; dann genügt der offene Punkt im eigenen Laufprotokoll.\n\nBei einer **aktiven Sperre gilt auch das nicht** — dann wird die Datei nicht angefasst und der Vermerk bleibt im eigenen Laufprotokoll. Notiere ihn in beiden Fällen auch dort, damit die Rotation den offenen Punkt kennt.\n\nZum Schluss die Flächen aus Schritt 0 bedienen — siehe nächster Abschnitt.\n\n## Parität über alle Distributionsflächen\n\nZum Abschluss der Runde gegen die Liste aus Schritt 0 gehen: **Jede Änderung, die ein Nutzer sehen würde, muss auf jeder Fläche ankommen, auf der er sie sucht.** Ein Repo, dessen npm-Seite eine andere Geschichte erzählt, ist schlechter dran als eines mit nur einer Fläche.\n\nDer entscheidende Mechanismus: **Paketregister zeigen die README des letzten Publish, nicht den aktuellen Repo-Stand.** Eine README-Korrektur wird auf npm oder PyPI erst mit einer neuen Version sichtbar. Wenn die Korrektur inhaltlich relevant ist (falsche Installation, falsche Version, veraltete Feature-Liste), gehört ein Patch-Release dazu — sonst bleibt der Fix wirkungslos.\n\n| Fläche | Was dort gepflegt wird | Wie es ankommt |\n|---|---|---|\n| npm | README, `description`, `keywords`, Repository-Link | Nur per `npm publish` (Patch-Version); Metadaten kommen aus `package.json` |\n| PyPI | README (`long_description`), Classifiers, Projekt-URLs | Nur per neuem Upload; Metadaten aus `pyproject.toml` |\n| MCP-Registry / Plugin-Verzeichnisse | Beschreibung, Version, Toolliste, Einstiegsdoku | Je nach Registry Manifest-Update oder erneute Einreichung |\n| Marketplace / Store | Beschreibung, Screenshots, Kategorien, Sprachfassungen | Über die jeweilige Verwaltungsoberfläche; Screenshots altern dort besonders schnell |\n| Docker Hub / Container-Registry | Beschreibung, Tags, Nutzungsbeispiel | Repository-Beschreibung plus neuer Tag |\n| Zenodo / DOI | Metadaten, Autoren, Version | In-Place-Edit für Metadaten, neue Version für Inhalte |\n| Website / Org-Profil / `llms.txt` | Kurzbeschreibung, Link, Positionierung | Direkt editierbar — die günstigsten Flächen, deshalb nie vergessen |\n\nWenn eine Version angehoben wird, müssen **alle Versionsträger** gleichzeitig mitwandern: Manifest, Code-Konstante, README-Badge, Changelog, Release-Tag, `llms.txt`. Ein halb angehobener Versionsstand ist schwerer zu diagnostizieren als ein durchgängig alter.\n\nIst eine Aktualisierung auf einer Fläche gerade nicht möglich oder nicht sinnvoll (z. B. ein Release nur wegen eines Tippfehlers), halte das im Laufprotokoll fest, damit die nächste Runde die Abweichung nicht für ein Versehen hält.\n\n## Force-Push-Regel\n\nDer Standard ist **kein Force-Push**. Interne Planungsdateien nachträglich zu ignorieren rechtfertigt keine Historien-Umschreibung: Der Aufwand ist hoch, jeder Klon und jeder Fork bricht, offene PRs werden unbrauchbar — und der Gewinn ist gering, weil der Inhalt harmlos ist. Normaler Weg:\n\n```bash\ngit rm --cached <datei>            # aus dem Tracking, bleibt lokal erhalten\n# .gitignore ergänzen\ngit commit -m \"chore: interne Arbeitsdateien aus dem Repo nehmen\"\ngit push\n```\n\nDie Historie umschreiben (und damit `--force-with-lease` pushen) ist nur bei **echten Leaks** gerechtfertigt: Credentials und Keys, personenbezogene oder Kundendaten, sowie Dokumente mit echtem Wettbewerbswert — interne Kalkulationen, Preisstrategien, unveröffentlichte Pläne, Vertragsinterna. In diesem Fall:\n\n1. Betroffene Secrets **zuerst rotieren** — die Historie ist zu diesem Zeitpunkt bereits kopiert, geforkt und in Caches. Rotation wirkt, Löschen nur kosmetisch.\n2. Historie bereinigen (`git filter-repo` oder BFG), `--force-with-lease` pushen.\n3. Forks und Caches prüfen; bei Bedarf GitHub-Support für verwaiste Objekte kontaktieren.\n4. Vorgang im Laufprotokoll festhalten: was, wann, welche Rotation.\n\nIm Zweifel zwischen „unkritisch\" und „heikel\": als heikel behandeln und vorlegen. Die Kosten sind asymmetrisch.\n\n## Befunde werden Aufgaben, nicht nur Protokollzeilen\n\nEine Pflegerunde findet regelmäßig mehr, als sie in derselben Runde beheben kann oder soll: eine fehlende Sprachfassung, ein Modernisierungsrückstand, eine Veröffentlichung, die nie stattgefunden hat. **Solche Befunde werden im Moment der Entdeckung zu Aufgaben** — sonst hängen sie im Protokoll eines abgeschlossenen Laufs, wo der nächste Bearbeiter des Projekts nicht hinsieht.\n\nDie Aufgabe gehört in das **ordnerlokale Aufgabensystem des Projekts** — dorthin, wo derjenige nachschaut, der als Nächstes an diesem Projekt arbeitet. Typischerweise ist das `AUFGABEN.txt` oder `TODO.md` im Projektordner, und der liegt oft **nicht im Git-Klon**, sondern in der Ablage, in der die Planung lebt. Der Klon enthält den Code, der Projektordner die Steuerung; ein Eintrag im Klon, der beim nächsten `git clean` verschwindet, ist keine Aufgabe.\n\nDrei Dinge dabei beachten:\n\n1. **Interne Aufgabenliste von öffentlicher Roadmap trennen.** Ein `TODO.md` kann eine gepflegte öffentliche Roadmap sein — dann ist es kein Ablageplatz für interne Nacharbeit. Sieh hinein, bevor du anhängst: Findet sich dort eine Überschrift wie „Public roadmap\", schreib in die interne Datei daneben (`AUFGABEN.txt`) und markiere sie als intern.\n2. **Bestehende Einträge prüfen, statt zu duplizieren.** Oft steht der Befund schon da. Dann wird er nicht neu angelegt, sondern **angereichert** — mit dem empirischen Beleg aus diesem Lauf („bestätigt: `--help` gibt vollständig deutsche Ausgaben aus\"). Ein bekannter Punkt mit frischem Beweis ist wertvoller als ein zweiter Eintrag daneben.\n3. **Erledigtes mitschreiben.** Was die Runde behoben hat, gehört als abgehakter Punkt mit Commit-Hash dazu. Das erklärt der nächsten Runde, warum ein Befund verschwunden ist, und verhindert, dass sie ihn erneut „entdeckt\".\n\nFormuliere die Aufgabe so, dass sie ohne den Kontext dieses Laufs verständlich ist: was gefunden wurde, warum es zählt, was der nächste Schritt wäre. „i18n unvollständig\" ist keine Aufgabe; „Katalog enthält nur `status.title`, dort sind es/zh/ja/ru leer — erst CLI-Strings in den Katalog überführen, dann alle sechs Sprachen befüllen\" ist eine.\n\n## Laufprotokoll\n\nHalte das Ergebnis in `_after-care/LOG.md` fest (der Ordner gehört in die `.gitignore` — er ist Pipeline-Material, kein Repo-Inhalt, genau nach der Regel aus Schritt 2b). Pro Lauf eine Zeile mit Datum, Stufe und den bewussten Entscheidungen:\n\n```markdown\n## 2026-07-24 — surface\n- Flächen: GitHub, npm (<paket>), MCP-Registry, Org-Profil, llms.txt\n- Topics: +local-first, +mcp-server; keywords in package.json angeglichen\n- Entfernt: AUFGABEN.txt, _handoff/ (gitignored, kein Force-Push nötig)\n- README: Version 0.9 -> 1.2 korrigiert, Toolzahl 23 -> 26 nachgezählt\n- Sprachen: EN + DE gepflegt; ES/ZH/JA/RU bewusst nicht (entwicklernahes Publikum)\n- Issues: #12 gefixt, #7 geschlossen (erledigt), #15 Rückfrage gestellt\n- Push: 3 Commits, CI grün; npm-Republish 1.2.1 wegen README-Korrektur\n- Offen: Store-Screenshots veraltet, brauchen neuen Build\n```\n\nDas Protokoll erspart der nächsten Runde, dieselben Entscheidungen neu zu treffen, und ist die Grundlage für rotierende Pflegeläufe über viele Repos (`rotation-check`).\n\n## Häufige Fehler\n\n| Fehler | Korrektur |\n|---|---|\n| Nur den Arbeitsbaum betrachtet, nicht `git ls-files` | Immer das getrackte Set prüfen — dort liegt das Problem |\n| Privacy-Gate nur auf Pfade und Token gerichtet | Auch nach eigenen Pipeline-/Ordnernamen suchen — sie lösen keinen Alarm aus und rutschen durch |\n| Interne Datei entfernt und dabei Historie umgeschrieben | Bei unkritischen Dateien reicht `git rm --cached` + normaler Push |\n| Secret aus `HEAD` entfernt und Vorgang als erledigt betrachtet | Secret rotieren; alles andere ist Kosmetik |\n| Dateien nach Namen klassifiziert | Kurz hineinsehen — Namen tragen die Absicht nicht zuverlässig |\n| Zahlen im README fortgeschrieben statt nachgezählt | An der Quelle zählen (Tool-Liste, Testlauf, Manifest) |\n| Neue Sprachfassung als leerer Stub angelegt | Befüllen oder weglassen — ein Stub täuscht Vollständigkeit vor |\n| Zweite README-Namenskonvention neben der bestehenden eingeführt | Vorhandene Konvention übernehmen |\n| PR an eine fremde Liste ohne Freigabe gestellt | Außenkommunikation vorlegen; nur eigene Flächen sind frei |\n| Issues gezählt statt bearbeitet | Fixen, schließen oder gezielt nachfragen — jeder Fall bekommt einen Zustand |\n| Banner im Alleingang in fremdem Stil erzeugt | Design-Familie des Oekosystems einhalten |\n| README im Repo korrigiert, npm-/PyPI-Seite zeigt weiter die alte | Registry-Seiten stammen vom letzten Publish — Patch-Release nachziehen |\n| Version nur im Manifest angehoben | Alle Versionsträger gleichzeitig: Manifest, Code, Badge, Changelog, Tag, `llms.txt` |\n| Änderungen fertig, aber ungepusht liegen gelassen | Committen und pushen gehört zur Runde; nur Sperren rechtfertigen eine Ausnahme |\n| Alles in einem Sammel-Commit | Aufräumen, Doku und Fixes trennen — sonst ist nichts einzeln zurückdrehbar |\n| CI nach Doku-Commit rot, sich selbst verdächtigt | Ungepinnter Linter ohne `select` folgt dem Default der neuen Version — Regelsatz festschreiben |\n| Falsche Aussage nur dort korrigiert, wo sie auffiel | Org-weit nach der Formulierung suchen — sie steht meist auch im Org-Profil, in `llms.txt` und in der zweiten Sprachfassung |\n| Im dirty Fremd-Repo mit `commit -a` gearbeitet | Pfadgenau stagen und committen, nicht pushen — fremde Arbeit bleibt unberührt |\n| Änderung im sauberen Org-Profil-Repo gemacht, aber nicht gepusht | Saubere Fremd-Repos bekommen einen eigenen Commit **und** einen eigenen Push |\n| Übersprungene Änderung nur im eigenen Protokoll vermerkt | Zusätzlich in die Aufgabenliste des Ziel-Repos eintragen, sofern eine existiert |\n| Befund nur ins Laufprotokoll geschrieben | Er wird zur Aufgabe im ordnerlokalen Aufgabensystem — ins Protokoll sieht später niemand |\n| Interne Nacharbeit an eine öffentliche Roadmap gehängt | Erst hineinsehen; „Public roadmap\" heißt: interne Datei daneben nutzen |\n| Bekannten Befund als neuen Eintrag dupliziert | Bestehenden Punkt mit dem empirischen Beleg aus diesem Lauf anreichern |\n| Bei einer Bearbeitungssperre eine TODO-Zeile ins gesperrte Repo geschrieben | Diese Sperre gilt für das ganze Projekt — dort gar nichts anfassen |\n| Push-Sperre als Komplettverbot gelesen und das Repo ganz übersprungen | Lock lesen: sperrt er nur die Veröffentlichung, läuft die lokale Runde auf einem eigenen Branch weiter |\n| Unter Push-Sperre zwar nicht gepusht, aber Topics oder Beschreibung geändert | Auch Metadaten sind remote sichtbar — unter einer Veröffentlichungssperre entfallen sie mit |\n\n## Abschluss-Checkliste\n\n- [ ] Distributionsflächen ermittelt und im Laufprotokoll notiert.\n- [ ] Topics, Description und Homepage gesetzt und überprüft.\n- [ ] Privacy-Gate über das getrackte Set gelaufen, Funde behandelt.\n- [ ] `.md`/`.txt`/`.json` auf Veröffentlichungsabsicht geprüft, interne Dateien ignoriert.\n- [ ] Kein Force-Push ohne echten Leak; bei Leak Rotation durchgeführt.\n- [ ] Banner vorhanden und im README eingebunden.\n- [ ] Version, Features, Zahlen, Screenshots, Links gegen den echten Stand geprüft.\n- [ ] Darstellung verbessert (Tabellen, Diagramme, erste Bildschirmhöhe).\n- [ ] README-Sprachmatrix vollständig; Entscheidungen zu weiteren Sprachen dokumentiert.\n- [ ] Sichtbarkeitsmaßnahmen umgesetzt bzw. zur Freigabe vorgelegt.\n- [ ] Eintrag im eigenen Org-Profil geprüft, sinnvolle Fremd-Orga-Verweise gesetzt.\n- [ ] Änderungen an Fremd-Repos: sauber → committet und gepusht; dirty → lokal committet;\n      nicht ausgeführt → in der Aufgabenliste des Ziel-Repos eingetragen.\n- [ ] Issues und PRs in einen definierten Zustand gebracht.\n- [ ] Getrennte Commits erstellt, gepusht, CI und Remote-Ansicht verifiziert.\n- [ ] Alle Distributionsflächen auf denselben Stand gebracht (ggf. Patch-Release).\n- [ ] Nicht behobene Befunde als Aufgaben im ordnerlokalen Aufgabensystem eingetragen.\n- [ ] Laufprotokoll in `_after-care/LOG.md` geschrieben.\n\n## Changelog\n\n### 1.6.0 (2026-07-24)\n- Regel ergänzt: Eine inhaltliche Korrektur gilt für alle Flächen. Empirisch gelernt — eine\n  Nutzer-Klarstellung wurde in Durchlauf 1 im Hub korrigiert, stand aber unbemerkt noch fünfmal\n  im Organisationsprofil (EN, DE, `llms.txt`) und fiel erst neun Durchläufe später auf.\n\n### 1.5.0 (2026-07-24)\n- Die Linter-Diagnose verschärft, nachdem das Muster an einem Tag dreimal auftrat\n  (n8n-workflow-manager ruff 0.15, clirec + swarm-ai ruff 0.16): „zuerst prüfen\", die konkreten\n  Verräter-Regelcodes, der Plattform-Split, `ruff.toml` als Fix bei fehlendem `pyproject.toml`,\n  Verifikation gegen die neue Linter-Version.\n\n### 1.4.0 (2026-07-24)\n- Diagnose ergänzt: Wenn die CI nach einem reinen Doku-Commit rot wird, ist die häufigste\n  Ursache ein ungepinnter Linter ohne festgeschriebenen Regelsatz — ein neues Tool-Release\n  verschiebt den Default und macht unveränderten Code rot. Fix: Regelsatz pinnen, neue Regeln\n  als Aufgabe. Zweimal in Folge aufgetreten (n8n-workflow-manager mit ruff 0.15, clirec mit 0.16).\n\n### 1.3.0 (2026-07-24)\n- Neuer Abschnitt „Befunde werden Aufgaben\": Was die Runde nicht selbst behebt, wird im Moment\n  der Entdeckung ein Eintrag im ordnerlokalen Aufgabensystem des Projekts — dort, wo der nächste\n  Bearbeiter hinsieht, nicht im Protokoll eines abgeschlossenen Laufs. Inklusive Trennung von\n  interner Liste und öffentlicher Roadmap, Anreichern statt Duplizieren, Erledigtes mit Commit.\n\n### 1.2.0 (2026-07-24)\n- Privacy-Gate sucht zusätzlich nach den Namen der eigenen internen Ablagen. Sie sind keine\n  Secrets, lösen daher keinen Alarm aus und überleben ein Gate, das nur auf Pfade und Token\n  zielt — bleiben für Leser aber unauflösbar und geben die eigene Struktur preis.\n\n### 1.1.0 (2026-07-24)\n- Sperren werden gelesen statt pauschal als Verbot behandelt: eine reine Veröffentlichungs-/\n  Push-Sperre leitet die Runde auf einen lokalen Branch um, statt sie abzubrechen. Zugleich\n  klargestellt, dass unter einer solchen Sperre auch Metadaten, Releases und Issue-/PR-Aktionen\n  entfallen — sie sind ebenso remote sichtbar wie ein Push.\n\n### 1.0.0 (2026-07-24)\n- Initiale Version. Stufe 1 der Repo-Nachpflege, abgeleitet aus `github-repo-care`.\n"}, {"id": "skill:infrastructure:system-onboarding", "name": "system-onboarding", "cat": "infrastructure", "ver": "1.2.0", "status": "active", "desc": "Provider-neutral onboarding protocol for a new, rebuilt, or replacement workstation. It establishes the operating-system prerequisites, agent runtimes, shared rule surfaces, portable skills, verified configuration and post-install evidence without copying credentials, private prompts, or host-specific configuration into a repository.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: system-onboarding\nversion: 1.2.0\ntype: skill\nauthor: ellmos contributors\ncreated: 2026-05-16\nupdated: 2026-07-29\ndescription: >\n  Provider-neutral onboarding protocol for a new, rebuilt, or replacement workstation.\n  It establishes the operating-system prerequisites, agent runtimes, shared rule\n  surfaces, portable skills, verified configuration and post-install evidence without\n  copying credentials, private prompts, or host-specific configuration into a repository.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: false\ncategory: infrastructure\ntags: [onboarding, setup, agent-runtimes, windows, macos, verification, sync]\nlanguage: en\nstatus: active\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\nprovenance:\n  origin: \"custom\"\n  origin_path: \"internal onboarding protocol (sanitized for portable publication)\"\n  origin_version: \"1.2.0\"\n  last_sync_from_origin: \"2026-07-29\"\n  last_sync_to_origin: null\n  local_changes_since_sync: false\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"system-onboarding banner\">\n\n# System Onboarding\n\nUse this protocol to establish a new or rebuilt workstation for local-first agent\nwork. It is a sequencing and verification guide, not an installer and not a source\nof credentials. Resolve product-specific instructions from each provider's current\ndocumentation before changing a live system.\n\n## Activation\n\nUse for a new workstation, a reinstalled operating system, a replacement device, or\na controlled recovery of one agent runtime. First identify the operating system,\ntarget runtime, owner, shared rule surface, and whether the request is a full rebuild\nor a bounded component repair. Do not assume that a configuration copied from one\nhost is safe or supported on another.\n\n## Ordered workflow\n\n1. Establish operating-system updates, Git, authenticated source control, Python and\n   the current supported Node.js LTS where needed.\n2. Install only the requested agent runtimes through their supported installers and\n   complete their native login flows without placing tokens in project files.\n3. Create local configuration roots and load an explicitly selected, canonical rule\n   surface. Merge templates; never overwrite existing local state blindly.\n4. Install portable skills and MCP or plugin configuration only through their stated\n   deployment procedures. Treat each provider's configuration format as distinct.\n5. Configure shared synchronization only after the local runtime works. Share\n   sanitized contracts and receipts, not credentials, full prompts, or machine-local\n   paths.\n6. Recreate a scheduler or automation only through its supported native surface.\n   Preserve prior state and leave new work disabled until its owner approves activation.\n7. Run the appropriate post-install checks and write a local receipt that distinguishes\n   installation, configuration, scheduler registration and successful outcome.\n\nRead only the matching reference for the target platform:\n\n- [overview](references/overview.md) for boundaries and data placement;\n- [Windows checklist](references/windows-checklist.md) for Windows;\n- [macOS checklist](references/mac-checklist.md) for macOS; and\n- [post-install](references/post-install.md) for verification and recovery.\n\n## Boundaries\n\n- Never publish credentials, recovery codes, private prompts, account identifiers, or\n  raw logs to a shared repository or synchronization folder.\n- Keep virtual environments, dependency caches and large runtime artifacts out of\n  cloud-synchronized project folders.\n- Do not make a copied configuration authoritative. The target host must discover and\n  read back its own supported state.\n- Do not register a schedule merely because a task file exists. Native registration\n  and outcome evidence are separate requirements.\n- When an existing host is being repaired, inventory its current state and locks before\n  changing any configuration.\n\n## Completion evidence\n\nA complete onboarding receipt records the target operating system, selected runtimes,\ntheir verified versions, the canonical rule references loaded, the explicit skills or\nextensions deployed, unsupported capabilities, and any deferred user decisions. A\nsuccessful command exit alone is not evidence that an application loaded its new\nconfiguration or that a scheduled task achieved its intended outcome.\n\n## Changelog\n\n### 1.2.0 (2026-07-29)\n\n- Ported the reusable onboarding sequence and platform references into the public\n  skills catalog after removing host-specific paths, account details and private\n  operational material.\n"}, {"id": "skill:infrastructure:wayfinding-routing", "name": "wayfinding-routing", "cat": "infrastructure", "ver": "1.0.0", "status": "active", "desc": "Universal LLM navigation, orientation, and emergency resilience skill. Provides active wayfinding, self-orientation, and recovery heuristics when agents face context drift, failing tools, loops, or dead ends. Includes synonym strategies: survival-routing, dead-reckoning, pathfinder-routing, and celestial-routing.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: wayfinding-routing\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger + Gemini (Antigravity)\ncreated: 2026-07-29\nupdated: 2026-07-29\ndescription: >\n  Universal LLM navigation, orientation, and emergency resilience skill.\n  Provides active wayfinding, self-orientation, and recovery heuristics when\n  agents face context drift, failing tools, loops, or dead ends. Includes\n  synonym strategies: survival-routing, dead-reckoning, pathfinder-routing,\n  and celestial-routing.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: false\ncategory: infrastructure\ntags: [wayfinding, wayfinding-routing, survival-routing, dead-reckoning, pathfinder-routing, celestial-routing, self-orientation, resilience, recovery, heuristics]\nlanguage: en\nstatus: active\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\nprovenance:\n  origin: \"custom\"\n  origin_path: null\n  origin_version: null\n  origin_repo: \"github.com/ellmos-ai/skills\"\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"wayfinding-routing banner\">\n\n# Wayfinding-Routing (Self-Orientation & Emergency Fallback Engine)\n\nThe **Wayfinding-Routing** skill (also known as **`survival-routing`**, **`dead-reckoning`**, **`pathfinder-routing`**, and **`celestial-routing`**) serves as the definitive navigation and emergency recovery framework for LLM agents.\n\nIt equips agents with proactive wayfinding heuristics during normal execution and emergency protocols when encountering context drift, recurring execution errors, failing APIs, or dead ends.\n\n---\n\n## Synonym & Strategy Overview\n\n| Synonym Strategy | Metaphor & Core Principle | Applied Use Case |\n| :--- | :--- | :--- |\n| **`wayfinding-routing`** (Primary) | **Wayfinding / Spatial Orientation:** Navigating without external GPS by reading signposts and environmental cues. | Primary navigation loop for sidecars, `workflowhooker`, and `automation-self-care`. |\n| **`survival-routing`** | **Emergency Fallback & Self-Preservation:** Circuit-breaking and graceful degradation when tools fail or loops form. | Emergency recovery when commands time out, fail repeatedly, or hit permission walls. |\n| **`dead-reckoning`** | **Nautical Dead Reckoning (Koppelnavigation):** Reconstructing exact state from step-by-step breadcrumbs without external status. | Tracking execution steps in scratch files or `TODO.md` to enable precise backtracking. |\n| **`pathfinder-routing`** | **Scout / Pathfinder Trailblazing:** Preflight scanning and paving paths for multi-agent teams. | Preflight inspection of directory trees, locks, and task dependencies. |\n| **`celestial-routing`** | **Astronavigation:** Aligning with immutable North-Star anchor documents when local context is noisy. | Fallback to `CLAUDE.md`, `AGENTS.md`, `START.md` when prompt instructions conflict. |\n\n---\n\n## The 5 Core Emergency & Orientation Protocols\n\n### 1. `PROTOCOL-ANCHOR-RESET` (North-Star Fallback / Celestial Routing)\n- **Trigger:** Context drift, conflicting user instructions, or loss of orientation in long multi-turn sessions.\n- **Heuristic Rule:** Stop free text generation. Clear transient assumptions. Re-read root anchor documents (`CLAUDE.md`, `AGENTS.md`, `START.md`). Reset goal state to the authoritative root directive before taking further action.\n\n### 2. `PROTOCOL-STOP-EXPLAIN` (Rubber-Duck Reflection Loop)\n- **Trigger:** A terminal command, file edit, or API request fails twice with an identical error.\n- **Heuristic Rule:** **Lock command execution.** The agent MUST output a formal self-reflection before trying a 3rd attempt:\n  1. *What exact error occurred in attempt 1 & 2?*\n  2. *Why did the previous diagnostic hypothesis fail?*\n  3. *What is the new alternative approach?*\n  Execution is unlocked ONLY after writing this explicit justification.\n\n### 3. `PROTOCOL-GRACEFUL-DEGRADATION` (Multi-Tiered Fallback Cascade)\n- **Trigger:** Primary tool, MCP server, or external API is unavailable or returns errors.\n- **Heuristic Rule:** Never fail abruptly or loop blindly. Step down through degradation tiers:\n  - **Tier 1 (Optimal):** Full Native API / MCP Tool\n  - **Tier 2 (Fallback Tool):** Local Python CLI / Script\n  - **Tier 3 (Read-Only State):** Direct file parsing (`view_file` / raw text)\n  - **Tier 4 (Handoff):** Present structured status report and open options to the user.\n\n### 4. `PROTOCOL-BREADCRUMB-BACKTRACK` (Dead-Reckoning & Sackgassen-Erkennung)\n- **Trigger:** A complex multi-step refactoring or workflow path hits an unresolvable block at step N.\n- **Heuristic Rule:** Record breadcrumbs before making destructive changes. If a path fails:\n  1. Revert uncommitted changes (`git checkout` / restore state).\n  2. Jump back to the last clean breadcrumb checkpoint.\n  3. Mark the failed route as blocked in `TODO.md`.\n  4. Attempt alternative path B.\n\n### 5. `PROTOCOL-CIRCUIT-BREAKER` (Notaus & Safe Exit)\n- **Trigger:** Execution limits reached, infinite loop detected, or critical system lock error.\n- **Heuristic Rule:** Execute emergency shutdown sequence:\n  1. Release all acquired file and git locks (`python -m workflowhooker check`).\n  2. Save current partial state to `.SYNC/SURVIVAL_STATE.json` or `AUTOMATIONS-MEMORY.md`.\n  3. Log incident in `ANTIGRAVITY-LOG.txt`.\n  4. Exit cleanly with actionable summary for the user or orchestrator.\n\n---\n\n## Integration with `automation-self-care` & `workflowhooker`\n\n`wayfinding-routing` provides the underlying navigation logic for:\n- **`automation-self-care`**: Evaluates sidecar prompts against the 5 protocols to ensure self-healing capabilities.\n- **`workflowhooker`**: Provides standard heuristics for step-by-step lock checking and breadcrumb recording.\n- **`staircase-routing`**: Leverages `PROTOCOL-ANCHOR-RESET` for vertical directory navigation.\n"}, {"id": "skill:production:textproduction", "name": "textproduction", "cat": "production", "ver": "0.0.0", "status": "active", "desc": "", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nlanguage: de\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"textproduction banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n> **English Translation** — Official English version of `textproduction`.\n\n\n# Textproduction — Router (Deutsch)\n\nDieser Skill deckt alle textlichen Produktionsformen ab. Er leitet an den\npassenden Teilskill weiter — lies die Detail-Anleitung im Unterordner.\n\n## Routing-Tabelle\n\n| Teilskill | Trigger-Beispiele | Detail-Anleitung |\n|---|---|---|\n| **text** | „Schreib einen Blogpost\", „5 LinkedIn-Posts\", „Newsletter\", „Produktbeschreibung\", „Formelle E-Mail\", „Fasse X zusammen\" | `text/WORKFLOW.md` |\n| **storys** | „Schreib ein Drehbuch\", „Kurzgeschichte\", „RPG-Abenteuer erstellen\", „Character Sheet\", „Weltenbau\" | `storys/WORKFLOW.md` |\n| **pr** | „Pressemitteilung verfassen\", „Positionspapier\", „PR-Paket\", „PDF generieren\" | `pr/WORKFLOW.md` (+ `pr/press_compiler.py`) |\n\n## Workflow & Vorgehen\n\n```\n1. Nutzerwunsch → Routing-Tabelle oben → passenden Teilskill bestimmen.\n2. Detail-Anleitung im Unterordner lesen (WORKFLOW.md).\n3. Prompt-Muster auswaehlen, Platzhalter fuellen, Text generieren.\n4. Qualitaetspruefung (je Teilskill angegeben).\n```\n\n## Hinweise\n\n- **Userneutral:** Keine persoenlichen Daten, API-Keys oder Kontodaten im Skill.\n  Konfiguration (Tonalitaet, Zeichenlimits, Kontaktdaten fuer PR) obliegt dem Nutzer.\n- **PR-Tool:** `pr/press_compiler.py` kompiliert Pressemitteilungen und Positionspapiere\n  zu PDF via LaTeX (pdflatex/xelatex). Setup einmalig: `pr/config.example.json`\n  nach `pr/config.json` kopieren und Kontaktdaten eintragen.\n- Optionale Stiloptimierung: DeepL Write (kostenlos bis 500.000 Zeichen/Monat).\n\n## Änderungsprotokoll\n\n### 2.0.0 (2026-06-22)\n- Umstrukturierung auf Router-Muster: SKILL.md = Einstieg + Routing-Tabelle.\n- Drei Teilskills: text/ (6 Texttypen), storys/ (4 narrative Formate),\n  pr/ (Pressemitteilung + Positionspapier + LaTeX-PDF-Compiler).\n- press_compiler.py + LaTeX-Templates + config.example.json aus\n  ai-media-editor/production/pr/ hierher verschoben (SSOT).\n- Verwandte-Skills-Verweise auf interne Teilskill-Pfade aktualisiert.\n\n### 1.0.0 (2026-06-22)\n- Initiale Version. Herausgeloest aus ai-media-editor/production/text/WORKFLOW.md.\n- Provenance: BACH agents/_experts/textproduction/ (MIT)."}, {"id": "tool:research:research-agent", "name": "research-agent", "cat": "research", "ver": "0.1.0", "status": "active", "desc": "Research pipeline for PubMed and arXiv. Quick search and structured literature reviews using pure Python standard library.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: research-agent\nversion: 0.1.0\ntype: tool\nauthor: BACH Team\ncreated: 2026-02-21\nupdated: 2026-03-12\ndescription: Research pipeline for PubMed and arXiv. Quick search and structured literature reviews using pure Python standard library.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: true\ncategory: research\ntags: [pubmed, arxiv, literature-review, research, science]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'MODULAR_AGENTS/ResearchAgent', 'origin_version': '0.1.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"research-agent banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Research Agent (Deutsch)\n\nModular research pipeline for scientific literature search.\nUses exclusively Python standard library (urllib, xml, json).\n\n## Architecture\n\n```\nResearchAgent (Orchestrator)\n  sources/          Data sources (PubMed, arXiv)\n    base.py         Article/SearchResult dataclasses, Source ABC\n    pubmed.py       NCBI E-utilities (esearch + efetch)\n    arxiv.py        arXiv Atom API\n  workflows/        Research workflows\n    quick_search.py Quick search across multiple sources\n    literature_review.py  4-phase literature review\n```\n\n## Usage as Python Library\n\n```python\nfrom scripts.agent import ResearchAgent\n\nagent = ResearchAgent()\n\n# Quick search (Deutsch)\nresult = agent.search(\"machine learning diagnostics\", max_results=10)\nprint(result)\n\n# Structured literature review (Deutsch)\nplan = agent.create_review_plan(\"transformer architectures\", years=3)\nprint(plan.total_articles, \"articles found\")\n\n# Save result (Deutsch)\nagent.save_result(result, \"research_ml.md\", fmt=\"markdown\")\n```\n\n## Usage as CLI\n\n```bash\ncd scripts\npython -m ResearchAgent search \"quantum computing\" --max 20\npython -m ResearchAgent review \"CRISPR gene editing\" --years 5\n```\n\n## Data Sources\n\n| Source | API | Rate Limit | Access |\n|--------|-----|------------|--------|\n| PubMed | NCBI E-utilities | 3/s (without key), 10/s (with key) | Free |\n| arXiv | Atom REST API | None documented | Free |\n\nExtensible: New sources implement the `Source` ABC from `sources/base.py`.\n\n## Extension\n\n```python\nfrom scripts.sources.base import Source, SearchResult\n\nclass MySource(Source):\n    @property\n    def name(self) -> str:\n        return \"my-source\"\n\n    def search(self, query, max_results=10, **kwargs):\n        # Implement API query\n        ...\n\n    def get_article(self, article_id):\n        ...\n\n    def is_available(self) -> bool:\n        return True\n```\n\n## BACH Notes\n\n> Only relevant when used within BACH.\n\n```python\nfrom scripts.agent import ResearchAgent\nagent = ResearchAgent(use_bach=True)  # Optional BACH integration\n```\n\n## Änderungsprotokoll\n\n### 0.1.0 (2026-03-12)\n- Migration from MODULAR_AGENTS/ResearchAgent to skill library\n- PubMed + arXiv sources\n- QuickSearch + LiteratureReview workflows"}, {"id": "skill:therapy:act-techniques", "name": "act-techniques", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Acceptance & Commitment Therapy (ACT) according to Steven Hayes: Hexaflex model with the six core processes of psychological flexibility.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: act-techniques\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Acceptance & Commitment Therapy (ACT) according to Steven Hayes: Hexaflex model with the six core processes of psychological flexibility.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [act, acceptance, defusion, values, psychological-flexibility, hayes]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/act_techniken.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"act-techniques banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# ACT Techniques — Acceptance & Commitment Therapy (Deutsch)\n\n## Foundation\n\nAcceptance & Commitment Therapy (ACT, pronounced as the word \"act\") was developed by **Steven C. Hayes** and belongs to the third wave of behavioral therapy. ACT does not aim at symptom reduction, but at **psychological flexibility** — the ability to act openly and consciously in the present moment, guided by personal values.\n\nCore message: **The pain is not the problem — the struggle against the pain is.**\n\n---\n\n## The Hexaflex Model\n\nThe Hexaflex is the central model of ACT. Six core processes together form psychological flexibility. Each process is the counterpart to a pathological process (psychological inflexibility).\n\n```\n                    Present Moment\n                         /    \\\n                        /      \\\n              Acceptance          Self-as-Context\n                |    \\          /    |\n                |  PSYCHOLOGICAL |\n                |  FLEXIBILITY   |\n                |  /          \\     |\n              Defusion          Values\n                        \\      /\n                         \\    /\n                    Committed Action\n```\n\n### Flexibility vs. Inflexibility\n\n| Core Process (flexible) | Counterpart (inflexible) |\n|---|---|\n| Acceptance | Experiential avoidance |\n| Cognitive Defusion | Cognitive fusion |\n| Present Moment Awareness | Past/future focus |\n| Self-as-Context | Conceptualized self |\n| Values | Lack of values clarity |\n| Committed Action | Inaction/impulsivity |\n\n---\n\n## The Six Core Processes\n\n### 1. Acceptance\n\n**Definition:** Willingness to allow inner experiences (feelings, thoughts, bodily sensations) without trying to change, avoid, or control them.\n\n**Important:** Acceptance is NOT resignation. It is an active, conscious decision to make room for experience.\n\n#### Techniques\n\n- **Willingness Scale (0-10):** \"How willing are you right now to just let this feeling be there?\"\n- **Expansion:** Locate the feeling in the body, give it shape/color/texture, let it \"breathe\"\n- **Struggle Switch Metaphor:** There's a switch inside us — not for pain, but for the struggle against pain. Acceptance means flipping the struggle switch.\n\n#### Metaphor: Quicksand\n\n> If you've fallen into quicksand, the natural instinct is to fight, resist, thrash. But that's exactly what pulls you deeper. The only helpful thing: Lie flat, increase the surface area, accept contact with the quicksand. Not because quicksand is great — but because the struggle against it is the real problem.\n\n---\n\n### 2. Cognitive Defusion\n\n**Definition:** Detaching from thoughts — seeing them for what they are: mental events, not reality itself. Instead of \"I am worthless\" -> \"I am having the thought that I am worthless.\"\n\n#### Techniques\n\n- **\"I am having the thought that...\"** — Linguistically distance thoughts\n- **\"Thank you, mind!\"** — Acknowledge the mind as an overactive advisor without obeying it\n- **Singing thoughts:** Sing the distressing thought to the melody of \"Happy Birthday\" (reduces its credibility)\n- **Leaves on a stream:** Imagine a stream. Place each thought on a leaf and let it float by\n- **Passenger naming:** Give the inner critic a name (\"Ah, there's Perfectionist Pete again\")\n- **Repetition exercise:** Rapidly repeat a distressing word for 30 seconds — it loses its emotional charge\n\n#### Metaphor: The Uninvited Guest\n\n> Imagine you're throwing a party and an uninvited guest shows up. You have three options: (1) You throw them out — but they keep coming back and making noise. (2) You let them in and spend the whole evening monitoring them — then you miss your own party. (3) You let them in, acknowledge they're there, and continue enjoying your party. Option 3 is defusion.\n\n---\n\n### 3. Present Moment Awareness (Contact with the Present Moment)\n\n**Definition:** Intentional, non-judgmental attention to the here and now. Neither ruminating about the past nor worrying about the future.\n\n#### Techniques\n\n- **5-4-3-2-1 Exercise:** 5 things you see, 4 you hear, 3 you feel, 2 you smell, 1 you taste\n- **Breath awareness:** 3 conscious breaths — just observe, don't control\n- **Sensory anchoring:** Explore an object with full attention (texture, weight, temperature)\n- **Check-in questions:** \"What is happening in my body right now? What thoughts are here? What feelings?\"\n\n---\n\n### 4. Self-as-Context (Observing Self)\n\n**Definition:** Distinguishing between the self as content (\"I AM anxious\") and the self as context (\"I NOTICE anxiety\"). The observing self is the space in which all experiences occur — but it is not those experiences.\n\n#### Techniques\n\n- **Sky Metaphor:** \"You are the sky, not the weather. Clouds, storms, sunshine — everything passes through. But the sky is always there.\"\n- **Chessboard Metaphor:** \"You are not the white or black pieces. You are the board on which the game takes place.\"\n- **Observer Exercise:** Close your eyes. Observe thoughts. Observe feelings. Observe bodily sensations. Then: \"Who is it that observes all of this?\"\n- **Perspective Exercises:** \"If your 80-year-old self were to look back at this situation — what would they say?\"\n\n---\n\n### 5. Values\n\n**Definition:** Freely chosen life directions. Values are not goals (which can be achieved) but compass directions (which are followed). You never \"complete\" the value of \"being a loving partner\" — you live it, moment by moment.\n\n#### Values Clarification — Life Domains\n\n| Life Domain | Guiding Question |\n|---|---|\n| Relationships | What kind of partner/friend/family member do I want to be? |\n| Work/Career | What makes work meaningful to me? |\n| Personal Growth | In what direction do I want to develop? |\n| Health | How do I want to treat my body? |\n| Leisure/Recreation | What truly nourishes me? |\n| Spirituality | What gives my life deeper meaning? |\n| Community | What do I want to contribute to the world? |\n\n#### Techniques\n\n- **Tombstone Exercise:** \"What should be written on your tombstone? Not what you achieved, but what you stood for.\"\n- **Compass Exercise:** Determine a direction for each life domain and rate on a scale of 1-10: \"How important is this to me?\" and \"How much am I living this right now?\"\n- **Sweet Spot of Pain:** \"Behind every pain lies a value. Those who don't love can't be hurt. That it hurts shows that something matters to you.\"\n\n---\n\n### 6. Committed Action\n\n**Definition:** Concrete actions that align with one's own values. Not perfect, not \"when I'm ready,\" but NOW, with all difficulties.\n\n#### Techniques\n\n- **SMART Value-Goals:** Specific, Measurable, Attractive, Realistic, Time-bound — but always linked to a value\n- **Smallest possible step:** \"What is the smallest step you could take TODAY toward this value?\"\n- **Willingness check:** \"Are you willing to bring [unpleasant feeling] along if it shows up while you take this step?\"\n- **Plan for obstacles:** \"What inner barriers might arise? How do you want to handle them?\" (not: \"How will you eliminate them?\")\n\n#### Metaphor: Passengers on the Bus\n\n> You are the bus driver of your life. On the bus sit passengers — your thoughts, feelings, memories, bodily sensations. Some are loud, threatening, ugly. They shout: \"Turn right! Turn left! Stop!\" You have three options:\n>\n> 1. **Stop and fight:** You stop driving and try to throw the passengers out. But you don't move forward.\n> 2. **Negotiate:** You drive where the passengers want. But it's not YOUR direction.\n> 3. **Keep driving:** You let the passengers shout, take them along — and still drive in YOUR direction. The passengers are allowed to be there. But THEY don't determine the route.\n>\n> Committed action means: Driving the bus toward your values, no matter which passengers are on board.\n\n---\n\n## Areas of Application\n\nACT is evidence-based and effective for:\n\n- **Depression and anxiety disorders**\n- **Chronic pain**\n- **Substance use disorders**\n- **Eating disorders**\n- **Burnout and workplace stress**\n- **Trauma and PTSD** (complementary)\n- **Psychotic disorders** (complementary)\n\n---\n\n## When to Address Which Process?\n\n| User's Situation | Primary ACT Process |\n|---|---|\n| Avoids certain feelings/situations | Acceptance |\n| Trapped in rumination/worry | Defusion |\n| Living on autopilot, dissociated | Present Moment Awareness |\n| Defines self through problems (\"I AM...\") | Self-as-Context |\n| Feels directionless, meaningless | Values |\n| Knows what matters but doesn't act | Committed Action |\n\n---\n\n## Ethical Guidelines\n\nAn AI assistant may explain ACT techniques psychoeducationally and guide exercises.\n\nAn AI assistant must NOT:\n- Make diagnoses\n- Simulate a therapeutic relationship\n- Act alone in cases of acute suicidality — refer to professional help\n- Present ACT as a substitute for psychotherapy\n\nSee: [ETHICS.md](../ETHICS.md)\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n## References\n\n- Hayes, S. C., Strosahl, K. D., & Wilson, K. G. (2012). *Acceptance and Commitment Therapy: The Process and Practice of Mindful Change.* 2nd Edition.\n- Harris, R. (2009). *ACT Made Simple.*\n- Hayes, S. C. (2005). *Get Out of Your Mind and Into Your Life.*\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*"}, {"id": "skill:therapy:behavioral-activation", "name": "behavioral-activation", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Behavioral activation for depression: Breaking the vicious cycle, activity monitoring, weekly planning, and values-based activities.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: behavioral-activation\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Behavioral activation for depression: Breaking the vicious cycle, activity monitoring, weekly planning, and values-based activities.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [behavioral-activation, depression, activity, weekly-plan, values]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/verhaltensaktivierung.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"behavioral-activation banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Behavioral Activation (Deutsch)\n\n> Activity planning, mood-activity diary, and values-based activity selection: Counteracting the vicious cycle of inactivity and low mood\n\nSee: [ETHICS.md](../ETHICS.md)\n\n---\n\n## Context\n\nBehavioral Activation (BA) is an evidence-based intervention from behavioral therapy for treating depression. It is based on the insight that depression leads to withdrawal and inactivity, which further worsens mood (vicious cycle). Through targeted building of positive activities, this cycle is broken.\n\nEvidence: Behavioral activation is effective as a standalone therapy and is equivalent to cognitive therapy (Dimidjian et al. 2006, Richards et al. 2016 COBRA study). Recommended as first-line intervention for mild to moderate depression (NICE Guidelines).\n\n**Note:** This is support, not a substitute for professional therapy.\nFor severe depression or suicidal thoughts, ALWAYS recommend professional help.\n**Never implement:** EMDR, Prolonged Exposure (PE), Narrative Exposure Therapy (NET)\n\n---\n\n## 1. The Behavioral Activation Model of Depression\n\n### The Vicious Cycle\n\n```\nTriggering situation (loss, stress, change)\n        |\n        v\nLow mood, lack of energy\n        |\n        v\nWithdrawal, avoidance, inactivity\n        |\n        v\nFewer positive experiences, isolation\n        |\n        v\nEven deeper low mood\n        |\n        v\nEven more withdrawal ... (downward spiral)\n```\n\n### The Counter-Principle\n\n```\nTargeted activity (even with low motivation)\n        |\n        v\nPositive experience / sense of accomplishment / connection\n        |\n        v\nSlight mood improvement\n        |\n        v\nSomewhat more energy and motivation\n        |\n        v\nFurther activity ... (upward spiral)\n```\n\n**Core principle:** Don't wait for motivation to come — action creates motivation.\n\"Act first, feel second.\" (Not: \"Feel first, then act.\")\n\n---\n\n## 2. Mood-Activity Diary\n\n### Goal\nMake connections between activities and mood visible. Recognize which activities improve mood and which worsen it.\n\n### Diary Format\n\n```\nMOOD-ACTIVITY DIARY\n\nDate: [...]\n\n| Time  | Activity | Mood (0-10) | Enjoyment (0-10) | Importance (0-10) |\n|-------|----------|-------------|-------------------|---------------------|\n| 07:00 | Got up, had breakfast | 3 | 2 | 5 |\n| 08:00 | Work: emails | 4 | 1 | 6 |\n| 10:00 | Walk | 6 | 5 | 4 |\n| 12:00 | Lunch with colleague | 7 | 6 | 7 |\n| 14:00 | Work: project | 5 | 3 | 7 |\n| 18:00 | Watching TV (alone) | 3 | 2 | 1 |\n| 20:00 | Phone call with friend | 6 | 5 | 8 |\n\nDaily mood average: [...]\nBest activity today: [...]\nInsight: [...]\n```\n\n### Weekly Review\n\n**Guiding questions:**\n- Which activities regularly lift my mood?\n- Which activities lower my mood?\n- Are there times that are particularly difficult?\n- How much time do I spend on pleasant vs. unpleasant activities?\n- Which activities have I been avoiding?\n\n---\n\n## 3. Activity Planning\n\n### Step 1: Create Activity List\n\nCollect three categories of activities:\n\n**A) Pleasant Activities (joy, enjoyment)**\n- Nature: Walk, park, forest\n- Social: Meet friends, phone calls, cook together\n- Creative: Music, painting, writing, crafting\n- Physical: Sports, yoga, dancing, swimming\n- Enjoyment: Cook favorite meal, read a book, listen to music\n- Relaxation: Take a bath, meditation, breathing exercise\n\n**B) Necessary Activities (structure, self-care)**\n- Household: Tidying up, cooking, shopping\n- Personal care: Showering, getting dressed, brushing teeth\n- Administration: Bills, appointments, paperwork\n- Health: Doctor's appointments, medication, nutrition\n\n**C) Values-Based Activities (meaning, significance)**\n- See section 4 below\n\n### Step 2: Create Weekly Plan\n\n```\nWEEKLY PLAN\n\n| Day | Morning | Midday | Afternoon | Evening |\n|-----|---------|--------|-----------|---------|\n| Mon | [...]   | [...]  | [...]     | [...]   |\n| Tue | [...]   | [...]  | [...]     | [...]   |\n| Wed | [...]   | [...]  | [...]     | [...]   |\n| Thu | [...]   | [...]  | [...]     | [...]   |\n| Fri | [...]   | [...]  | [...]     | [...]   |\n| Sat | [...]   | [...]  | [...]     | [...]   |\n| Sun | [...]   | [...]  | [...]     | [...]   |\n```\n\n### Planning Rules\n1. **Start small:** Don't plan the whole day, but 1-2 activities per day\n2. **Mix:** Pleasant + necessary + values-based\n3. **Specific:** \"Tuesday 3:00 PM walk in the park\" instead of \"Move more\"\n4. **Realistic:** Achievable even with low energy\n5. **Flexible:** Plan is guidance, not obligation\n6. **Graduated:** For very low energy: mini-steps (5 minutes is enough)\n\n### Dealing with Obstacles\n\n| Obstacle | Strategy |\n|----------|----------|\n| \"I have no energy\" | Reduce activity to 5 minutes |\n| \"I don't feel like it\" | Reminder: motivation comes through action |\n| \"It won't help anyway\" | Experiment: try it and measure mood afterward |\n| \"I can't do it alone\" | Involve someone (appointment = commitment) |\n| \"I don't have time\" | Build in small activities (take stairs, 5 min break outside) |\n\n---\n\n## 4. Values-Based Activity Selection\n\n### Principle\nActivities that align with personal values create sustainable well-being — as opposed to mere pleasure, which fades quickly.\n\n### Life Domains and Values\n\n```\nVALUES COMPASS\n\nRelationships:     What kind of partner/friend/family member do I want to be?\nWork/Education:    What is important to me about my work?\nLeisure:           How do I want to spend my free time?\nHealth:            How do I want to treat my body?\nCommunity:         What contribution do I want to make?\nPersonal:          What kind of person do I want to be?\n```\n\n### Values-Activity Mapping\n\n**Example:**\n\n| Value | Activity | Frequency |\n|-------|----------|-----------|\n| Connection | Call a friend | 2x per week |\n| Health | 20 min walk | Daily |\n| Creativity | Play guitar | 1x per week |\n| Helpfulness | Help neighbor with shopping | 1x per week |\n| Learning | 15 min reading non-fiction | 3x per week |\n\n### Values vs. Goals\n- **Value:** A direction you want to move toward (e.g., \"being a loving partner\")\n- **Goal:** An achievable endpoint (e.g., \"plan anniversary celebration\")\n- Values can never be \"checked off\" — they provide ongoing orientation\n\n---\n\n## 5. Measuring Progress\n\n### Weekly Review\n\n```\nWEEKLY REVIEW\n\nWeek: [Date]\nPlanned activities: [Number]\nCompleted activities: [Number]\nAverage mood: [0-10]\n\nWhat went well: [...]\nWhat was difficult: [...]\nInsight of the week: [...]\nPlan for next week: [...]\n```\n\n### Long-Term Tracking\n- Observe mood trends over weeks\n- Recognize the connection between activity level and mood\n- Make successes visible (even small ones)\n\n---\n\n## Ethics and Boundaries\n\n**An AI assistant may:**\n- Guide through the diary and activity planning\n- Suggest activities (never prescribe)\n- Document mood data and reflect back patterns\n- Accompany values reflection\n- Acknowledge small progress\n\n**An AI assistant must NOT:**\n- Be the sole support for severe depression\n- Make medication-related recommendations\n- Assess suicidality\n- Make diagnoses\n- Guarantee that behavioral activation is sufficient\n\n**Important:** For severe depression (persistent lack of drive, suicidal thoughts, inability to manage daily life), professional help is essential. Behavioral activation is a complement, not a substitute.\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*\n*Sources: Martell et al. (2010), Dimidjian et al. (2006), Richards et al. (2016) — Not professional therapy*"}, {"id": "skill:therapy:cognitive-restructuring", "name": "cognitive-restructuring", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Cognitive Behavioral Therapy: ABC model, automatic thoughts, identifying cognitive distortions, and keeping thought records.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: cognitive-restructuring\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Cognitive Behavioral Therapy: ABC model, automatic thoughts, identifying cognitive distortions, and keeping thought records.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [cbt, cognitive-restructuring, cognitive-distortions, thought-record, abc-model]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/kognitive_umstrukturierung.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"cognitive-restructuring banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Cognitive Restructuring (Deutsch)\n\n> Core CBT technique: ABC schema, identifying and modifying dysfunctional thoughts\n\nSee: [ETHICS.md](../ETHICS.md)\n\n---\n\n## Context\n\nCognitive restructuring is a core technique of Cognitive Behavioral Therapy (CBT). It helps identify automatic negative thoughts, challenge them, and replace them with more helpful alternatives.\n\n**Note:** This is support, not a substitute for professional therapy.\n**Never implement:** EMDR, Prolonged Exposure (PE), Narrative Exposure Therapy (NET)\n\n---\n\n## 1. ABC Model (Ellis)\n\nThe ABC model explains how events, thoughts, and feelings are connected.\n\n```\nA (Activating Event)   ->  B (Beliefs / Thoughts)  ->  C (Consequences / Feelings/Behavior)\nTrigger                     Evaluation / Belief           Emotional consequence\n```\n\n**Important:** It is not the event (A) that creates the emotion (C), but the evaluation (B)!\n\n**Example:**\n```\nA: Boss criticizes a report in a meeting\nB: \"I am incompetent, everyone thinks so now\"\nC: Shame, withdrawal, avoiding future contributions\n```\n\n**Goal:** Change B to influence C.\n\n---\n\n## 2. Identifying Automatic Negative Thoughts (ANTs)\n\n**What are ANTs?**\n- Quick, automatic evaluations in stressful situations\n- Often perceived as facts, although they are interpretations\n- Tend toward exaggeration, generalization, catastrophizing\n\n**Typical recognition features:**\n- Absolute thinking: \"always,\" \"never,\" \"everyone,\" \"nobody\"\n- Catastrophizing: \"This will end terribly\"\n- Mind reading: \"They must think that...\"\n- Overgeneralization: \"This never works for me\"\n\n**Recognition questions:**\n- \"What went through your mind when that happened?\"\n- \"When you think about the situation, what words come up?\"\n- \"What do you fear might happen?\"\n\n---\n\n## 3. Cognitive Distortions (Thinking Errors)\n\n| Distortion | Description | Example |\n|------------|-------------|---------|\n| All-or-nothing | Black-and-white thinking | \"If I'm not perfect, I'm a failure\" |\n| Overgeneralization | One case = general pattern | \"This always goes wrong for me\" |\n| Mental filter | Only perceiving negatives | Focusing on the single criticism in feedback |\n| Mind reading | Believing to know what others think | \"They surely hate me\" |\n| Catastrophizing | Assuming the worst case | \"This will be a catastrophe\" |\n| Emotional reasoning | Feeling = reality | \"I feel stupid, so I am stupid\" |\n| Should/must thinking | Rigid rules | \"I should be able to do this\" |\n| Personalization | Relating everything to oneself | \"The bad project was my fault\" |\n\n---\n\n## 4. Challenging Thoughts (Socratic Questioning)\n\n**Goal:** Not directly refute thoughts, but encourage examination.\n\n**Question set:**\n\n1. **Examine evidence:**\n   - \"What evidence is there for this?\"\n   - \"What evidence speaks against it?\"\n\n2. **Alternative explanations:**\n   - \"Are there other explanations for this?\"\n   - \"How would someone else view this situation?\"\n\n3. **Assess consequences:**\n   - \"What is the worst that could happen? How likely is that?\"\n   - \"What is the best that could happen?\"\n   - \"What is the most realistic outcome?\"\n\n4. **Check usefulness:**\n   - \"Does this thought help me achieve my goals?\"\n   - \"What would I say to a good friend who thinks this way?\"\n\n---\n\n## 5. Cognitive Restructuring Step by Step\n\n### Record Format (Thought Record)\n\n```\nSITUATION\nWhat happened? (When? Where? Who was there?)\n[Free text]\n\nTHOUGHT\nWhat went through my mind?\nAutomatic thought: [...]\nHow much do I believe it? (0-100%): [...]%\n\nEMOTION\nWhat emotions did I have?\nEmotion: [...]    Intensity (0-100%): [...]%\n\nCOGNITIVE DISTORTION\nWhich cognitive distortions are involved?\n[List from table above]\n\nEXAMINE\nEvidence for: [...]\nEvidence against: [...]\nAlternative perspective: [...]\n\nALTERNATIVE THOUGHT\nMore balanced, realistic thought:\n[...]\nHow much do I believe it? (0-100%): [...]%\n\nRESULT\nEmotion afterward: [...]   Intensity: [...]%\nTakeaway: [...]\n```\n\n---\n\n## 6. Behavioral Activation\n\n**Supplement to cognitive work:** Changing behavior supports thought change.\n\n**Principle:** Positive activities -> Better mood -> More helpful thoughts\n\n**Steps:**\n1. Create list of pleasant/meaningful activities\n2. Plan activities (specifically: when, how, where)\n3. Track implementation\n4. Rate mood before/after\n\n**Example activities:**\n- Walk (nature, fresh air)\n- Contact with important people\n- Creative activities\n- Physical exercise\n- Things that used to bring joy\n\n---\n\n## Ethics and Boundaries\n\n**An AI assistant may:**\n- Explain cognitive distortions and the ABC model\n- Ask Socratic questions\n- Guide thought records\n- Provide psychoeducation about CBT techniques\n\n**An AI assistant must NOT:**\n- Replace professional cognitive behavioral therapy\n- Make diagnoses or treatment recommendations\n- Conduct crisis intervention\n- Apply EMDR, Prolonged Exposure (PE), or Narrative Exposure Therapy (NET)\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n## References\n\n- Beck, A. T. (1979). *Cognitive Therapy and the Emotional Disorders.* Penguin Books.\n- Ellis, A. (1962). *Reason and Emotion in Psychotherapy.* Lyle Stuart.\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*\n*Sources: Beck (1979), Ellis (1962) — Not professional therapy*"}, {"id": "skill:therapy:counseling-basics", "name": "counseling-basics", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Fundamentals of therapeutic communication: Active listening, mirroring, paraphrasing, open questions, and validation.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: counseling-basics\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Fundamentals of therapeutic communication: Active listening, mirroring, paraphrasing, open questions, and validation.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [counseling, active-listening, communication, therapy]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/gespraechsfuehrung_basis.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"counseling-basics banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Counseling Basics (Deutsch)\n\n> Fundamentals of therapeutic communication: Active listening, mirroring, paraphrasing\n\nSee: [ETHICS.md](../ETHICS.md)\n\n---\n\n## Context\n\nThis template describes basic therapeutic communication te
