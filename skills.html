, and coping styles — psychoeducationally presented.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: schema-therapy\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-15\nupdated: 2026-03-15\ndescription: Schema Therapy according to Jeffrey Young: Schemas, modes, inner child concept, and coping styles — psychoeducationally presented.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [schema-therapy, modes, inner-child, coping-styles, personality]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/schematherapie.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-15', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"schema-therapy banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Schema Therapy (Deutsch)\n\n> Fundamentals of Schema Therapy according to Jeffrey Young: Schemas, modes, inner child concept, and coping styles — psychoeducationally presented\n\nSee: [ETHICS.md](../ETHICS.md)\n\n---\n\n## Context\n\nSchema Therapy was developed by Jeffrey E. Young from the 1990s onward as an extension of cognitive behavioral therapy. It integrates elements from CBT, attachment theory, Gestalt therapy, and psychodynamic approaches.\n\nEvidence: Schema Therapy is well supported empirically, particularly for personality disorders (Giesen-Bloo et al. 2006, Masley et al. 2012). In Germany, it is recognized as a method within behavioral therapy.\n\n**Note:** This is psychoeducation, not a substitute for professional therapy.\n**Never implement:** EMDR, Prolonged Exposure (PE), Narrative Exposure Therapy (NET)\n\n---\n\n## 1. Early Maladaptive Schemas\n\n### Principle\nSchemas are deeply rooted emotional and cognitive patterns that develop in childhood through unmet core needs. They influence how we perceive the world, ourselves, and others.\n\n### The Five Core Needs (according to Young)\n\n| Core Need | When Unmet, May Lead To |\n|-----------|------------------------|\n| Secure attachment | Abandonment, mistrust |\n| Autonomy & competence | Dependence, fear of failure |\n| Realistic limits | Entitlement, insufficient self-control |\n| Freedom to express needs | Subjugation, self-sacrifice |\n| Spontaneity & play | Unrelenting standards, punitiveness |\n\n### The 18 Schemas — Overview (5 Domains)\n\n**Domain 1: Disconnection and Rejection**\n- Abandonment / Instability\n- Mistrust / Abuse\n- Emotional Deprivation\n- Defectiveness / Shame\n- Social Isolation\n\n**Domain 2: Impaired Autonomy and Performance**\n- Dependence / Incompetence\n- Vulnerability to Harm\n- Enmeshment / Undeveloped Self\n- Failure\n\n**Domain 3: Impaired Limits**\n- Entitlement / Grandiosity\n- Insufficient Self-Control\n\n**Domain 4: Other-Directedness**\n- Subjugation\n- Self-Sacrifice\n- Approval-Seeking\n\n**Domain 5: Overvigilance and Inhibition**\n- Negativity / Pessimism\n- Emotional Inhibition\n- Unrelenting Standards\n- Punitiveness\n\n### Reflection Questions for Schema Recognition\n- \"What beliefs about yourself keep coming up again and again?\"\n- \"In which situations do you react particularly strongly emotionally?\"\n- \"Do you notice patterns that repeat across different relationships?\"\n- \"Which needs may have been insufficiently met in your childhood?\"\n\n---\n\n## 2. The Mode Model\n\n### Principle\nModes are momentary emotional states activated by schemas. The mode model helps understand and categorize different \"inner parts.\"\n\n### The Four Mode Categories\n\n**Child Modes:**\n- *Vulnerable Child:* Feels sad, lonely, anxious, overwhelmed\n- *Angry Child:* Angry about unmet needs\n- *Impulsive Child:* Acts without thinking, wants immediate gratification\n- *Happy Child:* Feels safe, loved, spontaneous\n\n**Maladaptive Parent Modes:**\n- *Punitive Parent:* Inner voice that criticizes, punishes, devalues\n- *Demanding Parent:* Inner voice that demands perfection and achievement\n\n**Maladaptive Coping Modes:**\n- *Compliant Surrender:* Gives in, adapts excessively\n- *Detached Protector:* Numbs feelings, withdraws, distracts\n- *Overcompensation:* Dominates, controls, attacks\n\n**Healthy Adult:**\n- Can perceive needs and meet them appropriately\n- Sets healthy boundaries\n- Comforts and soothes the vulnerable child\n- Limits excessive parent modes\n\n### Exercise: Recognizing Modes in Daily Life\n\n```\nSituation: ______________\nWhich mode am I feeling right now?\n  [ ] Vulnerable Child — \"I feel small and helpless\"\n  [ ] Angry Child — \"That's unfair!\"\n  [ ] Punitive Parent — \"You're not good enough\"\n  [ ] Demanding Parent — \"You must do more\"\n  [ ] Detached Protector — \"I don't want to think about it\"\n  [ ] Overcompensator — \"I'll show them\"\n  [ ] Healthy Adult — \"What do I really need right now?\"\n```\n\n---\n\n## 3. Inner Child Work (Psychoeducational)\n\n### Principle\nInner child work in Schema Therapy aims to develop a caring inner attitude toward one's own vulnerable parts.\n\n**CAUTION:** Deep inner child work belongs in professional therapeutic supervision.\n\n### Reflection Exercise: Letter to the Inner Child\n\n```\nWrite a brief letter to your younger self:\n1. What would you have needed back then?\n2. What would you say to that child today?\n3. What comfort would you offer?\n```\n\n### Reflection Questions\n- \"When you think about that situation — how old do you feel inside?\"\n- \"What would a caring adult have said to you back then?\"\n- \"Which needs of the child within you are currently going unmet?\"\n\n---\n\n## 4. Understanding Coping Styles\n\n### The Three Basic Patterns\n\n| Coping Style | Strategy | Example |\n|-------------|----------|---------|\n| Surrender | Accept the schema, submit | \"That's just how I am, I can't change it\" |\n| Avoidance | Not wanting to feel the schema | Distraction, substance use, overwork |\n| Overcompensation | Living the opposite of the schema | Perfectionism instead of feeling like a failure |\n\n### Reflection Questions\n- \"When you're under pressure — do you tend to submit, flee, or fight?\"\n- \"Which of your habits might be avoidance strategies?\"\n- \"Are there areas where you do the opposite of what you actually feel?\"\n\n---\n\n## Ethics and Boundaries\n\n**An AI assistant may:**\n- Explain schemas and modes as concepts\n- Ask reflection questions for self-exploration\n- Present coping styles as psychoeducation\n- Guide simple, written inner child reflection exercises\n\n**An AI assistant must NOT:**\n- Diagnose or attribute schemas\n- Conduct chair work or experiential exercises\n- Offer reparenting (limited reparenting)\n- Process traumatic childhood experiences\n- Replace schema mode therapy\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n## References\n\n- Young, J. E., Klosko, J. S. & Weishaar, M. E. (2003). *Schema Therapy: A Practitioner's Guide.* Guilford Press.\n- Giesen-Bloo, J. et al. (2006). Outpatient Psychotherapy for Borderline Personality Disorder. *Archives of General Psychiatry*, 63(6), 649-658.\n- Roediger, E. (2011). *Praxis der Schematherapie.* Schattauer.\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*\n*Sources: Young et al. (2003), Giesen-Bloo et al. (2006), Roediger (2011) — Not professional therapy*"}, {"id": "skill:therapy:solution-focused-therapy", "name": "solution-focused-therapy", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Solution-Focused Brief Therapy according to de Shazer and Berg: Miracle question, exception exploration, scaling, resource activation.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: solution-focused-therapy\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-15\nupdated: 2026-03-15\ndescription: Solution-Focused Brief Therapy according to de Shazer and Berg: Miracle question, exception exploration, scaling, resource activation.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [sfbt, solution-focused, miracle-question, scaling, brief-therapy, resources]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/loesungsfokussierte_therapie.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-15', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"solution-focused-therapy banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Solution-Focused Therapy (Deutsch)\n\n> Fundamentals of Solution-Focused Brief Therapy according to Steve de Shazer and Insoo Kim Berg: Miracle question, exception exploration, scaling, resource activation\n\nSee: [ETHICS.md](../ETHICS.md)\n\n---\n\n## Context\n\nSolution-Focused Brief Therapy (SFBT) was developed by Steve de Shazer and Insoo Kim Berg at the Brief Family Therapy Center in Milwaukee. It is one of the most well-researched brief therapy approaches.\n\nCore idea: Instead of analyzing problems, work directly on solutions. \"Problem talk creates problems, solution talk creates solutions\" (de Shazer).\n\nEvidence: Meta-analyses support effectiveness for depression, anxiety, behavioral problems, substance abuse, and couple conflicts (Gingerich & Peterson 2013, Kim et al. 2019).\n\n**Note:** This is psychoeducation, not a substitute for professional therapy.\n**Never implement:** EMDR, Prolonged Exposure (PE), Narrative Exposure Therapy (NET)\n\n---\n\n## 1. Core Principles of SFBT\n\n### The Three Basic Rules (de Shazer)\n\n1. **\"If it ain't broke, don't fix it\"** — Don't change what works\n2. **\"If it works, do more of it\"** — Strengthen what works\n3. **\"If it doesn't work, do something different\"** — Change what doesn't help\n\n### View of the Person\n- Every person has resources and competencies\n- The client is the expert on their own life\n- Small changes trigger larger ones (butterfly effect)\n- The solution doesn't have to be related to the problem\n\n---\n\n## 2. The Miracle Question — In-Depth Application\n\n### Basic Form\n\n```\n\"Imagine that tonight, while you are sleeping, a miracle happens.\nThe problem that has been troubling you is solved.\nBut you don't know it, because you were asleep.\n\nWhat would you notice first thing tomorrow morning that tells you\nthe miracle has happened?\"\n```\n\n### Deepening Follow-Up Questions\n\n**Making it concrete on a sensory level:**\n- \"What exactly would you do differently tomorrow morning?\"\n- \"How would you get up? What would you do first?\"\n- \"What would you feel when you open your eyes?\"\n\n**Relationship level:**\n- \"How would your partner notice the miracle?\"\n- \"What would they see differently about you?\"\n- \"Who in your circle would notice it first?\"\n\n**Finding fragments of the miracle:**\n- \"Which part of this miracle is perhaps already happening a little bit?\"\n- \"On a scale of 0 to 10 — how far along are you already toward the miracle?\"\n\n---\n\n## 3. Exception Exploration\n\n### Principle\nExceptions are moments when the problem does not occur or occurs less. They already contain functioning solution approaches.\n\n### Systematic Exception Search\n\n**Phase 1: Finding exceptions**\n- \"When was it a bit better recently — even just minimally?\"\n- \"Are there days when the problem is less severe?\"\n\n**Phase 2: Describing exceptions in detail**\n- \"Describe that moment as precisely as possible\"\n- \"What was different about that day?\"\n\n**Phase 3: Recognizing one's own contribution**\n- \"What did YOU contribute to it being better?\"\n- \"What decision did you make?\"\n\n**Phase 4: Strengthening exceptions**\n- \"How could you deliberately repeat that?\"\n- \"What would be a first small step in that direction?\"\n\n### Types of Exceptions\n\n| Type | Description | Follow-up |\n|------|-------------|-----------|\n| Deliberate exception | Client consciously did something different | \"Do more of that!\" |\n| Random exception | Something was different without conscious effort | \"What was different about the circumstances?\" |\n| External exception | Others did something | \"What could you do to make that more likely?\" |\n\n---\n\n## 4. Scaling Techniques\n\n### Basic Scaling\n\"On a scale of 0 to 10, where 0 is the worst and 10 is the best possible...\"\n\n### Extended Scaling Forms\n\n**Coping scaling:**\n- \"How well are you managing to cope with daily life despite the problem?\"\n\n**Confidence scaling:**\n- \"How confident are you that you can make progress?\"\n\n**Progress scaling:**\n- \"Where were you a week / a month ago?\"\n- \"What contributed to the increase?\"\n\n### The \"One Point Higher\" Trick\nAlways ask only about the next point — never about the final goal.\n\n```\n\"What would be different at a 6 compared to the current 5?\"\n\"What could you do TOMORROW that moves toward a 6?\"\n```\n\n---\n\n## 5. Additional SFBT Techniques\n\n### Coping Questions\n- \"How do you manage to get up every day despite everything?\"\n- \"What keeps you going?\"\n\n### Relationship Questions\n- \"If I asked your partner, what would they say?\"\n- \"Who in your circle would notice the change first?\"\n\n### Compliments / Resource Comments\n- \"I'm impressed that despite the difficulties, you're here.\"\n\n---\n\n## 6. Reflection Questions for Self-Application\n\n- \"What is working well in my life — and how am I doing that?\"\n- \"What is one small exception I could build on?\"\n- \"If the problem were gone tomorrow — what would I do first?\"\n- \"What have I accomplished before, even though it was hard?\"\n\n---\n\n## Ethics and Boundaries\n\n**An AI assistant may:**\n- Explain and contextualize SFBT concepts\n- Guide the miracle question, exception exploration, and scaling\n- Ask reflection questions\n- Point out resources and strengths\n\n**An AI assistant must NOT:**\n- Conduct solution-focused therapy\n- Trivialize persistent problems (\"Just think positive\")\n- Bypass acute crises with solution orientation\n- Promise that SFBT techniques will solve problems\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n## References\n\n- de Shazer, S. (1988). *Clues: Investigating Solutions in Brief Therapy.* Norton.\n- Berg, I. K. & Miller, S. D. (1992). *Working with the Problem Drinker.* Norton.\n- Gingerich, W. J. & Peterson, L. T. (2013). Effectiveness of Solution-Focused Brief Therapy. *Research on Social Work Practice*, 23(3), 266-283.\n- Kim, J. S. et al. (2019). Solution-Focused Brief Therapy: A Meta-Analysis. *Journal of Marital and Family Therapy*, 45(2), 271-286.\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*\n*Sources: de Shazer (1988), Berg & Miller (1992), Gingerich & Peterson (2013), Kim et al. (2019) — Not professional therapy*"}, {"id": "skill:therapy:stabilization-techniques", "name": "stabilization-techniques", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Stabilization techniques: Grounding, safe place, containment, and breathing exercises. Immediate techniques for acute distress and panic attacks.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: stabilization-techniques\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Stabilization techniques: Grounding, safe place, containment, and breathing exercises. Immediate techniques for acute distress and panic attacks.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [stabilization, grounding, safe-place, containment, breathing-exercises, crisis-management]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/stabilisierungstechniken.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"stabilization-techniques banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Stabilization Techniques (Deutsch)\n\n## Foundation\n\nStabilization techniques are **immediate interventions** for acute distress situations. They help return from overwhelming emotions, panic, dissociation, or flashbacks to the here and now. They do not replace therapy but serve as **psychological first aid**.\n\nCore principle: **Back into the body, back into the moment, back into control.**\n\n---\n\n## 1. Grounding Techniques\n\nGrounding brings attention back to the present moment and one's own body. Particularly effective for dissociation, flashbacks, and panic.\n\n### 1.1 Sensory Grounding: The 5-4-3-2-1 Technique\n\nThe most well-known and accessible grounding technique. Systematically activates all five senses.\n\n#### Instructions\n\n> **5 things you SEE:**\n> Look around. Name five things you can see right now. Anything — the wall, your hand, a light switch. Describe details: color, shape, size.\n>\n> **4 things you HEAR:**\n> Close your eyes briefly. What do you hear? The hum of the refrigerator, birds, your own breath, traffic.\n>\n> **3 things you FEEL (touch):**\n> What is touching your body right now? The chair beneath you, fabric on your skin, the temperature of the air.\n>\n> **2 things you SMELL:**\n> Consciously sniff. Room air, your shampoo, coffee, fresh air.\n>\n> **1 thing you TASTE:**\n> What do you taste right now? The last coffee, toothpaste, simply your mouth.\n\n#### Variation: Intensive Grounding\n\nFor stronger dissociation — work with physical stimuli:\n- Hold an ice cube in your hand\n- Run cold water over your wrists\n- Smell something strong (peppermint oil, smelling salts)\n- Hot candy or chili\n- Stomp feet firmly on the ground\n\n---\n\n### 1.2 Physical Grounding (Body Grounding)\n\nBrings attention deliberately into the body.\n\n#### Instructions: Body Scan (Short Version)\n\n> Sit upright. Feet flat on the floor.\n>\n> **Feet:** Feel the contact with the ground. Actively press your feet down. Feel the weight.\n>\n> **Legs:** Feel your thighs on the chair. The weight they carry.\n>\n> **Back:** Feel the backrest. Consciously lean against it.\n>\n> **Hands:** Place them on your thighs. Feel the warmth, the contact.\n>\n> **Breath:** Feel how your belly rises and falls. Don't control it — just observe.\n\n#### Progressive Muscle Relaxation (Short Version)\n\nTense each muscle area for 5 seconds, then relax for 10 seconds:\n\n1. **Hands:** Clench fists — release\n2. **Arms:** Tense biceps — release\n3. **Shoulders:** Pull up to ears — drop\n4. **Face:** Squeeze together — relax\n5. **Abdomen:** Tense — release\n6. **Legs:** Tense — release\n7. **Feet:** Curl toes — release\n\n---\n\n### 1.3 Cognitive Grounding\n\nUses mental activity to exit emotional flooding.\n\n#### Techniques\n\n- **Count backward:** From 100 in steps of 7 (100, 93, 86, 79...)\n- **List categories:** \"5 car brands, 5 cities starting with B, 5 forest animals...\"\n- **Orientation:** State the date, time, location, own name: \"I am [name]. It is [day], [time]. I am in [place]. I am safe.\"\n- **Color game:** Find all red objects in the room. Then all blue. Then all green.\n- **Alphabet game:** For a category (e.g., animals), find a word for each letter\n\n---\n\n## 2. Safe Place\n\nAn imaginative stabilization technique. Frequently used in trauma therapy (including EMDR protocol). Creates an inner refuge that can be accessed at any time.\n\n### Instructions for Building\n\n> **Step 1: Find the place**\n> \"Imagine a place where you feel completely safe and secure. It can be a real place (a beach, a room, a forest) or a completely imagined place. What matters is: YOU feel safe there.\"\n>\n> **Step 2: Activate the senses**\n> \"What do you see at your safe place? What colors, what light?\n> What do you hear? Silence, birds, water, music?\n> What do you smell? Sea, forest, fresh laundry?\n> What do you feel on your skin? Warmth, wind, soft grass?\n> What is the temperature?\"\n>\n> **Step 3: Anchor the body feeling**\n> \"How does your body feel at this place? Where do you feel the safety? In your belly? In your chest? Let that feeling grow larger.\"\n>\n> **Step 4: Choose a signal word**\n> \"Choose a word or a brief image that instantly takes you to this place. For example, 'cove' or 'forest clearing.' When you think this word, you are there.\"\n>\n> **Step 5: Practice**\n> \"Over the next few days, briefly visit your safe place again and again (30-60 seconds). The more you practice, the faster and deeper you arrive there.\"\n\n### Important Notes\n\n- The safe place should NOT contain real people (relationships can change)\n- With trauma: Sometimes no place feels safe enough — then a \"safe room\" can be built (with walls, locks, protective shield)\n- The place can change — this is normal and allowed\n- Don't force it if it doesn't work — choose a different technique instead\n\n---\n\n## 3. Containment Technique (Vault Exercise)\n\nHelps temporarily \"lock away\" distressing thoughts, images, or feelings when they cannot be processed at the moment. **Not suppression**, but conscious regulation of timing.\n\n### Instructions\n\n> **Step 1: Choose a container**\n> \"Imagine a container that is absolutely secure. A vault, a chest, a bunker — big enough for everything you want to put in. It has a lock, and only you have the key.\"\n>\n> **Step 2: Name what is distressing**\n> \"What would you like to put in there right now? Name it. It can be images, feelings, thoughts, memories.\"\n>\n> **Step 3: Place it inside**\n> \"Put it in. Piece by piece. Watch as it slides into the container. It is safely stored.\"\n>\n> **Step 4: Lock it**\n> \"Close the container. Turn the key. Hear the lock click shut. Take the key with you.\"\n>\n> **Step 5: Store it**\n> \"Place the container somewhere you choose. It stands there safely. You can return at any time and take something out — but YOU decide when.\"\n\n### Important\n\n- Containment is a TEMPORARY strategy\n- What is postponed must be processed later (ideally in therapy)\n- Not suitable as a permanent solution — otherwise it becomes avoidance\n\n---\n\n## 4. Breathing Exercises\n\nThe breath is the fastest bridge between body and psyche. Slow, deep breathing activates the parasympathetic nervous system and reduces the stress response.\n\n### 4.1 Extended Exhale (Basic Technique)\n\n**Effect:** Activates the parasympathetic nervous system. Lowers heart rate and blood pressure.\n\n> **Inhale:** 4 seconds through the nose\n> **Exhale:** 6-8 seconds through the mouth (longer than inhaling!)\n>\n> The exhale is the key. The longer the exhale relative to the inhale, the stronger the relaxation response.\n\n### 4.2 Box Breathing (4-4-4-4)\n\n**Effect:** Calming and focusing. Used by Navy SEALs and first responders.\n\n> **Inhale:** 4 seconds\n> **Hold:** 4 seconds\n> **Exhale:** 4 seconds\n> **Hold:** 4 seconds\n>\n> Repeat 4-6 cycles.\n\n### 4.3 Physiological Sigh (Huberman Technique)\n\n**Effect:** Fastest known method for stress reduction. A single double-inhale is sufficient.\n\n> **Double inhale:** Short and sharp through the nose, then IMMEDIATELY take another short breath (without exhaling in between)\n> **Long exhale:** Slowly and completely through the mouth\n>\n> Even a single cycle measurably lowers heart rate.\n\n### 4.4 4-7-8 Breathing Exercise (Andrew Weil)\n\n**Effect:** Deep relaxation. Particularly good for falling asleep.\n\n> **Inhale:** 4 seconds through the nose\n> **Hold:** 7 seconds\n> **Exhale:** 8 seconds through the mouth\n>\n> 4 cycles. No more at the beginning — can cause dizziness.\n\n---\n\n## When to Use Which Technique?\n\n| Situation | Recommended Technique | Rationale |\n|-----------|----------------------|-----------|\n| Panic attack | Extended exhale + 5-4-3-2-1 | Activate parasympathetic, sensory anchoring |\n| Flashback / Intrusion | Cognitive grounding + orientation | Back to the here and now |\n| Dissociation | Intensive grounding (ice, cold water) | Strong sensory stimuli break through dissociation |\n| Overwhelming emotions | Containment + breathing exercise | Postponement + physical calming |\n| Sleep problems (rumination) | 4-7-8 breathing + safe place | Deep relaxation + positive imagery |\n| Acute stress | Box breathing or physiological sigh | Rapid regulation |\n| Before stressful situations | Safe place + breathing exercise | Activate resource |\n| After stressful conversations | Physical grounding + extended exhale | Calm down nervous system |\n\n---\n\n## Daily Plan for Stabilization Practice\n\nRegular practice makes techniques accessible in emergencies. Recommended routine:\n\n| Time | Exercise | Duration |\n|------|----------|----------|\n| Morning after waking | 3x physiological sigh | 1 minute |\n| Midday | Brief body scan | 3 minutes |\n| During stress (ad hoc) | Box breathing or 5-4-3-2-1 | 2-5 minutes |\n| Evening before sleep | 4-7-8 breathing + safe place | 5 minutes |\n\n**Total effort: approximately 10-15 minutes daily.**\n\n---\n\n## Emergency Short Protocol\n\nWhen someone is in acute distress — follow this sequence:\n\n1. **BREATHE:** \"Breathe with me. In... and out... In... and out...\" (Guide extended exhale)\n2. **ORIENT:** \"Tell me: Where are you right now? What day is it? What is your name?\"\n3. **FEEL:** \"Feel your feet on the ground. Press them down firmly.\"\n4. **SEE:** \"Look around. Name 5 things you see.\"\n5. **NAME:** \"What just happened? You don't need to go into detail — just one word or one sentence.\"\n\n**After that: Clarify safety.** Is the person safe? Do they need professional help?\n\n---\n\n## Ethical Guidelines\n\nAn AI assistant may guide stabilization techniques when a person describes stress, anxiety, or overwhelm.\n\nAn AI assistant must NOT:\n- Use stabilization techniques as a substitute for emergency help (for acute suicidality: refer to 988 / 112 / Telefonseelsorge 0800-1110111)\n- Conduct trauma processing — stabilization is NOT therapy\n- Guarantee effectiveness (\"This will help\" -> instead \"This may help\")\n- Ignore physical causes (panic attack vs. heart attack -> when in doubt, recommend medical evaluation)\n\nSee: [ETHICS.md](../ETHICS.md)\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n## References\n\n- Reddemann, L. (2001). *Imagination als heilsame Kraft.* Klett-Cotta.\n- Levine, P. A. (1997). *Waking the Tiger: Healing Trauma.*\n- Huberman, A. (2023). Huberman Lab Podcast — Physiological Sighs.\n- Weil, A. (2015). *4-7-8 Breathing Technique.*\n- Jacobson, E. (1938). *Progressive Relaxation.*\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*"}, {"id": "skill:therapy:systemic-questioning", "name": "systemic-questioning", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Systemic questioning techniques: Circular questions, scaling questions, miracle question, and exception questions for reflection and perspective expansion.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: systemic-questioning\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Systemic questioning techniques: Circular questions, scaling questions, miracle question, and exception questions for reflection and perspective expansion.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [systemic, questioning-techniques, circular, miracle-question, scaling, de-shazer]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/systemische_fragetechniken.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"systemic-questioning banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Systemic Questioning Techniques (Deutsch)\n\n## Foundation\n\nSystemic questioning techniques originate from systemic therapy and counseling. They aim to **expand perspectives**, **make patterns visible**, and **open new possibilities**. They are solution- and resource-oriented — not problem-fixated.\n\nCentral assumption: **Problems do not arise within individuals, but in relationships and patterns between individuals.**\n\n---\n\n## Question Types\n\n### 1. Circular Questions\n\n**Purpose:** Encourage perspective shifts. The person is invited to take the position of others and recognize relationship patterns.\n\n#### Basic Structure\n\"What do you think [Person X] sees/feels/thinks about this?\"\n\n#### Variations\n\n**Relationship questions:**\n- \"What do you think your partner thinks when you withdraw?\"\n- \"How would your best friend describe your relationship?\"\n- \"If I asked your brother what the biggest problem in the family is — what would he say?\"\n\n**Difference questions:**\n- \"Who in the family suffers most from the situation?\"\n- \"Who would notice the change first?\"\n- \"Who are you closer to — your mother or your father?\"\n\n**Agreement questions:**\n- \"Would your partner agree with that?\"\n- \"Who in your circle sees it similarly to you?\"\n\n**Classification questions:**\n- \"If you ranked your family members by who handles conflicts best — what would the order be?\"\n\n---\n\n### 2. Scaling Questions\n\n**Purpose:** Make abstract states measurable, make progress visible, concretize goals. Developed by **Steve de Shazer** and **Insoo Kim Berg**.\n\n#### Basic Structure\n\"On a scale of 0 to 10, where 0 is [Pole A] and 10 is [Pole B] — where are you right now?\"\n\n#### Variations\n\n**State scaling:**\n- \"On a scale of 0 to 10 — how burdened do you feel right now?\"\n- \"Where on the scale were you last week?\"\n\n**Progress scaling:**\n- \"Where were you on this scale a month ago?\"\n- \"What contributed to you moving from a 3 to a 5?\"\n\n**Goal scaling:**\n- \"Where on the scale would you need to be for it to be 'good enough'?\"\n- \"What would be different if you were one point higher?\"\n\n**Confidence scaling:**\n- \"How confident are you on a scale of 0 to 10 that you can do this?\"\n- \"What would you need to be one point more confident?\"\n\n**Relationship scaling:**\n- \"Where on the scale would your partner rate your relationship?\"\n\n#### Follow-up Questions (essential!)\n\n- \"What has kept you from being at 0?\" (Resource activation)\n- \"What would need to happen for you to be one point higher?\" (Small-step solution orientation)\n- \"How would you know you're at [target value]?\" (Concretization)\n\n---\n\n### 3. The Miracle Question\n\n**Purpose:** Goal clarification and solution vision. Bypasses problem-thinking and activates solution imagination. Developed by **Steve de Shazer**.\n\n#### Original Formulation\n\n> \"Imagine you go to bed tonight and fall asleep. And while you are sleeping, a miracle happens. The problem that brought you here is solved. But you don't know it, because you were asleep. What would you notice first thing tomorrow morning that tells you the miracle has happened?\"\n\n#### Deepening Questions\n\n- \"What else would be different?\"\n- \"Who would notice it first?\"\n- \"What would [partner/colleague/friend] notice about you that's new?\"\n- \"What would you do differently?\"\n- \"Are there moments when the miracle is already happening a little bit?\"\n\n#### Shortened Variations\n\n- \"If the problem were gone tomorrow — what would be different?\"\n- \"What would your ideal daily routine look like?\"\n- \"If everything were the way you wish — what would you do?\"\n\n---\n\n### 4. Exception Questions\n\n**Purpose:** Identify times when the problem does NOT occur or occurs less. Shows that the person already has solution resources.\n\n#### Basic Structure\n\"When is it different? When does the problem not occur?\"\n\n#### Variations\n\n- \"Have there been moments recently when it was better?\"\n- \"What was different about those moments?\"\n- \"What did YOU do differently in those moments?\"\n- \"Who was there? What was the environment like?\"\n- \"How did you manage to make it better in that moment?\"\n- \"What would need to happen for those exceptions to become more frequent?\"\n\n---\n\n### 5. Hypothetical Questions\n\n**Purpose:** Open new thinking spaces, loosen rigid beliefs, mentally rehearse options.\n\n#### Variations\n\n- \"Suppose you just tried it — what could happen in the best case?\"\n- \"What would happen if you did the opposite of what you normally do?\"\n- \"If you were to give advice to someone in the same situation — what would you say?\"\n- \"If fear played no role — what would you do?\"\n- \"If you looked back at today from 5 years in the future — what would you advise yourself?\"\n\n---\n\n### 6. Deterioration Questions (Paradoxical Intervention)\n\n**Purpose:** Strengthen sense of control. If someone can describe how to make the problem worse, they clearly have influence over it — and can also improve it.\n\n#### Variations\n\n- \"What could you do to guarantee it gets worse?\"\n- \"How could you make sure the argument escalates?\"\n- \"What would need to happen for everything to go completely wrong?\"\n\n**Important:** This technique is NOT suitable for acute crisis, suicidality, or severe depression.\n\n---\n\n## Context-Sensitive Selection\n\n| Situation | Recommended Technique | Rationale |\n|-----------|----------------------|-----------|\n| Person is stuck in the problem | Miracle question | Breaks out of the problem trance |\n| Progress not visible | Scaling questions | Makes small steps measurable |\n| Relationship conflicts | Circular questions | Enables perspective shift |\n| \"It's ALWAYS like this\" | Exception questions | Breaks through generalization |\n| Fear of change | Hypothetical questions | Enables risk-free trial thinking |\n| Helplessness / loss of control | Deterioration questions | Shows own influence |\n| Unclear goals | Miracle question + scaling | Clarifies direction and starting point |\n\n---\n\n## Combinations\n\nSystemic questions unfold their full effect in combination:\n\n### Pattern: Scaling + Exception + Small Step\n\n1. \"On a scale of 0-10, where are you right now?\" -> e.g., \"4\"\n2. \"What has kept you from being at 0?\" (Resources!)\n3. \"Were there moments when you were at 5 or higher?\" (Exceptions!)\n4. \"What was different then?\" (Recognize patterns!)\n5. \"What would be the smallest step to go from 4 to 5?\" (Action!)\n\n### Pattern: Miracle Question + Circular + Scaling\n\n1. Ask the miracle question (generate target image)\n2. \"Who would notice it first?\" (Circular — relationship context)\n3. \"How far along are you already on the way to the miracle?\" (Scaling — progress)\n\n### Pattern: Circular + Hypothetical\n\n1. \"What do you think your boss sees in this situation?\"\n2. \"Suppose they said exactly what you suspect — what could you do then?\"\n\n---\n\n## Dos and Don'ts\n\n### Dos\n- **Ask openly** — no leading questions\n- **Stay curious** — the answer is more valuable than the question\n- **Allow pauses** — good questions need time\n- **Build on answers** — follow-up is more important than the next technique\n- **Frame appreciatively** — \"What did you accomplish?\" rather than \"What did you do wrong?\"\n\n### Don'ts\n- **Don't interrogate** — max 2-3 questions in a row, then reflect\n- **Not during acute crisis** — first stabilize, then explore\n- **Not as manipulation** — questions must be authentically curious\n- **Deterioration questions never with suicidality** — never\n\n---\n\n## Ethical Guidelines\n\nAn AI assistant may ask systemic questions to foster reflection and perspective expansion.\n\nAn AI assistant must NOT:\n- Use systemic questions as a diagnostic instrument\n- Conduct relationship counseling that replaces professional therapy\n- Work exclusively with questions during acute crisis — stabilization first\n- Use deterioration questions with fragile states\n\nSee: [ETHICS.md](../ETHICS.md)\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n## References\n\n- de Shazer, S. (1985). *Keys to Solution in Brief Therapy.*\n- Selvini Palazzoli, M. et al. (1981). *Hypothesizing — Circularity — Neutrality.*\n- Schlippe, A. von & Schweitzer, J. (2012). *Lehrbuch der systemischen Therapie und Beratung.*\n- Berg, I. K. & Dolan, Y. (2001). *Tales of Solutions.*\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*"}, {"id": "skill:therapy:systemisch-loesungsfokussiert", "name": "systemisch-loesungsfokussiert", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Systemic and solution-focused methods: miracle question, scaling, exception exploration, circular questions, hypothetical questions, worsening questions, coping questions. Merged from solution-focused-therapy and systemic-questioning.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: systemisch-loesungsfokussiert\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-05-19\nupdated: 2026-06-13\ndescription: Systemic and solution-focused methods: miracle question, scaling, exception exploration, circular questions, hypothetical questions, worsening questions, coping questions. Merged from solution-focused-therapy and systemic-questioning.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [sfbt, systemic, solution-focused, miracle-question, scaling, circular, questioning-techniques, de-shazer]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'custom', 'merged_from': ['therapy/solution-focused-therapy (v1.0.0, BACH skills/therapie/loesungsfokussierte_therapie.md)', 'therapy/systemic-questioning (v1.0.0, BACH skills/therapie/systemische_fragetechniken.md)'], 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-05-19', 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"systemisch-loesungsfokussiert banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Systemic & Solution-Focused Methods (Deutsch)\n\n> Miracle question, scaling, exceptions, circular questions, hypothetical questions — one integrated skill\n\nSee: [ETHICS.md](../ETHICS.md)\n\n---\n\n## Foundations\n\n### Solution-Focused Brief Therapy (SFBT)\n\nDeveloped by Steve de Shazer and Insoo Kim Berg at the Brief Family Therapy Center (Milwaukee).\nCore idea: instead of analyzing problems, work directly on solutions.\n\"Problem talk creates problems, solution talk creates solutions\" (de Shazer).\n\n**The three basic rules:**\n1. **\"If it ain't broke, don't fix it\"** — do not change what works\n2. **\"If it works, do more of it\"** — reinforce what succeeds\n3. **\"If it doesn't work, do something different\"** — change what does not help\n\n### Systemic perspective\n\nProblems do not arise within persons but in relationships and patterns between persons.\nQuestions aim to broaden perspectives, make patterns visible, and open up new possibilities.\n\n**Note:** This is psychoeducation, not a substitute for professional therapy.\n**Never implement:** EMDR, Prolonged Exposure (PE), Narrative Exposure Therapy (NET)\n\n---\n\n## 1. The miracle question\n\n### Basic form\n\n```\n\"Imagine that tonight, while you are asleep, a miracle happens.\nThe problem that has been troubling you is solved.\nBut you don't know it, because you were asleep.\n\nWhat would be the first thing tomorrow morning that tells you the miracle has happened?\"\n```\n\n### Deepening follow-ups\n\n**Sensory level:**\n- \"What exactly would you do differently tomorrow morning?\"\n- \"How would you get up? What would you do first?\"\n- \"What would you feel when you open your eyes?\"\n\n**Relationship level:**\n- \"How would your partner notice the miracle?\"\n- \"What would he/she see differently about you?\"\n- \"Who in your environment would notice it first?\"\n\n**Fractions of the miracle:**\n- \"Which part of this miracle is perhaps already happening a little bit?\"\n- \"On a scale from 0 to 10 — how far are you already toward the miracle?\"\n\n### Shortened variants\n\n- \"If the problem were gone tomorrow — what would be different?\"\n- \"What would your ideal everyday life look like?\"\n- \"If everything were the way you wish — what would you be doing?\"\n\n---\n\n## 2. Scaling techniques\n\n### Basic structure\n\n\"On a scale from 0 to 10, where 0 is [pole A] and 10 is [pole B] — where are you right now?\"\n\n### Variants\n\n| Type | Example question |\n|------|------------------|\n| **State scaling** | \"How burdened do you feel right now?\" |\n| **Coping scaling** | \"How well do you manage your everyday life despite the problem?\" |\n| **Confidence scaling** | \"How confident are you that you can make progress?\" |\n| **Progress scaling** | \"Where were you a week / a month ago?\" |\n| **Relationship scaling** | \"Where on the scale would your partner rate your relationship?\" |\n\n### The \"one point higher\" trick\n\nAlways ask only about the next point — never about the end goal.\n\n```\n\"What would be different at a 6 compared to the current 5?\"\n\"What could you do TOMORROW that moves you toward a 6?\"\n```\n\n### Follow-up questions (essential!)\n\n- \"What has kept you from being at 0?\" (resource activation)\n- \"What would have to happen for you to move one point higher?\" (small-step solution orientation)\n- \"How would you notice that you are at [target value]?\" (concretization)\n\n---\n\n## 3. Exception exploration\n\n### Principle\n\nExceptions are moments in which the problem does not occur or occurs less.\nThey already contain working solution elements.\n\n### Systematic search\n\n**Phase 1 — Find:**\n- \"When was it recently a bit better — even minimally?\"\n- \"Are there days when the problem is less intense?\"\n\n**Phase 2 — Describe in detail:**\n- \"Describe that moment as precisely as possible\"\n- \"What was different about that day?\"\n\n**Phase 3 — Recognize one's own contribution:**\n- \"What did YOU contribute to it being better?\"\n- \"What decision did you make?\"\n\n**Phase 4 — Reinforce:**\n- \"How could you deliberately repeat that?\"\n- \"What would be a first small step in that direction?\"\n\n### Types of exceptions\n\n| Type | Description | Follow-up |\n|------|-------------|-----------|\n| Deliberate | The client consciously did something differently | \"Do more of it!\" |\n| Random | Something was different without conscious action | \"What was different about the circumstances?\" |\n| External | Others did something | \"What could you do to make that more likely?\" |\n\n---\n\n## 4. Circular questions\n\n### Principle\n\nEncourage perspective shifts — the person is invited to put themselves in others' positions and to recognize relationship patterns.\n\n### Basic structure\n\n\"What do you think — how does [person X] see/feel/judge this?\"\n\n### Variants\n\n**Relationship questions:**\n- \"What do you think your partner thinks when you withdraw?\"\n- \"How would your best friend describe your relationship?\"\n- \"If I asked your brother what the biggest problem in the family is — what would he say?\"\n\n**Difference questions:**\n- \"Who in the family suffers most from the situation?\"\n- \"Who notices the change first?\"\n\n**Agreement questions:**\n- \"Would your partner agree with that?\"\n- \"Who in your environment sees it similarly to you?\"\n\n**Classification questions:**\n- \"If you ranked your family members by who handles conflict best — what would the order be?\"\n\n---\n\n## 5. Hypothetical questions\n\nOpen new thinking spaces, loosen rigid convictions, rehearse options for action.\n\n- \"Suppose you just tried it — what could happen in the best case?\"\n- \"What would happen if you did the opposite of what you normally do?\"\n- \"If you were to give advice to someone in the same situation — what would you say?\"\n- \"If fear played no role — what would you do?\"\n- \"If you looked back at today from 5 years in the future — what would you advise yourself?\"\n\n---\n\n## 6. Worsening questions (paradoxical intervention)\n\nStrengthen the sense of control: whoever can describe how to make the problem worse has influence — and can therefore also improve it.\n\n- \"What could you do to make it guaranteed worse?\"\n- \"How could you make sure the argument escalates?\"\n- \"What would have to happen for everything to go completely wrong?\"\n\n**Important:** NOT suitable in acute crisis, suicidality, or severe depression.\n\n---\n\n## 7. Coping questions & resource comments\n\n- \"How do you still manage to get up every day?\"\n- \"What keeps you going?\"\n- \"I am impressed that you are here despite the difficulties.\"\n\n---\n\n## Context-sensitive selection\n\n| Situation | Recommended technique | Rationale |\n|---|---|---|\n| Person is stuck in the problem | Miracle question | Releases from the problem trance |\n| Progress not visible | Scaling questions | Makes small steps measurable |\n| Relationship conflicts | Circular questions | Enables perspective shifts |\n| \"It is ALWAYS like this\" | Exception questions | Breaks generalization |\n| Fear of change | Hypothetical questions | Risk-free trial thinking |\n| Helplessness / loss of control | Worsening questions | Shows one's own influence |\n| Unclear goals | Miracle question + scaling | Clarifies direction and starting point |\n\n---\n\n## Combination patterns\n\n### Scaling + exception + small step\n\n1. \"On a scale of 0-10, where are you right now?\" → e.g. \"4\"\n2. \"What has kept you from being at 0?\" (resources!)\n3. \"Were there moments when you were at 5 or higher?\" (exceptions!)\n4. \"What was different then?\" (recognize patterns!)\n5. \"What would be the smallest step to get from 4 to 5?\" (action!)\n\n### Miracle question + circular + scaling\n\n1. Ask the miracle question (create a target image)\n2. \"Who would notice it first?\" (circular — relationship context)\n3. \"How far along are you already on the way to the miracle?\" (scaling — progress)\n\n### Circular + hypothetical\n\n1. \"What do you think — how does your boss see the situation?\"\n2. \"Suppose he said exactly that — what could you do then?\"\n\n---\n\n## Reflection questions for self-application\n\n- \"What works well in my life — and how do I do that?\"\n- \"What is a small exception I could build on?\"\n- \"If the problem were gone tomorrow — what would I do first?\"\n- \"What have I managed before, even though it was hard?\"\n\n---\n\n## Dos and Don'ts\n\n### Dos\n- **Ask openly** — no leading questions\n- **Stay curious** — the answer is more valuable than the question\n- **Allow pauses** — good questions need time\n- **Build on answers** — follow-up matters more than the next technique\n- **Phrase appreciatively** — \"What did you succeed at?\" instead of \"What did you do wrong?\"\n\n### Don'ts\n- **Do not interrogate** — max. 2-3 questions in a row, then reflect\n- **Not in acute crisis** — stabilize first, then explore\n- **Not as manipulation** — questions must be authentically curious\n- **Never use worsening questions with suicidality** — never\n\n---\n\n## Ethics and limits\n\n**An AI assistant may:**\n- Explain and contextualize SFBT and systemic concepts\n- Guide the miracle question, exception exploration, and scaling\n- Ask circular and hypothetical questions\n- Ask reflection questions and point out resources\n\n**An AI assistant may NOT:**\n- Conduct or replace therapy\n- Trivialize persistent problems (\"just think positive\")\n- Brush over acute crises with solution orientation\n- Give relationship counseling that replaces professional therapy\n- Use worsening questions in fragile states\n\n**At signs of an acute crisis, ALWAYS refer to local emergency services and crisis hotlines** (in Germany e.g.: Telefonseelsorge 0800 111 0 111 / 0800 111 0 222, psychiatric emergency service 112, krisenchat.de).\n\n---\n\n## References\n\n- de Shazer, S. (1985). *Keys to Solution in Brief Therapy.* Norton.\n- de Shazer, S. (1988). *Clues: Investigating Solutions in Brief Therapy.* Norton.\n- Berg, I. K. & Miller, S. D. (1992). *Working with the Problem Drinker.* Norton.\n- Berg, I. K. & Dolan, Y. (2001). *Tales of Solutions.* Norton.\n- Selvini Palazzoli, M. et al. (1981). *Hypothesizing — Circularity — Neutrality.*\n- Schlippe, A. von & Schweitzer, J. (2012). *Lehrbuch der systemischen Therapie und Beratung.*\n- Gingerich, W. J. & Peterson, L. T. (2013). Effectiveness of Solution-Focused Brief Therapy. *Research on Social Work Practice*, 23(3), 266-283.\n- Kim, J. S. et al. (2019). Solution-Focused Brief Therapy: A Meta-Analysis. *Journal of Marital and Family Therapy*, 45(2), 271-286.\n\n---\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-05-19)\n- Merged from `solution-focused-therapy` (v1.0.0) and `systemic-questioning` (v1.0.0)\n- All unique content of both sources integrated\n\n---\n\n*Merged from BACH v3.8.0 exports | Standalone version*\n*Not professional therapy — psychoeducation and reflection*"}, {"id": "skill:therapy:therapie-umbrella", "name": "therapie-umbrella", "cat": "therapy", "ver": "0.1.0", "status": "active", "desc": "Meta-/Umbrella-Skill für die Familie „Therapie / Beratung\". Kennt alle therapeutischen Skills (Stabilisierung, Methoden-Überblick, Gesprächsführung + deregistrierte Spezialverfahren) und leitet zum passenden weiter. Nutze diesen Skill, wenn unklar ist, welcher Therapie-/Beratungs-Skill passt, ein Überblick über die verfügbaren Verfahren gebraucht wird, oder eine Beratungs-/Krisensituation zuerst eingeordnet werden muss. Auch auslösen bei „welche Therapiemethode passt\", „Beratung strukturieren\", „Krise — was tun\", „therapeutisches Vorgehen wählen\".", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: therapie-umbrella\nversion: 0.1.0\ntype: skill\nauthor: Lukas Geiger + Claude\ncreated: 2026-06-17\nupdated: 2026-06-17\ndescription: >\n  Meta-/Umbrella-Skill für die Familie „Therapie / Beratung\". Kennt alle therapeutischen Skills\n  (Stabilisierung, Methoden-Überblick, Gesprächsführung + deregistrierte Spezialverfahren) und leitet\n  zum passenden weiter. Nutze diesen Skill, wenn unklar ist, welcher Therapie-/Beratungs-Skill passt,\n  ein Überblick über die verfügbaren Verfahren gebraucht wird, oder eine Beratungs-/Krisensituation\n  zuerst eingeordnet werden muss. Auch auslösen bei „welche Therapiemethode passt\", „Beratung\n  strukturieren\", „Krise — was tun\", „therapeutisches Vorgehen wählen\".\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\n\ncategory: therapy\ntags: [therapie, beratung, umbrella, meta, routing]\nlanguage: de\nstatus: active\n\ndependencies:\n  tools: []\n  services: []\n  protocols: [counseling-basics, guideline-therapies-overview, stabilization-techniques, code-skill-index]\n  python: []\n\nprovenance:\n  origin: \"custom\"\n  origin_path: \"~/.claude/skills/therapie-umbrella/\"\n  origin_version: \"0.1.0\"\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"therapie-umbrella banner\">\n# Therapie / Beratung — Umbrella\n\n## Zweck\n\nEinstiegspunkt für die Familie „Therapie / Beratung\". Bündelt das übergreifende Routing und leitet\nfür Spezialfälle an den passenden Skill weiter. Drei aktive Einstiegspunkt-Skills bilden die Front;\ndahinter liegt ein längerer Schwanz deregistrierter Spezialverfahren, die über `code-skill-index`\n(Katalog `catalog-therapy.md`) erreichbar sind.\n\n## Mitglieder & Routing\n\n| Skill | Wofür | Wann diesen statt der anderen |\n|-------|-------|-------------------------------|\n| `/stabilization-techniques` | Krisenintervention, Grounding, Sicherer Ort, PMR, Panik, Window of Tolerance | **Zuerst** bei akuter Belastung/Krise — Stabilisierung vor Methodik |\n| `/guideline-therapies-overview` | Überblick Richtlinienverfahren: KVT, ACT, Schematherapie, Exposition, Systemische, Tiefenpsychologie | Wenn die passende **Methode** gewählt/erklärt werden soll |\n| `/counseling-basics` | Gesprächsführung: aktives Zuhören, Spiegeln, Validierung, MI/OARS, zirkuläre Fragen | Wenn es um das **WIE des Gesprächs** geht, nicht um die Methode |\n| (deregistrierte Spezial-Skills) | Einzelverfahren (Genogramm, Expositionsdetails, Positive Psychologie, …) | Wenn ein konkretes Einzelverfahren tief gebraucht wird → via `code-skill-index` |\n\n> Routing-Regel: akute Krise → `/stabilization-techniques` · Methode wählen/erklären →\n> `/guideline-therapies-overview` · Gesprächstechnik → `/counseling-basics` · tiefes Einzelverfahren →\n> deregistrierter Spezial-Skill über `code-skill-index`.\n\n## Gut gekoppelte Kombinationen\n\n- `/stabilization-techniques` (zuerst, akut) → `/guideline-therapies-overview` (danach, mittelfristig):\n  erst Sicherheit/Window of Tolerance herstellen, dann das passende Richtlinienverfahren wählen.\n- `/counseling-basics` begleitet **beide** — die Gesprächshaltung (MI/OARS, Validierung) trägt durch\n  Stabilisierung wie Methodenarbeit.\n\n## Gemeinsame Konventionen\n\n- Keine Diagnosestellung ersetzen; psychoedukativ und ressourcenorientiert arbeiten.\n- Window of Tolerance als Leitachse: bei Übererregung zuerst stabilisieren, nicht konfrontieren.\n- Live-Dateien der Einzelskills vor Anwendung lesen — diese Umbrella reproduziert keine Inhalte.\n\n## Changelog\n\n### 0.1.0 (2026-06-17)\n- Initiale Version. Erzeugt vom Audit-Modus (1c1) für die Familie Therapie / Beratung.\n"}, {"id": "skill:therapy:trauma-psychoeducation", "name": "trauma-psychoeducation", "cat": "therapy", "ver": "1.0.0", "status": "active", "desc": "Trauma psychoeducation: Trauma definition, normal reactions, window of tolerance, trigger management, and self-care.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: trauma-psychoeducation\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Trauma psychoeducation: Trauma definition, normal reactions, window of tolerance, trigger management, and self-care.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: therapy\ntags: [trauma, psychoeducation, window-of-tolerance, trigger, self-care, ptsd]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/therapie/trauma_psychoedukation.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"trauma-psychoeducation banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Trauma Psychoeducation (Deutsch)\n\n> Knowledge about trauma, trauma sequelae, and the window of tolerance: Understanding normal reactions to abnormal events — pure psychoeducation, NO trauma processing\n\nSee: [ETHICS.md](../ETHICS.md)\n\n---\n\n## Context\n\nPsychoeducation about trauma helps affected individuals understand and contextualize their reactions. The knowledge that symptoms like flashbacks, hyperarousal, or avoidance are NORMAL reactions to ABNORMAL events is already relieving and reduces shame and self-blame.\n\nEvidence: Psychoeducation is a recognized component of trauma therapy (Flatten et al. 2011, S3 Guideline PTSD). As a standalone intervention, it is insufficient, but it can increase therapy motivation and alleviate symptoms.\n\n**IMPORTANT:** This skill exclusively conveys KNOWLEDGE about trauma. It does NOT conduct trauma processing, does NOT explore distressing memories, and does NOT ask for trauma details.\n**Never implement:** EMDR, Prolonged Exposure (PE), Narrative Exposure Therapy (NET)\n\n---\n\n## 1. What Is Trauma?\n\n### Definition\n\nA trauma is an event that exceeds a person's coping capacity and is accompanied by the experience of helplessness, loss of control, and/or fear of death. It is not the event alone that defines the trauma, but the subjective experience.\n\n### Trauma Types\n\n| Type | Description | Examples |\n|------|-------------|----------|\n| Type I (Single trauma) | Single, unexpected event | Accident, assault, natural disaster |\n| Type II (Complex trauma) | Repeated, prolonged traumatization | Abuse, neglect, war |\n| Accidental trauma | Random events | Traffic accident, house fire, workplace accident |\n| Interpersonal trauma | Caused by humans | Violence, abuse, torture |\n| Secondary trauma | Through co-experiencing/witnessing | Helping professions, family members |\n\n### What Is NOT Trauma (Differentiation)\n\nNot every distressing event is a trauma in the clinical sense:\n- Breakup, job loss, arguments — distressing, but usually not trauma\n- Bullying — can be traumatizing (especially for children), but is not automatically trauma\n- The individual appraisal determines, not the type of event\n\n---\n\n## 2. Normal Reactions to Abnormal Events\n\n### The Three Response Patterns\n\n```\nHYPERAROUSAL\n- Constant vigilance and tension\n- Startle response\n- Sleep problems\n- Irritability, anger outbursts\n- Concentration difficulties\n\nRE-EXPERIENCING (Intrusion)\n- Flashbacks (memories that feel real)\n- Nightmares\n- Distressing memories that arise suddenly\n- Physical reactions upon remembering (racing heart, sweating)\n\nAVOIDANCE AND NUMBING (Constriction)\n- Avoidance of places, people, situations\n- Emotional numbness\n- Withdrawal from other people\n- Feeling of alienation\n- Loss of interest and pleasure\n```\n\n### Important Message for Affected Individuals\n\n```\n\"These reactions are NORMAL reactions to ABNORMAL events.\n\nYour body and mind are trying to protect you.\nThe vigilance protects you from renewed danger.\nThe memories are trying to process what happened.\nThe avoidance protects you from being overwhelmed.\n\nYou are not 'crazy.' You are not 'weak.'\nYour nervous system is responding the way it is programmed\nto respond to extreme threat.\"\n```\n\n### Timeline\n\n```\nCOURSE AFTER TRAUMATIC EVENT\n\n0-4 weeks:  Acute Stress Reaction (NORMAL)\n            - Shock, numbness, restlessness\n            - Sleep problems, startle response\n            - Flashbacks, nightmares\n            - For most people: Spontaneous recovery\n\n4+ weeks:   If symptoms persist: Possible PTSD\n            - Professional assessment recommended\n            - Early intervention improves prognosis\n\nMonths-Years: Chronification possible\n            - Therapy is effective even after a long time\n            - \"It is never too late to seek help\"\n```\n\n---\n\n## 3. The Window of Tolerance (Dan Siegel)\n\n### The Model\n\n```\n            ________________________________________________\n           |                                                |\n           |   ABOVE THE WINDOW: Hyperarousal               |\n           |   Panic, rage, overactivation, flashbacks      |\n           |   Racing heart, sweating, trembling            |\n           |   \"Fight or flight\"                            |\n           |________________________________________________|\n           |                                                |\n           |   WINDOW OF TOLERANCE                          |\n           |                                                |\n           |   Here we can:                                 |\n           |   - Think and feel at the same time            |\n           |   - Process information                        |\n           |   - Maintain relationships                     |\n           |   - Solve problems                             |\n           |   - Learn and grow                             |\n           |________________________________________________|\n           |                                                |\n           |   BELOW THE WINDOW: Hypoarousal                |\n           |   Freeze, numbness, dissociation               |\n           |   Lack of energy, emptiness, shutdown           |\n           |   \"Playing dead reflex\"                         |\n           |________________________________________________|\n```\n\n### What Does This Mean?\n\n- **In the window:** We can regulate stress and function\n- **Above the window:** Too much activation — body in alarm mode\n- **Below the window:** Too little activation — body shuts down\n\n### Trauma and the Window\n\n```\nBEFORE trauma:            AFTER trauma (untreated):\n\n|_______________|         |_____|\n|               |         |     |  <- Window has NARROWED\n|    WINDOW     |         | W.  |\n|   (wide)      |         |     |\n|_______________|         |_____|\n\nEven small stimuli can cause falling out of the window\nafter trauma (triggers).\n\nGOAL of therapy: WIDEN the window again.\n```\n\n### Understanding Triggers\n\n```\nTRIGGERS are stimuli that remind of the trauma and put\nthe nervous system into alarm mode — often unconsciously.\n\nTriggers can be:\n- Sounds (bang, screaming, certain music)\n- Smells (smoke, perfume, alcohol)\n- Images (news, movies, places)\n- Body sensations (tightness, touch, pain)\n- Calendar dates (anniversaries)\n- Relationship situations (arguments, loss of control)\n\nTriggers are NOT weakness. They are stored warning signals\nof the nervous system. In therapy, one learns to recognize\ntriggers and regulate the nervous system.\n```\n\n---\n\n## 4. Self-Care Strategies\n\n### Ensuring Basic Needs\n\n```\nBASIC NEEDS CHECKLIST\n\n[ ] Sleep: Regular bedtimes, at least 7 hours\n[ ] Nutrition: Regular meals, sufficient water\n[ ] Exercise: At least 20 minutes daily (a walk is enough)\n[ ] Social contacts: At least one trusted person\n[ ] Safety: Feeling safe in one's own environment\n[ ] Structure: Daily routine with fixed anchor points\n```\n\n### Self-Care Strategies in Daily Life\n\n**Physical:**\n- Regular exercise (lowers stress hormones)\n- Breathing exercises\n- Sufficient sleep (observe sleep hygiene)\n- Reduce caffeine and alcohol (amplify hyperarousal/numbing)\n\n**Social:**\n- Have a trusted person (doesn't have to talk about trauma)\n- Avoid isolation — even small contacts help\n- Learn to set boundaries (being allowed to say \"no\")\n- Accept support\n\n**Emotional:**\n- Name feelings (don't judge them)\n- Use stabilization techniques (5-4-3-2-1, safe place)\n- Keep a journal (optional, don't force it)\n- Find creative expression (painting, music, writing)\n\n**Cognitive:**\n- Inform yourself (psychoeducation — this skill)\n- Challenge self-blame (\"It was not my fault\")\n- Reality-check catastrophizing\n- Be patient with yourself (healing takes time)\n\n---\n\n## 5. Finding Professional Help\n\n### When to Seek Professional Help?\n\n```\nPROFESSIONAL HELP IS INDICATED WHEN:\n\n- Symptoms persist for more than 4 weeks\n- Symptoms worsen instead of improving\n- Daily life is no longer manageable (work, relationships)\n- Flashbacks or nightmares occur very frequently\n- Avoidance behavior severely restricts life\n- Substance use as a coping strategy\n- Suicidal thoughts or self-harm\n- The feeling: \"I can't do this alone\"\n```\n\n### Resources\n\n```\nIMMEDIATE HELP:\n- 988 Suicide & Crisis Lifeline (US): 988 (24/7, free)\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222 (24/7, free)\n- Emergency services: 911 (US) / 112 (EU)\n\nTRAUMA-SPECIFIC:\n- Trauma outpatient clinics (at many hospitals, no referral needed)\n- Victim support organizations (e.g., RAINN in US: 1-800-656-4673)\n- Domestic violence hotline (US): 1-800-799-7233\n- National Sexual Assault Hotline (US): 1-800-656-4673\n\nFINDING A THERAPIST:\n- Psychology Today therapist directory: psychologytoday.com/us/therapists\n- SAMHSA helpline (US): 1-800-662-4357\n- Important: Look for therapists specializing in \"trauma therapy\"\n```\n\n---\n\n## 6. Frequently Asked Questions (FAQ)\n\n### \"Am I traumatized now?\"\n\nNot everyone who experiences a distressing event develops a trauma-related disorder. The majority of people recover spontaneously within weeks. Whether PTSD is present can only be determined by a professional.\n\n### \"Do I have to talk about it?\"\n\nNo. Forcing yourself to talk can be harmful. Some people benefit from talking about it, others don't. There is no \"must.\" In therapy, the right timing is determined together.\n\n### \"Why do I react this way even though it was long ago?\"\n\nTraumatic memories are stored differently than normal memories. They can be reactivated by triggers and feel as though the event is happening NOW. The brain does not distinguish between \"then\" and \"now.\" Therapy helps \"re-sort\" these memories.\n\n### \"Am I weak because I can't handle this alone?\"\n\nNo. Seeking help is a sign of strength. Trauma therapy is effective — most people can improve significantly with professional help.\n\n---\n\n## Ethics and Boundaries\n\n**An AI assistant may:**\n- Convey knowledge about trauma and trauma sequelae (psychoeducation)\n- Normalize normal reactions and provide relief\n- Explain the window of tolerance\n- Suggest self-care strategies\n- Refer to professional help\n- Offer stabilization techniques\n\n**An AI assistant must NOT:**\n- Conduct trauma processing (EMDR, exposure, NET, IRRT)\n- Ask for or explore trauma details\n- Process flashback content (only stabilize)\n- Diagnose PTSD or other trauma-related disorders\n- Assess suicidality\n- Make medication-related recommendations\n- Make statements about blame or responsibility\n- \"Work through\" or \"process\" memories\n- Ask suggestive questions (\"Could it be that...\")\n\n**PARTICULARLY STRICT BOUNDARY:** Trauma processing belongs in the hands of trained trauma therapists. This skill offers exclusively psychoeducation and stabilization. For any form of trauma exploration: STOP and refer to a professional.\n\n**In case of acute crisis, ALWAYS refer to:**\n- 988 Suicide & Crisis Lifeline (US): 988\n- Crisis Text Line (US): Text HOME to 741741\n- Samaritans (UK): 116 123\n- Telefonseelsorge (DE): 0800 111 0 111 / 0800 111 0 222\n- Emergency services: 911 (US) / 112 (EU)\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*\n*Sources: Flatten et al. (2011), Siegel (2012), Reddemann (2001), S3 Guideline PTSD (2019) — Not professional therapy*"}, {"id": "tool:utilities:batch-file-ops", "name": "batch-file-ops", "cat": "utilities", "ver": "1.0.0", "status": "active", "desc": "Batch file operations (delete, move, copy, list) with glob patterns. CLI tool for efficient filesystem operations. Zero dependencies.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: batch-file-ops\nversion: 1.0.0\ntype: tool\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Batch file operations (delete, move, copy, list) with glob patterns. CLI tool for efficient filesystem operations. Zero dependencies.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: true\ncategory: utilities\ntags: [batch, file-ops, glob, cli, filesystem, cleanup]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/tools/batch_file_ops.py', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"batch-file-ops banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# batch_file_ops - Batch File Operations (Deutsch)\n\nCLI tool for efficient batch operations on files using glob patterns.\nSupports: delete, move, copy, list. Zero dependencies (Python stdlib only).\n\n---\n\n## Actions\n\n| Action | Description |\n|--------|-------------|\n| `delete` | Delete files matching a pattern |\n| `move` | Move files matching a pattern |\n| `copy` | Copy files matching a pattern |\n| `list` | List files matching a pattern |\n\n## CLI Usage\n\n```bash\npython batch_file_ops.py <action> <source> [<target>] --pattern \"<glob>\" [--dry-run] [--recursive]\n```\n\n### Arguments\n\n| Argument | Description |\n|----------|-------------|\n| `action` | `delete`, `move`, `copy`, or `list` |\n| `source` | Source directory |\n| `target` | Target directory (only for `move` and `copy`) |\n| `--pattern`, `-p` | Glob pattern (e.g., `*.py`, `TOOLS_*.py`) - Default: `*` |\n| `--dry-run`, `-n` | Preview only, no changes |\n| `--recursive`, `-r` | Search recursively in subdirectories |\n\n---\n\n## Beispiel & Anwendung\n\n```bash\n# List all Python files in a directory (Deutsch)\npython batch_file_ops.py list /path/to/directory --pattern \"*.py\"\n\n# Delete all .tmp files (dry-run first!) (Deutsch)\npython batch_file_ops.py delete /path/to/directory --pattern \"*.tmp\" --dry-run\npython batch_file_ops.py delete /path/to/directory --pattern \"*.tmp\"\n\n# Move files (Deutsch)\npython batch_file_ops.py move /source /target --pattern \"*.txt\"\n\n# Copy files (recursive) (Deutsch)\npython batch_file_ops.py copy /source /target --pattern \"*.md\" --recursive\n\n# Pattern examples (Deutsch)\npython batch_file_ops.py delete /path --pattern \"TOOLS_*.py\"\npython batch_file_ops.py list /path --pattern \"backup_202?-*\"\n```\n\n---\n\n## Notes\n\n- **Dry-run first:** Always use `--dry-run` first with `delete` and `move`\n- **Glob patterns:** Uses Python `pathlib.glob()` / `pathlib.rglob()`\n- **Windows-compatible:** Automatic UTF-8 output encoding\n- **Files only:** Directories are skipped (only files are processed)"}, {"id": "expert:utilities:bewerbungsexperte", "name": "bewerbungsexperte", "cat": "utilities", "ver": "1.1.0", "status": "active", "desc": "Spezialist fuer den gesamten Bewerbungsprozess. Analysiert Stellenanzeigen, optimiert Profile (LinkedIn/CV) und generiert massgeschneiderte Anschreiben. Generiert ASCII-Lebenslaeufe aus einer SQLite-Datenbank und Ordnerstruktur. cv_generator.py ist standalone portiert -- keine BACH-Runtime noetig.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: bewerbungsexperte\nversion: 1.1.0\ntype: expert\nauthor: BACH Team / ellmos (standalone port)\ncreated: 2026-01-25\nupdated: 2026-06-22\ndescription: Spezialist fuer den gesamten Bewerbungsprozess. Analysiert Stellenanzeigen, optimiert Profile (LinkedIn/CV) und generiert massgeschneiderte Anschreiben. Generiert ASCII-Lebenslaeufe aus einer SQLite-Datenbank und Ordnerstruktur. cv_generator.py ist standalone portiert -- keine BACH-Runtime noetig.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: true\ncategory: utilities\ntags: [bewerbung, cv, anschreiben, linkedin]\nlanguage: de\nstatus: active\ndependencies: {'tools': ['cv_generator.py'], 'services': [], 'protocols': [], 'python': ['sqlite3', 'pathlib', 'argparse', 're']}\nprovenance: {'origin': 'bach', 'origin_path': 'system/agents/_experts/bewerbungsexperte/', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-06-22', 'last_sync_to_origin': 'None', 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"bewerbungsexperte banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n> **English Translation** — Official English version of `bewerbungsexperte`.\n\n\n# BEWERBUNGSEXPERTE v1.1 (Deutsch)\n\n> Dein strategischer Partner fuer den naechsten Karriereschritt.\n\n## AKTIVIERUNG\n\n```bash\n# Beispiel-CV ohne Datenbankzugriff (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python cv_generator.py --dry-run\n\n# CV aus SQLite-Datenbank generieren (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python cv_generator.py --db <pfad/zu/daten.db>\n\n# CV in Datei speichern (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python cv_generator.py --db <pfad> --output lebenslauf.txt\n\n# Mit Ordner-Scan (Deutsch)\nPYTHONDONTWRITEBYTECODE=1 python cv_generator.py --db <pfad> --career-path <ordner>\n```\n\n## LEISTUNGSKATALOG\n\n### 1. CV-Generierung (`cv_generator.py`)\n- **Persoenliche Daten:** Aus `assistant_user_profile`-Tabelle lesen (key/value)\n- **Berufserfahrung:** Arbeitgeber-Ordner scannen (Zeugnisse, Vertraege)\n- **Ausbildung:** Abschluesse-Ordner scannen\n- **Fortbildungen:** Zertifikate-Ordner scannen\n- **Referenzen:** Aus `contacts`-Tabelle (category='beruflich')\n- **Dry-Run:** Ohne Datenbank -- Beispieldaten fuer Tests\n\n### 2. Stellendiagnose\n- **Keyword-Matching:** Abgleich von CV mit Job-Requirements (ATS-Safe)\n- **Unternehmens-Check:** Recherche zu Firmenkultur und Benefits\n\n### 3. Unterlagen-Service\n- **CV-Tuning:** Strukturierung und Pointierung von Erfahrungen\n- **Anschreiben:** Erstellung von individuellen, ueberzeugenden Briefen\n- **Portfolio:** Beratung zu Arbeitsproben und Referenzen\n\n## DATENBANK-TABELLEN (optional)\n\n`cv_generator.py` liest aus diesen Tabellen, wenn vorhanden:\n\n- `assistant_user_profile` (key TEXT, value TEXT) — Persoenliche Daten\n  - Felder: name, full_name, email, phone, address, birthday, nationality, marital_status\n- `contacts` (name, organization, position, phone, email, is_active, category) — Referenzen\n\nFehlende Tabellen werden ignoriert (leere Sektionen im CV).\n\n## ORDNERSTRUKTUR (fuer --career-path etc.)\n\n```\n_Arbeitgeber/\n  Firma_A_2020-2023/\n    Arbeitsvertrag.pdf\n    Arbeitszeugnis.pdf\n  Firma_B_2018-2020/\n    ...\n_Abschluesse/\n  Universitaet/\n    Bachelor_Zeugnis.pdf\n_Fortbildungen/\n  Zertifikat_Cloud_AWS_2024.pdf\n```\n\n## CLI-OPTIONEN\n\n```\n--db <pfad>           Pfad zur SQLite-Datenbank (Pflicht ohne --dry-run)\n--output, -o          Ausgabedatei (ansonsten stdout)\n--career-path         Pfad zum Arbeitgeber-Ordner\n--education-path      Pfad zum Abschluesse-Ordner\n--certs-path          Pfad zum Fortbildungen-Ordner\n--dry-run             Beispiel-CV ohne Datenbankzugriff\n```\n\n## WORKFLOW: CV-GENERIERUNG\n\n1. **Vorbereitung**\n   - SQLite-DB bereitstellen (BACH-DB oder eigene)\n   - Ordnerstruktur mit Dokumenten anlegen (optional)\n\n2. **Test ohne DB**\n   - `python cv_generator.py --dry-run` -- prueft ob Tool funktioniert\n\n3. **Generierung**\n   - `python cv_generator.py --db <pfad> --career-path <arbeitgeber>`\n   - Ausgabe pruefen und ggf. anpassen\n\n4. **Export**\n   - `python cv_generator.py --db <pfad> --output lebenslauf.txt`\n\n## ABHÄNGIGKEITEN\n\nNur Python-Stdlib: `sqlite3`, `pathlib`, `argparse`, `re`, `datetime`.\nKein pip-Install noetig, kein BACH-Runtime-Import.\n\n## ÄNDERUNGSLOG\n\n### 1.1.0 (2026-06-22)\n- Standalone portiert aus BACH v1.0.0\n- `--db <pfad>` statt hardcodiertem Origin-DB-Pfad\n- `--dry-run`-Modus hinzugefuegt\n- `--scan-folders` entfernt (erforderte BACH user_data_folders-Tabelle)\n- Footer-Text neutralisiert\n- BACH-Runtime-Unabhaengigkeit verifiziert\n\n### 1.0.0 (2026-01-25, BACH-intern)\n- Initiale Version in BACH system/agents/_experts/bewerbungsexperte/\n\n---\nStatus: AKTIV\nDomain: Karriereberatung"}, {"id": "skill:utilities:brainstorm", "name": "brainstorm", "cat": "utilities", "ver": "1.0.0", "status": "active", "desc": "Structured creativity methods for idea generation: SCAMPER, Six Thinking Hats, Mind Mapping, Reverse Brainstorming, TRIZ, and Rapid Ideation.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: brainstorm\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-15\nupdated: 2026-03-15\ndescription: Structured creativity methods for idea generation: SCAMPER, Six Thinking Hats, Mind Mapping, Reverse Brainstorming, TRIZ, and Rapid Ideation.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: utilities\ntags: [brainstorm, creativity, ideation, scamper, six-hats, innovation]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/_services/brainstorm.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-15', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"brainstorm banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Brainstorm (Deutsch)\n\n> Structured creativity for innovation — SCAMPER, Six Hats, Mind Mapping, Reverse Brainstorming, TRIZ, Rapid Ideation\n\n---\n\n## When to Use?\n\n- New ideas needed\n- Stuck / creativity block\n- Innovation sought\n- Solve a problem creatively\n\n**Trigger words:** brainstorm, ideas, creative, innovative, ideation\n\n---\n\n## Methods\n\n### 1. SCAMPER\n\n**Substitute, Combine, Adapt, Modify, Put to other use, Eliminate, Reverse**\n\nSystematically improve existing solutions:\n- **S**ubstitute: What can be replaced?\n- **C**ombine: What can be combined?\n- **A**dapt: What can be adapted?\n- **M**odify: What can be changed?\n- **P**ut to other use: What else could it be used for?\n- **E**liminate: What can be removed?\n- **R**everse: What can be reversed?\n\n---\n\n### 2. Six Thinking Hats (Edward de Bono)\n\nSystematically think through 6 perspectives:\n\n- **White Hat — Facts:** What information do we have? What's missing?\n- **Red Hat — Emotion:** How does it feel? Intuition, gut feeling\n- **Black Hat — Critique:** What could go wrong? Risks, weaknesses\n- **Yellow Hat — Optimism:** What are the opportunities? Best case\n- **Green Hat — Creativity:** New ideas? Out-of-the-box?\n- **Blue Hat — Meta:** Process control, summary, next steps\n\n**Process:** Define problem (Blue) -> Facts (White) -> Emotions (Red) -> Critique (Black) -> Positives (Yellow) -> New ideas (Green) -> Summarize (Blue)\n\n---\n\n### 3. Mind Mapping\n\nVisualize thoughts hierarchically:\n1. Central topic\n2. Main branches (3-7)\n3. Sub-branches for each category\n4. Add details and ideas\n5. Identify connections\n\n---\n\n### 4. Reverse Brainstorming\n\nInvert the problem: \"How do we make it WORSE?\"\n\n1. Invert the problem\n2. Collect bad ideas\n3. Reverse = Good ideas\n\nParticularly effective when direct ideation is stalled.\
