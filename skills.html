Paperversion nötig, in TODO.md eingetragen.\n```\n\n## Red Flags\n\n| Gedanke | Realität |\n| --- | --- |\n| „Ich schreibe den Text gleich flüssiger\" | Substanz und Stimme gehören dem Autor — der Skill entfernt Fremdkörper, er poliert nicht. |\n| „Stilmarker gefunden → löschen\" | Klasse 5 wird markiert, nicht automatisch umgeschrieben; nur eindeutige Formelhaftigkeit glätten. |\n| „Die deutsche Fassung reicht\" | Residue sitzt oft nur in EINER Fassung — immer alle Sprachfassungen prüfen und synchron halten. |\n| „Disclosure raus, dann ist es sauber\" | Falsch herum: LLM-Dank raus, korrekte Disclosure REIN — Verschleiern ist keine Hygiene. |\n\n## Verwandte Skills\n\n- `encoding-fix` — Byte-/Encoding-Reparatur (Mojibake); dieser Skill hier arbeitet auf Inhaltsebene.\n- `bilingual-doc-sync` — Synchronhaltung der Sprachfassungen, in die Fixes eingepflegt werden.\n- `rotation-check` — Gerüst für den periodischen Lauf über einen Dokumentbestand.\n- `textproduction` — Text-Erzeugung (dieser Skill ist die QA danach).\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-07-04)\n- Initiale Version. Abstrahiert aus der Codex-Automation „research-llm-muster-check\"\n  (Chat-Anteile in Papern, LLM-Danksagungen, AI-Disclosure) und auf beliebige\n  Deliverable-Texte verallgemeinert; Prüfkatalog um Platzhalter, Stilmuster und\n  Scan-Signaltabelle erweitert."}, {"id": "tool:utilities:music-composer", "name": "music-composer", "cat": "utilities", "ver": "1.0.0", "status": "stable", "desc": "Compose video-synced background scores from a storyline JSON using local waveform synthesis (numpy + ffmpeg). Styles: chiptune, ambient, electronic. Deterministic, offline, no cloud service.", "langs": ["en"], "text": "---\nname: music-composer\nversion: 1.0.0\ntype: tool\nauthor: ellmos contributors\ncreated: 2026-07-31\nupdated: 2026-07-31\ndescription: >\n  Compose video-synced background scores from a storyline JSON using local\n  waveform synthesis (numpy + ffmpeg). Styles: chiptune, ambient, electronic.\n  Deterministic, offline, no cloud service.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: utilities\ntags: [music, audio, score, composition, chiptune, ambient, electronic, video-sync, waveform-synthesis]\nlanguage: en\nstatus: stable\ndependencies:\n  tools: [ffmpeg]\n  services: []\n  protocols: []\n  python: [numpy]\nprovenance:\n  origin: local-reconstruction\n  origin_license: MIT\n  notes: >\n    Method reconstructed from a video-synced score composed for a 179.5 s\n    explainer video (5 music sections mapped from 7 story acts). Canonical\n    engine: ai-media-editor repo, tools/compose_music.py (github.com/ellmos-ai/ai-media-editor).\n    A standalone copy is bundled here for offline use.\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"music-composer banner\">\n\n# music-composer — Storyline → Score\n\nCompose a background score that follows a video's dramatic arc, fully local:\nnumpy waveform synthesis (oscillators, ADSR, layering, delay reverb) + ffmpeg\nfor MP3 encoding. No samples, no MIDI hardware, no cloud API.\n\n## When to use\n\n- A video/podcast needs background music that hits story beats at exact\n  timestamps (opening, tension dip, drive section, climax, outro).\n- You want a deterministic, re-renderable score (same seed → same audio).\n- Chiptune, ambient, or electronic styles are acceptable.\n\n## When NOT to use (honest genre limits)\n\nWaveform synthesis can deliver **chiptune, ambient, and electronic** background\nbeds. It cannot deliver **pop, rock, classical, or orchestral film music** with\nits built-in synth — but the arrangement is backend-neutral: see \"Beyond\nwaveform synthesis\" below for rendering the same composition through\nSoundFonts, orchestral libraries, or external generation.\n\n## The method: Storyline → Score\n\nReconstructed as-is from the reference score (179.5 s, C minor):\n\n1. **Map story acts to music sections.** Acts that share one emotional state\n   merge into one section (reference: 7 acts → 5 sections; acts 1–3 formed a\n   single 62 s calm opening). Each section gets exact `start`/`end` in seconds.\n2. **Assign emotion + intensity per section.**\n   - *Emotion* selects the chord progression (scale degrees, minor example):\n     `calm` i–VI–III–VII · `tense` iv–i–V–i · `alive` VI–VII–i–III ·\n     `driving` i–VII–VI–V · `epic` iv–V–VI–i (V is harmonic-minor major).\n   - *Intensity* (0–1) drives tempo feel (BPM), layer count and volume ramp.\n     Layers join at thresholds: pads always → sparse bells (<0.3) → arp (≥0.25)\n     → bass (≥0.4) → lead (≥0.45) → drums (≥0.5) → drive extras (≥0.65) →\n     pad octave doubling (≥0.85).\n3. **Place special events on the timeline.**\n   - `damp`: Gaussian volume duck — `1 - depth · exp(-((t-T)²)/(2σ²))`.\n     Reference: depth 0.5, σ 1 s at T=84 s, on the spoken beat\n     \"Two databases. Same cluster.\" (~1:24).\n   - `climax`: time window forcing full layering, peak volume, octave-doubled\n     pads (reference: 154–170 s = 2:34–2:50, on the 2D→3D morph).\n   - `outro`: from its start, drums/bass/lead drop out and bells fade to 20 %\n     (reference: 170–179.5 s, closing card).\n4. **Glue.** Raised-cosine smoothing at section boundaries (~2.5 s), global\n   fade-in/out, feedback-delay reverb (100 ms, decay 0.25), tanh drive +\n   peak normalization to a background level (reference master measured:\n   mean ≈ −22 dB, max ≈ −1.6 dB).\n5. **Stay behind the voiceover.** Sections marked \"background\" cap their\n   volume ramp; the score is a bed, not a lead.\n\n## Usage\n\n```bash\n# Bundled standalone copy (this skill folder):\npython compose_music.py storyline.json -o out/score\npython compose_music.py --init       # print a storyline template\npython compose_music.py --selftest   # 3 s render + verification\n\n# Canonical engine (preferred when the repo is available):\npython <ai-media-editor>/tools/compose_music.py storyline.json -o out/score\n```\n\nOutput: `score.wav` (stereo 16-bit 44.1 kHz), `score.mp3` (192k, needs ffmpeg\non PATH; skipped with a warning otherwise), `score.notes.json` (the\narrangement/note log: every placed note with time, layer, MIDI pitch,\nduration, velocity), and `score.mid` — a real **Standard MIDI File** (type 1:\ntempo track with one tempo event per section, note track with GM program\nhints per style, drums on GM channel 10). Written dependency-free; no\npretty_midi/mido needed.\n\nDeterminism: same storyline + same `seed` → byte-identical WAV.\n\n## Storyline JSON reference\n\n```json\n{\n  \"title\": \"my-score\",\n  \"duration\": 179.5,\n  \"bpm\": 100,\n  \"key\": \"C\",\n  \"mode\": \"minor\",\n  \"style\": \"chiptune\",\n  \"seed\": 42,\n  \"fade_in\": 3.0,\n  \"fade_out\": 5.0,\n  \"crossfade\": 2.5,\n  \"peak\": 0.85,\n  \"drive\": 2.0,\n  \"reverb\": {\"delay_ms\": 100, \"decay\": 0.25},\n  \"sections\": [\n    {\"start\": 0.0, \"end\": 62.0, \"emotion\": \"calm\", \"intensity\": 0.18, \"bpm\": 60,\n     \"comment\": \"optional note\"},\n    {\"start\": 62.0, \"end\": 88.0, \"emotion\": \"tense\", \"intensity\": 0.4, \"bpm\": 72}\n  ],\n  \"events\": [\n    {\"type\": \"damp\", \"time\": 84.0, \"depth\": 0.5, \"width\": 1.0},\n    {\"type\": \"climax\", \"start\": 154.0, \"end\": 170.0},\n    {\"type\": \"outro\", \"start\": 170.0}\n  ]\n}\n```\n\n- `duration` (required, seconds), `sections` (required, ≥1, sorted,\n  non-overlapping, within duration).\n- Section fields: `start`, `end` (required); `emotion` ∈ calm | tense | alive |\n  driving | epic | outro; `intensity` 0–1 (default per emotion); `bpm`\n  (default: global `bpm`); `melody` (optional MIDI list, cycled; otherwise a\n  seeded random walk over scale tones is generated).\n- `key`: note name (C, C#, Db, …), `mode`: minor | major.\n- `style`: chiptune | ambient | electronic (see below).\n- Event `damp`: `time` (s), `depth` 0–1, `width` = σ in seconds.\n- Defaults for fades/crossfade/peak/drive/reverb shown above; all optional.\n\nFull worked example (the reference video's reconstruction):\n[`example-storyline.json`](example-storyline.json) — renders a 179.5 s score\nmatching the original's master level (mean ≈ −22 dB, max ≈ −1.6 dB).\n\n## Style presets\n\n| Style | Lead | Bass/Arp | Drums | Character |\n|---|---|---|---|---|\n| `chiptune` | square + detune + triangle | triangle bass, fast square arps | noise-based kick/hat/snare | retro console, arpeggio-driven (the reference style) |\n| `ambient` | soft triangle/sine | slow arps, long-attack pads | only from intensity ≥ 0.75 | sparse, bell-focused, wide reverb feel |\n| `electronic` | sawtooth + detune + sub | punchy bass, saw arps | full kit | driving EDM-adjacent bed |\n\n## Beyond waveform synthesis: better sound backends\n\nThe genre ceiling above is the **sound backend, not the composition**. The\nStoryline→Score method produces a backend-neutral arrangement; the bundled\nnumpy synth is just the free, offline default renderer. Every run also writes\na Standard MIDI File (`<out>.mid`) — render it through better instruments:\n\n- **Path A — SoundFont (recommended: local, free, no cloud).**\n  Install FluidSynth (fluidsynth.org, Windows: `winget install FluidSynth`)\n  plus a free GM SoundFont (GeneralUser GS by S. Christian Collins, or\n  MuseScore_General.sf2). Then:\n  `fluidsynth -ni soundfont.sf2 score.mid -F score_sf.wav -r 44100` → MP3 via\n  ffmpeg. This unlocks pop/rock band sounds, piano, basic strings.\n- **Path B — orchestral / film.** Free orchestral libraries: VSCO 2 Community\n  Edition, Soni Musicae, Salamander Grand Piano. Better strings/brass, more\n  epic. Honest note: articulation and humanization (velocity variation,\n  legato, dynamics curves) matter more than the sample set — and true\n  film-score epicness additionally needs arrangement maturity; a backend\n  alone is not enough.\n- **Path C — external AI generation (Suno etc.).** Possible, but raises\n  privacy/rights questions — only after explicit user approval, never the\n  default.\n\nPlanned but **not yet implemented**: a `humanize` option in the engine\n(per-note velocity/timing jitter) so sample-based rendering does not sound\nmechanical (marked as TODO in the engine docstring).\n\n## Boundaries\n\n- English and German storyline comments are fine; keys/values are fixed English.\n- Very short durations (< ~10 s) work but compress the dramaturgy (fades and\n  crossfades are auto-capped at 20 % of duration / 50 % of the shortest section).\n- The note log (`*.notes.json`) is the analysis-friendly record; the `*.mid`\n  file is the interchange format for DAWs/SoundFont renderers (GM program\n  numbers are rough per-style hints — remap them to taste).\n"}, {"id": "tool:utilities:nulcleaner", "name": "nulcleaner", "cat": "utilities", "ver": "1.0.0", "status": "active", "desc": "Finds and deletes Windows-reserved NUL files created by using /dev/null in Git Bash. Headless or with GUI.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: nulcleaner\nversion: 1.0.0\ntype: tool\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Finds and deletes Windows-reserved NUL files created by using /dev/null in Git Bash. Headless or with GUI.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: true\ncategory: utilities\ntags: [windows, nul, cleanup, git-bash, filesystem]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/tools/nulcleaner.py', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"nulcleaner banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# nulcleaner - Windows NUL File Cleanup (Deutsch)\n\n## The Problem\n\nWhen `/dev/null` is used in commands under Git Bash on Windows (e.g., `> /dev/null`),\ninstead of redirecting to nowhere, an actual **file named `nul`** is created in the current\ndirectory. Windows reserves \"NUL\" as a device name, which means these files cannot be\ndeleted normally.\n\nThis tool finds and deletes such NUL files via the extended UNC path (`\\\\?\\`).\n\n---\n\n## Modes\n\n| Mode | Description |\n|------|-------------|\n| `scan` | Recursively scan directory for NUL files |\n| `delete` | Find and delete NUL files |\n| `gui` | Graphical interface with file selection |\n\n---\n\n## CLI Usage\n\n```bash\n# Scan only (shows found NUL files) (Deutsch)\npython nulcleaner.py scan /path/to/directory\n\n# Scan and delete (Deutsch)\npython nulcleaner.py delete /path/to/directory\n\n# Start GUI mode (Deutsch)\npython nulcleaner.py gui\n```\n\n---\n\n## Headless API (for Integration)\n\nThe tool also provides a Python API for headless operation:\n\n```python\nfrom nulcleaner import clean_nul_files_headless\n\nresult = clean_nul_files_headless(\"/path/to/directory\", verbose=True)\nprint(f\"Found: {result['found']}, Deleted: {result['deleted']}\")\n```\n\n**Return value:** `{'found': int, 'deleted': int, 'errors': list}`\n\n---\n\n## Technical Details\n\n- Uses the extended UNC path (`\\\\?\\`) to delete Windows-reserved filenames\n- Recursive scan with `os.walk()`\n- GUI with tkinter (no external dependencies)\n- Only works on Windows (where the problem occurs)\n\n---\n\n## Prevention\n\nBest to avoid `/dev/null` in Git Bash altogether. Instead:\n- Simply omit the output\n- Use `2>&1` for stderr redirection\n- Pay attention to Windows compatibility in shell scripts"}, {"id": "skill:utilities:privat-mail-writer", "name": "privat-mail-writer", "cat": "utilities", "ver": "0.2.0", "status": "active", "desc": "Dieser Skill sollte genutzt werden, wenn der User private oder halbformale E-Mails schreiben, beantworten, absagen, nachfassen, kürzen, umformulieren oder im eigenen Stil entwerfen lassen will, besonders bei Terminen, offiziellen Absagen, freundlichen Kurzantworten und kontaktabhängigem Ton. Profilanalyse erst bei einem konkreten Mail-Schreibauftrag starten.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: privat-mail-writer\nversion: 0.2.0\ntype: skill\nauthor: Lukas Geiger + GPT\ncreated: 2026-06-19\nupdated: 2026-06-19\ndescription: Dieser Skill sollte genutzt werden, wenn der User private oder halbformale E-Mails schreiben, beantworten, absagen, nachfassen, kürzen, umformulieren oder im eigenen Stil entwerfen lassen will, besonders bei Terminen, offiziellen Absagen, freundlichen Kurzantworten und kontaktabhängigem Ton. Profilanalyse erst bei einem konkreten Mail-Schreibauftrag starten.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: utilities\ntags: [mail, email, privat, antwort, absage, termin, schreibstil, kontaktprofil]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'optional_tools': [{'name': 'mail-connector', 'path': '.AI/.MODULES/mail-connector/', 'cli': 'mailc', 'python_module': 'mail_connector.cli', 'usage': 'mailc context <kontakt> --mode reply --json  # Liefert Mail-Kontext als JSON für Profilaufbau', 'note': 'Optionales lokales IMAP-CLI-Tool. Nur nutzen wenn installiert (`pip install -e .` im Modulordner). Ohne dieses Tool arbeitet der Skill ohne Mailzugriff.'}], 'services': ['mail-backend-optional'], 'protocols': ['kontaktprofil', 'usecase-registry'], 'python': []}\nprovenance: {'origin': 'custom', 'origin_path': 'None', 'origin_version': 'None', 'origin_repo': 'None', 'last_sync_from_origin': 'None', 'last_sync_to_origin': 'None', 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"privat-mail-writer banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n> **English Translation** — Official English version of `privat-mail-writer`.\n\n\n# Privat-Mail-Writer (Deutsch)\n\n## Übersicht & Zweck\n\nPrivat-Mail-Writer erstellt kurze, freundliche und kontaktabhängig passende Mailentwürfe. Der Skill ist nutzerneutral angelegt: Er enthält keine echten Kontakte, keine echten Signaturen und keine echten Mailinhalte.\n\nDer Kern ist lazy und empirisch: Erst wenn der User eine konkrete Mail an einen Kontakt schreiben will, das Profil für genau diesen Kontakt anlegen oder aktualisieren. Keine Profile auf Vorrat erzeugen. Wenn keine Mailhistorie verfügbar ist, keine Stilbehauptungen erfinden, sondern neutral kurz schreiben oder gezielt nach Beispielen fragen.\n\n## Ressourcen\n\n- `CONFIG.md` - zentrale Präferenzen, Wenn-dann-Regeln, Permission-Gates und Blacklist-Schalter.\n- `BLACKLIST.md` - Ausschlüsse für Newsletter, Systemsender und Kontakte ohne Profil.\n- `USECASES.md` - Usecase-Registry und Regeln für neue Usecases.\n- `SIGNATURES.md` - neutrale Signatur- und Grußformel-Regeln.\n- `MUSTER-BLOCKS.md` - kurze wiederverwendbare Textbausteine.\n- `kontaktprofile.json` - leeres, nutzerneutrales Schema für Kontaktprofile. Echte Profile nur lokal und datensparsam führen.\n\n## Arbeitsablauf\n\n1. **Konfig laden:** `CONFIG.md` lesen. Wenn Blacklist aktiv ist, zusätzlich `BLACKLIST.md` prüfen.\n2. **Trigger prüfen:** Nur bei einem konkreten Schreibauftrag für einen bestimmten Kontakt profilieren, z. B. \"schreib eine Mail an Bruder Simon\". Keine Inbox-Sweeps nur zur Profilanlage.\n3. **Blacklist prüfen:** Newsletter, No-Reply, Systemsender und ausgeschlossene Domains/Kontakte bekommen kein Kontaktprofil. Für solche Fälle neutral antworten oder nicht antworten.\n4. **Mailaufgabe erkennen:** Ziel, Empfänger, Anlass, gewünschte Kürze, Sprache, Ton und notwendige Fakten bestimmen.\n5. **Usecase bestimmen:** `USECASES.md` lesen und den passendsten Usecase auswählen. Wenn kein Usecase passt, einen neuen wiederverwendbaren Usecase anlegen oder bei fehlenden Pflichtangaben kurz nachfragen.\n6. **Kontaktprofil prüfen:** Für jeden nicht ausgeschlossenen Empfänger ein vorhandenes Profil in `kontaktprofile.json` oder in einer privaten lokalen Profilkopie suchen.\n7. **Profil erstellen oder aktualisieren:** Wenn kein belastbares Profil vorhanden ist, bis zu die letzten zehn relevanten Mails mit genau diesem Kontakt aus dem verfügbaren Mail-Backend lesen. Gesendete Mails sind für Schreibstil stärker zu gewichten als empfangene Mails.\n8. **Empirie speichern:** Im Kontaktprofil nur zusammenfassende, belegbare Stil-, Verhältnis- und Kategorie-Signale speichern. Keine Rohmails, keine langen Zitate und keine unnötigen personenbezogenen Details ablegen.\n9. **Permission-Gate anwenden:** Vor Senden, heiklen Inhalten oder fehlenden Pflichtangaben die Gates aus `CONFIG.md` beachten.\n10. **Entwurf schreiben:** Usecase-Form, Kontaktprofil und aktuelle Aufgabe zusammenführen. Den Stil nachahmen, ohne falsche Nähe, falsche Zusagen oder unbelegte Gründe zu erfinden.\n11. **Ausgabe liefern:** Standardmäßig Betreff und Mailtext ausgeben. Nur senden, wenn der User ausdrücklich das Senden freigegeben hat und ein passendes Mail-Tool verfügbar ist.\n\n## Kontaktprofile\n\nEin Kontaktprofil beschreibt nicht die Person an sich, sondern das beobachtete Kommunikationsverhältnis und den Schreibstil des Kontoinhabers gegenüber dieser Person.\n\nProfilfelder sollen knapp bleiben:\n\n- letzte Kontaktzeit\n- Anzahl und Zeitraum der ausgewerteten Mails\n- Anrede und Grußformel\n- Du/Sie/Formalität\n- Satzlänge und typische Kürze\n- Wärmegrad, Direktheit, Verbindlichkeit\n- Verhältnis-Einschätzung mit Konfidenz\n- Kontaktkategorie, z. B. `family`, `inner-circle`, `friends`, `colleagues`, `services`, `official`, `unknown`\n- Quelle der Kategorie: User-Aussage, Mailtext, Adressbuch, Signatur oder Inferenz\n- Evidenzgrad der Kategorie: `user-confirmed`, `strong`, `medium`, `weak`\n- kurze paraphrasierte Belege wie \"mehrere gesendete Mails enden mit 'Viele Grüße'\" oder \"Antworten bleiben unter fünf Sätzen\"\n\nMonatlich prüfen, ob ein Alters-Check fällig ist. Wenn der Monat des aktuellen Datums vom gespeicherten `last_age_check` abweicht, Profile löschen, deren `last_contact_at` mehr als ein Jahr zurückliegt, und `last_age_check` auf das aktuelle Datum setzen. Der Startwert im neutralen JSON ist `2026-06-18`.\n\n## Stilregeln\n\n- Kurz schreiben. Privatmails brauchen selten lange Vorreden.\n- Freundlich bleiben, aber nicht übererklären.\n- Echte Gründe nur nennen, wenn sie vom User genannt oder aus dem Kontext sicher sind.\n- Bei offiziellen Absagen: höflich, klar, ohne Rechtfertigungsroman.\n- Bei Unsicherheit über Fakten: eine knappe Rückfrage stellen, bevor der Entwurf finalisiert wird.\n- Deutsche Texte mit echten Umlauten schreiben: ä, ö, ü, Ä, Ö, Ü, ß.\n\n## Neue Usecases\n\nWenn eine Mailaufgabe wiederverwendbar wirkt und in `USECASES.md` noch nicht abgedeckt ist, den Usecase ergänzen:\n\n- stabile ID, z. B. `UC-002`\n- Name und typische Trigger\n- Ziel der Mail\n- Pflichtangaben und optionale Angaben\n- Standardlänge und Ton\n- kurze Vorlage oder Bausteinfolge\n- offene Rückfragen, falls Pflichtangaben fehlen\n\nEin einmaliger Sonderfall wird nicht als Usecase aufgebläht. In diesem Fall nur den aktuellen Entwurf liefern.\n\n## Ausgabeformat\n\nFür normale Entwürfe:\n\n```text\nBetreff: ...\n\nSehr geehrte ...\n\n...\n\nMit freundlichen Grüßen\n[Signatur]\n```\n\nWenn der User nur Text ohne Betreff will, nur den Mailtext liefern. Wenn mehrere Varianten sinnvoll sind, höchstens zwei Varianten anbieten: \"sehr kurz\" und \"etwas wärmer\".\n\n## Grenzen\n\nKein Kontaktprofil erfinden. Keine vertraulichen Details aus Mails unnötig in die Antwort kopieren. Keine Mail ohne ausdrückliche Freigabe senden. Keine juristischen, medizinischen oder finanziellen Zusagen formulieren, wenn der User sie nicht klar vorgibt.\n\n## Änderungsprotokoll\n\n### 0.2.0 (2026-06-19)\n- `CONFIG.md` und `BLACKLIST.md` ergänzt.\n- Profilanlage auf konkrete Mail-Schreibaufträge begrenzt.\n- Kontaktkategorien mit Quelle und Evidenzgrad in das Profilschema aufgenommen.\n\n### 0.1.0 (2026-06-19)\n- Initiale Version mit Usecase-Registry, Signaturregeln, Musterblöcken und leerem Kontaktprofil-JSON."}, {"id": "skill:utilities:steuer-assistent", "name": "steuer-assistent", "cat": "utilities", "ver": "0.1.0", "status": "active", "desc": "Points to the standalone module steuer-assistent: a local, offline-first receipt worksheet for German employee income-related expenses (Werbungskosten) -- record, sum to the cent, private ZIP export. Use this skill when Werbungskosten receipts should be prepared in a structured way -- with a clear boundary: not tax advice, no deductibility check, no creation or submission of a tax return (that happens via ELSTER or approved software).", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: steuer-assistent\nversion: 0.1.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-07-23\nupdated: 2026-07-23\ndescription: Points to the standalone module steuer-assistent: a local, offline-first receipt worksheet for German employee income-related expenses (Werbungskosten) -- record, sum to the cent, private ZIP export. Use this skill when Werbungskosten receipts should be prepared in a structured way -- with a clear boundary: not tax advice, no deductibility check, no creation or submission of a tax return (that happens via ELSTER or approved software).\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\nprovenance: {'origin': 'external', 'origin_repo': 'https://github.com/ellmos-ai/steuer-assistent', 'origin_path': 'SKILL.md, steuer_assistent/ (CLI module)', 'origin_version': None, 'last_sync_from_origin': '2026-07-23', 'last_sync_to_origin': None, 'local_changes_since_sync': False}\ncategory: utilities\ntags: [tax, germany, receipts, finance, wrapper, pointer-skill]\nlanguage: de\nstatus: active\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"steuer-assistent banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# steuer-assistent -- Pointer Skill (Deutsch)\n\nThis skill is a **thin pointer (wrapper)** to the standalone, public module\nrepository\n[`ellmos-ai/steuer-assistent`](https://github.com/ellmos-ai/steuer-assistent)\n(MIT license, public). The actual skill lives there -- this repository only\nlinks to it and documents installation.\n\nNote: `steuer-assistent` is scoped to German tax law (employee\nincome-related expenses, \"Werbungskosten\"); its CLI and documentation are\nGerman-language by design.\n\n## What the module does\n\n`steuer-assistent` is a small, offline-first Python module for\nself-categorized receipts for German employee income-related expenses\n(Werbungskosten):\n\n- Record receipts (category, amount, date, optional note).\n- Sum recorded expenses to the cent, per year.\n- Export a private, non-official ZIP worksheet (CSV + summary + a\n  non-official notice, without the receipt files themselves).\n- Local store (default `%USERPROFILE%\\.steuer-assistent\\steuer.db`), no\n  network access, no cloud upload, no access to other databases.\n\n## Boundaries (important)\n\n- **Not tax advice.** The module does not assess the deductibility of\n  individual items, and it does not create or submit a tax return.\n- Official electronic submission happens exclusively through ELSTER or\n  approved software -- not through this module.\n- Scope: a private worksheet for employee income-related expenses; no\n  business/self-employment expense tracking.\n\n## Installation (generic, no local paths)\n\n1. Clone the module:\n   ```bash\n   git clone https://github.com/ellmos-ai/steuer-assistent.git <clone-path>\n   ```\n2. Install and verify:\n   ```bash\n   cd <clone-path>\n   python -m pip install -e .\n   python -B -m pytest tests -q -p no:cacheprovider\n   ```\n3. Adopt `<clone-path>/SKILL.md` into your own skill environment (e.g.\n   `~/.claude/skills/steuer-assistent/`). Do NOT commit real local paths or\n   hostnames into a versioned skill environment.\n4. Adjust the store path if needed via `STEUER_ASSISTENT_DB=<path>` or\n   `--store <path>`; the default is the user's home directory.\n5. For CLI commands, privacy, and boundaries, see the module repo's README.\n\n## Origin of this pointer skill\n\nThis wrapper was added on 2026-07-23 as a showcase entry for the\n`ellmos-ai/skills` repository. There is **no code duplication** -- maintenance\nand versioning stay solely in the `ellmos-ai/steuer-assistent` module repo.\n\n## Änderungsprotokoll\n\n### 0.1.0 (2026-07-23)\n- Initial pointer skill for `ellmos-ai/steuer-assistent`."}, {"id": "skill:utilities:structured-thinking", "name": "structured-thinking", "cat": "utilities", "ver": "1.0.0", "status": "active", "desc": "Meta-skill: Structured thinking as a 3-phase workflow. Combines analysis (think), ideation (brainstorm), and decision-making (decide) into one continuous process.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: structured-thinking\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-05-19\nupdated: 2026-05-19\ndescription: Meta-skill: Structured thinking as a 3-phase workflow. Combines analysis (think), ideation (brainstorm), and decision-making (decide) into one continuous process.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: utilities\ntags: [denken, analyse, kreativitaet, entscheidung, workflow, meta-skill]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'custom', 'merged_from': ['utilities/think (v1.0.0)', 'utilities/brainstorm (v1.0.0)', 'utilities/decide (v1.0.0)'], 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"structured-thinking banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Structured Thinking — Analyze, Ideate, Decide (Deutsch)\n\n> Meta-workflow for structured thinking: from problem analysis through creative solutions to a well-founded decision\n\n---\n\n## Workflow & Vorgehen\n\n```\nProblem/Question\n     |\n     v\nPhase 1: ANALYZE (think)\n  Divide & Conquer, Root Cause, Constraint Relaxation\n     |\n     v\nPhase 2: IDEATE (brainstorm)\n  SCAMPER, Six Hats, Reverse Brainstorming, Rapid Ideation\n     |\n     v\nPhase 3: DECIDE (decide)\n  Pro/Con, Weighted Scoring, Scenario Analysis, Eisenhower\n     |\n     v\nResult + Rationale\n```\n\n---\n\n## Phase 1: Analyze\n\nGoal: Understand the problem, identify causes, recognize structure.\n\n### Approaches\n\n| Method | When | Procedure |\n|--------|------|-----------|\n| **Divide & Conquer** | Complex problem | Problem → sub-problems → solve individually → combine |\n| **Root Cause (5x Why)** | Symptom visible, cause unclear | Symptom → Why? → Why? → ... → cause → solution |\n| **Constraint Relaxation** | Problem appears unsolvable | Relax constraints → solve → re-tighten constraints |\n| **Analogy Search** | Novel problem | Find a similar known problem → adapt its solution |\n\n### Analysis Frameworks\n\n| Framework | Application |\n|-----------|-------------|\n| **SWOT** | Strengths / Weaknesses / Opportunities / Threats |\n| **Pareto** | 80/20 — What provides the biggest leverage? |\n| **Fishbone** | Systematic cause analysis (Ishikawa) |\n\n### Heuristics under Uncertainty\n\n1. What is the worst-case scenario?\n2. Is it reversible?\n3. What is the cost of not acting?\n\n### Heuristics under Complexity\n\n1. What is the simplest first step?\n2. What would an expert do?\n3. What would the 80% solution be?\n\n---\n\n## Phase 2: Ideate\n\nGoal: Generate as many solution approaches as possible. Quantity over quality. NO criticism during this phase.\n\n### Methods\n\n**SCAMPER** — Systematically improve existing solutions:\n- **S**ubstitute: What to replace? | **C**ombine: What to combine? | **A**dapt: What to adapt?\n- **M**odify: What to change? | **P**ut to other use: What else could it serve? | **E**liminate: What to drop?\n- **R**everse: What to invert?\n\n**Six Thinking Hats** (de Bono) — 6 perspectives in sequence:\n1. Blue: Process control (\"What is the question?\")\n2. White: Facts (\"What do we know?\")\n3. Red: Emotion (\"What feels right?\")\n4. Black: Criticism (\"What could go wrong?\")\n5. Yellow: Optimism (\"What are the opportunities?\")\n6. Green: Creativity (\"What new ideas are there?\")\n\n**Reverse Brainstorming** — Invert the problem:\n1. \"How do we make it WORSE?\"\n2. Collect bad ideas\n3. Invert = good ideas\n\n**Rapid Ideation** — 50+ ideas in 20 minutes:\n- Round 1 (5 min): Open ideation\n- Round 2 (5 min): Variations\n- Round 3 (5 min): Combinations\n- Round 4 (5 min): Extreme ideas\n\n### After Ideation\n\n1. Clustering: Group similar ideas\n2. Feasibility/Impact matrix: Rate feasibility vs. impact\n3. Select top 5-10 for Phase 3\n\n---\n\n## Phase 3: Decide\n\nGoal: Select the best option with a transparent rationale.\n\n### Framework Selection\n\n| Situation | Framework |\n|-----------|-----------|\n| 2 options, quick decision | **Pro/Con Matrix** |\n| 3+ options, multiple criteria | **Weighted Scoring** |\n| Sequential if-then decision | **Decision Tree** |\n| High uncertainty | **Scenario Analysis** |\n| Prioritizing tasks | **Eisenhower Matrix** |\n\n### Weighted Scoring (core method)\n\n1. Collect criteria (3-7, specific and measurable)\n2. Set weights (sum = 100%, most important >= 25%)\n3. Rate options (1-10 scale)\n4. Compute scores (rating x weight)\n5. Compare and recommend\n\n### Scenario Analysis\n\n```\nBest Case (X%):      Outcome → expected value\nRealistic Case (X%): Outcome → expected value\nWorst Case (X%):     Outcome → expected value\nTotal expected value: [sum]\n```\n\n### Eisenhower Matrix\n\n```\n              URGENT          NOT URGENT\nIMPORTANT     1. DO           2. PLAN\nNOT IMPORTANT 3. DELEGATE     4. ELIMINATE\n```\n\n### Quality Checklist before the Final Recommendation\n\n- [ ] All relevant criteria identified?\n- [ ] User values taken into account?\n- [ ] Long-term effects considered?\n- [ ] Risks identified and assessed?\n- [ ] Bias check performed?\n- [ ] Reversibility checked?\n\n---\n\n## Context-Sensitive Selection\n\n| Situation | Recommended Phase(s) |\n|-----------|----------------------|\n| \"I have a problem\" | Phase 1 (analysis) → possibly Phase 2+3 |\n| \"I need ideas\" | Phase 2 (ideation) |\n| \"I have to decide\" | Phase 3 (decision) |\n| \"I am stuck\" | Phase 2 (reverse brainstorming) |\n| \"What should I prioritize?\" | Phase 3 (Eisenhower) |\n| \"Understand a complex problem\" | Phase 1 (Divide & Conquer + SWOT) |\n\n---\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-05-19)\n- Created as a meta-skill from think, brainstorm, and decide\n\n---\n\n*Meta-skill | Detailed reference: [think](../think/SKILL.md), [brainstorm](../brainstorm/SKILL.md), [decide](../decide/SKILL.md)*"}, {"id": "skill:utilities:think", "name": "think", "cat": "utilities", "ver": "1.0.0", "status": "active", "desc": "Problem solving and analysis: Structured thinking processes for complex problems. Divide & Conquer, Root Cause Analysis, SWOT, Pareto, and decision heuristics.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: think\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-15\nupdated: 2026-03-15\ndescription: Problem solving and analysis: Structured thinking processes for complex problems. Divide & Conquer, Root Cause Analysis, SWOT, Pareto, and decision heuristics.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: utilities\ntags: [thinking, problem-solving, analysis, swot, root-cause, heuristics]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/_services/think.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-15', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"think banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Think — Problem Solving & Analysis (Deutsch)\n\n> Structured thinking processes for complex problems\n\n---\n\n## Problem-Solving Approaches\n\n### 1. Divide & Conquer\n\n```\nProblem -> Sub-problems -> Solve individually -> Combine\n```\n\n### 2. Root Cause Analysis\n\n```\nSymptom -> Why? -> Why? -> Why? -> Root cause -> Solution\n```\n\n### 3. Constraint Relaxation\n\n```\nUnsolvable problem -> Relax constraints -> Solve -> Re-apply constraints\n```\n\n### 4. Analogy Search\n\n```\nNew problem -> Similar known problem -> Adapt solution\n```\n\n---\n\n## Analysis Methods\n\n| Method | Application |\n|--------|-------------|\n| **SWOT** | Strengths/Weaknesses/Opportunities/Threats |\n| **Pro/Con** | Decision making |\n| **Pareto** | 80/20 prioritization |\n| **Fishbone** | Root cause analysis |\n\n---\n\n## Decision Heuristics\n\n### Under Uncertainty\n\n```\n1. What is the worst-case scenario?\n2. Is it reversible?\n3. What is the cost of inaction?\n```\n\n### Under Complexity\n\n```\n1. What is the simplest first step?\n2. What would an expert do?\n3. What would the 80% solution be?\n```\n\n---\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-03-15)\n- Ported from BACH v3.8.0\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*"}, {"id": "tool:utilities:video-transcriber", "name": "video-transcriber", "cat": "utilities", "ver": "1.1.0", "status": "active", "desc": "Fetch video transcripts (subtitles) and metadata from online video sources and output them as Markdown, JSON, or plain text. Currently supported: YouTube. Prefers manually created subtitles, falls back to auto-generated ones.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: video-transcriber\nversion: 1.1.0\ntype: tool\nauthor: Lukas Geiger\ncreated: 2026-04-04\nupdated: 2026-06-20\ndescription: Fetch video transcripts (subtitles) and metadata from online video sources and output them as Markdown, JSON, or plain text. Currently supported: YouTube. Prefers manually created subtitles, falls back to auto-generated ones.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: true\ncategory: utilities\ntags: [video, transcript, subtitles, metadata, research, youtube]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': ['youtube-transcript-api', 'yt-dlp']}\nprovenance: {'origin': 'bach', 'origin_path': 'system/tools/youtube_extractor.py', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-04-04', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"video-transcriber banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Video Transcriber (Deutsch)\n\nFetches transcripts (subtitles) and metadata (title, channel, date, views,\ndescription) of online videos. Prefers manually created subtitles, falls back\nto auto-generated ones. Output as Markdown, JSON, or plain text.\n\nCurrently supported source: **YouTube** (youtube.com, youtu.be, youtube-nocookie.com).\n\nFor videos, use this tool instead of summarizing content manually —\nthe transcript is the reliable source.\n\n> **Notice:** This tool is not affiliated with, endorsed by, or sponsored by\n> YouTube or Google. Use is at the user's own responsibility. Users are solely\n> responsible for complying with the terms of service of the respective platform\n> and applicable copyright law. No circumvention of DRM, paywalls, or access\n> restrictions. No mass scraping. No redistribution of copyrighted transcripts\n> without the rights holder's consent.\n\n## Dependencies and licenses\n\n```bash\npip install youtube-transcript-api   # transcripts (required) — MIT license\npip install yt-dlp                   # metadata (optional, fallback: noembed) — Unlicense (Public Domain)\n```\n\n## Usage\n\n> **Windows note:** Always set `PYTHONIOENCODING=utf-8`, otherwise umlauts and\n> special characters break in the output (cp1252 encoding).\n\n```bash\n# Default: Markdown with timestamps (Deutsch)\nPYTHONIOENCODING=utf-8 python video_transcriber.py \"https://www.youtube.com/watch?v=VIDEO_ID\"\n\n# Choose output format (Deutsch)\nPYTHONIOENCODING=utf-8 python video_transcriber.py URL --format markdown|json|plain\n\n# Save to file (Deutsch)\nPYTHONIOENCODING=utf-8 python video_transcriber.py URL -o transcript.md\n\n# Prefer languages (default: de en) (Deutsch)\nPYTHONIOENCODING=utf-8 python video_transcriber.py URL --lang de en fr\n```\n\n### Options\n\n| Option | Effect |\n|--------|--------|\n| `--format markdown\\|json\\|plain` | Output format (default: markdown) |\n| `--output, -o <file>` | Write to file instead of stdout |\n| `--lang <codes...>` | Preferred subtitle languages (default: de en) |\n| `--meta-only` | Metadata only, no transcript |\n| `--transcript-only` | Transcript only, no metadata |\n| `--no-timestamps` | Transcript without timestamps |\n| `--no-meta` | Faster: skip yt-dlp metadata |\n\n### As a Python library\n\n```python\nfrom video_transcriber import extract_video_id, fetch_metadata, fetch_transcript, format_markdown\n\nvideo_id = extract_video_id(\"https://www.youtube.com/watch?v=VIDEO_ID\")\nmeta = fetch_metadata(video_id)\ntranscript = fetch_transcript(video_id, languages=[\"de\", \"en\"])\noutput = format_markdown(meta, transcript)\n```\n\n## Typical use cases\n\n- Research: make video content citable as text\n- Source analysis: examine argumentation/metaphors in talks\n- Summaries: transcript as a reliable basis instead of hallucination\n\n## Limits\n\n- Only works if the video has subtitles (manual or automatic)\n- Automatic subtitles can contain recognition errors\n- No audio download, no built-in speech recognition\n\n## Änderungsprotokoll\n\n### 1.1.0 (2026-06-20)\n- Renamed from `yt-transcriber` → `video-transcriber` (YouTube branding policy:\n  \"yt\" is an explicitly forbidden abbreviation; see RECHTSCHECK_2026-06-20.md)\n- Script: `yt_transcriber.py` → `video_transcriber.py`\n- Disclaimer and dependency licenses added (user responsibility, ToS, no endorsement)\n- YouTube mentioned descriptively as a source only, not as a name/brand component\n- Backward-compat wrapper `yt_transcriber.py` retained at the old path\n\n### 1.0.0 (2026-06-12)\n- SKILL.md added (the tool already existed as a script + README)\n- Script v1.0.0: transcript + metadata, 3 output formats, language preferences"}, {"id": "skill:utilities:workflow-extract", "name": "workflow-extract", "cat": "utilities", "ver": "1.1.0", "status": "active", "desc": "Baut aus einem Chatverlauf oder aus bestehenden Automatisierungs-Prompts (z. B. eines anderen Agenten-Systems) eine selbstlaufende, user-neutrale Workflow-Automatisierung: einen wiederkehrenden Prompt bzw. Automations-Skill für Cron/Schedule/Loop. Alias: automations-extractor. Nutze diesen Skill bei „mach daraus eine Automatisierung\", „das soll regelmäßig/nächtlich laufen\", „extrahiere Workflows aus diesen Chatverläufen/Automationen\", „Automation aus dieser Session bauen\", oder bei `/workflow-extract`. Ergänzt fehlende Automations-Bausteine (Rotations-Auswahl, Check-Registry, Idempotenz, Log-Hygiene, Freigabe-Gate, Eskalations-Handoff, Monitor-Meldedisziplin) systematisch. Enthält auch den Fleet-Audit-Modus: bestehende Automations-Flotten auf Silent-Failures, Redundanz, Drift und Lücken prüfen („prüfe meine Automatisierungen/Scheduled Tasks/Cron-Jobs\"). Soll stattdessen ein abrufbarer Skill (Fähigkeit auf Zuruf) entstehen, den Schwester-Skill skill-extractor nutzen.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: workflow-extract\nversion: 1.1.0\ntype: skill\nauthor: Lukas Geiger + Claude\ncreated: 2026-07-03\nupdated: 2026-07-03\ndescription: >\n  Baut aus einem Chatverlauf oder aus bestehenden Automatisierungs-Prompts (z. B. eines\n  anderen Agenten-Systems) eine selbstlaufende, user-neutrale Workflow-Automatisierung:\n  einen wiederkehrenden Prompt bzw. Automations-Skill für Cron/Schedule/Loop. Alias:\n  automations-extractor. Nutze diesen Skill bei „mach daraus eine Automatisierung\",\n  „das soll regelmäßig/nächtlich laufen\", „extrahiere Workflows aus diesen\n  Chatverläufen/Automationen\", „Automation aus dieser Session bauen\", oder bei\n  `/workflow-extract`. Ergänzt fehlende Automations-Bausteine (Rotations-Auswahl,\n  Check-Registry, Idempotenz, Log-Hygiene, Freigabe-Gate, Eskalations-Handoff,\n  Monitor-Meldedisziplin) systematisch. Enthält auch den Fleet-Audit-Modus: bestehende\n  Automations-Flotten auf Silent-Failures, Redundanz, Drift und Lücken prüfen („prüfe\n  meine Automatisierungen/Scheduled Tasks/Cron-Jobs\"). Soll stattdessen ein abrufbarer\n  Skill (Fähigkeit auf Zuruf) entstehen, den Schwester-Skill skill-extractor nutzen.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\n\ncategory: infrastructure\ntags: [automation, workflow, extraction, cron, schedule, loop, transcript, meta, rotation]\nlanguage: de\nstatus: active\n\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\n\nprovenance:\n  origin: \"custom\"\n  origin_path: null\n  origin_version: null\n  origin_repo: \"github.com/ellmos-ai/skills\"\n  last_sync_from_origin: null\n  last_sync_to_origin: null\n  local_changes_since_sync: false\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"workflow-extract banner\">\n# Workflow-Extract — aus Chatverläufen und Fremd-Automationen Automatisierungen bauen\n\n## Zweck\n\nManche Abläufe gehören nicht in einen Skill, den man bei Bedarf lädt, sondern in eine\n**Automatisierung, die von allein läuft**: nächtliche Checks, rotierende Projekt-Prüfungen,\nperiodische Pflege-Läufe. Dieser Skill extrahiert solche Workflows aus zwei Quellenarten —\nChatverläufen (ein Ablauf wurde interaktiv entwickelt und soll künftig unbeaufsichtigt laufen)\nund bestehenden Automations-Prompts anderer Systeme (z. B. Codex-Automations, Scheduled\nTasks, n8n-Flows) — und macht daraus user-neutrale, robuste Automatisierungs-Prompts oder\n-Skills.\n\nDer Unterschied zum interaktiven Ablauf: Eine Automatisierung hat **niemanden, der korrigiert**.\nAlles, was in der Session der User abgefangen hat, muss die Automatisierung selbst abfangen.\nGenau dafür gibt es die Bausteine in `automation-bausteine.md`.\n\n## Ablauf\n\n### 1. Quelle und Zielform klären\n\n| Quelle | typischer Fall |\n| --- | --- |\n| Aktuelle Session / Transkript | Ablauf wurde interaktiv entwickelt, soll periodisch weiterlaufen |\n| Fremd-Automation (Prompt-Datei, Cron-Task, n8n-Flow) | Portierung/Abstraktion auf ein anderes System oder in die Bibliothek |\n\nZielformen (eine oder mehrere):\n\n- **Automations-Prompt:** eigenständiger, user-neutraler Prompt-Text, einsetzbar in jedem\n  Scheduler (Codex-Automations, Claude `/schedule`/Cron, Scheduled Task, n8n).\n- **Workflow-Skill:** Skill in der Bibliothek, der den Ablauf beschreibt und vom\n  Automations-Prompt nur noch aufgerufen/parametrisiert wird (bevorzugt, wenn derselbe\n  Ablauf für mehrere Pipelines/Systeme gelten soll — eine Quelle der Wahrheit).\n- **Command:** dünner Slash-Command für manuelle Auslösung desselben Ablaufs.\n\n### 2. Workflow-Kern extrahieren\n\nAus der Quelle herausarbeiten:\n\n- **Kernaufgabe:** Was wird geprüft/gepflegt/erzeugt? (ein Satz)\n- **Auswahllogik:** Worauf wird die Aufgabe angewandt — festes Ziel oder Rotation über eine\n  Menge (ein Projekt pro Lauf)?\n- **Vorbedingungen:** Was muss vor der Arbeit gelesen/geprüft werden (Root-Dokumente,\n  Registries, Locks)?\n- **Dokumentationspflichten:** Wohin werden Ergebnis, Log, Folgeaufgaben geschrieben?\n- **Abbruchpfade:** Wann endet der Lauf read-only („nichts zu tun\" ist ein gültiges Ergebnis)?\n\nBei Chatverläufen zusätzlich die Korrekturschleifen auswerten (siehe\n`../skill-extractor/transcript-quellen.md`): Jede User-Korrektur ist ein Kandidat für einen\nGuard, den die Automatisierung künftig selbst braucht.\n\n### 3. Neutralisieren\n\nNach den Regeln in `../skill-extractor/neutralisierung.md`: Mechanik von Konfiguration\ntrennen, Pfade/Hosts/Projektnamen in einen Konfigurationsblock ziehen. Automations-Prompts\nbrauchen den Konfigurationsblock besonders dringend, weil sie wörtlich in Scheduler kopiert\nwerden — konkrete Werte gehören an EINE Stelle am Prompt-Anfang.\n\n### 4. Automations-Bausteine ergänzen\n\nDen extrahierten Kern gegen die Checkliste in `automation-bausteine.md` halten und fehlende\nBausteine ergänzen — insbesondere Rotations-Auswahl mit Check-Registry, Idempotenz,\nLog-Hygiene, Lock-Respekt, Read-only-Exit und Abschlussbericht. Ein Workflow ohne diese\nBausteine funktioniert im Test und degeneriert im Dauerbetrieb (Doppelprüfungen, wachsende\nLogs, Kollisionen mit parallelen Agenten).\n\n### 5. Takt und Budget setzen\n\n- **Frequenz an Änderungsrate koppeln:** Ein Check muss nicht öfter laufen, als sich sein\n  Gegenstand ändert. Erfahrungswert aus gewachsenen Automations-Beständen: Viele anfangs\n  stündliche Checks wurden auf täglich/wöchentlich reduziert — mit Rotations-Auswahl deckt\n  auch ein seltener Takt die ganze Pipeline ab.\n- **Nachtfenster für Schweres**, kurze Read-only-Checks dürfen häufiger.\n- **Kostenbewusstsein:** Jeder Lauf kostet Tokens/Compute; ein Lauf, der meist read-only\n  endet, soll das früh feststellen (Registry lesen VOR teurer Analyse).\n\n### 6. Testen und einsetzen\n\n1. **Trockenlauf:** Den fertigen Prompt einmal interaktiv ausführen (als wäre man der\n   Scheduler) und prüfen: Endet er sauber? Schreibt er Registry/Log korrekt? Bleibt er\n   im Scope?\n2. **Grenzfall-Test:** Einen Lauf simulieren, bei dem nichts zu tun ist — er muss read-only\n   mit kurzem Logeintrag enden, nicht „Arbeit erfinden\".\n3. **Einsetzen:** In den Ziel-Scheduler eintragen; bei Skill-Form zusätzlich in Bibliothek\n   ablegen und deployen.\n4. **Fehlerpfad beobachten:** Nach den ersten 2–3 echten Läufen Log/Registry kontrollieren —\n   Automatisierungen scheitern am häufigsten an Pfad-Drift (Ziel wurde verschoben) und an\n   wachsenden Logdateien.\n\n## Fleet-Audit-Modus: eine laufende Automations-Flotte prüfen\n\nFür „prüfe meine Automatisierungen\": nicht extrahieren, sondern den BESTAND betreiben\nhelfen. Über die Automations-Quelle des Zielsystems (Prompt-/Config-Dateien, Schedules,\nRun-Logs/Memories) systematisch prüfen:\n\n1. **Silent-Failure/No-op-Erkennung:** Läuft die Automation, tut aber nichts mehr?\n   (Run-Memories/Logs der letzten Läufe lesen: nur noch Leerläufe, Fehler, tote Pfade?)\n2. **Redundanz + Ertrag:** Überschneiden sich Automationen im Scope? Steht der Ertrag\n   (Output, behobene Befunde) noch im Verhältnis zum Verbrauch (Tokens, Läufe)?\n3. **Drift:** Passen Prompt-Pfade, Konventionen und Schedules noch zur Realität?\n   (Ziele verschoben, Policies geändert, Takt zu hoch für die Änderungsrate.)\n4. **Katalog-Abgleich:** Fehlt eine Automation, die es geben sollte (Lücken im\n   Muster-Raster)? Vorschläge nur freigabe-gegated (Baustein 12), nie selbst scharf schalten.\n5. **Befund-Bericht:** pro Automation eine Zeile (behalten | anpassen | pausieren |\n   zusammenlegen | löschen) + Begründung; Änderungen selbst nur nach Freigabe.\n\n## Bulk-Modus: Automations-Bestände oder viele Transkripte sichten\n\nFür „prüfe alle Automationen von System X auf abstrahierbare Workflows\" oder „extrahiere\nAutomatisierungs-Kandidaten aus alten Chatverläufen\":\n\n1. **Datenreduktion wie im skill-extractor** (Map-Reduce über Subagenten,\n   `swarm-operations`-Muster): Pro Bündel ein Subagent, der je Quelle meldet:\n   Kernaufgabe | Muster (z. B. Rotation-Check, Health-Check, Ideen-Mining) |\n   einzigartige Elemente | user-neutral abstrahierbar? | abgedeckt durch existierenden Skill?\n2. **Muster vor Einzelstücken:** Wenn viele Quellen dasselbe Gerüst teilen (z. B. 40\n   Rotations-Checks), wird das GERÜST ein Skill und die Einzelfälle werden Parametrisierungen —\n   nicht 40 Einzel-Skills.\n3. **Dedup gegen die bestehende Skill-/Command-Landschaft**, dann nummerierte\n   Kandidatenliste an den User vor dem Massenbau.\n\n## Beispiel\n\n```text\nUser: „Wir haben heute die Zitationsprüfung für ein Paper durchgespielt —\ndas soll ab jetzt wöchentlich über alle Paper laufen.\"\n\n1. Zielform: Automations-Prompt für den Scheduler + Verweis auf rotation-check.\n2. Kern: Zitate eines Papers gegen Originalquellen prüfen (Web/Datenbank),\n   Korrekturen einpflegen, bei Änderungen Folgeaufgabe „Neu-Upload\" in TODO.md.\n3. Neutralisieren: Pipeline-Root, Registry-/Log-Pfade → Konfigurationsblock.\n4. Bausteine ergänzen: Rotations-Auswahl (ein Paper pro Lauf), Registry lesen VOR\n   Auswahl, Read-only-Exit („alle Quellen ok\"), Log-Hygiene, Abschlussbericht.\n5. Takt: wöchentlich reicht (Papers ändern sich langsam); Trockenlauf + Leerlauf-Test,\n   dann in den Scheduler.\n```\n\n## Red Flags\n\n| Gedanke | Realität |\n| --- | --- |\n| „Der Ablauf lief in der Session, also läuft er auch als Automation\" | Ohne User fehlen alle Korrektive — Bausteine-Checkliste ist Pflicht. |\n| „Stündlich schadet nicht\" | Doch: Tokens, Log-Wachstum, Kollisionsrisiko. Takt an Änderungsrate koppeln. |\n| „Ich baue für jede Variante eine eigene Automation\" | Gemeinsames Gerüst als Skill, Varianten als Parameter. |\n| „Nichts gefunden — dann suche ich mir eben andere Arbeit\" | Read-only-Exit mit Logeintrag ist das korrekte Ergebnis eines Leerlaufs. |\n\n## Verwandte Skills\n\n- `skill-extractor` — gleiche Extraktion, Ziel ist ein abrufbarer Skill; teilt\n  Neutralisierung und Transcript-Quellen (dort dokumentiert).\n- `rotation-check` — das Standard-Gerüst für rotierende Pipeline-Checks (häufigster\n  Automations-Typ); als Baustein referenzieren statt neu erfinden.\n- `swarm-operations` — Schwarm-Muster für Bulk-Sichtung.\n\n## Changelog\n\n### 1.1.0 (2026-07-03)\n- Fleet-Audit-Modus (laufende Automations-Flotte prüfen: Silent-Failures, Redundanz,\n  Drift, Lücken) — integriert statt als eigener Skill (Dedup-Entscheid).\n- Drei neue Bausteine in automation-bausteine.md: Freigabe-Gate über Sentinel-Dateien (12),\n  Gestaffelte Eskalation mit Handoff-Artefakt (13), Melde-Disziplin für Monitore (14).\n\n### 1.0.0 (2026-07-03)\n- Initiale Version. Entstanden aus der Abstraktion des Codex-Automations-Bestands\n  (77 Automationen, dominantes Rotations-Check-Muster) in user-neutrale Bausteine.\n"}, {"id": "protocol:web:web-reading", "name": "web-reading", "cat": "web", "ver": "1.1.0", "status": "active", "desc": "Router and protocol for reading and extracting web content. Decides first WHAT is needed (main text vs. structure vs. screenshot) and then WHICH tool available on the system delivers it. If nothing suitable is present, it recommends installing the web-scraper module.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: web-reading\nversion: 1.1.0\ntype: protocol\nauthor: BACH Team\ncreated: 2026-03-12\nupdated: 2026-07-05\ndescription: Router and protocol for reading and extracting web content. Decides first WHAT is needed (main text vs. structure vs. screenshot) and then WHICH tool available on the system delivers it. If nothing suitable is present, it recommends installing the web-scraper module.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: true\ncategory: web\ntags: [web-scraping, content-extraction, research, router]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': ['requests', 'beautifulsoup4']}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/workflows/webseiten-lesen.md', 'origin_version': '3.8.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\nbach_integration: {'handler': 'web-parse, web-scrape', 'db_tables': [], 'hooks': [], 'bach_origin_path': 'system/skills/workflows/'}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"web-reading banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Web Reading (Router) (Deutsch)\n\n## Übersicht & Zweck\n\nFetch and process web content — but don't pick a tool blindly. This skill\nroutes: **purpose first, then the best available tool.** The actual\nimplementation lives in the **`web-scraper` module**; this skill only shows\nwhat is currently present and how to use it.\n\n## Step 1 — What is needed?\n\n```\nProcess a web page?\n  |\n  +-- Main text (article / prose)   → \"Content\"     → Step 2A\n  +-- Links / forms / headers       → \"Structure\"   → Step 2B\n  +-- Rendered image of the page    → \"Screenshot\"  → Step 2C\n```\n\n## Step 2 — Which tool? (Router)\n\nUse the **first available** tool in each list. \"Available\" means the\ntool/skill/module is actually present in this session.\n\n### 2A — Content (main text, clean markdown)\n\n| Priority | Tool | Available when … | Usage |\n|---|---|---|---|\n| 1 | **`defuddle`** skill | skill `defuddle` listed | clean markdown from normal web pages |\n| 2 | Built-in **`WebFetch`** | agent has the WebFetch tool | quick read/summary of a URL |\n| 3 | **`fc_web_fetch`** (MCP) | FileCommander MCP loaded | `mode: \"extract\"` |\n| 4 | **`web-scraper`** module | module installed/importable | `web-scraper extract <url>` / `extract(url)` |\n\n> Note: `.md` URLs are already markdown → use `WebFetch` directly, no extractor.\n\n### 2B — Structure (links, forms, headers)\n\n`WebFetch`/`defuddle` are **not** suitable here (they return processed text, not\nraw structure). Use instead:\n\n| Priority | Tool | Available when … | Usage |\n|---|---|---|---|\n| 1 | **`fc_web_fetch`** (MCP) | FileCommander MCP loaded | `mode: \"links\" \\| \"forms\" \\| \"headers\"` |\n| 2 | **`web-scraper`** module | module installed/importable | `web-scraper links\\|forms\\|headers <url>` |\n\n### 2C — Screenshot\n\n| Priority | Tool | Available when … | Usage |\n|---|---|---|---|\n| 1 | **`web-scraper`** module | module with `[screenshot]` extra | `web-scraper screenshot <url> --out img.png` |\n| 2 | Browser automation tool | e.g. Playwright/Computer-Use present | page-dependent |\n\n## Step 3 — Fallback: nothing suitable found?\n\nIf **no** tool is available for the purpose, recommend installing the\n**`web-scraper` module** (full: get/links/forms/headers/extract/screenshot):\n\n```bash\n# from the local module folder (.MODULES/.TOOLS/web-scraper) (Deutsch)\npip install \".[http,extract]\"          # + [screenshot] for screenshots\n\n# then: (Deutsch)\nweb-scraper extract <url>\n```\n\nAs a library:\n\n```python\nfrom web_scraper import WebScraper, extract\nprint(extract(\"https://example.com\")[\"content\"])\n```\n\n## Last resort — standalone snippet (no dependencies beyond requests/bs4)\n\n```python\nimport requests\nfrom bs4 import BeautifulSoup\n\ndef extract_content(url: str) -> str:\n    \"\"\"Simple content extraction.\"\"\"\n    response = requests.get(url, timeout=30)\n    response.raise_for_status()\n    soup = BeautifulSoup(response.text, \"html.parser\")\n    for tag in soup([\"script\", \"style\", \"nav\", \"header\", \"footer\", \"aside\"]):\n        tag.decompose()\n    return soup.get_text(separator=\"\\n\", strip=True)\n```\n\n## Änderungsprotokoll\n\n### 1.1.0 (2026-07-05)\n- Reworked from a plain protocol into a **router**: detects available web\n  capabilities (`defuddle`, `WebFetch`, `fc_web_fetch`, `web-scraper` module)\n  and routes by purpose (content/structure/screenshot); otherwise recommends the\n  `web-scraper` module.\n- Unified name to `web-reading` (was `webseiten-lesen` in the DE version).\n- Removed BACH CLI examples from the body (standalone-compliant; origin stays\n  documented in the `bach_integration` frontmatter).\n\n### 1.0.0 (2026-03-12)\n- Export from BACH v3.8.0 workflow `webseiten-lesen.md`"}];
const UI={
 de:{sub:"Die öffentliche Skill-Bibliothek zum Durchlesen und Mitnehmen: Skill auswählen, lesen — und mit einem Klick als SKILL.md in die Zwischenablage kopieren (wie bei BACH).",
  search:"Skill suchen …", copy:"⧉ SKILL.md kopieren", copied:"✓ kopiert!",
  empty:"← Wähle links einen Skill aus "+String(SKILLS.length)+" Einträgen.",
  cat:"Kategorie", ver:"Version", st:"Status", langs:"Sprachen",
  source:"Quelle: ellmos-ai/skills · registry/components.json ("+String(SKILLS.length)+" öffentliche Skills) · Stand 2026-08-12"},
 en:{sub:"The public skill library to read and take away: pick a skill, read it — and copy the SKILL.md to your clipboard with one click (BACH-style).",
  search:"Search skills …", copy:"⧉ Copy SKILL.md", copied:"✓ copied!",
  empty:"← Pick a skill from "+String(SKILLS.length)+" entries on the left.",
  cat:"Category", ver:"Version", st:"Status", langs:"Languages",

};
let lang="en", cur=null;
const $=s=>document.querySelector(s);
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
/* Mini-Markdown: Frontmatter, Codeblöcke, Überschriften, Listen, Tabellen, Inline. */
function md(src){
  let fm="";
  if(src.startsWith("---")){
    const end=src.indexOf("\n---",3);
    if(end>0){fm=src.slice(3,end).trim();src=src.slice(end+4);}
  }
  const lines=src.split(/\r?\n/); let out=[],i=0,inCode=false,codeBuf=[],listStack=[];
  function closeLists(){while(listStack.length){out.push("</"+listStack.pop()+">");}}
  function inline(t){
    t=esc(t);
    t=t.replace(/`([^`]+)`/g,"<code>$1</code>");
    t=t.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
    t=t.replace(/(^|[^*])\*([^*]+)\*/g,"$1<i>$2</i>");
    t=t.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  }
  while(i<lines.length){
    const L=lines[i];
    if(L.trim().startsWith("```")){
      if(inCode){out.push("<pre><code>"+esc(codeBuf.join("\n"))+"</code></pre>");codeBuf=[];inCode=false;}
      else{closeLists();inCode=true;}
      i++;continue;
    }
    if(inCode){codeBuf.push(L);i++;continue;}
    const h=L.match(/^(#{1,4})\s+(.*)/);
    if(h){closeLists();out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);i++;continue;}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(L)){closeLists();out.push("<hr>");i++;continue;}
    if(/^\s*\|.*\|\s*$/.test(L) && i+1<lines.length && /^\s*\|[\s\-:|]+\|\s*$/.test(lines[i+1])){
      closeLists();
      const head=L.trim().slice(1,-1).split("|").map(c=>inline(c.trim()));
      let rows=[];i+=2;
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        rows.push(lines[i].trim().slice(1,-1).split("|").map(c=>inline(c.trim())));i++;
      }
      out.push("<table><tr>"+head.map(c=>"<th>"+c+"</th>").join("")+"</tr>"+
        rows.map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+"</table>");
      continue;
    }
    const ul=L.match(/^\s*[-*+]\s+(.*)/), ol=L.match(/^\s*\d+[.)]\s+(.*)/);
    if(ul||ol){
      const want=ul?"ul":"ol";
      if(listStack[listStack.length-1]!==want){closeLists();out.push("<"+want+">");listStack.push(want);}
      out.push("<li>"+inline((ul||ol)[1])+"</li>");i++;continue;
    }
    if(L.startsWith(">")){closeLists();out.push("<blockquote>"+inline(L.replace(/^>\s?/,""))+"</blockquote>");i++;continue;}
    if(L.trim()===""){closeLists();i++;continue;}
    closeLists();out.push("<p>"+inline(L)+"</p>");i++;
  }
  if(inCode)out.push("<pre><code>"+esc(codeBuf.join("\n"))+"</code></pre>");
  closeLists();
  return (fm?'<div class="fm">'+esc(fm)+"</div>":"")+out.join("\n");
}
function buildList(){
  const T=UI[lang], list=$("#list"); list.innerHTML="";
  let lastCat=null;
  for(const s of SKILLS){
    if(s.cat!==lastCat){lastCat=s.cat;
      const h=document.createElement("div");h.className="cathead";h.textContent=s.cat;
      h.dataset.cat=s.cat;list.appendChild(h);}
    const d=document.createElement("div");d.className="sk";d.dataset.sk=s.id;
    d.innerHTML=`<b>${s.name}</b><i>${esc(s.desc||"")}</i>`;
    list.appendChild(d);
  }
}
function applyTexts(){
  const T=UI[lang];
  $("#t-sub").textContent=T.sub; $("#q").placeholder=T.search;
  $("#empty").textContent=T.empty; $("#copybtn").textContent=T.copy;
  $("#t-source").textContent=T.source;
  $("#lang-de").classList.toggle("on",lang==="de");
  $("#lang-en").classList.toggle("on",lang==="en");
  document.documentElement.lang=lang;
  if(cur)show(cur,false);
}
function show(id,scroll){
  const s=SKILLS.find(x=>x.id===id); if(!s)return;
  cur=id; const T=UI[lang];
  document.querySelectorAll(".sk").forEach(e=>e.classList.toggle("on",e.dataset.sk===id));
  $("#empty").style.display="none"; $("#rbody").style.display="block";
  $("#rname").textContent=s.name;
  $("#rmeta").innerHTML=`<span>${T.cat}: ${s.cat}</span><span>${T.ver}: ${s.ver||"—"}</span>
    <span>${T.st}: ${s.status||"—"}</span><span>${T.langs}: ${(s.langs||[]).join(", ")||"—"}</span>`;
  $("#rdesc").textContent=s.desc||"";
  $("#rmd").innerHTML=md(s.text||"");
  const b=$("#copybtn");b.classList.remove("done");b.textContent=T.copy;
  if(scroll)$("#reader").scrollIntoView({behavior:"smooth",block:"start"});
}
function filter(){
  const q=$("#q").value.trim().toLowerCase();
  const vis=new Set();
  document.querySelectorAll(".sk").forEach(e=>{
    const s=SKILLS.find(x=>x.id===e.dataset.sk);
    const hit=!q||(s.name+" "+s.desc+" "+s.cat).toLowerCase().includes(q);
    e.classList.toggle("hide",!hit); if(hit)vis.add(s.cat);
  });
  document.querySelectorAll(".cathead").forEach(e=>{
    e.style.display=vis.has(e.dataset.cat)||!$("#q").value?"":"none";
  });
}
async function copySkill(){
  const s=SKILLS.find(x=>x.id===cur); if(!s)return;
  const b=$("#copybtn");
  try{await navigator.clipboard.writeText(s.text);}
  catch(e){
    const ta=document.createElement("textarea");ta.value=s.text;
    document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
  }
  b.textContent=UI[lang].copied;b.classList.add("done");
  setTimeout(()=>{b.textContent=UI[lang].copy;b.classList.remove("done");},1600);
}
document.addEventListener("click",ev=>{
  const sk=ev.target.closest("[data-sk]");
  if(sk)show(sk.dataset.sk,true);
});
$("#copybtn").addEventListener("click",copySkill);
$("#q").addEventListener("input",filter);
$("#lang-de").addEventListener("click",()=>{lang="de";applyTexts()});
$("#lang-en").addEventListener("click",()=>{lang="en";applyTexts()});
buildList();applyTexts();

/* --- Theme-Umschalter (dunkel = Default) --- */
const THEME_KEY="ellmos-theme";
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  const b=document.getElementById("themebtn");
  if(b) b.textContent=(t==="light"?"🌙":"☀️");
}
let savedTheme="dark";
try{ if(localStorage.getItem(THEME_KEY)==="light") savedTheme="light"; }catch(e){}
applyTheme(savedTheme);
document.getElementById("themebtn").addEventListener("click",()=>{
  const t=document.documentElement.dataset.theme==="light"?"dark":"light";
  try{ localStorage.setItem(THEME_KEY,t); }catch(e){}
  applyTheme(t);
});
