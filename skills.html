n\n---\n\n### 5. TRIZ (Theory of Inventive Problem Solving)\n\nTop 10 Principles for Software:\n1. **Segmentation:** Split monolith into modules\n2. **Extraction:** Isolate disturbing property\n3. **Local Quality:** Different components, different properties\n4. **Merging:** Combine similar functions\n5. **Universality:** One element, multiple functions\n6. **Nesting:** Components within components\n7. **Preliminary Action:** Preparation in advance\n8. **Feedback:** Monitoring and adaptation\n9. **Self-Service:** System maintains itself\n10. **Asymmetry:** Non-symmetrical designs\n\n---\n\n### 6. Rapid Ideation\n\nQuantity over quality — 50+ ideas in 20 min.\n\n**Rules:**\n- NO criticism during ideation\n- WILD ideas welcome\n- Build on others' ideas\n- Quantity FIRST\n\n**Timer-based:**\n- Round 1 (5 min): Open ideation\n- Round 2 (5 min): Variations\n- Round 3 (5 min): Combinations\n- Round 4 (5 min): Extreme ideas\n\n---\n\n## Workflow & Vorgehen\n\n```\n1. User request\n2. Understand goal\n3. Choose method(s)\n4. Generate ideas (no criticism!)\n5. Clustering\n6. Feasibility/Impact matrix\n7. Top 5-10 selection\n8. Output + recommendation\n```\n\n---\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-03-15)\n- Ported from BACH v3.8.0\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*"}, {"id": "skill:utilities:build-your-users-mind", "name": "build-your-users-mind", "cat": "utilities", "ver": "1.0.0", "status": "active", "desc": "Points to the public, provider-neutral build-your-users-mind module: a privacy-aware recipe for building an empirical Theory-of-Mind preference model of an authorized user from that user's own interaction logs. Use when an operator wants to build, validate, bind, or maintain a decision-avatar profile without publishing the personal profile or its evidence.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: build-your-users-mind\nversion: 1.0.0\ntype: skill\nauthor: ellmos contributors\ncreated: 2026-07-30\nupdated: 2026-07-30\ndescription: >\n  Points to the public, provider-neutral build-your-users-mind module: a\n  privacy-aware recipe for building an empirical Theory-of-Mind preference\n  model of an authorized user from that user's own interaction logs. Use when\n  an operator wants to build, validate, bind, or maintain a decision-avatar\n  profile without publishing the personal profile or its evidence.\nstandalone: false\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: utilities\ntags: [theory-of-mind, user-model, decision-avatar, feedback, privacy, pointer-skill]\nlanguage: en\nstatus: active\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\nprovenance:\n  origin: \"external\"\n  origin_path: \"SKILL.md, templates/, scripts/, schemas/, TAXONOMY.md\"\n  origin_version: \"1.0.0\"\n  origin_repo: \"https://github.com/ellmos-ai/build-your-users-mind\"\n  last_sync_from_origin: \"2026-07-30\"\n  last_sync_to_origin: null\n  local_changes_since_sync: false\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"build-your-users-mind banner\">\n\n# build-your-users-mind — Public, provider-neutral pointer\n\nThis skill is a thin pointer to the public module\n[`ellmos-ai/build-your-users-mind`](https://github.com/ellmos-ai/build-your-users-mind).\nThe module contains the complete recipe, templates, schemas, scripts, tests and\nsource-adapter documentation. This catalog does not duplicate that code.\n\n## What the module does\n\nWith the operator's explicit authorization, the module helps an agent:\n\n1. extract genuine user-authored turns from the operator's own interaction logs;\n2. redact sensitive material before persistent storage;\n3. reduce and classify evidence about recurring preferences and decisions;\n4. create a local preference model with confidence levels and provenance;\n5. bind a short pointer into the selected agent runtime; and\n6. calibrate predictions against real later feedback.\n\nThe public module is a recipe for any user and any supported agent runtime. It\ndoes not contain a model of a specific person.\n\n## Safety and privacy boundary\n\n- Operator authorization is required before reading interaction logs.\n- Personal profiles, raw logs, evidence corpora and local paths remain private.\n- Predictions are uncertain hypotheses, not mind-reading, diagnosis or statements\n  made by the user.\n- A preference prediction never expands the agent's authority.\n- External, irreversible, safety-critical, legal, medical, employment,\n  financial or similarly high-impact actions require explicit confirmation.\n- Agent-generated predictions must never become primary evidence about the user.\n\n## Installation\n\n```bash\ngit clone https://github.com/ellmos-ai/build-your-users-mind.git <clone-path>\n```\n\nFollow the module's current `README.md`, `SKILL.md`, `SOURCE-ADAPTERS.md` and\nprivacy instructions. Keep the generated user profile outside public\nrepositories. The module repository is authoritative for implementation and\nversioning.\n\n## Public core and private profiles\n\n`build-your-users-mind` is the public, user-neutral module name.\n`decision-avatar` is the public runtime protocol in this catalog. A named\nperson's avatar, evidence files, local commands and profile-specific defaults\nare private overlays and must not be published under a personal skill name.\n\n## Changelog\n\n### 1.0.0 (2026-07-30)\n\n- Added the neutral pointer to the standalone public module.\n- Replaced the previously published personal avatar profile with a strict\n  public-core/private-profile boundary.\n"}, {"id": "skill:utilities:condition", "name": "condition", "cat": "utilities", "ver": "1.1.0", "status": "active", "desc": "Flexible Bedingungssprache für Ziele, Prompts und Aufträge. Übersetzt Bedingungen, Zeitpunkte und Reihenfolge-Abhängigkeiten in prüfbare Gates, damit ein Teilschritt erst nach belegter Freigabe ausgeführt wird. Immer verwenden bei /condition, /if, /if-only, /when, /after, /and oder /or sowie bei Formulierungen wie \"erst wenn\", \"sobald\", \"nur falls\", \"nachdem\", \"warte bis\", \"danach\" oder \"vorher nicht\". Auch verwenden, wenn mehrere Teilziele voneinander abhängen oder ein Goal eine spätere Freigabe enthält.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: condition\nversion: 1.1.0\ntype: skill\nauthor: Lukas Geiger + Claude\ncreated: 2026-07-25\nupdated: 2026-07-28\ndescription: >\n  Flexible Bedingungssprache für Ziele, Prompts und Aufträge. Übersetzt Bedingungen,\n  Zeitpunkte und Reihenfolge-Abhängigkeiten in prüfbare Gates, damit ein Teilschritt erst\n  nach belegter Freigabe ausgeführt wird. Immer verwenden bei /condition, /if, /if-only,\n  /when, /after, /and oder /or sowie bei Formulierungen wie \"erst wenn\", \"sobald\",\n  \"nur falls\", \"nachdem\", \"warte bis\", \"danach\" oder \"vorher nicht\". Auch verwenden,\n  wenn mehrere Teilziele voneinander abhängen oder ein Goal eine spätere Freigabe enthält.\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: infrastructure\ntags: [condition, gate, prompt-language, goal, trigger, blocker, timing, dependency, workflow]\nlanguage: de\nstatus: active\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\nprovenance:\n  origin: \"custom\"\n  origin_path: \"condition/SKILL.md\"\n  origin_version: \"1.0.0\"\n  origin_repo: null\n  last_sync_from_origin: \"2026-07-28\"\n  last_sync_to_origin: null\n  local_changes_since_sync: true\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"condition banner\">\n# condition — Bedingungssprache für Ziele und Prompts\n\n## Leitidee\n\nFließtext-Bedingungen leicht übersehen. Deshalb jede relevante Bedingung in ein benanntes,\nprüfbares Gate übersetzen:\n\n> Beim Lesen großzügig, beim Belegen unnachgiebig.\n\nDie Eingabe darf natürlichsprachlich und unvollständig sein. Die interne Übersetzung muss\ndagegen eindeutig festhalten:\n\n1. welche Bedingung erfüllt sein muss,\n2. welcher Teilschritt blockiert ist,\n3. welche Werkzeugabfrage als Beleg gilt,\n4. ob Nichterfüllung Verzögerung oder Verbot bedeutet.\n\nNur den betroffenen Teilschritt sperren. Unabhängige Arbeit fortsetzen.\n\n## Sprachbausteine\n\n| Ausdruck | Semantik | Beispiel |\n| --- | --- | --- |\n| `/condition <Bedingung> -> <Schritt>` | Kanonisches Gate | `/condition Tests grün -> Release bauen` |\n| `/if <Bedingung> -> <Schritt>` | Synonym für `/condition` | `/if Review abgeschlossen -> mergen` |\n| `/when <Bedingung> -> <Schritt>` | Ausführen, sobald die Bedingung eintritt | `/when Export fertig -> Bericht prüfen` |\n| `/if-only <Bedingung> -> <Schritt>` | Nur bei Erfüllung; sonst gar nicht ausführen | `/if-only Backup belegt -> Altbestand löschen` |\n| `/after <Dauer> -> <Schritt>` | Zeitversatz ab dem Setzzeitpunkt | `/after 30 minutes -> Status prüfen` |\n| `/and` | Alle verknüpften Bedingungen müssen gelten | `/if Tests grün /and Review da -> mergen` |\n| `/or` | Mindestens eine Bedingung genügt | `/if Freigabe da /or Notfallregel aktiv -> starten` |\n\nNummerierte Bedingungen wie `/condition 1 ...` und `/condition 2 ...` verwenden, wenn ein\nPrompt mehrere Gates enthält. Bei gemischtem `/and` und `/or` keine stillschweigende\nOperatorrangfolge erfinden: Klammern oder nummerierte Teilbedingungen verwenden. Bei\nweiterhin mehrdeutiger Bedeutung nachfragen, bevor ein riskanter Schritt freigegeben wird.\n\n`/if-only` als Verbot behandeln. Kann die Bedingung nicht belegt werden, den Schritt nicht\nausführen. Bei unklarer Formulierung und irreversiblen Folgen die strengere Lesart wählen.\n\n## Ablauf\n\n### 1. Bedingung normalisieren\n\nDie Eingabe in einen prüfbaren Satz übersetzen. Relative Zeiten beim Setzen in einen absoluten\nZeitpunkt mit Zeitzone umrechnen.\n\n| Eingabe | Normalisierte Bedingung | Belegklasse |\n| --- | --- | --- |\n| `time 06:00` | Systemzeit ist mindestens 06:00 in der vereinbarten Zeitzone | Uhr-/Zeitwerkzeug |\n| `after 2 hours` | Systemzeit ist mindestens Setzzeitpunkt plus zwei Stunden | Uhr-/Zeitwerkzeug |\n| `wenn Worker A fertig ist` | Abnahmeartefakt oder Taskstatus von A zeigt Abschluss | Task-/Dateiwerkzeug |\n| `wenn Tests grün sind` | Vorgeschriebener Testlauf endet erfolgreich | Prozess-/Testwerkzeug |\n| `nach dem Push` | Ziel-Remote enthält den vorgesehenen Commit | Versionskontrollwerkzeug |\n| `wenn der User zustimmt` | Explizite Zustimmung liegt in der Konversation vor | Nutzereingabe |\n\nIst kein objektiver Belegweg erkennbar, das offen benennen. Kein Gate so formulieren, dass es\nnur durch Vermutung geschlossen werden kann.\n\n### 2. Gate-Zustand festhalten\n\nWenn ein persistenter Gate-, Task- oder Memory-Store verfügbar ist, dort mindestens diese\nFelder speichern:\n\n```text\nid\ncondition\nblocks\nmode = wait | only\nproof_method\nstatus = open | met | dropped\ncreated_at\nevidence\n```\n\nExistiert kein persistenter Store, den Zustand sichtbar im aktuellen Goal, Taskplan oder\nÜbergabedokument führen. Nur dann behaupten, dass ein Gate Sessions überlebt, wenn der\nverwendete Speicher tatsächlich dauerhaft ist.\n\nEin vorhandener Runtime-Adapter darf andere Befehlsnamen verwenden. Funktional braucht er:\n`open`, `list`, `meet` und `drop` oder gleichwertige Operationen.\n\n### 3. Arbeit umsortieren\n\nEin offenes Gate blockiert nicht den gesamten Auftrag. Alle unabhängigen Schritte ausführen\nund vor dem nächsten abhängigen Schritt den Gate-Zustand erneut prüfen.\n\nNicht aktiv in kurzen Agentenschleifen pollen. Für längere Wartezeiten einen Scheduler,\nHintergrundjob oder ein Ereignis verwenden, das bei Eintritt einmalig meldet. Nach dem\nWecksignal die eigentliche Bedingung trotzdem erneut mit dem vorgesehenen Werkzeug belegen.\n\n### 4. Streng prüfen und schließen\n\nErst die Werkzeugabfrage ausführen, dann das Gate mit konkreter Evidenz schließen. Geeignete\nBelege sind zum Beispiel:\n\n- Zeit: gemessener Zeitstempel mit Zeitzone,\n- Datei: Pfad, Metadaten oder Hash des erwarteten Artefakts,\n- Tests: ausgeführter Befehl, Exit-Code und relevante Zusammenfassung,\n- Repository: Branch, Commit-ID und Remote-Abgleich,\n- Prozess oder Task: stabile ID und gemessener Endstatus,\n- Zustimmung: eindeutige Nutzerantwort im aktuellen Kontext.\n\nEine Schätzung, ein erwarteter Zustand oder die bloße Behauptung eines anderen Workers genügt\nnicht, wenn ein unabhängiger Beleg verfügbar sein sollte.\n\nIst ein Gate durch Auftragsänderung hinfällig, es mit Begründung als `dropped` markieren. Bei\n`/or` die nicht mehr benötigten Alternativen ebenfalls schließen oder verwerfen, damit keine\nZombie-Gates verbleiben.\n\n### 5. Eskalieren\n\nWenn alle unabhängigen Schritte erledigt sind:\n\n1. prüfen, ob die blockierende Vorarbeit innerhalb des Auftrags aktiv erledigt werden kann,\n2. bei reiner Wartebedingung einen passenden Scheduler oder Hintergrundjob verwenden,\n3. bei Nutzerentscheidung oder externer Abhängigkeit mit offenem Gate und klarem Zwischenstand\n   übergeben.\n\nKeine zusätzliche Berechtigung aus einer Bedingung ableiten. Ein erfülltes Gate ändert nur die\nReihenfolge; es erweitert nicht den autorisierten Umfang des Auftrags.\n\n## Beispiele\n\n### Goal mit Zeitbedingung\n\n```text\nZiel: Daten prüfen und Bericht veröffentlichen.\n/condition time 16:00 Europe/Berlin -> Veröffentlichung starten\n```\n\nDie Datenprüfung darf vorher stattfinden. Die Veröffentlichung bleibt gesperrt, bis eine\naktuelle Zeitabfrage mindestens 16:00 Uhr belegt.\n\n### Prompt mit mehreren Bedingungen\n\n```text\n/condition 1 Tests erfolgreich\n/condition 2 Review freigegeben\n/if condition 1 /and condition 2 -> mergen\n```\n\nBeide Gates getrennt belegen. Erst danach mergen.\n\n### Verbot statt Verzögerung\n\n```text\n/if-only verifiziertes Backup vorhanden -> alte Dateien löschen\n```\n\nOhne belegtes Backup nichts löschen und das offene Verbot im Abschlussbericht nennen.\n\n## Fallstricke\n\n- Bedingung nur im Fließtext wiederholen, statt sie als Zustand zu führen.\n- Ein gesamtes Goal pausieren, obwohl nur ein Teilschritt blockiert ist.\n- Relative Zeit ohne Setzzeitpunkt und Zeitzone speichern.\n- Werkzeugbeleg durch Annahme oder Selbstauskunft ersetzen.\n- `/if-only` wie ein bloßes Warten behandeln.\n- Nach `/or` nicht mehr benötigte Alternativ-Gates offen lassen.\n- Anbieter-, Modell-, Benutzer- oder Hostnamen in die allgemeine Mechanik einbauen.\n- Einen lokalen Runtime-Pfad als Voraussetzung für die Sprache selbst behandeln.\n\n## Changelog\n\n### 1.1.0 (2026-07-28)\n\n- Anbieter-, benutzer- und systemneutral für gemeinsame Skill-Runtimes formuliert.\n- Nutzung in Goals und Prompts explizit gemacht.\n- Runtime als austauschbaren Adapter beschrieben; feste lokale Pfade und Modellnamen entfernt.\n- Mehrdeutige `/and`-/`/or`-Verknüpfungen, dauerhafte Zustände und Autorisierungsgrenzen geklärt.\n\n### 1.0.0 (2026-07-25)\n\n- Erste Fassung mit `/condition`, `/if`, `/if-only`, `/when`, `/after`, `/and` und `/or`.\n"}, {"id": "skill:utilities:decide", "name": "decide", "cat": "utilities", "ver": "1.0.0", "status": "active", "desc": "Structured decision making: Pro/Con matrix, weighted scoring, decision tree, scenario analysis, and Eisenhower matrix.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: decide\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-15\nupdated: 2026-03-15\ndescription: Structured decision making: Pro/Con matrix, weighted scoring, decision tree, scenario analysis, and Eisenhower matrix.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: utilities\ntags: [decision, evaluation, prioritization, framework]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/_services/decide.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-15', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"decide banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Decide — Structured Decision Making (Deutsch)\n\n> Rational decisions through structured frameworks and evaluation methods\n\n---\n\n## When to Use?\n\n- Choosing between options\n- Need a pro/con list\n- Multi-criteria decision\n- Uncertain about important decisions\n\n**Trigger words:** decide, choose, compare, evaluate, weigh\n\n---\n\n## Frameworks\n\n### 1. Pro/Con Matrix (Simple)\n\nQuick decisions between 2 options.\n\n```\nPRO A:                    CON A:\n- Advantage 1             - Disadvantage 1\n- Advantage 2             - Disadvantage 2\n\nPRO B:                    CON B:\n- Advantage 1             - Disadvantage 1\n- Advantage 2             - Disadvantage 2\n\nRecommendation: [A/B] because [reasoning]\n```\n\n---\n\n### 2. Weighted Scoring (Complex)\n\nMulti-criteria decisions with weighting.\n\n| Criterion | Weight | Option A | Score A | Option B | Score B |\n|-----------|--------|----------|---------|----------|---------|\n| Criterion 1 | 30% | 8 | 2.4 | 6 | 1.8 |\n| Criterion 2 | 25% | 7 | 1.75 | 9 | 2.25 |\n| TOTAL | 100% | - | X.XX | - | X.XX |\n\n**Process:**\n1. Collect criteria\n2. Assign weights (sum = 100%)\n3. Rate options (1-10 scale)\n4. Calculate scores (rating x weight)\n5. Compare and recommend\n\n---\n\n### 3. Decision Tree (Sequential)\n\nDecisions with clear if-then paths:\n1. Define starting question\n2. First branch (most important criterion)\n3. Next level (second most important)\n4. Down to final option\n\n---\n\n### 4. Scenario Analysis (Uncertainty)\n\n```\nBest Case (X% probability):\n  Outcome: +Y points -> Expected value: +Z\n\nRealistic Case (X%):\n  Outcome: +Y -> Expected value: +Z\n\nWorst Case (X%):\n  Outcome: -Y -> Expected value: -Z\n\nTotal expected value: [Sum]\n```\n\n---\n\n### 5. Eisenhower Matrix (Prioritization)\n\n```\n              URGENT          NOT URGENT\nIMPORTANT     1. DO           2. PLAN\nNOT IMPORTANT 3. DELEGATE     4. ELIMINATE\n```\n\n---\n\n## Quality Checklist\n\nCheck before final recommendation:\n- [ ] All relevant criteria identified?\n- [ ] User values considered?\n- [ ] Long-term effects considered?\n- [ ] Risks identified and evaluated?\n- [ ] Bias check performed?\n- [ ] Reversibility assessed?\n\n---\n\n## Best Practices\n\n### Defining Criteria\n- Specific and measurable\n- Not too many (3-7 ideal)\n- Independent of each other\n\n### Weighting\n- Sum = 100%\n- Most important criterion >= 25%\n- No weights < 5%\n\n### Recommendation\n- Clear and reasoned\n- Mention alternatives\n- Name risks\n- Consider reversibility\n\n---\n\n## Workflow & Vorgehen\n\n```\n1. User request\n2. Understand decision\n3. Identify options (2-5)\n4. Choose framework\n5. Collect criteria\n6. Apply framework\n7. Bias check (optional)\n8. Make recommendation\n9. Document reasoning\n```\n\n---\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-03-15)\n- Ported from BACH v3.8.0\n\n---\n\n*Ported from BACH v3.8.0 | Standalone Version*"}, {"id": "protocol:utilities:decision-avatar", "name": "decision-avatar", "cat": "utilities", "ver": "1.0.0", "status": "active", "desc": "Bei vorhandenem und ausdrücklich autorisiertem lokalem Entscheidungsprofil: wiederkehrende Entscheidungen aus belegtem Feedback vorhersagen, Konfidenz kalibrieren und Vorhersage, Entscheidung und Ausführung strikt trennen.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: decision-avatar\nversion: 1.0.0\ntype: protocol\nauthor: Claude + Codex\ncreated: 2026-07-28\nupdated: 2026-07-28\ndescription: >\n  Bei vorhandenem und ausdrücklich autorisiertem lokalem Entscheidungsprofil:\n  wiederkehrende Entscheidungen aus belegtem Feedback vorhersagen, Konfidenz\n  kalibrieren und Vorhersage, Entscheidung und Ausführung strikt trennen.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\n\ncategory: infrastructure\ntags: [entscheidung, avatar, theory-of-mind, feedback, konfidenz, provenance]\nlanguage: de\nstatus: active\n\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\n\nprovenance:\n  origin: \"custom\"\n  origin_path: \"private decision-avatar profile (not published)\"\n  origin_version: \"1.2.0\"\n  origin_repo: null\n  last_sync_from_origin: \"2026-07-28\"\n  last_sync_to_origin: null\n  local_changes_since_sync: true\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"decision-avatar banner\">\n# Decision Avatar\n\n## Zweck\n\nDieser Skill bildet keine Person nach. Er stellt ein überprüfbares Verfahren\nbereit, um bei wiederkehrenden Entscheidungstypen eine wahrscheinliche Präferenz\naus echten, autorisierten Belegen abzuleiten.\n\nNutze ihn nur, wenn ein lokales Entscheidungsprofil vorhanden und dessen Nutzung\nfür die aktuelle Aufgabe zulässig ist. Ohne Profil liefert der Skill keine\nstellvertretende Entscheidung.\n\nDie Nutzung gilt nur dann als autorisiert, wenn Auftrag, geltende Agentenregel\noder Profilmetadaten den aktuellen Zweck ausdrücklich erlauben. Bloße\nErreichbarkeit einer Profildatei ist keine Einwilligung.\n\n## Kernprinzipien\n\n1. **Beleg vor Vermutung.** Direkte Aussagen und bestätigte Entscheidungen wiegen\n   stärker als abgeleitete Muster.\n2. **Vorhersage ist keine Aussage der Person.** Agentenausgaben dürfen nicht als\n   neue Primärbelege in das Profil zurückfließen.\n3. **Entscheiden ist nicht Ausführen.** Eine Empfehlung kann bestimmt sein, obwohl\n   ihre Umsetzung zusätzliche Autorität braucht.\n4. **Stille Zustimmung ist kein Feedback.** Ausbleibender Widerspruch bestätigt\n   keine Vorhersage.\n5. **Profile bleiben lokal und privat.** Keine personenbezogenen Daten, Secrets\n   oder sensiblen Inhalte in geteilte Skill-Dateien übernehmen.\n\n## Portables Profilmodell\n\nDie Dateinamen sind frei konfigurierbar; benötigt werden nur diese Rollen:\n\n| Rolle | Inhalt |\n|---|---|\n| Methodik | Evidenzstufen, Datenschutz und Kalibrierungsregeln |\n| Belegte Präferenzen | direkte Aussagen und bestätigte Entscheidungen |\n| Hypothesen | abgeleitete Regeln mit Konfidenz und Quellen |\n| Aktionen | aufgrund einer Vorhersage getroffene Handlungen |\n| Feedback | Bestätigung, Korrektur oder Ablehnung durch die Person |\n\nProjektbezogene, aktuellere Entscheidungen haben Vorrang vor allgemeinen\nPräferenzen.\n\nJeder verwertete Beleg sollte mindestens enthalten:\n\n```text\nQuellen-ID:\nDatum:\nEntscheidungstyp und Gültigkeitsbereich:\nStatus: bestätigt/korrigiert/widerrufen\nGültig bis: <optional>\n```\n\nWiderrufene, abgelaufene oder außerhalb ihres Gültigkeitsbereichs liegende Belege\nnicht verwenden. Bei widersprüchlichen bestätigten Belegen gewinnt zunächst der\nspezifischere und danach der aktuellere. Bleibt der Konflikt bestehen, Konfidenz\nauf „niedrig“ setzen und eskalieren.\n\n## Entscheidungsloop\n\n### 0. Lokale Vorrangregel prüfen\n\nGibt es für das aktuelle Projekt oder den konkreten Entscheidungstyp eine\nbestätigte Regel, nutze diese und dokumentiere ihre Quelle.\n\n### 1. Echte Evidenz suchen\n\nNur Belege verwenden, die nach der lokalen Methodik zulässig sind. Aufgabenlisten,\nAgentenprotokolle, frühere Avatar-Antworten und Argumente der aktuellen Sitzung\nsind keine Aussagen der Person.\n\n### 2. Vorhersage bilden\n\nErgebnis stets mit Begründung und einer von drei Stufen ausgeben:\n\n- **hoch:** mehrere direkte, konsistente und einschlägige Belege,\n- **mittel:** plausibles Muster mit begrenzter oder indirekter Evidenz,\n- **niedrig:** neuartige Lage, widersprüchliche Belege oder kein belastbares\n  Muster.\n\nFolgenreiche Entscheidungen sind nicht automatisch „niedrig“. Konfidenz misst\ndie Evidenz für die Präferenz, nicht die Reichweite der späteren Ausführung.\n\n### 3. Modus trennen\n\n| Modus | Ergebnis | Seiteneffekt |\n|---|---|---|\n| Vorhersagen | wahrscheinliche Position + Belege + Konfidenz | keiner |\n| Entscheiden | konkrete Wahl + Begründung + Konfidenz | keiner |\n| Handeln | autorisierte, sichere Umsetzung + Aktionsprotokoll | möglich |\n\nIm Handlungsmodus gelten zusätzlich die Autoritäts- und Sicherheitsregeln der\nRuntime. Niedrige Konfidenz oder fehlende Ausführungsbefugnis führt zur\nEskalation, nicht zur stillen Ausführung.\n\n### 4. Feedback kalibrieren\n\nNach echtem Feedback:\n\n1. Vorhersage als bestätigt, korrigiert oder abgelehnt markieren.\n2. Optional eine Bewertungsskala erfassen.\n3. Unterschied zwischen Richtungsfehler und Zuschnittfehler festhalten.\n4. Hypothese und Konfidenz anpassen.\n5. Nur echte Rückmeldung in die belegten Präferenzen übernehmen.\n\n## Ausgabeformat\n\n```text\nEntscheidungstyp:\nModus:\nWahrscheinliche Präferenz:\nKonfidenz:\nZulässige Belege:\nGegenbelege oder Unsicherheit:\nAusführung autorisiert: ja/nein\nNächster Schritt:\n```\n\nIn Ausgaben nur redigierte Quellen-IDs und die für die Entscheidung notwendige\nBelegzusammenfassung nennen. Keine privaten Aussagen, absoluten Profilpfade oder\nsensiblen Rohdaten wiedergeben.\n\n## Grenzen\n\n- Keine Diagnostik oder Behauptung über innere Zustände einer Person.\n- Keine Nutzung eines Profils außerhalb seines erlaubten Zwecks.\n- Keine automatische Übernahme von Agentenannahmen als Personenwissen.\n- Keine Ausführung allein aufgrund einer Vorhersage, wenn dafür neue Autorität\n  erforderlich wäre.\n\n## Changelog\n\n### 1.0.0 (2026-07-28)\n- Feedback-Präkognition, Konfidenzkalibrierung und Provenienztrennung aus einer\n  persönlichen Avatar-Konfiguration als eigenständiges, portables Protokoll\n  extrahiert.\n- Autorisierung, Beleglebenszyklus, Konfliktauflösung und redigierte Ausgabe\n  operationalisiert.\n"}, {"id": "skill:utilities:decision-briefing", "name": "decision-briefing", "cat": "utilities", "ver": "1.0.1", "status": "active", "desc": "Use whenever several decisions are pending or have accumulated -- whether within a topic, project, document, or over the course of a session: inventory them, present a numbered briefing with options A/B/C/D and a marked recommendation, accept letter answers (including batches), record the results, and write them back into the source documents.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: decision-briefing\nversion: 1.0.1\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-06-13\nupdated: 2026-06-13\ndescription: Use whenever several decisions are pending or have accumulated -- whether within a topic, project, document, or over the course of a session: inventory them, present a numbered briefing with options A/B/C/D and a marked recommendation, accept letter answers (including batches), record the results, and write them back into the source documents.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: utilities\ntags: [entscheidung, briefing, batch, decision-session, priorisierung, workflow]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/agents/_experts/decision-briefing/', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-06-13', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"decision-briefing banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Decision-Briefing — Work Through Many Decisions on One Topic (Deutsch)\n\n> A pile of open decisions becomes a numbered briefing with recommendations that the user can answer at lightning speed with single letters — one by one or as a batch.\n\n---\n\n## When to use?\n\n**Always, as soon as several decisions are pending** -- regardless of topic. Typical situations:\n\n- Many open decisions have piled up in one area/topic\n- A document (plan, TODO list, concept) contains several undecided points\n- Several decision questions have accumulated during a conversation\n- The agent itself has several questions for the user -- bundle them as a briefing instead of asking one by one\n- The user wants to clear open items quickly and on a solid basis\n\n**Trigger words:** open decisions, decision session, briefing, work through, go through, let's decide all of this\n\n**Scope:** [decide](../decide/SKILL.en.md) provides frameworks for ONE question. `decision-briefing` coordinates working through MANY decisions on one topic — and applies `decide` to complex individual cases.\n\n---\n\n## Core UX\n\nThe heart of this skill is the briefing format. Each decision is presented so that answering costs only a single letter:\n\n- **Numbering:** `[E01]`, `[E02]`, … — stable references throughout the session\n- **Short question** + 1–2 sentences of context\n- **Options as letters** A/B/C/D (2–4 options, more only if necessary)\n- **Marked recommendation** with a one-sentence rationale (e.g. `→ Recommendation: A — because …`)\n- Optional: consequence note (what follows from the choice)\n\n**User answer formats:**\n\n```\nSingle:    \"E01: A\"  or  \"1A\"\nBatch:     \"1A 2C 3B\"  or  \"E01: A, E02: C, E03: B\"\nDeepen:    \"E02: more info\"  or  \"2?\"\nDefer:     \"E03: later\"\n```\n\n---\n\n## Workflow & Vorgehen\n\n```\nTopic + decisions at hand\n     |\n     v\nPhase 1: CAPTURE & INVENTORY\n     |\n     v\nPhase 2: PREPARE THE BRIEFING\n     |\n     v\nPhase 3: DECISION SESSION\n     |\n     v\nPhase 4: RECORD & WRITE BACK\n```\n\n### Phase 1: Capture & Inventory\n\nSources: what the user names, a document at hand, or the conversation context. No system-wide scan — only what is already there.\n\n1. List all open decisions (one line each: short title)\n2. Detect and merge **duplicates** (same question, phrased multiple times)\n3. Mark **dependencies** (\"E04 depends on E01\")\n4. Set the **order**: blockers first (decisions that others depend on), then by urgency\n5. Show the list to the user for confirmation (\"Did I get them all? Anything missing?\")\n\n### Phase 2: Prepare the Briefing\n\nPer decision:\n\n```\n[E01] <Short question>\n  Context: <1-2 sentences: Why is this up? What depends on it?>\n  A) <Option>\n  B) <Option>\n  C) <Option>\n  → Recommendation: <letter> — <one-sentence rationale>\n  (optional) Consequence: <what follows from the choice / next action>\n```\n\nRules for good options:\n\n- Options must be mutually exclusive and cover the spectrum\n- If useful, include a \"keep status quo\" or \"defer\" option\n- The recommendation is transparently reasoned — never covertly suggestive\n- When facts are unclear: clarify first (or flag as an open question), do not guess\n\n### Phase 3: Decision Session\n\n1. Present the briefing — one decision per message or all at once as a batch; with >5 decisions, use blocks of 3–5\n2. Accept letter answers and acknowledge them\n3. On a \"more info\" answer: deepen the decision (method toolbox below)\n4. For complex individual cases (many criteria, high stakes): escalate to the [decide](../decide/SKILL.en.md) skill (weighted scoring, scenario analysis)\n5. Carry deferred decisions forward explicitly as open — never drop them silently\n\n### Phase 4: Record & Write Back\n\n1. Create a **results table**:\n\n```\n| No.  | Decision            | Chosen | Status   |\n|------|---------------------|--------|----------|\n| E01  | <short title>       | A      | decided  |\n| E02  | <short title>       | C      | decided  |\n| E03  | <short title>       | —      | deferred |\n```\n\n2. Write decided items back into the **source documents/TODO files** — at the location of the open question, e.g.:\n\n```\nDECISION: <question>\n  → DECIDED 2026-06-13: Option A (<short form>)\n  → Next action: <if the decision implies a follow-up action>\n```\n\n3. Keep **deferred items explicitly open** (in the source document or the TODO list) so they reappear in the next briefing\n\n---\n\n## Beispiel & Anwendung\n\nTopic: relaunch of a club website — 3 open decisions from the project plan.\n\n```\n[E01] Which system for the new website?\n  Context: Current site is hand-maintained HTML; 2 people will maintain content in the future.\n  A) Static site generator (fast, secure, maintained via Git)\n  B) Classic CMS with admin interface\n  C) Hosted website builder\n  → Recommendation: B — two non-technical editors need an interface, not Git.\n\n[E02] How is it hosted?\n  Context: Budget ~10 EUR/month, no dedicated admin in the club.\n  A) Shared hosting with the current provider\n  B) Small dedicated VPS\n  C) Managed hosting matching the chosen system\n  → Recommendation: C — least maintenance effort without an admin; consequence: depends on E01.\n\n[E03] When does the new site go live?\n  Context: Content is 60% migrated; club anniversary in 3 months.\n  A) Immediately as a soft launch (rest follows)\n  B) After complete content migration\n  C) On the anniversary as the deadline\n  → Recommendation: A — reversible and yields early feedback; final content follows.\n```\n\nThe user answers as a batch: **\"1B 2C 3A\"** → results table, then the three decisions are marked DECIDED in the project plan.\n\n---\n\n## Method Toolbox (for \"more info\" and deepening)\n\n| Method | When | Summary |\n|--------|------|---------|\n| **Pro/con matrix** | 2–3 options, quick comparison | Evaluate all options side by side |\n| **Weighted scoring** | Multiple criteria | Weighted criteria, points per option (quantitative where possible) |\n| **Second-order thinking** | Unclear stakes | What are the consequences of the consequences? |\n| **Premortem** | Risky decision | \"It failed — why?\" Find weak spots in advance |\n| **10/10/10 method** | Emotional/temporal distortion | How does the decision look in 10 minutes / 10 months / 10 years? |\n\n---\n\n## Working Principles\n\n- **Never push decisions:** provide information, justify the recommendation transparently — the user decides\n- **Bias detection:** name thinking errors when they become visible (confirmation bias, sunk cost)\n- **Mind reversibility:** decide reversible choices quickly, treat final ones more thoroughly\n- **Respect time pressure:** fast decisions need simpler methods — not every question deserves a weighted scoring analysis\n\n---\n\n## Scope and Synergies\n\n| Function | `decide` | `decision-briefing` |\n|---|---|---|\n| Structure a single decision with a framework | ✓ | — |\n| Inventory many decisions on one topic | — | ✓ |\n| Numbered briefing with A/B/C options | — | ✓ |\n| Batch answers (\"1A 2C 3B\") | — | ✓ |\n| Write back into source documents | — | ✓ |\n\n**Synergy:** For complex individual cases within a session, `decision-briefing` applies the frameworks from `decide` (weighted scoring, scenario analysis). For the larger thinking process before that (analyze → ideate → decide), see [structured-thinking](../structured-thinking/SKILL.en.md).\n\n---\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-06-13)\n- Ported from the BACH expert `decision-briefing` v1.0.0; scanner component (scanner.py, sources.json, marker scans) deliberately removed — capture is lightweight, based on the context at hand\n\n---\n\n*Ported from BACH | Standalone version without scanner*\n\n**See also:** [decide](../decide/SKILL.en.md) (frameworks for a single decision) | [structured-thinking](../structured-thinking/SKILL.en.md) (analyze → ideate → decide as a meta workflow)"}, {"id": "tool:utilities:document-chunker", "name": "document-chunker", "cat": "utilities", "ver": "1.0.0", "status": "active", "desc": "Split documents into overlapping token chunks for RAG pipelines and LLM context windows. Zero dependencies.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: document-chunker\nversion: 1.0.0\ntype: tool\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Split documents into overlapping token chunks for RAG pipelines and LLM context windows. Zero dependencies.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: true\ncategory: utilities\ntags: [chunking, rag, tokens, nlp, text-processing, embedding]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/tools/document_chunker.py', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"document-chunker banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Document Chunker (Deutsch)\n\nSplits documents into overlapping token chunks. Optimized for RAG pipelines\nand LLM context windows. Zero dependencies — Python stdlib + re only.\n\n## Usage\n\n### As Library\n```python\nfrom document_chunker import DocumentChunker\n\nchunker = DocumentChunker(chunk_size=400, overlap=80)\nchunks = chunker.chunk_text(\"Long text...\")\n\nfor chunk in chunks:\n    print(f\"Chunk {chunk['chunk_id']}: {chunk['tokens']} tokens\")\n```\n\n### Chunking a File\n```python\nchunks = chunker.chunk_document(\"document.md\", source=\"My Project\")\n```\n\n### Chunking an Entire Directory\n```python\nfrom document_chunker import chunk_corpus\n\nchunks = chunk_corpus([\"doc1.md\", \"doc2.txt\"], source=\"Corpus\")\n```\n\n### CLI\n```bash\npython document_chunker.py document.md    # Single file\npython document_chunker.py ./docs/        # Entire directory\n```\n\n## Parameters\n\n| Parameter | Default | Description |\n|-----------|---------|-------------|\n| chunk_size | 400 | Max tokens per chunk |\n| overlap | 80 | Overlapping tokens between chunks |\n\n## Supported File Types\n\n`.txt`, `.md`, `.py`, `.sh`\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-03-12)\n- Ported from BACH system/tools/document_chunker.py"}, {"id": "tool:utilities:encoding-fix", "name": "encoding-fix", "cat": "utilities", "ver": "1.0.0", "status": "active", "desc": "Mojibake repair for double/triple encoded UTF-8. Fixes Windows cp1252/Latin-1 misinterpretations. Zero dependencies.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: encoding-fix\nversion: 1.0.0\ntype: tool\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Mojibake repair for double/triple encoded UTF-8. Fixes Windows cp1252/Latin-1 misinterpretations. Zero dependencies.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: true\nbach_origin: true\ncategory: utilities\ntags: [encoding, utf-8, mojibake, windows, cp1252, text-repair]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/tools/encoding_fix.py', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': False}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"encoding-fix banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Encoding Fix (Deutsch)\n\nRepairs mojibake (double/triple encoded UTF-8) caused by Windows cp1252/Latin-1\nmisinterpretation. Zero dependencies — Python stdlib only.\n\n## Typical Problem\n\n```\n\"ue\" (U+00FC) -> UTF-8 \\xc3\\xbc -> read as cp1252 -> \"Ã¼\"\n```\n\n## Usage\n\n### As Library\n```python\nfrom encoding_fix import sanitize_outbound\n\nclean = sanitize_outbound(\"WÃ¼rge\")  # -> \"Wuerge\"\n```\n\n### Subprocess Output\n```python\nfrom encoding_fix import sanitize_subprocess_output\n\ntext = sanitize_subprocess_output(process.stdout)\n```\n\n### CLI\n```bash\npython encoding_fix.py \"WÃ¼rge\"    # Check a single string\npython encoding_fix.py              # Self-test\n```\n\n## Features\n\n- **Idempotent:** Correctly encoded text is not modified\n- **Up to 3 rounds:** Repairs even triple-encoded strings\n- **Subprocess decoder:** UTF-8/cp1252 fallback for process output\n- **Zero dependencies:** Python stdlib only\n\n## Änderungsprotokoll\n\n### 1.0.0 (2026-03-12)\n- Ported from BACH system/tools/encoding_fix.py"}, {"id": "tool:utilities:folder-flattening", "name": "folder-flattening", "cat": "utilities", "ver": "1.0.0", "status": "active", "desc": "Restructure nested folder hierarchies into flat, machine-readable layouts. Bash-based with intelligent merge logic.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: folder-flattening\nversion: 1.0.0\ntype: tool\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-03-12\ndescription: Restructure nested folder hierarchies into flat, machine-readable layouts. Bash-based with intelligent merge logic.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: true\ncategory: utilities\ntags: [folder, flattening, filesystem, bash, reorganization, cleanup]\nlanguage: de\nstatus: active\ndependencies: {'tools': [], 'services': [], 'protocols': [], 'python': []}\nprovenance: {'origin': 'bach', 'origin_path': 'system/skills/workflows/ordner-flattening.md', 'origin_version': '1.0.0', 'origin_repo': 'github.com/ellmos-ai/bach', 'last_sync_from_origin': '2026-03-12', 'last_sync_to_origin': None, 'local_changes_since_sync': True}\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"folder-flattening banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# Workflow: Folder Flattening (Deutsch)\n\nGoal: Convert nested folder structures into a flat, machine-readable structure.\nAdvantage: No more clicking through directories — search via database (Verzeichnis.db) instead.\nDuplicates are allowed when thematically meaningful.\n\n---\n\n## Phase Overview\n\n| Phase | What Happens | Script Section |\n|-------|-------------|----------------|\n| 1 | Flatten: Pull all subfolders to one level | `phase_flatten` |\n| 2 | Shorten: Truncate long path names to last segment, merge on conflicts | `phase_shorten` |\n| 3 | Clean up: Resolve multiple underscores (`___`), remove trailing `_` | `phase_cleanup_underscores` |\n| 4 | Group: Number folders, CD folders, short names into collection folders | `phase_group_problematic` |\n| 5 | Triplet analysis: Sliding groups of 3, shortest name as merge target | `phase_tripel_merge` |\n| 6 | Media format merge: Consolidate folders by file type (template) | `phase_media_merge` |\n| 7 | Clean up: Delete empty folders | `phase_cleanup_empty` |\n\n---\n\n## Important Rules\n\n### Triplet Analysis Matching\n- **Substring**: `Education` in `EducationalBrochures` -> merge into `Education`\n- **Plural/Umlaut**: `Room` = `Rooms`, `Part` = `Parts`, `Book` = `Books`\n- **First word**: `Autism ADHD` matches `Autism Career` (same beginning)\n\n### Minimum Length\n- Single-word name without spaces: **at least 8 characters** (prevents `Hand`, `House`, `Form`)\n- With spaces (e.g., `ICF Catalog`): **from 3 characters OK**\n- This keeps `ICF`, `ASD Women` etc. permitted\n\n### Restart After Merge\nAfter each merge, the folder list is reloaded and restarted at the merge target.\nThis way, e.g., `Autism` collects all extensions before moving on.\n\n---\n\n## Media Format Merge (Template System)\n\nPhase 6 uses a template array `MEDIA_TYPES`. Each entry defines:\n- Target folder (with `_` prefix)\n- File extensions belonging to this type\n\n```bash\nMEDIA_TYPES=(\n    \"_Audio|mp3|m4a|wav|flac|ogg|wma|aac|opus|aiff\"\n    \"_Video|mp4|avi|mkv|mov|wmv|flv|webm|m4v|mpg|mpeg|3gp\"\n    \"_Images|jpg|jpeg|png|gif|bmp|tiff|tif|webp|svg|ico|heic|heif|raw|cr2|nef\"\n    # Extensible:\n    # \"_Spreadsheets|xlsx|xls|csv|ods\"\n    # \"_Presentations|pptx|ppt|odp\"\n    # \"_Code|py|js|ts|sh|bat|ps1\"\n    # \"_CAD|dwg|dxf|step|stl\"\n    # \"_3D|obj|fbx|blend|gltf|glb\"\n    # \"_Fonts|ttf|otf|woff|woff2\"\n)\n```\n\nOnly folders containing **exclusively** files of one type are moved.\nFolders with subfolders are skipped.\n\n### Adding a New Media Type\n\nSimply add a new line to the `MEDIA_TYPES` array:\n```bash\n\"_TargetFolder|ext1|ext2|ext3\"\n```\n\n---\n\n## Execution\n\n```bash\n# Complete run: (Deutsch)\ncd /path/to/target/directory\nbash ordner_flattening_komplett.sh\n\n# Or individual phases: (Deutsch)\nbash ordner_flattening_komplett.sh --phase flatten\nbash ordner_flattening_komplett.sh --phase tripel\nbash ordner_flattening_komplett.sh --phase media\nbash ordner_flattening_komplett.sh --phase cleanup\n```\n\n---\n\n## Experience Values (Session 2026-01-26)\n\n- Start: 206 folders + 252 loose files, ~5600 nested subfolders\n- After flatten: ~2200 folders on one level\n- After shorten + clean up: ~2005 folders\n- After grouping (numbers, CDs): ~2005 -> collection folders created\n- After triplet v1: ~1561 folders\n- After triplet v2 (8-character rule): further reduction\n- Media format phase: Audio/video/image folders consolidated"}, {"id": "skill:utilities:idea-mining", "name": "idea-mining", "cat": "utilities", "ver": "0.0.0", "status": "active", "desc": "", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nlanguage: de\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"idea-mining banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n> **English Translation** — Official English version of `idea-mining`.\n\n\n\n# Idea-Mining — Ideen schürfen, filtern, eine durchziehen (Deutsch)\n\n## Übersicht & Zweck\n\nBei schweren Problemen scheitert Ideenfindung selten am Mangel an Einfällen, sondern an drei\nDingen: Die Einfälle werden nicht **festgehalten**, sie werden nicht gegen **bereits\nVersuchtes** geprüft (man rennt in dieselben Sackgassen), und es wird keiner konsequent\n**zu Ende verfolgt**. Dieser Workflow trennt die drei Phasen hart: erst divergent schürfen\n(ohne Bewertung), dann filtern (gegen die Dokumentation des Projekts), dann EINE Idee\nsubstanziell explorieren.\n\nHerkunft: destilliert aus einem produktiven Forschungs-Automations-Lauf über offene\nmathematische Probleme; funktioniert genauso für Architektur-, Design- und Konzeptblockaden.\n\n## Phase A — Ideenspeicher füllen (divergent, ohne Bewertung)\n\nAlle Fundstücke in eine Datei `IDEENSPEICHER.md` im Projektordner schreiben (Stichworte +\n2–3 Sätze, Quelle/Auslöser notieren). Die acht Techniken nacheinander durchgehen — sie\nzielen auf unterschiedliche Assoziationsräume, deshalb bei wirklich festgefahrenen\nProblemen keine überspringen (bei leichteren Blockaden oder knapper Zeit genügt eine\nbegründete Teilmenge, mindestens aber eine weiche Technik aus 3–5 plus die Recherche):\n\n1. **Wiedererkennung:** Kommt mir das bekannt vor? Habe ich diese Struktur schon einmal\n   in anderem Kontext gesehen?\n2. **Fern-Disziplin:** Gibt es ein ähnliches Problem/eine ähnliche Formel in einer weit\n   entfernten Disziplin (Physik↔Ökonomie, Biologie↔Informatik, …)? Wo genau liegt die\n   Verbindung?\n3. **Alltags-Allegorie:** Das Problem in einer naturnahen Allegorie erzählen (Wellen,\n   Sand, Strömung, Wachstum …). Wirksam: die Allegorie von einem **unbelasteten\n   Subagenten** erfinden lassen und dann schauen, wohin sie führt — die eigene Sicht ist\n   vom Problem schon deformiert.\n4. **Störgefühl / Frosch→Prinz:** Was stört mich am aktuellen Stand, was finde ich\n   hässlich? Was müsste sich ändern, damit ich es plötzlich schön fände? Ästhetisches\n   Unbehagen zeigt oft auf die falsch gewählte Darstellung.\n5. **Märchen-Reframing:** Das Problem als Märchen erzählen: Wer ist der Held, wer die\n   Bösewichte, welche Gefahren lauern, was könnte dem Helden helfen? Die Rollenzuweisung\n   erzwingt eine Kausalstruktur, die im Formalismus unsichtbar bleibt.\n6. **Recherche:** Web, Fachdatenbanken, Preprint-Server, Foren (Reddit/ResearchGate/GitHub)\n   nach neuen Veröffentlichungen, Scripts, Ansätzen durchsuchen. Relevante Quellen in einen\n   Ordner `_sources/` laden und auf Innovationen lesen — bei Preprints kritisch bleiben.\n7. **Geschwisterprojekte:** Verwandte eigene Projekte auf rücktransferierbare Lösungsideen\n   prüfen (dort gelöste Teilprobleme, dort gebaute Werkzeuge).\n8. **Bestandsquerlauf:** Den gesamten eigenen Projektbestand (Pipeline) auf Ansätze\n   durchgehen, die auf DIESES Problem passen könnten.\n\n## Phase B — Filter (gegen bereits Versuchtes)\n\nDen Ideenspeicher gegen die Projektdokumentation abgleichen: Beweisnotizen, Proof-Notes,\nEntscheidungs-Logs, TODO/DONE, frühere Ideenspeicher. **Eliminiert wird, was dokumentiert\nbereits versucht und abgeschlossen ist** — nicht, was nur „unwahrscheinlich klingt\"\n(Bewertung nach Attraktivität kommt erst in Phase C). Überlebende nach\n`IDEENSPEICHER_FILTERED.md`.\n\nVoraussetzung ist eine gepflegte Versuchs-Dokumentation — existiert keine, ist der erste\nSchritt, sie anzulegen (sonst produziert jeder künftige Lauf Wiederholungen).\n\n## Phase C — Wählen und durchziehen\n\n1. Ein bis drei Ideen aus dem Filtrat kurz anexplorieren (je ein Absatz: was wäre der\n   erste konkrete Schritt, was das Erfolgssignal?).\n2. **Eine** wählen — die mit der stärksten Anziehung. Attraktion ist hier ein legitimes\n   Kriterium: Bei schweren Problemen trägt nur eine Idee, der man nachgehen *will*.\n3. Die Wahl bis zum Ende oder zumindest substanziell weiterführen — nicht nach dem ersten\n   Hindernis zur nächsten Idee springen (das wäre Phase-A-Verhalten in Phase C).\n\n## Phase D — Dokumentieren\n\n- Erkenntnisse in die Projektdokumentation (Beweisnotiz, Entscheidungs-Log, ADR) —\n  **auch die Fehlschläge**, sie sind der Filter für den nächsten Lauf.\n- Offene Folgeideen zurück in `IDEENSPEICHER.md` bzw. TODO.\n- Kurzbericht: geschürft (Anzahl) | gefiltert (überlebend) | exploriert | Ergebnis | nächster Schritt.\n\n## Phase E — Aussaat (optionaler Rücktransfer nach außen)\n\nTechnik 7 holt Ideen aus Geschwisterprojekten HEREIN — Phase E dreht die Richtung um:\nWenn die Exploration etwas Übertragbares ergeben hat (Methode, Werkzeug, Lösungsmuster),\nkurz den eigenen Projektbestand durchgehen: Wem würde das helfen?\n\n- **Gezielt säen, nicht streuen:** höchstens ~3 Empfängerprojekte direkt mit einem\n  konkreten TODO-Eintrag versehen (was übernehmen, wo es liegt, warum es passt);\n  weitere Kandidaten nur als priorisierte Liste im eigenen Projekt notieren.\n- Grund für die Grenze: Breites Streuen erzeugt in vielen Projekten vage Aufgaben,\n  die niemand aufgreift — drei präzise Saatkörner schlagen zehn diffuse.\n\n## Als periodischer Lauf\n\nDer Workflow eignet sich als wiederkehrende Automation über ein festes Projekt (Innovations-\nRunde). Dafür mit dem Rotations-Gerüst kombinieren (`rotation-check`-Skill): Registry\nverhindert, dass dieselben Ideen mehrfach „neu entdeckt\" werden — der Ideenspeicher und die\nVersuchs-Doku sind hier das Gedächtnis.\n\n## Beispiel & Anwendung\n\n```text\nProblem: Ein Konvergenzbeweis steckt seit Wochen an einer Abschätzung fest.\n\nA) Schürfen → IDEENSPEICHER.md: u. a. (2) ähnliche Struktur in der Warteschlangen-\n   theorie?; (3) Subagent-Allegorie „Sand rieselt durch immer feinere Siebe\" →\n   Idee: Abschätzung stufenweise statt global; (6) Preprint von 2026 mit neuem\n   Lemma, nach _sources/ geladen; (7) Nachbarprojekt hat ein numerisches\n   Prüfscript, das sich rücktransferieren lässt.\nB) Filter gegen BEWEISNOTIZ.md: „globale Abschätzung verschärfen\" wurde 2× versucht\n   und dokumentiert verworfen → raus. 3 Ideen überleben → IDEENSPEICHER_FILTERED.md.\nC) Prime-Wahl: die Sieb-Idee (stärkste Anziehung) — bis zu einem Teilresultat\n   durchgezogen.\nD) BEWEISNOTIZ.md aktualisiert (auch der Fehlschlag von Idee 2), Kurzbericht.\n```\n\n## Red Flags\n\n| Gedanke | Realität |\n| --- | --- |\n| „Technik 3–5 sind Spielerei\" | Die weichen Techniken liefern die Ideen, die Recherche nicht liefern kann — sie adressieren andere Assoziationsräume. |\n| „Ich bewerte schon beim Sammeln\" | Bewertung in Phase A tötet die divergente Ausbeute. Erst speichern, dann filtern. |\n| „Der Filter dauert zu lange, ich erinnere mich schon\" | Gedächtnis glättet Fehlversuche — nur die Doku zählt. |\n| „Idee klemmt, ich nehme die nächste\" | In Phase C wird durchgezogen; Springen zurück nach A nur mit dokumentiertem Grund. |\n\n## Verwandte Skills\n\n- `brainstorm` — breite Kreativmethoden (SCAMPER, Six Hats) ohne Filter-/Explorations-Pipeline.\n- `think` / `decide` — Analyse und Auswahlentscheidung, nutzbar innerhalb Phase C.\n- `rotation-check` — Gerüst für den periodischen Einsatz.\n- `swarm-operations` — unbelastete Subagenten für Technik 3 und parallele Exploration.\n\n## Änderungsprotokoll\n\n### 1.1.0 (2026-07-03)\n- Phase E „Aussaat\": optionaler Outbound-Transfer übertragbarer Ergebnisse in\n  Geschwisterprojekte (max. ~3 direkte Empfänger) — integriert statt als eigener\n  cross-project-transfer-Skill (Dedup-Entscheid).\n\n### 1.0.0 (2026-07-03)\n- Initiale Version. Abstrahiert aus der Codex-Automation „ultra-deep-idea-search-single-project\"\n  (Ideenspeicher → Filter → Prime-Wahl → Exploration) und user-neutral verallgemeinert."}, {"id": "skill:utilities:law-checker", "name": "law-checker", "cat": "utilities", "ver": "0.1.0", "status": "active", "desc": "Points to the standalone module law-checker (\"Legal Department\"): source-grounded AI first-look legal assessments for German law with a statute registry and a statute-embodiment agent. Use this skill when a situation, contract, official notice, or legal question under German law should be checked with exact citations (article/section, paragraph, sentence) -- with a clear boundary: AI-assisted first orientation, not a substitute for a lawyer.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: law-checker\nversion: 0.1.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-07-23\nupdated: 2026-07-23\ndescription: Points to the standalone module law-checker (\"Legal Department\"): source-grounded AI first-look legal assessments for German law with a statute registry and a statute-embodiment agent. Use this skill when a situation, contract, official notice, or legal question under German law should be checked with exact citations (article/section, paragraph, sentence) -- with a clear boundary: AI-assisted first orientation, not a substitute for a lawyer.\n\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\nprovenance: {'origin': 'external', 'origin_repo': 'https://github.com/ellmos-ai/law-checker', 'origin_path': 'SKILL.md, config.json, agents/gesetzbuch.md, references/', 'origin_version': None, 'last_sync_from_origin': '2026-07-23', 'last_sync_to_origin': None, 'local_changes_since_sync': False}\ncategory: utilities\ntags: [legal, law, germany, wrapper, pointer-skill]\nlanguage: de\nstatus: active\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"law-checker banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n# law-checker (Legal Department) -- Pointer Skill (Deutsch)\n\nThis skill is a **thin pointer (wrapper)** to the standalone, public module\nrepository [`ellmos-ai/law-checker`](https://github.com/ellmos-ai/law-checker)\n(MIT license, public). The actual skill lives there -- this repository only\nlinks to it and documents installation, so the module is discoverable through\nthe central skill catalog.\n\n## What the module does\n\n`law-checker` produces source-grounded AI first-look legal assessments for\nGerman law:\n\n- **Statute registry** (`config.json`): togglable statutes; every statute\n  claim must be backed by locally fetched official law texts (article or\n  section, paragraph, sentence where needed, short quote, source, retrieval\n  date).\n- **Statute-embodiment agent** (`agents/gesetzbuch.md`): a generic agent that\n  answers \"from inside the statute\" for any registered law -- scales to\n  arbitrary statutes added to the registry.\n- **Separate case-law layer:** court decisions are cited only after web\n  verification (court, date, docket number, ECLI where available).\n- **Risk and escalation workflow:** report format with a risk-level scale,\n  deadline discipline, and a lawyer-specialty routing matrix.\n\n## Boundaries (important)\n\n- **AI-assisted first orientation only, not a substitute for individual legal\n  advice, and not performed by a licensed lawyer.**\n- Not a law firm, not a hosted legal service, not a deadline calendar.\n- If real legal mail is involved (warning letter, official notice, lawsuit,\n  deadline): secure the original document, note the deadline, and consult a\n  qualified lawyer -- do not automate the matter.\n\n## Installation (generic, no local paths)\n\n1. Clone the module:\n   ```bash\n   git clone https://github.com/ellmos-ai/law-checker.git <clone-path>\n   ```\n2. Adopt `<clone-path>/SKILL.md` into your own skill environment (e.g.\n   `~/.claude/skills/law-checker/` or the equivalent for your agent runtime).\n3. Set the module path in the adopted `SKILL.md` and its references to\n   `<clone-path>` -- do NOT commit real local paths or hostnames into a\n   versioned skill environment.\n4. Load the statute registry: `python <clone-path>/_tools/gesetze_fetch.py`\n   (fetches the configured official statute texts; the texts themselves are\n   deliberately not in the repo, to avoid redistributing stale portal\n   snapshots).\n5. For structure, license, and liability details, see the module repo's\n   README.\n\n## Origin of this pointer skill\n\nThis wrapper was added on 2026-07-23 as a showcase entry for the\n`ellmos-ai/skills` repository. There is **no code duplication** -- maintenance\nand versioning stay solely in the `ellmos-ai/law-checker` module repo.\n\n## Änderungsprotokoll\n\n### 0.1.0 (2026-07-23)\n- Initial pointer skill for `ellmos-ai/law-checker`."}, {"id": "skill:utilities:lebende-verfassung", "name": "lebende-verfassung", "cat": "utilities", "ver": "1.0.0", "status": "active", "desc": "Neutrale moralisch-rechtliche Prüfinstanz für Politik und Entscheidungen — der lauffähige Prototyp des Forschungsprojekts \"Die Position der Ungeborenen\" (Schattenmodus Stufe 1). Nutze diesen Skill, wann immer eine politische Entscheidung, ein Gesetz(entwurf), eine Reform, ein Haushaltsbeschluss oder eine gesellschaftliche Streitfrage analysiert, geprüft oder begutachtet werden soll — auch bei Formulierungen wie \"prüfe aus Sicht künftiger Generationen\", \"Gesetzespass\", \"was sagt das Grundgesetz dazu\", \"Superposition-Prüfung\", \"Gesetzesgeschichte/Containeranalyse\", \"Folgenabschätzung\", \"analysiere diese Reform\", \"lebende Verfassung\" oder wenn der User eine Politik-Fragestellung mit Bitte um neutrale, mehrstufige Bewertung einbringt. Orchestriert die 5-CORE-Architektur (config.json): moralische Superposition-Instanz, Gesetzbuch-Verkörperungen, zweistufige Folgenabschätzung (retrospektiv/prospektiv mit Evidenzhierarchie), Wissens-Handler mit lokalem Speicher, einstellbarer Workflow.", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nname: lebende-verfassung\ndescription: Neutrale moralisch-rechtliche Prüfinstanz für Politik und Entscheidungen — der lauffähige Prototyp des Forschungsprojekts \"Die Position der Ungeborenen\" (Schattenmodus Stufe 1). Nutze diesen Skill, wann immer eine politische Entscheidung, ein Gesetz(entwurf), eine Reform, ein Haushaltsbeschluss oder eine gesellschaftliche Streitfrage analysiert, geprüft oder begutachtet werden soll — auch bei Formulierungen wie \"prüfe aus Sicht künftiger Generationen\", \"Gesetzespass\", \"was sagt das Grundgesetz dazu\", \"Superposition-Prüfung\", \"Gesetzesgeschichte/Containeranalyse\", \"Folgenabschätzung\", \"analysiere diese Reform\", \"lebende Verfassung\" oder wenn der User eine Politik-Fragestellung mit Bitte um neutrale, mehrstufige Bewertung einbringt. Orchestriert die 5-CORE-Architektur (config.json): moralische Superposition-Instanz, Gesetzbuch-Verkörperungen, zweistufige Folgenabschätzung (retrospektiv/prospektiv mit Evidenzhierarchie), Wissens-Handler mit lokalem Speicher, einstellbarer Workflow.\nversion: 1.0.0\ntype: skill\nauthor: Lukas Geiger\ncreated: 2026-03-12\nupdated: 2026-07-30\nstandalone: true\nanthropic_compatible: true\nbach_compatible: false\nbach_origin: false\ncategory: utilities\ntags: [policy, ethics, law, impact-assessment, future-generations]\nlanguage: de\nstatus: active\ndependencies:\n  tools: []\n  services: []\n  protocols: []\n  python: []\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"lebende-verfassung banner\">\n# Lebende Verfassung — neutrale Prüfinstanz (5-CORE-Architektur, v4)\n\nDu übernimmst mit diesem Skill die Rolle einer **neutralen Instanz**, die\nEntscheidungen und Politik analysiert. Zentral ist eine **moralische LLM-Instanz**\n(CORE 1), die nach expliziten, konfigurierbaren Gesetzen urteilt und die\nPerspektiven der **Gegenwartsgesellschaft, der künftig Lebenden und der noch\nUngeborenen gleichrangig** vertritt (Superposition). Du bist kein\nMeinungsverstärker: Deine Loyalität gilt der Prüfmethode, nicht einem gewünschten\nErgebnis.\n\n**Kontext:** Prototyp (Schattenmodus, Stufe 1) des Forschungsprojekts\n`<USER_HOME>\\OneDrive\\.TOPICS\\.RESEARCH\\.LAB\\.LLM\\DRAFT__Lebende Verfassung LLM`\n(im Folgenden: `<PROJEKT>`). Jeder Lauf erzeugt einen archivierten Prüfbericht =\nDatenpunkt für das Paper. Der Skill berät; er entscheidet nichts und ersetzt keine\nRechtsberatung.\n\n## Schritt 0 — Charta laden (immer zuerst)\n\nLies `<PROJEKT>\\prototyp\\config.json` — die **maschinenlesbare Charta**. Sie\nbestimmt, welche Komponenten jedes CORES aktiv sind UND in welcher Reihenfolge\ngearbeitet wird (`core5.ablauf`). **Dieser Skill ist das Ausführungsorgan von\nCORE 5** — die Orchestrierung selbst ist Teil der Charta und damit einstellbar.\nNur aktive Komponenten verwenden; im Bericht die geltende Konfiguration ausweisen\n(Buchstaben je CORE + config-Version). Chartaänderungen (auch am Ablauf!) nie\nstillschweigend: Version hochzählen + Status-Log-Vermerk im AKTIONSPLAN.\n\n## Die fünf CORES (Arbeitsteilung: WAS gilt · WAS wirkt · WIE beschaffen · WANN)\n\n| CORE | Inhalt | Umsetzung |\n|---|---|---|\n| **1 — Moralische Instanz** (WAS moralisch gilt) | Regeln der Instanz, die sich in Superposition begibt: konfigurierbare Prüfgesetze (a Superposition/Rawls · b Kant-Universalisierung · c Kant-Zweckformel · d Kant-Publizität · e Jonas · f Befähigung · … n) | Agent `superposition-instanz` (liest config + `prototyp/references/core1_gesetze.md` selbst) |\n| **2 — Geltende Gesetzbücher** (WAS rechtlich gilt) | Verkörperte Rechtsquellen (a GG · b BGB · erweiterbar). Konzeptionell ein **schwächerer, lokal-aktueller CORE 1**: weniger substantiell begründet, historisch änderbar — daher CORE-1-Vorrang | Agents laut config (`grundgesetz`, `bgb`); Normtexte lokal (CORE-4d-Handler) |\n| **3 — Folgenabschätzung** (WAS die Entscheidung bewirkt) | **(a) Gesetzeslage:** Gesetzestext-Geschichte verknüpft mit begleitender Zeitgeschichte und empirischen Markern — Jetztstand · Textgeschichte/Containeranalyse (Changelog/Genealogie) · Zeitgeschichte & Empirie (Analogfälle; Zielgröße definieren → Daten vor/nach vergleichen → Wirkungshypothesen) · **Rechtsprechungs-Auslegungsschicht** (web-verifizierte Entscheidungen mit Az., DOPPELT: zum geprüften Gesetz UND zu den von CORE 2 gemeldeten Normen — das Auslegungs-Korrektiv zu den bewusst textreinen Verkörperungen). **(b) Folgen:** wirtschaftliche und qualitative Folgenabschätzung — Studienlage · Kausalketten mit **Evidenz je Pfeil** · GESIM · **Gegenfaktual-Pflicht** (Status quo + Alternativen mit Lastverteilung) — gewichtet nach **Evidenzhierarchie** (kausal identifizierte Studien > Panel > Querschnitt > Modell > Expertenurteil > Plausibilität) | Anleitung: `prototyp/references/core3_folgenabschaetzung.md`; Containeranalyse: `references/containeranalyse_methodik.md`; nutzt die CORE-4-Handler |\n| **4 — Wissens-Handler** (WIE Wissen beschafft wird) | Werkzeugschicht: (a) Web/Zeitgeschehen · (b) Wissenschafts-Datenbanken · (c) GESIM-Zugriff · (d) lokale Normtexte · (e) **Wissensspeicher** (Pflicht-Zwischenabfrage vor jeder externen Recherche; speichern/updaten statt duplizieren) | WebSearch/PubMed/OpenAlex; `.LAB\\.GESIM\\results\\`; `_data\\gesetze\\`; Speicher `prototyp\\wissen\\` |\n| **5 — Workflowdynamik** (WANN was geschieht) | Einstellbare **Ablauf-Sequenz** (`core5.ablauf`), Tiefe (voll/kurz), zweite CORE-Runde, Review-Modell, Positionen-Minimum, Ablage, Sprache. Der Skill führt aus, die Charta steuert | `config.json` → core5 |\n\n## Die Vorrangregel (Herzstück der Auswertung)\n\n**CORE 1 steht über CORE 2** (die Charta über der änderbaren Positivierung), und\n**CORE 3 diszipliniert die Wirkungsbehauptungen** (erst die Gesetzes-Achse mit\nihrer historischen Empirie (3a), dann die Folgen-Achse (3b) — Zahlen nie ohne\nEvidenzrahmen). Daraus folgt:\n\n- **Abweichung CORE 1 ↔ CORE 2** = Befund erster Güte: Regelungslücke,\n  Reformbedarf oder Grenze der Prüfgesetze — explizit deuten.\n- **Deckung CORE 1 ↔ CORE 2** = Anker (z. B. Art. 20a GG) — stärkste Argumente.\n- **CORE 3a ↔ Behauptungen:** Wenn die Geschichte ähnlicher Eingriffe den\n  behaupteten Wirkungen widerspricht (oder sie stützt), ist das gewichtige\n  Evidenz — Trendbrüche und Confounder ehrlich ausweisen.\n- **Innerhalb CORE 3b:** Widersprüche zwischen Evidenzstufen nicht glätten\n  („Modell sagt X, die einzige DiD-Studie sagt Y\").\n- Konflikte **innerhalb** der Kerne (zwischen CORE-1-Gesetzen; GG ↔ BGB) notieren.\n\n## Ablauf — folge `config.core5.ablauf`\n\n**Eingabe:** eine Fragestellung des Users (Gesetz, Reform, Entscheidung, Streitfrage).\nBei JEDEM Recherche-Schritt gilt CORE 4e: erst Wissensspeicher abfragen, dann\nextern; neue wiederverwendbare Befunde dort ablegen (Quellen + Abrufdatum).\n\nStandard-Sequenz (config v4) und was jeder Schritt bedeutet:\n\n1. `charta_laden` — config lesen, Konfiguration notieren.\n2. `core4a_faktenerhebung` — Was ist beschlossen/geplant (Primärquellen!), von\n   wem, mit welchen Zahlen? Neutrale Faktenzusammenfassung; Unklares hier klären.\n3. `core3a_gesetzeslage` — die Gesetzes-Achse: Jetztstand +\n   Textgeschichte/Containeranalyse + begleitende Zeitgeschichte mit empirischen\n   Markern (Zielgröße, Vorher-Nachher) → **Wirkungshypothesen**\n   (bei Tiefe „kurz\" ohne Containeranalyse).\n4. `core3b_folgen_erste_runde` — die Folgen-Achse, qualitativ: Studienlage +\n   Kausalketten zu den Hypothesen (Evidenzstufen ausweisen).\n5. `core12_pruefung_parallel` — Faktenlage + CORE-3-Befunde **parallel in einem\n   Zug** an die aktiven Agents (`superposition-instanz` + aktive CORE-2-Agents);\n   unabhängige Rohbefunde (den Agents nicht die Befunde der anderen mitgeben).\n6. `core3a_rechtsprechung_auslegung` — Rechtsprechungsrecherche (web-verifiziert:\n   Gericht, Datum, Az., Fundstelle; NIE aus dem Gedächtnis) zu (i) dem geprüften\n   Gesetz und (ii) den von den Agents als berührt gemeldeten Normen; Wirkung auf\n   jeden Rohbefund einordnen (stützt/begrenzt/differenziert); danach\n   Konvergenz-/Divergenzanalyse nach Vorrangregel UND Konvergenz-Regel:\n   **nur Verdikte konvergieren** — Prüfaufträge und Hypothesen sind eigene\n   Kategorien, jede Aussage trägt ihr Label (Verdikt | Prüfauftrag | Hypothese).\n7. `core4_institutionen_kassen` — Institutionen-/Kassenbild: Träger, Ressorts,\n   Sozialkassen; wer zahlt/spart/entscheidet (wrong-pockets-Raster:\n   wrong/long/invisible pocket, risk asymmetry); gezielte Nachrecherche zu neuen\n   Hypothesen aus Schritt 5.\n8. `core3b_folgen_vertiefung_gesim` — GESIM-Bestand: passende Modellrechnung\n   MIT Szenariospannen zitieren, sonst Kassenmatrix qualitativ + fehlenden Lauf\n   als Folgeauftrag ausweisen. Caveat immer: modellgestützt, Policy-Belastbarkeit\n   erst ab Validierungsleiter L4. Hier auch **Gegenfaktual** (B4) und **Steelman**\n   (stärkste Gegenposition inkl. amtlicher Verteilungsrechnungen) fertigstellen.\n9. `core12_rueckkopplung` — Kassenmatrix + Wirtschaftsbefund + Rechtsprechungs-\n   und Gegenfaktual-Befunde den Agents als Kurzrunde: Ändern sich die Urteile?\n   (entfällt bei Tiefe „kurz\")\n10. `bericht` — Gesamtbericht nach Format unten, versiegelt in\n   `<PROJEKT>\\_results\\gutachten\\`.\n11. `fremdmodell_review` — laut core5.review_modell (Rohbericht bleibt dabei\n   UNVERÄNDERT — er ist der versiegelte Messpunkt); auto: bevorzugt Codex via\n    `node ~/.claude/plugins/cache/openai-codex/codex/1.0.4/scripts/codex-companion.mjs task --write -C \"<PROJEKT>\" \"Lies _results/gutachten/<Bericht> und reviewe adversarial: Faktenfehler, Logikfehler, einseitige Gewichtung, fehlende Perspektiven. Schreibe nach _results/gutachten/<Bericht>_REVIEW.md\"`,\n    ersatzweise Gemini/agy per Datei-Muster, sonst Review-Slot offen ausweisen).\n12. `revision_response` (core5.revision, genau 1 Runde) — das\n   Preprint-Review-Revision-Muster mit vier Artefakten: Rohbericht (versiegelt)\n   und REVIEW (versiegelt) bleiben unverändert nebeneinander stehen; dann\n   `<Bericht>_RESPONSE.md` schreiben — **Punkt-für-Punkt comply-or-explain\n   gegenüber dem Reviewer**: jeder Einwand wird akzeptiert (mit Korrektur) ODER\n   begründet zurückgewiesen (Dissens bleibt sichtbar; der Reviewer hat nicht\n   automatisch recht — auch Reviews enthalten Fehler); schließlich\n   `<Bericht>_FINAL.md` als zitierfähige Fassung erzeugen (Rohbericht +\n   akzeptierte Korrekturen + Provenienz-Kopfzeile mit Verweis auf\n   Roh/REVIEW/RESPONSE). Kein Konsens-Loop: keine zweite Review-Runde des\n   Reviewers über die FINAL-Fassung (Goodhart-Sperre). Für Benchmarks zählen\n   Rohberichte, für Nutzung zählt FINAL.\n\nSteht in `core5.ablauf` eine andere Reihenfolge, gilt die config.\n\n## Berichtsformat (immer dieses Gerüst)\n\nAblage: `<PROJEKT>\\_results\\gutachten\\JJJJ-MM-TT_<slug>.md`\n\n```markdown\n# Prüfbericht: <Fragestellung>\n> Skill lebende-verfassung v4 | Datum | Modell | Konfiguration: CORE1 [a–f] / CORE2 [a,b] / CORE3 [a,b] / CORE4 [a–e], config v<N> | Status: Schattenmodus (beratend, Forschungsprototyp)\n## A Faktenlage (CORE 4a — neutral, Primärquellen)\n## B Rechtsstand (CORE 3a — geltende Regelungen + Mechanismus; Endfassungs-Disziplin: Ausschussfassung/BT-Drs., synoptische Stand-Tabelle bei geänderten Entwürfen)\n## C Gesetzeslage: Textgeschichte × Zeitgeschichte × empirische Marker (CORE 3a — Genealogie/Container, Analogfälle, Zielgröße, Vorher-Nachher → Wirkungshypothesen)\n## D Folgenabschätzung (CORE 3b — Befundtabelle Wirkung·Richtung·Evidenzstufe·Quelle mit getrennter Provenienz amtlich/Verband/Studie; Kausalketten mit Evidenz je Pfeil; GESIM mit Spannen + Ladder-Caveat; **Gegenfaktual + Steelman**)\n## E CORE 1: Urteile der Superposition-Instanz (Maxime UND Gegenmaxime + Sensitivität; Einzelurteile je Gesetz + Positionen-Tableau + Synthese)\n## F CORE 2: Stimmen der Gesetzbücher (je aktivem Buch: Rohbefund + Einordnung)\n## F2 Rechtsprechungs-Auslegungsschicht (CORE 3a — Entscheidungen mit Az.; Wirkung auf jeden Rohbefund: stützt/begrenzt/differenziert; Normtext- vs. ausgelegter Befund)\n## G Konvergenzen und Divergenzen (CORE1↔CORE2, CORE3a↔Behauptungen, Evidenzstufen-Konflikte, innerhalb der Kerne — jede Aussage mit Kategorien-Label: Verdikt | Prüfauftrag | Hypothese; nur Verdikte konvergieren)\n## H Institutionen- und Kassenmatrix (wer zahlt/spart/entscheidet; wrong-pockets-Befund)\n## I Gesamturteil und Empfehlungen (+ offene Fragen, Unsicherheiten, Dissens, ggf. fehlender GESIM-Lauf als Folgeauftrag)\n## J Review (Modell, Datum, Kernpunkte, Umgang damit)\n```\n\n## Grenzen (im Bericht stets sichtbar)\n\n- Beratend, nicht bindend; Forschungsprototyp — keine Rechtsberatung, kein\n  Verwaltungsakt, kein Ersatz demokratischer Entscheidung.\n- Quellenbindung überall: keine erfundenen Kausalitäten (nur literaturbekannte\n  Ketten oder klar markierte Hypothesen), keine Zahlen ohne Quelle;\n  Gesetzes-Aussagen nur aus den lokalen Normtexten der Agents;\n  Rechtsprechungs-Aussagen nur web-verifiziert mit Aktenzeichen; jede\n  Wirkungsaussage trägt ihre Evidenzstufe UND Provenienz (amtlich/Verband/Studie).\n- Bias-Sperren (aus Erstlauf-Review 2026-07-11): Endfassung = Ausschussfassung,\n  nicht PM/Entwurf; Maxime neutral + Gegenmaxime; nur Verdikte konvergieren;\n  Gegenfaktual und Steelman sind Pflichtteile, keine Kür.\n- Unsicherheit ist Teil des Ergebnisses: „nicht entscheidbar\" ist zulässig und wertvoll.\n- Chartaänderungen (config.json, auch Ablauf) nur bewusst: Version hochzählen +\n  Status-Log-Vermerk — stiller Chartawandel ist genau das, wovor das Paper warnt.\n- Jeder Rohbericht und jedes Review ist ein versiegelter Datenpunkt (nicht\n  nachträglich ändern). Korrekturen fließen ausschließlich über die\n  Revisionsstufe (RESPONSE + FINAL) — vier Artefakte pro Lauf, Provenienzkette\n  vollständig.\n\n## Kanonik\n\nKanonische Fassung: `<PROJEKT>\\prototyp\\SKILL.md` (= Ausführungsorgan von CORE 5).\nRegistrierte Kopie: `~/.claude/skills/lebende-verfassung/SKILL.md` — bei\nAbweichung gewinnt die neuere Fassung (versioniertes Bindungsmuster); Änderungen zurückspiegeln.\nAgents: `~/.claude/agents/superposition-instanz.md`, `grundgesetz.md`, `bgb.md`.\nReferenzen: `prototyp/references/core1_gesetze.md`, `core3_folgenabschaetzung.md`,\n`containeranalyse_methodik.md`. Wissensspeicher: `prototyp/wissen/`.\n"}, {"id": "skill:utilities:llm-text-hygiene", "name": "llm-text-hygiene", "cat": "utilities", "ver": "0.0.0", "status": "active", "desc": "", "langs": ["de", "en", "es", "ja", "ru", "zh"], "text": "---\nlanguage: de\n---\n\n<img src=\"banner.png\" width=\"100%\" alt=\"llm-text-hygiene banner\">\n\n> **Deutsch** — Offizielle Deutsch-Version / Documento Oficial en Deutsch.\n\n\n> **English Translation** — Official English version of `llm-text-hygiene`.\n\n\n\n# LLM-Text-Hygiene — KI-Spuren aus fertigen Texten entfernen (Deutsch)\n\n## Übersicht & Zweck\n\nKI-gestützt entstandene Texte sammeln Rückstände, die im Entwurf unsichtbar bleiben und\nerst im publizierten Dokument peinlich werden: Gesprächsfetzen aus der Chat-Session,\nRegieanweisungen, die aus der Argumentationsstruktur herausfallen, Danksagungen an das\nSprachmodell, stehengebliebene Platzhalter, aufdringliche LLM-Stilmuster — und eine\nAI-Disclosure, die fehlt, falsch platziert oder nicht mehr wahr ist. Dieser Skill ist der\nsystematische Reinigungs-Pass davor: prüfen, konservativ bereinigen, Disclosure richtig\nstellen. **Er verändert nie die Substanz** — er entfernt, was nicht Teil des Werks ist.\n\n## Prüfkatalog\n\nFünf Befundklassen, von eindeutig (direkt fixen) nach heikel (nur markieren):\n\n### 1. Chat-Residue und Regieanweisungen (eindeutig → streichen/ausbessern)\n\nSätze, die zur ENTSTEHUNG des Texts gehören, nicht zum Text: „Wie besprochen lassen wir\ndiesen Teil im Paper, da …\", „Hier ist der überarbeitete Abschnitt:\", „Gerne ergänze\nich …\", übrig gebliebene Prompt-Fragmente, Meta-Kommentare an den Auftraggeber.\n**Erkennungsprinzip:** Der Satz fällt aus der Text- und Argumentationsstruktur heraus —\ner adressiert eine Gesprächssituation statt den Leser. Beim Streichen prüfen, ob ein\ninhaltlicher Rest gerettet werden muss (Begründung in Fußnote/Text überführen).\n\n### 2. Platzhalter und Baustellen-Marker (eindeutig → auflösen)\n\n`[TODO: …]`, `[Referenz einfügen]`, `XXX`, `<hier Beispiel>`, leere Abschnitte mit\nÜberschrift, „(Quelle?)\". Auflösen oder — wenn nicht auflösbar — als echte offene\nAufgabe in die Projekt-TODO überführen und aus dem Deliverable entfernen.\n\n### 3. LLM-Danksagungen und Anthropomorphes (eindeutig → entfernen)\n\nDanksagungen an ChatGPT/Claude/Gemini & Co. gehören nicht in die Danksagung — Werkzeuge\nwerden nicht bedankt, ihr Einsatz wird in der AI-Disclosure deklariert. Ebenso entfernen:\nanthropomorphe Formulierungen über das Werkzeug („die KI schlug freundlicherweise vor\").\n\n### 4. AI-Disclosure (prüfen → korrigieren)\n\n- **Vorhanden?** Wenn das Dokument KI-gestützt entstand und Venue/Projekt eine Disclosure\n  verlangt oder vorsieht: existiert der Abschnitt?\n- **Korrekt?** Beschreibt sie den tatsächlichen Einsatz (nicht unter-, nicht übertrieben)?\n  Nutzt sie das Disclosure-Schema des Projekts/der Venue, falls eines definiert ist\n  (z. B. abgestufte Level)?\n- **Richtig platziert?** An der venue-üblichen Stelle (Methoden/Acknowledgements-Umfeld/\n  eigener Abschnitt), identisch in allen Sprachfassungen.\n\n### 5. LLM-Stilmuster (heikel → nur klare Fälle fixen, Rest markieren)\n\nFormelhafte Übergänge („Zusammenfassend lässt sich sagen\", „Es ist wichtig zu betonen\"),\nAufzählungs-Inflation wo Fließtext hingehört, „nicht nur … sondern auch\"-Ketten,\nGedankenstrich-Dichte, Hedging-Floskeln, im Englischen die bekannten Marker (u. a.\n„delve\", „tapestry\", „it's worth noting\"). **Vorsicht:** Stil ist Urheber-Territorium —\nnur eindeutige Formelhaftigkeit glätten, alles andere als Befundliste an den Autor geben\nstatt den Text umzuschreiben. Ein menschlich klingender Text ist nicht das Ziel des\nSkills; das Ziel ist ein Text ohne Fremdkörper.\n\n## Ablauf\n\n1. **Scope klären:** Welche Deliverables (Dateien), welche Sprachfassungen? Änderungen\n   IMMER synchron über alle Fassungen (Abgleich: `bilingual-doc-sync`).\n2. **Mechanischer Scan:** Volltextsuche nach den Signal-Mustern (Tabelle unten) —\n   billig, findet Klasse 2/3 und Teile von 1 zuverlässig.\n3. **Lese-Pass:** Das Dokument entlang der Argumentationsstruktur lesen — Klasse-1-Funde\n   erkennt man nur strukturell (Satz adressiert Gespräch statt Leser). Besonders prüfen:\n   Abschnittsanfänge/-enden, Danksagungen, Einleitung/Fazit (dort landet Residue zuerst).\n4. **Bereinigen:** Klassen 1–3 direkt fixen (konservativ, Substanz erhalten), Klasse 4\n   korrigieren, Klasse 5 als Befundliste ausgeben; nur eindeutige Fälle direkt glätten.\n5. **Dokumentieren:** Was gefunden/geändert/nur markiert wurde — bei Papern mit\n   Versionierungspflicht vermerken, ob eine neue Version/ein Re-Upload nötig wird.\n6. **Periodisch über einen Bestand:** mit `rotation-check` kombinieren (ein Dokument/\n   Projekt pro Lauf, Registry als Gedächtnis).\n\n## Signal-Muster für den mechanischen Scan\n\n| Klasse | Suchmuster (DE) | Suchmuster (EN) |\n| --- | --- | --- |\n| Chat-Residue | „wie besprochen\", „wie gewünscht\", „hier ist\", „gerne\", „im Chat\", „wie du sagtest\", „lassen wir\" | \"as discussed\", \"as requested\", \"here is the\", \"I have added\", \"per your\" |\n| Platzhalter | `TODO`, `XXX`, `[…einfügen]`, `<…>`, „Quelle?\" | `TBD`, `[insert`, `placeholder`, `citation needed` |\n| LLM-Dank | „Dank an ChatGPT/Claude/Gemini\", „mithilfe von KI erstellt\" (außerhalb Disclosure) | \"thanks to ChatGPT/Claude\", \"grateful to the AI\" |\n| Stilmarker | „zusammenfassend lässt sich\", „es ist wichtig zu betonen\", „nicht nur … sondern auch\" | \"delve\", \"tapestry\", \"it's worth noting\", \"in conclusion\" |\n\nDie Tabelle ist Startpunkt, kein Filter-Ersatz: Muster liefern Kandidaten, die Entscheidung\nfällt im Kontext (Schritt 3–4). Für rein mechanische Zeichen-Hygiene (Emoji-Scan,\nSteuerzeichen, kaputte Umlaute) vorhandene Werkzeuge nutzen — Encoding-Schäden sind\n`encoding-fix`-Territorium, nicht dieses Skills.\n\n## Beispiel & Anwendung\n\n```text\nAuftrag: „Prüf das Paper vor dem Upload auf KI-Rückstände.\"\n\n1. Scope: paper_de.tex + paper_en.tex.\n2. Scan: 1× \"as discussed\" (EN, Abschnitt 4), 1× \"[TODO: Referenz Smith]\" (beide),\n   Danksagung erwähnt \"wertvolle Hilfe von Claude\".\n3. Lese-Pass: In der Einleitung ein Satz, der den Reviewer direkt adressiert\n   („Diesen Einwand behandeln wir wie gewünscht in 3.2\") → Regieanweisung.\n4. Fixes: Regieanweisung gestrichen (Inhalt steckte schon in 3.2), TODO als Aufgabe\n   in TODO.md überführt + Platzhalter entfernt, LLM-Dank gestrichen, stattdessen\n   AI-Disclosure-Abschnitt auf tatsächlichen Einsatz präzisiert — alles in DE und EN.\n5. Vermerk: inhaltliche Änderung → neue
