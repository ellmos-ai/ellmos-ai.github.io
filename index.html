<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ellmos-ai — Module Circuit Map</title>
<meta name="description" content="Explore the public ellmos-ai ecosystem through an interactive module circuit map, with German and English guidance.">
<link rel="canonical" href="https://ellmos-ai.github.io/">
<meta property="og:type" content="website">
<meta property="og:title" content="ellmos-ai — Module Circuit Map">
<meta property="og:description" content="An interactive public map of the ellmos-ai module ecosystem.">
<meta property="og:url" content="https://ellmos-ai.github.io/">
<meta property="og:image" content="https://ellmos-ai.github.io/assets/banner.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg:#0b1410; --board:#0e1a14; --zone:#12241b; --zone-edge:#1f3a2c;
    --copper:#d8a05a; --copper-dim:#8a6a3e; --trace:#3f6b52; --trace-hot:#e8b96a;
    --ink:#d7e4da; --ink-dim:#8fa697; --ink-faint:#5f7568;
    --ok:#5ad08a; --dev:#e0b45a; --plan:#7d8f84; --priv:#c97b7b;
    --chip:#0a120e; --accent:#63d6a4;
    --panel:#0d1712; --panel-edge:#24402f; --surface:transparent;
  }
  html[data-theme="light"]{
    --bg:#f6f7fd; --board:#ffffff; --zone:#ffffff; --zone-edge:#e4e6f6;
    --copper:#5f3dc4; --copper-dim:#9775fa; --trace:#b9bef0; --trace-hot:#e64980;
    --ink:#272a4d; --ink-dim:#5d6083; --ink-faint:#9497bb;
    --ok:#0ca678; --dev:#f08c00; --plan:#a9acce; --priv:#e64980;
    --chip:#f3f4fc; --accent:#4263eb;
    --panel:#fbfbff; --panel-edge:#e4e6f6; --surface:#ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.45}
  a{color:var(--accent)}

  /* ---------- Kopf ---------- */
  header{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;
    padding:22px 26px 14px; border-bottom:1px solid var(--zone-edge); background:var(--surface)}
  .brand h1{font-size:26px; letter-spacing:.5px; color:var(--copper); font-weight:700}
  html[data-theme="light"] .brand h1{font-weight:800;
    background:linear-gradient(90deg,#4263eb 0%,#7048e8 45%,#e64980 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent}
  .brand h1 .dot{color:var(--accent)}
  html[data-theme="light"] .brand h1 .dot{color:transparent}
  .brand .sub{color:var(--ink-dim); font-size:14px; margin-top:2px; max-width:60ch}
  nav.pagenav{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
  nav.pagenav a{font-size:12.5px; color:var(--ink-dim); text-decoration:none;
    border:1px solid var(--zone-edge); border-radius:999px; padding:3px 11px;
    background:var(--surface)}
  nav.pagenav a.on{background:var(--copper); color:#181008; font-weight:700; border-color:var(--copper)}
  html[data-theme="light"] nav.pagenav a.on{background:linear-gradient(90deg,#4263eb,#7048e8);
    color:#fff; border-color:transparent}
  nav.pagenav a:hover{border-color:var(--copper)}
  .controls{margin-left:auto; display:flex; flex-wrap:wrap; gap:10px; align-items:center}
  .controls input[type=search]{background:var(--chip); color:var(--ink);
    border:1px solid var(--zone-edge); border-radius:8px; padding:7px 12px; width:220px; font-size:14px}
  .controls input[type=search]:focus{outline:1px solid var(--copper-dim)}
  .toggle{display:flex; align-items:center; gap:6px; color:var(--ink-dim); font-size:13px;
    cursor:pointer; user-select:none}
  .themebtn{background:var(--chip); border:1px solid var(--zone-edge); border-radius:8px;
    padding:6px 11px; font-size:15px; cursor:pointer; line-height:1}
  .themebtn:hover{border-color:var(--copper)}
  .langsw{display:flex; border:1px solid var(--zone-edge); border-radius:8px; overflow:hidden}
  .langsw button{background:var(--chip); color:var(--ink-dim); border:0; padding:7px 12px;
    font-size:13px; cursor:pointer}
  .langsw button.on{background:var(--copper); color:#181008; font-weight:700}
  html[data-theme="light"] .langsw button.on{background:linear-gradient(90deg,#4263eb,#7048e8); color:#fff}

  /* ---------- Layout ---------- */
  main{display:flex; gap:0; align-items:stretch}
  #boardwrap{flex:1 1 auto; min-width:0; padding:22px; position:relative}
  #board{position:relative; display:grid; gap:34px 40px;
    grid-template-columns:1.1fr 1.1fr 1fr .95fr;
    grid-template-areas:
      "runtime runtime connectors connectors"
      "orchestration control tools tools"
      "memory knowledge sync sync"
      "domains domains quality meta";
  }
  #wires{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible}
  .wlabel{position:absolute; transform:translate(-50%,-50%); background:var(--board);
    border:1px solid var(--trace); color:var(--ink-dim); font-size:11px; padding:2px 8px;
    border-radius:999px; pointer-events:none; white-space:nowrap; z-index:3; transition:.15s}
  html[data-theme="light"] .wlabel{box-shadow:0 2px 6px rgba(70,70,150,.08)}
  .wlabel.hot{border-color:var(--trace-hot); color:var(--trace-hot); background:#161006}
  html[data-theme="light"] .wlabel.hot{background:#fff0f6}

  /* ---------- Zonen ---------- */
  .zone{position:relative; z-index:2; background:var(--zone);
    border:1px solid var(--zone-edge); border-radius:12px; padding:12px 14px 14px;
    box-shadow:0 0 0 4px rgba(216,160,90,.03), inset 0 0 40px rgba(0,0,0,.25);
    transition:border-color .15s, box-shadow .15s, transform .15s; cursor:default}
  .zone::before{content:""; position:absolute; left:10px; right:10px; top:-3px; height:3px;
    background:repeating-linear-gradient(90deg,var(--copper-dim) 0 10px,transparent 10px 24px);
    opacity:.5; border-radius:2px}
  html[data-theme="light"] .zone{border-top:3px solid var(--zct,#7048e8); border-radius:14px;
    box-shadow:0 8px 24px rgba(76,78,160,.08)}
  html[data-theme="light"] .zone::before{display:none}
  .zone.hot{border-color:var(--copper); box-shadow:0 0 0 4px rgba(216,160,90,.10)}
  html[data-theme="light"] .zone.hot{border-color:var(--zone-edge);
    border-top-color:var(--zct,#7048e8); box-shadow:0 10px 30px rgba(76,78,160,.18);
    transform:translateY(-2px)}
  .zone h2{font-size:14px; letter-spacing:.4px; display:flex;
    gap:9px; align-items:center; flex-wrap:wrap}
  .zone h2 .ic{width:38px; height:38px; flex:0 0 auto; border-radius:11px; display:flex;
    align-items:center; justify-content:center; font-size:20px;
    background:var(--chip); border:1px solid var(--zone-edge)}
  html[data-theme="light"] .zone h2 .ic{border:0;
    background:linear-gradient(135deg,var(--zc1,#e5dbff),var(--zc2,#d0bfff));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.6), 0 3px 8px rgba(76,78,160,.14)}
  .zone h2 .ttl{color:var(--copper); font-weight:700}
  html[data-theme="light"] .zone h2 .ttl{color:var(--zct,#5f3dc4)}
  .zone h2 .q{color:var(--ink-faint); font-weight:400; font-size:12px; letter-spacing:0;
    flex-basis:100%}
  .zone .xbadge{display:inline-block; font-size:10.5px; color:#0e1a14; background:var(--copper-dim);
    border-radius:4px; padding:1px 6px; vertical-align:middle; font-weight:600}
  html[data-theme="light"] .zone .xbadge{color:var(--zct,#5f3dc4); background:var(--zc1,#e5dbff)}
  .mods{display:flex; flex-wrap:wrap; gap:7px; margin-top:10px}
  .mod{display:inline-flex; align-items:center; gap:6px; background:var(--chip);
    border:1px solid var(--zone-edge); border-radius:7px; padding:4px 9px; font-size:12.5px;
    color:var(--ink); cursor:pointer; transition:.12s; font-family:Consolas,ui-monospace,monospace}
  .mod:hover{border-color:var(--copper); color:#fff; transform:translateY(-1px)}
  html[data-theme="light"] .mod:hover{border-color:var(--zct,#7048e8); color:var(--ink);
    background:#fff; box-shadow:0 3px 8px rgba(76,78,160,.12)}
  .mod.pinned{border-color:var(--accent); box-shadow:0 0 0 2px rgba(99,214,164,.25)}
  html[data-theme="light"] .mod.pinned{border-color:var(--trace-hot);
    box-shadow:0 0 0 2px rgba(230,73,128,.2)}
  .mod.dim{opacity:.22; filter:saturate(.3)}
  .mod .led{width:7px; height:7px; border-radius:50%; flex:0 0 auto}
  .led.ok{background:var(--ok); box-shadow:0 0 5px var(--ok)}
  .led.dev{background:var(--dev); box-shadow:0 0 5px var(--dev)}
  .led.plan{background:var(--plan)}
  html[data-theme="light"] .led.ok, html[data-theme="light"] .led.dev{box-shadow:none}
  .mod .lock{font-size:10px; color:var(--priv)}
  .zone[data-area="runtime"]{grid-area:runtime}
  .zone[data-area="connectors"]{grid-area:connectors}
  .zone[data-area="orchestration"]{grid-area:orchestration}
  .zone[data-area="control"]{grid-area:control}
  .zone[data-area="tools"]{grid-area:tools}
  .zone[data-area="memory"]{grid-area:memory}
  .zone[data-area="knowledge"]{grid-area:knowledge}
  .zone[data-area="sync"]{grid-area:sync}
  .zone[data-area="domains"]{grid-area:domains}
  .zone[data-area="quality"]{grid-area:quality}
  .zone[data-area="meta"]{grid-area:meta}

  /* Außenwelt-Pins an der Connectors-Zone */
  .pins{margin-top:10px; border-top:1px dashed var(--zone-edge); padding-top:8px;
    font-size:11.5px; color:var(--ink-faint)}
  .pins b{color:var(--copper-dim); font-weight:600}
  html[data-theme="light"] .pins b{color:var(--zct,#1971c2)}

  /* ---------- Panel ---------- */
  #panel{flex:0 0 340px; max-width:340px; border-left:1px solid var(--zone-edge);
    background:var(--panel); padding:18px; position:sticky; top:0; align-self:flex-start;
    max-height:100vh; overflow:auto}
  #panel .hint{color:var(--ink-faint); font-size:13px}
  #panel h3{color:var(--copper); font-size:16px; margin-bottom:2px; overflow-wrap:anywhere}
  #panel .meta{font-size:12px; color:var(--ink-dim); margin-bottom:10px; display:flex;
    flex-wrap:wrap; gap:6px}
  #panel .meta span{border:1px solid var(--panel-edge); border-radius:5px; padding:1px 7px;
    background:var(--surface)}
  #panel .desc{font-size:13.5px; color:var(--ink); margin-bottom:12px}
  #panel .prov{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px}
  #panel .prov code{font-size:11px; background:var(--chip); border:1px solid var(--panel-edge);
    border-radius:4px; padding:1px 6px; color:var(--ink-dim)}
  #panel .edges{margin-top:8px}
  #panel .edges h4{font-size:12px; color:var(--ink-dim); text-transform:uppercase;
    letter-spacing:.8px; margin-bottom:6px}
  #panel .edges li{list-style:none; font-size:13px; margin-bottom:9px; padding-left:12px;
    border-left:2px solid var(--trace)}
  #panel .edges li b{color:var(--trace-hot); font-weight:600}
  #panel .repo{display:inline-block; margin-top:4px; font-size:13px; word-break:break-all}
  #panel .pinnote{margin-top:14px; font-size:11.5px; color:var(--ink-faint)}

  /* ---------- Schichten & Fuß ---------- */
  #layers{padding:26px; border-top:1px solid var(--zone-edge); background:var(--surface)}
  #layers h2{font-size:15px; color:var(--copper); margin-bottom:4px}
  #layers .lsub{color:var(--ink-faint); font-size:13px; margin-bottom:14px}
  .stack{display:flex; flex-wrap:wrap; gap:8px; align-items:stretch}
  .layer{flex:1 1 150px; min-width:150px; background:var(--zone); border:1px solid var(--zone-edge);
    border-radius:9px; padding:9px 11px; cursor:default; transition:.12s}
  html[data-theme="light"] .layer{background:var(--bg)}
  .layer:hover{border-color:var(--copper)}
  .layer b{display:block; font-size:13px; color:var(--ink)}
  .layer i{font-style:normal; font-size:11.5px; color:var(--ink-faint)}
  .layer .arr{float:right; color:var(--copper-dim)}
  .layer.hl{border-color:var(--copper); box-shadow:0 0 0 3px rgba(216,160,90,.08)}
  html[data-theme="light"] .layer.hl{border-color:var(--copper-dim);
    background:linear-gradient(135deg,#edf2ff,#f3f0ff); box-shadow:0 0 0 3px rgba(112,72,232,.08)}
  #layerinfo{margin-top:12px; font-size:13px; color:var(--ink-dim); min-height:2.6em; max-width:100ch}

  footer{padding:16px 26px 30px; color:var(--ink-faint); font-size:12px;
    border-top:1px solid var(--zone-edge); display:flex; flex-wrap:wrap; gap:18px;
    align-items:center; background:var(--surface)}
  .leg{display:flex; gap:14px; flex-wrap:wrap; align-items:center}
  .leg span{display:inline-flex; align-items:center; gap:5px}

  @media (max-width:1100px){
    main{flex-direction:column}
    #panel{position:static; max-width:none; flex:auto; border-left:0;
      border-top:1px solid var(--zone-edge); max-height:none}
  }
  @media (max-width:860px){
    #board{grid-template-columns:1fr;
      grid-template-areas:"runtime" "connectors" "orchestration" "control" "tools"
        "memory" "knowledge" "sync" "domains" "quality" "meta"}
    .controls input[type=search]{width:150px}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>ellmos<span class="dot">-</span>ai <span style="font-weight:400;color:var(--ink-dim)">·</span> <span id="t-title">Der Schaltplan</span></h1>
    <p class="sub" id="t-sub"></p>
    <nav class="pagenav">
      <a href="index.html" class="on">⌁ Circuit Map</a>
      <a href="bundles.html">▦ Bundle Recipes</a>

      <button id="lang-de">DE</button><button id="lang-en" class="on">EN</button>

</header>

<main>
  <div id="boardwrap">
    <div id="board"></div>
    <svg id="wires">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--trace)"></path>
        </marker>
        <marker id="arrhot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--trace-hot)"></path>
        </marker>
      </defs>
      <g id="wiregroup"></g>
    </svg>
  </div>
  <aside id="panel"><p class="hint" id="panelhint"></p><div id="panelbody"></div></aside>
</main>

<section id="layers">
  <h2 id="t-layers-h"></h2>
  <p class="lsub" id="t-layers-sub"></p>
  <div class="stack" id="stack"></div>
  <div id="layerinfo"></div>
</section>

<footer>
  <div class="leg">
    <span><span class="led ok" style="display:inline-block"></span> <span id="t-leg-ok"></span></span>
    <span><span class="led dev" style="display:inline-block"></span> <span id="t-leg-dev"></span></span>
    <span><span class="led plan" style="display:inline-block"></span> <span id="t-leg-plan"></span></span>
    <span><span class="lock" style="color:var(--priv)">🔒</span> <span id="t-leg-priv"></span></span>
  </div>
  <div id="t-source" style="margin-left:auto"></div>
</footer>

"use strict";

/* ================= Bereichs-Icons + helle Farbwelten ================= */
const SKIN = {

const UI = {

  d:{de:"Vorgedachte Funktionseinheiten zwischen Modul und Stack: Rezepte aus Seed + Komponentenliste, gegliedert in die Säulen Gedächtnis, Steuerung, Nutzer-Assistenz und Fachlichkeit.",
     en:"Pre-designed functional units between module and stack: recipes of seed + component list, organized into the pillars memory, control, user assistance and domain."}},
 {id:"stacks", n:{de:"Stacks", en:"Stacks"}, s:{de:"betreibbare Kompositionen", en:"operable compositions"},
  d:{de:"Manifest-getriebene Kompositionen aus Modulen, Skills, MCP-Servern und Software — vom fokussierten Bundle-Stack bis zum vollen, betreibbaren System.",
     en:"Manifest-driven compositions of modules, skills, MCP servers and software — from a focused bundle stack to a full, operable system."}},
 {id:"os", n:{de:"OS-Stacks", en:"OS Stacks"}, s:{de:"BACH · rinnsal", en:"BACH · rinnsal"},
  d:{de:"Besondere Stacks in Betriebssystem-Größe: breite, zweckoffene Allrounder, die Module als Abhängigkeit konsumieren statt alles selbst zu bauen.",
     en:"Special stacks at operating-system scale: broad, open-purpose all-rounders that consume modules as dependencies instead of building everything themselves."}}
];

/* ================= STATE + RENDER ================= */
let lang = "en";
let pinned = null;   // {type:"area"|"module", id}
let hovered = null;

const $ = s => document.querySelector(s);
const areaById = id => AREAS.find(a=>a.id===id);
const edgesOf = id => EDGES.filter(e=>e.from===id||e.to===id);

function statusClass(m){ return m.st==="ok"?"ok":(m.st==="plan"?"plan":"dev"); }

function buildBoard(){
  const board = $("#board");
  board.innerHTML = "";
  for(const a of AREAS){
    const z = document.createElement("div");
    z.className = "zone"; z.dataset.area = a.id;
    const S = SKIN[a.id];
    z.style.setProperty("--zc1", S.c1); z.style.setProperty("--zc2", S.c2);
    z.style.setProperty("--zct", S.t);
    const cross = a.cross ? ` <span class="xbadge">⟡ ${UI[lang].crossnote}</span>` : "";
    let html = `<h2><span class="ic">${S.i}</span><span class="ttl">${a.dir} · ${a.name[lang]}</span>${cross}<span class="q">„${a.q[lang]}“</span></h2><div class="mods">`;
    for(const m of MODULES.filter(m=>m.area===a.id)){
      const lock = (m.vis==="priv") ? `<span class="lock">🔒</span>` : "";
      html += `<button class="mod" data-mod="${m.id}"><span class="led ${statusClass(m)}"></span>${m.id}${lock}</button>`;
    }
    html += `</div>`;
    if(!MODULES.some(m=>m.area===a.id)){
      html += `<div class="pins">${lang==="de"
        ? "Die Module dieser Familie sind noch in privater Entwicklung."
        : "The modules of this family are still in private development."}</div>`;
    }
    if(a.id==="connectors"){
      html += `<div class="pins">⇥ <b>${UI[lang].world}:</b> ${UI[lang].worldpins}</div>`;
    }
    z.innerHTML = html;
    board.appendChild(z);
  }
}

/* --- Leiterbahnen --- */
function anchor(rect, other, wrap){
  const cx=(rect.left+rect.right)/2, cy=(rect.top+rect.bottom)/2;
  const ox=(other.left+other.right)/2, oy=(other.top+other.bottom)/2;
  const dx=ox-cx, dy=oy-cy;
  let x,y;
  if(Math.abs(dx)*(rect.height/rect.width) > Math.abs(dy)){
    x = dx>0 ? rect.right : rect.left; y = cy + dy*0.15;
  } else {
    y = dy>0 ? rect.bottom : rect.top; x = cx + dx*0.15;
  }
  return {x:x-wrap.left, y:y-wrap.top};
}
function drawWires(){
  const wrap = $("#boardwrap").getBoundingClientRect();
  const g = $("#wiregroup"); g.innerHTML = "";
  document.querySelectorAll(".wlabel").forEach(e=>e.remove());
  const svg = $("#wires");
  svg.setAttribute("width", wrap.width); svg.setAttribute("height", wrap.height);
  EDGES.forEach((e,i)=>{
    const zf = document.querySelector(`.zone[data-area="${e.from}"]`);
    const zt = document.querySelector(`.zone[data-area="${e.to}"]`);
    if(!zf||!zt) return;
    const rf = zf.getBoundingClientRect(), rt = zt.getBoundingClientRect();
    const p1 = anchor(rf, rt, wrap), p2 = anchor(rt, rf, wrap);
    const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    const nx=-(p2.y-p1.y), ny=(p2.x-p1.x);
    const nl=Math.hypot(nx,ny)||1;
    const bend = 18 * (i%2===0?1:-1);
    const cx=mx+nx/nl*bend, cy=my+ny/nl*bend;
    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",`M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}`);
    path.setAttribute("fill","none");
    path.setAttribute("stroke","var(--trace)");
    path.setAttribute("stroke-width","2");
    path.setAttribute("marker-end","url(#arr)");
    if(e.both) path.setAttribute("marker-start","url(#arr)");
    path.dataset.from=e.from; path.dataset.to=e.to; path.dataset.i=i;
    g.appendChild(path);
    const lab = document.createElement("div");
    lab.className="wlabel"; lab.dataset.i=i;
    lab.textContent = e.label[lang];
    lab.style.left = (mx+nx/nl*bend*0.9)+"px";
    lab.style.top  = (my+ny/nl*bend*0.9)+"px";
    $("#boardwrap").appendChild(lab);
  });
  applyHighlight();
}

function applyHighlight(){
  const act = pinned || hovered;
  const hotArea = act && act.type==="area" ? act.id
    : act && act.type==="module" ? MODULES.find(m=>m.id===act.id).area : null;
  document.querySelectorAll(".zone").forEach(z=>{
    z.classList.toggle("hot", z.dataset.area===hotArea);
  });
  document.querySelectorAll("#wiregroup path").forEach(p=>{
    const hot = hotArea && (p.dataset.from===hotArea || p.dataset.to===hotArea);
    p.setAttribute("stroke", hot?"var(--trace-hot)":"var(--trace)");
    p.setAttribute("stroke-width", hot?"2.6":"2");
    p.setAttribute("marker-end", hot?"url(#arrhot)":"url(#arr)");
    if(p.getAttribute("marker-start")) p.setAttribute("marker-start", hot?"url(#arrhot)":"url(#arr)");
  });
  document.querySelectorAll(".wlabel").forEach(l=>{
    const e = EDGES[+l.dataset.i];
    l.classList.toggle("hot", !!(hotArea && (e.from===hotArea||e.to===hotArea)));
  });
  document.querySelectorAll(".mod").forEach(b=>{
    b.classList.toggle("pinned", !!(pinned && pinned.type==="module" && b.dataset.mod===pinned.id));
  });
}

/* --- Panel --- */
function showPanel(){
  const act = pinned || hovered;
  const hint = $("#panelhint"), body = $("#panelbody");
  if(!act){ hint.style.display="block"; body.innerHTML=""; return; }
  hint.style.display="none";
  const T = UI[lang];
  if(act.type==="area"){
    const a = areaById(act.id);
    let html = `<h3>${a.dir} · ${a.name[lang]}</h3>
      <div class="meta"><span>„${a.q[lang]}“</span></div>
      <p class="desc">${a.desc[lang]}</p>
      <div class="edges"><h4>${T.edgesOut}</h4><ul>`;
    const es = edgesOf(a.id);
    if(es.length===0 && a.cross){
      html += `<li><b>⟡</b> ${a.desc[lang]}</li>`;
    }
    for(const e of es){
      const other = e.from===a.id ? areaById(e.to) : areaById(e.from);
      const dir = e.both ? "↔" : (e.from===a.id ? "→" : "←");
      html += `<li><b>${dir} ${other.name[lang]}</b><br>${e.desc[lang]}</li>`;
    }
    html += `</ul></div>`;
    if(pinned) html += `<p class="pinnote">📌 ${T.pinnote}</p>`;
    body.innerHTML = html;
  } else {
    const m = MODULES.find(x=>x.id===act.id);
    const a = areaById(m.area);
    const st = T.status[m.st==="ok"?"ok":(m.st==="plan"?"plan":"dev")];
    const vis = m.vis==="pub"?T.vis.public:(m.vis==="cand"?T.vis.cand:T.vis.priv);
    let html = `<h3>${m.id}</h3>
      <div class="meta">
        <span>${T.area}: ${a.name[lang]}</span>
        <span>● ${st}</span>
        <span>${m.vis==="priv"?"🔒 ":""}${vis}</span>
      </div>
      <p class="desc">${m.d[lang]}</p>`;
    if(m.prov.length){
      html += `<div class="prov">${m.prov.map(p=>`<code>${p}</code>`).join("")}</div>`;
    }
    if(m.repo && m.vis!=="priv"){
      html += `<a class="repo" href="${m.repo.replace(/\.git$/,"")}" target="_blank" rel="noopener">↗ ${T.repo}</a>`;
    }
    if(pinned) html += `<p class="pinnote">📌 ${T.pinnote}</p>`;
    body.innerHTML = html;
  }
}

/* --- Filter --- */
function applyFilter(){
  const q = $("#q").value.trim().toLowerCase();
  const pubOnly = false;
  document.querySelectorAll(".mod").forEach(b=>{
    const m = MODULES.find(x=>x.id===b.dataset.mod);
    const txt = (m.id+" "+m.prov.join(" ")+" "+m.d.de+" "+m.d.en).toLowerCase();
    const hitQ = !q || txt.includes(q);
    const hitP = !pubOnly || m.vis==="pub" || m.vis==="cand";
    b.classList.toggle("dim", !(hitQ&&hitP));
  });
}

/* --- Schichten --- */
function buildLayers(){
  const st = $("#stack"); st.innerHTML="";
  LAYERS.forEach((l,i)=>{
    const d = document.createElement("div");
    d.className="layer"+(l.id==="modules"?" hl":"");
    d.innerHTML = `<b>${l.n[lang]}${i<LAYERS.length-1?'<span class="arr">→</span>':''}</b><i>${l.s[lang]}</i>`;
    d.addEventListener("mouseenter",()=>{ $("#layerinfo").textContent = l.d[lang]; });
    st.appendChild(d);
  });
  $("#layerinfo").textContent = LAYERS[2].d[lang];
}

/* --- UI-Texte --- */
function applyUiTexts(){
  const T = UI[lang];
  $("#t-title").textContent=T.title; $("#t-sub").textContent=T.sub;
  $("#q").placeholder=T.search;
  $("#panelhint").textContent=T.hint;
  $("#t-layers-h").textContent=T.layersH; $("#t-layers-sub").textContent=T.layersSub;
  $("#t-leg-ok").textContent=T.legOk; $("#t-leg-dev").textContent=T.legDev;
  $("#t-leg-plan").textContent=T.legPlan; $("#t-leg-priv").textContent=T.legPriv;
  $("#t-source").textContent=T.source;
  document.documentElement.lang = lang;
  $("#lang-de").classList.toggle("on",lang==="de");
  $("#lang-en").classList.toggle("on",lang==="en");
}

/* --- Events --- */
function wireEvents(){
  const board = $("#board");
  board.addEventListener("mouseover", ev=>{
    const mod = ev.target.closest(".mod");
    const zone = ev.target.closest(".zone");
    if(mod){ hovered={type:"module",id:mod.dataset.mod}; }
    else if(zone){ hovered={type:"area",id:zone.dataset.area}; }
    applyHighlight(); showPanel();
  });
  board.addEventListener("mouseleave", ()=>{ hovered=null; applyHighlight(); showPanel(); });
  board.addEventListener("click", ev=>{
    const mod = ev.target.closest(".mod");
    const zone = ev.target.closest(".zone");
    let next=null;
    if(mod) next={type:"module",id:mod.dataset.mod};
    else if(zone) next={type:"area",id:zone.dataset.area};
    if(next && pinned && pinned.type===next.type && pinned.id===next.id) pinned=null;
    else pinned=next;
    applyHighlight(); showPanel();
  });
  $("#q").addEventListener("input", applyFilter);
  $("#lang-de").addEventListener("click", ()=>setLang("de"));
  $("#lang-en").addEventListener("click", ()=>setLang("en"));
  window.addEventListener("resize", ()=>requestAnimationFrame(drawWires));
}

function setLang(l){
  lang=l; applyUiTexts(); buildBoard(); buildLayers();
  applyFilter(); requestAnimationFrame(drawWires); showPanel();
}

/* --- Init --- */
applyUiTexts(); buildBoard(); buildLayers(); wireEvents();
requestAnimationFrame(drawWires); showPanel();
setTimeout(drawWires, 300);  /* Fonts/Layout nachziehen */

/* --- Theme-Umschalter (dunkel = Default) --- */
const THEME_KEY = "ellmos-theme";
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  const b = document.getElementById("themebtn");
  if(b) b.textContent = (t === "light" ? "🌙" : "☀️");
}
let savedTheme = "dark";
try{ if(localStorage.getItem(THEME_KEY) === "light") savedTheme = "light"; }catch(e){}
applyTheme(savedTheme);
document.getElementById("themebtn").addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  applyTheme(t);
});

</script>
