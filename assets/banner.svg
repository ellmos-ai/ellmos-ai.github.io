<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: -1.5px;
      }
      .subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: -0.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .pill-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 11.5px;
        letter-spacing: 0.5px;
      }
      .mono-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
      }
    </style>
    
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060814"/>
      <stop offset="50%" stop-color="#0e1330"/>
      <stop offset="100%" stop-color="#04050d"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow-mesh" cx="300" cy="170" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#060814" stop-opacity="0"/>
    </radialGradient>
    
  </defs>
  
  
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.2"/>
    <circle cx="300" cy="170" r="260" fill="url(#glow-mesh)"/>
    
    <!-- Planetary Constellation / Ecosystem Map -->
    <g transform="translate(160, 60)">
      <!-- Orbit rings -->
      <ellipse cx="120" cy="110" rx="100" ry="60" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4" transform="rotate(-15 120 110)"/>
      <ellipse cx="120" cy="110" rx="70" ry="40" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" transform="rotate(25 120 110)"/>
      
      <!-- Central Hub -->
      <circle cx="120" cy="110" r="28" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2.5"/>
      <circle cx="120" cy="110" r="16" fill="#4f46e5" opacity="0.6"/>
      <circle cx="120" cy="110" r="6" fill="#ffffff"/>
      
      <!-- Orbiting Nodes -->
      <circle cx="40" cy="70" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="200" cy="90" r="12" fill="#7c3aed" stroke="#c084fc" stroke-width="2"/>
      <circle cx="90" cy="160" r="9" fill="#059669" stroke="#34d399" stroke-width="2"/>
      <circle cx="170" cy="150" r="11" fill="#ea580c" stroke="#fb923c" stroke-width="2"/>
    </g>
    
  
    <g transform="translate(480, 0)">
      <g transform="translate(0, 58)">
        <rect width="190" height="26" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
        <text x="95" y="17" text-anchor="middle" class="badge-text" fill="#c7d2fe">INTERACTIVE MAPS</text>
      </g>
      
      <text x="0" y="142" class="title" font-size="52" fill="url(#title-grad)">ellmos-ai.github.io</text>
      
      <text x="0" y="184" class="subtitle" font-size="20" fill="#e0e7ff">Interactive Architecture &amp; Ecosystem Exploration Maps</text>
      <text x="0" y="210" class="subtitle" font-size="14" fill="#94a3b8" opacity="0.8">Live dashboard, dependency graphs, and visual map index for ellmos-ai projects.</text>
      
      <g transform="translate(0, 246)">
        <g transform="translate(0, 0)">
          <rect width="140" height="32" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
          <text x="70" y="20" text-anchor="middle" class="pill-text" fill="#c7d2fe">🗺️ Ecosystem Maps</text>
        </g>
        <g transform="translate(152, 0)">
          <rect width="140" height="32" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
          <text x="70" y="20" text-anchor="middle" class="pill-text" fill="#c7d2fe">🌐 Live Dashboard</text>
        </g>
        <g transform="translate(304, 0)">
          <rect width="140" height="32" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
          <text x="70" y="20" text-anchor="middle" class="pill-text" fill="#c7d2fe">🔍 Visual Graphs</text>
        </g>
      </g>
    </g>
    
</svg>