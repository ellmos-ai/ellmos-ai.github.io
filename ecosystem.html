ctions, carriers, actual use, and architecture drift.", "url": "https://github.com/ellmos-ai/system-explorer"}, {"name": "system-gap-master", "group": "modules", "category": "control", "archived": false, "description": "Serverless sync yard for multi-machine, multi-agent AI setups — slot rule, gated daily ritual, bootstrap runbook. Family: lock-master, ticket-master.", "url": "https://github.com/ellmos-ai/system-gap-master"}, {"name": "ticket-master", "group": "modules", "category": "control", "archived": false, "description": "Cross-platform multi-provider LLM ticket router & AI coding agent triage console. Files structured tickets, scores, and routes to Claude Code, Codex, and Gemini.", "url": "https://github.com/ellmos-ai/ticket-master"}, {"name": "usmc", "group": "modules", "category": "memory", "archived": false, "description": "Local SQLite memory for LLM agents and cross-agent context sharing", "url": "https://github.com/ellmos-ai/usmc"}, {"name": "VisionFlow", "group": "apps", "category": "apps", "archived": false, "description": "Configurable OpenCV 5 image, video and camera workflows with evidence clips, bounded follow-up observation and human review.", "url": "https://github.com/ellmos-ai/VisionFlow"}, {"name": "web-scraper", "group": "modules", "category": "tools", "archived": false, "description": "Standalone web scraper (get/links/forms/headers/extract/screenshot), extracted from the BACH system. Python stdlib core + optional extras, with SSRF guard.", "url": "https://github.com/ellmos-ai/web-scraper"}, {"name": "workflowhooker", "group": "modules", "category": "control", "archived": false, "description": "Small, configurable workflow checks at coding-agent lifecycle events. Local-first, zero runtime dependencies, no network requests, silent until checks are explicitly enabled.", "url": "https://github.com/ellmos-ai/workflowhooker"}, {"name": "worksheet-generator", "group": "modules", "category": "domains", "archived": false, "description": "Individual const UI={
  de:{
    title:"Ökosystem & öffentliche Repositories",
    sub:"Gesamtschaltplan des öffentlichen ellmos-ai Ökosystems: alle 11 Architekturbereiche vom OS-Stack (BACH, rinnsal, Open Ocean) über Module, MCP-Server, Skills, Bundles und Stacks bis zum AI-Lab.",
    search:"Repository suchen …",
    pilH:"Die 11 Architekturbereiche des KI-Baukastens",
    pilSub:"Jede Schicht erfüllt genau eine Aufgabe und greift über dokumentierte Verträge in die anderen — ohne Code-Kopien und ohne Cloud-Zwang.",
    repH:"Öffentliches GitHub-Repository-Verzeichnis ("+String(REPOS.length)+" Repositories)",
    repSub:"Alle veröffentlichten Repositories unter github.com/ellmos-ai, filterbar nach Rolle im Gesamtsystem.",
    openMap:"Öffnen →", openRepo:"GitHub ↗",
    shown:(a,b)=>a+" von "+b+" angezeigt",
    groups:{all:"Alle",os:"OS & Kern",mcp:"MCP-Server",modules:"Module",pillars:"Skills · Bundles · Stacks · Plugins",apps:"Domänen & Apps"},
    source:"ellmos-ai · öffentlicher Gesamtauszug: 11 Architekturbereiche · "+String(REPOS.length)+" öffentliche GitHub-Repos · Stand 2026-11-24"
  },
  en:{
    title:"Ecosystem & Public Repositories",
    sub:"Master overview of the public ellmos-ai ecosystem: all 11 architectural pillars from OS stacks (BACH, rinnsal, Open Ocean) through modules, MCP servers, skills, bundles and stacks to AI-Lab.",
    search:"Search repositories …",
    pilH:"The 11 Architectural Pillars of the AI Kit",
    pilSub:"Every layer owns one clear responsibility and connects through documented contracts — zero code copies, zero forced cloud.",
    repH:"Public GitHub Repository Directory ("+String(REPOS.length)+" repositories)",
    repSub:"Every public repository published under github.com/ellmos-ai, filterable by role in the ecosystem.",
    openMap:"Open →", openRepo:"GitHub ↗",
    shown:(a,b)=>a+" of "+b+" shown",
    groups:{all:"All",os:"OS & Core",mcp:"MCP Servers",modules:"Modules",pillars:"Skills · Bundles · Stacks · Plugins",apps:"Domains & Apps"},
    source:"ellmos-ai · public ecosystem excerpt: 11 architectural pillars · "+String(REPOS.length)+" public GitHub repos · as of 2026-11-24"
  }
};
let lang="en", grp="all";
const $=s=>document.querySelector(s);
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
function render(){
  const T=UI[lang];
  $("#t-title").textContent=T.title; $("#t-sub").textContent=T.sub; $("#q").placeholder=T.search;
  $("#t-pil-h").textContent=T.pilH; $("#t-pil-sub").textContent=T.pilSub;
  $("#t-rep-h").textContent=T.repH; $("#t-rep-sub").textContent=T.repSub;
  $("#t-source").textContent=T.source;
  $("#lang-de").classList.toggle("on",lang==="de");
  $("#lang-en").classList.toggle("on",lang==="en");
  document.documentElement.lang=lang;

  const pgrid=$("#pillars"); pgrid.replaceChildren();
  for(const p of PILLARS){
    const c=el("div","card"), top=el("div"), hd=el("div","chead");
    hd.appendChild(el("span","cname",p.id));
    hd.appendChild(el("span","cbadge",lang==="de"?p.count_de:p.count_en));
    top.appendChild(hd);
    top.appendChild(el("p","cdesc",lang==="de"?p.de:p.en));
    const ft=el("div","cfoot");
    ft.appendChild(el("span","","ellmos-ai"));
    const a=el("a","",T.openMap); a.href=p.link;
    if(p.link.startsWith("https://")){a.target="_blank";a.rel="noopener noreferrer";}
    ft.appendChild(a);
    c.appendChild(top); c.appendChild(ft); pgrid.appendChild(c);
  }

  const fbar=$("#fbar"); fbar.replaceChildren();
  for(const k of ["all","os","mcp","modules","pillars","apps"]){
    const cnt=k==="all"?REPOS.length:REPOS.filter(r=>r.group===k).length;
    const b=el("button","fpill"+(grp===k?" on":""),T.groups[k]+" ("+cnt+")");
    b.type="button"; b.dataset.grp=k;
    b.addEventListener("click",()=>{grp=k;render();});
    fbar.appendChild(b);
  }
  const shownEl=el("span","shown",""); shownEl.id="shown-cnt"; fbar.appendChild(shownEl);
  renderRepos();
}
function renderRepos(){
  const T=UI[lang], q=$("#q").value.trim().toLowerCase();
  const list=REPOS.filter(r=>(grp==="all"||r.group===grp)&&(!q||(r.name+" "+r.description+" "+r.category).toLowerCase().includes(q)));
  const rgrid=$("#repos"); rgrid.replaceChildren();
  for(const r of list){
    const c=el("div","card"), top=el("div"), hd=el("div","chead");
    hd.appendChild(el("span","cname",r.name));
    hd.appendChild(el("span","cbadge",r.archived?"archived":r.category));
    top.appendChild(hd);
    top.appendChild(el("p","cdesc",r.description));
    const ft=el("div","cfoot");
    ft.appendChild(el("span","","ellmos-ai/"+r.name));
    const a=el("a","",T.openRepo); a.href=r.url; a.target="_blank"; a.rel="noopener noreferrer";
    ft.appendChild(a);
    c.appendChild(top); c.appendChild(ft); rgrid.appendChild(c);
  }
  const sc=$("#shown-cnt"); if(sc) sc.textContent=T.shown(list.length,REPOS.length);
}
$("#q").addEventListener("input",renderRepos);
$("#lang-de").addEventListener("click",()=>{lang="de";render();});
$("#lang-en").addEventListener("click",()=>{lang="en";render();});
const THEME_KEY="ellmos-theme";
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  const b=document.getElementById("themebtn");
  if(b) b.textContent=(t==="light"?"🌙":"☀️");
}
let savedTheme="dark";
try{ if(localStorage.getItem(THEME_KEY)==="light") savedTheme="light"; }catch(e){}
applyTheme(savedTheme);
document.getElementById("themebtn").addEventListener("click",()=>{
  const t=document.documentElement.dataset.theme==="light"?"dark":"light";
  try{ localStorage.setItem(THEME_KEY,t); }catch(e){}
  applyTheme(t);
});
render();
</script>
