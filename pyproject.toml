[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-ai-github-io"
version = "0.1.3"
description = "Interactive public site maps and public component explorer for the ellmos ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
authors = [{ name = "Lukas Geiger" }]
keywords = [
    "agentic-workflows",
    "ai-agents",
    "bundles",
    "circuit-diagram",
    "developer-tools",
    "documentation",
    "ecosystem",
    "ellmos",
    "interactive-map",
    "local-first",
    "mcp",
    "mcp-servers",
    "open-bricks",
    "public-catalog",
    "python",
    "skill-library",
    "skills",
    "stack-composer",
    "static-site",
    "zero-egress",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://ellmos-ai.github.io"
Documentation = "https://github.com/ellmos-ai/ellmos-ai.github.io#readme"
Repository = "https://github.com/ellmos-ai/ellmos-ai.github.io"
Issues = "https://github.com/ellmos-ai/ellmos-ai.github.io/issues"
"Bug Tracker" = "https://github.com/ellmos-ai/ellmos-ai.github.io/issues"
Contributing = "https://github.com/ellmos-ai/ellmos-ai.github.io/blob/main/CONTRIBUTING.md"
Changelog = "https://github.com/ellmos-ai/ellmos-ai.github.io/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/ellmos-ai.github.io/blob/main/SECURITY.md"
Notice = "https://github.com/ellmos-ai/ellmos-ai.github.io/blob/main/NOTICE"
"Plain-Text License" = "https://github.com/ellmos-ai/ellmos-ai.github.io/blob/main/LICENSE"
"Level 1 SBOM" = "https://github.com/ellmos-ai/ellmos-ai.github.io/blob/main/THIRD_PARTY_LICENSES.md"
"Level 1 SBOM (Text)" = "https://github.com/ellmos-ai/ellmos-ai.github.io/blob/main/THIRD_PARTY_LICENSES.txt"
"Third-Party Licenses" = "https://github.com/ellmos-ai/ellmos-ai.github.io/blob/main/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/ellmos-ai/ellmos-ai.github.io/blob/main/THIRD_PARTY_LICENSES.txt"
"Marketing Log" = "https://github.com/ellmos-ai/ellmos-ai.github.io/blob/main/MARKETING-LOG.txt"
"LLM Context" = "https://github.com/ellmos-ai/ellmos-ai.github.io/blob/main/llms.txt"
"LLM Ready" = "https://ellmos-ai.github.io/llms.txt"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -v --basetemp=.pytest_temp"
norecursedirs = [".git", ".pytest_cache", ".pytest_temp", ".ruff_cache", "__pycache__", "build", "dist", ".venv", ".tox", ".turbo", ".nyc_output", ".hypothesis"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "C4"]
ignore = ["E501"]
