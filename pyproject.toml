[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-ai-github-io"
version = "0.1.0"
description = "Interactive public site maps and public component explorer for the ellmos ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lukas Geiger" }]
keywords = ["ellmos", "interactive-map", "skills", "bundles", "stack-composer", "static-site"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://ellmos-ai.github.io"
Documentation = "https://github.com/ellmos-ai/ellmos-ai.github.io#readme"
Repository = "https://github.com/ellmos-ai/ellmos-ai.github.io"
Issues = "https://github.com/ellmos-ai/ellmos-ai.github.io/issues"
Changelog = "https://github.com/ellmos-ai/ellmos-ai.github.io/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/ellmos-ai.github.io/blob/main/SECURITY.md"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
